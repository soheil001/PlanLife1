        "هدف": "هدفی که نوشته نشود فقط یک آرزوست. اهدافت را با جزئیات دقیق روی کاغذ بیاور تا مسیر روشن شود.",

        "ایمان": "ایمان یعنی دیدن نادیدنی‌ها و باور داشتن به قدرت بی‌پایان جهان، حتی وقتی هنوز نشانه‌ای نیست.",
        "عشق": "عشق قوی‌ترین نیروی جهان است. هر جا عشق جاری باشد، ترس و محدودیت راهی برای ورود ندارند.",
        "ماورای ذهن": "جایی است که تو از محدودیت‌های مادی عبور می‌کنی و با قدرت بی‌پایان خالق برای خلق زندگی‌ات یکی می‌شوی.",
        "باور": "باورها فیلترهای ذهن تو هستند. اگر باورهای محدودکننده را عوض کنی، تمام دنیای بیرون تو تغییر می‌کند."
    };

    function send() {
        const input = document.getElementById('userInput');
        const box = document.getElementById('chat');
        const text = input.value.trim();

        if (text === "") return;

        // نمایش پیام کاربر در چت
        box.innerHTML += `<div class="msg u">${text}</div>`;
        input.value = "";

        let reply = "این پیام فرکانس جالبی داشت. در ماورای ذهن، پاسخ در درون توست. روی باورهات تمرکز کن. ✨";
        
        // جستجوی هوشمند در بانک ۳۰ سوالی
        for (let key in knowledgeBase) {
            if (text.includes(key)) {
                reply = knowledgeBase[key];
                break; 
            }
        }

        // نمایش پاسخ با تاخیر ۱ ثانیه‌ای برای حس واقعی بودن
        setTimeout(() => {
            box.innerHTML += `<div class="msg a">${reply}</div>`;
            box.scrollTop = box.scrollHeight;
        }, 1000);
        
        box.scrollTop = box.scrollHeight;
    }
</script>
