<!-- Chat UI Start -->
<div id="chat-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000; font-family: 'Tahoma', sans-serif;">
    <!-- Chat Toggle Button -->
    <button onclick="toggleChat()" style="background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 50%; width: 60px; height: 60px; cursor: pointer; box-shadow: 0 8px 32px rgba(0,0,0,0.2); transition: 0.3s;">
        ✨
    </button>

    <!-- Chat Window -->
    <div id="chat-window" style="display: none; width: 320px; height: 450px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; flex-direction: column; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.3); margin-bottom: 15px;">
        <!-- Header -->
        <div style="padding: 15px; background: rgba(255, 255, 255, 0.1); border-bottom: 1px solid rgba(255, 255, 255, 0.1); color: white; text-align: center; font-weight: bold;">
            دستیار هوشمند PlanLife
        </div>
        
        <!-- Messages Area -->
        <div id="chat-messages" style="flex: 1; padding: 15px; overflow-y: auto; color: white; display: flex; flex-direction: column; gap: 10px; font-size: 14px;">
            <div style="background: rgba(255,255,255,0.15); padding: 8px 12px; border-radius: 10px 10px 10px 0; align-self: flex-start;">
                سلام! چطور میتونم در مسیر موفقیت بهت کمک کنم؟
            </div>
        </div>

        <!-- Input Area -->
        <div style="padding: 10px; display: flex; gap: 5px; background: rgba(0,0,0,0.1);">
            <input type="text" id="user-input" placeholder="چیزی بنویس..." style="flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 8px; color: white; outline: none;">
            <button onclick="sendMessage()" style="background: white; border: none; border-radius: 10px; padding: 5px 12px; cursor: pointer; font-weight: bold;">></button>
        </div>
    </div>
</div>

<script>
    function toggleChat() {
        const chatWindow = document.getElementById('chat-window');
        chatWindow.style.display = chatWindow.style.display === 'none' ? 'flex' : 'none';
    }

    function sendMessage() {
        const input = document.getElementById('user-input');
        const messageContainer = document.getElementById('chat-messages');
        
        if (input.value.trim() !== "") {
            // User Message
            const userMsg = document.createElement('div');
            userMsg.style = "background: rgba(255,255,255,0.3); padding: 8px 12px; border-radius: 10px 10px 0 10px; align-self: flex-end; text-align: right;";
            userMsg.innerText = input.value;
            messageContainer.appendChild(userMsg);

            // Fake AI Response (بعداً این بخش را به هوش مصنوعی وصل می‌کنیم)
            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.style = "background: rgba(255,255,255,0.15); padding: 8px 12px; border-radius: 10px 10px 10px 0; align-self: flex-start;";
                aiMsg.innerText = "فکر جالبیه! من دارم یاد میگیرم چطور دقیق‌تر جوابت رو بدم. ✨";
                messageContainer.appendChild(aiMsg);
                messageContainer.scrollTop = messageContainer.scrollHeight;
            }, 1000);

            input.value = "";
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }
    }
</script>
<!-- Chat UI End -->
