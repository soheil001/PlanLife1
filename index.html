<script>
    let brain = {};

    // خواندن فایل متنی database.txt
    async function loadBrain() {
        try {
            // استفاده از عدد تصادفی برای جلوگیری از کش شدن در تبلت و سافاری
            const response = await fetch('database.txt?v=' + Math.random());
            const data = await response.text();
            
            // تبدیل متن به فرمت قابل فهم برای چت‌باکس
            const lines = data.split('\n');
            lines.forEach(line => {
                const parts = line.split('|');
                if (parts.length === 2) {
                    brain[parts[0].trim()] = parts[1].trim();
                }
            });
            console.log("بانک اطلاعاتی txt با موفقیت فعال شد.");
        } catch (error) {
            console.error("خطا در بارگذاری فایل متنی:", error);
        }
    }

    loadBrain();

    function send() {
        const input = document.getElementById('userInput');
        const box = document.getElementById('chat');
        const val = input.value.trim();
        if (!val) return;

        box.innerHTML += `<div class="msg u">${val}</div>`;
        input.value = "";

        let reply = "در ماورای ذهن برای این سوال پاسخی هست... ✨";
        
        // جستجو در کلمات کلیدی که از فایل txt خوانده شده
        for (let key in brain) {
            if (val.includes(key)) {
                reply = brain[key];
                break;
            }
        }

        setTimeout(() => {
            box.innerHTML += `<div class="msg a">${reply}</div>`;
            box.scrollTop = box.scrollHeight;
        }, 500);
    }
</script>
