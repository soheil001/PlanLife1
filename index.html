<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlanLife | Interface</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&family=Montserrat:wght@800&display=swap');

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        
        body { 
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #00c4cc 0%, #7d2ae8 100%);
            overflow-x: hidden;
            padding: 20px 10px;
        }

        /* منوی همبرگری با رنگ هماهنگ */
        .menu-btn {
            position: fixed; top: 20px; right: 20px; z-index: 1001;
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px; border-radius: 15px; cursor: pointer; backdrop-filter: blur(10px);
        }

        .side-menu {
            position: fixed; top: 0; right: -100%; width: 280px; height: 100%;
            background: rgba(60, 40, 160, 0.4); /* غلظت بسیار کم و هماهنگ با بگراند */
            backdrop-filter: blur(40px);
            z-index: 1000; padding: 80px 25px; transition: 0.5s ease;
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            display: flex; flex-direction: column; gap: 15px;
        }

        .side-menu.active { right: 0; }

        .nav-item {
            padding: 15px; background: rgba(255, 255, 255, 0.1); border-radius: 15px;
            color: white; text-align: center; text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2); font-weight: 500;
        }

        /* گوی ماورایی چرخان */
        .magic-orb {
            width: 85px; height: 85px;
            background: radial-gradient(circle at 30% 30%, #fff, #00f2ad, #7d2ae8);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0, 242, 173, 0.5);
            margin-bottom: 20px;
            animation: spinOrb 6s linear infinite;
            border: 2px dashed rgba(255,255,255,0.3);
        }
        @keyframes spinOrb { 
            from { transform: rotate(0deg) translateY(0); }
            50% { transform: rotate(180deg) translateY(-10px); }
            to { transform: rotate(360deg) translateY(0); }
        }

        /* چت باکس عریض و مربعی‌تر */
        .chat-card {
            width: 95%; max-width: 420px; /* افزایش عرض از چپ و راست */
            height: 55vh;
            background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(25px);
            border-radius: 35px; border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex; flex-direction: column; padding: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15); margin-bottom: 40px;
        }

        .brand-name { color: white; font-family: 'Montserrat', sans-serif; font-size: 1.8rem; font-weight: 800; text-align: center; margin-bottom: 10px; }

        #chat-window { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 18px; font-size: 14px; max-width: 80%; }
        .u { align-self: flex-start; background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.15); }
        .a { align-self: flex-end; background: rgba(0, 0, 0, 0.15); color: white; border: 1px solid rgba(255, 255, 255, 0.1); }

        .input-area {
            display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.08);
            padding: 5px 15px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2);
        }
        input { flex: 1; background: transparent; border: none; color: white; padding: 12px 0; outline: none; }

        .gemini-send { background: none; border: none; cursor: pointer; display: flex; align-items: center; }
        .gemini-icon { width: 22px; height: 22px; fill: white; filter: drop-shadow(0 0 5px #00c4cc); }

        /* بخش باکس‌های دوره در پایین */
        .course-container {
            width: 100%; max-width: 420px;
            display: grid; grid-template-columns: 1fr; gap: 20px; padding-bottom: 50px;
        }

        .course-box {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px; text-align: center; color: white;
        }
        .course-img {
            width: 100%; height: 120px; background: rgba(255,255,255,0.05);
            border-radius: 15px; margin-bottom: 10px; object-fit: cover;
        }

        #chat-window::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body>

<div class="menu-btn" onclick="toggleMenu()">
    <div style="width:20px; height:2px; background:white; margin: 4px 0;"></div>
    <div style="width:20px; height:2px; background:white; margin: 4px 0;"></div>
</div>

<div class="side-menu" id="sideMenu">
    <div style="color:white; font-weight:800; text-align:center; margin-bottom:20px;">PlanLife</div>
    <a href="#" class="nav-item">درباره ما</a>
    <a href="#" class="nav-item">پشتیبانی</a>
</div>

<div class="magic-orb"></div>

<div class="chat-card">
    <h1 class="brand-name">PlanLife</h1>
    <div id="chat-window">
        <div class="msg a">فرکانس PlanLife برقرار شد. ✨</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="بپرس..." onkeypress="if(event.keyCode===13)send()">
        <button class="gemini-send" onclick="send()">
            <svg class="gemini-icon" viewBox="0 0 24 24"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"></path></svg>
        </button>
    </div>
</div>

<div class="course-container">
    <div class="course-box">
        <div class="course-img" style="background-image: url('IMAGE_URL_1');"></div>
        <strong>دوره قانون جذب</strong>
        <p style="font-size: 12px; opacity: 0.8;">تغییر مدار ذهنی در ۲۱ روز</p>
    </div>
    <div class="course-box">
        <div class="course-img" style="background-image: url('IMAGE_URL_2');"></div>
        <strong>پاکسازی کوانتومی</strong>
        <p style="font-size: 12px; opacity: 0.8;">رهایی از باورهای محدودکننده</p>
    </div>
    <div class="course-box">
        <div class="course-img" style="background-image: url('IMAGE_URL_3');"></div>
        <strong>فروشگاه فرکانس</strong>
        <p style="font-size: 12px; opacity: 0.8;">محصولات ارتعاشی و سابلیمینال</p>
    </div>
</div>

<script>
    let brain = {};
    function toggleMenu() { document.getElementById('sideMenu').classList.toggle('active'); }
    async function loadBrain() {
        try {
            const r = await fetch('database.txt?v=' + Math.random());
            const d = await r.text();
            d.split('\n').forEach(l => {
                const p = l.split('|');
                if (p.length === 2) brain[p[0].trim()] = p[1].trim();
            });
        } catch (e) {}
    }
    loadBrain();
    function send() {
        const i = document.getElementById('userInput');
        const w = document.getElementById('chat-window');
        const v = i.value.trim();
        if (!v) return;
        w.innerHTML += `<div class="msg u">${v}</div>`;
        i.value = "";
        let r = "";
        for (let k in brain) { if (v.includes(k)) { r = brain[k]; break; } }
        if (!r) r = "در حال پردازش فرکانس... ✨";
        setTimeout(() => {
            w.innerHTML += `<div class="msg a">${r}</div>`;
            w.scrollTop = w.scrollHeight;
        }, 500);
    }
</script>

</body>
</html>
