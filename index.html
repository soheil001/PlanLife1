<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanLife AI | ماورای ذهن</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            display: flex; justify-content: center; align-items: center;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .chat-container {
            width: 95%;
            max-width: 700px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 35px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
        }

        #chat-flow {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        #chat-flow::-webkit-scrollbar { display: none; }

        .bubble {
            max-width: 85%;
            padding: 14px 20px;
            border-radius: 22px;
            font-size: 1rem;
            line-height: 1.7;
            color: white;
            animation: fadeIn 0.4s ease forwards;
            word-wrap: break-word;
        }

        .user-bubble {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.3);
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .ai-bubble {
            align-self: flex-end;
            background: rgba(0, 0, 0, 0.3);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            padding: 18px;
            color: white;
            font-size: 1.05rem;
            resize: none;
            outline: none;
            font-family: inherit;
            transition: 0.3s;
        }

        textarea:focus {
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
        }

        button {
            background: white;
            color: #e73c7e;
            border: none;
            padding: 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(0,0,0,0.15);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div id="chat-flow">
            <div class="bubble ai-bubble">سلام! من دستیار هوشمند PlanLife هستم. آماده‌ام تا با هم فرکانس‌های ذهنی‌ت رو تنظیم کنیم. سوالت رو بپرس... ✨</div>
        </div>
        
        <div class="input-area">
            <textarea id="userInput" placeholder="سوال، هدف یا باور محدودکننده‌ات را اینجا بنویس..."></textarea>
            <button id="sendBtn" onclick="handleChat()">ارسال به ماورای ذهن</button>
        </div>
    </div>

    <script>
        const API_KEY = "AIzaSyCkwqbU9oerrcyEn2wtcIoD_y1O0sp39Zw";

        async function handleChat() {
            const inputField = document.getElementById('userInput');
            const chatFlow = document.getElementById('chat-flow');
            const sendBtn = document.getElementById('sendBtn');
            const text = inputField.value.trim();

            if (text === "") return;

            // نمایش پیام کاربر
            addBubble(text, 'user-bubble');
            inputField.value = "";
            inputField.disabled = true;
            sendBtn.disabled = true;

            // ایجاد حباب لودینگ برای هوش مصنوعی
            const loadingBubble = addBubble("در حال دریافت پاسخ از ماورای ذهن...", 'ai-bubble');

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "تو دستیار هوشمند اختصاصی سایت PlanLife هستی. نام تو 'ماورای ذهن' است. لحن تو باید بسیار مثبت، آرامش‌بخش، انگیزشی و بر اساس مفاهیم موفقیت و قانون جذب باشد. به کاربر کمک کن تا باورهایش را تغییر دهد. حالا پاسخ بده به: " + text }]
                        }]
                    })
                });

                const data = await response.json();
                const aiResponse = data.candidates[0].content.parts[0].text;

                // جایگزینی متن لودینگ با پاسخ واقعی
                loadingBubble.innerText = aiResponse;

            } catch (error) {
                loadingBubble.innerText = "ارتباط با ماورای ذهن برقرار نشد. لطفاً اینترنت خود را چک کنید.";
                console.error(error);
            } finally {
                inputField.disabled = false;
                sendBtn.disabled = false;
                chatFlow.scrollTop = chatFlow.scrollHeight;
                inputField.focus();
            }
        }

        function addBubble(text, className) {
            const chatFlow = document.getElementById('chat-flow');
            const div = document.createElement('div');
            div.className = `bubble ${className}`;
            div.innerText = text;
            chatFlow.appendChild(div);
            chatFlow.scrollTop = chatFlow.scrollHeight;
            return div;
        }

        // ارسال با دکمه Enter
        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleChat();
            }
        });
    </script>
</body>
</html>
