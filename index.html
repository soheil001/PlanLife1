<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlanLife | پلتفرم تحول</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&family=League+Spartan:wght@800&display=swap');

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        
        body { 
            margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(135deg, #00c4cc, #7d2ae8, #00c4cc);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            background-attachment: fixed; overflow-x: hidden; padding: 10px;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* افکت تار شدن بگراند هنگام باز شدن منو */
        body.menu-open .main-container { filter: blur(10px); pointer-events: none; }

        /* تنظیمات منوهای همبرگری */
        .menu-btn {
            position: fixed; top: 25px; z-index: 1001;
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px; border-radius: 12px; cursor: pointer; backdrop-filter: blur(10px);
        }
        .btn-right { right: 20px; } 
        .btn-left { left: 20px; }
        .menu-btn div { width: 22px; height: 2px; background: white; margin: 5px 0; border-radius: 2px; }

        .side-menu {
            position: fixed; top: 0; width: 260px; height: 100%;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(40px);
            z-index: 1000; padding: 80px 20px; border: 1px solid rgba(255, 255, 255, 0.2);
            transition: 0.6s ease; /* سرعت ۱ درجه کمتر شد */
        }
        #rightMenu { right: -300px; }
        #leftMenu { left: -300px; } /* حالا از سمت چپ باز می‌شود */
        
        #rightMenu.active { right: 0; }
        #leftMenu.active { left: 0; }

        .nav-item {
            display: block; padding: 15px; background: rgba(255, 255, 255, 0.1); border-radius: 15px;
            color: white; text-align: center; text-decoration: none; margin-bottom: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        /* المان‌های اصلی */
        .page { display: none; width: 100%; flex-direction: column; align-items: center; }
        .page.active { display: flex; animation: fadeIn 0.7s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .orb { border-radius: 50%; background: radial-gradient(circle, #fff 0%, #a2d2ff 100%); animation: pulse 3s infinite ease-in-out; }
        .main-orb { width: 50px; height: 50px; margin-bottom: 5px; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        
        /* باکس چت با ارتفاع بیشتر (۲ سانت اضافه شد) */
        .chat-card { 
            width: 100%; max-width: 450px; 
            height: calc(50vh + 75px); /* ارتفاع افزایش یافت */
            background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(30px); 
            border-radius: 35px; border: 1px solid rgba(255, 255, 255, 0.3); 
            display: flex; flex-direction: column; padding: 15px; 
        }
        #chat-window { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px 18px; border-radius: 20px; font-size: 14px; max-width: 85%; text-align: right; }
        .a { align-self: flex-start; background: rgba(0, 0, 0, 0.2); color: white; }
        
        .input-area { margin-top: 15px; display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.1); padding: 12px; border-radius: 25px; }
        input { flex: 1; background: transparent; border: none; color: white; outline: none; text-align: right; }

        /* پلیر پادکست */
        .player-card { width: 100%; max-width: 400px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(30px); border-radius: 40px; padding: 30px; border: 1px solid rgba(255, 255, 255, 0.3); text-align: center; }
        .play-circle { width: 80px; height: 80px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 20px auto; cursor: pointer; }
        
        .podcast-scroll { width: 100%; max-width: 400px; height: 350px; overflow-y: auto; margin-top: 20px; padding-right: 5px; }
        .podcast-item { background: rgba(255,255,255,0.1); margin-bottom: 10px; padding: 12px; border-radius: 18px; display: flex; align-items: center; gap: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }

        #overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); display:none; z-index:999; backdrop-filter: blur(2px); }
    </style>
</head>
<body>

<div id="overlay" onclick="closeMenus()"></div>

<div class="menu-btn btn-right" onclick="openMenu('rightMenu')"><div></div><div></div><div></div></div>
<div class="menu-btn btn-left" onclick="openMenu('leftMenu')"><div></div><div></div><div></div></div>

<div id="rightMenu" class="side-menu">
    <div class="nav-item">پروفایل کاربری</div>
    <div class="nav-item">تنظیمات</div>
    <div class="nav-item" onclick="location.reload()">خروج</div>
</div>

<div id="leftMenu" class="side-menu">
    <div class="nav-item" onclick="showPage('homePage')">صفحه اصلی</div>
    <div class="nav-item" onclick="showPage('podcastPage')">پادکست‌ها</div>
    <div class="nav-item">تمرینات</div>
    <div class="nav-item">کتاب‌ها</div>
</div>

<div class="main-container" style="width:100%; display:flex; flex-direction:column; align-items:center; margin-top: 40px;">
    <div class="orb main-orb"></div>
    <h1 style="color:white; font-family:'League Spartan'; font-weight:800; margin-bottom:30px;">PlanLife</h1>

    <div id="homePage" class="page active">
        <div class="chat-card">
            <div id="chat-window">
                <div class="msg a">سوال ذهنی خودتان را بپرسید... ✨</div>
            </div>
            <div class="input-area">
                <input type="text" placeholder="بنویسید...">
                <div class="orb" style="width:20px; height:20px;"></div>
            </div>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 450px; margin-top: 20px;">
            <div class="nav-item" onclick="showPage('podcastPage')">پادکست‌ها</div>
            <div class="nav-item">تمرینات</div>
            <div class="nav-item">کتاب‌ها</div>
            <div class="nav-item">باورها</div>
        </div>
    </div>

    <div id="podcastPage" class="page">
        <div class="player-card">
            <h2 id="p-title" style="color:white; margin:0;">انتخاب پادکست</h2>
            <div class="play-circle" onclick="togglePlay()">
                <svg id="playIcon" width="40" height="40" fill="#7d2ae8" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
        </div>

        <div class="podcast-scroll">
            <script>
                const podcasts = [
                    { id: 1, title: "قدرت ذهن", url: "https://res.cloudinary.com/dshielkdt/video/upload/v1779205048/YTDown_YouTube_Media_jrK9TiZ251M_008_128k_jxdssu.mp3" },
                    { id: 2, title: "قسمت ۲", url: "لینک موزیک شماره ۲ را اینجا قرار دهید" },
                    { id: 3, title: "قسمت ۳", url: "لینک موزیک شماره ۳ را اینجا قرار دهید" },
                    { id: 4, title: "قسمت ۴", url: "لینک موزیک شماره ۴ را اینجا قرار دهید" },
                    { id: 5, title: "قسمت ۵", url: "لینک موزیک شماره ۵ را اینجا قرار دهید" },
                    { id: 6, title: "قسمت ۶", url: "لینک موزیک شماره ۶ را اینجا قرار دهید" },
                    { id: 7, title: "قسمت ۷", url: "لینک موزیک شماره ۷ را اینجا قرار دهید" },
                    { id: 8, title: "قسمت ۸", url: "لینک موزیک شماره ۸ را اینجا قرار دهید" },
                    { id: 9, title: "قسمت ۹", url: "لینک موزیک شماره ۹ را اینجا قرار دهید" },
                    { id: 10, title: "قسمت ۱۰", url: "لینک موزیک شماره ۱۰ را اینجا قرار دهید" }
                ];

                podcasts.forEach(p => {
                    document.write(`
                        <div class="podcast-item" onclick="loadTrack('${p.url}', '${p.title}')">
                            <div style="color:white; font-weight:800;">${p.id}</div>
                            <div style="flex:1; color:white; text-align:right; font-size:14px;">${p.title}</div>
                            <span style="color:white;">▶</span>
                        </div>
                    `);
                });
            </script>
        </div>
        <div class="nav-item" style="margin-top:20px; width:120px;" onclick="showPage('homePage')">بازگشت</div>
    </div>
</div>

<audio id="mainAudio"></audio>

<script>
    const audio = document.getElementById('mainAudio');
    const playIcon = document.getElementById('playIcon');
    let isPlaying = false;

    function openMenu(id) {
        closeMenus();
        document.getElementById(id).classList.add('active');
        document.getElementById('overlay').style.display = 'block';
        document.body.classList.add('menu-open');
    }
    function closeMenus() {
        document.querySelectorAll('.side-menu').forEach(m => m.classList.remove('active'));
        document.getElementById('overlay').style.display = 'none';
        document.body.classList.remove('menu-open');
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        closeMenus();
    }

    function loadTrack(url, title) {
        if(url.includes("لینک")) { alert("لطفاً ابتدا لینک موزیک را در کد جایگذاری کنید"); return; }
        audio.src = url;
        document.getElementById('p-title').innerText = title;
        audio.play();
        isPlaying = true;
        updateIcon();
    }

    function togglePlay() {
        if (!audio.src) return;
        if (audio.paused) { audio.play(); isPlaying = true; }
        else { audio.pause(); isPlaying = false; }
        updateIcon();
    }

    function updateIcon() {
        playIcon.innerHTML = isPlaying ? 
            '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : 
            '<path d="M8 5v14l11-7z"/>';
    }
</script>

</body>
</html>
