<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0033">
<title>PlanLife</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: 'Vazirmatn', sans-serif;
        overflow-x: hidden;
        color: white;
        background: #030303;
    }

    .stars { position: fixed; inset: 0; background: transparent; z-index: 1; pointer-events: none; }
    .stars::before, .stars::after {
        content: ''; position: absolute; inset: 0;
        background-image: radial-gradient(white 1px, transparent 1px);
        background-size: 80px 80px; opacity: 0.45; animation: twinkle 10s infinite alternate;
    }
    .stars::after { background-size: 140px 140px; opacity: 0.3; animation-duration: 16s; }
    @keyframes twinkle { 0% { opacity: 0.35; } 100% { opacity: 0.65; } }

    header { position: fixed; top: 0; left: 0; right: 0; height: 65px; display: flex; align-items: center; padding: 0 20px; z-index: 100; background: rgba(0,0,0,0.25); backdrop-filter: blur(10px); }
    .hamburger { font-size: 28px; cursor: pointer; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; }

    .menu-panel {
        position: fixed; top: 65px; right: -280px; width: 260px; height: calc(100% - 65px);
        background: rgba(255,255,255,0.12); backdrop-filter: blur(20px);
        border-radius: 20px 0 0 20px; padding: 25px 20px; transition: 0.4s ease; z-index: 200;
    }
    .menu-panel.active { right: 0; }

    .menu-item { padding: 16px 20px; margin: 12px 0; border-radius: 15px; background: rgba(255,255,255,0.1); font-size: 17px; }
    .menu-item:hover { background: rgba(255,255,255,0.25); }

    .main-center { position: relative; z-index: 5; min-height: 100vh; padding: 75px 20px 120px; display: flex; flex-direction: column; align-items: center; }

    .title { font-size: 38px; font-weight: 700; text-shadow: 0 0 25px rgba(160, 240, 255, 0.9); margin-bottom: 18px; }

    /* Glass Boxes with Gold Border */
    .chat-container, .service-box, .slide-item, .podcast-item, .modal-content, .support-item, .input-box, .play-main {
        border: 1px solid rgba(212, 175, 55, 0.55) !important;
        box-shadow: 0 10px 40px rgba(0,0,0,0.6),
                    0 0 25px rgba(212, 175, 55, 0.25);
    }

    .chat-container { 
        width: 100%; max-width: 360px; height: 390px; 
        background: rgba(255,255,255,0.11); backdrop-filter: blur(16px); 
        border-radius: 28px; 
        display: flex; flex-direction: column; padding: 12px; 
        margin-bottom: 30px; 
        position: relative;
    }
    .chat-container::before {
        content: '';
        position: absolute;
        inset: -12px;
        background: radial-gradient(circle at center, rgba(255, 136, 0, 0.35), transparent 70%);
        z-index: -1;
        filter: blur(18px);
        border-radius: 32px;
        opacity: 0.6;
    }

    #chat-output { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
    .msg-bot { align-self: flex-start; background: rgba(255,255,255,0.22); padding: 11px 15px; border-radius: 18px 18px 18px 5px; max-width: 88%; line-height: 1.55; }
    .msg-user { align-self: flex-end; background: rgba(100, 60, 255, 0.78); padding: 11px 15px; border-radius: 18px 18px 5px 18px; max-width: 88%; line-height: 1.55; }

    .input-box { 
        display: flex; background: rgba(255,255,255,0.13); border-radius: 25px; padding: 6px; margin-top: 8px; 
        position: relative;
    }
    .input-box::before {
        content: '';
        position: absolute;
        inset: -8px;
        background: radial-gradient(circle at center, rgba(255, 136, 0, 0.4), transparent 65%);
        z-index: -1;
        filter: blur(12px);
        border-radius: 33px;
    }
    input { flex: 1; background: transparent; border: none; color: white; font-size: 16.5px; padding: 12px 15px; outline: none; }

    button.send-btn { width: 52px; height: 52px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .orb-send {
        width: 38px; height: 38px; border-radius: 50%;
        background: radial-gradient(circle at 40% 30%, #ffffff, #a0f0ff 40%, #c026d3);
        box-shadow: 0 0 18px #c026d3, inset 0 0 12px rgba(255,255,255,0.9);
        animation: pulseOrb 2.4s ease-in-out infinite;
    }
    @keyframes pulseOrb { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }

    .services-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 360px; }
    .service-box {
        background: rgba(255,255,255,0.11); backdrop-filter: blur(16px); 
        border-radius: 24px; padding: 15px 10px 12px; text-align: center; cursor: pointer;
        transition: all 0.3s; height: 165px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
        position: relative;
    }
    .service-box::before {
        content: '';
        position: absolute;
        inset: -10px;
        background: radial-gradient(circle at center, rgba(255, 136, 0, 0.45), transparent 70%);
        z-index: -1;
        filter: blur(20px);
        border-radius: 30px;
        opacity: 0.55;
    }
    .service-box:hover { transform: translateY(-8px); }
    .service-box img { width: 78px; height: 78px; object-fit: cover; border-radius: 18px; border: 2px solid rgba(255,255,255,0.3); }
    .service-box span { font-size: 16.5px; font-weight: 500; }

    .horizontal-scroll {
        display: flex; gap: 15px; overflow-x: auto; padding: 12px 0 25px; 
        scrollbar-width: none; -webkit-overflow-scrolling: touch;
        width: 100%; max-width: 360px;
    }
    .horizontal-scroll::-webkit-scrollbar { display: none; }

    .slide-item {
        min-width: 140px; flex-shrink: 0; text-align: center; cursor: pointer;
        background: rgba(255,255,255,0.11); backdrop-filter: blur(12px);
        border-radius: 18px; padding: 10px 8px;
        position: relative;
    }
    .slide-item::before {
        content: '';
        position: absolute;
        inset: -8px;
        background: radial-gradient(circle at center, rgba(255, 136, 0, 0.4), transparent 65%);
        z-index: -1;
        filter: blur(16px);
        border-radius: 24px;
    }
    .slide-item img { width: 130px; height: 130px; object-fit: cover; border-radius: 18px; margin-bottom: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }

    .section-title { font-size: 22px; margin: 20px 0 12px; padding: 0 5px; }

    .podcast-item {
        background: rgba(255,255,255,0.1); backdrop-filter: blur(12px);
        border-radius: 18px;
        padding: 12px 15px; margin-bottom: 70px; display: flex; align-items: center; gap: 15px;
        cursor: pointer; position: relative;
    }
    .podcast-item::before {
        content: '';
        position: absolute;
        inset: -10px;
        background: radial-gradient(circle at center, rgba(255, 136, 0, 0.35), transparent 70%);
        z-index: -1;
        filter: blur(18px);
        border-radius: 26px;
        opacity: 0.5;
    }

    .podcast-item img { width: 55px; height: 55px; object-fit: cover; border-radius: 12px; }
    .music-info { flex: 1; }
    .music-title { font-weight: 500; font-size: 16px; }
    .music-artist { font-size: 14px; opacity: 0.7; }
    .music-duration { font-size: 14px; opacity: 0.6; align-self: center; }

    .play-circle {
        width: 42px; height: 42px;
        background: rgba(255,255,255,0.15);
        border: 2px solid rgba(255,255,255,0.6);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s;
    }
    .podcast-item:hover .play-circle {
        background: #c026d3;
        border-color: white;
        transform: scale(1.1);
    }
    .play-triangle {
        width: 0; height: 0;
        border-top: 8px solid transparent;
        border-bottom: 8px solid transparent;
        border-left: 14px solid white;
        margin-left: 3px;
    }

    /* Modal */
    #subscriptionModal, #supportModal {
        position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 400;
        display: none; align-items: center; justify-content: center;
    }
    .modal-content {
        background: rgba(255,255,255,0.11); backdrop-filter: blur(20px);
        border-radius: 24px;
        padding: 30px 25px; width: 90%; max-width: 360px; text-align: center;
        box-shadow: 0 15px 40px rgba(0,0,0,0.7);
        position: relative;
    }
    .modal-content::before {
        content: '';
        position: absolute;
        inset: -15px;
        background: radial-gradient(circle at center, rgba(255, 136, 0, 0.4), transparent 70%);
        z-index: -1;
        filter: blur(25px);
        border-radius: 36px;
    }
    .status-icon { font-size: 70px; margin-bottom: 15px; }
    .success { color: #00ff88; }
    .error { color: #ff3366; }
    .modal-title { font-size: 22px; margin: 10px 0; font-weight: 700; }
    .reasons { text-align: right; font-size: 15px; margin: 20px 0; line-height: 1.8; opacity: 0.9; }
    .glass-btn {
        width: 100%; padding: 14px; background: rgba(255,255,255,0.15);
        color: white; border: 1px solid rgba(212, 175, 55, 0.5); border-radius: 14px;
        font-weight: 600; cursor: pointer; margin-top: 10px;
        position: relative;
    }
    .glass-btn:hover { background: rgba(255,255,255,0.25); }

    .support-item {
        display: flex;
        align-items: center;
        gap: 15px;
        background: rgba(255,255,255,0.1);
        padding: 18px 20px;
        border-radius: 16px;
        margin: 12px 0;
        cursor: pointer;
        transition: all 0.3s;
        position: relative;
    }
    .support-item::before {
        content: '';
        position: absolute;
        inset: -8px;
        background: radial-gradient(circle at center, rgba(255, 136, 0, 0.35), transparent 70%);
        z-index: -1;
        filter: blur(16px);
        border-radius: 22px;
    }
    .support-item:hover {
        background: rgba(255,255,255,0.25);
        transform: translateY(-3px);
    }
    .support-logo {
        width: 50px;
        height: 50px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
    }

    /* Now Playing */
    .now-playing {
        position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 300;
        display: none; flex-direction: column; align-items: center; padding: 40px 20px 30px;
    }
    .now-playing.active { display: flex; }

    .big-cover {
        position: relative;
        margin: 20px 0 40px;
    }
    .big-cover::after {
        content: '';
        position: absolute;
        inset: -40px;
        background: radial-gradient(circle, rgba(255, 136, 0, 0.6), transparent 70%);
        filter: blur(40px);
        opacity: 0.45;
        z-index: -1;
        border-radius: 50%;
        animation: glow 4s ease-in-out infinite alternate;
    }
    @keyframes glow { from { opacity: 0.35; } to { opacity: 0.6; } }

    .big-cover img {
        width: 280px;
        height: 280px;
        object-fit: cover;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        border: 3px solid rgba(212, 175, 55, 0.4);
    }

    .custom-player {
        width: 100%;
        max-width: 340px;
    }

    .time-display {
        display: flex;
        justify-content: space-between;
        font-size: 13.5px;
        opacity: 0.8;
        margin-bottom: 8px;
    }

    .progress-container {
        height: 7px;
        background: rgba(255,255,255,0.2);
        border-radius: 10px;
        margin-bottom: 25px;
        overflow: hidden;
        cursor: pointer;
        box-shadow: 0 0 8px rgba(255, 136, 0, 0.3);
    }
    .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(to right, #c026d3, #ff8800);
        transition: width 0.1s linear;
        box-shadow: 0 0 12px #ff8800;
    }

    .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        margin-top: 10px;
    }
    .control-btn {
        font-size: 32px;
        cursor: pointer;
        padding: 10px;
        user-select: none;
    }
    .play-main {
        width: 82px;
        height: 82px;
        background: rgba(255,255,255,0.12);
        backdrop-filter: blur(12px);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 0 35px rgba(192, 38, 211, 0.6);
        transition: all 0.3s;
        position: relative;
    }
    .play-main::before {
        content: '';
        position: absolute;
        inset: -12px;
        background: radial-gradient(circle at center, rgba(255, 136, 0, 0.45), transparent 60%);
        z-index: -1;
        filter: blur(22px);
        border-radius: 50%;
    }
    .play-main:hover {
        transform: scale(1.1);
        background: rgba(255,255,255,0.25);
    }
    .play-icon {
        width: 0; height: 0;
        border-top: 13px solid transparent;
        border-bottom: 13px solid transparent;
        border-left: 22px solid white;
    }
</style>
</head>

// ==================== کدهای اشتراک ====================
let unlockedCategories = {};

const subscriptionCodes = {
    "باورهای ثروت": ["77777", "BA777", "TH777","Servat"],
    "عشق و روابط": ["88888", "ESH88", "Love"],
    "تحول حال و احساس": ["99999", "TA999", "Ehsas"],
    "اعتماد به نفس": ["11111", "ET111", "Etemad"],
    "احساس لیاقت": ["22222", "EL222", "Liyaghat"]
};

// ==================== بقیه کد (عیناً) ====================
window.onload = () => {
    document.getElementById("chat-output").innerHTML += `<div class="msg-bot">سلام خوش اومدی به PlanLife 💜<br>چطور می‌تونم کمکت کنم؟</div>`;
};

function sendMessage() {
    const input = document.getElementById("user-input");
    const text = input.value.trim();
    if (!text) return;
    const output = document.getElementById("chat-output");
    output.innerHTML += `<div class="msg-user">${text}</div>`;
    input.value = "";

    setTimeout(() => {
        let reply = "درک کردم! بگو ببینم چی مدنظرت هست؟";
        output.innerHTML += `<div class="msg-bot">${reply}</div>`;
        output.scrollTop = output.scrollHeight;
    }, 700);
}

function toggleMenu() {
    document.getElementById('sideMenu').classList.toggle('active');
}
function goToHome() { location.reload(); }

function showSection(section) {
    const main = document.getElementById('mainContent');
    if (section === 'podcast' || section === 'courses') {
        const isPodcast = section === 'podcast';
        main.innerHTML = `
            <h2 style="font-size:32px; margin-bottom:15px; text-align:center;">${isPodcast ? 'پادکست‌های PlanLife' : 'دوره‌های PlanLife'}</h2>
            <div class="section-title">دسته‌بندی‌ها</div>
            <div class="horizontal-scroll" id="categorySlides"></div>
            <div class="section-title" id="currentCategoryTitle">همه ${isPodcast ? 'پادکست‌ها' : 'دوره‌ها'}</div>
            <div id="podcastList"></div>
            <button onclick="goToHome()" style="margin-top:30px; background:rgba(255,255,255,0.1); color:white; border:none; padding:12px 40px; border-radius:30px;">بازگشت به خانه</button>
        `;
        loadPage(section);
    }
}

function loadPage(type) {
    const categories = ["باورهای ثروت", "عشق و روابط", "تحول حال و احساس", "اعتماد به نفس", "احساس لیاقت"];
    let html = '';
    categories.forEach(cat => {
        html += `<div class="slide-item" onclick="selectCat('${cat}', '${type}')"><img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg"><p>${cat}</p></div>`;
    });
    document.getElementById('categorySlides').innerHTML = html;
    loadItems(null, type);
}

function selectCat(cat, type) {
    document.getElementById('currentCategoryTitle').textContent = cat;
    loadItems(cat, type);
}

function loadItems(cat, type) {
    let html = '';
    const cats = cat ? [cat] : ["باورهای ثروت", "عشق و روابط", "تحول حال و احساس", "اعتماد به نفس", "احساس لیاقت"];
    const dataSource = type === 'courses' ? courseData : podcastData;

    cats.forEach(c => {
        const filtered = dataSource.filter(item => item.title === c);
        filtered.forEach(item => {
            const func = type === 'courses' ? 'playCourse' : 'playPodcast';
            const duration = ["32:45", "43:12", "21:58", "35:05", "33:30"][(item.episode-1) % 5];
            html += `
                <div class="podcast-item" onclick="${func}('${item.title}', ${item.episode}, '${item.src}', '${item.cover}')">
                    <img src="${item.cover}" alt="">
                    <div class="music-info">
                        <div class="music-title">${item.title}</div>
                        <div class="music-artist">قسمت ${item.episode}</div>
                    </div>
                    <div class="music-duration">${duration}</div>
                    <div class="play-circle"><div class="play-triangle"></div></div>
                </div>`;
        });
    });
    document.getElementById('podcastList').innerHTML = html || '<p style="text-align:center; padding:40px; opacity:0.7;">موردی یافت نشد</p>';
}

// ==================== پخش ====================
let currentAudio = null;

function playAudio(title, episode, src, cover) {
    document.getElementById('npTitle').textContent = `${title} - قسمت ${episode}`;
    document.getElementById('npCover').src = cover;
    document.getElementById('nowPlayingScreen').classList.add('active');
    
    const audio = document.getElementById('mainAudio');
    audio.src = src;
    audio.play().catch(() => {});
    currentAudio = audio;
    updateProgress();
}

function playPodcast(title, episode, src, cover) {
    playAudio(title, episode, src, cover);
}

function playCourse(title, episode, src, cover) {
    if (unlockedCategories[title]) {
        playAudio(title, episode, src, cover);
    } else {
        showSubscriptionModal(title);
    }
}

// Modal ها
function showSubscriptionModal(category) {
    window.currentUnlockCategory = category;
    const content = document.getElementById('modalContent');
    content.innerHTML = `
        <h3 style="margin-bottom:15px;">🔐 نیاز به اشتراک دارید</h3>
        <p style="margin-bottom:20px; opacity:0.9;">دسته‌بندی: <strong>${category}</strong></p>
        <p style="margin:20px 0 10px;">کد اشتراک را وارد کنید :</p>
        <input id="unlockCode" type="text" maxlength="10" placeholder="*****" 
               style="width:100%; padding:14px; border-radius:12px; border:none; text-align:center; font-size:34px; margin-bottom:14px;">
        <button onclick="checkUnlockCode()" style="width:100%; padding:14px; background:#00ff88; color:black; border:none; border-radius:12px; font-weight:bold;">فعال‌سازی</button>
        <button onclick="showSupportModal()" class="glass-btn" style="background:rgba(255,255,255,0.2);">ارتباط با پشتیبانی 🔓</button>
        <button onclick="closeModal()" class="glass-btn">بستن</button>
    `;
    document.getElementById('subscriptionModal').style.display = 'flex';
}

function checkUnlockCode() {
    const code = document.getElementById('unlockCode').value.trim();
    const category = window.currentUnlockCategory;
    const content = document.getElementById('modalContent');

    if (subscriptionCodes[category] && subscriptionCodes[category].includes(code)) {
        unlockedCategories[category] = true;
        content.innerHTML = `<div class="status-icon success">✅</div><div class="modal-title" style="color:#00ff88;">اشتراک شما فعال شد!</div><div class="modal-text">حالا می‌توانید به تمام محتوای این دسته‌بندی دسترسی داشته باشید.</div><button onclick="closeModal()" class="glass-btn">بستن</button>`;
    } else {
        content.innerHTML = `<div class="status-icon error">✕</div><div class="modal-title">شما وارد نشدید</div><div class="modal-text">متأسفانه کد وارد شده معتبر نیست.</div><div class="reasons">دلایل احتمالی:<br>۱. کد ورود شما اشتباه است<br>۲. اشتراک تهیه نکردید<br>۳. اشتراک دوره دیگری خریداری کردید</div><button onclick="closeModal()" class="glass-btn">بستن</button>`;
    }
}

function closeModal() { document.getElementById('subscriptionModal').style.display = 'none'; }
function showSupportModal() { closeModal(); document.getElementById('supportModal').style.display = 'flex'; }
function closeSupportModal() { document.getElementById('supportModal').style.display = 'none'; }

// ==================== پخش‌کننده ====================
const audio = document.getElementById('mainAudio');
const progressBar = document.getElementById('progressBar');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const progressContainer = document.getElementById('progressContainer');
const playBtn = document.getElementById('playBtn');

function formatTime(seconds) {
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min}:${sec < 10 ? '0' : ''}${sec}`;
}

function updateProgress() {
    if (!audio.duration) return;
    const progress = (audio.currentTime / audio.duration) * 100;
    progressBar.style.width = `${progress}%`;
    currentTimeEl.textContent = formatTime(audio.currentTime);
    totalTimeEl.textContent = formatTime(audio.duration);
}

audio.addEventListener('timeupdate', updateProgress);
audio.addEventListener('loadedmetadata', () => {
    totalTimeEl.textContent = formatTime(audio.duration);
});

progressContainer.addEventListener('click', (e) => {
    const rect = progressContainer.getBoundingClientRect();
    const pos = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pos * audio.duration;
});

function togglePlay() {
    if (audio.paused) {
        audio.play();
        playBtn.innerHTML = `<span style="font-size:28px; color:white;">❚❚</span>`;
    } else {
        audio.pause();
        playBtn.innerHTML = `<div class="play-icon" id="playIcon"></div>`;
    }
}

function seek(seconds) {
    audio.currentTime += seconds;
}

function closeNowPlaying() {
    document.getElementById('nowPlayingScreen').classList.remove('active');
    audio.pause();
}
</script>
