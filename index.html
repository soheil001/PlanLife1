<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0033">
<title>PlanLife</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: 'Vazirmatn', sans-serif;
        overflow-x: hidden;
        color: white;
        background: #030303;
    }

    .stars { position: fixed; inset: 0; background: transparent; z-index: 1; pointer-events: none; }
    .stars::before, .stars::after {
        content: ''; position: absolute; inset: 0;
        background-image: radial-gradient(white 1px, transparent 1px);
        background-size: 80px 80px; opacity: 0.45; animation: twinkle 10s infinite alternate;
    }
    .stars::after { background-size: 140px 140px; opacity: 0.3; animation-duration: 16s; }
    @keyframes twinkle { 0% { opacity: 0.35; } 100% { opacity: 0.65; } }

    header { 
        position: fixed; top: 0; left: 0; right: 0; height: 65px; 
        display: flex; align-items: center; padding: 0 20px; z-index: 100; 
        background: rgba(0,0,0,0.25); backdrop-filter: blur(10px); 
    }
    .hamburger { font-size: 28px; cursor: pointer; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; }

    .main-center { 
        position: relative; z-index: 5; min-height: 100vh; 
        padding: 75px 20px 120px; display: flex; flex-direction: column; align-items: center; 
    }

    .title { 
        font-size: 42px; 
        font-weight: 900; 
        text-shadow: 0 0 30px rgba(160, 240, 255, 0.9); 
        margin-bottom: 25px; 
        color: white;
    }

    .chat-container, .service-box {
        border: 1px solid rgba(212, 175, 55, 0.55) !important;
        box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 25px rgba(212, 175, 55, 0.25);
    }

    .chat-container { 
        width: 100%; max-width: 360px; height: 390px; 
        background: rgba(255,255,255,0.11); backdrop-filter: blur(16px); 
        border-radius: 28px; display: flex; flex-direction: column; padding: 12px; margin-bottom: 35px; 
    }

    #chat-output { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
    .msg-bot { align-self: flex-start; background: rgba(255,255,255,0.22); padding: 11px 15px; border-radius: 18px 18px 18px 5px; max-width: 88%; line-height: 1.55; }
    .msg-user { align-self: flex-end; background: rgba(100, 60, 255, 0.78); padding: 11px 15px; border-radius: 18px 18px 5px 18px; max-width: 88%; line-height: 1.55; }

    .input-box { 
        display: flex; background: rgba(255,255,255,0.13); border-radius: 25px; padding: 6px; margin-top: 8px; 
    }
    input { flex: 1; background: transparent; border: none; color: white; font-size: 16.5px; padding: 12px 15px; outline: none; }

    .services-grid { 
        display: grid; 
        grid-template-columns: 1fr 1fr; 
        gap: 16px; 
        width: 100%; 
        max-width: 360px; 
    }

    .service-box {
        background: rgba(255,255,255,0.11); 
        backdrop-filter: blur(16px); 
        border-radius: 24px; 
        padding: 15px 10px 12px; 
        text-align: center; 
        cursor: pointer;
        height: 230px; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        gap: 10px;
        transition: all 0.3s;
    }
    .service-box:hover { transform: translateY(-8px); }

    .service-box img { 
        width: 145px; 
        height: 145px; 
        object-fit: cover; 
        border-radius: 18px; 
        border: 2px solid rgba(255,255,255,0.3); 
    }
    .service-box span { 
        font-size: 17px; 
        font-weight: 700; 
        color: white;
    }
</style>
</head>
<body>

<div class="stars"></div>

<header>
    <div class="hamburger" onclick="toggleMenu()">☰</div>
</header>

<div class="main-center">
    <div class="title">PlanLife</div>

    <!-- چت -->
    <div class="chat-container">
        <div id="chat-output"></div>
        <div class="input-box">
            <input id="user-input" placeholder="پیام بده...">
            <button class="send-btn" onclick="sendMessage()">
                <div class="orb-send"></div>
            </button>
        </div>
    </div>

    <!-- خدمات -->
    <div class="services-grid">

        <!-- پادکست -->
        <a href="https://planlife.ir/Pages/podcasts_free/index.html">
            <div class="service-box">
                <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779450993/phonto_jmcfqk.png" alt="">
                <span>پادکست رایگان</span>
            </div>
        </a>

        <!-- دوره‌ها -->
        <a href="courses.html">
            <div class="service-box">
                <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg" alt="">
                <span>دوره ها</span>
            </div>
        </a>

        <!-- موزیک -->
        <a href="music.html">
            <div class="service-box">
                <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779454037/IMG_0213_mrxvu1.png" alt="">
                <span>موزیک ها</span>
            </div>
        </a>

        <!-- تمرینات مجازی -->
        <a href="exercise.html">
            <div class="service-box">
                <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779454914/IMG_0217_fnjv9i.jpg" alt="">
                <span>تمرینات مجازی</span>
            </div>
        </a>

        <!-- مجله ماورایی -->
        <a href="magazine.html">
            <div class="service-box">
                <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779568027/IMG_1109_xpxghq.png" alt="">
                <span>مجله ماورایی 📰</span>
            </div>
        </a>

        <!-- کتابخانه -->
        <a href="library.html">
            <div class="service-box">
                <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779449504/IMG_1045_lgkcd4.jpg" alt="">
                <span>کتابخانه 📚</span>
            </div>
        </a>

        <!-- ویدیوها (جدید) -->
        <a href="videos.html">
            <div class="service-box">
                <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg" alt="">
                <span>ویدیوها 🎥</span>
            </div>
        </a>

    </div>
</div>

<script>
// چت ساده
window.onload = () => {
    document.getElementById("chat-output").innerHTML += `<div class="msg-bot">به بخش ماورای ذهن خوش اومدی 🧠<br>چطور می‌تونم کمکت کنم؟</div>`;
};

function sendMessage() {
    const input = document.getElementById("user-input");
    const text = input.value.trim();
    if (!text) return;
    const output = document.getElementById("chat-output");
    output.innerHTML += `<div class="msg-user">${text}</div>`;
    input.value = "";

    setTimeout(() => {
        output.innerHTML += `<div class="msg-bot">من در حال آموزش دیدن برای تبدیل به هوش ماورایی هستم. فعلاً از منوی بالا استفاده کنید 🧠</div>`;
        output.scrollTop = output.scrollHeight;
    }, 700);
}

function toggleMenu() {
    alert("منوی کناری در حال توسعه است.");
}
</script>
</body>
</html>
