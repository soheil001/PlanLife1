<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; height: 100vh; background: linear-gradient(135deg, #00f2fe, #4facfe, #764ba2, #ff758c); display: flex; flex-direction: column; align-items: center; font-family: 'Nunito', sans-serif; overflow: hidden; }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(8px); z-index: 1000; display: none; transition: 0.4s; }
        #overlay.active { display: block; }

        .menu-btn { position: fixed; top: 20px; width: 55px; height: 55px; background: rgba(255,255,255,0.25); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; font-size: 28px; z-index: 3000; }
        .left-icon { left: 20px; }
        .right-icon { right: 20px; }

        .menu-panel { position: fixed; top: 0; width: 220px; height: 100%; background: rgba(255,255,255,0.1); backdrop-filter: blur(25px); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); padding-top: 80px; z-index: 2500; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        #leftPanel { left: 0; transform: translateX(-100%); }
        #rightPanel { right: 0; transform: translateX(100%); }
        .show-left { transform: translateX(0) !important; }
        .show-right { transform: translateX(0) !important; }

        .menu-item { width: 80%; padding: 15px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); border-radius: 18px; color: white; text-align: center; cursor: pointer; }

        .pulse { width: 45px; height: 45px; background: radial-gradient(circle, #ffffff, #00f2fe); border-radius: 50%; margin-top: 130px; 
                 box-shadow: 0 10px 30px rgba(255, 255, 0, 0.6); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); box-shadow: 0 15px 40px rgba(255, 255, 0, 0.8); } 100% { transform: scale(1); } }
        
        .title { color: white; font-family: 'Nunito', sans-serif; font-size: 50px; margin-top: 25px; }

        /* چت باکس بالاتر */
        .chat-box { width: calc(100% - 30px); max-width: 380px; height: 400px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.3); border-radius: 30px; margin-top: -10px; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        
        .input-wrapper { position: relative; width: 100%; margin-top: auto; display: flex; align-items: center; }
        /* Font-size: 16px برای جلوگیری از زوم خودکار در آیفون */
        input { width: 100%; padding: 18px 20px; border-radius: 20px; border: none; background: rgba(255,255,255,0.25); color: white; box-sizing: border-box; font-size: 16px; }
        
        /* دکمه ارسال شیشه‌ای روشن‌تر */
        .send-btn { position: absolute; left: 5px; width: 45px; height: 45px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.4); backdrop-filter: blur(10px); color: white; cursor: pointer; font-size: 22px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="overlay" onclick="closeAll()"></div>
    <div class="menu-btn left-icon" onclick="toggleMenu('left')">☰</div>
    <div class="menu-btn right-icon" onclick="toggleMenu('right')">☰</div>

    <div id="leftPanel" class="menu-panel">
        <div class="menu-item">خانه</div><div class="menu-item">پروفایل</div><div class="menu-item">تنظیمات</div><div class="menu-item">خروج</div>
    </div>
    <div id="rightPanel" class="menu-panel">
        <div class="menu-item">پروژه‌ها</div><div class="menu-item">اشتراک</div><div class="menu-item">تیم‌ها</div><div class="menu-item">پشتیبانی</div>
    </div>

    <div class="pulse"></div>
    <h1 class="title">PlanLife</h1>

    <div class="chat-box">
        <div style="flex: 1; color: white; opacity: 0.8;">در حال گوش دادن...</div>
        <div class="input-wrapper">
            <input type="text" placeholder="پیام...">
            <button class="send-btn">▲</button>
        </div>
    </div>

    <script>
        function toggleMenu(side) {
            const left = document.getElementById('leftPanel');
            const right = document.getElementById('rightPanel');
            const overlay = document.getElementById('overlay');
            
            if(side === 'left') {
                if(left.classList.contains('show-left')) { closeAll(); }
                else { right.classList.remove('show-right'); left.classList.add('show-left'); overlay.classList.add('active'); }
            } else {
                if(right.classList.contains('show-right')) { closeAll(); }
                else { left.classList.remove('show-left'); right.classList.add('show-right'); overlay.classList.add('active'); }
            }
        }

        function closeAll() {
            document.getElementById('leftPanel').classList.remove('show-left');
            document.getElementById('rightPanel').classList.remove('show-right');
            document.getElementById('overlay').classList.remove('active');
        }
    </script>
</body>
</html>
