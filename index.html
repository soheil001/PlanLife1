<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyond Mind Interface</title>
    <style>
        :root {
            --bg-dark: #0f171e;
            --panel-bg: #1a242d;
            --accent-gold: #c5a059;
            --accent-green: #00f2ad;
            --text-gray: #8b959e;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; height: 100vh; background: #231f20; 
            display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Tahoma, sans-serif; color: white;
            background: radial-gradient(circle at center, #2c2c2c 0%, #000 100%);
        }

        /* قاب اصلی پلتفرم شبیه عکس */
        .app-frame {
            width: 95vw; height: 90vh; max-width: 1200px;
            background: var(--bg-dark); border-radius: 20px;
            display: flex; gap: 10px; padding: 15px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }

        /* ستون سمت چپ (آموزش‌ها) */
        .sidebar-left {
            flex: 0.8; background: var(--panel-bg); border-radius: 15px;
            display: flex; flex-direction: column; padding: 15px; gap: 15px;
        }

        .user-profile { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .avatar-circle { width: 45px; height: 45px; border-radius: 50%; background: var(--accent-gold); box-shadow: 0 0 15px rgba(197, 160, 89, 0.4); }

        .edu-item { 
            display: flex; align-items: center; gap: 12px; padding: 10px; 
            background: rgba(255,255,255,0.03); border-radius: 10px; cursor: pointer;
        }
        .icon-circle { width: 35px; height: 35px; border-radius: 50%; background: #333; border: 1px solid var(--accent-gold); }

        /* ستون وسط (محتوا و چت) */
        .content-main {
            flex: 2; display: flex; flex-direction: column; gap: 10px;
        }

        .hero-banner {
            height: 250px; background: url('https://img.freepik.com/free-photo/mysterious-castle-fog_23-2151040432.jpg') center/cover;
            border-radius: 15px; border: 1px solid #444; position: relative;
        }

        .chat-area {
            flex: 1; background: #121920; border-radius: 15px; display: flex; flex-direction: column;
            padding: 15px; border: 1px solid #222;
        }

        #chat { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 10px 14px; border-radius: 12px; font-size: 13px; max-width: 80%; }
        .u { background: #2a353f; align-self: flex-start; color: #ddd; }
        .a { background: rgba(0, 242, 173, 0.1); align-self: flex-end; color: var(--accent-green); border: 1px solid rgba(0, 242, 173, 0.2); }

        /* ستون سمت راست (ابزارها) */
        .sidebar-right {
            flex: 0.6; background: var(--panel-bg); border-radius: 15px;
            display: flex; flex-direction: column; padding: 15px; gap: 15px;
        }

        .action-btn {
            background: var(--accent-gold); color: black; border: none; padding: 12px;
            border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center;
        }

        .status-light { width: 10px; height: 10px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 10px var(--accent-green); }

        /* باکس تایپ */
        .input-box { display: flex; gap: 10px; margin-top: 10px; background: #0a0f14; padding: 5px; border-radius: 10px; }
        input { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; }
        .send-btn { background: var(--accent-green); border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; }

        @media (max-width: 900px) { .sidebar-left, .sidebar-right { display: none; } }
    </style>
</head>
<body>

<div class="app-frame">
    <div class="sidebar-left">
        <div class="user-profile">
            <div class="avatar-circle"></div>
            <span style="font-size: 0.9rem;">SOHEIL PANEL</span>
        </div>
        <div class="edu-item"><div class="icon-circle"></div><span>قانون جذب</span></div>
        <div class="edu-item"><div class="icon-circle"></div><span>پاکسازی</span></div>
        <div class="edu-item"><div class="icon-circle"></div><span>فرکانس</span></div>
        <div class="edu-item"><div class="icon-circle"></div><span>تجسم خلاق</span></div>
    </div>

    <div class="content-main">
        <div class="hero-banner"></div>
        <div class="chat-area">
            <div id="chat">
                <div class="msg a">سیستم آماده دریافت فرکانس‌های شماست...</div>
            </div>
            <div class="input-box">
                <input type="text" id="userInput" placeholder="بپرس..." onkeypress="if(event.keyCode===13)send()">
                <button class="send-btn" onclick="send()">➤</button>
            </div>
        </div>
    </div>

    <div class="sidebar-right">
        <div style="display:flex; align-items:center; gap:10px;">
            <div class="status-light"></div>
            <span style="font-size: 0.8rem;">ارتباط آنلاین</span>
        </div>
        <div class="action-btn">فروشگاه</div>
        <div style="margin-top:auto; color: var(--text-gray); font-size: 0.7rem; text-align: center;">
            VERSION 2.0.1 <br> BEYOND MIND
        </div>
    </div>
</div>

<script>
    let brain = {};
    async function loadBrain() {
        try {
            const r = await fetch('database.txt?v=' + Math.random());
            const d = await r.text();
            d.split('\n').forEach(l => {
                const p = l.split('|');
                if (p.length === 2) brain[p[0].trim()] = p[1].trim();
            });
        } catch (e) {}
    }
    loadBrain();

    function send() {
        const i = document.getElementById('userInput');
        const b = document.getElementById('chat');
        if (!i.value.trim()) return;
        b.innerHTML += `<div class="msg u">${i.value}</div>`;
        let r = "";
        for (let k in brain) { if (i.value.includes(k)) { r = brain[k]; break; } }
        if (!r) r = "فرکانس دریافت نشد. ✨";
        setTimeout(() => {
            b.innerHTML += `<div class="msg a">${r}</div>`;
            b.scrollTop = b.scrollHeight;
        }, 600);
        i.value = "";
    }
</script>

</body>
</html>
