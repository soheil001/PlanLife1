<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlanLife Galaxy</title>

<style>

/* ===== RESET ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: sans-serif;
}

/* ===== BACKGROUND GALAXY ===== */
body {
    min-height: 100vh;
    color: white;
    overflow-x: hidden;
    background: radial-gradient(ellipse at bottom, #0b0c2a 0%, #000000 100%);
}

/* ⭐ لایه ستاره‌ها */
.stars {
    position: fixed;
    width: 200%;
    height: 200%;
    background: transparent;
    z-index: -1;
}

.stars::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background-image:
        radial-gradient(2px 2px white, transparent),
        radial-gradient(1px 1px #aaa, transparent),
        radial-gradient(2px 2px #fff, transparent);
    background-size: 100px 100px, 150px 150px, 200px 200px;
    animation: moveStars 80s linear infinite;
}

@keyframes moveStars {
    from { transform: translate(0, 0); }
    to { transform: translate(-500px, -500px); }
}

/* 🌌 نور کهکشانی */
.glow {
    position: fixed;
    width: 100%;
    height: 100%;
    background:
        radial-gradient(circle at 20% 30%, rgba(138,43,226,0.2), transparent),
        radial-gradient(circle at 80% 70%, rgba(0,191,255,0.2), transparent);
    z-index: -1;
}

/* 🔮 ORB */
.orb {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    margin: 30px auto 10px;
    background: radial-gradient(circle, #ffffff, #dfe9f3, #aab7c4);
    box-shadow: 0 0 25px rgba(255,255,255,0.7);
    animation: pulse 3s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); }
    100% { transform: scale(1); }
}

.title {
    text-align: center;
    font-size: 26px;
}

/* 💬 CHAT */
.chat {
    width: 90%;
    margin: 15px auto;
    height: 42vh;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    display: flex;
    flex-direction: column;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}

.msg {
    padding: 8px 12px;
    margin: 6px;
    border-radius: 12px;
    max-width: 70%;
}

.user {
    background: rgba(0,200,255,0.6);
    margin-left: auto;
}

.bot {
    background: rgba(255,255,255,0.2);
    margin-right: auto;
}

.inputArea {
    display: flex;
    border-top: 1px solid rgba(255,255,255,0.2);
}

input {
    flex: 1;
    padding: 12px;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 16px;
}

button {
    padding: 10px;
    border: none;
    background: rgba(0,200,255,0.7);
    color: white;
    border-radius: 10px;
}

/* 🔲 BUTTONS */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 90%;
    margin: 20px auto;
}

.card {
    height: 75px;
    border-radius: 15px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ☰ MENU */
.menu-btn {
    position: fixed;
    top: 15px;
    right: 15px;
    font-size: 22px;
    z-index: 1001;
}

.drawer {
    position: fixed;
    top: 0;
    right: -70%;
    width: 70%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(15px);
    padding: 20px;
    transition: 0.3s;
    z-index: 1002;
}

.drawer.active {
    right: 0;
}

.drawer div {
    margin: 15px 0;
    padding: 10px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
}

/* 🌑 OVERLAY */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
    z-index: 1000;
}

.overlay.active {
    opacity: 1;
    pointer-events: auto;
}

</style>
</head>

<body>

<div class="stars"></div>
<div class="glow"></div>

<div class="menu-btn" onclick="toggleMenu()">☰</div>

<div class="overlay" id="overlay" onclick="toggleMenu(false)"></div>

<div class="drawer" id="drawer">
    <div>پادکست</div>
    <div>اهداف</div>
    <div>برنامه</div>
    <div>مالی</div>
</div>

<div class="orb"></div>
<div class="title">PlanLife</div>

<div class="chat">
    <div class="messages" id="msgs"></div>

    <div class="inputArea">
        <input id="inp" placeholder="پیامتو بنویس...">
        <button onclick="send()">ارسال</button>
    </div>
</div>

<div class="grid">
    <div class="card">پادکست</div>
    <div class="card">اهداف</div>
    <div class="card">برنامه</div>
    <div class="card">مالی</div>
</div>

<script>

function send() {
    let input = document.getElementById("inp");

    if (!input.value) return;

    msgs.innerHTML += `<div class="msg user">${input.value}</div>`;
    msgs.innerHTML += `<div class="msg bot">سلام 👋</div>`;

    input.value = "";
    msgs.scrollTop = msgs.scrollHeight;
}

/* منو */
function toggleMenu(force) {

    let drawer = document.getElementById("drawer");
    let overlay = document.getElementById("overlay");

    if (force === false) {
        drawer.classList.remove("active");
        overlay.classList.remove("active");
        return;
    }

    drawer.classList.toggle("active");
    overlay.classList.toggle("active");
}

</script>

</body>
</html>
