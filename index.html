<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پلتفرم ماورای ذهن | Maovaraye Zehn</title>
    <style>
        * { box-sizing: border-box; }
        
        /* بگراند کهکشانی متحرک */
        body { 
            margin: 0; height: 100vh; font-family: Tahoma, sans-serif; overflow: hidden; 
            background: linear-gradient(-45deg, #02051a, #1b0335, #4b0082, #810551);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            display: flex; justify-content: center; align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* چیدمان اصلی سه ستونه */
        .main-layout {
            display: flex; width: 98vw; height: 92vh; gap: 15px; padding: 10px;
        }

        /* استایل ستون‌های کناری */
        .sidebar {
            flex: 1; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px);
            border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column; padding: 20px; gap: 12px; overflow-y: auto;
        }

        /* استایل ستون وسط (چت) */
        .chat-center {
            flex: 2.5; background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(30px);
            border-radius: 35px; border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column; padding: 20px; position: relative;
        }

        .sidebar-title { color: #32d74b; font-size: 1rem; margin-bottom: 10px; border-bottom: 1px solid rgba(50, 215, 75, 0.3); padding-bottom: 8px; text-align: center; }
        
        .nav-item {
            padding: 12px; background: rgba(255, 255, 255, 0.03); border-radius: 12px;
            color: #ddd; cursor: pointer; transition: 0.3s; font-size: 13px; text-align: center; border: 1px solid transparent;
        }
        .nav-item:hover { background: rgba(50, 215, 75, 0.1); border-color: #32d74b; color: white; transform: translateX(-5px); }

        /* بنر بالای چت */
        .chat-header-img {
            width: 100%; height: 110px; border-radius: 20px; margin-bottom: 15px;
            background: url('https://img.freepik.com/free-photo/mysterious-castle-fog_23-2151040432.jpg') center/cover;
            display: flex; justify-content: center; align-items: center; border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* گوی بنفش */
        .orb { 
            width: 50px; height: 50px; border-radius: 50%; 
            background: radial-gradient(circle at 30% 30%, #a255ff, #6a00f4); 
            box-shadow: 0 0 30px #6a00f4; animation: rotateOrb 4s infinite linear, pulseOrb 3s infinite ease-in-out;
        }
        @keyframes rotateOrb { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulseOrb { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); box-shadow: 0 0 50px #8a2be2; } }

        #chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px; }
        .msg { padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.6; max-width: 85%; }
        .u { background: rgba(255, 45, 85, 0.2); align-self: flex-start; color: white; border: 1px solid rgba(255, 45, 85, 0.2); border-bottom-left-radius: 2px; }
        .a { background: rgba(255, 255, 255, 0.05); align-self: flex-end; color: #32d74b; border: 1px solid rgba(50, 215, 75, 0.2); border-bottom-right-radius: 2px; }

        .input-box { display: flex; gap: 8px; background: rgba(0, 0, 0, 0.4); padding: 5px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); margin-top: 10px; }
        input { flex: 1; padding: 12px; border: none; background: transparent; color: white; outline: none; font-size: 15px; }
        button { padding: 8px 22px; border-radius: 12px; border: none; background: #32d74b; color: #000; font-weight: bold; cursor: pointer; }

        /* اسکرول بار مخفی */
        #chat::-webkit-scrollbar { width: 3px; }
        #chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        /* واکنشی برای موبایل */
        @media (max-width: 900px) {
            .sidebar { display: none; }
            .main-layout { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="main-layout">
    <div class="sidebar">
        <div class="sidebar-title">مسیر یادگیری</div>
        <div class="nav-item">دوره مقدماتی قانون جذب</div>
        <div class="nav-item">اسرار ناخودآگاه</div>
        <div class="nav-item">مدیتیشن فرکانس بالا</div>
        <div class="nav-item">پکیج پاکسازی کوانتومی</div>
        <div class="nav-item" style="color:#32d74b">🛒 فروشگاه محصولات</div>
    </div>

    <div class="chat-center">
        <div class="chat-header-img">
            <div class="orb"></div>
        </div>
        <h2 style="color:#32d74b; text-align:center; font-size:1.1rem; margin-top:0;">ماورای ذهن ✨</h2>
        <div id="chat">
            <div class="msg a">در حال هماهنگی با ارتعاشات شما...</div>
        </div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="سوالی از آگاهی برتر بپرس..." onkeypress="if(event.keyCode===13)send()">
            <button onclick="send()">ارسال</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-title">اطلاعات جانبی</div>
        <div class="nav-item">سوالات متداول (FAQ)</div>
        <div class="nav-item">درباره پلتفرم</div>
        <div class="nav-item">ارتباط با استاد</div>
        <div class="nav-item">نتایج دانش‌جویان</div>
        <div class="nav-item" style="margin-top:auto; color:#ff2d55; border-color:rgba(255,45,85,0.2)">خروج از حساب</div>
    </div>
</div>

<script>
    let brain = {};

    async function loadBrain() {
        const chatBox = document.getElementById('chat');
        try {
            const response = await fetch('database.txt?v=' + Math.random());
            const data = await response.text();
            data.split('\n').forEach(line => {
                const parts = line.split('|');
                if (parts.length === 2) brain[parts[0].trim()] = parts[1].trim();
            });
            chatBox.innerHTML = '<div class="msg a">اتصال به شبکه ماورایی برقرار شد. خوش آمدی سهیل عزیز.</div>';
        } catch (e) {
            chatBox.innerHTML = '<div class="msg a">در حال بارگذاری دانش...</div>';
        }
    }

    loadBrain();

    function send() {
        const input = document.getElementById('userInput');
        const box = document.getElementById('chat');
        const val = input.value.trim();
        if (!val) return;

        box.innerHTML += `<div class="msg u">${val}</div>`;
        input.value = "";
        box.scrollTop = box.scrollHeight;

        let reply = "";
        for (let key in brain) {
            if (key.length > 5 && val.includes(key)) {
                reply = brain[key];
                break;
            }
        }
        if (!reply) {
            for (let key in brain) {
                if (val.includes(key)) {
                    reply = brain[key];
                    break;
                }
            }
        }
        if (!reply) reply = "فرکانس این سوال در این لحظه مشخص نیست. روی تنفس خود تمرکز کنید و دوباره بپرسید. ✨";

        setTimeout(() => {
            const d = document.createElement('div');
            d.className = 'msg a';
            d.innerText = reply;
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        }, 700);
    }
</script>

</body>
</html>
