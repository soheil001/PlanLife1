<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanLife AI | ماورای ذهن</title>
    <style>
        * { box-sizing: border-box; outline: none; }
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            display: flex; justify-content: center; align-items: center;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .chat-container {
            width: 95%;
            max-width: 600px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        }

        #chat-flow {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 10px;
            scrollbar-width: none;
        }

        .bubble {
            max-width: 85%;
            padding: 14px 20px;
            border-radius: 25px;
            font-size: 0.95rem;
            line-height: 1.7;
            color: white;
            animation: fadeIn 0.3s ease;
        }

        .user-bubble {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.25);
            border-bottom-right-radius: 5px;
        }

        .ai-bubble {
            align-self: flex-end;
            background: rgba(0, 0, 0, 0.2);
            border-bottom-left-radius: 5px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        textarea {
            width: 100%;
            min-height: 130px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            padding: 20px;
            color: white;
            font-size: 1rem;
            resize: none;
            font-family: inherit;
        }

        button {
            background: white;
            color: #e73c7e;
            border: none;
            padding: 15px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { transform: scale(1.02); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="chat-container">
        <div id="chat-flow">
            <div class="bubble ai-bubble">سلام! من دستیار PlanLife هستم. اگر با VPN متصل هستی، سوالت رو بپرس تا با هم بررسی کنیم. ✨</div>
        </div>
        
        <div class="input-area">
            <textarea id="userInput" placeholder="چیزی بنویس..."></textarea>
            <button id="sendBtn" onclick="handleChat()">ارسال به ماورای ذهن</button>
        </div>
    </div>

    <script>
        // از کلید Gemini خودت استفاده کن (همانی که با AIza شروع می‌شد)
        const API_KEY = "AIzaSyCkwqbU9oerrcyEn2wtcIoD_y1O0sp39Zw"; 

        async function handleChat() {
            const inputField = document.getElementById('userInput');
            const chatFlow = document.getElementById('chat-flow');
            const sendBtn = document.getElementById('sendBtn');
            const text = inputField.value.trim();

            if (text === "") return;

            addBubble(text, 'user-bubble');
            inputField.value = "";
            sendBtn.disabled = true;

            const loadingBubble = addBubble("در حال دریافت پاسخ...", 'ai-bubble');

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "تو دستیار انگیزشی سایت PlanLife هستی. کوتاه و مثبت پاسخ بده به: " + text }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    loadingBubble.innerText = "خطا از سمت سرور: " + data.error.message;
                } else {
                    loadingBubble.innerText = data.candidates[0].content.parts[0].text;
                }

            } catch (error) {
                loadingBubble.innerText = "ارتباط برقرار نشد. سهراب جان، مطمئن شو VPN روی کشورهایی مثل آلمان یا آمریکا ست شده باشه.";
                console.error(error);
            } finally {
                sendBtn.disabled = false;
                chatFlow.scrollTop = chatFlow.scrollHeight;
            }
        }

        function addBubble(text, className) {
            const chatFlow = document.getElementById('chat-flow');
            const div = document.createElement('div');
            div.className = `bubble ${className}`;
            div.innerText = text;
            chatFlow.appendChild(div);
            chatFlow.scrollTop = chatFlow.scrollHeight;
            return div;
        }
    </script>
</body>
</html>
