<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0033">
<title>PlanLife</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: 'Vazirmatn', sans-serif;
        overflow-x: hidden;
        color: white;
        background: radial-gradient(circle at center, #1a0033 0%, #000011 70%);
    }

    .stars { position: fixed; inset: 0; background: transparent; z-index: 1; pointer-events: none; }
    .stars::before, .stars::after {
        content: ''; position: absolute; inset: 0;
        background-image: radial-gradient(white 1px, transparent 1px);
        background-size: 80px 80px; opacity: 0.5; animation: twinkle 10s infinite alternate;
    }
    .stars::after { background-size: 140px 140px; opacity: 0.35; animation-duration: 16s; }
    @keyframes twinkle { 0% { opacity: 0.4; } 100% { opacity: 0.75; } }

    .shooting-star { position: absolute; width: 3px; height: 2px; background: white; box-shadow: 0 0 10px white; animation: shoot 5s linear infinite; z-index: 1; }
    @keyframes shoot { 0% { transform: translateX(-200px) translateY(-200px); opacity: 1; } 100% { transform: translateX(1000px) translateY(800px); opacity: 0; } }

    header { position: fixed; top: 0; left: 0; right: 0; height: 65px; display: flex; align-items: center; padding: 0 20px; z-index: 100; background: rgba(0,0,0,0.15); backdrop-filter: blur(10px); }
    .hamburger { font-size: 28px; cursor: pointer; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; }

    .menu-panel {
        position: fixed; top: 65px; right: -280px; width: 260px; height: calc(100% - 65px);
        background: rgba(255,255,255,0.12); backdrop-filter: blur(20px);
        border-radius: 20px 0 0 20px; padding: 25px 20px; transition: 0.4s ease; z-index: 200;
    }
    .menu-panel.active { right: 0; }

    .menu-item { padding: 16px 20px; margin: 12px 0; border-radius: 15px; background: rgba(255,255,255,0.1); font-size: 17px; }
    .menu-item:hover { background: rgba(255,255,255,0.25); }

    .main-center { position: relative; z-index: 5; min-height: 100vh; padding: 75px 20px 100px; display: flex; flex-direction: column; align-items: center; }

    .title { font-size: 38px; font-weight: 700; text-shadow: 0 0 25px rgba(160, 240, 255, 0.9); margin-bottom: 18px; }

    /* چت */
    .chat-container { width: 100%; max-width: 360px; height: 390px; background: rgba(255,255,255,0.13); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.2); border-radius: 28px; display: flex; flex-direction: column; padding: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); margin-bottom: 30px; }
    #chat-output { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
    .msg-bot { align-self: flex-start; background: rgba(255,255,255,0.22); padding: 11px 15px; border-radius: 18px 18px 18px 5px; max-width: 88%; line-height: 1.55; }
    .msg-user { align-self: flex-end; background: rgba(100, 60, 255, 0.78); padding: 11px 15px; border-radius: 18px 18px 5px 18px; max-width: 88%; line-height: 1.55; }

    .input-box { display: flex; background: rgba(255,255,255,0.15); border-radius: 25px; padding: 6px; margin-top: 8px; }
    input { flex: 1; background: transparent; border: none; color: white; font-size: 16.5px; padding: 12px 15px; outline: none; }

    button.send-btn { width: 52px; height: 52px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .orb-send {
        width: 38px; height: 38px; border-radius: 50%;
        background: radial-gradient(circle at 40% 30%, #ffffff, #a0f0ff 40%, #c026d3);
        box-shadow: 0 0 18px #c026d3, inset 0 0 12px rgba(255,255,255,0.9);
        animation: pulseOrb 2.4s ease-in-out infinite;
    }
    @keyframes pulseOrb { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }

    /* خدمات */
    .services-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 360px; }
    .service-box {
        background: rgba(255,255,255,0.13); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.25);
        border-radius: 24px; padding: 15px 10px 12px; text-align: center; cursor: pointer;
        transition: all 0.3s; height: 165px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    }
    .service-box:hover { transform: translateY(-8px); }
    .service-box img { width: 78px; height: 78px; object-fit: cover; border-radius: 18px; border: 2px solid rgba(255,255,255,0.3); }
    .service-box span { font-size: 16.5px; font-weight: 500; }

    /* صفحه پادکست */
    .podcast-page { width: 100%; max-width: 360px; }

    .intro-video-box {
        width: 100%; max-width: 360px; background: rgba(255,255,255,0.12);
        backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.25);
        border-radius: 24px; padding: 12px; margin-bottom: 25px; text-align: center;
    }
    .intro-video-box video { width: 100%; border-radius: 16px; margin-top: 10px; }

    /* اسلاید افقی بهبود یافته */
    .horizontal-scroll {
        display: flex; 
        gap: 15px; 
        overflow-x: auto; 
        padding: 10px 0 20px; 
        scrollbar-width: none; 
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .horizontal-scroll::-webkit-scrollbar { display: none; }

    .slide-item {
        min-width: 130px; 
        text-align: center; 
        cursor: pointer; 
        flex-shrink: 0;
    }
    .slide-item img {
        width: 130px; height: 130px; object-fit: cover; border-radius: 18px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .section-title { font-size: 22px; margin: 20px 0 12px; padding: 0 5px; }

    /* لیست موزیک‌ها */
    .podcast-item {
        background: rgba(255,255,255,0.1); backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.15); border-radius: 18px;
        padding: 12px 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 15px;
        cursor: pointer; margin-left: 8px; margin-right: 8px;
    }
    .podcast-item:hover { background: rgba(255,255,255,0.22); }
    .podcast-item img { width: 55px; height: 55px; object-fit: cover; border-radius: 12px; }
    .music-info { flex: 1; }
    .music-title { font-weight: 500; font-size: 16px; }
    .music-artist { font-size: 14px; opacity: 0.7; }
    .music-duration { font-size: 14px; opacity: 0.6; align-self: center; }
    .play-circle {
        width: 42px; height: 42px; background: linear-gradient(135deg, #00f2fe, #c026d3);
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 15px rgba(192, 38, 211, 0.6); flex-shrink: 0;
    }
    .play-triangle {
        width: 0; height: 0; border-top: 9px solid transparent;
        border-bottom: 9px solid transparent; border-left: 14px solid white;
        margin-left: 3px;
    }

    /* Now Playing */
    .now-playing {
        position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 300;
        display: none; flex-direction: column; align-items: center; padding: 40px 20px 30px;
    }
    .now-playing.active { display: flex; }
    .big-cover { width: 260px; height: 260px; border-radius: 30px; overflow: hidden; box-shadow: 0 20px 50px rgba(192, 38, 211, 0.6); margin-bottom: 30px; }
    .big-cover img { width: 100%; height: 100%; object-fit: cover; }

    .custom-player { width: 100%; max-width: 320px; margin-top: 10px; text-align: center; }
    .progress-container { height: 6px; background: rgba(255,255,255,0.2); border-radius: 10px; margin: 25px 0; position: relative; cursor: pointer; }
    .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ff8c00, #ff5500); border-radius: 10px; box-shadow: 0 0 15px #ff8c00; transition: width 0.1s linear; }

    .time-display { display: flex; justify-content: space-between; font-size: 13px; opacity: 0.7; margin-top: 5px; }

    .controls { display: flex; align-items: center; justify-content: center; gap: 25px; margin: 15px 0; }
    .control-btn { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
    .play-main {
        width: 75px; height: 75px; background: linear-gradient(135deg, #00f2fe, #c026d3);
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 30px rgba(192, 38, 211, 0.7); cursor: pointer;
    }

    .return-btn {
        padding: 14px 40px; background: rgba(255,255,255,0.15); backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.2); border-radius: 50px; color: white;
        font-size: 16px; cursor: pointer; margin-top: 30px;
    }

    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: none; z-index: 150; }
    #overlay.active { display: block; }
</style>
</head>
<body>

<div class="stars"></div>

<header>
    <div class="hamburger" onclick="toggleMenu()">☰</div>
</header>

<div id="sideMenu" class="menu-panel">
    <div class="menu-item" onclick="goToHome()">خانه</div>
    <div class="menu-item">پروفایل</div>
    <div class="menu-item">آمار پیشرفت</div>
    <div class="menu-item">مورد علاقه‌ها</div>
    <div class="menu-item">تنظیمات</div>
</div>

<div id="overlay" onclick="toggleMenu()"></div>

<div class="main-center" id="mainContent">
    <div class="title">PlanLife</div>

    <div class="chat-container" id="chatBox">
        <div id="chat-output"></div>
        <div class="input-box">
            <input id="user-input" placeholder="پیام بده...">
            <button class="send-btn" onclick="sendMessage()">
                <div class="orb-send"></div>
            </button>
        </div>
    </div>

    <div class="services-grid">
        <div class="service-box" onclick="showSection('podcast')">
            <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg" alt="">
            <span>پادکست</span>
        </div>
        <div class="service-box" onclick="showSection('success')">
            <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg" alt="">
            <span>موفقیت</span>
        </div>
        <div class="service-box" onclick="showSection('belief')">
            <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg" alt="">
            <span>باور</span>
        </div>
        <div class="service-box" onclick="showSection('exercise')">
            <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg" alt="">
            <span>تمرینات</span>
        </div>
    </div>
</div>

<!-- Now Playing -->
<div id="nowPlayingScreen" class="now-playing">
    <button onclick="closeNowPlaying()" style="align-self:flex-start; background:none; border:none; color:white; font-size:28px;">←</button>
    
    <div class="big-cover">
        <img id="npCover" src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg" alt="">
    </div>
    
    <h2 id="npTitle" style="margin-bottom:8px; text-align:center;">عنوان پادکست</h2>
    <p id="npSubtitle" style="opacity:0.7; margin-bottom:25px;">PlanLife</p>

    <div class="custom-player">
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>
        <div class="controls">
            <div class="control-btn" onclick="seek(-10)">⤆</div>
            <div onclick="togglePlay()" class="play-main" id="playBtn"></div>
            <div class="control-btn" onclick="seek(10)">⤇</div>
        </div>
    </div>

    <audio id="mainAudio" style="display:none;"></audio>
    
    <button onclick="closeNowPlaying()" class="return-btn">بستن</button>
</div>

<script>
// ستاره‌باران + چت
function createShootingStar() {
    const star = document.createElement('div');
    star.className = 'shooting-star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 60 + '%';
    star.style.animationDuration = (Math.random() * 4 + 4) + 's';
    document.body.appendChild(star);
    setTimeout(() => star.remove(), 10000);
}
setInterval(() => { if (Math.random() > 0.4) createShootingStar(); }, 1000);

const input = document.getElementById("user-input");
const output = document.getElementById("chat-output");

window.onload = () => {
    output.innerHTML += `<div class="msg-bot">سلام خوش اومدی به PlanLife</div>`;
    scrollDown();
};

function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    output.innerHTML += `<div class="msg-user">${text}</div>`;
    input.value = "";
    scrollDown();

    setTimeout(() => {
        output.innerHTML += `<div class="msg-bot">دارم از دل کهکشان برات انرژی می‌فرستم</div>`;
        scrollDown();
    }, 700);
}

function scrollDown() { output.scrollTop = output.scrollHeight; }
input.addEventListener("keypress", e => { if (e.key === "Enter") sendMessage(); });

function toggleMenu() {
    document.getElementById('sideMenu').classList.toggle('active');
    document.getElementById('overlay').classList.toggle('active');
}

// صفحه پادکست
function showSection(section) {
    const main = document.getElementById('mainContent');

    if (section === 'podcast') {
        main.innerHTML = `
            <h2 style="font-size:32px; margin-bottom:15px; text-align:center;">پادکست‌های PlanLife</h2>
            
            <div class="intro-video-box">
                <h3 style="margin-bottom:12px;">🎥 معرفی PlanLife</h3>
                <video controls width="100%" style="border-radius:16px;">
                    <source src="https://persian22.cdn.asset.aparat.com/aparat-video/90c2d8178a340bb05508eb4f8efadac867925565-720p.mp4" type="video/mp4">
                </video>
            </div>

            <div class="section-title">دسته‌بندی‌ها</div>
            <div class="horizontal-scroll" id="categorySlides"></div>

            <div class="section-title" id="currentCategoryTitle">همه پادکست‌ها</div>
            <div id="podcastList"></div>

            <button onclick="goToHome()" class="return-btn">بازگشت به خانه</button>
        `;
        loadPodcastPage();
    } else {
        main.innerHTML = `
            <div style="text-align:center; padding:80px 20px;">
                <h2 style="font-size:28px; margin-bottom:20px;">${getSectionTitle(section)}</h2>
                <p style="opacity:0.9;">این بخش به‌زودی تکمیل می‌شود...</p>
                <button onclick="goToHome()" class="return-btn">بازگشت به خانه</button>
            </div>
        `;
    }
}

function loadPodcastPage() {
    const categories = ["باورهای ثروت", "عشق و روابط", "تحول حال و احساس", "اعتماد به نفس", "احساس لیاقت"];
    let slidesHTML = '';
    categories.forEach(cat => {
        slidesHTML += `
            <div class="slide-item" onclick="selectCategory('${cat}')">
                <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg">
                <p style="margin-top:8px;">${cat}</p>
            </div>`;
    });
    document.getElementById('categorySlides').innerHTML = slidesHTML;
    loadAllMusic();
}

function selectCategory(cat) {
    document.getElementById('currentCategoryTitle').textContent = cat;
    loadMusicByCategory(cat);
}

function loadAllMusic() { loadMusicByCategory(null); }

function loadMusicByCategory(cat) {
    let html = '';
    const cats = cat ? [cat] : ["باورهای ثروت", "عشق و روابط", "تحول حال و احساس", "اعتماد به نفس", "احساس لیاقت"];

    cats.forEach(c => {
        for (let i = 1; i <= 5; i++) {
            const isSpecial = (c === "باورهای ثروت" && i === 1);
            const src = isSpecial ? "https://res.cloudinary.com/dshielkdt/video/upload/q_auto/f_auto/v1779205048/YTDown_YouTube_Media_jrK9TiZ251M_008_128k_jxdssu.mp3" : "#";
            const duration = ["3:45", "4:12", "2:58", "5:05", "3:30"][i-1];
            
            html += `
                <div class="podcast-item" onclick="playPodcast('${c}', ${i}, '${src}')">
                    <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg" alt="">
                    <div class="music-info">
                        <div class="music-title">${c}</div>
                        <div class="music-artist">قسمت ${i}</div>
                    </div>
                    <div class="music-duration">${duration}</div>
                    <div class="play-circle"><div class="play-triangle"></div></div>
                </div>`;
        }
    });
    document.getElementById('podcastList').innerHTML = html;
}

function playPodcast(title, episode, src) {
    const fullTitle = `${title} - قسمت ${episode}`;
    document.getElementById('npTitle').textContent = fullTitle;
    document.getElementById('nowPlayingScreen').classList.add('active');
    
    const audio = document.getElementById('mainAudio');
    audio.src = src;
    audio.play();
    updateProgress();
}

// Progress
const audio = document.getElementById('mainAudio');
const progressBar = document.getElementById('progressBar');
const currentTimeEl = document.getElementById('currentTime');
const durationEl = document.getElementById('duration');

audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
        const progress = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = progress + '%';
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
    }
});

function formatTime(seconds) {
    if (!seconds || isNaN(seconds)) return "0:00";
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min}:${sec < 10 ? '0' : ''}${sec}`;
}

document.getElementById('progressContainer').addEventListener('click', (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    audio.currentTime = percent * audio.duration;
});

function togglePlay() {
    if (audio.paused) {
        audio.play();
        document.getElementById('playBtn').innerHTML = `<span style="font-size:28px;">❚❚</span>`;
    } else {
        audio.pause();
        document.getElementById('playBtn').innerHTML = `<div class="play-triangle" style="margin-left:6px;"></div>`;
    }
}

function seek(seconds) { audio.currentTime += seconds; }

function closeNowPlaying() {
    document.getElementById('nowPlayingScreen').classList.remove('active');
    audio.pause();
}

function getSectionTitle(section) {
    if (section === 'success') return 'داستان‌های موفقیت';
    if (section === 'belief') return 'تقویت باور';
    if (section === 'exercise') return 'تمرینات';
}

function goToHome() { location.reload(); }
</script>
</body>
</html>
