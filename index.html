<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat UI</title>

<style>
* {
    box-sizing: border-box;
    font-family: sans-serif;
}

body {
    margin: 0;
    background: linear-gradient(135deg,#00c4cc,#7d2ae8);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* چت باکس */
.chat-card {
    width: 100%;
    max-width: 400px;
    height: 80vh;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    border-radius: 25px;
    display: flex;
    flex-direction: column;
    padding: 15px;
}

/* پیام‌ها */
#chat-window {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* استایل پیام */
.msg {
    padding: 12px 16px;
    border-radius: 18px;
    max-width: 75%;
    font-size: 14px;
    animation: fade 0.3s ease;
}

/* پیام سیستم (چپ) */
.a {
    align-self: flex-start;
    background: rgba(0,0,0,0.4);
    color: white;
    border-bottom-left-radius: 5px;
    text-align: left;
}

/* پیام کاربر (راست) */
.u {
    align-self: flex-end;
    background: #ff9100;
    color: white;
    border-bottom-right-radius: 5px;
    text-align: right;
}

/* تایپینگ */
.typing {
    align-self: flex-start;
    background: rgba(0,0,0,0.4);
    color: white;
    padding: 10px 15px;
    border-radius: 15px;
    font-size: 13px;
    opacity: 0.7;
}

@keyframes fade {
    from {opacity:0; transform: translateY(10px);}
    to {opacity:1;}
}

/* ورودی */
.input-area {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

input {
    flex: 1;
    border: none;
    padding: 10px;
    border-radius: 15px;
    outline: none;
}

button {
    border: none;
    background: #ff9100;
    color: white;
    padding: 10px 15px;
    border-radius: 15px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="chat-card">
    <div id="chat-window">
        <div class="msg a">سلام 👋 چطور میتونم کمکت کنم؟</div>
    </div>

    <div class="input-area">
        <input id="input" placeholder="پیام بنویس..." 
        onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">ارسال</button>
    </div>
</div>

<script>
const chat = document.getElementById("chat-window");
const input = document.getElementById("input");

/* اضافه کردن پیام */
function addMessage(text, type){
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* تایپینگ */
function showTyping(){
    const t = document.createElement("div");
    t.className = "typing";
    t.id = "typing";
    t.innerText = "در حال تایپ...";
    chat.appendChild(t);
    chat.scrollTop = chat.scrollHeight;
}

function removeTyping(){
    const t = document.getElementById("typing");
    if(t) t.remove();
}

/* ارسال */
function send(){
    const text = input.value.trim();
    if(!text) return;

    addMessage(text,"u");
    input.value = "";

    showTyping();

    setTimeout(()=>{
        removeTyping();
        reply(text);
    },1000);
}

/* جواب ساده */
function reply(text){
    let answer = "متوجه نشدم 🤔";

    if(text.includes("سلام")){
        answer = "سلام رفیق 😎";
    } else if(text.includes("پول")){
        answer = "روی ذهنت کار کن، پول خودش میاد 💰";
    } else if(text.includes("موفقیت")){
        answer = "تمرکز + استمرار = موفقیت 🚀";
    }

    addMessage(answer,"a");
}
</script>

</body>
</html>
