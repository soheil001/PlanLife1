<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; height: 100vh; background: linear-gradient(135deg, #00f2fe, #4facfe, #764ba2, #ff758c); display: flex; flex-direction: column; align-items: center; font-family: -apple-system, sans-serif; overflow: hidden; }

        /* لایه تاری */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(8px); z-index: 1000; display: none; transition: 0.4s; }
        #overlay.active { display: block; }

        .menu-btn { position: fixed; top: 20px; width: 55px; height: 55px; background: rgba(255,255,255,0.25); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; font-size: 28px; z-index: 3000; }
        .left-icon { left: 20px; }
        .right-icon { right: 20px; }

        /* منوها */
        .menu-panel { position: fixed; top: 0; width: 220px; height: 100%; background: rgba(255,255,255,0.1); backdrop-filter: blur(25px); transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); padding-top: 80px; z-index: 2500; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        #leftPanel { left: -220px; }
        #rightPanel { right: -220px; }
        .active-left { left: 0 !important; }
        .active-right { right: 0 !important; }

        /* چت باکس */
        .chat-box { width: calc(100% - 30px); max-width: 380px; height: 420px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); border-radius: 30px; margin-top: 10px; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; }
        
        /* دکمه‌های پایین چت‌باکس */
        .grid-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .btn-small { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); border-radius: 12px; color: white; padding: 8px; font-size: 12px; cursor: pointer; text-align: center; backdrop-filter: blur(5px); }

        #chat-output { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 15px; max-width: 80%; background: rgba(255,255,255,0.2); color: white; }
    </style>
</head>
<body>

    <div id="overlay" onclick="closeAll()"></div>
    <div class="menu-btn left-icon" onclick="toggleMenu('left')">☰</div>
    <div class="menu-btn right-icon" onclick="toggleMenu('right')">☰</div>

    <div id="leftPanel" class="menu-panel">
        <div class="menu-item">خانه</div><div class="menu-item">پروفایل</div><div class="menu-item">تنظیمات</div><div class="menu-item">خروج</div>
    </div>
    <div id="rightPanel" class="menu-panel">
        <div class="menu-item">پروژه‌ها</div><div class="menu-item">اشتراک</div><div class="menu-item">تیم‌ها</div><div class="menu-item">پشتیبانی</div>
    </div>

    <div class="pulse" style="margin-top:60px;"></div>
    <h1 style="color:white; font-size:40px; margin:10px;">PlanLife</h1>

    <div class="chat-box">
        <div id="chat-output"></div>
        <div class="grid-buttons">
            <div class="btn-small">قانون جذب</div>
            <div class="btn-small">پول‌سازی</div>
            <div class="btn-small">باورها</div>
            <div class="btn-small">رشد فردی</div>
            <div class="btn-small">انگیزه</div>
            <div class="btn-small">هدف</div>
        </div>
    </div>

    <script>
        function toggleMenu(side) {
            const left = document.getElementById('leftPanel');
            const right = document.getElementById('rightPanel');
            const overlay = document.getElementById('overlay');
            
            if(side === 'left') {
                right.classList.remove('active-right');
                left.classList.toggle('active-left');
                overlay.classList.toggle('active');
            } else {
                left.classList.remove('active-left');
                right.classList.toggle('active-right');
                overlay.classList.toggle('active');
            }
        }

        function closeAll() {
            document.getElementById('leftPanel').classList.remove('active-left');
            document.getElementById('rightPanel').classList.remove('active-right');
            document.getElementById('overlay').classList.remove('active');
        }
    </script>
</body>
</html>
