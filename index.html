<script>
    let brain = {};

    // لود کردن دیتابیس از فایل خارجی database.txt
    async function loadBrain() {
        const chatBox = document.getElementById('chat');
        try {
            const response = await fetch('database.txt?v=' + Math.random());
            if (!response.ok) throw new Error();
            const data = await response.text();
            
            const lines = data.split('\n');
            lines.forEach(line => {
                const parts = line.split('|');
                if (parts.length === 2) {
                    brain[parts[0].trim()] = parts[1].trim();
                }
            });
            chatBox.innerHTML = '<div class="msg a">اتصال با ماورای ذهن برقرار شد. بپرس...</div>';
        } catch (error) {
            chatBox.innerHTML = '<div class="msg a" style="color:#ff3b30">خطا: فایل دیتابیس پیدا نشد.</div>';
        }
    }

    loadBrain();

    // تابع ارسال پیام (نسخه هوشمند و جایگزین)
    function send() {
        const input = document.getElementById('userInput');
        const box = document.getElementById('chat');
        const val = input.value.trim();
        
        if (!val) return;

        // ۱. نمایش پیام کاربر
        box.innerHTML += `<div class="msg u">${val}</div>`;
        input.value = "";
        box.scrollTop = box.scrollHeight;

        let reply = "";
        
        // ۲. مرحله اول: جستجوی جملات خاص و طولانی (اولویت اول)
        for (let key in brain) {
            if (key.length > 5 && val.includes(key)) {
                reply = brain[key];
                break;
            }
        }

        // ۳. مرحله دوم: اگر جواب خاصی پیدا نشد، جستجوی کلمات کلیدی کوتاه
        if (!reply) {
            for (let key in brain) {
                if (val.includes(key)) {
                    reply = brain[key];
                    break;
                }
            }
        }

        // ۴. مرحله سوم: جواب پیش‌فرض برای موارد ناشناخته
        if (!reply) {
            reply = "فرکانس این سوال نیاز به تامل بیشتر دارد. کلمه دیگری را امتحان کن یا روی باورت تمرکز کن. ✨";
        }

        // ۵. نمایش پاسخ با تاخیر
        setTimeout(() => {
            const replyDiv = document.createElement('div');
            replyDiv.className = 'msg a';
            replyDiv.innerText = reply;
            box.appendChild(replyDiv);
            box.scrollTop = box.scrollHeight;
        }, 600);
    }
</script>
