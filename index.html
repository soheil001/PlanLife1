<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<title>PlanLife</title>
<style>
    html, body {
        margin: 0;
        height: 100%;
        font-family: 'Vazirmatn', sans-serif;
        overflow: hidden;
        color: white;
    }

    /* === پس‌زمینه کهکشانی === */
    body {
        background: radial-gradient(circle at center, #1a0033 0%, #000011 70%);
        position: relative;
    }

    /* ستاره‌های ثابت */
    .stars {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: transparent;
        z-index: 1;
        pointer-events: none;
    }

    .stars::before,
    .stars::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: transparent;
        animation: twinkle 8s infinite alternate;
    }

    .stars::before {
        background-image: radial-gradient(white 1px, transparent 1px);
        background-size: 80px 80px;
        opacity: 0.6;
    }

    .stars::after {
        background-image: radial-gradient(white 1px, transparent 1px);
        background-size: 120px 120px;
        opacity: 0.4;
        animation-duration: 12s;
    }

    /* ستاره‌باران ملایم */
    .shooting-star {
        position: absolute;
        width: 3px;
        height: 3px;
        background: white;
        border-radius: 50%;
        box-shadow: 0 0 8px white;
        animation: shoot 4s linear infinite;
        z-index: 1;
    }

    @keyframes shoot {
        0% { transform: translateX(-100px) translateY(-100px); opacity: 1; }
        100% { transform: translateX(800px) translateY(800px); opacity: 0; }
    }

    /* گوی ماورایی چرخان */
    .mystic-orb-container {
        position: relative;
        width: 140px;
        height: 140px;
        margin: 30px auto 10px;
        z-index: 10;
    }

    .mystic-orb {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 30%, #ffffff, #a0f0ff 20%, #6b4eff 50%, #c026d3 80%, #4b0082);
        box-shadow: 
            0 0 60px #a0f0ff,
            0 0 120px #c026d3,
            inset 0 0 40px rgba(255,255,255,0.9),
            inset 0 30px 40px rgba(255,255,255,0.4);
        animation: rotateOrb 25s linear infinite;
        position: relative;
    }

    .mystic-orb::after {
        content: '';
        position: absolute;
        top: 15%;
        left: 25%;
        width: 25px;
        height: 25px;
        background: rgba(255,255,255,0.7);
        border-radius: 50%;
        filter: blur(8px);
    }

    @keyframes rotateOrb {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    .title {
        color: white;
        font-size: 42px;
        font-weight: 700;
        text-shadow: 0 0 30px rgba(160, 240, 255, 0.8);
        margin-bottom: 20px;
        z-index: 10;
    }

    /* بقیه استایل‌ها مشابه قبل (کمی تمیزتر) */
    .main-center {
        position: relative;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
    }

    .chat-container {
        width: calc(100% - 40px);
        max-width: 360px;
        height: 420px;
        background: rgba(255,255,255,0.12);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 28px;
        display: flex;
        flex-direction: column;
        padding: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        transition: 0.4s;
    }

    .chat-container.active {
        height: 65vh;
    }

    #chat-output {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .msg-user {
        align-self: flex-end;
        background: rgba(100, 50, 255, 0.7);
        color: white;
        padding: 10px 14px;
        border-radius: 18px 18px 4px 18px;
        max-width: 75%;
    }

    .msg-bot {
        align-self: flex-start;
        background: rgba(255,255,255,0.2);
        color: white;
        padding: 10px 14px;
        border-radius: 18px 18px 18px 4px;
        max-width: 75%;
    }

    .input-box {
        display: flex;
        background: rgba(255,255,255,0.15);
        border-radius: 25px;
        padding: 6px;
        margin-top: 8px;
    }

    input {
        flex: 1;
        border: none;
        background: transparent;
        color: white;
        font-size: 16px;
        padding: 12px;
        outline: none;
    }

    button {
        width: 42px;
        height: 42px;
        border: none;
        background: linear-gradient(135deg, #a0f0ff, #c026d3);
        color: white;
        border-radius: 50%;
        font-size: 18px;
        cursor: pointer;
    }

    .grid-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        width: calc(100% - 40px);
        max-width: 360px;
        margin-top: 20px;
    }

    .btn-square {
        aspect-ratio: 1;
        border-radius: 20px;
        background: rgba(255,255,255,0.12);
        backdrop-filter: blur(10px);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 18px;
        border: 1px solid rgba(255,255,255,0.1);
    }

    /* منو و overlay همان قبلی */
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(6px); display: none; z-index: 1000; }
    #overlay.active { display: block; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div id="overlay" onclick="closeAll()"></div>

<div class="main-center">
    <div class="mystic-orb-container">
        <div class="mystic-orb"></div>
    </div>
    <div class="title">PlanLife</div>

    <div class="chat-container" id="chatBox">
        <div id="chat-output"></div>
        <div class="input-box">
            <input id="user-input" placeholder="پیام بده...">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <div class="grid-buttons">
        <div class="btn-square" onclick="quickMsg('انگیزه')">انگیزه</div>
        <div class="btn-square" onclick="quickMsg('هدف')">هدف</div>
        <div class="btn-square" onclick="quickMsg('پول')">پول</div>
        <div class="btn-square" onclick="quickMsg('رشد')">رشد</div>
    </div>
</div>

<script>
// ستاره‌باران
function createShootingStar() {
    const star = document.createElement('div');
    star.className = 'shooting-star';
    
    const left = Math.random() * 70 + '%';
    star.style.left = left;
    star.style.top = Math.random() * 40 + '%';
    star.style.animationDuration = (Math.random() * 3 + 3) + 's';
    star.style.opacity = Math.random() * 0.7 + 0.5;
    
    document.body.appendChild(star);
    
    setTimeout(() => star.remove(), 8000);
}

setInterval(() => {
    if (Math.random() > 0.4) createShootingStar();
}, 800);

// بقیه کدهای قبلی
const input = document.getElementById("user-input");
const output = document.getElementById("chat-output");
const chatBox = document.getElementById("chatBox");

window.onload = () => {
    output.innerHTML += `<div class="msg-bot">سلام 👋 به کهکشان PlanLife خوش اومدی 🌌</div>`;
    scrollDown();
};

function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    output.innerHTML += `<div class="msg-user">${text}</div>`;
    input.value = "";

    setTimeout(() => {
        output.innerHTML += `<div class="msg-bot">دارم از دل کهکشان برات جواب می‌گیرم ✨</div>`;
        scrollDown();
    }, 700);

    scrollDown();
}

function quickMsg(t) {
    input.value = t;
    sendMessage();
}

function scrollDown() {
    output.scrollTop = output.scrollHeight;
}

input.addEventListener("keypress", e => { if (e.key === "Enter") sendMessage(); });
input.addEventListener("focus", () => chatBox.classList.add("active"));
input.addEventListener("blur", () => chatBox.classList.remove("active"));

// منوها
function toggleMenu(side) { /* همان کد قبلی */ }
function closeAll() { /* همان کد قبلی */ }
</script>
</body>
</html>
