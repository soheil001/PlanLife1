<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0033">

<!-- PWA Settings for iOS and Add to Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PlanLife">
<link rel="apple-touch-icon" href="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg">
<link rel="manifest" href="data:application/manifest+json,{
  &quot;name&quot;: &quot;PlanLife&quot;,
  &quot;short_name&quot;: &quot;PlanLife&quot;,
  &quot;start_url&quot;: &quot;.&quot;,
  &quot;display&quot;: &quot;standalone&quot;,
  &quot;background_color&quot;: &quot;#030303&quot;,
  &quot;theme_color&quot;: &quot;#1a0033&quot;,
  &quot;orientation&quot;: &quot;portrait&quot;,
  &quot;icons&quot;: [
    {
      &quot;src&quot;: &quot;https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg&quot;,
      &quot;sizes&quot;: &quot;192x192&quot;,
      &quot;type&quot;: &quot;image/png&quot;
    },
    {
      &quot;src&quot;: &quot;https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg&quot;,
      &quot;sizes&quot;: &quot;512x512&quot;,
      &quot;type&quot;: &quot;image/png&quot;
    }
  ]
}">

<title>PlanLife</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: 'Vazirmatn', sans-serif;
        overflow-x: hidden;
        color: white;
        background: #030303;
    }

    .stars { position: fixed; inset: 0; background: transparent; z-index: 1; pointer-events: none; }
    .stars::before, .stars::after {
        content: ''; position: absolute; inset: 0;
        background-image: radial-gradient(white 1px, transparent 1px);
        background-size: 80px 80px; opacity: 0.45; animation: twinkle 10s infinite alternate;
    }
    .stars::after { background-size: 140px 140px; opacity: 0.3; animation-duration: 16s; }
    @keyframes twinkle { 0% { opacity: 0.35; } 100% { opacity: 0.65; } }

    header { position: fixed; top: 0; left: 0; right: 0; height: 65px; display: flex; align-items: center; padding: 0 20px; z-index: 100; background: rgba(0,0,0,0.25); backdrop-filter: blur(10px); }
    .hamburger { font-size: 28px; cursor: pointer; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; }

    .menu-panel {
        position: fixed; top: 65px; right: -280px; width: 260px; height: calc(100% - 65px);
        background: rgba(255,255,255,0.12); backdrop-filter: blur(20px);
        border-radius: 20px 0 0 20px; padding: 25px 20px; transition: 0.4s ease; z-index: 200;
    }
    .menu-panel.active { right: 0; }

    .menu-item { padding: 16px 20px; margin: 12px 0; border-radius: 15px; background: rgba(255,255,255,0.1); font-size: 17px; }
    .menu-item:hover { background: rgba(255,255,255,0.25); }

    .main-center { position: relative; z-index: 5; min-height: 100vh; padding: 75px 20px 120px; display: flex; flex-direction: column; align-items: center; }

    .title { font-size: 38px; font-weight: 700; text-shadow: 0 0 25px rgba(160, 240, 255, 0.9); margin-bottom: 18px; }

    .chat-container, .service-box, .slide-item, .podcast-item, .modal-content, .support-item, .input-box, .play-main, .music-box {
        border: 1px solid rgba(212, 175, 55, 0.55) !important;
        box-shadow: 0 10px 40px rgba(0,0,0,0.6),
                    0 0 25px rgba(212, 175, 55, 0.25);
    }

    .chat-container { 
        width: 100%; max-width: 360px; height: 390px; 
        background: rgba(255,255,255,0.11); backdrop-filter: blur(16px); 
        border-radius: 28px; 
        display: flex; flex-direction: column; padding: 12px; 
        margin-bottom: 30px; 
        position: relative;
    }
    .chat-container::before {
        content: '';
        position: absolute;
        inset: -12px;
        background: radial-gradient(circle at center, rgba(255, 136, 0, 0.35), transparent 70%);
        z-index: -1;
        filter: blur(18px);
        border-radius: 32px;
        opacity: 0.6;
    }

    #chat-output { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
    .msg-bot { align-self: flex-start; background: rgba(255,255,255,0.22); padding: 11px 15px; border-radius: 18px 18px 18px 5px; max-width: 88%; line-height: 1.55; }
    .msg-user { align-self: flex-end; background: rgba(100, 60, 255, 0.78); padding: 11px 15px; border-radius: 18px 18px 5px 18px; max-width: 88%; line-height: 1.55; }

    .input-box { 
        display: flex; background: rgba(255,255,255,0.13); border-radius: 25px; padding: 6px; margin-top: 8px; 
        position: relative;
    }
    .input-box::before {
        content: '';
        position: absolute;
        inset: -8px;
        background: radial-gradient(circle at center, rgba(255, 136, 0, 0.4), transparent 65%);
        z-index: -1;
        filter: blur(12px);
        border-radius: 33px;
    }
    input { flex: 1; background: transparent; border: none; color: white; font-size: 16.5px; padding: 12px 15px; outline: none; }

    button.send-btn { width: 52px; height: 52px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .orb-send {
        width: 38px; height: 38px; border-radius: 50%;
        background: radial-gradient(circle at 40% 30%, #ffffff, #a0f0ff 40%, #c026d3);
        box-shadow: 0 0 18px #c026d3, inset 0 0 12px rgba(255,255,255,0.9);
        animation: pulseOrb 2.4s ease-in-out infinite;
    }
    @keyframes pulseOrb { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }

    .services-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 360px; }
    .service-box {
        background: rgba(255,255,255,0.11); backdrop-filter: blur(16px); 
        border-radius: 24px; padding: 15px 10px 12px; text-align: center; cursor: pointer;
        transition: all 0.3s; height: 230px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
        position: relative;
    }
    .service-box::before {
        content: '';
        position: absolute;
        inset: -10px;
        background: radial-gradient(circle at center, rgba(255, 136, 0, 0.45), transparent 70%);
        z-index: -1;
        filter: blur(20px);
        border-radius: 30px;
        opacity: 0.55;
    }
    .service-box:hover { transform: translateY(-8px); }
    .service-box img { width: 145px; height: 145px; object-fit: cover; border-radius: 18px; border: 2px solid rgba(255,255,255,0.3); }
    .service-box span { font-size: 16.5px; font-weight: 500; }

    .horizontal-scroll {
        display: flex; gap: 15px; overflow-x: auto; padding: 12px 0 25px; 
        scrollbar-width: none; -webkit-overflow-scrolling: touch;
        width: 100%; max-width: 360px;
    }
    .horizontal-scroll::-webkit-scrollbar { display: none; }

    .slide-item {
        min-width: 140px; flex-shrink: 0; text-align: center; cursor: pointer;
        background: rgba(255,255,255,0.11); backdrop-filter: blur(12px);
        border-radius: 18px; padding: 10px 8px;
        position: relative;
    }
    .slide-item::before {
        content: '';
        position: absolute;
        inset: -8px;
        background: radial-gradient(circle at center, rgba(255, 136, 0, 0.4), transparent 65%);
        z-index: -1;
        filter: blur(16px);
        border-radius: 24px;
    }
    .slide-item img { width: 130px; height: 130px; object-fit: cover; border-radius: 18px; margin-bottom: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }

    .section-title { font-size: 22px; margin: 20px 0 12px; padding: 0 5px; }

    .podcast-item {
        background: rgba(255,255,255,0.1); backdrop-filter: blur(12px);
        border-radius: 18px;
        padding: 12px 15px; margin-bottom: 70px; display: flex; align-items: center; gap: 15px;
        cursor: pointer; position: relative;
    }
    .podcast-item::before {
        content: '';
        position: absolute;
        inset: -10px;
        background: radial-gradient(circle at center, rgba(255, 136, 0, 0.35), transparent 70%);
        z-index: -1;
        filter: blur(18px);
        border-radius: 26px;
        opacity: 0.5;
    }

    .podcast-item img { width: 55px; height: 55px; object-fit: cover; border-radius: 12px; }
    .music-info { flex: 1; }
    .music-title { font-weight: 500; font-size: 16px; }
    .music-artist { font-size: 14px; opacity: 0.7; }
    .music-duration { font-size: 14px; opacity: 0.6; align-self: center; }

    .play-circle {
        width: 42px; height: 42px;
        background: rgba(255,255,255,0.15);
        border: 2px solid rgba(255,255,255,0.6);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s;
    }
    .podcast-item:hover .play-circle {
        background: #c026d3;
        border-color: white;
        transform: scale(1.1);
    }
    .play-triangle {
        width: 0; height: 0;
        border-top: 8px solid transparent;
        border-bottom: 8px solid transparent;
        border-left: 14px solid white;
        margin-left: 3px;
    }

    .music-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        width: 100%;
        max-width: 360px;
    }
    .music-box {
        background: rgba(255,255,255,0.11); 
        backdrop-filter: blur(16px);
        border-radius: 22px;
        padding: 12px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
        position: relative;
    }
    .music-box:hover { transform: translateY(-6px); }
    .music-cover {
        width: 100%;
        aspect-ratio: 1/1;
        border-radius: 18px;
        object-fit: cover;
        margin-bottom: 12px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }
    .music-name {
        font-size: 15.5px;
        font-weight: 500;
        margin-bottom: 10px;
        line-height: 1.4;
    }
    .play-btn-yellow {
        width: 48px;
        height: 48px;
        background: #ffd700;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        box-shadow: 0 4px 15px rgba(255, 215, 0, 0.5);
    }
    .play-btn-yellow .play-icon {
        width: 0; 
        height: 0;
        border-top: 10px solid transparent;
        border-bottom: 10px solid transparent;
        border-left: 16px solid #1a0033;
        margin-left: 3px;
    }

    /* مجله */
    .magazine-icon {
        width: 48px;
        height: 48px;
        background: #c026d3;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        font-size: 26px;
        box-shadow: 0 4px 15px rgba(192, 38, 211, 0.6);
    }

    #articleModal {
        position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 500;
        display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .article-content {
        background: rgba(255,255,255,0.11); backdrop-filter: blur(20px);
        border-radius: 24px;
        padding: 30px 25px; width: 100%; max-width: 360px; max-height: 85vh;
        overflow-y: auto;
        box-shadow: 0 15px 40px rgba(0,0,0,0.7);
        position: relative;
    }
    .article-content h2 {
        font-size: 24px;
        margin-bottom: 20px;
        text-align: center;
        color: #ffd700;
    }
    .article-content .article-body {
        line-height: 1.8;
        font-size: 16px;
        opacity: 0.95;
        text-align: justify;
    }

    #subscriptionModal, #supportModal {
        position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 400;
        display: none; align-items: center; justify-content: center;
    }
    .modal-content {
        background: rgba(255,255,255,0.11); backdrop-filter: blur(20px);
        border-radius: 24px;
        padding: 30px 25px; width: 90%; max-width: 360px; text-align: center;
        box-shadow: 0 15px 40px rgba(0,0,0,0.7);
        position: relative;
    }
    .modal-content::before {
        content: '';
        position: absolute;
        inset: -15px;
        background: radial-gradient(circle at center, rgba(255, 136, 0, 0.4), transparent 70%);
        z-index: -1;
        filter: blur(25px);
        border-radius: 36px;
    }
    .status-icon { font-size: 70px; margin-bottom: 15px; }
    .success { color: #00ff88; }
    .error { color: #ff3366; }
    .modal-title { font-size: 22px; margin: 10px 0; font-weight: 700; }
    .reasons { text-align: right; font-size: 15px; margin: 20px 0; line-height: 1.8; opacity: 0.9; }
    .glass-btn {
        width: 100%; padding: 14px; background: rgba(255,255,255,0.15);
        color: white; border: 1px solid rgba(212, 175, 55, 0.5); border-radius: 14px;
        font-weight: 600; cursor: pointer; margin-top: 10px;
        position: relative;
    }
    .glass-btn:hover { background: rgba(255,255,255,0.25); }

    .support-item {
        display: flex;
        align-items: center;
        gap: 15px;
        background: rgba(255,255,255,0.1);
        padding: 18px 20px;
        border-radius: 16px;
        margin: 12px 0;
        cursor: pointer;
        transition: all 0.3s;
        position: relative;
    }
    .support-item::before {
        content: '';
        position: absolute;
        inset: -8px;
        background: radial-gradient(circle at center, rgba(255, 136, 0, 0.35), transparent 70%);
        z-index: -1;
        filter: blur(16px);
        border-radius: 22px;
    }
    .support-item:hover {
        background: rgba(255,255,255,0.25);
        transform: translateY(-3px);
    }
    .support-logo {
        width: 50px;
        height: 50px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
    }

    .now-playing {
        position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 300;
        display: none; flex-direction: column; align-items: center; padding: 40px 20px 30px;
    }
    .now-playing.active { display: flex; }

    .big-cover {
        position: relative;
        margin: 20px 0 40px;
    }
    .big-cover::after {
        content: '';
        position: absolute;
        inset: -40px;
        background: radial-gradient(circle, rgba(255, 136, 0, 0.6), transparent 70%);
        filter: blur(40px);
        opacity: 0.45;
        z-index: -1;
        border-radius: 50%;
        animation: glow 4s ease-in-out infinite alternate;
    }
    @keyframes glow { from { opacity: 0.35; } to { opacity: 0.6; } }

    .big-cover img {
        width: 280px;
        height: 280px;
        object-fit: cover;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        border: 3px solid rgba(212, 175, 55, 0.4);
    }

    .custom-player {
        width: 100%;
        max-width: 340px;
    }

    .time-display {
        display: flex;
        justify-content: space-between;
        font-size: 13.5px;
        opacity: 0.8;
        margin-bottom: 8px;
    }

    .progress-container {
        height: 7px;
        background: rgba(255,255,255,0.2);
        border-radius: 10px;
        margin-bottom: 25px;
        overflow: hidden;
        cursor: pointer;
        box-shadow: 0 0 8px rgba(255, 136, 0, 0.3);
    }
    .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(to right, #c026d3, #ff8800);
        transition: width 0.1s linear;
        box-shadow: 0 0 12px #ff8800;
    }

    .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        margin-top: 10px;
    }
    .control-btn {
        font-size: 32px;
        cursor: pointer;
        padding: 10px;
        user-select: none;
    }
    .play-main {
        width: 82px;
        height: 82px;
        background: rgba(255,255,255,0.12);
        backdrop-filter: blur(12px);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 0 35px rgba(192, 38, 211, 0.6);
        transition: all 0.3s;
        position: relative;
    }
    .play-main::before {
        content: '';
        position: absolute;
        inset: -12px;
        background: radial-gradient(circle at center, rgba(255, 136, 0, 0.45), transparent 60%);
        z-index: -1;
        filter: blur(22px);
        border-radius: 50%;
    }
    .play-main:hover {
        transform: scale(1.1);
        background: rgba(255,255,255,0.25);
    }
    .play-icon {
        width: 0; height: 0;
        border-top: 13px solid transparent;
        border-bottom: 13px solid transparent;
        border-left: 22px solid white;
    }
</style>
</head>
<body>

<div class="stars"></div>

<header>
    <div class="hamburger" onclick="toggleMenu()">☰</div>
</header>

<div id="sideMenu" class="menu-panel">
    <div class="menu-item" onclick="goToHome()">خانه</div>
    <div class="menu-item">پروفایل</div>
    <div class="menu-item">آمار پیشرفت</div>
    <div class="menu-item">مورد علاقه‌ها</div>
    <div class="menu-item">تنظیمات</div>
</div>

<div class="main-center" id="mainContent">
    <div class="title">PlanLife</div>

    <div class="chat-container">
        <div id="chat-output"></div>
        <div class="input-box">
            <input id="user-input" placeholder="پیام بده...">
            <button class="send-btn" onclick="sendMessage()">
                <div class="orb-send"></div>
            </button>
        </div>
    </div>

    <div class="services-grid">
        <div class="service-box" onclick="showSection('podcast')"><img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779450993/phonto_jmcfqk.png" alt=""><span>پادکست رایگان </span></div>
        <div class="service-box" onclick="showSection('courses')"><img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg" alt=""><span>دوره ها</span></div>
        <div class="service-box" onclick="showSection('music')"><img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779454037/IMG_0213_mrxvu1.png" alt=""><span>موزیک ها</span></div>
        <div class="service-box" onclick="showSection('exercise')"><img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779454914/IMG_0217_fnjv9i.jpg" alt=""><span> تمرینات مجازی</span></div>
        <div class="service-box" onclick="showSection('magazine')"><img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg" alt=""><span>مجله ماورایی 📰</span></div>
    </div>
</div>

<!-- Modal مقاله مجله -->
<div id="articleModal">
    <div class="article-content">
        <button onclick="closeArticleModal()" style="position:absolute; top:15px; left:15px; background:none; border:none; color:white; font-size:28px;">✕</button>
        <h2 id="articleTitle"></h2>
        <div class="article-body" id="articleBody"></div>
        <button onclick="closeArticleModal()" class="glass-btn" style="margin-top:25px;">بستن</button>
    </div>
</div>

<!-- Modal اشتراک -->
<div id="subscriptionModal">
    <div class="modal-content" id="modalContent"></div>
</div>

<!-- Modal پشتیبانی -->
<div id="supportModal">
    <div class="modal-content">
        <h3 style="margin-bottom:25px;">📞 ارتباط با پشتیبانی</h3>
        
        <div class="support-item" onclick="window.open('https://t.me/planlifeir', '_blank')">
            <div class="support-logo" style="background:#229ED9; color:white;">🇹</div>
            <div style="font-weight:600; font-size:18px;">تلگرام</div>
        </div>

        <div class="support-item" onclick="window.open('https://wa.me/905437333582', '_blank')">
            <div class="support-logo" style="background:#25D366; color:white;">🇼</div>
            <div style="font-weight:600; font-size:18px;">واتساپ</div>
        </div>

        <div class="support-item" onclick="window.open('https://ble.ir/planlifeir', '_blank')">
            <div class="support-logo" style="background:#00B2A9; color:white;">🇧</div>
            <div style="font-weight:600; font-size:18px;">بله</div>
        </div>

        <button onclick="closeSupportModal()" class="glass-btn" style="margin-top:25px;">بستن</button>
    </div>
</div>

<!-- Now Playing -->
<div id="nowPlayingScreen" class="now-playing">
    <button onclick="closeNowPlaying()" style="align-self:flex-start; background:none; border:none; color:white; font-size:32px;">←</button>
    
    <div class="big-cover">
        <img id="npCover" src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg" alt="">
    </div>
    
    <h2 id="npTitle" style="margin-bottom:8px; text-align:center;">عنوان</h2>
    <p id="npSubtitle" style="opacity:0.7; margin-bottom:30px;">PlanLife</p>

    <div class="custom-player">
        <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="controls">
            <div class="control-btn" onclick="seek(-15)">⤆</div>
            <div onclick="togglePlay()" class="play-main" id="playBtn">
                <div class="play-icon" id="playIcon"></div>
            </div>
            <div class="control-btn" onclick="seek(15)">⤇</div>
        </div>

function loadMagazinePage() {

        html += `

                <img src="${article.cover}" class="music-cover" alt="${article.title}">

}

function showArticle(id) {
    const article = magazineData.find(a => a.id === id);
    if (!article) return;

    document.getElementById('articleTitle').textContent = article.title;
    const bodyDiv = document.getElementById('articleBody');
    
    bodyDiv.innerHTML = `<div style="text-align:center; padding:60px 20px; opacity:0.7;">در حال بارگذاری مقاله...</div>`;
    document.getElementById('articleModal').style.display = 'flex';

    if (article.url && article.url.trim() !== "") {
        fetch(article.url)
            .then(response => {
                if (!response.ok) throw new Error('خطا در بارگذاری');
                return response.text();
            })
            .then(html => {
                bodyDiv.innerHTML = html;
            })
            .catch(err => {
                bodyDiv.innerHTML = `<p style="color:#ff6666; text-align:center; padding:40px;">❌ نتوانستیم مقاله را بارگذاری کنیم.<br>لطفاً بعداً تلاش کنید.</p>`;
                console.error(err);
            });
    } else {
        bodyDiv.innerHTML = `<p style="text-align:center; padding:40px; opacity:0.7;">لینک مقاله هنوز تنظیم نشده است.</p>`;
    }
}

function loadPage(type) {
    const categories = ["دوره کارگاه ثروتسازی", "دوره عشق و روابط", "دوره تحول حال و احساس", "دوره اعتماد به نفس", "دوره احساس لیاقت"];

    loadItems(null, type);
}

function selectCat(cat, type) {
    document.getElementById('currentCategoryTitle').textContent = cat;
    loadItems(cat, type);
}

function loadItems(cat, type) {
    let html = '';
    const cats = cat ? [cat] : ["دوره کارگاه ثروتسازی", "دوره عشق و روابط", "دوره تحول حال و احساس", "دوره اعتماد به نفس", "دوره احساس لیاقت"];
    const dataSource = type === 'courses' ? courseData : podcastData;

    cats.forEach(c => {
        const filtered = dataSource.filter(item => item.title === c);
        filtered.forEach(item => {
            const func = type === 'courses' ? 'playCourse' : 'playPodcast';
            const duration = ["32:45", "43:12", "21:58", "35:05", "33:30"][(item.episode-1) % 5];
            html += `
                <div class="podcast-item" onclick="${func}('${item.title}', ${item.episode}, '${item.src}', '${item.cover}')">
                    <img src="${item.cover}" alt="">
                    <div class="music-info">
                        <div class="music-title">${item.title}</div>
                        <div class="music-artist">قسمت ${item.episode}</div>
                    </div>
                    <div class="music-duration">${duration}</div>
                    <div class="play-circle"><div class="play-triangle"></div></div>
                </div>`;
        });
    });
    document.getElementById('podcastList').innerHTML = html || '<p style="text-align:center; padding:40px; opacity:0.7;">موردی یافت نشد</p>';
}

// پخش‌کننده
const audio = document.getElementById('mainAudio');
const progressBar = document.getElementById('progressBar');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const progressContainer = document.getElementById('progressContainer');
const playBtn = document.getElementById('playBtn');

function formatTime(seconds) {
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min}:${sec < 10 ? '0' : ''}${sec}`;
}

function updateProgress() {
    if (!audio.duration) return;
    const progress = (audio.currentTime / audio.duration) * 100;
    progressBar.style.width = `${progress}%`;
    currentTimeEl.textContent = formatTime(audio.currentTime);
    totalTimeEl.textContent = formatTime(audio.duration);
}

audio.addEventListener('timeupdate', updateProgress);
audio.addEventListener('loadedmetadata', () => {
    totalTimeEl.textContent = formatTime(audio.duration);
});

progressContainer.addEventListener('click', (e) => {
    const rect = progressContainer.getBoundingClientRect();
    const pos = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pos * audio.duration;
});

function togglePlay() {
    if (audio.paused) {
        audio.play();
        playBtn.innerHTML = `<span style="font-size:28px; color:white;">❚❚</span>`;
    } else {
        audio.pause();
        playBtn.innerHTML = `<div class="play-icon" id="playIcon"></div>`;
    }
}

function seek(seconds) {
    audio.currentTime += seconds;
}

function closeNowPlaying() {
    document.getElementById('nowPlayingScreen').classList.remove('active');
    audio.pause();
}

function playAudio(title, src, cover) {
    document.getElementById('npTitle').textContent = title;
    document.getElementById('npCover').src = cover;
    document.getElementById('nowPlayingScreen').classList.add('active');
    
    const audioEl = document.getElementById('mainAudio');
    audioEl.src = src;
    audioEl.play().catch(() => {});
}
