<script>
    let knowledgeBase = {};

    // خواندن اطلاعات از فایل جداگانه
    fetch('data.json')
        .then(response => response.json())
        .then(data => {
            knowledgeBase = data;
            console.log("بانک اطلاعاتی با موفقیت لود شد.");
        });

    function send() {
        const input = document.getElementById('userInput');
        const box = document.getElementById('chat');
        const text = input.value.trim();
        if (!text) return;

        box.innerHTML += `<div class="msg u">${text}</div>`;
        input.value = "";

        let reply = "فرکانس دریافت شد. روی باورهات تمرکز کن. ✨";
        
        // جستجو در بانک لود شده
        for (let key in knowledgeBase) {
            if (text.includes(key)) {
                reply = knowledgeBase[key];
                break;
            }
        }

        setTimeout(() => {
            box.innerHTML += `<div class="msg a">${reply}</div>`;
            box.scrollTop = box.scrollHeight;
        }, 800);
    }
</script>
