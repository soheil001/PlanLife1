<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<title>PlanLife</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: 'Vazirmatn', sans-serif;
        overflow-x: hidden;
        color: white;
        background: radial-gradient(circle at center, #1a0033 0%, #000011 70%);
    }

    .stars { position: fixed; inset: 0; background: transparent; z-index: 1; pointer-events: none; }
    .stars::before, .stars::after {
        content: ''; position: absolute; inset: 0;
        background-image: radial-gradient(white 1px, transparent 1px);
        background-size: 80px 80px; opacity: 0.5; animation: twinkle 10s infinite alternate;
    }
    .stars::after { background-size: 140px 140px; opacity: 0.35; animation-duration: 16s; }
    @keyframes twinkle { 0% { opacity: 0.4; } 100% { opacity: 0.75; } }

    .shooting-star { position: absolute; width: 3px; height: 2px; background: white; box-shadow: 0 0 10px white; animation: shoot 5s linear infinite; z-index: 1; }
    @keyframes shoot { 0% { transform: translateX(-200px) translateY(-200px); opacity: 1; } 100% { transform: translateX(1000px) translateY(800px); opacity: 0; } }

    header { position: fixed; top: 0; left: 0; right: 0; height: 65px; display: flex; align-items: center; padding: 0 20px; z-index: 100; background: rgba(0,0,0,0.15); backdrop-filter: blur(10px); }
    .hamburger { font-size: 30px; cursor: pointer; padding: 8px; border-radius: 50%; background: rgba(255,255,255,0.1); }

    .main-center { position: relative; z-index: 5; min-height: 100vh; padding: 75px 20px 100px; display: flex; flex-direction: column; align-items: center; }

    .title { font-size: 38px; font-weight: 700; text-shadow: 0 0 25px rgba(160, 240, 255, 0.9); margin-bottom: 18px; }

    /* چت و دکمه ارسال */
    .chat-container { width: 100%; max-width: 360px; height: 390px; background: rgba(255,255,255,0.13); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.2); border-radius: 28px; display: flex; flex-direction: column; padding: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); margin-bottom: 30px; }
    #chat-output { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
    .msg-bot { align-self: flex-start; background: rgba(255,255,255,0.22); padding: 11px 15px; border-radius: 18px 18px 18px 5px; max-width: 88%; line-height: 1.55; }
    .msg-user { align-self: flex-end; background: rgba(100, 60, 255, 0.78); padding: 11px 15px; border-radius: 18px 18px 5px 18px; max-width: 88%; line-height: 1.55; }

    .input-box { display: flex; background: rgba(255,255,255,0.15); border-radius: 25px; padding: 6px; margin-top: 8px; }
    input { flex: 1; background: transparent; border: none; color: white; font-size: 16.5px; padding: 12px 15px; outline: none; }

    button { width: 52px; height: 52px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .orb-send {
        width: 38px; height: 38px; border-radius: 50%;
        background: radial-gradient(circle at 40% 30%, #ffffff, #a0f0ff 40%, #c026d3);
        box-shadow: 0 0 18px #c026d3, inset 0 0 12px rgba(255,255,255,0.9);
        animation: pulseOrb 2.4s ease-in-out infinite;
    }
    @keyframes pulseOrb { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }

    /* دکمه‌های خانه */
    .services-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 360px; }
    .service-box {
        background: rgba(255,255,255,0.13); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.25);
        border-radius: 24px; padding: 15px 10px 12px; text-align: center; cursor: pointer;
        transition: all 0.3s; height: 165px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    }
    .service-box:hover { transform: translateY(-8px); }
    .service-box img { width: 78px; height: 78px; object-fit: cover; border-radius: 18px; border: 2px solid rgba(255,255,255,0.3); }
    .service-box span { font-size: 16.5px; font-weight: 500; }

    /* صفحه پادکست - طراحی مدرن */
    .podcast-page { width: 100%; max-width: 360px; }
    .horizontal-scroll {
        display: flex; gap: 15px; overflow-x: auto; padding: 15px 0; scrollbar-width: none;
    }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    .slide-item {
        min-width: 140px; text-align: center; cursor: pointer;
    }
    .slide-item img {
        width: 140px; height: 140px; object-fit: cover; border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .section-title { font-size: 22px; margin: 20px 0 12px; padding: 0 5px; }

    .podcast-item {
        background: rgba(255,255,255,0.1); backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.15); border-radius: 18px;
        padding: 12px 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 15px;
        cursor: pointer;
    }
    .podcast-item:hover { background: rgba(255,255,255,0.22); }

    /* Now Playing Modal */
    .now-playing {
        position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 300;
        display: none; flex-direction: column; align-items: center; padding: 40px 20px 30px;
    }
    .now-playing.active { display: flex; }
    .big-cover {
        width: 260px; height: 260px; border-radius: 30px; overflow: hidden;
        box-shadow: 0 20px 50px rgba(192, 38, 211, 0.6); margin-bottom: 30px;
    }
    .big-cover img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>

<div class="stars"></div>

<header>
    <div class="hamburger" onclick="toggleMenu()">☰</div>
</header>

<div id="sideMenu" class="menu-panel">...</div>
<div id="overlay" onclick="toggleMenu()"></div>

<div class="main-center" id="mainContent">
    <div class="title">PlanLife</div>

    <div class="chat-container" id="chatBox">
        <div id="chat-output"></div>
        <div class="input-box">
            <input id="user-input" placeholder="پیام بده...">
            <button onclick="sendMessage()"><div class="orb-send"></div></button>
        </div>
    </div>

    <div class="services-grid"> ... (همان قبلی) </div>
</div>

<!-- Now Playing -->
<div id="nowPlayingScreen" class="now-playing">
    <button onclick="closeNowPlaying()" style="align-self:flex-start; background:none; border:none; color:white; font-size:30px;">←</button>
    <div class="big-cover">
        <img id="npCover" src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg" alt="">
    </div>
    <h2 id="npTitle" style="margin-bottom:8px;">عنوان پادکست</h2>
    <p id="npSubtitle" style="opacity:0.7; margin-bottom:30px;">PlanLife</p>
    
    <audio id="mainAudio" controls style="width:100%; max-width:320px; margin-bottom:20px;"></audio>
    
    <button onclick="closeNowPlaying()" style="margin-top:20px; padding:12px 40px; background:rgba(255,255,255,0.2); border:none; border-radius:50px; color:white;">بستن</button>
</div>

<script>
// ... (ستاره‌باران، چت، منو و توابع قبلی را نگه می‌داریم)

function showSection(section) {
    const main = document.getElementById('mainContent');
    if (section === 'podcast') {
        main.innerHTML = `
            <h2 style="font-size:32px; margin-bottom:15px; text-align:center;">پادکست‌های PlanLife</h2>
            
            <div class="podcast-page">
                <!-- اسلاید افقی -->
                <div class="section-title">آخرین پخش‌ها</div>
                <div class="horizontal-scroll" id="horizontalSlides"></div>

                <!-- لیست پادکست‌ها -->
                <div class="section-title">همه پادکست‌ها</div>
                <div id="podcastList"></div>
            </div>

            <button onclick="goToHome()" style="margin-top:30px; padding:12px 32px; background:rgba(255,255,255,0.15); border:none; border-radius:50px; color:white;">بازگشت به خانه</button>
        `;
        loadPodcastPage();
    } else {
        // صفحات دیگر
        main.innerHTML = `...`;
    }
}

function loadPodcastPage() {
    // اسلاید افقی
    const slidesHTML = `
        <div class="slide-item" onclick="playPodcast('باورهای ثروت', 1)"><img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg"><p>باورهای ثروت</p></div>
        <div class="slide-item" onclick="playPodcast('عشق و روابط', 1)"><img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg"><p>عشق و روابط</p></div>
        <div class="slide-item" onclick="playPodcast('اعتماد به نفس', 1)"><img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg"><p>اعتماد به نفس</p></div>
    `;
    document.getElementById('horizontalSlides').innerHTML = slidesHTML;

    // لیست کامل
    let listHTML = '';
    const categories = ["باورهای ثروت", "عشق و روابط", "تحول حال و احساس", "اعتماد به نفس", "احساس لیاقت"];
    
    categories.forEach(cat => {
        for (let i = 1; i <= 5; i++) {
            listHTML += `
                <div class="podcast-item" onclick="playPodcast('${cat}', ${i})">
                    <div style="width:50px;height:50px;background:rgba(255,255,255,0.2);border-radius:12px;flex-shrink:0;"></div>
                    <div>
                        <div style="font-weight:500;">${cat}</div>
                        <div style="font-size:14px;opacity:0.7;">قسمت ${i}</div>
                    </div>
                </div>`;
        }
    });
    document.getElementById('podcastList').innerHTML = listHTML;
}

function playPodcast(title, episode) {
    const fullTitle = `${title} - قسمت ${episode}`;
    document.getElementById('npTitle').textContent = fullTitle;
    document.getElementById('npSubtitle').textContent = "PlanLife";
    document.getElementById('mainAudio').src = "#"; // لینک صدا را اینجا بگذارید
    document.getElementById('nowPlayingScreen').classList.add('active');
    document.getElementById('mainAudio').play();
}

function closeNowPlaying() {
    document.getElementById('nowPlayingScreen').classList.remove('active');
    document.getElementById('mainAudio').pause();
}

// توابع قبلی (sendMessage, toggleMenu, goToHome و ...) را در پایین نگه دارید
</script>
</body>
</html>
