<script src="data.js"></script>

<script>
    function send() {
        const input = document.getElementById('userInput');
        const box = document.getElementById('chat');
        const text = input.value.trim();
        if (!text) return;

        box.innerHTML += `<div class="msg u">${text}</div>`;
        input.value = "";

        // مستقیم از متغیر myData که در فایل قبلی ساختیم استفاده می‌کنیم
        let reply = "فرکانس دریافت شد. در ماورای ذهن همه‌چیز ممکن است. ✨";
        
        for (let key in myData) {
            if (text.includes(key)) {
                reply = myData[key];
                break;
            }
        }

        setTimeout(() => {
            box.innerHTML += `<div class="msg a">${reply}</div>`;
            box.scrollTop = box.scrollHeight;
        }, 600);
    }
    
    // پیام خوش‌آمدگویی
    window.onload = () => {
        const box = document.getElementById('chat');
        box.innerHTML = '<div class="msg a">اتصال با ماورای ذهن برقرار شد. بپرس...</div>';
    };
</script>
