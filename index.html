<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanLife | هوش ماورایی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&family=League+Spartan:wght@800&display=swap');
        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; background: linear-gradient(135deg, #00c4cc, #7d2ae8, #00c4cc); background-size: 400% 400%; animation: gradientBG 15s ease infinite; background-attachment: fixed; overflow-x: hidden; padding: 10px; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        /* افکت تار شدن بگراند هنگام باز شدن منو */
        body.menu-open .main-container { filter: blur(15px); pointer-events: none; }

        /* گوی درخشان و متن برند */
        .orb { width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, #a2d2ff 100%); animation: pulse 3s infinite ease-in-out; box-shadow: 0 0 30px rgba(255,255,255,0.4); margin-top: 40px; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .brand-text { font-family: 'League Spartan', sans-serif; font-size: 3rem; color: white; margin: 10px 0 30px 0; }

        /* چت‌باکس */
        .chat-card { width: 100%; max-width: 450px; height: 50vh; background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(35px); border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.3); display: flex; flex-direction: column; padding: 20px; }
        #chat-window { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 18px; border-radius: 22px; font-size: 14px; max-width: 85%; color: white; }
        .a { align-self: flex-start; background: rgba(0,0,0,0.2); }
        .u { align-self: flex-end; background: #ff9100; box-shadow: 0 4px 15px rgba(255,145,0,0.3); }

        /* بخش ورودی */
        .input-container { margin-top: 15px; display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.25); border: 1px solid rgba(255, 255, 255, 0.4); padding: 8px 15px; border-radius: 30px; backdrop-filter: blur(10px); }
        input { flex: 1; background: transparent; border: none; color: white; outline: none; padding: 10px; font-size: 14px; }
        input::placeholder { color: white; }
        .send-btn { font-size: 24px; cursor: pointer; border:none; background:none; text-shadow: 0 0 10px gold; }

        /* دکمه‌های پایین شیشه‌ای نارنجی */
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 450px; margin-top: 25px; }
        .nav-btn { padding: 18px; text-align: center; color: white; font-weight: 800; border-radius: 22px; cursor: pointer; border: 1px solid rgba(255,255,255,0.3); background: linear-gradient(135deg, rgba(255, 154, 0, 0.6), rgba(255, 81, 0, 0.6)); backdrop-filter: blur(15px); }

        /* منوها */
        .menu-btn { position: fixed; top: 25px; z-index: 1001; background: rgba(255,255,255,0.2); padding: 10px; border-radius: 12px; cursor: pointer; }
        .btn-right { right: 20px; } .btn-left { left: 20px; }
        .side-menu { position: fixed; top: 0; width: 260px; height: 100%; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(40px); z-index: 1000; padding: 80px 20px; transition: 0.6s ease; }
        #leftMenu { left: -300px; } #leftMenu.active { left: 0; }
        #overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); display:none; z-index:999; backdrop-filter: blur(4px); }
    </style>
</head>
<body>

<div id="overlay" onclick="closeMenus()"></div>
<div class="menu-btn btn-left" onclick="openMenu('leftMenu')"><div></div><div></div><div></div></div>

<div id="leftMenu" class="side-menu">
    <div class="nav-btn" style="margin-bottom:10px" onclick="showPage('homePage')">صفحه اصلی</div>
    <div class="nav-btn" onclick="showPage('podcastPage')">پادکست‌ها</div>
</div>

<div class="orb"></div>
<h1 class="brand-text">PlanLife</h1>

<div class="main-container">
    <div id="homePage" class="page active" style="display:flex;">
        <div class="chat-card">
            <div id="chat-window">
                <div class="msg a">سوال ذهنی خودتان را بپرسید... ✨</div>
            </div>
            <div class="input-container">
                <input type="text" id="chatInput" placeholder="بنویسید..." onkeypress="if(event.key=='Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">✨</button>
            </div>
        </div>
        <div class="grid-buttons">
            <div class="nav-btn">تمرینات</div>
            <div class="nav-btn">کتاب‌ها</div>
        </div>
    </div>
</div>

<script>
    // --- دیتابیس سوال و جواب ---
    const knowledgeBase = [
        { question: "سلام", answer: "سلام سهیل عزیز! آماده برای تحول؟ ✨" },
        { question: "پادکست", answer: "در بخش پادکست‌ها لیست فایل‌ها منتظر توست." }
    ];

    function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if(!text) return;
        
        const win = document.getElementById('chat-window');
        win.innerHTML += `<div class="msg u">${text}</div>`;
        input.value = '';
        
        setTimeout(() => {
            let reply = knowledgeBase.find(i => text.includes(i.question))?.answer || "در حال یادگیری هستم... ✨";
            win.innerHTML += `<div class="msg a">${reply}</div>`;
            win.scrollTop = win.scrollHeight;
        }, 600);
    }

    function openMenu(id) { document.getElementById(id).classList.add('active'); document.getElementById('overlay').style.display = 'block'; document.body.classList.add('menu-open'); }
    function closeMenus() { document.querySelectorAll('.side-menu').forEach(m => m.classList.remove('active')); document.getElementById('overlay').style.display = 'none'; document.body.classList.remove('menu-open'); }
    function showPage(id) { closeMenus(); }
</script>
</body>
</html>
