<script>
    async function askAI() {
        const input = document.getElementById('userInput');
        const flow = document.getElementById('chat-flow');
        const text = input.value.trim();
        
        if (!text) return;

        // نمایش پیام کاربر
        flow.innerHTML += `<div style="color: #23d5ab; margin-bottom: 10px;">شما: ${text}</div>`;
        const loading = document.createElement('div');
        loading.innerText = "... در حال فکر کردن";
        flow.appendChild(loading);
        input.value = "";

        try {
            // استفاده از یک API عمومی و رایگان برای تست (بدون نیاز به کلید سخت‌گیرانه)
            const response = await fetch("https://api-inference.huggingface.co/models/facebook/blenderbot-400M-distill", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ inputs: text })
            });

            const data = await response.json();
            
            // نمایش پاسخ هوش مصنوعی
            loading.innerText = "هوش مصنوعی: " + (data.generated_text || "سهیل جان، متوجه نشدم، دوباره بپرس.");
        } catch (e) {
            loading.innerText = "خطا در اتصال! لطفاً فیلترشکن رو چک کن.";
        }
        flow.scrollTop = flow.scrollHeight;
    }
</script>
