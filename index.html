<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlanLife | پلتفرم تحول</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&family=League+Spartan:wght@800&display=swap');

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; transition: 0.3s; }
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; background: linear-gradient(135deg, #00c4cc, #7d2ae8, #00c4cc); background-attachment: fixed; overflow-x: hidden; padding: 10px; }

        .chat-card { 
            width: 100%; max-width: 450px; height: calc(50vh + 80px); 
            background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(30px); 
            border-radius: 35px; border: 1px solid rgba(255, 255, 255, 0.3); 
            display: flex; flex-direction: column; padding: 15px; margin-top: -60px;
        }

        #chat-window { 
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; 
            justify-content: flex-end; gap: 10px; padding: 5px;
        }

        .msg { padding: 12px 18px; border-radius: 20px; font-size: 14px; max-width: 85%; }
        
        /* پیام سیستم (چپ) */
        .a { align-self: flex-start; background: rgba(0, 0, 0, 0.3); color: white; border-bottom-right-radius: 5px; }
        
        /* پیام کاربر (راست) */
        .u { align-self: flex-end; background: #ff9100; color: white; border-bottom-left-radius: 5px; }

        .input-area { margin-top: 15px; display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.15); padding: 12px; border-radius: 25px; }
        input { flex: 1; background: transparent; border: none; color: white; outline: none; text-align: right; }
        
        /* سایر المان‌ها مشابه قبل */
        .nav-item { display: block; padding: 15px; background: rgba(255, 255, 255, 0.1); border-radius: 15px; color: white; text-align: center; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; width: 100%; flex-direction: column; align-items: center; }
        .page.active { display: flex; }
    </style>
</head>
<body>

    <div id="homePage" class="page active">
        <div class="chat-card">
            <div id="chat-window">
                <div class="msg a">سلام! چطور می‌توانم در مسیر تحول به شما کمک کنم؟</div>
            </div>
            <div class="input-area">
                <input type="text" id="chatInput" placeholder="بنویسید..." onkeypress="if(event.key==='Enter') sendMessage()">
                <div onclick="sendMessage()" style="width:30px; height:30px; cursor:pointer; background:#ff9100; border-radius:50%;"></div>
            </div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const chatInput = document.getElementById('chatInput');

        async function sendMessage() {
            const userText = chatInput.value.trim();
            if(!userText) return;

            appendMessage(userText, 'u');
            chatInput.value = '';

            try {
                const response = await fetch('database.txt');
                const data = await response.text();
                const lines = data.split('\n');
                let foundAnswer = "پاسخی در دیتابیس یافت نشد.";

                for (let line of lines) {
                    if (line.toLowerCase().includes(userText.toLowerCase())) {
                        foundAnswer = line.includes('=') ? line.split('=')[1] : line;
                        break;
                    }
                }
                setTimeout(() => appendMessage(foundAnswer, 'a'), 500);
            } catch(e) {
                appendMessage("خطا در اتصال به دیتابیس.", 'a');
            }
        }

        function appendMessage(txt, type) {
            const m = document.createElement('div');
            m.className = `msg ${type}`;
            m.innerText = txt;
            chatWindow.appendChild(m);
            // اسکرول به پایین به صورت خودکار
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    </script>
</body>
</html>
