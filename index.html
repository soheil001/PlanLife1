<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanLife AI | دستیار هوشمند</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a1c4fd, #fbc2eb);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            display: flex; justify-content: center; align-items: center;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .chat-container {
            width: 95%;
            max-width: 650px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 40px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        #chat-flow {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 10px;
            scrollbar-width: none;
        }

        #chat-flow::-webkit-scrollbar { display: none; }

        .bubble {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 25px;
            font-size: 1rem;
            line-height: 1.7;
            color: #333;
            animation: fadeIn 0.3s ease;
        }

        .user-bubble {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.5);
            border-bottom-right-radius: 5px;
        }

        .ai-bubble {
            align-self: flex-end;
            background: rgba(0, 0, 0, 0.15);
            color: #111;
            border-bottom-left-radius: 5px;
        }

        .input-area {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        textarea {
            width: 100%;
            min-height: 150px; /* ارتفاع عمودی بیشتر */
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px; /* کاملاً دور گرد */
            padding: 20px;
            font-size: 1.05rem;
            resize: none;
            outline: none;
            font-family: inherit;
            transition: 0.3s;
        }

        textarea:focus { border-color: #e73c7e; background: rgba(255, 255, 255, 0.5); }

        button {
            background: #e73c7e;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { transform: scale(1.02); background: #d6336c; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="chat-container">
        <div id="chat-flow">
            <div class="bubble ai-bubble">سلام! من هوش مصنوعی DeepSeek هستم که برای PlanLife شخصی‌سازی شدم. چطور می‌تونم امروز بهت کمک کنم؟ ✨</div>
        </div>
        
        <div class="input-area">
            <textarea id="userInput" placeholder="سوالت رو اینجا بنویس..."></textarea>
            <button id="sendBtn" onclick="handleChat()">ارسال پیام</button>
        </div>
    </div>

    <script>
        const API_KEY = "Sk-6bd2941aa5c8456a85f2bf54076e39aa";

        async function handleChat() {
            const inputField = document.getElementById('userInput');
            const chatFlow = document.getElementById('chat-flow');
            const sendBtn = document.getElementById('sendBtn');
            const text = inputField.value.trim();

            if (text === "") return;

            // پیام کاربر
            addBubble(text, 'user-bubble');
            inputField.value = "";
            sendBtn.disabled = true;

            const loadingBubble = addBubble("در حال فکر کردن...", 'ai-bubble');

            try {
                const response = await fetch("https://api.deepseek.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [
                            { "role": "system", "content": "تو دستیار هوشمند سایت PlanLife هستی. لحن تو مثبت و انگیزشی است." },
                            { "role": "user", "content": text }
                        ]
                    })
                });

                const data = await response.json();
                loadingBubble.innerText = data.choices[0].message.content;
            } catch (error) {
                loadingBubble.innerText = "خطا! احتمالاً موجودی پنل DeepSeek شما صفر است یا نیاز به تغییر آی‌پی دارید.";
                console.error(error);
            } finally {
                sendBtn.disabled = false;
                chatFlow.scrollTop = chatFlow.scrollHeight;
            }
        }

        function addBubble(text, className) {
            const chatFlow = document.getElementById('chat-flow');
            const div = document.createElement('div');
            div.className = `bubble ${className}`;
            div.innerText = text;
            chatFlow.appendChild(div);
            chatFlow.scrollTop = chatFlow.scrollHeight;
            return div;
        }
    </script>
</body>
</html>
