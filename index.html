<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<title>PlanLife</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: 'Vazirmatn', sans-serif;
        overflow-x: hidden;
        color: white;
        background: radial-gradient(circle at center, #1a0033 0%, #000011 70%);
    }

    /* ستاره‌ها */
    .stars {
        position: fixed;
        inset: 0;
        background: transparent;
        z-index: 1;
        pointer-events: none;
    }
    .stars::before, .stars::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image: radial-gradient(white 1px, transparent 1px);
        background-size: 80px 80px;
        opacity: 0.5;
        animation: twinkle 10s infinite alternate;
    }
    .stars::after {
        background-size: 140px 140px;
        opacity: 0.35;
        animation-duration: 16s;
    }
    @keyframes twinkle { 0% { opacity: 0.4; } 100% { opacity: 0.75; } }

    .shooting-star {
        position: absolute;
        width: 3px;
        height: 2px;
        background: white;
        box-shadow: 0 0 10px white;
        animation: shoot 5s linear infinite;
        z-index: 1;
    }
    @keyframes shoot {
        0% { transform: translateX(-200px) translateY(-200px); opacity: 1; }
        100% { transform: translateX(1000px) translateY(800px); opacity: 0; }
    }

    header {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 65px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        z-index: 100;
        background: rgba(0,0,0,0.15);
        backdrop-filter: blur(10px);
    }
    .hamburger {
        font-size: 30px;
        cursor: pointer;
        padding: 8px;
        border-radius: 50%;
        background: rgba(255,255,255,0.1);
    }

    .menu-panel {
        position: fixed;
        top: 65px;
        left: -280px;
        width: 260px;
        height: calc(100% - 65px);
        background: rgba(255,255,255,0.12);
        backdrop-filter: blur(20px);
        border-radius: 0 20px 20px 0;
        padding: 25px 20px;
        transition: 0.4s ease;
        z-index: 200;
    }
    .menu-panel.active { left: 0; }

    .menu-item {
        padding: 16px 20px;
        margin: 12px 0;
        border-radius: 15px;
        background: rgba(255,255,255,0.1);
        font-size: 17px;
    }
    .menu-item:hover { background: rgba(255,255,255,0.25); }

    .main-center {
        position: relative;
        z-index: 5;
        min-height: 100vh;
        padding: 75px 20px 100px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .title {
        font-size: 38px;
        font-weight: 700;
        text-shadow: 0 0 25px rgba(160, 240, 255, 0.9);
        margin-bottom: 18px;
    }

    /* چت باکس */
    .chat-container {
        width: 100%;
        max-width: 360px;
        height: 390px;
        background: rgba(255,255,255,0.13);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 28px;
        display: flex;
        flex-direction: column;
        padding: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        margin-bottom: 30px;
    }

    #chat-output {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    /* پیام‌ها - پیام سیستم چپ، پیام کاربر راست */
    .msg-bot {
        align-self: flex-start;
        background: rgba(255,255,255,0.22);
        padding: 11px 15px;
        border-radius: 18px 18px 18px 5px;
        max-width: 88%;           /* متن طولانی‌تر قبل از شکستن خط */
        line-height: 1.55;
    }

    .msg-user {
        align-self: flex-end;
        background: rgba(100, 60, 255, 0.78);
        padding: 11px 15px;
        border-radius: 18px 18px 5px 18px;
        max-width: 88%;           /* متن طولانی‌تر */
        line-height: 1.55;
    }

    .input-box {
        display: flex;
        background: rgba(255,255,255,0.15);
        border-radius: 25px;
        padding: 6px;
        margin-top: 8px;
    }
    input {
        flex: 1;
        background: transparent;
        border: none;
        color: white;
        font-size: 16.5px;
        padding: 12px 15px;
        outline: none;
    }

    button {
        width: 48px;
        height: 48px;
        border: none;
        background: linear-gradient(135deg, #a0f0ff, #c026d3);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 0 15px rgba(192, 38, 211, 0.6);
    }
    .orb-send {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 30%, #ffffff, #a0f0ff 40%, #c026d3);
        box-shadow: 0 0 12px #fff, inset 0 0 8px rgba(255,255,255,0.8);
        animation: pulseOrb 2.5s ease-in-out infinite;
    }
    @keyframes pulseOrb {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.18); }
    }

    /* دکمه‌های پایین */
    .services-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        width: 100%;
        max-width: 360px;
    }
    .service-box {
        background: rgba(255,255,255,0.13);
        backdrop-filter: blur(12px);
        border: 1.5px solid #ff8c00;
        border-radius: 20px;
        padding: 22px 10px;
        text-align: center;
        font-size: 17px;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 0 15px rgba(255, 140, 0, 0.5);
    }
    .service-box:hover {
        transform: translateY(-6px);
        box-shadow: 0 0 22px rgba(255, 140, 0, 0.8);
        background: rgba(255,255,255,0.22);
    }

    #overlay { 
        position: fixed; 
        inset: 0; 
        background: rgba(0,0,0,0.5); 
        backdrop-filter: blur(8px); 
        display: none; 
        z-index: 150; 
    }
    #overlay.active { display: block; }
</style>
</head>
<body>

<div class="stars"></div>

<header>
    <div class="hamburger" onclick="toggleMenu()">☰</div>
</header>

<div id="sideMenu" class="menu-panel">
    <div class="menu-item" onclick="goToHome()">خانه</div>
    <div class="menu-item">پروفایل</div>
    <div class="menu-item">آمار پیشرفت</div>
    <div class="menu-item">مورد علاقه‌ها</div>
    <div class="menu-item">تنظیمات</div>
</div>

<div id="overlay" onclick="toggleMenu()"></div>

<div class="main-center" id="mainContent">
    <div class="title">PlanLife</div>

    <div class="chat-container" id="chatBox">
        <div id="chat-output"></div>
        <div class="input-box">
            <input id="user-input" placeholder="پیام بده...">
            <button onclick="sendMessage()">
                <div class="orb-send"></div>
            </button>
        </div>
    </div>

    <div class="services-grid">
        <div class="service-box" onclick="showSection('podcast')">پادکست</div>
        <div class="service-box" onclick="showSection('success')">موفقیت</div>
        <div class="service-box" onclick="showSection('belief')">باور</div>
        <div class="service-box" onclick="showSection('exercise')">تمرینات</div>
    </div>
</div>

<script>
// ستاره‌باران (همان قبلی)
function createShootingStar() {
    const star = document.createElement('div');
    star.className = 'shooting-star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 60 + '%';
    star.style.animationDuration = (Math.random() * 4 + 4) + 's';
    document.body.appendChild(star);
    setTimeout(() => star.remove(), 10000);
}
setInterval(() => { if (Math.random() > 0.4) createShootingStar(); }, 1000);

// چت
const input = document.getElementById("user-input");
const output = document.getElementById("chat-output");

window.onload = () => {
    output.innerHTML += `<div class="msg-bot">سلام خوش اومدی به PlanLife</div>`;
    scrollDown();
};

function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    output.innerHTML += `<div class="msg-user">${text}</div>`;
    input.value = "";
    scrollDown();

    setTimeout(() => {
        output.innerHTML += `<div class="msg-bot">دارم از دل کهکشان برات انرژی می‌فرستم</div>`;
        scrollDown();
    }, 700);
}

function scrollDown() {
    output.scrollTop = output.scrollHeight;
}

input.addEventListener("keypress", e => { if (e.key === "Enter") sendMessage(); });

function toggleMenu() {
    document.getElementById('sideMenu').classList.toggle('active');
    document.getElementById('overlay').classList.toggle('active');
}

function showSection(section) {
    const main = document.getElementById('mainContent');
    main.innerHTML = `
        <div style="text-align:center; padding:60px 20px; color:white;">
            <h2 style="font-size:28px; margin-bottom:20px;">${getSectionTitle(section)}</h2>
            <p style="opacity:0.9; line-height:1.8;">این بخش به‌زودی با محتوای کامل پر می‌شود...</p>
            <button onclick="goToHome()" style="margin-top:40px; padding:14px 32px; background:rgba(255,255,255,0.2); border:none; border-radius:50px; color:white; font-size:17px;">بازگشت به خانه</button>
        </div>
    `;
}

function getSectionTitle(section) {
    if (section === 'podcast') return 'پادکست‌های انگیزشی';
    if (section === 'success') return 'داستان‌های موفقیت';
    if (section === 'belief') return 'تقویت باور';
    if (section === 'exercise') return 'تمرینات';
}

function goToHome() {
    location.reload();
}
</script>
</body>
</html>
