<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 20px; min-height: 100vh; background: #1a0b2e; display: flex; flex-direction: column; align-items: center; font-family: 'Nunito', sans-serif; color: white; }

        /* گوی نبض‌زن */
        .pulse { width: 100px; height: 100px; background: radial-gradient(circle, #a1c4fd, #c2e9fb); border-radius: 50%; margin-top: 20px; box-shadow: 0 0 30px #764ba2; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 20px #764ba2; } 50% { transform: scale(1.1); box-shadow: 0 0 50px #00f2fe; } 100% { transform: scale(1); } }
        
        .title { font-size: 40px; margin: 10px 0; }

        /* باکس اصلی چت */
        .main-box { width: 100%; max-width: 360px; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 30px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }

        /* اینپوت شیشه‌ای مدرن */
        .input-area { background: rgba(30, 30, 45, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 10px 15px; display: flex; align-items: center; gap: 10px; }
        input { flex: 1; background: transparent; border: none; color: white; font-size: 16px; outline: none; }
        .send-btn { width: 35px; height: 35px; border-radius: 50%; background: #4facfe; border: none; color: white; cursor: pointer; }

        /* دکمه‌های مربعی ۲ ستونه */
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 360px; margin-top: 10px; }
        .btn-square { aspect-ratio: 1 / 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .btn-square:hover { background: rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>

    <div class="pulse"></div>
    <h1 class="title">پلن لایف</h1>

    <div class="main-box">
        <div class="input-area">
            <span style="font-size: 20px;">🌐</span>
            <input type="text" placeholder="چیزی بنویسید...">
            <button class="send-btn">➤</button>
        </div>
        <div style="font-size: 12px; opacity: 0.6; text-align: center;">planlife.ir</div>
    </div>

    <div class="grid-buttons">
        <div class="btn-square">قانون جذب</div>
        <div class="btn-square">پول‌سازی</div>
        <div class="btn-square">باورها</div>
        <div class="btn-square">رشد فردی</div>
        <div class="btn-square">انگیزه</div>
        <div class="btn-square">هدف</div>
    </div>

</body>
</html>
