<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlanLife | Premium Interface</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&family=League+Spartan:wght@800&display=swap');

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        
        body { 
            margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(135deg, #00c4cc, #7d2ae8, #00c4cc);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            background-attachment: fixed; overflow-x: hidden; padding: 10px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body.menu-open .main-layout { filter: blur(15px); pointer-events: none; }

        /* دکمه‌های منو در دو طرف */
        .menu-btn {
            position: fixed; top: 25px; z-index: 1001;
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px; border-radius: 12px; cursor: pointer; backdrop-filter: blur(10px);
        }
        .btn-right { right: 25px; }
        .btn-left { left: 25px; }
        .menu-btn div { width: 20px; height: 2px; background: white; margin: 4px 0; }

        /* استایل منوها */
        .side-menu {
            position: fixed; top: 0; width: 260px; height: 100%;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(40px);
            z-index: 1000; padding: 70px 20px; transition: 0.5s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #rightMenu { right: -300px; border-left: 1px solid rgba(255, 255, 255, 0.2); }
        #leftMenu { left: -300px; border-right: 1px solid rgba(255, 255, 255, 0.2); }
        .side-menu.active { right: 0 !important; left: 0 !important; }

        .nav-item {
            display: block; padding: 12px; background: rgba(255, 255, 255, 0.08); border-radius: 12px;
            color: white; text-align: center; text-decoration: none; margin-bottom: 10px; border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* گوی آبی-سفید نبض‌زن کوچک */
        .simple-orb {
            width: 50px; height: 50px; border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, #a2d2ff 100%);
            box-shadow: 0 0 20px rgba(162, 210, 255, 0.6);
            margin-bottom: 5px; /* نزدیک به تایتل */
            animation: pulseSimple 3s infinite ease-in-out;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        @keyframes pulseSimple {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 30px rgba(162, 210, 255, 0.8); }
        }

        /* تایتل با فونت مشابه Canva */
        .brand-canva { 
            color: white; font-family: 'League Spartan', sans-serif; font-size: 2.2rem; 
            font-weight: 800; margin-bottom: 30px; /* فاصله ۳ سانتی تا باکس */
            letter-spacing: -1px;
        }

        /* باکس چت با عرض و موقعیت جدید */
        .chat-card {
            width: calc(100% - 35px); /* کاهش ۱.۷۵ از هر طرف */
            max-width: 440px; height: 55vh;
            background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(30px);
            border-radius: 35px; border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex; flex-direction: column; padding: 20px 10px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1); 
            margin-top: -10px; /* هدایت به سمت بالا */
        }

        #chat-window { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 18px; font-size: 13px; max-width: 85%; }
        .u { align-self: flex-start; background: rgba(255, 255, 255, 0.1); color: white; margin-left: 10px; }
        .a { align-self: flex-end; background: rgba(0, 0, 0, 0.15); color: white; margin-right: 10px; }

        .input-area {
            margin: 10px; display: flex; align-items: center; gap: 10px; 
            background: rgba(255, 255, 255, 0.08); padding: 5px 15px;
            border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.2);
        }
        input { flex: 1; background: transparent; border: none; color: white; outline: none; }
        .gemini-send svg { width: 22px; height: 22px; fill: white; }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; display: none; }
        #chat-window::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body>

<div id="overlay" onclick="closeAllMenus()"></div>

<div class="menu-btn btn-right" onclick="toggleMenu('rightMenu')">
    <div></div><div></div><div></div>
</div>
<div class="side-menu" id="rightMenu">
    <div style="color:white; font-weight:800; text-align:center; margin-bottom:20px;">تنظیمات</div>
    <a href="#" class="nav-item">پروفایل</a>
    <a href="#" class="nav-item">اشتراک ویژه</a>
</div>

<div class="menu-btn btn-left" onclick="toggleMenu('leftMenu')">
    <div></div><div></div><div></div>
</div>
<div class="side-menu" id="leftMenu">
    <div style="color:white; font-weight:800; text-align:center; margin-bottom:20px;">ابزارها</div>
    <a href="#" class="nav-item">مدیتیشن</a>
    <a href="#" class="nav-item">برنامه‌ریزی</a>
</div>

<div class="main-layout" style="width:100%; display:flex; flex-direction:column; align-items:center; margin-top: 40px;">
    <div class="simple-orb"></div>
    <h1 class="brand-canva">PlanLife</h1>

    <div class="chat-card">
        <div id="chat-window">
            <div class="msg a">سوالات ذهنی خودتان را بپرسید ✨</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="بپرس..." onkeypress="if(event.keyCode===13)send()">
            <button onclick="send()" style="background:none; border:none; cursor:pointer;" class="gemini-send">
                <svg viewBox="0 0 24 24"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"></path></svg>
            </button>
        </div>
    </div>
</div>

<script>
    let brain = {};
    function toggleMenu(id) {
        closeAllMenus();
        document.getElementById(id).classList.add('active');
        document.getElementById('overlay').style.display = 'block';
        document.body.classList.add('menu-open');
    }

    function closeAllMenus() {
        document.querySelectorAll('.side-menu').forEach(m => m.classList.remove('active'));
        document.getElementById('overlay').style.display = 'none';
        document.body.classList.remove('menu-open');
    }

    async function loadBrain() {
        try {
            const r = await fetch('database.txt?v=' + Math.random());
            const d = await r.text();
            d.split('\n').forEach(l => {
                const p = l.split('|');
                if (p.length === 2) brain[p[0].trim()] = p[1].trim();
            });
        } catch (e) {}
    }
    loadBrain();

    function send() {
        const i = document.getElementById('userInput');
        const w = document.getElementById('chat-window');
        const v = i.value.trim();
        if (!v) return;
        w.innerHTML += `<div class="msg u">${v}</div>`;
        i.value = "";
        let r = "";
        for (let k in brain) { if (v.includes(k)) { r = brain[k]; break; } }
        if (!r) r = "در حال پردازش فرکانس یا سوال نامربوط... ✨";
        setTimeout(() => {
            w.innerHTML += `<div class="msg a">${r}</div>`;
            w.scrollTop = w.scrollHeight;
        }, 500);
    }
</script>

</body>
</html>
