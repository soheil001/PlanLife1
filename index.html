<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanLife | دستیار هوشمند</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* بک‌گراند متحرک و ترکیبی */
        body {
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a1c4fd, #fbc2eb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* کانتینر اصلی شبیه ChatGPT */
        .main-container {
            width: 90%;
            max-width: 800px;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-weight: bold;
        }

        /* باکس ورودی بزرگ و شیشه‌ای */
        .input-wrapper {
            position: relative;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 15px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            transform: translateY(-2px);
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #333;
            font-size: 1.1rem;
            resize: none;
            padding: 10px;
            line-height: 1.5;
            min-height: 60px;
            font-family: inherit;
        }

        textarea::placeholder {
            color: rgba(0,0,0,0.4);
        }

        .send-btn {
            background: #fff;
            border: none;
            border-radius: 15px;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
            margin-right: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .send-btn:hover {
            transform: scale(1.1);
            background: #f0f0f0;
        }

        /* بخش نمایش پاسخ هوش مصنوعی */
        #response-area {
            margin-top: 30px;
            color: #444;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 20px;
            display: none; /* در ابتدا مخفی */
            text-align: right;
            max-height: 300px;
            overflow-y: auto;
            line-height: 1.8;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

    </style>
</head>
<body>

    <div class="main-container">
        <h1>چطور می‌تونم کمکت کنم؟</h1>
        
        <div class="input-wrapper">
            <textarea id="userInput" placeholder="سوال یا باورت رو اینجا بنویس..." rows="1"></textarea>
            <button class="send-btn" onclick="askAI()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M7 11L12 6L17 11M12 18V7" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>

        <div id="response-area">
            <!-- پاسخ هوش مصنوعی اینجا ظاهر می‌شود -->
        </div>
    </div>

    <script>
        // تنظیم ارتفاع خودکار برای textarea
        const tx = document.getElementById('userInput');
        tx.addEventListener("input", OnInput, false);

        function OnInput() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        }

        function askAI() {
            const input = document.getElementById('userInput').value;
            const responseArea = document.getElementById('response-area');
            
            if (input.trim() === "") return;

            // نمایش افکت لودینگ ساده
            responseArea.style.display = "block";
            responseArea.innerHTML = "در حال پردازش در ماورای ذهن...";

            // شبیه‌سازی پاسخ (در مرحله بعد به API وصل می‌کنیم)
            setTimeout(() => {
                responseArea.innerHTML = `<strong>پاسخ:</strong> <br> فکر شما یعنی "${input}" دریافت شد. به یاد داشته باش که قدرت ذهن تو بی‌انتهاست. ما در حال اتصال به شبکه هوشمند هستیم تا دقیق‌ترین راهنمایی رو بهت بدیم. ✨`;
            }, 1500);

            document.getElementById('userInput').value = "";
            tx.style.height = 'auto';
        }
    </script>

</body>
</html>
