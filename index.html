<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanLife AI | دستیار ماورای ذهن</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            display: flex; justify-content: center; align-items: center;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* کانتینر اصلی */
        .chat-container {
            width: 90%;
            max-width: 600px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
        }

        /* محل نمایش پیام‌ها */
        #chat-flow {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 10px;
            margin-bottom: 20px;
        }

        /* حباب‌های گفتگو */
        .bubble {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: white;
            animation: fadeIn 0.3s ease;
        }

        .user-bubble {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.25);
            border-bottom-right-radius: 5px;
        }

        .ai-bubble {
            align-self: flex-end;
            background: rgba(0, 0, 0, 0.2);
            border-bottom-left-radius: 5px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* تکست باکس عمودی و دور گرد */
        .input-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        textarea {
            width: 100%;
            min-height: 120px; /* عمودی‌تر شدن */
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px; /* دور گرد */
            padding: 20px;
            color: white;
            font-size: 1rem;
            resize: none;
            outline: none;
            font-family: inherit;
        }

        textarea::placeholder { color: rgba(255,255,255,0.7); }

        button {
            background: white;
            color: #e73c7e;
            border: none;
            padding: 12px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { transform: scale(1.02); background: #f0f0f0; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* مخفی کردن اسکرول‌بار */
        #chat-flow::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div id="chat-flow">
            <div class="bubble ai-bubble">سلام سهراب! خوش اومدی به پلن‌لایف. امروز چه باوری رو می‌خوایم با هم تغییر بدیم؟</div>
        </div>
        
        <div class="input-area">
            <textarea id="userInput" placeholder="سوالت رو اینجا بنویس..."></textarea>
            <button onclick="handleChat()">ارسال به ماورای ذهن</button>
        </div>
    </div>

    <script>
        function handleChat() {
            const inputField = document.getElementById('userInput');
            const chatFlow = document.getElementById('chat-flow');
            const text = inputField.value.trim();

            if (text === "") return;

            // اضافه کردن پیام کاربر
            const userDiv = document.createElement('div');
            userDiv.className = 'bubble user-bubble';
            userDiv.innerText = text;
            chatFlow.appendChild(userDiv);

            // پاک کردن ورودی
            inputField.value = "";

            // اسکرول به پایین
            chatFlow.scrollTop = chatFlow.scrollHeight;

            // پاسخ هوش مصنوعی (موقت)
            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'bubble ai-bubble';
                aiDiv.innerHTML = "<b>پاسخ هوشمند:</b><br>من پیام تو رو دریافت کردم. در حال تحلیل فرکانس ذهنی تو هستم تا بهترین راهکار رو از 'ماورای ذهن' برات پیدا کنم. ✨";
                chatFlow.appendChild(aiDiv);
                chatFlow.scrollTop = chatFlow.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
