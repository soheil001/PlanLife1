<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">

<style>

html, body {

    margin: 0;

    height: 100%;

    font-family: 'Vazirmatn', sans-serif;

    background: linear-gradient(135deg, #00f2fe, #4facfe, #764ba2, #ff758c);

    background-attachment: fixed;

}

/* وسط‌چین کامل */

.main-center {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}

/* overlay */

#overlay {

    position: fixed;

    width: 100%;

    height: 100%;

    background: rgba(0,0,0,0.3);

    backdrop-filter: blur(5px);

    display: none;

    z-index: 1000;

}

#overlay.active { display: block; }

/* menu btn */

.menu-btn {

    position: fixed;

    top: 20px;

    width: 55px;

    height: 55px;

    border-radius: 50%;

    background: rgba(255,255,255,0.2);

    backdrop-filter: blur(10px);

    display: flex;

    align-items: center;

    justify-content: center;

    color: white;

    font-size: 24px;

    cursor: pointer;

    z-index: 3000;

}

.left-icon { left: 20px; }

.right-icon { right: 20px; }

/* panels */

.menu-panel {

    position: fixed;

    top: 0;

    width: 220px;

    height: 100%;

    backdrop-filter: blur(20px);

    background: rgba(255,255,255,0.1);

    padding-top: 80px;

    transition: 0.4s;

    z-index: 2500;

}

#leftPanel { left: -220px; }

#rightPanel { right: -220px; }

.active-left { left: 0 !important; }

.active-right { right: 0 !important; }

.menu-item {

    margin: 10px;

    padding: 15px;

    border-radius: 15px;

    text-align: center;

    color: white;

    background: rgba(255,255,255,0.1);

}

/* 🔮 orb */

.mystic-orb {

    width: 90px;

    height: 90px;

    border-radius: 50%;

    background: radial-gradient(circle, #fff, #00f2fe, #764ba2);

    box-shadow: 0 0 25px #00f2fe, 0 0 60px #764ba2;

    animation: pulse 2s infinite;

}

@keyframes pulse {

    0% { transform: scale(1); }

    50% { transform: scale(1.12); }

    100% { transform: scale(1); }

}

/* title */

.title {

    color: white;

    font-size: 40px;

    margin-top: 15px;

    font-weight: 700;

}

/* chat */

.chat-container {

    width: calc(100% - 40px);

    max-width: 360px;

    height: 420px;

    margin-top: 20px;

    background: rgba(255,255,255,0.15);

    backdrop-filter: blur(15px);

    border-radius: 25px;

    display: flex;

    flex-direction: column;

    padding: 10px;

    transition: 0.3s;

}

.chat-container.active {

    height: 65vh;

}

/* messages */

#chat-output {

    flex: 1;

    overflow-y: auto;

    display: flex;

    flex-direction: column;

    gap: 8px;

}

.msg-user {

    align-self: flex-end;

    background: rgba(0,0,0,0.4);

    color: white;

    padding: 8px 12px;

    border-radius: 12px;

}

.msg-bot {

    align-self: flex-start;

    background: rgba(255,255,255,0.3);

    color: white;

    padding: 8px 12px;

    border-radius: 12px;

}

/* input */

.input-box {

    display: flex;

    background: rgba(255,255,255,0.2);

    border-radius: 20px;

    padding: 5px;

}

input {

    flex: 1;

    border: none;

    background: transparent;

    color: white;

    font-size: 16px;

    outline: none;

}

button {

    border: none;

    width: 35px;

    height: 35px;

    border-radius: 50%;

}

/* grid */

.grid-buttons {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    width: calc(100% - 40px);

    max-width: 360px;

    margin-top: 15px;

    padding-bottom: 30px;

}

.btn-square {

    aspect-ratio: 1;

    border-radius: 15px;

    background: rgba(255,255,255,0.15);

    color: white;

    display: flex;

    justify-content: center;

    align-items: center;

}

</style>

</head>

<body>

<div id="overlay" onclick="closeAll()"></div>

<div class="menu-btn left-icon" onclick="toggleMenu('left')">☰</div>

<div class="menu-btn right-icon" onclick="toggleMenu('right')">☰</div>

<div id="leftPanel" class="menu-panel">

<div class="menu-item">خانه</div>

<div class="menu-item">پروفایل</div>

</div>

<div id="rightPanel" class="menu-panel">

<div class="menu-item">پروژه‌ها</div>

<div class="menu-item">پشتیبانی</div>

</div>

<!-- 🔥 بخش وسط -->

<div class="main-center">

<div class="mystic-orb"></div>

<div class="title">PlanLife</div>

<div class="chat-container" id="chatBox">

<div id="chat-output"></div>

<div class="input-box">

<input id="user-input" placeholder="پیام بده...">

<button onclick="sendMessage()">➤</button>

</div>

</div>

<div class="grid-buttons">

<div class="btn-square" onclick="quickMsg('انگیزه')">انگیزه</div>

<div class="btn-square" onclick="quickMsg('هدف')">هدف</div>

<div class="btn-square" onclick="quickMsg('پول')">پول</div>

<div class="btn-square" onclick="quickMsg('رشد')">رشد</div>

</div>

</div>

<script>

const input = document.getElementById("user-input");

const output = document.getElementById("chat-output");

const chatBox = document.getElementById("chatBox");

window.onload = () => {

    output.innerHTML += `<div class="msg-bot">سلام 👋 خوش اومدی به PlanLife 🌱</div>`;

};

function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    output.innerHTML += `<div class="msg-user">${text}</div>`;

    setTimeout(() => {

        output.innerHTML += `<div class="msg-bot">دارم باهات هوشمندتر میشم 😏</div>`;

        scrollDown();

    }, 500);

    input.value = "";

    scrollDown();

}

function quickMsg(t) {

    input.value = t;

    sendMessage();

}

function scrollDown() {

    output.scrollTop = output.scrollHeight;

}

input.addEventListener("keypress", e => {

    if (e.key === "Enter") sendMessage();

});

input.addEventListener("focus", () => {

    chatBox.classList.add("active");

});

input.addEventListener("blur", () => {

    chatBox.classList.remove("active");

});

function toggleMenu(side) {

    const left = document.getElementById('leftPanel');

    const right = document.getElementById('rightPanel');

    const overlay = document.getElementById('overlay');

    overlay.classList.add('active');

    if (side === 'left') {

        left.classList.toggle('active-left');

        right.classList.remove('active-right');

    } else {

        right.classList.toggle('active-right');

        left.classList.remove('active-left');

    }

}

function closeAll() {

    document.getElementById('leftPanel').classList.remove('active-left');

    document.getElementById('rightPanel').classList.remove('active-right');

    document.getElementById('overlay').classList.remove('active');

}

</script>

</body>

</html>
