<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 30%, #764ba2 70%, #ff758c 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            overflow: hidden;
        }

        /* منوها */
        .menu { position: fixed; top: 20px; width: 200px; height: 100vh; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); transition: 0.5s; padding: 20px; }
        #leftMenu { left: -250px; }
        #rightMenu { right: -250px; }
        .open { left: 0 !important; right: 0 !important; }

        /* گوی نبض‌دار */
        .pulse { width: 50px; height: 50px; background: radial-gradient(circle, #ff9a9e, #fad0c4, #a18cd1); border-radius: 50%; margin-top: 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 105, 135, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(255, 105, 135, 0); } 100% { transform: scale(0.95); } }

        /* باکس چت شیشه‌ای */
        .chat-container { width: 80%; height: 60vh; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; margin-top: 20px; display: flex; flex-direction: column; }
        .input-area { margin-top: auto; padding: 20px; display: flex; }
        input { flex: 1; padding: 10px; border-radius: 10px; border: none; outline: none; }
    </style>
</head>
<body>

    <button onclick="toggleMenu('leftMenu')">منو چپ</button>
    <button onclick="toggleMenu('rightMenu')" style="position:fixed; right:10px;">منو راست</button>

    <div id="leftMenu" class="menu"><ul><li>تست ۱</li><li>تست ۲</li><li>تست ۳</li><li>تست ۴</li></ul></div>
    <div id="rightMenu" class="menu"><ul><li>گزینه ۱</li><li>گزینه ۲</li><li>گزینه ۳</li><li>گزینه ۴</li></ul></div>

    <div class="pulse"></div>
    <h1>PlanLife</h1>

    <div class="chat-container">
        <div class="input-area">
            <input type="text" placeholder="پیام خود را بنویسید...">
            <button>➤</button>
        </div>
    </div>

    <script>
        function toggleMenu(id) {
            const menus = ['leftMenu', 'rightMenu'];
            menus.forEach(m => {
                if (m !== id) document.getElementById(m).classList.remove('open');
            });
            document.getElementById(id).classList.toggle('open');
        }
    </script>
</body>
</html>
