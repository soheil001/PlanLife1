<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlanLife | پلتفرم ماورای ذهن</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        
        body { 
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* گرادینت الهام گرفته از تصویر Canva شما */
            background: linear-gradient(135deg, #00c4cc 0%, #7d2ae8 100%);
            overflow: hidden;
            padding: 15px;
        }

        /* استایل منوی همبرگری */
        .menu-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .side-menu {
            position: fixed;
            top: 0;
            right: -300px;
            width: 280px;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            z-index: 999;
            padding: 60px 20px;
            transition: 0.4s ease;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .side-menu.active { right: 0; }

        .nav-item {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            color: white;
            text-align: center;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: bold;
        }

        /* ظرف چت باکس تمام شیشه‌ای */
        .chat-card {
            width: 100%;
            max-width: 450px;
            height: 85vh;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            position: relative;
        }

        .header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .earth-logo {
            width: 50px; height: 50px; border-radius: 50%;
            background: url('https://img.freepik.com/free-vector/blue-earth-glowing-light_1017-14243.jpg') center/cover;
            animation: rotateEarth 10s infinite linear;
            margin-bottom: 10px;
            box-shadow: 0 0 20px rgba(0, 196, 204, 0.5);
        }

        @keyframes rotateEarth { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .brand-name { color: white; font-size: 1.8rem; font-weight: 800; margin: 0; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 15px 5px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg { padding: 12px 18px; border-radius: 22px; font-size: 15px; line-height: 1.6; max-width: 85%; font-weight: 700; }
        .u { align-self: flex-start; background: #000; color: white; border-bottom-left-radius: 4px; }
        .a { align-self: flex-end; background: white; color: #7d2ae8; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        /* باکس تایپ ثابت در پایین */
        .input-area {
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        input {
            flex: 1; background: transparent; border: none; color: white;
            padding: 10px; outline: none; font-size: 16px; font-weight: bold;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.6); }

        .send-btn {
            background: #fff; border: none; padding: 10px 20px;
            border-radius: 15px; color: #7d2ae8; font-weight: 800; cursor: pointer;
        }

        /* استایل اسکرول بار مخفی */
        #chat-window::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body>

<div class="menu-btn" onclick="toggleMenu()">
    <div style="width:25px; height:3px; background:white; margin: 4px 0;"></div>
    <div style="width:25px; height:3px; background:white; margin: 4px 0;"></div>
    <div style="width:25px; height:3px; background:white; margin: 4px 0;"></div>
</div>

<div class="side-menu" id="sideMenu">
    <div style="color:#00c4cc; font-weight:900; text-align:center; margin-bottom:20px;">PLAN LIFE MENU</div>
    <a href="#" class="nav-item">دوره قانون جذب</a>
    <a href="#" class="nav-item">مدیتیشن و فرکانس</a>
    <a href="#" class="nav-item">فروشگاه محصولات</a>
    <a href="#" class="nav-item">سوالات متداول</a>
    <a href="#" class="nav-item">ارتباط با ما</a>
    <button onclick="toggleMenu()" style="margin-top:auto; background: #ff2d55; border:none; padding:12px; border-radius:12px; color:white; font-weight:bold;">بستن منو</button>
</div>

<div class="chat-card">
    <div class="header">
        <div class="earth-logo"></div>
        <h1 class="brand-name">PlanLife</h1>
    </div>
    
    <div id="chat-window">
        <div class="msg a">خوش آمدی. فرکانس PlanLife آماده پاسخگویی است. ✨</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="تایپ کنید..." onkeypress="if(event.keyCode===13)send()">
        <button class="send-btn" onclick="send()">ارسال</button>
    </div>
</div>

<script>
    let brain = {};

    function toggleMenu() {
        document.getElementById('sideMenu').classList.toggle('active');
    }

    async function loadBrain() {
        try {
            const response = await fetch('database.txt?v=' + Math.random());
            const data = await response.text();
            data.split('\n').forEach(line => {
                const parts = line.split('|');
                if (parts.length === 2) brain[parts[0].trim()] = parts[1].trim();
            });
        } catch (e) { console.log("Database loading..."); }
    }

    loadBrain();

    function send() {
        const input = document.getElementById('userInput');
        const window = document.getElementById('chat-window');
        const val = input.value.trim();
        if (!val) return;

        window.innerHTML += `<div class="msg u">${val}</div>`;
        input.value = "";
        window.scrollTop = window.scrollHeight;

        let reply = "";
        for (let key in brain) {
            if (val.includes(key)) { reply = brain[key]; break; }
        }
        if (!reply) reply = "این پیام در مدار آگاهی کنونی نیست. ✨";

        setTimeout(() => {
            window.innerHTML += `<div class="msg a">${reply}</div>`;
            window.scrollTop = window.scrollHeight;
        }, 600);
    }
</script>

</body>
</html>
