<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; height: 100vh; background: linear-gradient(135deg, #00f2fe, #4facfe, #764ba2, #ff758c); display: flex; flex-direction: column; align-items: center; font-family: -apple-system, sans-serif; overflow-y: auto; }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.2); backdrop-filter: blur(5px); z-index: 1000; display: none; }
        #overlay.active { display: block; }

        .menu-btn { position: fixed; top: 20px; width: 55px; height: 55px; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; font-size: 25px; z-index: 3000; }
        .left-icon { left: 20px; }
        .right-icon { right: 20px; }

        .menu-panel { position: fixed; top: 0; width: 220px; height: 100%; background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); transition: 0.5s; padding-top: 80px; z-index: 2500; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        #leftPanel { left: -220px; }
        #rightPanel { right: -220px; }
        .active-left { left: 0 !important; }
        .active-right { right: 0 !important; }

        .menu-item { width: 85%; padding: 15px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 15px; color: white; text-align: center; }

        /* گوی نبض‌زن */
        .pulse { width: 50px; height: 50px; background: radial-gradient(circle, #ffffff, #00f2fe); border-radius: 50%; margin-top: 85px; 
                 box-shadow: 0 0 20px rgba(255,255,255,0.8); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); box-shadow: 0 0 30px #00f2fe; } 100% { transform: scale(1); } }
        
        .title { color: white; margin: 15px 0 0 0; font-family: 'Nunito', sans-serif; font-size: 45px; }

        /* چت باکس ۱۰ پیکسل جمع‌تر شده */
        .chat-container { width: calc(100% - 50px); max-width: 360px; height: 400px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); border-radius: 30px; margin-top: 15px; display: flex; flex-direction: column; padding: 15px; }

        /* دکمه‌های مربعی ۲ ستونه */
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: calc(100% - 50px); max-width: 360px; margin-top: 15px; padding-bottom: 30px; }
        .btn-square { aspect-ratio: 1 / 1; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); border-radius: 15px; color: white; display: flex; align-items: center; justify-content: center; font-size: 13px; text-align: center; backdrop-filter: blur(5px); cursor: pointer; }
    </style>
</head>
<body>

    <div id="overlay" onclick="closeAll()"></div>
    <div class="menu-btn left-icon" onclick="toggleMenu('left')">☰</div>
    <div class="menu-btn right-icon" onclick="toggleMenu('right')">☰</div>

    <div id="leftPanel" class="menu-panel">
        <div class="menu-item">خانه</div><div class="menu-item">پروفایل</div><div class="menu-item">تنظیمات</div>
    </div>
    <div id="rightPanel" class="menu-panel">
        <div class="menu-item">پروژه‌ها</div><div class="menu-item">اشتراک</div><div class="menu-item">پشتیبانی</div>
    </div>

    <div class="pulse"></div>
    <h1 class="title">PlanLife</h1>

    <div class="chat-container">
        <div id="chat-output" style="flex:1; color:white; padding:10px;">پیام‌های چت...</div>
        <div style="display:flex; align-items:center; background:rgba(255,255,255,0.2); border-radius:20px; padding:5px;">
            <input type="text" placeholder="پرسش..." style="flex:1; border:none; background:transparent; padding:10px; color:white;">
            <button style="border-radius:50%; border:none; width:35px; height:35px;">➤</button>
        </div>
    </div>

    <div class="grid-buttons">
        <div class="btn-square">قانون جذب</div>
        <div class="btn-square">پول‌سازی</div>
        <div class="btn-square">باورها</div>
        <div class="btn-square">رشد فردی</div>
        <div class="btn-square">انگیزه</div>
        <div class="btn-square">هدف</div>
    </div>

    <script>
        function toggleMenu(side) {
            const left = document.getElementById('leftPanel');
            const right = document.getElementById('rightPanel');
            const overlay = document.getElementById('overlay');
            if(side === 'left') {
                right.classList.remove('active-right');
                left.classList.toggle('active-left');
                overlay.classList.toggle('active');
            } else {
                left.classList.remove('active-left');
                right.classList.toggle('active-right');
                overlay.classList.toggle('active');
            }
        }
        function closeAll() {
            document.getElementById('leftPanel').classList.remove('active-left');
            document.getElementById('rightPanel').classList.remove('active-right');
            document.getElementById('overlay').classList.remove('active');
        }
    </script>
</body>
</html>
