<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlanLife | صفحه اصلی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&family=League+Spartan:wght@800&display=swap');

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; transition: 0.3s ease; }
        
        body { 
            margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(135deg, #00c4cc, #7d2ae8, #00c4cc);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            background-attachment: fixed; overflow-x: hidden; padding: 10px;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        body.menu-open .main-layout { filter: blur(15px); pointer-events: none; }

        /* دکمه‌های منو */
        .menu-btn {
            position: fixed; top: 25px; z-index: 1001;
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px; border-radius: 12px; cursor: pointer; backdrop-filter: blur(10px);
        }
        .btn-right { right: 25px; } .btn-left { left: 25px; }
        .menu-btn div { width: 20px; height: 2px; background: white; margin: 4px 0; }

        /* منوهای دوجانبه */
        .side-menu {
            position: fixed; top: 0; width: 260px; height: 100%;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(40px);
            z-index: 1000; padding: 70px 20px; transition: 0.5s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #rightMenu { right: -300px; }
        #leftMenu { left: -300px; }
        #rightMenu.active { right: 0; }
        #leftMenu.active { left: 0; }

        .nav-item {
            display: block; padding: 12px; background: rgba(255, 255, 255, 0.08); border-radius: 12px;
            color: white; text-align: center; text-decoration: none; margin-bottom: 10px; border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* گوی‌های نبض‌زن */
        .orb {
            border-radius: 50%; background: radial-gradient(circle, #fff 0%, #a2d2ff 100%);
            animation: pulse 3s infinite ease-in-out; border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .main-orb { width: 50px; height: 50px; margin-bottom: 5px; box-shadow: 0 0 20px rgba(162, 210, 255, 0.6); }
        .small-orb { width: 22px; height: 22px; cursor: pointer; box-shadow: 0 0 10px rgba(162, 210, 255, 0.8); }
        
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.15); opacity: 1; } }

        .brand-canva { color: white; font-family: 'League Spartan', sans-serif; font-size: 2.2rem; font-weight: 800; margin-bottom: 30px; cursor: pointer; }

        /* چت باکس */
        .chat-card {
            width: calc(100% - 25px); max-width: 450px; height: 55vh;
            background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(30px);
            border-radius: 35px; border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex; flex-direction: column; padding: 20px 5px 10px 5px; box-shadow: 0 25px 50px rgba(0,0,0,0.1);
        }

        #chat-window { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 18px; font-size: 13px; max-width: 85%; }
        .u { align-self: flex-start; background: rgba(255, 255, 255, 0.12); color: white; }
        .a { align-self: flex-end; background: rgba(0, 0, 0, 0.15); color: white; }

        /* کادر ورودی (بپرسید) */
        .input-area {
            margin: 5px 10px 15px 10px;
            display: flex; align-items: center; gap: 10px; 
            background: rgba(255, 255, 255, 0.08); padding: 12px 15px;
            border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.2);
        }
        input { flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 14px; }

        /* گرید باکس‌های محتوایی */
        .content-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 450px; margin-top: 30px; padding-bottom: 40px;
        }
        .content-box {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2); padding: 12px; text-align: center; color: white;
            min-height: 190px; display: flex; flex-direction: column; cursor: pointer;
        }
        .box-img { width: 100%; height: 120px; background: rgba(255,255,255,0.05); border-radius: 18px; margin-bottom: 10px; }
        .content-box span { font-weight: 500; font-size: 14px; margin-top: auto; }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; display: none; }
        #chat-window::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body>

<div id="overlay" onclick="closeAllMenus()"></div>

<div class="menu-btn btn-right" onclick="toggleMenu('rightMenu')"><div></div><div></div><div></div></div>
<div class="side-menu" id="rightMenu">
    <div style="color:white; font-weight:800; text-align:center; margin-bottom:20px;">حساب کاربری</div>
    <a href="#" class="nav-item">ورود</a>
    <a href="#" class="nav-item">ثبت‌نام</a>
</div>

<div class="menu-btn btn-left" onclick="toggleMenu('leftMenu')"><div></div><div></div><div></div></div>
<div class="side-menu" id="leftMenu">
    <div style="color:white; font-weight:800; text-align:center; margin-bottom:20px;">ابزارها</div>
    <a href="#" class="nav-item">تنظیمات</a>
    <a href="#" class="nav-item">پشتیبانی</a>
</div>

<div class="main-layout" style="width:100%; display:flex; flex-direction:column; align-items:center; margin-top: 30px;">
    <div class="orb main-orb"></div>
    <h1 class="brand-canva">PlanLife</h1>

    <div class="chat-card">
        <div id="chat-window">
            <div class="msg a">سوالات ذهنی خودتان را بپرسید ✨</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="بپرس..." onkeypress="if(event.keyCode===13)send()">
            <div class="orb small-orb" onclick="send()"></div>
        </div>
    </div>

    <div class="content-grid">
        <div class="content-box" onclick="location.href='podcasts.html'">
            <div class="box-img"></div><span>پادکست‌ها</span>
        </div>
        <div class="content-box"><div class="box-img"></div><span>تمرینات</span></div>
        <div class="content-box"><div class="box-img"></div><span>کتاب‌ها</span></div>
        <div class="content-box"><div class="box-img"></div><span>باورها</span></div>
    </div>
</div>

<script>
    function toggleMenu(id) {
        closeAllMenus();
        document.getElementById(id).classList.add('active');
        document.getElementById('overlay').style.display = 'block';
        document.body.classList.add('menu-open');
    }
    function closeAllMenus() {
        document.querySelectorAll('.side-menu').forEach(m => m.classList.remove('active'));
        document.getElementById('overlay').style.display = 'none';
        document.body.classList.remove('menu-open');
    }

    function send() {
        const i = document.getElementById('userInput');
        const w = document.getElementById('chat-window');
        const v = i.value.trim();
        if (!v) return;
        w.innerHTML += `<div class="msg u">${v}</div>`;
        i.value = "";
        setTimeout(() => {
            w.innerHTML += `<div class="msg a">در حال پردازش آگاهی شما... ✨</div>`;
            w.scrollTop = w.scrollHeight;
        }, 600);
    }
</script>

</body>
</html>
