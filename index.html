<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlanLife | آگاهی برتر</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&family=Montserrat:wght@800&display=swap');

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        
        body { 
            margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(135deg, #00c4cc 0%, #7d2ae8 100%);
            background-attachment: fixed; overflow-x: hidden; padding: 20px 10px;
            transition: filter 0.4s ease;
        }

        /* افکت تار شدن صفحه هنگام باز بودن منو */
        body.menu-open .main-layout { filter: blur(12px); pointer-events: none; }

        .menu-btn {
            position: fixed; top: 25px; right: 25px; z-index: 1001;
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px; border-radius: 12px; cursor: pointer; backdrop-filter: blur(10px);
        }
        .menu-btn div { width: 22px; height: 2px; background: white; margin: 5px 0; }

        .side-menu {
            position: fixed; top: 0; right: -300px; width: 280px; height: 100%;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(35px);
            z-index: 1000; padding: 80px 20px; transition: 0.5s ease;
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            display: flex; flex-direction: column; gap: 12px;
        }
        .side-menu.active { right: 0; }

        .nav-item {
            padding: 14px; background: rgba(255, 255, 255, 0.1); border-radius: 12px;
            color: white; text-align: center; text-decoration: none; border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* گوی نبض‌زن هم‌رنگ بگراند */
        .pulsing-orb {
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2), inset 0 0 15px rgba(255, 255, 255, 0.3);
            margin-bottom: 25px;
            animation: pulse 3s infinite ease-in-out;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; box-shadow: 0 0 20px rgba(255, 255, 255, 0.2); }
            50% { transform: scale(1.15); opacity: 0.9; box-shadow: 0 0 40px rgba(255, 255, 255, 0.4); }
        }

        /* باکس چت با ارتفاع اصلاح شده */
        .chat-card {
            width: 98%; max-width: 460px; height: calc(55vh + 10px);
            background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(25px);
            border-radius: 35px; border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex; flex-direction: column; padding: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15); margin-bottom: 40px;
        }

        .brand-name { color: white; font-family: 'Montserrat', sans-serif; font-size: 2rem; font-weight: 800; text-align: center; margin-bottom: 15px; }

        #chat-window { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 16px; border-radius: 18px; font-size: 14px; max-width: 85%; }
        .u { align-self: flex-start; background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.15); }
        .a { align-self: flex-end; background: rgba(0, 0, 0, 0.15); color: white; border: 1px solid rgba(255, 255, 255, 0.1); }

        .input-area {
            display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.08);
            padding: 5px 15px; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.2);
        }
        input { flex: 1; background: transparent; border: none; color: white; padding: 12px 0; outline: none; font-weight: bold; }

        /* دکمه ارسال با نور خفیف */
        .gemini-send { background: none; border: none; cursor: pointer; display: flex; align-items: center; }
        .gemini-icon { 
            width: 24px; height: 24px; fill: white; 
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.6)); /* نور خفیف ستاره */
        }

        /* باکس‌های دوره مستطیلی */
        .course-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 460px; padding-bottom: 50px;
        }
        .course-box {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px);
            border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px; text-align: center; color: white;
            min-height: calc(180px + 15px); /* افزایش ۱.۵ سانتی ارتفاع */
        }
        .box-img { width: 100%; aspect-ratio: 4/3; background: rgba(255,255,255,0.05); border-radius: 18px; margin-bottom: 10px; }

        #chat-window::-webkit-scrollbar { width: 0; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; display: none; }
    </style>
</head>
<body>

<div id="overlay" onclick="toggleMenu()"></div>

<div class="menu-btn" onclick="toggleMenu()">
    <div></div><div></div><div></div>
</div>

<div class="side-menu" id="sideMenu">
    <div style="color:white; font-weight:800; text-align:center; margin-bottom:20px;">PlanLife</div>
    <a href="#" class="nav-item">دوره جذب ثروت</a>
    <a href="#" class="nav-item">مدیتیشن عمیق</a>
    <a href="#" class="nav-item">ارتباط با استاد</a>
    <a href="#" class="nav-item">تنظیمات کاربری</a>
</div>

<div class="main-layout" style="width:100%; display:flex; flex-direction:column; align-items:center;">
    <div class="pulsing-orb"></div>

    <div class="chat-card">
        <h1 class="brand-name">PlanLife</h1>
        <div id="chat-window">
            <div class="msg a">سوالات ذهنی خودتان را بپرسید تا راهنمایی کنم ✨</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="بپرس..." onkeypress="if(event.keyCode===13)send()">
            <button class="gemini-send" onclick="send()">
                <svg class="gemini-icon" viewBox="0 0 24 24"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"></path></svg>
            </button>
        </div>
    </div>

    <div class="course-grid">
        <div class="course-box"><div class="box-img"></div><strong>دوره ۱</strong></div>
        <div class="course-box"><div class="box-img"></div><strong>دوره ۲</strong></div>
        <div class="course-box"><div class="box-img"></div><strong>دوره ۳</strong></div>
        <div class="course-box"><div class="box-img"></div><strong>دوره ۴</strong></div>
    </div>
</div>

<script>
    let brain = {};
    function toggleMenu() {
        const menu = document.getElementById('sideMenu');
        const overlay = document.getElementById('overlay');
        const body = document.body;
        menu.classList.toggle('active');
        body.classList.toggle('menu-open');
        overlay.style.display = menu.classList.contains('active') ? 'block' : 'none';
    }

    async function loadBrain() {
        try {
            const r = await fetch('database.txt?v=' + Math.random());
            const d = await r.text();
            d.split('\n').forEach(l => {
                const p = l.split('|');
                if (p.length === 2) brain[p[0].trim()] = p[1].trim();
            });
        } catch (e) {}
    }
    loadBrain();

    function send() {
        const i = document.getElementById('userInput');
        const w = document.getElementById('chat-window');
        const v = i.value.trim();
        if (!v) return;
        w.innerHTML += `<div class="msg u">${v}</div>`;
        i.value = "";
        let r = "";
        for (let k in brain) { if (v.includes(k)) { r = brain[k]; break; } }
        if (!r) r = "یا این سوال شما فعلاً پاسخی براش نیست یا نامربوط به حوزه ی سایت است";
        setTimeout(() => {
            w.innerHTML += `<div class="msg a">${r}</div>`;
            w.scrollTop = w.scrollHeight;
        }, 500);
    }
</script>

</body>
</html>
