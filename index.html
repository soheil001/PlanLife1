<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">

<style>

/* RESET */

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    font-family: 'Vazirmatn', sans-serif;

    background: linear-gradient(135deg,#00f2fe,#4facfe,#764ba2,#ff758c);

    background-attachment: fixed;

    color: white;

}

/* صفحات */

.page {

    display: none;

    min-height: 100vh;

    padding-bottom: 40px;

}

.page.active {

    display: block;

}

/* CENTER WRAPPER */

.container {

    display: flex;

    flex-direction: column;

    align-items: center;

}

/* MENU */

.menu-btn {

    position: fixed;

    top: 20px;

    width: 50px;

    height: 50px;

    border-radius: 50%;

    background: rgba(255,255,255,0.2);

    backdrop-filter: blur(10px);

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 2000;

}

.left { left: 15px; }

.right { right: 15px; }

.panel {

    position: fixed;

    top: 0;

    width: 220px;

    height: 100%;

    background: rgba(255,255,255,0.1);

    backdrop-filter: blur(20px);

    padding-top: 80px;

    transition: .3s;

}

#leftPanel { left: -220px; }

#rightPanel { right: -220px; }

.openL { left: 0; }

.openR { right: 0; }

.item {

    margin: 10px;

    padding: 15px;

    border-radius: 12px;

    background: rgba(255,255,255,0.15);

    text-align: center;

}

/* ORB */

.orb {

    width: 60px;

    height: 60px;

    margin-top: 90px;

    border-radius: 50%;

    background: radial-gradient(circle,#fff,#e6faff);

    box-shadow: 0 0 20px #fff, 0 0 40px #bdf3ff;

    animation: pulse 2s infinite;

}

@keyframes pulse {

    50% { transform: scale(1.1); }

}

/* TITLE */

.title {

    font-size: 38px;

    margin: 10px 0 5px;

}

/* CHAT */

.chat {

    width: 90%;

    max-width: 380px;

    height: 380px;

    background: rgba(255,255,255,0.15);

    backdrop-filter: blur(15px);

    border-radius: 25px;

    display: flex;

    flex-direction: column;

    padding: 12px;

}

#out {

    flex: 1;

    overflow-y: auto;

    display: flex;

    flex-direction: column;

    gap: 6px;

}

.msg-user {

    align-self: flex-end;

    background: rgba(0,0,0,0.3);

    padding: 8px 12px;

    border-radius: 12px;

}

.msg-bot {

    align-self: flex-start;

    background: rgba(255,255,255,0.25);

    padding: 8px 12px;

    border-radius: 12px;

}

/* INPUT */

.input-box {

    display: flex;

    margin-top: 8px;

    background: rgba(255,255,255,0.2);

    border-radius: 20px;

    padding: 5px;

}

input {

    flex: 1;

    border: none;

    background: transparent;

    color: white;

    font-size: 16px;

    outline: none;

}

/* GRID */

.grid {

    width: 90%;

    max-width: 380px;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-top: 15px;

}

.btn {

    aspect-ratio: 1;

    border-radius: 18px;

    background: rgba(255,255,255,0.15);

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 14px;

}

/* HEADER */

.header {

    text-align: center;

    padding: 20px;

    font-size: 22px;

}

/* PLAYER */

.player {

    width: 90%;

    max-width: 400px;

    margin: 20px auto;

    padding: 15px;

    border-radius: 20px;

    background: rgba(255,255,255,0.2);

}

.pod-item {

    width: 90%;

    max-width: 400px;

    margin: 10px auto;

    padding: 12px;

    border-radius: 12px;

    background: rgba(255,255,255,0.15);

}

.back {

    text-align: center;

    margin-top: 20px;

}

</style>

</head>

<body>

<!-- MENU -->

<div class="menu-btn left" onclick="toggle('L')">☰</div>

<div class="menu-btn right" onclick="toggle('R')">☰</div>

<div id="leftPanel" class="panel">

<div class="item">خانه</div>

<div class="item">پروفایل</div>

</div>

<div id="rightPanel" class="panel">

<div class="item">پروژه‌ها</div>

<div class="item">پشتیبانی</div>

</div>

<!-- HOME -->

<div id="home" class="page active">

<div class="container">

<div class="orb"></div>

<div class="title">PlanLife</div>

<div class="chat">

<div id="out"></div>

<div class="input-box">

<input id="inp" placeholder="پیام بده...">

<button onclick="send()">➤</button>

</div>

</div>

<div class="grid">

<div class="btn" onclick="go('podcast')">پادکست</div>

<div class="btn" onclick="go('motivation')">انگیزه</div>

<div class="btn" onclick="go('goal')">هدف</div>

<div class="btn" onclick="go('money')">پول</div>

</div>

</div>

</div>

<!-- PODCAST -->

<div id="podcast" class="page">

<div class="header">🎧 پادکست</div>

<div class="player">

<audio id="audio" controls style="width:100%"></audio>

</div>

<div id="podList"></div>

<div class="back"><button onclick="go('home')">برگشت</button></div>

</div>

<!-- OTHER PAGES -->

<div id="motivation" class="page"><div class="header">انگیزه</div></div>

<div id="goal" class="page"><div class="header">هدف</div></div>

<div id="money" class="page"><div class="header">پول</div></div>

<script>

/* CHAT */

window.onload = () => {

    out.innerHTML += `<div class="msg-bot">سلام 👋 خوش اومدی</div>`;

};

function send() {

    if(!inp.value) return;

    out.innerHTML += `<div class="msg-user">${inp.value}</div>`;

    setTimeout(()=>{

        out.innerHTML += `<div class="msg-bot">دارم بهتر میشم 😏</div>`;

        out.scrollTop = out.scrollHeight;

    },500);

    inp.value="";

}

/* NAV */

function go(id){

    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));

    document.getElementById(id).classList.add('active');

}

/* MENU */

function toggle(s){

    if(s==='L'){

        leftPanel.classList.toggle('openL');

        rightPanel.classList.remove('openR');

    }else{

        rightPanel.classList.toggle('openR');

        leftPanel.classList.remove('openL');

    }

}

/* PODCAST LIST */

for(let i=1;i<=10;i++){

    podList.innerHTML += `<div class="pod-item" onclick="play()">پادکست ${i}</div>`;

}

function play(){

    audio.src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";

    audio.play();

}

</script>

</body>

</html>
