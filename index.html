<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlanLife | پلتفرم تحول</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&family=League+Spartan:wght@800&display=swap');

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; transition: 0.5s cubic-bezier(0.25, 0.8, 0.25, 1); }
        
        body { 
            margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(135deg, #00c4cc, #7d2ae8, #00c4cc);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            background-attachment: fixed; overflow-x: hidden; padding: 10px;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* منوها */
        .menu-btn { position: fixed; top: 25px; z-index: 1001; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); padding: 10px; border-radius: 12px; cursor: pointer; backdrop-filter: blur(10px); }
        .btn-right { right: 20px; } 
        .btn-left { left: 20px; }
        .menu-btn div { width: 22px; height: 2px; background: white; margin: 5px 0; border-radius: 2px; }

        .side-menu { 
            position: fixed; top: 0; width: 260px; height: 100%; background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(40px); z-index: 1000; padding: 80px 20px; border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        #rightMenu { right: -300px; }
        #leftMenu { left: -300px; }
        #rightMenu.active { right: 0; }
        #leftMenu.active { left: 0; }

        .nav-item { display: block; padding: 15px; background: rgba(255, 255, 255, 0.1); border-radius: 15px; color: white; text-align: center; cursor: pointer; margin-bottom: 12px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .nav-item:hover { background: rgba(255, 255, 255, 0.2); }

        .page { display: none; width: 100%; flex-direction: column; align-items: center; }
        .page.active { display: flex; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        #overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.3); display:none; z-index:999; backdrop-filter: blur(2px); }

        /* پلیر */
        .player-card { width: 100%; max-width: 400px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(20px); border-radius: 40px; padding: 25px; text-align: center; color: white; }
        .podcast-scroll { width: 100%; max-width: 400px; height: 300px; overflow-y: auto; margin-top: 15px; padding: 5px; }
        .podcast-item { background: rgba(255,255,255,0.1); margin-bottom: 10px; padding: 15px; border-radius: 18px; color: white; cursor: pointer; text-align: right; }
    </style>
</head>
<body>

<div id="overlay" onclick="closeMenus()"></div>

<div class="menu-btn btn-right" onclick="toggleMenu('rightMenu')"><div></div><div></div><div></div></div>
<div class="menu-btn btn-left" onclick="toggleMenu('leftMenu')"><div></div><div></div><div></div></div>

<div id="rightMenu" class="side-menu">
    <div class="nav-item" onclick="closeMenus()">پروفایل</div>
    <div class="nav-item" onclick="closeMenus()">تنظیمات</div>
    <div class="nav-item" onclick="location.reload()">خروج</div>
</div>

<div id="leftMenu" class="side-menu">
    <div class="nav-item" onclick="showPage('homePage')">صفحه اصلی</div>
    <div class="nav-item" onclick="showPage('podcastPage')">پادکست‌ها</div>
</div>

<div style="width:100%; display:flex; flex-direction:column; align-items:center; margin-top: 80px;">
    <h1 style="color:white; font-family:'League Spartan';">PlanLife</h1>

    <div id="homePage" class="page active" style="color:white;">خوش آمدید</div>

    <div id="podcastPage" class="page">
        <div class="player-card">
            <h3 id="p-title">پادکست را انتخاب کنید</h3>
            <button onclick="togglePlay()" style="background:white; border:none; border-radius:50%; width:60px; height:60px; cursor:pointer;">▶</button>
        </div>
        <div class="podcast-scroll" id="p-list"></div>
        <div class="nav-item" style="width:120px; margin-top:10px;" onclick="showPage('homePage')">بازگشت</div>
    </div>
</div>

<audio id="mainAudio"></audio>

<script>
    const audio = document.getElementById('mainAudio');
    const pList = document.getElementById('p-list');
    const menus = ['rightMenu', 'leftMenu'];

    const podcasts = [
        { id: 1, title: "پادکست ۱", url: "" }, { id: 2, title: "پادکست ۲", url: "" },
        { id: 3, title: "پادکست ۳", url: "" }, { id: 4, title: "پادکست ۴", url: "" },
        { id: 5, title: "پادکست ۵", url: "" }, { id: 6, title: "پادکست ۶", url: "" },
        { id: 7, title: "پادکست ۷", url: "" }, { id: 8, title: "پادکست ۸", url: "" },
        { id: 9, title: "پادکست ۹", url: "" }, { id: 10, title: "پادکست ۱۰", url: "" }
    ];

    podcasts.forEach(p => {
        pList.innerHTML += `<div class="podcast-item" onclick="loadTrack('${p.url}', '${p.title}')">${p.title}</div>`;
    });

    function toggleMenu(id) {
        const el = document.getElementById(id);
        const isActive = el.classList.contains('active');
        closeMenus(); // همه را می‌بندد
        if (!isActive) {
            el.classList.add('active');
            document.getElementById('overlay').style.display = 'block';
        }
    }

    function closeMenus() {
        menus.forEach(m => document.getElementById(m).classList.remove('active'));
        document.getElementById('overlay').style.display = 'none';
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        closeMenus();
    }

    function loadTrack(url, title) {
        if(!url) return alert("لطفاً لینک فایل را در آرایه پادکست‌ها قرار دهید.");
        audio.src = url;
        document.getElementById('p-title').innerText = title;
        audio.play();
    }

    function togglePlay() { audio.paused ? audio.play() : audio.pause(); }
</script>
</body>
</html>
