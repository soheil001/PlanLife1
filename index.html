<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlanLife | هوش ماورایی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&family=League+Spartan:wght@800&display=swap');

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        
        body { 
            margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(135deg, #00c4cc, #7d2ae8, #00c4cc);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            background-attachment: fixed; overflow-x: hidden; padding: 10px;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        body.menu-open .main-container { filter: blur(15px); }

        /* منوها */
        .menu-btn {
            position: fixed; top: 25px; z-index: 1001;
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px; border-radius: 12px; cursor: pointer; backdrop-filter: blur(10px);
        }
        .btn-right { right: 20px; } .btn-left { left: 20px; }
        .menu-btn div { width: 22px; height: 2px; background: white; margin: 5px 0; border-radius: 2px; }

        .side-menu {
            position: fixed; top: 0; width: 270px; height: 100%;
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(45px);
            z-index: 1000; padding: 80px 20px; border: 1px solid rgba(255, 255, 255, 0.2);
            transition: 0.6s ease;
        }
        #rightMenu { right: -300px; } #leftMenu { left: -300px; }
        #rightMenu.active { right: 0; } #leftMenu.active { left: 0; }

        /* باکس چت اصلی */
        .chat-card { 
            width: 100%; max-width: 450px; height: calc(55vh + 20px);
            background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(35px); 
            border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.3); 
            display: flex; flex-direction: column; padding: 20px; margin-top: 60px;
        }
        #chat-window { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 18px; border-radius: 22px; font-size: 14px; max-width: 85%; text-align: right; }
        .a { align-self: flex-start; background: rgba(255, 255, 255, 0.15); color: white; border: 1px solid rgba(255,255,255,0.1); }

        /* بخش ورودی چت اصلاح شده */
        .input-container {
            margin-top: 15px; display: flex; align-items: center; gap: 10px;
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 15px; border-radius: 30px; backdrop-filter: blur(10px);
        }
        input { flex: 1; background: transparent; border: none; color: white; outline: none; padding: 10px; font-size: 14px; }
        .send-btn { 
            width: 35px; height: 35px; background: none; border: none; 
            font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            text-shadow: 0 0 10px #ffd700;
        }

        /* دکمه‌های نارنجی گرادینت پایین */
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 450px; margin-top: 25px; }
        .nav-btn {
            padding: 20px; text-align: center; color: white; font-weight: 800; text-decoration: none;
            border-radius: 25px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2);
            background: linear-gradient(135deg, #ff9a00, #ff5100); /* نارنجی گرادینت شیک */
            box-shadow: 0 10px 20px rgba(255, 81, 0, 0.3);
        }
        .nav-btn:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(255, 81, 0, 0.5); }

        /* صفحه پادکست */
        .page { display: none; width: 100%; flex-direction: column; align-items: center; }
        .page.active { display: flex; animation: fadeIn 0.8s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; } }

        #overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); display:none; z-index:999; backdrop-filter: blur(4px); }
    </style>
</head>
<body>

<div id="overlay" onclick="closeMenus()"></div>

<div class="menu-btn btn-right" onclick="openMenu('rightMenu')"><div></div><div></div><div></div></div>
<div class="menu-btn btn-left" onclick="openMenu('leftMenu')"><div></div><div></div><div></div></div>

<div id="rightMenu" class="side-menu">
    <div class="nav-btn" style="background:none; margin-bottom:10px;">پروفایل</div>
    <div class="nav-btn" style="background:none;" onclick="location.reload()">خروج</div>
</div>

<div id="leftMenu" class="side-menu">
    <div class="nav-btn" style="background:none; margin-bottom:10px;" onclick="showPage('homePage')">صفحه اصلی</div>
    <div class="nav-btn" style="background:none;" onclick="showPage('podcastPage')">پادکست‌ها</div>
</div>

<div class="main-container" style="width:100%; display:flex; flex-direction:column; align-items:center;">
    
    <div id="homePage" class="page active">
        <div class="chat-card">
            <div id="chat-window">
                <div class="msg a">سوال ذهنی خودتان را بپرسید... ✨</div>
            </div>
            <div class="input-container">
                <input type="text" placeholder="بنویسید...">
                <button class="send-btn">✨</button>
            </div>
        </div>
        
        <div class="grid-buttons">
            <div class="nav-btn" onclick="showPage('podcastPage')">پادکست‌ها</div>
            <div class="nav-btn">تمرینات</div>
            <div class="nav-btn">کتاب‌ها</div>
            <div class="nav-btn">باورها</div>
        </div>
    </div>

    <div id="podcastPage" class="page">
        <h2 style="color:white; margin-top:100px;">لیست پادکست‌ها</h2>
        <div class="nav-btn" style="width:150px; margin-top:20px;" onclick="showPage('homePage')">بازگشت</div>
    </div>
</div>

<script>
    function openMenu(id) {
        closeMenus();
        document.getElementById(id).classList.add('active');
        document.getElementById('overlay').style.display = 'block';
        document.body.classList.add('menu-open');
    }
    function closeMenus() {
        document.querySelectorAll('.side-menu').forEach(m => m.classList.remove('active'));
        document.getElementById('overlay').style.display = 'none';
        document.body.classList.remove('menu-open');
    }
    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        closeMenus();
    }
</script>

</body>
</html>
