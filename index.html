<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlanLife | پلتفرم تحول</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&family=League+Spartan:wght@800&display=swap');

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; transition: 0.3s; }
        
        body { 
            margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(135deg, #00c4cc, #7d2ae8, #00c4cc);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            background-attachment: fixed; overflow-x: hidden; padding: 10px;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* استایل منوها و دکمه‌ها */
        .menu-btn { position: fixed; top: 25px; z-index: 1001; background: rgba(255, 255, 255, 0.15); padding: 10px; border-radius: 12px; cursor: pointer; backdrop-filter: blur(10px); box-shadow: 0 0 15px rgba(255, 145, 0, 0.25); }
        .btn-right { right: 20px; } .btn-left { left: 20px; }
        .side-menu { position: fixed; top: 0; width: 260px; height: 100%; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(40px); z-index: 1000; padding: 80px 20px; transition: 0.6s ease; }
        #rightMenu { right: -300px; } #leftMenu { left: -300px; }
        #rightMenu.active { right: 0; } #leftMenu.active { left: 0; }

        .nav-item { display: block; padding: 15px; background: rgba(255, 255, 255, 0.1); border-radius: 15px; color: white; text-align: center; margin-bottom: 12px; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; width: 100%; flex-direction: column; align-items: center; }
        .page.active { display: flex; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* چت باکس */
        .chat-card { width: 100%; max-width: 450px; height: 60vh; background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(30px); border-radius: 35px; border: 1px solid rgba(255, 255, 255, 0.3); display: flex; flex-direction: column; padding: 15px; margin-top: 20px; }
        #chat-window { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 5px; }
        .msg { padding: 12px 18px; border-radius: 20px; font-size: 14px; max-width: 80%; animation: popUp 0.4s ease; }
        .a { align-self: flex-start; background: rgba(0, 0, 0, 0.3); color: white; border-bottom-right-radius: 5px; }
        .u { align-self: flex-end; background: #ff9100; color: white; border-bottom-left-radius: 5px; }
        .tick { font-size: 10px; margin-right: 5px; opacity: 0.8; }
        .typing { align-self: flex-start; color: rgba(255,255,255,0.7); font-size: 12px; padding: 5px 15px; font-style: italic; }
        @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .input-area { margin-top: 15px; display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.15); padding: 10px; border-radius: 25px; }
        input { flex: 1; background: transparent; border: none; color: white; outline: none; text-align: right; }

        /* پلیر پادکست */
        .player-card { width: 100%; max-width: 400px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(30px); border-radius: 40px; padding: 25px; border: 1px solid rgba(255, 255, 255, 0.3); text-align: center; }
        .play-circle { width: 70px; height: 70px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; margin: 15px auto; }
        .podcast-item { background: rgba(255,255,255,0.1); margin-bottom: 10px; padding: 12px; border-radius: 18px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
    </style>
</head>
<body>

<div class="menu-btn btn-right" onclick="document.getElementById('rightMenu').classList.add('active')"><div></div><div></div><div></div></div>
<div class="menu-btn btn-left" onclick="document.getElementById('leftMenu').classList.add('active')"><div></div><div></div><div></div></div>

<div id="rightMenu" class="side-menu" onclick="this.classList.remove('active')">
    <div class="nav-item">پروفایل</div>
    <div class="nav-item">تنظیمات</div>
</div>

<div id="leftMenu" class="side-menu" onclick="this.classList.remove('active')">
    <div class="nav-item" onclick="showPage('homePage')">صفحه اصلی</div>
    <div class="nav-item" onclick="showPage('podcastPage')">پادکست‌ها</div>
</div>

<div id="homePage" class="page active">
    <div class="chat-card">
        <div id="chat-window">
            <div class="msg a">سلام! چطور می‌توانم کمک کنم؟</div>
        </div>
        <div class="input-area">
            <input type="text" id="chatInput" placeholder="بپرسید...">
            <div onclick="sendMessage()" style="cursor:pointer; padding: 5px;">➤</div>
        </div>
    </div>
</div>

<div id="podcastPage" class="page">
    <div class="player-card">
        <h3 id="p-title" style="color:white;">انتخاب پادکست</h3>
        <div class="play-circle" onclick="alert('پخش شد')">▶</div>
    </div>
    <div id="p-list" style="width:100%; max-width:400px;"></div>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const chatInput = document.getElementById('chatInput');

    async function sendMessage() {
        const text = chatInput.value.trim();
        if(!text) return;

        appendMessage(text + ' <span class="tick">✔✔</span>', 'u');
        chatInput.value = '';

        const typing = document.createElement('div');
        typing.className = 'typing';
        typing.innerText = "... در حال نوشتن";
        chatWindow.appendChild(typing);
        chatWindow.scrollTop = chatWindow.scrollHeight;

        try {
            const res = await fetch('database.txt');
            const data = await res.text();
            await new Promise(r => setTimeout(r, 1000));
            
            const lines = data.split('\n');
            let ans = "پاسخی یافت نشد.";
            for(let l of lines) if(l.includes(text)) ans = l.includes('=') ? l.split('=')[1] : l;
            
            chatWindow.removeChild(typing);
            appendMessage(ans, 'a');
        } catch(e) {
            chatWindow.removeChild(typing);
            appendMessage("خطای دیتابیس.", 'a');
        }
    }

    function appendMessage(txt, type) {
        const m = document.createElement('div');
        m.className = `msg ${type}`;
        m.innerHTML = txt;
        chatWindow.appendChild(m);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>

</body>
</html>
