<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0033">
<title>PlanLife</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: 'Vazirmatn', sans-serif;
        overflow-x: hidden;
        color: white;
        background: #030303;
    }

    .stars { position: fixed; inset: 0; background: transparent; z-index: 1; pointer-events: none; }
    .stars::before, .stars::after {
        content: ''; position: absolute; inset: 0;
        background-image: radial-gradient(white 1px, transparent 1px);
        background-size: 80px 80px; opacity: 0.45; animation: twinkle 10s infinite alternate;
    }
    .stars::after { background-size: 140px 140px; opacity: 0.3; animation-duration: 16s; }
    @keyframes twinkle { 0% { opacity: 0.35; } 100% { opacity: 0.65; } }

    header { 
        position: fixed; top: 0; left: 0; right: 0; height: 65px; 
        display: flex; align-items: center; padding: 0 20px; z-index: 100; 
        background: rgba(0,0,0,0.25); backdrop-filter: blur(10px); 
    }
    .hamburger { 
        font-size: 28px; cursor: pointer; width: 50px; height: 50px; 
        border-radius: 50%; background: rgba(255,255,255,0.1); 
        display: flex; align-items: center; justify-content: center;
        transition: all 0.2s ease;
    }
    .hamburger:hover { background: rgba(212,175,55,0.2); }

    .main-center { 
        position: relative; z-index: 5; min-height: 100vh; 
        padding: 75px 20px 120px; display: flex; flex-direction: column; align-items: center; 
        transition: filter 0.5s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .main-center.blurred {
        filter: blur(7px);
        pointer-events: none;
    }

    .title { 
        font-size: 42px; 
        font-weight: 900; 
        text-shadow: 0 0 30px rgba(160, 240, 255, 0.9); 
        margin-bottom: 25px; 
        color: white;
    }

    .chat-container, .service-box {
        border: 1px solid rgba(212, 175, 55, 0.55) !important;
        box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 25px rgba(212, 175, 55, 0.25);
    }

    .chat-container { 
        width: 100%; max-width: 360px; height: 390px; 
        background: rgba(255,255,255,0.11); backdrop-filter: blur(16px); 
        border-radius: 28px; display: flex; flex-direction: column; padding: 12px; margin-bottom: 35px; 
    }

    #chat-output { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
    .msg-bot { align-self: flex-start; background: rgba(255,255,255,0.22); padding: 11px 15px; border-radius: 18px 18px 18px 5px; max-width: 88%; line-height: 1.55; }
    .msg-user { align-self: flex-end; background: rgba(100, 60, 255, 0.78); padding: 11px 15px; border-radius: 18px 18px 5px 18px; max-width: 88%; line-height: 1.55; }

    .input-box { 
        display: flex; background: rgba(255,255,255,0.13); border-radius: 25px; padding: 6px; margin-top: 8px; 
    }
    input { flex: 1; background: transparent; border: none; color: white; font-size: 16.5px; padding: 12px 15px; outline: none; }

    /* ===== دکمه ارسال - گوی عصبی نبض‌زن ===== */
    .send-btn {
        width: 48px;
        height: 48px;
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s ease;
    }
    .send-btn:hover {
        transform: scale(1.1);
    }
    .send-btn:active {
        transform: scale(0.92);
    }

    .orb {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(12px);
        border: 1.5px solid #d4af37;
        position: relative;
        overflow: hidden;
        box-shadow: 
            0 0 15px rgba(212, 175, 55, 0.5),
            inset 0 0 12px rgba(255,255,255,0.3);
        animation: orb-pulse 2.2s ease-in-out infinite;
    }

    .core {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 14px;
        height: 14px;
        background: radial-gradient(circle, #fff 20%, #d4af37 70%);
        border-radius: 50%;
        box-shadow: 0 0 18px #d4af37;
        animation: core-glow 1.6s ease-in-out infinite alternate;
        z-index: 3;
    }

    .neural-lines {
        position: absolute;
        inset: 0;
        z-index: 2;
    }

    .neural-lines .line {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 120%;
        height: 1.2px;
        background: linear-gradient(90deg, transparent, #d4af37, transparent);
        box-shadow: 0 0 6px #d4af37;
        transform-origin: center;
        animation: neural-rotate 3.5s linear infinite;
    }

    .neural-lines .line:nth-child(1) { transform: rotate(0deg); animation-duration: 3.2s; }
    .neural-lines .line:nth-child(2) { transform: rotate(36deg); animation-duration: 4.1s; }
    .neural-lines .line:nth-child(3) { transform: rotate(72deg); animation-duration: 2.8s; }
    .neural-lines .line:nth-child(4) { transform: rotate(108deg); animation-duration: 3.8s; }
    .neural-lines .line:nth-child(5) { transform: rotate(144deg); animation-duration: 4.5s; }

    @keyframes orb-pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(212, 175, 55, 0.5); }
        50% { transform: scale(1.08); box-shadow: 0 0 28px rgba(212, 175, 55, 0.85); }
    }

    @keyframes core-glow {
        from { box-shadow: 0 0 12px #d4af37; }
        to { box-shadow: 0 0 26px #fff, 0 0 38px #d4af37; }
    }

    @keyframes neural-rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    .services-grid { 
        display: grid; 
        grid-template-columns: 1fr 1fr; 
        gap: 16px; 
        width: 100%; 
        max-width: 360px; 
    }

    .service-box {
        background: rgba(255,255,255,0.11); 
        backdrop-filter: blur(16px); 
        border-radius: 24px; 
        padding: 15px 10px 12px; 
        text-align: center; 
        cursor: pointer;
        height: 230px; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        gap: 10px;
        transition: all 0.3s;
    }
    .service-box:hover { transform: translateY(-8px); }

    .service-box img { 
        width: 145px; 
        height: 145px; 
        object-fit: cover; 
        border-radius: 18px; 
        border: 2px solid rgba(255,255,255,0.3); 
    }
    .service-box span { 
        font-size: 17.5px; 
        font-weight: 800;
        color: white;
        text-decoration: none;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.35);
        letter-spacing: 0.3px;
    }

    .services-grid a {
        text-decoration: none !important;
        color: white !important;
    }

    /* ===== منوی شیشه‌ای (از راست - کوچکتر) ===== */
    #menu-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        z-index: 150;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
    }
    #menu-overlay.active {
        opacity: 1;
        pointer-events: auto;
    }

    .side-menu {
        position: fixed;
        top: 0;
        right: 0;
        width: 255px;
        height: 100vh;
        background: rgba(255, 255, 255, 0.085);
        backdrop-filter: blur(26px);
        -webkit-backdrop-filter: blur(26px);
        border-left: 1px solid rgba(212, 175, 55, 0.3);
        box-shadow: -12px 0 40px rgba(0, 0, 0, 0.7);
        z-index: 200;
        transform: translateX(100%);
        transition: transform 0.55s cubic-bezier(0.25, 0.1, 0.25, 1);
        padding: 22px 16px 28px;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
    }
    .side-menu.open {
        transform: translateX(0);
    }

    .menu-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        padding-bottom: 15px;
        border-bottom: 1px solid rgba(212, 175, 55, 0.22);
    }
    .menu-header h2 {
        font-size: 22px;
        font-weight: 900;
        color: #d4af37;
        text-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
    }
    .close-btn {
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        color: #d4af37;
        cursor: pointer;
        border-radius: 50%;
        transition: all 0.2s ease;
    }
    .close-btn:hover {
        background: rgba(212, 175, 55, 0.15);
        transform: rotate(90deg);
    }

    .menu-items {
        display: flex;
        flex-direction: column;
        gap: 9px;
    }

    .menu-item {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(212, 175, 55, 0.18);
        border-radius: 15px;
        padding: 14px 18px;
        display: flex;
        align-items: center;
        text-decoration: none;
        color: white;
        font-size: 15.8px;
        font-weight: 700;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
    }
    .menu-item:hover {
        background: rgba(212, 175, 55, 0.11);
        border-color: #d4af37;
        transform: translateX(-8px);
        box-shadow: 0 6px 20px rgba(212, 175, 55, 0.22);
    }
    .menu-item:active {
        transform: scale(0.97);
    }
    .menu-item .text {
        flex: 1;
        line-height: 1.35;
    }
</style>
</head>
<body>

<div class="stars"></div>

<header>
    <div class="hamburger" onclick="toggleMenu()">☰</div>
</header>

<div class="main-center">
    <div class="title">PlanLife</div>

    <!-- چت -->
    <div class="chat-container">
        <div id="chat-output"></div>
        <div class="input-box">
            <input id="user-input" placeholder="پیام بده...">
            <button class="send-btn" onclick="sendMessage()">
                <div class="orb">
                    <div class="neural-lines">
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                    </div>
                    <div class="core"></div>
                </div>
            </button>
        </div>
    </div>

    <!-- خدمات -->
    <div class="services-grid">

        <!-- پادکست -->
        <a href="https://planlife.ir/Pages/podcasts_free/index.html">
            <div class="service-box">
                <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779450993/phonto_jmcfqk.png" alt="">
                <span>پادکست رایگان</span>
            </div>
        </a>

        <!-- دوره‌ها -->
        <a href="https://planlife.ir/Pages/Doreha/index.html">
            <div class="service-box">
                <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg" alt="">
                <span>دوره ها</span>
            </div>
        </a>

        <!-- موزیک -->
        <a href="https://planlife.ir/Pages/Music/index.html">
            <div class="service-box">
                <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779454037/IMG_0213_mrxvu1.png" alt="">
                <span>موزیک ها</span>
            </div>
        </a>

        <!-- تمرینات مجازی -->
        <a href="exercise.html">
            <div class="service-box">
                <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779454914/IMG_0217_fnjv9i.jpg" alt="">
                <span>تمرینات مجازی</span>
            </div>
        </a>

        <!-- مجله ماورایی -->
        <a href="magazine.html">
            <div class="service-box">
                <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779568027/IMG_1109_xpxghq.png" alt="">
                <span>مجله ماورایی 📰</span>
            </div>
        </a>

        <!-- کتابخانه -->
        <a href="library.html">
            <div class="service-box">
                <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779449504/IMG_1045_lgkcd4.jpg" alt="">
                <span>کتابخانه 📚</span>
            </div>
        </a>

        <!-- ویدیوها (جدید) -->
        <a href="https://planlife.ir/Pages/Videos/index.html">
            <div class="service-box">
                <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg" alt="">
                <span>ویدیوها 🎥</span>
            </div>
        </a>

    </div>
</div>

<!-- ===== منوی شیشه‌ای (از راست) ===== -->
<div id="menu-overlay" onclick="closeMenu()"></div>

<div id="side-menu" class="side-menu">
    <div class="menu-header">
        <h2>PlanLife</h2>
        <div class="close-btn" onclick="closeMenu()">✕</div>
    </div>
    
    <div class="menu-items">
        
        <a href="https://planlife.ir" class="menu-item" onclick="closeMenu()">
            <span class="text">خانه</span>
        </a>
        
        <a href="https://planlife.ir/Pages/podcasts_free/index.html" class="menu-item" onclick="closeMenu()">
            <span class="text">پادکست‌های رایگان</span>
        </a>
        
        <a href="https://planlife.ir/Pages/Music/index.html" class="menu-item" onclick="closeMenu()">
            <span class="text">موزیک‌ها</span>
        </a>
        
        <a href="https://planlife.ir/Pages/Doreha/index.html" class="menu-item" onclick="closeMenu()">
            <span class="text">دوره‌ها</span>
        </a>
        
        <a href="https://planlife.ir/Pages/magazine/index.html" class="menu-item" onclick="closeMenu()">
            <span class="text">مجله ماورایی</span>
        </a>
        
        <a href="library.html" class="menu-item" onclick="closeMenu()">
            <span class="text">کتابخانه</span>
        </a>
        
        <a href="https://planlife.ir/Pages/Video/index.html" class="menu-item" onclick="closeMenu()">
            <span class="text">ویدیوها</span>
        </a>
        
    </div>
</div>

<script>
// چت ساده
window.onload = () => {
    document.getElementById("chat-output").innerHTML += `<div class="msg-bot">به بخش ماورای ذهن خوش اومدی 🧠<br>چطور می‌تونم کمکت کنم؟</div>`;
};

function sendMessage() {
    const input = document.getElementById("user-input");
    const text = input.value.trim();
    if (!text) return;
    
    const output = document.getElementById("chat-output");
    output.innerHTML += `<div class="msg-user">${text}</div>`;
    input.value = "";
    output.scrollTop = output.scrollHeight;

    // پیام لودینگ
    const loadingId = 'loading-' + Date.now();
    output.innerHTML += `<div class="msg-bot" id="${loadingId}">در حال فکر کردن... 🧠</div>`;
    output.scrollTop = output.scrollHeight;

    const API_KEY = "xai-a1g61vdyBDwJvzVksGj5F8X0cvmOzNZ10o4yAJ7Xezn17UBgOq3V3pztT3U2GY7bFG3RdBLHsLzf8Rxm";

    fetch("https://api.x.ai/v1/chat/completions", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
            model: "grok-2-1212",
            messages: [
                {
                    role: "system",
                    content: "تو یک دستیار مفید، مهربان و هوشمند به نام PlanLife هستی. به زبان فارسی پاسخ بده و پاسخ‌هات کوتاه، مفید و دوستانه باشه."
                },
                {
                    role: "user",
                    content: text
                }
            ],
            temperature: 0.7,
            max_tokens: 800
        })
    })
    .then(response => response.json())
    .then(data => {
        const loadingEl = document.getElementById(loadingId);
        if (loadingEl) loadingEl.remove();

        let reply = "متأسفانه الان نمی‌تونم جواب بدم. دوباره امتحان کن.";
        if (data.choices && data.choices[0] && data.choices[0].message) {
            reply = data.choices[0].message.content;
        }

        output.innerHTML += `<div class="msg-bot">${reply}</div>`;
        output.scrollTop = output.scrollHeight;
    })
    .catch(error => {
        const loadingEl = document.getElementById(loadingId);
        if (loadingEl) loadingEl.remove();
        
        output.innerHTML += `<div class="msg-bot">خطا در ارتباط با هوش مصنوعی. لطفاً دوباره تلاش کن.</div>`;
        output.scrollTop = output.scrollHeight;
        console.error(error);
    });
}

function toggleMenu() {
    const menu = document.getElementById('side-menu');
    const overlay = document.getElementById('menu-overlay');
    const main = document.querySelector('.main-center');
    
    if (menu.classList.contains('open')) {
        closeMenu();
    } else {
        menu.classList.add('open');
        overlay.classList.add('active');
        main.classList.add('blurred');
    }
}

function closeMenu() {
    const menu = document.getElementById('side-menu');
    const overlay = document.getElementById('menu-overlay');
    const main = document.querySelector('.main-center');
    
    menu.classList.remove('open');
    overlay.classList.remove('active');
    main.classList.remove('blurred');
}

// بستن منو با کلید ESC
document.addEventListener('keydown', function(e) {
    if (e.key === "Escape") {
        closeMenu();
    }
});
</script>
</body>
</html>
