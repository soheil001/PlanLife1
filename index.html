<script>
    const API_KEY = "xai-HBP2sZIOEXMAlSz8Pl9Do36KufJw07EvhmG5mo9Se0lbrsNl0oTavbHTL4a0VtWMytSw4uN54B0tM9Ro";

    async function handleChat() {
        const inputField = document.getElementById('userInput');
        const chatFlow = document.getElementById('chat-flow');
        const sendBtn = document.getElementById('sendBtn');
        const text = inputField.value.trim();

        if (text === "") return;

        addBubble(text, 'user-bubble');
        inputField.value = "";
        sendBtn.disabled = true;

        const loadingBubble = addBubble("در حال پردازش...", 'ai-bubble');

        try {
            const response = await fetch("https://api.x.ai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: "grok-beta",
                    messages: [
                        { "role": "system", "content": "تو دستیار هوشمند سهیل در سایت PlanLife هستی." },
                        { "role": "user", "content": text }
                    ]
                })
            });

            const data = await response.json();
            
            // بررسی دقیق پاسخ
            if (data && data.choices && data.choices[0]) {
                loadingBubble.innerText = data.choices[0].message.content;
            } else {
                // اگر API جواب نداد، این پاسخ معنوی و انگیزشی را بده
                loadingBubble.innerText = "سهیل جان، فرکانس ارسالی دریافت شد. در حال حاضر ارتباط مستقیم با سرور Grok به دلیل محدودیت اعتبار برقرار نیست، اما به یاد داشته باش که قدرت ذهن تو فراتر از هر کدی است. (لطفاً اعتبار حساب xAI را چک کن)";
            }

        } catch (error) {
            loadingBubble.innerText = "ارتباط با ماورای ذهن موقتاً قطع شده. لطفاً VPN رو چک کن یا بعداً تلاش کن.";
            console.error("Error details:", error);
        } finally {
            sendBtn.disabled = false;
            chatFlow.scrollTop = chatFlow.scrollHeight;
        }
    }

    function addBubble(text, className) {
        const chatFlow = document.getElementById('chat-flow');
        const div = document.createElement('div');
        div.className = `bubble ${className}`;
        div.innerText = text;
        chatFlow.appendChild(div);
        chatFlow.scrollTop = chatFlow.scrollHeight;
        return div;
    }
</script>
