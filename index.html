<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PlanLife | پلتفرم تحول</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&family=League+Spartan:wght@800&display=swap');

* { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; transition: 0.5s; }

body { 
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    background: linear-gradient(135deg, #00c4cc, #7d2ae8, #00c4cc);
    background-size: 400% 400%; animation: gradientBG 15s ease infinite;
    padding: 10px;
}

@keyframes gradientBG { 
0% { background-position: 0% 50%; } 
50% { background-position: 100% 50%; } 
100% { background-position: 0% 50%; } 
}

.chat-card { 
    width: 100%; max-width: 450px; 
    height: calc(50vh + 80px); 
    background: rgba(255,255,255,0.12); 
    border-radius: 35px; 
    display: flex; flex-direction: column; padding: 15px; 
    margin-top: -60px; 
}

#chat-window { 
    flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; 
}

.msg { 
    padding: 12px 18px; border-radius: 20px; max-width: 85%; 
}

.a { background: rgba(0,0,0,0.3); color: white; }
.u { background: #ff9100; color: white; align-self: flex-end; }

.input-area { 
    margin-top: 15px; display: flex; gap: 10px; 
    background: rgba(255,255,255,0.15); padding: 12px; border-radius: 25px; 
}

input { flex:1; background:transparent; border:none; color:white; outline:none; }

</style>
</head>

<body>

<div class="chat-card">
    <div id="chat-window">
        <div class="msg a">چطور می‌توانم کمکتان کنم؟ ✨</div>
    </div>

    <div class="input-area">
        <input id="chatInput" placeholder="سوال بپرس..." onkeypress="if(event.key==='Enter') sendMessage()">
        <div onclick="sendMessage()" style="width:30px;height:30px;background:#ff9100;border-radius:50%;cursor:pointer;"></div>
    </div>
</div>

<script>
const chatWindow = document.getElementById('chat-window');
const chatInput = document.getElementById('chatInput');

function appendMessage(text, type) {
    const msg = document.createElement('div');
    msg.className = 'msg ' + type;
    msg.innerText = text;
    chatWindow.appendChild(msg);
    chatWindow.scrollTop = chatWindow.scrollHeight;
}

async function sendMessage() {
    const userText = chatInput.value.trim();
    if (!userText) return;

    appendMessage(userText, 'u');
    chatInput.value = '';

    try {
        // جلوگیری از کش شدن فایل
        const res = await fetch('database.txt?' + Date.now());
        if (!res.ok) throw new Error();

        const data = await res.text();
        const lines = data.split('\n');

        let answer = null;

        for (let line of lines) {
            line = line.trim();
            if (!line) continue;

            let parts;

            if (line.includes('=')) {
                parts = line.split('=');
            } else if (line.includes(':')) {
                parts = line.split(':');
            } else {
                continue;
            }

            const question = parts[0].trim().toLowerCase();
            const response = parts.slice(1).join('=').trim();

            // جستجوی هوشمندتر
            if (
                question.includes(userText.toLowerCase()) ||
                userText.toLowerCase().includes(question)
            ) {
                answer = response;
                break;
            }
        }

        if (!answer) {
            answer = "🤖 هنوز جوابی براش ندارم";
        }

        setTimeout(() => appendMessage(answer, 'a'), 500);

    } catch (err) {
        appendMessage("❌ database.txt پیدا نشد (حتماً کنار HTML باشه)", 'a');
    }
}
</script>

</body>
</html>
