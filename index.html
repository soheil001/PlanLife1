<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<title>PlanLife</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: 'Vazirmatn', sans-serif;
        overflow-x: hidden;
        color: white;
        background: radial-gradient(circle at center, #1a0033 0%, #000011 70%);
    }

    .stars { position: fixed; inset: 0; background: transparent; z-index: 1; pointer-events: none; }
    .stars::before, .stars::after {
        content: ''; position: absolute; inset: 0;
        background-image: radial-gradient(white 1px, transparent 1px);
        background-size: 80px 80px; opacity: 0.5; animation: twinkle 10s infinite alternate;
    }
    .stars::after { background-size: 140px 140px; opacity: 0.35; animation-duration: 16s; }
    @keyframes twinkle { 0% { opacity: 0.4; } 100% { opacity: 0.75; } }

    .shooting-star {
        position: absolute; width: 3px; height: 2px; background: white;
        box-shadow: 0 0 10px white; animation: shoot 5s linear infinite; z-index: 1;
    }
    @keyframes shoot { 0% { transform: translateX(-200px) translateY(-200px); opacity: 1; } 100% { transform: translateX(1000px) translateY(800px); opacity: 0; } }

    header {
        position: fixed; top: 0; left: 0; right: 0; height: 65px;
        display: flex; align-items: center; padding: 0 20px; z-index: 100;
        background: rgba(0,0,0,0.15); backdrop-filter: blur(10px);
    }
    .hamburger { font-size: 30px; cursor: pointer; padding: 8px; border-radius: 50%; background: rgba(255,255,255,0.1); }

    .menu-panel {
        position: fixed; top: 65px; left: -280px; width: 260px; height: calc(100% - 65px);
        background: rgba(255,255,255,0.12); backdrop-filter: blur(20px);
        border-radius: 0 20px 20px 0; padding: 25px 20px; transition: 0.4s ease; z-index: 200;
    }
    .menu-panel.active { left: 0; }

    .menu-item {
        padding: 16px 20px; margin: 12px 0; border-radius: 15px;
        background: rgba(255,255,255,0.1); font-size: 17px;
    }
    .menu-item:hover { background: rgba(255,255,255,0.25); }

    .main-center {
        position: relative; z-index: 5; min-height: 100vh;
        padding: 75px 20px 100px; display: flex; flex-direction: column; align-items: center;
    }

    .title {
        font-size: 38px; font-weight: 700; text-shadow: 0 0 25px rgba(160, 240, 255, 0.9);
        margin-bottom: 18px;
    }

    /* === پلیر پادکست شیک === */
    .podcast-player {
        width: 100%; max-width: 360px;
        background: rgba(255,255,255,0.12);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 28px;
        padding: 25px 20px;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        margin-bottom: 30px;
    }
    .podcast-player h2 {
        font-size: 20px; margin-bottom: 15px; opacity: 0.95;
    }
    .cover {
        width: 160px; height: 160px;
        background: linear-gradient(135deg, #6b4eff, #c026d3);
        border-radius: 20px;
        margin: 0 auto 20px;
        box-shadow: 0 0 30px rgba(192, 38, 211, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 50px;
    }
    audio {
        width: 100%;
        margin: 15px 0;
    }
    audio::-webkit-media-controls-panel {
        background: rgba(0,0,0,0.4);
        border-radius: 15px;
    }

    /* لیست پادکست‌ها */
    .podcast-list {
        width: 100%; max-width: 360px;
    }
    .podcast-item {
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 18px;
        padding: 16px 18px;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 15px;
        cursor: pointer;
        transition: 0.3s;
    }
    .podcast-item:hover {
        background: rgba(255,255,255,0.22);
        transform: translateX(-5px);
    }
    .podcast-item .number {
        width: 28px; height: 28px;
        background: rgba(255,255,255,0.2);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 14px; font-weight: 500;
    }

    .services-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
        width: 100%; max-width: 360px;
    }
    .service-box {
        background: rgba(255,255,255,0.13); backdrop-filter: blur(12px);
        border: 1.5px solid #ff8c00; border-radius: 20px;
        padding: 22px 10px; text-align: center; font-size: 17px;
        cursor: pointer; transition: all 0.3s;
        box-shadow: 0 0 15px rgba(255, 140, 0, 0.5);
    }
    .service-box:hover {
        transform: translateY(-6px);
        box-shadow: 0 0 22px rgba(255, 140, 0, 0.8);
    }

    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); display: none; z-index: 150; }
    #overlay.active { display: block; }
</style>
</head>
<body>

<div class="stars"></div>

<header>
    <div class="hamburger" onclick="toggleMenu()">☰</div>
</header>

<div id="sideMenu" class="menu-panel">
    <div class="menu-item" onclick="goToHome()">خانه</div>
    <div class="menu-item">پروفایل</div>
    <div class="menu-item">آمار پیشرفت</div>
    <div class="menu-item">مورد علاقه‌ها</div>
    <div class="menu-item">تنظیمات</div>
</div>

<div id="overlay" onclick="toggleMenu()"></div>

<div class="main-center" id="mainContent">
    <div class="title">PlanLife</div>

    <div class="chat-container" id="chatBox">
        <div id="chat-output"></div>
        <div class="input-box">
            <input id="user-input" placeholder="پیام بده...">
            <button onclick="sendMessage()">
                <div class="orb-send"></div>
            </button>
        </div>
    </div>

    <div class="services-grid">
        <div class="service-box" onclick="showSection('podcast')">پادکست</div>
