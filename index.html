<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; height: 100vh; background: linear-gradient(135deg, #00f2fe, #4facfe, #764ba2, #ff758c); display: flex; flex-direction: column; align-items: center; font-family: sans-serif; overflow: hidden; }

        /* آیکون منو */
        .menu-btn { position: fixed; top: 20px; width: 50px; height: 50px; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; font-size: 25px; z-index: 3000; }
        .left-icon { left: 20px; }
        .right-icon { right: 20px; }

        /* اصلاح پنل‌ها */
        .menu-panel { position: fixed; top: 0; width: 220px; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(20px); transition: 0.5s; padding-top: 80px; z-index: 2500; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        #leftPanel { left: -250px; }
        #rightPanel { right: -250px; }
        
        /* کلاس‌های فعال */
        .show-left { left: 0 !important; }
        .show-right { right: 0 !important; }

        .menu-item { width: 80%; padding: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 15px; color: white; text-align: center; cursor: pointer; }

        /* موقعیت جدید گوی و متن (۱ سانت پایین‌تر) */
        .pulse { width: 40px; height: 40px; background: #fff; border-radius: 50%; margin-top: 90px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(0.9); } 50% { transform: scale(1.1); box-shadow: 0 0 25px #ff758c; } 100% { transform: scale(0.9); } }
        .title { color: white; font-family: 'Lobster', cursive; font-size: 40px; margin-top: 20px; }

        /* چت باکس - ابعاد اصلاح شده */
        .chat-box { width: calc(100% - 30px); max-width: 380px; height: 400px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.3); border-radius: 30px; margin-top: 30px; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        
        .input-wrapper { position: relative; width: 100%; margin-top: auto; display: flex; align-items: center; }
        input { width: 100%; padding: 15px 20px; border-radius: 20px; border: none; background: rgba(255,255,255,0.2); color: white; box-sizing: border-box; }
        
        /* دکمه ارسال چسبیده به دیواره راست */
        .send-btn { position: absolute; right: 5px; width: 40px; height: 40px; border-radius: 50%; border: none; background: white; color: #764ba2; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="menu-btn left-icon" onclick="toggleMenu('left')">☰</div>
    <div class="menu-btn right-icon" onclick="toggleMenu('right')">☰</div>

    <div id="leftPanel" class="menu-panel">
        <div class="menu-item">خانه</div><div class="menu-item">پروفایل</div><div class="menu-item">تنظیمات</div><div class="menu-item">خروج</div>
    </div>
    <div id="rightPanel" class="menu-panel">
        <div class="menu-item">پروژه‌ها</div><div class="menu-item">اشتراک</div><div class="menu-item">تیم‌ها</div><div class="menu-item">پشتیبانی</div>
    </div>

    <div class="pulse"></div>
    <h1 class="title">PlanLife</h1>

    <div class="chat-box">
        <div style="flex: 1; color: white; opacity: 0.8;">در حال گوش دادن...</div>
        <div class="input-wrapper">
            <input type="text" placeholder="پیام...">
            <button class="send-btn">➤</button>
        </div>
    </div>

    <script>
        function toggleMenu(side) {
            const left = document.getElementById('leftPanel');
            const right = document.getElementById('rightPanel');
            
            if(side === 'left') {
                right.classList.remove('show-right');
                left.classList.toggle('show-left');
            } else {
                left.classList.remove('show-left');
                right.classList.toggle('show-right');
            }
        }
    </script>
</body>
</html>
