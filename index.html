<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlanLife | پلتفرم هوشمند</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&family=Montserrat:wght@800&display=swap');

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        
        body { 
            margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            /* بگراند کهکشانی با تم رنگی درخواستی */
            background: radial-gradient(circle at center, #1a0b3a 0%, #050a1f 100%),
                        url('https://www.transparenttextures.com/patterns/stardust.png');
            background-attachment: fixed; overflow-x: hidden; padding: 20px 10px;
        }

        /* منوی همبرگری ۳ خطی */
        .menu-btn {
            position: fixed; top: 25px; right: 25px; z-index: 1001;
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px; border-radius: 12px; cursor: pointer; backdrop-filter: blur(10px);
        }
        .menu-btn div { width: 22px; height: 2px; background: white; margin: 5px 0; border-radius: 2px; }

        .side-menu {
            position: fixed; top: 0; right: -300px; width: 280px; height: 100%;
            background: rgba(26, 11, 58, 0.95); backdrop-filter: blur(40px);
            z-index: 1000; padding: 80px 20px; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column; gap: 12px;
        }
        .side-menu.active { right: 0; }

        .nav-item {
            padding: 14px; background: rgba(255, 255, 255, 0.05); border-radius: 12px;
            color: white; text-align: center; text-decoration: none; border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* گوی ماورایی با رد نور */
        .orb-wrapper { position: relative; width: 100px; height: 100px; margin-bottom: 20px; }
        .magic-orb {
            width: 100%; height: 100%; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff, #9d50bb, #6e48aa, #000);
            box-shadow: 0 0 40px rgba(157, 80, 187, 0.8), inset -5px -5px 15px rgba(0,0,0,0.5);
            animation: rotateOrb 4s infinite linear;
            position: relative; z-index: 2;
        }
        /* رد نور دور گوی */
        .orb-trail {
            position: absolute; top: -10%; left: -10%; width: 120%; height: 120%;
            border-radius: 45%; border: 2px solid rgba(0, 196, 204, 0.3);
            animation: trailRotate 3s infinite linear; filter: blur(5px);
        }
        @keyframes rotateOrb { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes trailRotate { from { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.1); } to { transform: rotate(360deg) scale(1); } }

        /* چت باکس عریض و مربعی */
        .chat-card {
            width: 98%; max-width: 480px; height: 55vh;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(30px);
            border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex; flex-direction: column; padding: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4); margin-bottom: 40px;
        }

        .brand-name { color: white; font-family: 'Montserrat', sans-serif; font-size: 2rem; font-weight: 800; text-align: center; margin-bottom: 15px; }

        #chat-window { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 16px; border-radius: 18px; font-size: 14px; max-width: 85%; font-weight: 500; }
        .u { align-self: flex-start; background: rgba(255, 255, 255, 0.12); color: white; border: 1px solid rgba(255, 255, 255, 0.1); }
        .a { align-self: flex-end; background: rgba(0, 0, 0, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.1); }

        .input-area {
            display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, 0.07);
            padding: 8px 18px; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.2);
        }
        input { flex: 1; background: transparent; border: none; color: white; padding: 10px 0; outline: none; }

        .gemini-send { background: none; border: none; cursor: pointer; display: flex; align-items: center; transition: 0.3s; }
        .gemini-send svg { width: 26px; height: 26px; fill: white; filter: drop-shadow(0 0 8px #00c4cc); }

        /* باکس‌های ۲ در ۲ پایین */
        .course-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 480px; padding-bottom: 40px;
        }
        .course-box {
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px);
            border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px; text-align: center; color: white; transition: 0.3s;
        }
        .course-box:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.12); }
        .box-img { width: 100%; aspect-ratio: 1; background: rgba(255,255,255,0.05); border-radius: 18px; margin-bottom: 10px; overflow: hidden; }

        #chat-window::-webkit-scrollbar { width: 0; }
        
        /* لایه بستن منو با کلیک بیرون */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: transparent; z-index: 999; display: none;
        }
    </style>
</head>
<body>

<div id="overlay" onclick="toggleMenu()"></div>

<div class="menu-btn" onclick="toggleMenu()">
    <div></div><div></div><div></div>
</div>

<div class="side-menu" id="sideMenu">
    <div style="color:#00c4cc; font-weight:800; text-align:center; margin-bottom:20px;">MENU</div>
    <a href="#" class="nav-item">قانون جذب</a>
    <a href="#" class="nav-item">پاکسازی ذهن</a>
    <a href="#" class="nav-item">سابلیمینال‌ها</a>
    <a href="#" class="nav-item">درباره ما</a>
    <a href="#" class="nav-item">پشتیبانی</a>
</div>

<div class="orb-wrapper">
    <div class="orb-trail"></div>
    <div class="magic-orb"></div>
</div>

<div class="chat-card">
    <h1 class="brand-name">PlanLife</h1>
    <div id="chat-window">
        <div class="msg a">سوالات ذهنی خودتان را بپرسید تا راهنمایی کنم ✨</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="بپرس..." onkeypress="if(event.keyCode===13)send()">
        <button class="gemini-send" onclick="send()">
            <svg viewBox="0 0 24 24"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"></path></svg>
        </button>
    </div>
</div>

<div class="course-grid">
    <div class="course-box"><div class="box-img"></div><strong>دوره اول</strong></div>
    <div class="course-box"><div class="box-img"></div><strong>دوره دوم</strong></div>
    <div class="course-box"><div class="box-img"></div><strong>دوره سوم</strong></div>
    <div class="course-box"><div class="box-img"></div><strong>دوره چهارم</strong></div>
</div>

<script>
    let brain = {};
    function toggleMenu() {
        const menu = document.getElementById('sideMenu');
        const overlay = document.getElementById('overlay');
        menu.classList.toggle('active');
        overlay.style.display = menu.classList.contains('active') ? 'block' : 'none';
    }

    async function loadBrain() {
        try {
            const r = await fetch('database.txt?v=' + Math.random());
            const d = await r.text();
            d.split('\n').forEach(l => {
                const p = l.split('|');
                if (p.length === 2) brain[p[0].trim()] = p[1].trim();
            });
        } catch (e) {}
    }
    loadBrain();

    function send() {
        const i = document.getElementById('userInput');
        const w = document.getElementById('chat-window');
        const v = i.value.trim();
        if (!v) return;
        
        w.innerHTML += `<div class="msg u">${v}</div>`;
        i.value = "";
        
        let r = "";
        for (let k in brain) { if (v.includes(k)) { r = brain[k]; break; } }
        
        // منطق جدید پاسخگویی
        if (!r) r = "یا این سوال شما فعلاً پاسخی براش نیست یا نامربوط به حوزه ی سایت است";

        setTimeout(() => {
            w.innerHTML += `<div class="msg a">${r}</div>`;
            w.scrollTop = window.innerHeight; // اسکرول به پایین
        }, 600);
    }
</script>

</body>
</html>
