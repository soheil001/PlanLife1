<script>
    function sendMessage() {
        const input = document.getElementById('userInput');
        const box = document.getElementById('chat-box');
        const text = input.value.trim();

        if(!text) return;

        // نمایش پیام کاربر
        box.innerHTML += `<div class="msg user">${text}</div>`;
        input.value = "";
        
        // ایجاد حباب پاسخ هوش مصنوعی
        const aiMsg = document.createElement('div');
        aiMsg.className = "msg ai";
        box.appendChild(aiMsg);

        // منطق پاسخ‌های طراحی شده توسط سهیل
        let response = "";

        if (text.includes("سلام") || text.includes("درود")) {
            response = "سلام سهیل عزیز! آماده‌ای امروز فرکانس ذهنی‌ت رو روی موفقیت تنظیم کنیم؟";
        } 
        else if (text.includes("پول") || text.includes("ثروت")) {
            response = "ثروت یک جریان انرژی هست. تو با باورهای درست در ماورای ذهن، می‌تونی این جریان رو به سمت خودت هدایت کنی. ✨";
        }
        else if (text.includes("خسته") || text.includes("ناامید")) {
            response = "هر تضادی در زندگی، نشان‌دهنده اینه که خواسته بزرگتری در راهه. نفس عمیق بکش، تو قدرت خلق زندگیت رو داری.";
        }
        else if (text.includes("کی هستی") || text.includes("چیکار میکنی")) {
            response = "من دستیار اختصاصی تو در برند ماورای ذهن هستم تا یادت بندازم چقدر قدرتمندی.";
        }
        else {
            // پاسخ پیش‌فرض برای بقیه موارد
            response = "این پیام تو فرکانس جالبی داشت! به زودی در جلسات عمیق‌تر ماورای ذهن درباره‌اش صحبت می‌کنیم. فعلاً روی اهدافت تمرکز کن.";
        }

        // نمایش پاسخ با یک تاخیر کوچک برای حس واقعی بودن
        setTimeout(() => {
            aiMsg.innerText = response;
            box.scrollTop = box.scrollHeight;
        }, 600);

        box.scrollTop = box.scrollHeight;
    }
</script>
