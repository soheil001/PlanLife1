<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlanLife | هوش ماورایی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&family=League+Spartan:wght@800&display=swap');

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        
        body { 
            margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(135deg, #00c4cc, #7d2ae8, #00c4cc);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            background-attachment: fixed; overflow-x: hidden; padding: 10px;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* گوی درخشان بالای صفحه */
        .orb { 
            width: 60px; height: 60px; border-radius: 50%; 
            background: radial-gradient(circle, #fff 0%, #a2d2ff 100%); 
            animation: pulse 3s infinite ease-in-out; 
            box-shadow: 0 0 30px rgba(255,255,255,0.4); margin-top: 40px;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }

        /* فونت برند به سبک Canva */
        .brand-text {
            font-family: 'League Spartan', sans-serif; font-size: 3rem; color: white;
            font-weight: 800; margin: 10px 0 30px 0; letter-spacing: -1px;
        }

        /* چت باکس پایین‌تر */
        .chat-card { 
            width: 100%; max-width: 450px; height: 50vh;
            background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(35px); 
            border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.3); 
            display: flex; flex-direction: column; padding: 20px;
        }
        #chat-window { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 18px; border-radius: 22px; font-size: 14px; max-width: 85%; text-align: right; background: rgba(0,0,0,0.15); color: white; }

        /* اینپوت شیشه‌ای سفیدتر */
        .input-container {
            margin-top: 15px; display: flex; align-items: center; gap: 10px;
            background: rgba(255, 255, 255, 0.25); border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 15px; border-radius: 30px; backdrop-filter: blur(10px);
        }
        input { flex: 1; background: transparent; border: none; color: white; outline: none; padding: 10px; font-size: 14px; }
        input::placeholder { color: rgba(255, 255, 255, 0.9); } /* سفیدتر کردن placeholder */
        .send-btn { font-size: 24px; cursor: pointer; text-shadow: 0 0 10px gold; border:none; background:none; }

        /* دکمه‌های نارنجی شیشه‌ای پایین */
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 450px; margin-top: 25px; }
        .nav-btn {
            padding: 18px; text-align: center; color: white; font-weight: 800; border-radius: 22px;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.3);
            background: linear-gradient(135deg, rgba(255, 154, 0, 0.6), rgba(255, 81, 0, 0.6));
            backdrop-filter: blur(15px);
        }

        /* پادکست‌ها */
        .page { display: none; width: 100%; flex-direction: column; align-items: center; }
        .page.active { display: flex; }
        .podcast-item { 
            width: 100%; max-width: 400px; background: rgba(255,255,255,0.15); 
            padding: 15px; border-radius: 20px; margin-bottom: 10px; 
            display: flex; align-items: center; gap: 15px; color: white; cursor: pointer;
        }

        .menu-btn { position: fixed; top: 25px; z-index: 1001; background: rgba(255,255,255,0.2); padding: 10px; border-radius: 12px; cursor: pointer; }
        .btn-right { right: 20px; } .btn-left { left: 20px; }
        .menu-btn div { width: 22px; height: 2px; background: white; margin: 5px 0; }
    </style>
</head>
<body>

<div class="orb"></div>
<h1 class="brand-text">PlanLife</h1>

<div class="menu-btn btn-right"><div></div><div></div><div></div></div>
<div class="menu-btn btn-left"><div></div><div></div><div></div></div>

<div class="main-container" style="width:100%; display:flex; flex-direction:column; align-items:center;">
    
    <div id="homePage" class="page active">
        <div class="chat-card">
            <div id="chat-window">
                <div class="msg">سوال ذهنی خودتان را بپرسید... ✨</div>
            </div>
            <div class="input-container">
                <input type="text" placeholder="بنویسید...">
                <button class="send-btn">✨</button>
            </div>
        </div>
        
        <div class="grid-buttons">
            <div class="nav-btn" onclick="showPage('podcastPage')">پادکست‌ها</div>
            <div class="nav-btn">تمرینات</div>
            <div class="nav-btn">کتاب‌ها</div>
            <div class="nav-btn">باورها</div>
        </div>
    </div>

    <div id="podcastPage" class="page">
        <h2 style="color:white; margin: 20px 0;">لیست پادکست‌ها</h2>
        
        <div class="podcast-item" onclick="playTrack('https://res.cloudinary.com/dshielkdt/video/upload/v1779205048/YTDown_YouTube_Media_jrK9TiZ251M_008_128k_jxdssu.mp3', 'قدرت ذهن')">
            <div style="width:40px; height:40px; background:white; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#7d2ae8;">۱</div>
            <div style="flex:1; text-align:right;">قسمت اول: قدرت ذهن</div>
            <span>▶</span>
        </div>

        <div class="podcast-item">
            <div style="width:40px; height:40px; background:rgba(255,255,255,0.2); border-radius:50%; display:flex; align-items:center; justify-content:center;">۲</div>
            <div style="flex:1; text-align:right;">قسمت دوم: باورهای ثروت</div>
            <span>▶</span>
        </div>

        <div class="nav-btn" style="width:120px; background: rgba(255,255,255,0.2); margin-top:20px;" onclick="showPage('homePage')">برگشت</div>
    </div>
</div>

<audio id="mainAudio"></audio>

<script>
    const audio = document.getElementById('mainAudio');

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);
    }

    function playTrack(url, title) {
        audio.src = url;
        audio.play();
        alert("در حال پخش: " + title);
    }
</script>

</body>
</html>
