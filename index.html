<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlanLife | ماورای آگاهی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&family=Montserrat:wght@800&display=swap');

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        
        body { 
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #00c4cc 0%, #7d2ae8 100%);
            overflow: hidden;
            padding: 10px;
        }

        body.menu-open .main-content { filter: blur(15px); }

        /* منوی همبرگری با بگراند غلیظ‌تر */
        .menu-btn {
            position: fixed; top: 20px; right: 20px; z-index: 1001;
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px; border-radius: 15px; cursor: pointer; backdrop-filter: blur(10px);
        }

        .side-menu {
            position: fixed; top: 0; right: -100%; width: 280px; height: 100%;
            background: rgba(15, 5, 40, 0.85); backdrop-filter: blur(30px); /* رنگ پررنگ‌تر و متمایز */
            z-index: 1000; padding: 80px 25px; transition: 0.5s ease;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column; gap: 20px;
        }

        .side-menu.active { right: 0; }

        /* گوی ماورایی شناور (جدا از باکس) */
        .magic-orb {
            width: 80px; height: 80px;
            background: radial-gradient(circle at 30% 30%, #fff, #00f2ad, #7d2ae8);
            border-radius: 50%;
            margin-bottom: 25px; /* فاصله از باکس چت */
            box-shadow: 0 0 40px rgba(0, 242, 173, 0.6), inset -10px -10px 20px rgba(0,0,0,0.3);
            animation: floatOrb 4s infinite ease-in-out;
            position: relative;
        }
        .magic-orb::after {
            content: ''; position: absolute; top: -10%; left: -10%; right: -10%; bottom: -10%;
            border-radius: 50%; background: rgba(125, 42, 232, 0.2); filter: blur(15px);
        }
        @keyframes floatOrb { 
            0%, 100% { transform: translateY(0) scale(1); } 
            50% { transform: translateY(-15px) scale(1.05); } 
        }

        /* کادر چت با ابعاد جدید */
        .chat-card {
            width: 100%; max-width: 380px; 
            height: 60vh; /* کوتاه‌تر شدن از پایین */
            margin-top: 10px; /* پایین آمدن از بالا */
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(25px);
            border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.25);
            display: flex; flex-direction: column; padding: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2); position: relative;
        }

        .brand-name { 
            color: white; font-family: 'Montserrat', sans-serif; font-size: 1.8rem; 
            font-weight: 800; text-align: center; margin-bottom: 10px;
        }

        #chat-window {
            flex: 1; overflow-y: auto; padding: 10px 5px;
            display: flex; flex-direction: column; gap: 10px;
        }

        .msg { padding: 10px 16px; border-radius: 18px; font-size: 14px; line-height: 1.6; max-width: 80%; font-weight: 500; }
        .u { align-self: flex-start; background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.1); }
        .a { align-self: flex-end; background: rgba(0, 0, 0, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.1); }

        .input-area {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255, 255, 255, 0.08); padding: 5px 15px;
            border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.2);
        }

        input { flex: 1; background: transparent; border: none; color: white; padding: 12px 0; outline: none; font-weight: bold; }

        /* دکمه ارسال طرح جمنای */
        .gemini-send {
            background: none; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .gemini-icon {
            width: 24px; height: 24px; fill: white;
            filter: drop-shadow(0 0 5px #00c4cc);
        }
        .gemini-send:hover { transform: scale(1.2) rotate(-10deg); }

        /* فضای خالی پایین برای دوره‌ها */
        .course-space { height: 60px; width: 100%; }

        #chat-window::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body>

<div class="menu-btn" onclick="toggleMenu()">
    <div style="width:20px; height:2px; background:white; margin: 4px 0;"></div>
    <div style="width:20px; height:2px; background:white; margin: 4px 0;"></div>
</div>

<div class="side-menu" id="sideMenu">
    <div style="color:#00c4cc; font-weight:800; text-align:center; margin-bottom:30px;">PlanLife MENU</div>
    <a href="#" style="color:white; text-decoration:none; padding:15px; background:rgba(255,255,255,0.05); border-radius:15px; text-align:center;">آموزش‌ها</a>
    <a href="#" style="color:white; text-decoration:none; padding:15px; background:rgba(255,255,255,0.05); border-radius:15px; text-align:center;">ارتباط با ما</a>
</div>

<div class="main-content" style="display:flex; flex-direction:column; align-items:center;">
    <div class="magic-orb"></div>

    <div class="chat-card">
        <h1 class="brand-name">PlanLife</h1>
        <div id="chat-window">
            <div class="msg a">سیستم در وضعیت ماورایی آماده است. ✨</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="بپرس..." onkeypress="if(event.keyCode===13)send()">
            <button class="gemini-send" onclick="send()">
                <svg class="gemini-icon" viewBox="0 0 24 24">
                    <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"></path>
                </svg>
            </button>
        </div>
    </div>
    
    <div class="course-space"></div>
</div>

<script>
    let brain = {};

    function toggleMenu() {
        document.getElementById('sideMenu').classList.toggle('active');
        document.body.classList.toggle('menu-open');
    }

    async function loadBrain() {
        try {
            const response = await fetch('database.txt?v=' + Math.random());
            const data = await response.text();
            data.split('\n').forEach(line => {
                const parts = line.split('|');
                if (parts.length === 2) brain[parts[0].trim()] = parts[1].trim();
            });
        } catch (e) {}
    }
    loadBrain();

    function send() {
        const input = document.getElementById('userInput');
        const window = document.getElementById('chat-window');
        const val = input.value.trim();
        if (!val) return;

        window.innerHTML += `<div class="msg u">${val}</div>`;
        input.value = "";
        window.scrollTop = window.scrollHeight;

        let reply = "";
        for (let key in brain) { if (val.includes(key)) { reply = brain[key]; break; } }
        if (!reply) reply = "فرکانس فعلاً در دسترس نیست. ✨";

        setTimeout(() => {
            window.innerHTML += `<div class="msg a">${reply}</div>`;
            window.scrollTop = window.scrollHeight;
        }, 500);
    }
</script>

</body>
</html>
