<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlanLife | پلتفرم تحول</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&family=League+Spartan:wght@800&display=swap');

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; background: linear-gradient(135deg, #00c4cc, #7d2ae8, #00c4cc); background-size: 400% 400%; animation: gradientBG 15s ease infinite; background-attachment: fixed; overflow-x: hidden; padding: 10px; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* منوها و دکمه‌ها */
        .menu-btn { position: fixed; top: 25px; z-index: 1001; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); padding: 10px; border-radius: 12px; cursor: pointer; backdrop-filter: blur(10px); }
        .btn-right { right: 20px; } .btn-left { left: 20px; }
        .menu-btn div { width: 22px; height: 2px; background: white; margin: 5px 0; border-radius: 2px; }
        .side-menu { position: fixed; top: 0; width: 260px; height: 100%; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(40px); z-index: 1000; padding: 80px 20px; border: 1px solid rgba(255, 255, 255, 0.2); transition: 0.6s ease; }
        #rightMenu { right: -300px; } #leftMenu { left: -300px; }
        #rightMenu.active { right: 0; } #leftMenu.active { left: 0; }
        .nav-item { display: block; padding: 15px; background: rgba(255, 255, 255, 0.1); border-radius: 15px; color: white; text-align: center; margin-bottom: 12px; border: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer; }
        
        .page { display: none; width: 100%; flex-direction: column; align-items: center; }
        .page.active { display: flex; animation: fadeIn 0.7s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* چت‌باکس */
        .chat-card { width: 100%; max-width: 450px; height: calc(50vh + 80px); background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(30px); border-radius: 35px; border: 1px solid rgba(255, 255, 255, 0.3); display: flex; flex-direction: column; padding: 15px; margin-top: -60px; }
        #chat-window { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 5px; }
        .msg { padding: 12px 18px; border-radius: 20px; font-size: 14px; max-width: 85%; animation: msgSlide 0.3s ease; }
        @keyframes msgSlide { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .a { align-self: flex-start; background: rgba(0, 0, 0, 0.3); color: white; border-bottom-right-radius: 5px; }
        .u { align-self: flex-end; background: #ff9100; color: white; border-bottom-left-radius: 5px; }
        
        .tick { font-size: 10px; margin-right: 5px; opacity: 0.8; }
        .typing { align-self: flex-start; color: rgba(255,255,255,0.7); font-size: 12px; padding: 5px 15px; font-style: italic; }

        .input-area { margin-top: 15px; display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.15); padding: 12px; border-radius: 25px; }
        input { flex: 1; background: transparent; border: none; color: white; outline: none; text-align: right; }

        /* پلیر */
        .player-card { width: 100%; max-width: 400px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(30px); border-radius: 40px; padding: 25px; border: 1px solid rgba(255, 255, 255, 0.3); text-align: center; }
        .podcast-item { background: rgba(255,255,255,0.1); margin-bottom: 10px; padding: 12px; border-radius: 18px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
    </style>
</head>
<body>

<div class="menu-btn btn-right" onclick="document.getElementById('rightMenu').classList.add('active')"><div></div><div></div><div></div></div>
<div class="menu-btn btn-left" onclick="document.getElementById('leftMenu').classList.add('active')"><div></div><div></div><div></div></div>

<div id="rightMenu" class="side-menu" onclick="this.classList.remove('active')"><div class="nav-item">پروفایل</div></div>
<div id="leftMenu" class="side-menu" onclick="this.classList.remove('active')">
    <div class="nav-item" onclick="showPage('homePage')">صفحه اصلی</div>
    <div class="nav-item" onclick="showPage('podcastPage')">پادکست‌ها</div>
</div>

<div class="main-container" style="width:100%; display:flex; flex-direction:column; align-items:center; margin-top: 40px;">
    <h1 style="color:white; font-family:'League Spartan'; font-weight:800;">PlanLife</h1>

    <!-- صفحه اصلی -->
    <div id="homePage" class="page active">
        <div class="chat-card">
            <div id="chat-window"><div class="msg a">سلام! چطور می‌توانم کمک کنم؟</div></div>
            <div class="input-area">
                <input type="text" id="chatInput" placeholder="بپرسید..." onkeypress="if(event.key==='Enter') sendMessage()">
                <div onclick="sendMessage()" style="cursor:pointer; color:white;">➤</div>
            </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 450px; margin-top: 25px;">
            <div class="nav-item" onclick="showPage('podcastPage')">پادکست‌ها</div>
            <div class="nav-item">تمرینات</div>
        </div>
    </div>

    <!-- صفحه پادکست -->
    <div id="podcastPage" class="page">
        <div class="player-card">
            <h3 style="color:white;">پادکست: قدرت ذهن</h3>
            <audio id="mainAudio" src="https://res.cloudinary.com/dshielkdt/video/upload/v1779205048/YTDown_YouTube_Media_jrK9TiZ251M_008_128k_jxdssu.mp3" controls></audio>
        </div>
        <div class="nav-item" style="margin-top:20px; width:120px;" onclick="showPage('homePage')">بازگشت</div>
    </div>
</div>

<script>
    function sendMessage() {
        const input = document.getElementById('chatInput');
        if(!input.value.trim()) return;
        
        // ارسال کاربر
        const win = document.getElementById('chat-window');
        const userMsg = document.createElement('div');
        userMsg.className = 'msg u';
        userMsg.innerHTML = input.value + ' <span class="tick">✔✔</span>';
        win.appendChild(userMsg);
        input.value = '';
        win.scrollTop = win.scrollHeight;

        // تایپینگ
        const typing = document.createElement('div');
        typing.className = 'typing';
        typing.innerText = "... در حال نوشتن";
        win.appendChild(typing);
        win.scrollTop = win.scrollHeight;

        setTimeout(() => {
            win.removeChild(typing);
            const sysMsg = document.createElement('div');
            sysMsg.className = 'msg a';
            sysMsg.innerText = "دیتابیس در حال بررسی است...";
            win.appendChild(sysMsg);
            win.scrollTop = win.scrollHeight;
        }, 1500);
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
</html>
