<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lingua — planlife.ir</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1535; --muted:#8b84a8;
    --glass:rgba(255,255,255,0.15);
    --glass-brd:rgba(255,255,255,0.28);
    --pink:#e040a0;
    --purple:#5b3fe8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}

  body{
    font-family:'Vazirmatn',sans-serif;
    min-height:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    background: linear-gradient(150deg,#3a2472 0%,#6b3a9e 40%,#a94a8a 70%,#5a3a9e 100%);
    background-attachment: fixed;
  }

  body::before{
    content:'';
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(220,100,180,0.15), transparent 60%),
      radial-gradient(ellipse 70% 50% at 90% 80%, rgba(60,20,160,0.2), transparent 60%),
      radial-gradient(ellipse 60% 70% at 60% 40%, rgba(150,30,200,0.1), transparent 60%);
  }

  .wrap{max-width:520px;margin:0 auto;min-height:100%;position:relative;z-index:1;}

  /* ══════════════════════════════
     HEADER
  ══════════════════════════════ */
  header{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:100;
    margin:14px 16px 6px;
    padding:10px 16px;
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.3);
    border-radius:18px;
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,0.7) 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Poppins',sans-serif;font-weight:800;font-size:15px;
    color:#7b2fa0;flex-shrink:0;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
  }
  .brand-name{
    font-family:'Poppins',sans-serif;font-weight:700;font-size:14.5px;
    color:#fff;direction:ltr;letter-spacing:0.2px;
  }
  .bell{
    width:34px;height:34px;border-radius:12px;
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.3);
    display:flex;align-items:center;justify-content:center;
  }

  /* ══════════════════════════════
     HERO SLIDER
  ══════════════════════════════ */
  .hero{
    margin:16px 16px 0;
    border-radius:28px;
    overflow:hidden;
    position:relative;
    height:240px;
    border:1px solid rgba(255,255,255,0.22);
    box-shadow:0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
  }

  .slides{
    display:flex;
    width:100%;
    height:100%;
    transition:transform 0.55s cubic-bezier(0.77,0,0.18,1);
  }

  .slide{
    min-width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
    flex-shrink:0;
  }

  .slide-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
    z-index:0;
  }

  .slide::after{
    content:'';
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
  }
  .slide-1::after{ background:linear-gradient(135deg, rgba(45,27,142,0.18) 0%, rgba(139,47,160,0.12) 45%, rgba(224,64,160,0.08) 100%); }
  .slide-2::after{ background:linear-gradient(135deg, rgba(26,10,94,0.20) 0%, rgba(91,31,168,0.14) 45%, rgba(192,32,110,0.08) 100%); }
  .slide-3::after{ background:linear-gradient(135deg, rgba(61,20,136,0.18) 0%, rgba(155,63,217,0.12) 45%, rgba(255,80,176,0.07) 100%); }

  .hero-dots{
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:6px;
    z-index:10;
  }
  .dot{
    width:6px;height:6px;
    border-radius:50%;
    background:rgba(255,255,255,0.4);
    cursor:pointer;
    transition:background 0.25s, transform 0.25s;
  }
  .dot.active{
    background:#fff;
    transform:scale(1.4);
  }

  .hero-prev,.hero-next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:10;
    width:32px;height:32px;
    border-radius:50%;
    background:rgba(255,255,255,0.18);
    border:1px solid rgba(255,255,255,0.3);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    transition:background 0.2s;
  }
  .hero-prev:active,.hero-next:active{background:rgba(255,255,255,0.35);}
  .hero-prev{ right:12px; }
  .hero-next{ left:12px; }

  /* ══════════════════════════════
     STORIES — جایگزین greet
  ══════════════════════════════ */
  .stories-outer{
    margin:18px 0 0;
    padding:0;
    overflow:hidden;
    position:relative;
    z-index:10;
  }
  .stories-wrapper{width:100%;position:relative;}
  .stories-scroll{
    display:flex;flex-direction:row;direction:ltr;
    gap:14px;overflow-x:auto;overflow-y:hidden;
    padding:4px 16px 14px;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    cursor:grab;
  }
  .stories-scroll:active{cursor:grabbing;}
  .stories-scroll::-webkit-scrollbar{display:none;}
  .stories-wrapper::before,.stories-wrapper::after{
    content:'';position:absolute;top:0;bottom:0;
    width:20px;z-index:10;pointer-events:none;
  }
  .stories-wrapper::before{right:0;background:linear-gradient(to left,rgba(80,30,140,0.7),transparent);}
  .stories-wrapper::after{left:0;background:linear-gradient(to right,rgba(80,30,140,0.7),transparent);}

  .story-item{
    display:flex;flex-direction:column;align-items:center;gap:7px;
    flex-shrink:0;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .story-ring{
    width:68px;height:68px;border-radius:50%;padding:2.5px;
    background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888,#833ab4,#405de6,#5851db);
    transition:background .4s ease;flex-shrink:0;
  }
  .story-item.seen .story-ring{background:rgba(255,255,255,0.25);}
  .story-avatar{
    width:100%;height:100%;border-radius:50%;
    background:rgba(255,255,255,0.15);
    border:2.5px solid rgba(255,255,255,0.9);
    overflow:hidden;display:flex;align-items:center;justify-content:center;
  }
  .story-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .story-label{
    font-size:10.5px;font-weight:700;color:rgba(255,255,255,0.9);
    text-align:center;max-width:68px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    line-height:1.3;text-shadow:0 1px 6px rgba(0,0,0,0.4);
  }

  /* ══════════════════════════════
     STORY MODAL
  ══════════════════════════════ */
  #story-modal{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:9000;
    background:rgba(0,0,0,0.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .3s ease;
  }
  #story-modal.open{opacity:1;pointer-events:auto;}
  .story-container{
    width:100%;max-width:375px;aspect-ratio:9/16;background:#000;
    border-radius:12px;overflow:hidden;position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.9);
  }
  .story-modal-content{
    position:absolute;inset:0;z-index:1;background:#000;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .story-modal-content img,.story-modal-content video{width:100%;height:100%;object-fit:cover;display:block;}
  .story-progress-bar{
    position:absolute;top:0;left:0;right:0;z-index:10;
    display:flex;gap:3px;direction:ltr;
    padding:10px 12px 6px;
    background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent);
  }
  .progress-seg{flex:1;height:2.5px;background:rgba(255,255,255,.28);border-radius:3px;overflow:hidden;}
  .progress-seg-fill{height:100%;background:white;width:0%;border-radius:3px;}
  .progress-seg.done .progress-seg-fill{width:100%;}
  .progress-seg.active .progress-seg-fill{animation:progress-run 5s linear forwards;}
  @keyframes progress-run{from{width:0%;}to{width:100%;}}

  .story-modal-header{
    position:absolute;top:26px;left:0;right:0;z-index:10;
    display:flex;align-items:center;gap:8px;padding:8px 12px;
    direction:rtl;justify-content:space-between;flex-direction:row-reverse;
    background:linear-gradient(to bottom,rgba(0,0,0,.35),transparent);
  }
  .story-logo-section{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
  .story-logo-img{width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);overflow:hidden;}
  .story-logo-img img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .story-branding-text{font-size:14px;font-weight:700;color:white;text-shadow:0 1px 6px rgba(0,0,0,.7);}
  .story-modal-close{font-size:22px;color:white;cursor:pointer;padding:4px 6px;}
  .story-nav-left,.story-nav-right{position:absolute;top:0;bottom:0;width:40%;cursor:pointer;z-index:9;-webkit-tap-highlight-color:transparent;}
  .story-nav-right{right:0;}
  .story-nav-left{left:0;}
  .story-footer{
    position:absolute;bottom:0;left:0;right:0;z-index:10;
    display:flex;flex-direction:column;gap:10px;padding:40px 14px 18px;
    background:linear-gradient(to top,rgba(0,0,0,.72) 60%,transparent);
  }
  .story-caption{
    font-size:13px;font-weight:500;color:rgba(255,255,255,.95);
    text-align:center;line-height:1.6;min-height:20px;
    display:flex;align-items:center;justify-content:center;
    text-shadow:0 1px 8px rgba(0,0,0,.9);
  }
  .story-action-btn{
    display:none;align-items:center;justify-content:center;width:100%;
    padding:12px 16px;background:rgba(255,255,255,.13);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1.2px solid rgba(212,175,55,.6);border-radius:20px;
    color:#ffd060;font-family:'Vazirmatn',sans-serif;font-size:15px;font-weight:800;
    text-decoration:none;text-align:center;cursor:pointer;transition:all .2s ease;
    position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25);
  }
  .story-action-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);animation:glass-shine 2.5s ease-in-out infinite;}
  @keyframes glass-shine{0%{left:-100%;}50%{left:100%;}100%{left:100%;}}
  .story-action-btn:active{transform:scale(.97);}
  .story-action-btn.show{display:flex;}

  /* ══════════════════════════════
     CARDS
  ══════════════════════════════ */
  .container{padding:4px 16px 60px;}

  .row-label{
    font-size:14px;font-weight:700;
    color:rgba(255,255,255,0.9);
    margin:24px 0 12px 0;
    padding:0 4px;
    letter-spacing:-0.2px;
  }

  .carousel{
    display:flex;gap:16px;
    overflow-x:auto;scroll-behavior:smooth;
    padding-bottom:10px;
    margin:0 -16px;
    padding-left:16px;padding-right:16px;
  }
  .carousel::-webkit-scrollbar{display:none;}

  .card-wrap{
    flex:0 0 200px;height:356px;
    border-radius:26px;padding:3px;
    background:linear-gradient(145deg,rgba(255,255,255,0.5) 0%,rgba(200,150,255,0.3) 50%,rgba(255,255,255,0.2) 100%);
    box-shadow:
      0 2px 0 rgba(255,255,255,0.5),
      0 16px 36px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.7);
    cursor:pointer;
    transition:transform 0.18s, box-shadow 0.18s;
    flex-shrink:0;
  }
  .card-wrap:active{
    transform:scale(0.97);
    box-shadow:0 6px 18px rgba(0,0,0,0.3);
  }

  .card{
    border-radius:24px;overflow:hidden;
    background:#fff;
    display:flex;flex-direction:column;
    position:relative;height:100%;
  }

  .card-photo{
    position:absolute;inset:0;
    width:100%;height:100%;overflow:hidden;
  }
  .card-photo img{
    width:100%;height:100%;
    object-fit:cover;object-position:center;display:block;
  }
  .card-photo::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(
      to bottom,
      rgba(0,0,0,0.04) 0%,
      transparent 20%,
      rgba(5,10,30,0.4) 50%,
      rgba(5,10,30,0.92) 100%
    );
    pointer-events:none;
  }

  .badge{
    position:absolute;top:14px;left:14px;
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.4);
    border-radius:50px;padding:5px 13px;
    font-size:11px;font-family:'Vazirmatn',sans-serif;
    font-weight:700;color:#fff;z-index:2;letter-spacing:0.2px;
  }

  .card-body{
    position:absolute;bottom:0;right:0;left:0;
    margin:10px;padding:14px;z-index:2;
    display:flex;flex-direction:column;align-items:flex-start;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    border:1px solid rgba(255,255,255,0.22);
    border-radius:18px;
    box-shadow:0 4px 24px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .card-title{font-size:16px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:6px;direction:rtl;letter-spacing:-0.4px;}
  .card-desc{font-size:11px;font-weight:500;color:rgba(255,255,255,0.8);line-height:1.65;direction:rtl;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .card-footer{width:100%;display:flex;align-items:center;justify-content:space-between;direction:ltr;}
  .read-time{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:rgba(255,255,255,0.72);font-family:'Vazirmatn',sans-serif;direction:rtl;}
  .btn-read{
    background:#fff;color:#7b2fa0;border:none;border-radius:50px;
    padding:8px 16px;font-size:12px;
    font-family:'Vazirmatn',sans-serif;font-weight:800;
    cursor:pointer;transition:opacity 0.15s,transform 0.15s;
    white-space:nowrap;letter-spacing:-0.2px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
  }
  .btn-read:active{opacity:0.85;transform:scale(0.97);}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="brand-mark">L</div>
      <div class="brand-name">planlife.ir</div>
    </div>
    <div class="bell">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M12 3a5 5 0 0 0-5 5v3.2c0 .5-.2 1-.5 1.4L5 15h14l-1.5-2.4a2.2 2.2 0 0 1-.5-1.4V8a5 5 0 0 0-5-5Z" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M9.5 18a2.5 2.5 0 0 0 5 0" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
  </header>

  <!-- HERO SLIDER -->
  <div class="hero" id="hero">
    <div class="slides" id="slides">
      <div class="slide slide-1">
        <img class="slide-bg"
             src="http://fs3.centraldnserver.com/~planlife/pics/english/slide1.jpg"
             alt=""
             onerror="this.style.display='none'">
      </div>
      <div class="slide slide-2">
        <img class="slide-bg"
             src="http://fs3.centraldnserver.com/~planlife/pics/english/slide2.jpg"
             alt=""
             onerror="this.style.display='none'">
      </div>
      <div class="slide slide-3">
        <img class="slide-bg"
             src="http://fs3.centraldnserver.com/~planlife/pics/english/slide3.jpg"
             alt=""
             onerror="this.style.display='none'">
      </div>
    </div>
    <button class="hero-prev" id="heroPrev" aria-label="قبلی">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M9 18l6-6-6-6" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="hero-next" id="heroNext" aria-label="بعدی">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M15 18l-6-6 6-6" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="hero-dots">
      <div class="dot active" data-i="0"></div>
      <div class="dot" data-i="1"></div>
      <div class="dot" data-i="2"></div>
    </div>
  </div>

  <!-- STORIES — جایگزین greet -->
  <div class="stories-outer">
    <div class="stories-wrapper">
      <div class="stories-scroll" id="stories-scroll">

        <div class="story-item" data-index="0"
             data-img="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779450993/phonto_jmcfqk.png"
             data-caption="پادکست‌های رایگان PlanLife درباره قانون جذب و تغییر افکار 🎙️"
             data-btn-show="true" data-btn-text="شنیدن پادکست‌ها"
             data-btn-link="https://planlife.ir/Pages/podcasts_free/index.html">
          <div class="story-ring"><div class="story-avatar"><img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779450993/phonto_jmcfqk.png" alt="پادکست"></div></div>
          <div class="story-label">پادکست</div>
        </div>

        <div class="story-item" data-index="1"
             data-img="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg"
             data-caption="دوره‌های تخصصی آموزش قانون جذب، باور و تغییر رفتار 🚀"
             data-btn-show="true" data-btn-text="مشاهده دوره‌ها"
             data-btn-link="https://planlife.ir/dores.html">
          <div class="story-ring"><div class="story-avatar"><img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg" alt="دوره‌ها"></div></div>
          <div class="story-label">دوره‌ها</div>
        </div>

        <div class="story-item" data-index="2"
             data-img="https://res.cloudinary.com/dwxaids40/image/upload/q_auto/f_auto/v1781397270/IMG_1897_kgkgss.jpg"
             data-caption="کتابخانه — بهترین کتاب‌های رشد فردی و تقویت باور 📚"
             data-btn-show="true" data-btn-text="ورود به کتابخانه"
             data-btn-link="https://planlife.ir/Pages/Book/index.html">
          <div class="story-ring"><div class="story-avatar"><img src="https://res.cloudinary.com/dwxaids40/image/upload/q_auto/f_auto/v1781397270/IMG_1897_kgkgss.jpg" alt="کتابخانه"></div></div>
          <div class="story-label">کتابخانه</div>
        </div>

        <div class="story-item" data-index="3"
             data-img="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779568027/IMG_1109_xpxghq.png"
             data-caption="مجله ماورایی — مقالات انگیزشی درباره تغییر افکار 📰"
             data-btn-show="true" data-btn-text="ورود به مجله"
             data-btn-link="https://planlife.ir/Pages/Magazine/index.html">
          <div class="story-ring"><div class="story-avatar"><img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779568027/IMG_1109_xpxghq.png" alt="مجله"></div></div>
          <div class="story-label">مجله</div>
        </div>

        <div class="story-item" data-index="4"
             data-img="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779454914/IMG_0217_fnjv9i.jpg"
             data-caption="تمرینات مجازی روزانه و آرامش ذهن برای موفقیت 🧘"
             data-btn-show="true" data-btn-text="شروع تمرین ذهنی"

        <div class="story-nav-right" onclick="storyNavigate(1)"></div>

<script>
/* ── SLIDER ── */
const slidesEl = document.getElementById('slides');
const dots = document.querySelectorAll('.dot');
let cur = 0;
const total = 3;

function goTo(n){
  cur = (n + total) % total;
  slidesEl.style.transform = `translateX(${cur * 100}%)`;
  dots.forEach((d,i) => d.classList.toggle('active', i === cur));
}

document.getElementById('heroNext').addEventListener('click', () => goTo(cur - 1));
document.getElementById('heroPrev').addEventListener('click', () => goTo(cur + 1));
dots.forEach(d => d.addEventListener('click', () => goTo(+d.dataset.i)));

let timer = setInterval(() => goTo(cur + 1), 3800);
document.getElementById('hero').addEventListener('touchstart', () => clearInterval(timer), {passive:true});

/* ── STORIES ── */
var stories = [], storyIndex = 0, storyTimer = null;
var STORY_SEEN_KEY = 'planlife_lingua_stories_v1';
var DAY_MS = 24 * 60 * 60 * 1000;

function getSeenMap(){
  try{ var raw=localStorage.getItem(STORY_SEEN_KEY); if(!raw) return {};
    var map=JSON.parse(raw), now=Date.now(), cleaned={};
    Object.keys(map).forEach(function(k){ if(now-map[k]<DAY_MS) cleaned[k]=map[k]; });
    return cleaned;
  }catch(e){ return {}; }
}
function markSeen(idx){ try{ var map=getSeenMap(); map[idx]=Date.now(); localStorage.setItem(STORY_SEEN_KEY,JSON.stringify(map)); }catch(e){} }
function isSeen(idx){ return Object.prototype.hasOwnProperty.call(getSeenMap(), idx); }

function initStories(){
  var items = document.querySelectorAll('.story-item');
  items.forEach(function(item){
    var idx = parseInt(item.dataset.index, 10);
    var seen = isSeen(idx);
    stories.push({
      el: item,
      img: item.dataset.img||'',
      caption: item.dataset.caption||'',
      btnShow: (item.dataset.btnShow||'').toLowerCase()==='true',
      btnText: item.dataset.btnText||'',
      btnLink: item.dataset.btnLink||'',
      seen: seen
    });
    if(seen) item.classList.add('seen');
    item.addEventListener('click', function(){ openStoryModal(idx); });
  });

  /* drag scroll */
  var el = document.getElementById('stories-scroll');
  var isDown=false, startX, scrollLeft;
  el.addEventListener('mousedown', function(e){ isDown=true; startX=e.pageX-el.offsetLeft; scrollLeft=el.scrollLeft; el.style.cursor='grabbing'; });
  el.addEventListener('mouseleave', function(){ isDown=false; el.style.cursor='grab'; });
  el.addEventListener('mouseup', function(){ isDown=false; el.style.cursor='grab'; });
  el.addEventListener('mousemove', function(e){ if(!isDown) return; e.preventDefault(); el.scrollLeft=scrollLeft-(e.pageX-el.offsetLeft-startX)*1.4; });
}

var savedScrollY = 0;
function openStoryModal(idx){
  storyIndex = idx;
  savedScrollY = window.scrollY||0;
  document.body.style.position='fixed'; document.body.style.top=(-savedScrollY)+'px';
  document.body.style.left='0'; document.body.style.right='0'; document.body.style.width='100%';
  document.getElementById('story-modal').classList.add('open');
  renderStoryModal(); buildProgressBar(); startStoryTimer();
}
function closeStoryModal(){
  document.getElementById('story-modal').classList.remove('open');
  clearStoryTimer();
  var cd = document.getElementById('story-modal-content');
  var vid = cd.querySelector('video');
  if(vid){ vid.pause(); vid.removeAttribute('src'); vid.load(); vid.remove(); }
  document.body.style.position=''; document.body.style.top='';
  document.body.style.left=''; document.body.style.right=''; document.body.style.width='';
  window.scrollTo(0, savedScrollY);
}
function renderStoryModal(){
  var s = stories[storyIndex]; if(!s){ closeStoryModal(); return; }
  s.seen=true; s.el.classList.add('seen'); markSeen(storyIndex);
  var cd = document.getElementById('story-modal-content');
  var oldV=cd.querySelector('video'); if(oldV){ oldV.pause(); oldV.src=''; oldV.remove(); }
  var oldI=cd.querySelector('img'); if(oldI) oldI.remove();
  var img=document.createElement('img'); img.src=s.img; img.alt='';
  img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;';
  cd.appendChild(img);
  document.getElementById('story-caption').textContent = s.caption;
  var btn = document.getElementById('story-action-btn');
  if(s.btnShow && s.btnLink){ btn.textContent=s.btnText||'مشاهده بیشتر'; btn.href=s.btnLink; btn.classList.add('show'); }
  else{ btn.classList.remove('show'); btn.removeAttribute('href'); }
}
function buildProgressBar(){
  var bar=document.getElementById('story-progress-bar'); bar.innerHTML='';
  stories.forEach(function(s,i){
    var seg=document.createElement('div'); seg.className='progress-seg';
    if(i<storyIndex) seg.classList.add('done');
    if(i===storyIndex) seg.classList.add('active');
    var fill=document.createElement('div'); fill.className='progress-seg-fill';
    seg.appendChild(fill); bar.appendChild(seg);
  });
}
function startStoryTimer(){ clearStoryTimer(); storyTimer=setTimeout(function(){ storyNavigate(1); },5000); }
function clearStoryTimer(){ if(storyTimer){ clearTimeout(storyTimer); storyTimer=null; } }
function storyNavigate(dir){
  clearStoryTimer();
  storyIndex += dir;
  if(storyIndex < 0) storyIndex=0;
  if(storyIndex >= stories.length){ closeStoryModal(); return; }
  renderStoryModal(); buildProgressBar(); startStoryTimer();
}
document.getElementById('story-modal').addEventListener('click', function(e){ if(e.target===this) closeStoryModal(); });

/* ── CARDS ── */
const BASE = 'http://fs3.centraldnserver.com/~planlife/pics/english/';
const imgs = [1,2,3,4,5,6,7];

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

const row1Cards = [
  {title:'سوالات مبتدی',     desc:'یادگیری از صفر با ساده‌ترین سوالات. پایه‌های محکمی برای شروع زبان انگلیسی بسازید.',         badge:'مبتدی',       hours:'۳۲'},
  {title:'سوالات مقدماتی',   desc:'مرحله بعدی برای ارتقای مهارت زبانی. گرامر و واژگان پایه را در قالب تمرین‌های جذاب تقویت کنید.',badge:'مقدماتی',    hours:'۴۸'},
  {title:'سوالات پیشرفته ۱', desc:'بالا بردن مهارت‌ها با تمرین‌های چالش‌برانگیز. ساختارهای پیچیده‌تر زبان را فرا بگیرید.',      badge:'پیشرفته ۱',   hours:'۶۴'},
  {title:'سوالات پیشرفته ۲', desc:'تقویت درک مطلب و مکالمه در سطح بالاتر با تمرکز بر موضوعات روزمره و کاربردی.',                badge:'پیشرفته ۲',   hours:'۷۲'},
  {title:'سوالات پیشرفته ۳', desc:'مهارت نوشتاری و شنیداری را در این سطح به طرز چشمگیری تقویت خواهید کرد.',                   badge:'پیشرفته ۳',   hours:'۸۰'},
  {title:'سوالات پیشرفته ۴', desc:'آخرین سطح از مجموعه پیشرفته با تمرکز بر مهارت‌های ترکیبی و درک متون پیچیده.',              badge:'پیشرفته ۴',   hours:'۹۰'},
];

const row2Cards = [
  {title:'سوالات پیشرفته ۵', desc:'ورود به سطح حرفه‌ای با تمرین‌های فشرده و محتوای تخصصی زبان انگلیسی.',                      badge:'پیشرفته ۵',   hours:'۹۶'},
  {title:'سوالات پیشرفته ۶', desc:'تسلط کامل بر ساختارهای دستوری پیچیده و واژگان سطح بالا برای موفقیت بیشتر.',                 badge:'پیشرفته ۶',   hours:'۱۰۴'},
  {title:'IELTS ۱',          desc:'آشنایی با ساختار آزمون IELTS و تمرین مهارت‌های چهارگانه در سطح پایه.',                      badge:'IELTS ۱',     hours:'۴۸'},
  {title:'IELTS ۲',          desc:'تقویت Writing و Speaking با استفاده از نمونه سوالات واقعی آزمون IELTS.',                     badge:'IELTS ۲',     hours:'۶۴'},
  {title:'IELTS ۳',          desc:'آمادگی کامل برای کسب نمره بالا در IELTS با استراتژی‌های اثبات‌شده و تمرین فشرده.',           badge:'IELTS ۳',     hours:'۸۰'},
  {title:'فوق حرفه‌ای',       desc:'سطح نهایی و جامع برای تسلط کامل بر زبان انگلیسی. پکیج کامل از مبتدی تا پیشرفته.',           badge:'فوق حرفه‌ای', hours:'۱۲۸'},
];

function makeCard(c, imgNum){
  return `
  <div class="card-wrap">
    <div class="card">
      <div class="card-photo">
        <img src="${BASE}${imgNum}.jpg" alt="${c.title}" loading="lazy"
             onerror="this.style.background='linear-gradient(135deg,#7b2fa0,#e040a0)'">
      </div>
      <span class="badge">${c.badge}</span>
      <div class="card-body">
        <div class="card-title">${c.title}</div>
        <div class="card-desc">${c.desc}</div>
        <div class="card-footer">
          <div class="read-time">${c.hours} ساعت</div>
          <button class="btn-read">شروع کن</button>
        </div>
      </div>
    </div>
  </div>`;
}

const sh1 = shuffle(imgs);
const sh2 = shuffle(imgs);
const r1 = document.getElementById('row1');
const r2 = document.getElementById('row2');
row1Cards.forEach((c,i) => r1.insertAdjacentHTML('beforeend', makeCard(c, sh1[i%7])));
row2Cards.forEach((c,i) => r2.insertAdjacentHTML('beforeend', makeCard(c, sh2[i%7])));

/* INIT */
window.addEventListener('load', function(){ initStories(); });
</script>
