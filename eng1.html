<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lingua — planlife.ir</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1535; --muted:#8b84a8;
    --glass:rgba(255,255,255,0.15);
    --glass-brd:rgba(255,255,255,0.28);
    --pink:#e040a0;
    --purple:#5b3fe8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}

  body{
    font-family:'Vazirmatn',sans-serif;
    min-height:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    /* پس‌زمینه اصلی بنفش-صورتی */
    background: linear-gradient(135deg,#2d1b8e 0%,#7b2fa0 38%,#c92c8a 68%,#6a1fc2 100%);
    background-attachment: fixed;
  }

  /* لایه نویز برای عمق بیشتر */
  body::before{
    content:'';
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(255,80,200,0.25), transparent 60%),
      radial-gradient(ellipse 70% 50% at 90% 80%, rgba(60,20,180,0.35), transparent 60%),
      radial-gradient(ellipse 60% 70% at 60% 40%, rgba(180,30,220,0.15), transparent 60%);
  }

  .wrap{max-width:520px;margin:0 auto;min-height:100%;position:relative;z-index:1;}

  /* ══════════════════════════════
     HEADER
  ══════════════════════════════ */
  header{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:100;
    margin:14px 16px 6px;
    padding:10px 16px;
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.3);
    border-radius:18px;
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,0.7) 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Poppins',sans-serif;font-weight:800;font-size:15px;
    color:#7b2fa0;flex-shrink:0;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
  }
  .brand-name{
    font-family:'Poppins',sans-serif;font-weight:700;font-size:14.5px;
    color:#fff;direction:ltr;letter-spacing:0.2px;
  }
  .bell{
    width:34px;height:34px;border-radius:12px;
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.3);
    display:flex;align-items:center;justify-content:center;
  }

  /* ══════════════════════════════
     HERO SLIDER
  ══════════════════════════════ */
  .hero{
    margin:16px 16px 0;
    border-radius:28px;
    overflow:hidden;
    position:relative;
    height:240px;
    border:1px solid rgba(255,255,255,0.22);
    box-shadow:0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
  }

  .slides{
    display:flex;
    width:100%;
    height:100%;
    transition:transform 0.55s cubic-bezier(0.77,0,0.18,1);
  }

  .slide{
    min-width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
    flex-shrink:0;
  }

  /* گرادینت هر اسلاید */
  .slide-1{ background:linear-gradient(135deg,#2d1b8e 0%,#8b2fc9 45%,#e040a0 100%); }
  .slide-2{ background:linear-gradient(135deg,#1a0a5e 0%,#5b1fa8 45%,#c0206e 100%); }
  .slide-3{ background:linear-gradient(135deg,#3d1488 0%,#9b3fd9 45%,#ff50b0 100%); }

  /* نقطه‌های دکوری */
  .slide::before{
    content:'';
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size:28px 28px;
    pointer-events:none;
  }

  .slide-text{
    position:absolute;
    right:22px;
    top:50%;
    transform:translateY(-50%);
    z-index:2;
    text-align:right;
  }
  .slide-tag{
    display:inline-block;
    background:rgba(255,255,255,0.18);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:50px;
    padding:4px 14px;
    font-size:11px;
    font-weight:700;
    color:#fff;
    margin-bottom:10px;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    letter-spacing:0.3px;
  }
  .slide-title{
    font-size:28px;
    font-weight:800;
    color:#fff;
    line-height:1.1;
    letter-spacing:-1px;
    text-shadow:0 2px 20px rgba(0,0,0,0.3);
    margin-bottom:8px;
  }
  .slide-sub{
    font-size:12px;
    font-weight:500;
    color:rgba(255,255,255,0.75);
    line-height:1.6;
    max-width:180px;
  }
  .slide-btn{
    margin-top:16px;
    display:inline-block;
    background:#fff;
    color:#7b2fa0;
    border:none;
    border-radius:50px;
    padding:9px 22px;
    font-size:12px;
    font-family:'Vazirmatn',sans-serif;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 4px 20px rgba(0,0,0,0.2);
    transition:transform 0.15s,opacity 0.15s;
  }
  .slide-btn:active{transform:scale(0.96);opacity:0.9;}

  /* تصویر داخل اسلاید (چپ) */
  .slide-img{
    position:absolute;
    left:-10px;
    bottom:0;
    height:110%;
    width:55%;
    object-fit:contain;
    object-position:bottom center;
    filter:drop-shadow(-8px 8px 24px rgba(0,0,0,0.45));
    pointer-events:none;
    z-index:1;
  }

  /* شماره بزرگ دکوری */
  .slide-num{
    position:absolute;
    left:10px;
    top:50%;
    transform:translateY(-50%);
    font-family:'Poppins',sans-serif;
    font-weight:800;
    font-size:130px;
    color:rgba(255,255,255,0.07);
    line-height:1;
    pointer-events:none;
    z-index:0;
    user-select:none;
    letter-spacing:-8px;
  }

  /* دات‌های ناوبری */
  .hero-dots{
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:6px;
    z-index:10;
  }
  .dot{
    width:6px;height:6px;
    border-radius:50%;
    background:rgba(255,255,255,0.4);
    cursor:pointer;
    transition:background 0.25s, transform 0.25s;
  }
  .dot.active{
    background:#fff;
    transform:scale(1.4);
  }

  /* دکمه‌های چپ/راست */
  .hero-prev,.hero-next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:10;
    width:32px;height:32px;
    border-radius:50%;
    background:rgba(255,255,255,0.18);
    border:1px solid rgba(255,255,255,0.3);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    transition:background 0.2s;
  }
  .hero-prev:active,.hero-next:active{background:rgba(255,255,255,0.35);}
  .hero-prev{ right:12px; }
  .hero-next{ left:12px; }

  /* ══════════════════════════════
     GREET
  ══════════════════════════════ */
  .greet{padding:22px 26px 4px;text-align:center;}
  .greet h1{font-size:21px;font-weight:800;color:#fff;letter-spacing:-0.3px;text-shadow:0 2px 12px rgba(0,0,0,0.2);}
  .greet p{margin-top:6px;font-size:13px;color:rgba(255,255,255,0.7);font-weight:500;}

  /* ══════════════════════════════
     CARDS
  ══════════════════════════════ */
  .container{padding:20px 16px 60px;}

  .row-label{
    font-size:14px;font-weight:700;
    color:rgba(255,255,255,0.9);
    margin:24px 0 12px 0;
    padding:0 4px;
    letter-spacing:-0.2px;
  }

  .carousel{
    display:flex;gap:16px;
    overflow-x:auto;scroll-behavior:smooth;
    padding-bottom:10px;
    margin:0 -16px;
    padding-left:16px;padding-right:16px;
  }
  .carousel::-webkit-scrollbar{display:none;}

  .card-wrap{
    flex:0 0 200px;height:356px;
    border-radius:26px;padding:3px;
    background:linear-gradient(145deg,rgba(255,255,255,0.5) 0%,rgba(200,150,255,0.3) 50%,rgba(255,255,255,0.2) 100%);
    box-shadow:
      0 2px 0 rgba(255,255,255,0.5),
      0 16px 36px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.7);
    cursor:pointer;
    transition:transform 0.18s, box-shadow 0.18s;
    flex-shrink:0;
  }
  .card-wrap:active{
    transform:scale(0.97);
    box-shadow:0 6px 18px rgba(0,0,0,0.3);
  }

  .card{
    border-radius:24px;overflow:hidden;
    background:#fff;
    display:flex;flex-direction:column;
    position:relative;height:100%;
  }

  .card-photo{
    position:absolute;inset:0;
    width:100%;height:100%;overflow:hidden;
  }
  .card-photo img{
    width:100%;height:100%;
    object-fit:cover;object-position:center;display:block;
  }
  .card-photo::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(
      to bottom,
      rgba(0,0,0,0.04) 0%,
      transparent 20%,
      rgba(5,10,30,0.4) 50%,
      rgba(5,10,30,0.92) 100%
    );
    pointer-events:none;
  }

  .badge{
    position:absolute;top:14px;left:14px;
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.4);
    border-radius:50px;padding:5px 13px;
    font-size:11px;font-family:'Vazirmatn',sans-serif;
    font-weight:700;color:#fff;z-index:2;letter-spacing:0.2px;
  }

  .card-body{
    position:absolute;bottom:0;right:0;left:0;
    margin:10px;padding:14px;z-index:2;
    display:flex;flex-direction:column;align-items:flex-start;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    border:1px solid rgba(255,255,255,0.22);
    border-radius:18px;
    box-shadow:0 4px 24px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .card-title{font-size:16px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:6px;direction:rtl;letter-spacing:-0.4px;}
  .card-desc{font-size:11px;font-weight:500;color:rgba(255,255,255,0.8);line-height:1.65;direction:rtl;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .card-footer{width:100%;display:flex;align-items:center;justify-content:space-between;direction:ltr;}
  .read-time{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:rgba(255,255,255,0.72);font-family:'Vazirmatn',sans-serif;direction:rtl;}
  .btn-read{
    background:#fff;color:#7b2fa0;border:none;border-radius:50px;
    padding:8px 16px;font-size:12px;
    font-family:'Vazirmatn',sans-serif;font-weight:800;
    cursor:pointer;transition:opacity 0.15s,transform 0.15s;
    white-space:nowrap;letter-spacing:-0.2px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
  }
  .btn-read:active{opacity:0.85;transform:scale(0.97);}
</style>
</head>

<div class="wrap">

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="brand-mark">L</div>
      <div class="brand-name">planlife.ir</div>
    </div>
    <div class="bell">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M12 3a5 5 0 0 0-5 5v3.2c0 .5-.2 1-.5 1.4L5 15h14l-1.5-2.4a2.2 2.2 0 0 1-.5-1.4V8a5 5 0 0 0-5-5Z" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-linejoin="round"/>

          <!-- آیکون IELTS / امتحان -->
          <rect x="40" y="50" width="120" height="110" rx="14" fill="rgba(255,255,255,0.13)" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
          <rect x="56" y="68" width="88" height="8" rx="4" fill="rgba(255,255,255,0.55)"/>
          <rect x="56" y="84" width="60" height="5" rx="2.5" fill="rgba(255,255,255,0.35)"/>
          <rect x="56" y="96" width="72" height="5" rx="2.5" fill="rgba(255,255,255,0.3)"/>

          <div class="slide-tag">مکالمه</div>

    </div>

    <!-- ناوبری -->
    <button class="hero-prev" id="heroPrev" aria-label="قبلی">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">

  <!-- GREET -->

    <h1>سلام، خوش برگشتی 👋</h1>

  <!-- CARDS -->
  <div class="container">
    <div class="row-label">سطح‌های پایه</div>
    <div class="carousel" id="row1"></div>

    <div class="row-label">سطح‌های پیشرفته</div>
    <div class="carousel" id="row2"></div>
  </div>
</div>

<script>
/* ── SLIDER ── */
const slidesEl = document.getElementById('slides');
const dots = document.querySelectorAll('.dot');
let cur = 0;
const total = 3;

function goTo(n){
  cur = (n + total) % total;
  slidesEl.style.transform = `translateX(${cur * 100}%)`;
  dots.forEach((d,i) => d.classList.toggle('active', i === cur));
}

document.getElementById('heroNext').addEventListener('click', () => goTo(cur - 1));
document.getElementById('heroPrev').addEventListener('click', () => goTo(cur + 1));
dots.forEach(d => d.addEventListener('click', () => goTo(+d.dataset.i)));

/* auto-play */
let timer = setInterval(() => goTo(cur + 1), 3800);
document.getElementById('hero').addEventListener('touchstart', () => clearInterval(timer), {passive:true});

/* ── CARDS ── */
const BASE = 'http://fs3.centraldnserver.com/~planlife/pics/english/';
const imgs = [1,2,3,4,5,6,7];

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

const row1Cards = [

function makeCard(c, imgNum){
  return `
  <div class="card-wrap">
    <div class="card">
      <div class="card-photo">
        <img src="${BASE}${imgNum}.jpg" alt="${c.title}" loading="lazy"
             onerror="this.style.background='linear-gradient(135deg,#7b2fa0,#e040a0)'">
      </div>
      <span class="badge">${c.badge}</span>
      <div class="card-body">
        <div class="card-title">${c.title}</div>
        <div class="card-desc">${c.desc}</div>
        <div class="card-footer">
          <div class="read-time">${c.hours} ساعت</div>
          <button class="btn-read">شروع کن</button>
        </div>
      </div>
    </div>
  </div>`;
}

row2Cards.forEach((c,i) => r2.insertAdjacentHTML('beforeend', makeCard(c, sh2[i%7])));
