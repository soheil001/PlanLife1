<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lingua — planlife.ir</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1535; --muted:#8b84a8;
    --glass:rgba(255,255,255,0.15);
    --glass-brd:rgba(255,255,255,0.28);
    --pink:#e040a0;
    --purple:#5b3fe8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}

  body{
    font-family:'Vazirmatn',sans-serif;
    min-height:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    background: linear-gradient(150deg,#3a2472 0%,#6b3a9e 40%,#a94a8a 70%,#5a3a9e 100%);
    background-attachment: fixed;
  }

  body::before{
    content:'';
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(220,100,180,0.15), transparent 60%),
      radial-gradient(ellipse 70% 50% at 90% 80%, rgba(60,20,160,0.2), transparent 60%),
      radial-gradient(ellipse 60% 70% at 60% 40%, rgba(150,30,200,0.1), transparent 60%);
  }

  .wrap{max-width:520px;margin:0 auto;min-height:100%;position:relative;z-index:1;}

  /* ══════════════════════════════
     HEADER
  ══════════════════════════════ */
  header{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:100;
    margin:14px 16px 6px;
    padding:10px 16px;
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.3);
    border-radius:18px;
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,0.7) 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Poppins',sans-serif;font-weight:800;font-size:15px;
    color:#7b2fa0;flex-shrink:0;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
  }
  .brand-name{
    font-family:'Poppins',sans-serif;font-weight:700;font-size:14.5px;
    color:#fff;direction:ltr;letter-spacing:0.2px;
  }
  .bell{
    width:34px;height:34px;border-radius:12px;
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.3);
    display:flex;align-items:center;justify-content:center;
  }

  /* ══════════════════════════════
     HERO SLIDER
  ══════════════════════════════ */
  .hero{
    margin:16px 16px 0;
    border-radius:28px;
    overflow:hidden;
    position:relative;
    height:240px;
    border:1px solid rgba(255,255,255,0.22);
    box-shadow:0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
  }

  .slides{
    display:flex;
    width:100%;
    height:100%;
    transition:transform 0.55s cubic-bezier(0.77,0,0.18,1);
  }

  .slide{
    min-width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
    flex-shrink:0;
  }

  .slide-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
    z-index:0;
  }

  /* overlay روشن‌تر — فقط یه لایه خیلی ملایم */
  .slide::after{
    content:'';
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
  }
  .slide-1::after{ background:linear-gradient(135deg, rgba(45,27,142,0.18) 0%, rgba(139,47,160,0.12) 45%, rgba(224,64,160,0.08) 100%); }
  .slide-2::after{ background:linear-gradient(135deg, rgba(26,10,94,0.20) 0%, rgba(91,31,168,0.14) 45%, rgba(192,32,110,0.08) 100%); }
  .slide-3::after{ background:linear-gradient(135deg, rgba(61,20,136,0.18) 0%, rgba(155,63,217,0.12) 45%, rgba(255,80,176,0.07) 100%); }

  /* دات‌های ناوبری */
  .hero-dots{
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:6px;
    z-index:10;
  }
  .dot{
    width:6px;height:6px;
    border-radius:50%;
    background:rgba(255,255,255,0.4);
    cursor:pointer;
    transition:background 0.25s, transform 0.25s;
  }
  .dot.active{
    background:#fff;
    transform:scale(1.4);
  }

  /* دکمه‌های چپ/راست */
  .hero-prev,.hero-next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:10;
    width:32px;height:32px;
    border-radius:50%;
    background:rgba(255,255,255,0.18);
    border:1px solid rgba(255,255,255,0.3);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    transition:background 0.2s;
  }
  .hero-prev:active,.hero-next:active{background:rgba(255,255,255,0.35);}
  .hero-prev{ right:12px; }
  .hero-next{ left:12px; }

  /* ══════════════════════════════
     GREET
  ══════════════════════════════ */
  .greet{padding:22px 26px 4px;text-align:center;}
  .greet h1{font-size:21px;font-weight:800;color:#fff;letter-spacing:-0.3px;text-shadow:0 2px 12px rgba(0,0,0,0.2);}
  .greet p{margin-top:6px;font-size:13px;color:rgba(255,255,255,0.7);font-weight:500;}

  /* ══════════════════════════════
     CARDS
  ══════════════════════════════ */
  .container{padding:20px 16px 60px;}

  .row-label{
    font-size:14px;font-weight:700;
    color:rgba(255,255,255,0.9);
    margin:24px 0 12px 0;
    padding:0 4px;
    letter-spacing:-0.2px;
  }

  .carousel{
    display:flex;gap:16px;
    overflow-x:auto;scroll-behavior:smooth;
    padding-bottom:10px;
    margin:0 -16px;
    padding-left:16px;padding-right:16px;
  }
  .carousel::-webkit-scrollbar{display:none;}

  .card-wrap{
    flex:0 0 200px;height:356px;
    border-radius:26px;padding:3px;
    background:linear-gradient(145deg,rgba(255,255,255,0.5) 0%,rgba(200,150,255,0.3) 50%,rgba(255,255,255,0.2) 100%);
    box-shadow:
      0 2px 0 rgba(255,255,255,0.5),
      0 16px 36px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.7);
    cursor:pointer;
    transition:transform 0.18s, box-shadow 0.18s;
    flex-shrink:0;
  }
  .card-wrap:active{
    transform:scale(0.97);
    box-shadow:0 6px 18px rgba(0,0,0,0.3);
  }

  .card{
    border-radius:24px;overflow:hidden;
    background:#fff;
    display:flex;flex-direction:column;
    position:relative;height:100%;
  }

  .card-photo{
    position:absolute;inset:0;
    width:100%;height:100%;overflow:hidden;
  }
  .card-photo img{
    width:100%;height:100%;
    object-fit:cover;object-position:center;display:block;
  }
  .card-photo::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(
      to bottom,
      rgba(0,0,0,0.04) 0%,
      transparent 20%,
      rgba(5,10,30,0.4) 50%,
      rgba(5,10,30,0.92) 100%
    );
    pointer-events:none;
  }

  .badge{
    position:absolute;top:14px;left:14px;
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.4);
    border-radius:50px;padding:5px 13px;
    font-size:11px;font-family:'Vazirmatn',sans-serif;
    font-weight:700;color:#fff;z-index:2;letter-spacing:0.2px;
  }

  .card-body{
    position:absolute;bottom:0;right:0;left:0;
    margin:10px;padding:14px;z-index:2;
    display:flex;flex-direction:column;align-items:flex-start;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    border:1px solid rgba(255,255,255,0.22);
    border-radius:18px;
    box-shadow:0 4px 24px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .card-title{font-size:16px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:6px;direction:rtl;letter-spacing:-0.4px;}
  .card-desc{font-size:11px;font-weight:500;color:rgba(255,255,255,0.8);line-height:1.65;direction:rtl;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .card-footer{width:100%;display:flex;align-items:center;justify-content:space-between;direction:ltr;}
  .read-time{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:rgba(255,255,255,0.72);font-family:'Vazirmatn',sans-serif;direction:rtl;}
  .btn-read{
    background:#fff;color:#7b2fa0;border:none;border-radius:50px;
    padding:8px 16px;font-size:12px;
    font-family:'Vazirmatn',sans-serif;font-weight:800;
    cursor:pointer;transition:opacity 0.15s,transform 0.15s;
    white-space:nowrap;letter-spacing:-0.2px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
  }
  .btn-read:active{opacity:0.85;transform:scale(0.97);}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="brand-mark">L</div>
      <div class="brand-name">planlife.ir</div>
    </div>
    <div class="bell">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M12 3a5 5 0 0 0-5 5v3.2c0 .5-.2 1-.5 1.4L5 15h14l-1.5-2.4a2.2 2.2 0 0 1-.5-1.4V8a5 5 0 0 0-5-5Z" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M9.5 18a2.5 2.5 0 0 0 5 0" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
  </header>

  <!-- HERO SLIDER — بدون متن -->
  <div class="hero" id="hero">
    <div class="slides" id="slides">

      <!-- اسلاید ۱ -->
      <div class="slide slide-1">
        <img class="slide-bg"
             src="http://fs3.centraldnserver.com/~planlife/pics/english/slide1.jpg"
             alt=""
             onerror="this.style.display='none'">
      </div>

      <!-- اسلاید ۲ -->
      <div class="slide slide-2">
        <img class="slide-bg"
             src="http://fs3.centraldnserver.com/~planlife/pics/english/slide2.jpg"
             alt=""
             onerror="this.style.display='none'">
      </div>

      <!-- اسلاید ۳ -->
      <div class="slide slide-3">
        <img class="slide-bg"
             src="http://fs3.centraldnserver.com/~planlife/pics/english/slide3.jpg"
             alt=""
             onerror="this.style.display='none'">
      </div>

    </div>

    <!-- ناوبری -->
    <button class="hero-prev" id="heroPrev" aria-label="قبلی">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M9 18l6-6-6-6" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="hero-next" id="heroNext" aria-label="بعدی">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M15 18l-6-6 6-6" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="hero-dots">
      <div class="dot active" data-i="0"></div>
      <div class="dot" data-i="1"></div>
      <div class="dot" data-i="2"></div>
    </div>
  </div>

  <!-- GREET -->
  <div class="greet">
    <h1>سلام، خوش برگشتی 👋</h1>
    <p>یکی از دسته‌ها رو انتخاب کن و یادگیری رو شروع کن</p>
  </div>

  <!-- CARDS -->
  <div class="container">
    <div class="row-label">سطح‌های پایه</div>
    <div class="carousel" id="row1"></div>

    <div class="row-label">سطح‌های پیشرفته</div>
    <div class="carousel" id="row2"></div>
  </div>
</div>

<script>
/* ── SLIDER ── */
const slidesEl = document.getElementById('slides');
const dots = document.querySelectorAll('.dot');
let cur = 0;
const total = 3;

function goTo(n){
  cur = (n + total) % total;
  slidesEl.style.transform = `translateX(${cur * 100}%)`;
  dots.forEach((d,i) => d.classList.toggle('active', i === cur));
}

document.getElementById('heroNext').addEventListener('click', () => goTo(cur - 1));
document.getElementById('heroPrev').addEventListener('click', () => goTo(cur + 1));
dots.forEach(d => d.addEventListener('click', () => goTo(+d.dataset.i)));

let timer = setInterval(() => goTo(cur + 1), 3800);
document.getElementById('hero').addEventListener('touchstart', () => clearInterval(timer), {passive:true});

/* ── CARDS ── */
const BASE = 'http://fs3.centraldnserver.com/~planlife/pics/english/';
const imgs = [1,2,3,4,5,6,7];

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

const row1Cards = [
  {title:'سوالات مبتدی',     desc:'یادگیری از صفر با ساده‌ترین سوالات. پایه‌های محکمی برای شروع زبان انگلیسی بسازید.',         badge:'مبتدی',       hours:'۳۲'},
  {title:'سوالات مقدماتی',   desc:'مرحله بعدی برای ارتقای مهارت زبانی. گرامر و واژگان پایه را در قالب تمرین‌های جذاب تقویت کنید.',badge:'مقدماتی',    hours:'۴۸'},
  {title:'سوالات پیشرفته ۱', desc:'بالا بردن مهارت‌ها با تمرین‌های چالش‌برانگیز. ساختارهای پیچیده‌تر زبان را فرا بگیرید.',      badge:'پیشرفته ۱',   hours:'۶۴'},
  {title:'سوالات پیشرفته ۲', desc:'تقویت درک مطلب و مکالمه در سطح بالاتر با تمرکز بر موضوعات روزمره و کاربردی.',                badge:'پیشرفته ۲',   hours:'۷۲'},
  {title:'سوالات پیشرفته ۳', desc:'مهارت نوشتاری و شنیداری را در این سطح به طرز چشمگیری تقویت خواهید کرد.',                   badge:'پیشرفته ۳',   hours:'۸۰'},
  {title:'سوالات پیشرفته ۴', desc:'آخرین سطح از مجموعه پیشرفته با تمرکز بر مهارت‌های ترکیبی و درک متون پیچیده.',              badge:'پیشرفته ۴',   hours:'۹۰'},
];

const row2Cards = [
  {title:'سوالات پیشرفته ۵', desc:'ورود به سطح حرفه‌ای با تمرین‌های فشرده و محتوای تخصصی زبان انگلیسی.',                      badge:'پیشرفته ۵',   hours:'۹۶'},
  {title:'سوالات پیشرفته ۶', desc:'تسلط کامل بر ساختارهای دستوری پیچیده و واژگان سطح بالا برای موفقیت بیشتر.',                 badge:'پیشرفته ۶',   hours:'۱۰۴'},
  {title:'IELTS ۱',          desc:'آشنایی با ساختار آزمون IELTS و تمرین مهارت‌های چهارگانه در سطح پایه.',                      badge:'IELTS ۱',     hours:'۴۸'},
  {title:'IELTS ۲',          desc:'تقویت Writing و Speaking با استفاده از نمونه سوالات واقعی آزمون IELTS.',                     badge:'IELTS ۲',     hours:'۶۴'},
  {title:'IELTS ۳',          desc:'آمادگی کامل برای کسب نمره بالا در IELTS با استراتژی‌های اثبات‌شده و تمرین فشرده.',           badge:'IELTS ۳',     hours:'۸۰'},
  {title:'فوق حرفه‌ای',       desc:'سطح نهایی و جامع برای تسلط کامل بر زبان انگلیسی. پکیج کامل از مبتدی تا پیشرفته.',           badge:'فوق حرفه‌ای', hours:'۱۲۸'},
];

function makeCard(c, imgNum){
  return `
  <div class="card-wrap">
    <div class="card">
      <div class="card-photo">
        <img src="${BASE}${imgNum}.jpg" alt="${c.title}" loading="lazy"
             onerror="this.style.background='linear-gradient(135deg,#7b2fa0,#e040a0)'">
      </div>
      <span class="badge">${c.badge}</span>
      <div class="card-body">
        <div class="card-title">${c.title}</div>
        <div class="card-desc">${c.desc}</div>
        <div class="card-footer">
          <div class="read-time">${c.hours} ساعت</div>
          <button class="btn-read">شروع کن</button>
        </div>
      </div>
    </div>
  </div>`;
}

const sh1 = shuffle(imgs);
const sh2 = shuffle(imgs);
const r1 = document.getElementById('row1');
const r2 = document.getElementById('row2');
row1Cards.forEach((c,i) => r1.insertAdjacentHTML('beforeend', makeCard(c, sh1[i%7])));
row2Cards.forEach((c,i) => r2.insertAdjacentHTML('beforeend', makeCard(c, sh2[i%7])));
</script>
</body>
</html>
