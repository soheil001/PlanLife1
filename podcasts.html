<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تست نهایی پلیر</title>
    <style>
        body { background: #222; color: white; text-align: center; font-family: sans-serif; padding: 50px; }
        .box { background: #333; padding: 20px; border-radius: 20px; border: 2px solid #7d2ae8; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 10px; border: none; margin: 10px; }
        #playBtn { background: #fff; color: #000; }
        #testBtn { background: #7d2ae8; color: #fff; }
    </style>
</head>
<body>

    <div class="box">
        <h2>تست پخش پادکست</h2>
        <p id="info">وضعیت: منتظر انتخاب شما</p>
        
        <button id="testBtn" onclick="alert('کدها سالم هستند! حالا روی پخش کلیک کن')">اول اینجا را بزن (تست سلامت)</button>
        
        <br><br>
        
        <button id="playBtn" onclick="startAudio()">▶ پخش پادکست کلودینری</button>
    </div>

    <audio id="player">
        <source src="https://res.cloudinary.com/dshielkdt/video/upload/v1779205048/YTDown_YouTube_Media_jrK9TiZ251M_008_128k_jxdssu.mp3" type="audio/mpeg">
    </audio>

    <script>
        function startAudio() {
            var audio = document.getElementById("player");
            var info = document.getElementById("info");
            var btn = document.getElementById("playBtn");

            if (audio.paused) {
                audio.play().then(() => {
                    info.innerText = "وضعیت: در حال پخش... 🎧";
                    btn.innerText = "⏸ توقف";
                }).catch(err => {
                    alert("خطا: مرورگر اجازه پخش نمی‌دهد. یک بار روی صفحه کلیک کنید و دوباره بزنید.");
                });
            } else {
                audio.pause();
                info.innerText = "وضعیت: متوقف شد";
                btn.innerText = "▶ پخش";
            }
        }
    </script>

</body>
</html>
