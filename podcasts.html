<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanLife | پادکست</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;800&display=swap');
        body { 
            margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            background: #7d2ae8; color: white; font-family: 'Vazirmatn', sans-serif; padding: 20px;
        }
        .player-card {
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px);
            padding: 30px; border-radius: 30px; text-align: center; width: 100%; max-width: 350px;
        }
        .play-btn {
            width: 80px; height: 80px; background: white; border-radius: 50%; border: none;
            cursor: pointer; font-size: 30px; display: flex; align-items: center; justify-content: center;
            margin: 20px auto;
        }
        .item {
            background: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 15px;
            margin-top: 20px; cursor: pointer; width: 100%; max-width: 350px; text-align: center;
        }
    </style>
</head>
<body>

    <h2>پخش پادکست</h2>

    <div class="player-card">
        <h3 id="status">ابتدا انتخاب کنید</h3>
        <button class="play-btn" id="btn" onclick="pressPlay()">▶</button>
    </div>

    <div class="item" onclick="start('https://res.cloudinary.com/dshielkdt/video/upload/v1779205048/YTDown_YouTube_Media_jrK9TiZ251M_008_128k_jxdssu.mp3', 'قسمت اول')">
        کلیک کنید: پخش پادکست شماره ۱
    </div>

    <audio id="myAudio"></audio>

    <script>
        var track = document.getElementById("myAudio");
        var btn = document.getElementById("btn");
        var statusText = document.getElementById("status");

        function start(url, title) {
            track.src = url;
            track.play();
            statusText.innerText = "در حال پخش: " + title;
            btn.innerText = "⏸";
        }

        function pressPlay() {
            if (!track.src) {
                alert("لطفاً اول از لیست پایین انتخاب کنید");
                return;
            }
            if (track.paused) {
                track.play();
                btn.innerText = "⏸";
            } else {
                track.pause();
                btn.innerText = "▶";
            }
        }
    </script>
</body>
</html>
