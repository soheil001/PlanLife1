<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>PlanLife - محتوای رایگان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<script>document.documentElement.dataset.t=(function(){var h=new Date().getHours();return h>=6&&h<18?'light':'dark'})()</script>
<style>
:root{--bg:#f6f7fb;--ink:#222326;--mut:#a3a8b3;--hair:#dfe2e8;--pg:#fff;--inv:#222326;--invt:#fff;--mini:#222326;--r:22px}[data-t=dark]{--bg:#26272d;--ink:#f2f3f5;--mut:#8b909b;--hair:#363740;--pg:#17181c;--inv:#f2f3f5;--invt:#17181c;--mini:#2d2e35}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--pg);transition:background .3s;font-family:'Vazirmatn',sans-serif;color:var(--ink);min-height:100dvh}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 22px 130px}
/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between}
h1{font-size:30px;font-weight:900;letter-spacing:-.5px}
.pills{display:flex;gap:5px;margin-top:6px}
.pills i{height:6px;width:7px;border-radius:9px;background:var(--hair);transition:.3s;cursor:pointer}
.pills i.on{width:20px;background:var(--ink)}
.sbtn{width:42px;height:42px;border-radius:50%;background:var(--inv);font-size:18px;display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,0,0,.2)}
.sbtn svg{width:18px;height:18px;stroke:var(--invt);fill:none;stroke-width:2.4;stroke-linecap:round}
.search{display:none;margin-top:14px}
.search.on{display:block}
.search input{width:100%;border:0;background:var(--bg);border-radius:16px;padding:13px 16px;font:inherit;font-size:14px;outline:none}
/* hero */
/* hero slider */
.hero{position:relative;margin-top:22px;height:214px;border-radius:30px;overflow:hidden;direction:ltr;box-shadow:0 24px 40px -14px rgba(70,40,150,.5);background:#222;touch-action:pan-y;user-select:none}
.sl{position:absolute;inset:0;transition:transform .7s cubic-bezier(.32,.72,0,1),opacity .7s;overflow:hidden}
.sl .bg{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(26px) saturate(1.6) brightness(.8);transform:scale(1.1)}
.shade{position:absolute;inset:0;background:linear-gradient(110deg,rgba(0,0,0,.05),rgba(0,0,0,.55))}
.vp .shade{background:linear-gradient(135deg,#f6c453,#ff7a59 55%,#c13584)}
.sc{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:22px 24px 30px;direction:rtl;color:#fff}
.tx{flex:1;min-width:0;z-index:2}
.bdg{display:inline-block;font-size:11px;font-weight:800;padding:4px 11px;border-radius:99px;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35)}
.tx h3{font-size:21px;font-weight:900;line-height:1.45;margin:10px 0 2px;text-shadow:0 2px 12px rgba(0,0,0,.35);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tx small{font-size:12px;opacity:.88;display:block;line-height:1.6}
.hp{margin-top:12px;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:19px;background:#fff;color:#222;font-weight:800;font-size:13px;box-shadow:0 10px 20px rgba(0,0,0,.25)}
.hp svg{width:16px;height:16px;fill:#222}
.cvw{position:relative;width:126px;height:126px;flex-shrink:0;animation:fl 5s ease-in-out infinite}
.cvw>img{position:relative;width:100%;height:100%;border-radius:26px;object-fit:cover;transform:rotate(-7deg);box-shadow:0 22px 34px rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.5)}
.vn{position:absolute;right:-24px;top:12px;width:104px;height:104px;border-radius:50%;background:radial-gradient(#666 0 14%,#111 15%);animation:sp 6s linear infinite}
.crown{display:grid;place-items:center;font-size:84px;filter:drop-shadow(0 14px 18px rgba(0,0,0,.35))}
.hd{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:5;pointer-events:none}
.hd i{height:6px;width:6px;border-radius:9px;background:rgba(255,255,255,.5);transition:.35s}
.hd i.on{width:22px;background:#fff}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes sp{to{transform:rotate(360deg)}}
/* sections */
.sec{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px}
.sec h2{font-size:19px;font-weight:900}
.sec a{font-size:13px;color:var(--mut);cursor:pointer}
.panel{display:none}.panel.on{display:block}
.h-scroll{display:flex;gap:14px;overflow-x:auto;margin:0 -22px;padding:4px 22px 14px;scrollbar-width:none}
.h-scroll::-webkit-scrollbar{display:none}
.alb{flex:0 0 104px;cursor:pointer}
.alb img{width:104px;height:104px;border-radius:20px;object-fit:cover;display:block;box-shadow:0 12px 20px -6px rgba(0,0,0,.28)}
.alb b{display:block;margin-top:10px;font-size:13px;font-weight:700;line-height:1.4}
.alb small{color:var(--mut);font-size:11.5px}
.row{display:flex;align-items:center;gap:14px;padding:9px 0;cursor:pointer}
.row img,.row .ic{width:52px;height:52px;border-radius:16px;object-fit:cover;flex-shrink:0;box-shadow:0 8px 16px -4px rgba(0,0,0,.22)}
.row .ic{display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#c9b8ff,#ffb8d9);color:#fff;font-weight:900}
.row .t{flex:1;min-width:0}
.row b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--mut);font-size:12px}
.row .dots{color:#c4c8d0;letter-spacing:3px;font-weight:900}
.row.cur b{color:#e5484d}
/* mini player */
.mini{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);max-width:536px;margin:0 auto;height:66px;border-radius:33px;background:var(--mini);color:#fff;display:none;align-items:center;gap:12px;padding:0 14px;z-index:50;box-shadow:0 14px 30px rgba(0,0,0,.3);cursor:pointer}
.mini.on{display:flex}
.eq{display:flex;align-items:flex-end;gap:3px;height:16px}
.eq i{width:3px;background:#ff3d6e;border-radius:2px;height:5px}
.playing .eq i{animation:eq .9s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s!important}.eq i:nth-child(3){animation-delay:.4s!important}
@keyframes eq{50%{height:16px}}
.mini img{width:46px;height:46px;border-radius:14px;object-fit:cover}
.mini .ph{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#ff5c8a);display:grid;place-items:center}
.mini .t{flex:1;min-width:0}
.mini b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small{color:#9ea3ad;font-size:11.5px}
.mini svg,.ctl svg{fill:currentColor}
.mb{width:30px;height:30px;display:grid;place-items:center}
.mb svg{width:18px;height:18px}
.mb.pl{width:40px;height:40px;border-radius:50%;background:#fff;color:#222}
.mb.pl svg{width:20px;height:20px}
/* full player */
.sheet{position:fixed;inset:0;background:var(--pg);z-index:100;overflow-y:auto;transform:translateY(105%);transition:transform .5s cubic-bezier(.32,.72,0,1);padding:calc(env(safe-area-inset-top) + 22px) 22px 40px}
.sheet.on{transform:none}
.sheet .in{max-width:460px;margin:0 auto}
.stage{direction:ltr;position:relative;height:290px;margin:26px 0 0 -22px;padding-left:22px}
.stage .vin{position:absolute;left:210px;top:30px;width:230px;height:230px;border-radius:50%;background:radial-gradient(#444 0 12%,#111 13%)}
.stage .cv{position:absolute;left:22px;top:0;width:min(270px,70vw);aspect-ratio:1;border-radius:var(--r);object-fit:cover;box-shadow:0 26px 40px -8px rgba(90,60,160,.5);background:var(--bg)}
.stage .nx{position:absolute;left:calc(22px + min(270px,70vw) + 28px);top:34px;width:80px;height:min(210px,54vw);border-radius:var(--r) 0 0 var(--r);object-fit:cover;opacity:.95}
.qbox{display:none;margin-top:26px;height:240px;border-radius:var(--r);background:var(--bg);padding:22px;align-items:center;justify-content:center;text-align:center;font-weight:700;line-height:1.9;font-size:16px;overflow-y:auto;box-shadow:0 20px 34px -10px rgba(0,0,0,.18)}
.qmode .stage{display:none}.qmode .qbox{display:flex}
.meta{display:flex;align-items:center;justify-content:space-between;margin-top:26px;gap:12px}
.meta h2{font-size:22px;font-weight:900;letter-spacing:1px;line-height:1.5}
.meta small{color:var(--mut);font-size:14px}
.heart{width:36px;height:36px;display:grid;place-items:center;flex-shrink:0}
.heart svg{width:26px;height:26px;fill:var(--hair);transition:.2s}
.heart.on svg{fill:#ff3b4e;filter:drop-shadow(0 4px 6px rgba(255,59,78,.5))}
.wave{direction:ltr;position:relative;height:44px;margin-top:34px;touch-action:none;cursor:pointer}
.wave svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wave .dot{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);box-shadow:0 3px 8px rgba(0,0,0,.3)}
.times{direction:ltr;display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:2px}
.ctl{direction:ltr;display:flex;align-items:center;justify-content:space-between;margin-top:26px;padding:0 4px}
.ctl button{width:44px;height:44px;display:grid;place-items:center}
.ctl button svg{width:24px;height:24px}
.ctl .big{width:70px;height:70px;border-radius:50%;background:var(--inv);color:var(--invt);box-shadow:0 16px 26px rgba(0,0,0,.3)}
.ctl .big svg{width:30px;height:30px}
.ctl .rep.on{color:#e5484d}
/* comments */
.cm h3{font-size:17px;font-weight:900;margin:34px 0 12px}
.cm .it{background:var(--bg);border-radius:18px;padding:12px 15px;margin-bottom:9px}
.cm .it div{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.cm .it strong{color:var(--ink);font-size:13.5px}
.cm .it p{font-size:13.5px;line-height:1.7;margin-top:5px}
.cm input,.cm textarea{width:100%;border:0;background:var(--bg);border-radius:16px;padding:13px 16px;font:inherit;font-size:14px;margin-bottom:9px;outline:none;display:block}
.cm textarea{height:84px;resize:none}
.cm .send{width:100%;height:50px;border-radius:25px;background:var(--inv);color:var(--invt);font-weight:700;font-size:15px;box-shadow:0 12px 22px rgba(0,0,0,.25)}
.empty{color:var(--mut);text-align:center;padding:16px;font-size:13.5px}
input,textarea{color:var(--ink)}
.pop{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
.pop.on{display:flex}
.pbox{position:relative;background:var(--pg);border-radius:26px;padding:32px 24px 24px;width:100%;max-width:340px;box-shadow:0 30px 60px rgba(0,0,0,.35);text-align:center}
.pbox h3{font-size:19px;font-weight:900}
.pbox p{color:var(--mut);font-size:13px;margin:6px 0 18px}
.pbox input{width:100%;border:0;background:var(--bg);border-radius:16px;padding:14px;font:inherit;font-size:22px;font-weight:700;text-align:center;letter-spacing:10px;direction:ltr;outline:none}
.perr{color:#e5484d;font-size:12.5px;margin-top:8px;min-height:18px}
.pb{display:block;width:100%;height:50px;line-height:50px;border-radius:25px;font-weight:800;font-size:15px;margin-top:8px;color:#fff;text-decoration:none;text-align:center}
.pb.g{background:#22c55e;box-shadow:0 10px 20px rgba(34,197,94,.35)}
.pb.y{background:#facc15;color:#2a2200;box-shadow:0 10px 20px rgba(250,204,21,.35)}
.px{position:absolute;top:12px;left:16px;font-size:18px;color:var(--mut)}
/* glass cards */
.gc{position:relative;flex:0 0 230px;height:272px;border-radius:30px;overflow:hidden;cursor:pointer;box-shadow:0 18px 30px -10px rgba(40,40,120,.45);background:#333;color:#fff}
.gc>img,.gb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gb:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.38),transparent 42%),radial-gradient(circle at 85% 70%,rgba(255,255,255,.22),transparent 45%)}
.gs{position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,40,.6))}
.gl{position:absolute;top:12px;left:12px;font-size:11px;font-weight:800;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.35)}
.gt{position:absolute;right:16px;left:16px;bottom:84px;font-size:19px;font-weight:800;line-height:1.55;text-shadow:0 2px 10px rgba(0,0,0,.45);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qa .gt{font-size:15px;-webkit-line-clamp:3}
.gr{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;align-items:center}
.gp{width:54px;height:54px;border-radius:18px;background:#f4f5ff;display:grid;place-items:center;flex-shrink:0;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.gp svg{width:22px;height:22px;fill:#222}
.gst{flex:1;display:flex;height:54px;border-radius:18px;background:rgba(255,255,255,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.gst div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.gst div+div:before{content:'';position:absolute;right:0;top:14px;bottom:14px;width:1px;background:rgba(255,255,255,.4)}
.gst svg{width:13px;height:13px;fill:#fff}
.gst em{font-style:normal;font-size:10.5px;font-weight:700}
/* category packs */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-bottom:10px}
.cc{position:relative;border-radius:28px;padding:16px 14px 14px;background:linear-gradient(180deg,#1d2030,#13151e);border:1px solid rgba(255,255,255,.07);box-shadow:0 18px 30px -12px rgba(0,0,0,.55);color:#eef0f6;overflow:hidden}
.cc:last-child:nth-child(odd){grid-column:span 2}
.cc:before{content:'';position:absolute;left:-30%;right:-30%;top:18%;height:150px;background:radial-gradient(ellipse,var(--c),transparent 65%);opacity:.22;pointer-events:none}
.ch{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;line-height:1.5;padding-bottom:11px;border-bottom:1px solid rgba(255,255,255,.07);position:relative}
.ch svg{width:17px;height:17px;flex-shrink:0;stroke:var(--c);fill:none;stroke-width:1.8;stroke-linejoin:round}
.art{position:relative;height:128px;display:grid;place-items:center}
.art:before{content:'';position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(var(--c),transparent 68%);opacity:.5;filter:blur(8px)}
.art:after{content:'';position:absolute;bottom:12px;width:82%;height:30px;border-radius:10px;background:linear-gradient(#2b2f40,#151721);border-top:2px solid var(--c);box-shadow:0 0 22px var(--c)}
.art span{position:relative;z-index:1;font-size:58px;margin-bottom:12px;filter:drop-shadow(0 0 16px var(--c)) drop-shadow(0 12px 12px rgba(0,0,0,.6));animation:fl 5s ease-in-out infinite}
.ci{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;margin:6px 0 12px;position:relative}
.ci b{color:#59e08a}.ci i{font-style:normal;color:#6c7186;font-weight:600}
.cb{position:relative;width:100%;height:42px;border-radius:21px;background:linear-gradient(#86e9a0,#3dbd69);color:#0b2a16;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 8px 18px rgba(61,189,105,.35)}
.cb svg{width:15px;height:15px;stroke:#0b2a16;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* featured glass cards */
.fc{position:relative;flex:0 0 240px;height:260px;border-radius:26px;overflow:hidden;cursor:pointer;box-shadow:0 16px 28px -10px rgba(20,30,90,.5);background:#222;color:#fff}
.fc>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fo{position:absolute;top:10px;left:10px;font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:9px;background:#22c55e;color:#06260f;display:flex;align-items:center;gap:6px;box-shadow:0 0 14px rgba(34,197,94,.6)}
.fo i{width:6px;height:6px;border-radius:50%;background:#06260f;animation:pu 1.4s infinite}
@keyframes pu{50%{opacity:.25}}
.fg{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-radius:20px;background:rgba(18,20,38,.4);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.22)}
.fg>div{min-width:0}
.fg b{display:block;font-size:14px;font-weight:800;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fg small{font-size:11px;opacity:.8}
.fb{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,#5b95ff,#2f6fed);display:grid;place-items:center;flex-shrink:0;box-shadow:0 8px 18px rgba(47,111,237,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.fb svg{width:20px;height:20px;fill:#fff}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1 id="ttl">پادکست‌ها</h1><div class="pills"><i class="on" data-s="p"></i><i data-s="q"></i></div></div>
    <div style="display:flex;gap:10px"><button class="sbtn" id="tg" aria-label="تم">🌙</button><button class="sbtn" id="sbtn" aria-label="جستجو"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg></button></div>
  </div>
  <div class="search" id="sbox"><input id="sin" placeholder="جستجو..."></div>

  <div class="panel on" id="pp">
    <div class="hero" id="hero"></div>
    <div class="sec"><h2>رایگان‌ها</h2><a onclick="document.getElementById('plist').scrollIntoView({behavior:'smooth'})">Radio VIP ‹</a></div>
    <div class="h-scroll" id="newList"></div>
    <div class="sec" id="plistH"><h2>Radio VIP 👑</h2></div>
    <div class="h-scroll" id="vipRow"></div>
    <div id="plist"></div>
    <div class="sec"><h2>برگزیده‌ها 🔥</h2></div><div class="h-scroll fr"></div>
    <div class="sec"><h2>کل دسته‌بندی</h2></div><div class="cats"></div>
  </div>

  <div class="panel" id="pq">
    <div class="sec" style="margin-top:26px"><h2>پاسخ به سوالات ذهنی شما</h2></div>
    <div class="h-scroll" id="qRow"></div>
    <div id="qlist"></div>
    <div class="sec"><h2>برگزیده‌ها 🔥</h2></div><div class="h-scroll fr"></div>
    <div class="sec"><h2>کل دسته‌بندی</h2></div><div class="cats"></div>
  </div>
</div>

<div class="mini" id="mini">
  <div class="eq"><i></i><i></i><i></i></div>
  <img id="mImg" alt=""><div class="ph" id="mPh" style="display:none">🧠</div>
  <div class="t"><b id="mT"></b><small id="mS"></small></div>
  <button class="mb" data-a="prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
  <button class="mb pl" data-a="toggle"><svg viewBox="0 0 24 24" class="pi"><path d="M8 5v14l11-7z"/></svg></button>
  <button class="mb" data-a="next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6v12h2V6z"/></svg></button>
</div>

<div class="sheet" id="sheet"><div class="in" id="in">
  <div class="top">
    <div><h1>پخش</h1><div class="pills"><i></i><i class="on"></i></div></div>
    <button class="sbtn" style="background:var(--bg);box-shadow:none" id="close" aria-label="بستن"><svg viewBox="0 0 24 24" style="stroke:var(--ink)"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
  <div class="stage"><div class="vin"></div><img class="cv" id="cv" alt=""><img class="nx" id="nx" alt=""></div>
  <div class="qbox" id="qbox"></div>
  <div class="meta">
    <div><h2 id="nT"></h2><small id="nS"></small></div>

/* wave progress */
let W=300,pr=0;
const wy=x=>22+10*Math.sin(x/W*Math.PI*2.4+.4)*(1-.35*x/W);
function drawWave(){
  W=$('wave').clientWidth||300;let d='';
  for(let x=0;x<=W;x+=4)d+=(x?'L':'M')+x+' '+wy(x).toFixed(1);
  $('w0').setAttribute('d',d);$('w1').setAttribute('d',d);setProg(pr);
}
function setProg(p){
  pr=Math.max(0,Math.min(1,p));const x=pr*W;
  $('wr').setAttribute('width',x);$('wd').style.left=x+'px';$('wd').style.top=wy(x)+'px';
}
function seekAt(e){
  const r=$('wave').getBoundingClientRect(),p=(e.clientX-r.left)/r.width;
  setProg(p);if(au.duration)au.currentTime=pr*au.duration;
}
let drag=false;
$('wave').onpointerdown=e=>{drag=true;$('wave').setPointerCapture(e.pointerId);seekAt(e)};
$('wave').onpointermove=e=>{if(drag)seekAt(e)};
$('wave').onpointerup=()=>drag=false;
addEventListener('resize',drawWave);

  const h=$('hero'),fr=P.filter(p=>p.f);HN=fr.length+1;
  h.innerHTML=fr.map((p,k)=>`<div class="sl"><img class="bg" src="${p.c}" alt=""><div class="shade"></div><div class="sc"><div class="tx"><span class="bdg">🎁 رایگان</span><h3>${p.e}</h3><small>${p.t}</small><button class="hp" onclick="event.stopPropagation();play('p',${P.indexOf(p)})"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>پخش کن</button></div><div class="cvw"><i class="vn"></i><img src="${p.c}" alt=""></div></div></div>`).join('')
  +`<div class="sl vp"><div class="shade"></div><div class="sc"><div class="tx"><span class="bdg">👑 اشتراکی</span><h3>Radio VIP</h3><small>همه پادکست‌ها و پاسخ‌ها با کد اشتراک</small><button class="hp" onclick="event.stopPropagation();openPop()">ورود با کد اشتراک</button></div><div class="cvw crown">👑</div></div></div>`
  +`<div class="hd">${'<i></i>'.repeat(HN)}</div>`;
  let sx=0,dn=false;
  h.onpointerdown=e=>{dn=true;sx=e.clientX;clearInterval(ht)};
  h.onpointerup=h.onpointercancel=e=>{if(!dn)return;dn=false;const d=e.clientX-sx;if(Math.abs(d)>40)go(hc+(d<0?1:-1));auto()};
  go(0);auto();
}
function go(n){
  hc=(n+HN)%HN;const m=Math.floor(HN/2);
  document.querySelectorAll('#hero .sl').forEach((s,k)=>{const o=((k-hc+HN+m)%HN)-m;s.style.transform=`translateX(${o*100}%)`;s.style.opacity=Math.abs(o)>1?0:1;s.style.zIndex=o===0?2:1});
  document.querySelectorAll('#hero .hd i').forEach((d,k)=>d.classList.toggle('on',k===hc));
}
function auto(){clearInterval(ht);ht=setInterval(()=>go(hc+1),4500)}
buildHero();
render();drawWave();
</script>
</body>
</html>
