<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanLife | پادکست‌های آگاهی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&family=League+Spartan:wght@800&display=swap');

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        
        body { 
            margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(135deg, #00c4cc, #7d2ae8, #00c4cc);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            background-attachment: fixed; padding: 20px 15px; color: white;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* گوی و برند */
        .orb { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, #a2d2ff 100%); animation: pulse 3s infinite ease-in-out; border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 0 15px rgba(162, 210, 255, 0.5); }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }
        .brand { font-family: 'League Spartan', sans-serif; font-size: 1.8rem; font-weight: 800; margin: 10px 0 30px; }

        /* پلیر اصلی شیشه‌ای */
        .main-player {
            width: 100%; max-width: 450px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(30px);
            border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.3); padding: 25px;
            display: flex; flex-direction: column; align-items: center; position: sticky; top: 10px; z-index: 10;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); margin-bottom: 30px;
        }

        .now-playing-img { width: 80px; height: 80px; border-radius: 20px; background: rgba(255,255,255,0.1); margin-bottom: 15px; object-fit: cover; border: 1px solid rgba(255,255,255,0.2); }
        .track-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 5px; }
        .track-sub { font-size: 0.8rem; opacity: 0.7; margin-bottom: 20px; }

        .progress-area { width: 100%; margin-bottom: 20px; }
        .bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; position: relative; cursor: pointer; }
        .fill { width: 45%; height: 100%; background: #fff; border-radius: 10px; box-shadow: 0 0 10px #fff; }

        .player-controls { display: flex; align-items: center; gap: 30px; }
        .play-circle { width: 60px; height: 60px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* لیست پادکست‌ها */
        .podcast-list { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 12px; }
        .podcast-item {
            display: flex; align-items: center; gap: 15px; padding: 15px;
            background: rgba(255, 255, 255, 0.08); border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer;
        }
        .podcast-item:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.02); }
        .item-img { width: 55px; height: 55px; border-radius: 12px; background: rgba(255,255,255,0.1); }
        .item-info { flex: 1; text-align: right; }
        .item-info h4 { margin: 0; font-size: 14px; }
        .item-info p { margin: 5px 0 0; font-size: 11px; opacity: 0.6; }
        
        .back-home { position: absolute; top: 25px; right: 20px; text-decoration: none; color: white; font-size: 12px; background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 10px; }
    </style>
</head>
<body>

    <a href="index.html" class="back-home">← برگشت</a>
    
    <div class="orb"></div>
    <h1 class="brand">PlanLife</h1>

    <div class="main-player">
        <div class="now-playing-img"></div>
        <div class="track-title" id="currentTitle">انتخاب پادکست</div>
        <div class="track-sub">پادکست‌های تحول ذهنی</div>

        <div class="progress-area">
            <div class="bar"><div class="fill"></div></div>
            <div style="display:flex; justify-content:space-between; font-size:10px; margin-top:8px;">
                <span>4:50</span>
                <span>1:24</span>
            </div>
        </div>

        <div class="player-controls">
            <svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            <div class="play-circle">
                <svg width="30" height="30" fill="#7d2ae8" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M16 18h2V6h-2M7 6v12l8.5-6z"/></svg>
        </div>
    </div>

    <div class="podcast-list">
        <div class="podcast-item" onclick="selectTrack('قدرت کلمات', 'قسمت اول')">
            <div class="item-img"></div>
            <div class="item-info">
                <h4>قسمت اول: قدرت کلمات</h4>
                <p>زمان: ۱۲ دقیقه | صوتی</p>
            </div>
            <svg width="20" height="20" fill="white" opacity="0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>

        <div class="podcast-item" onclick="selectTrack('فرکانس جذب', 'قسمت دوم')">
            <div class="item-img"></div>
            <div class="item-info">
                <h4>قسمت دوم: فرکانس جذب</h4>
                <p>زمان: ۱۵ دقیقه | صوتی</p>
            </div>
            <svg width="20" height="20" fill="white" opacity="0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>

        <div class="podcast-item" onclick="selectTrack('آرامش درون', 'قسمت سوم')">
            <div class="item-img"></div>
            <div class="item-info">
                <h4>قسمت سوم: آرامش درون</h4>
                <p>زمان: ۱۰ دقیقه | صوتی</p>
            </div>
            <svg width="20" height="20" fill="white" opacity="0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
        
        </div>

    <script>
        function selectTrack(title, sub) {
            document.getElementById('currentTitle').innerText = title;
            // در اینجا می‌توانید کد پخش موزیک واقعی را هم اضافه کنید
            console.log("Playing: " + title);
        }
    </script>
</body>
</html>
