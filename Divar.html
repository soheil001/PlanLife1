<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دیوار / اجاره</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --divar-red: #a62626;
            --divar-red-hover: #801e1e;
            --bg-gray: #f5f5f5;
            --border-color: #e0e0e0;
            --text-dark: #242424;
            --text-muted: #707070;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.06);
            --card-hover-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: #fcfcfc; color: var(--text-dark); direction: rtl; }

        header { background: #fff; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .logo-box { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .logo-badge { background-color: var(--divar-red); color: #fff; font-weight: 900; font-size: 20px; padding: 2px 10px; border-radius: 6px; }
        .logo-title { font-size: 18px; font-weight: 700; }

        .search-bar { position: relative; flex-grow: 1; max-width: 500px; }
        .search-bar input { width: 100%; padding: 10px 40px 10px 16px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--bg-gray); font-size: 14px; outline: none; }
        .search-bar i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .btn { padding: 9px 18px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background-color: var(--divar-red); color: white; }
        .btn-primary:hover { background-color: var(--divar-red-hover); }
        .btn-outline { background-color: transparent; color: var(--text-dark); border: 1px solid var(--border-color); }

        .main-container { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
        .categories-wrapper { margin-bottom: 24px; overflow-x: auto; white-space: nowrap; padding-bottom: 8px; }
        .category-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; margin-left: 8px; background-color: #fff; border: 1px solid var(--border-color); border-radius: 20px; font-size: 14px; cursor: pointer; }
        .category-pill.active { border-color: var(--divar-red); color: var(--divar-red); background-color: rgba(166, 38, 38, 0.04); }

        /* UNIFORM CARDS */
        .ads-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
        .ad-card { background: #fff; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; transition: 0.2s; cursor: pointer; display: flex; flex-direction: column; height: 380px; }
        .ad-card:hover { transform: translateY(-3px); box-shadow: var(--card-hover-shadow); }
        .ad-image-wrapper { width: 100%; height: 200px; background-color: #eee; position: relative; flex-shrink: 0; }
        .ad-image-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .ad-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.65); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 4px; }
        .ad-body { padding: 14px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .ad-title { font-size: 15px; font-weight: 700; height: 42px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .ad-price-row { display: flex; justify-content: space-between; font-size: 13px; margin-top: 4px; }
        .ad-footer { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border-color); display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }

        /* FORM */
        .form-section { display: none; background: #fff; border: 1px solid var(--border-color); border-radius: 12px; max-width: 750px; margin: 0 auto; padding: 30px; }
        .form-section.active { display: block; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .form-control { width: 100%; padding: 11px 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        /* MODAL */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: #fff; border-radius: 12px; max-width: 650px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; position: relative; }
        .close-modal { position: absolute; top: 16px; left: 16px; font-size: 20px; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #f0f0f0; }
        .modal-img-container { width: 100%; height: 300px; border-radius: 8px; overflow: hidden; margin-bottom: 16px; background-color: #eee; }
        .modal-img-container img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo-box" onclick="showSection('home')">
                <span class="logo-badge">دیوار</span>
                <span class="logo-title">اجاره</span>
            </div>
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="جستجو در تمام آگهی‌ها..." oninput="filterAds()">
            </div>
            <div>
                <button class="btn btn-outline" onclick="showSection('home')"><i class="fa-solid fa-house"></i> آگهی‌ها</button>
                <button class="btn btn-primary" onclick="showSection('add')"><i class="fa-solid fa-plus"></i> ثبت آگهی اجاره</button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- HOME SECTION -->
        <div id="homeSection">
            <div class="categories-wrapper">
                <div class="category-pill active" onclick="filterCategory('all', this)"><i class="fa-solid fa-border-all"></i> همه</div>
                <div class="category-pill" onclick="filterCategory('ساختمانی', this)"><i class="fa-solid fa-trowel-bricks"></i> وسایل ساختمانی</div>
                <div class="category-pill" onclick="filterCategory('دوربین', this)"><i class="fa-solid fa-camera"></i> دوربین</div>
                <div class="category-pill" onclick="filterCategory('ماشین', this)"><i class="fa-solid fa-car"></i> ماشین</div>
                <div class="category-pill" onclick="filterCategory('ویلا', this)"><i class="fa-solid fa-house-chimney"></i> ویلا</div>
                <div class="category-pill" onclick="filterCategory('تالار', this)"><i class="fa-solid fa-champagne-glasses"></i> تالار</div>
                <div class="category-pill" onclick="filterCategory('کامپیوتر', this)"><i class="fa-solid fa-laptop"></i> کامپیوتر</div>
                <div class="category-pill" onclick="filterCategory('میکروفون', this)"><i class="fa-solid fa-microphone-lines"></i> میکروفون</div>
            </div>
            <div class="ads-grid" id="adsGrid"></div>
        </div>

        <!-- NEW AD FORM -->
        <div id="addSection" class="form-section">
            <h2 style="margin-bottom: 20px;">ثبت آگهی جدید اجاره</h2>
            <form id="newAdForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label>عنوان آگهی *</label>
                    <input type="text" id="title" class="form-control" required placeholder="مثال: اجاره هیلتی 15 کیلویی">
                </div>
                <div class="row-2">
                    <div class="form-group">
                        <label>دسته‌بندی *</label>
                        <select id="category" class="form-control" required>
                            <option value="ساختمانی">وسایل ساختمانی</option>
                            <option value="دوربین">دوربین</option>
                            <option value="ماشین">ماشین</option>
                            <option value="ویلا">ویلا</option>
                            <option value="تالار">تالار</option>
                            <option value="کامپیوتر">کامپیوتر</option>
                            <option value="میکروفون">میکروفون</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>شهر / محله *</label>
                        <input type="text" id="location" class="form-control" required placeholder="مثال: تهران، مرزداران">
                    </div>
                </div>
                <div class="row-2">
                    <div class="form-group">
                        <label>اجاره روزانه (تومان) *</label>
                        <input type="number" id="dailyPrice" class="form-control" required placeholder="500000">
                    </div>
                    <div class="form-group">
                        <label>ودیعه / ضمانت (تومان)</label>
                        <input type="number" id="deposit" class="form-control" placeholder="2000000">
                    </div>
                </div>
                <!-- ساده‌ترین حالت انتخاب تصویر -->
                <div class="form-group">
                    <label>عکس آگهی *</label>
                    <input type="file" id="imageFile" class="form-control" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>مدارک مورد نیاز جهت ضمانت</label>
                    <input type="text" id="guarantee" class="form-control" placeholder="کارت ملی + سفته">
                </div>
                <div class="form-group">
                    <label>توضیحات</label>
                    <textarea id="description" class="form-control" style="height: 90px;"></textarea>
                </div>
                <div class="row-2">
                    <div class="form-group">
                        <label>شماره تماس *</label>
                        <input type="tel" id="phone" class="form-control" required placeholder="0912-------">
                    </div>
                    <div class="form-group" style="display:flex; align-items:flex-end;">
                        <button type="submit" id="submitBtn" class="btn btn-primary" style="width:100%; height:44px; justify-content:center;">
                            انتشار آگهی
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL -->
    <div id="adModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div class="modal-img-container">
                <img id="modalImg" src="">
            </div>
            <h2 id="modalTitle" style="font-size: 18px; margin-bottom: 12px;"></h2>
            <div style="background: var(--bg-gray); padding: 14px; border-radius: 8px; margin-bottom: 16px;">
                <div style="display:flex; justify-content:space-between; margin-bottom: 8px;">
                    <span>اجاره روزانه:</span>
                    <strong id="modalPrice" style="color:var(--divar-red)"></strong>
                </div>
                <div style="display:flex; justify-content:space-between;">
                    <span>ودیعه:</span>
                    <strong id="modalDeposit"></strong>
                </div>
            </div>
            <p id="modalGuarantee" style="font-size: 13px; color: #555; margin-bottom: 12px;"></p>
            <p id="modalDesc" style="font-size: 13px; color: #444; margin-bottom: 20px;"></p>
            <a id="modalPhoneLink" class="btn btn-primary" style="width:100%; justify-content:center;">
                <i class="fa-solid fa-phone"></i> <span id="modalPhone"></span>
            </a>
        </div>
    </div>

    <script>
        // لینک اختصاصی اسکریپت گوگل درایو خود را اینجا قرار دهید:
        const GOOGLE_SCRIPT_URL = "لینک_اسکریپت_گوگل_درایو_شما";

        let adsList = [
            {
                id: 1,
                title: 'اجاره چکش تخریب (هیلتی) ۱۵ کیلویی',
                category: 'ساختمانی',
                location: 'تهران، مرزداران',
                dailyPrice: 350000,
                deposit: 3000000,
                guarantee: 'کارت ملی + سفته',
                description: 'کاملا سالم و آماده به‌کار',
                phone: '09121111111',
                image: 'https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=500&q=80',
                time: '۱۰ دقیقه پیش'
            }
        ];

        let currentCategory = 'all';

        function formatMoney(amount) {
            return new Intl.NumberFormat('fa-IR').format(amount) + ' تومان';
        }

        function renderAds(data) {
            const grid = document.getElementById('adsGrid');
            grid.innerHTML = '';
            data.forEach(ad => {
                const card = document.createElement('div');
                card.className = 'ad-card';
                card.onclick = () => openModal(ad);
                card.innerHTML = `
                    <div class="ad-image-wrapper">
                        <img src="${ad.image}" alt="${ad.title}">
                        <span class="ad-badge">${ad.category}</span>
                    </div>
                    <div class="ad-body">
                        <h3 class="ad-title">${ad.title}</h3>
                        <div>
                            <div class="ad-price-row">
                                <span style="color:var(--text-muted);">روزانه:</span>
                                <span style="color:var(--divar-red); font-weight:bold;">${formatMoney(ad.dailyPrice)}</span>
                            </div>
                        </div>
                        <div class="ad-footer">
                            <span><i class="fa-solid fa-location-dot"></i> ${ad.location}</span>
                            <span>${ad.time}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function showSection(section) {
            document.getElementById('homeSection').style.display = section === 'home' ? 'block' : 'none';
            document.getElementById('addSection').classList.toggle('active', section === 'add');
        }

        function filterAds() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = adsList.filter(ad => 
                (currentCategory === 'all' || ad.category === currentCategory) &&
                (ad.title.toLowerCase().includes(q) || ad.location.toLowerCase().includes(q))
            );
            renderAds(filtered);
        }

        function filterCategory(cat, el) {
            currentCategory = cat;
            document.querySelectorAll('.category-pill').forEach(e => e.classList.remove('active'));
            el.classList.add('active');
            filterAds();
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const fileInput = document.getElementById('imageFile');
            const file = fileInput.files[0];

            if (!file) return alert('لطفا یک تصویر انتخاب کنید.');

            submitBtn.innerText = 'در حال آپلود تصویر در درایو...';
            submitBtn.disabled = true;

            try {
                // تبدیل فایل به Base64
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async function () {
                    const base64Data = reader.result.split(',')[1];
                    
                    // ارسال به گوگل درایو
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            base64: base64Data,
                            type: file.type,
                            name: file.name
                        })
                    });

                    const resData = await response.json();

                    if (resData.result === 'success') {
                        const newAd = {
                            id: Date.now(),
                            title: document.getElementById('title').value,
                            category: document.getElementById('category').value,
                            location: document.getElementById('location').value,
                            dailyPrice: parseInt(document.getElementById('dailyPrice').value),
                            deposit: parseInt(document.getElementById('deposit').value) || 0,
                            guarantee: document.getElementById('guarantee').value || 'توافقی',
                            description: document.getElementById('description').value,
                            phone: document.getElementById('phone').value,
                            image: resData.url, // آدرس مستقیم عکس در گوگل درایو
                            time: 'لحظاتی پیش'
                        };

                        adsList.unshift(newAd);
                        document.getElementById('newAdForm').reset();
                        showSection('home');
                        filterAds();
                        alert('آگهی با موفقیت ثبت و تصویر در گوگل درایو شما ذخیره شد.');
                    } else {
                        alert('خطا در آپلود عکس: ' + resData.message);
                    }

                    submitBtn.innerText = 'انتشار آگهی';
                    submitBtn.disabled = false;
                };
            } catch (err) {
                alert('خطا در ارتباط با سرور.');
                submitBtn.innerText = 'انتشار آگهی';
                submitBtn.disabled = false;
            }
        }

        function openModal(ad) {
            document.getElementById('modalImg').src = ad.image;
            document.getElementById('modalTitle').innerText = ad.title;
            document.getElementById('modalPrice').innerText = formatMoney(ad.dailyPrice);
            document.getElementById('modalDeposit').innerText = ad.deposit ? formatMoney(ad.deposit) : 'توافقی';
            document.getElementById('modalGuarantee').innerText = 'ضمانت: ' + ad.guarantee;
            document.getElementById('modalDesc').innerText = ad.description;
            document.getElementById('modalPhone').innerText = ad.phone;
            document.getElementById('modalPhoneLink').href = `tel:${ad.phone}`;
            document.getElementById('adModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('adModal').classList.remove('active');
        }

        renderAds(adsList);
    </script>
</body>
</html>
