async function sbRpc(functionName, body) {
  const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${functionName}`, {
    method: 'POST',
    headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json'},

    console.error('Supabase RPC Error:', errorText);
    throw new Error(errorText || 'خطا در ارتباط با سرور');

}

function toPersian(n) { return String(n).replace(/\d/g, d=>'۰۱۲۳۴۵۶۷۸۹'[d]); }
const LETTERS = ['A','B','C','D'];
const card = document.getElementById('main-card');

function shuffleArray(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function buildShuffled() {
  return shuffleArray(QUESTIONS_BANK).map(q=>{
    const ct=q.options[q.correct];
    const opts=shuffleArray(q.options);
    return {...q, options:opts, correct:opts.indexOf(ct)};
  });
}
function transition(fn) {
  card.classList.add('slide-exit');
  setTimeout(()=>{
    card.classList.remove('slide-exit'); fn();
    card.classList.add('slide-enter');
    setTimeout(()=>card.classList.remove('slide-enter'),380);
  },200);
}
function animateCounter(el,from,to,dur,fmt){
  const s=performance.now();
  function f(n){const p=Math.min((n-s)/dur,1),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(f);}
  requestAnimationFrame(f);
}

async function submitCodeForm() {
  const input = document.getElementById('f-phone');
  const button = document.getElementById('get-code-submit');
  const errorBox = document.getElementById('code-form-error');
  if (!input) return;

  let phone = input.value.trim()
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/\D/g, '');

  if (phone.startsWith('0')) phone = phone.substring(1);

  if (!/^9\d{9}$/.test(phone)) {
    errorBox.textContent = 'لطفاً شماره تلفن معتبر خود را وارد کنید.';
    errorBox.style.display = 'block';
    input.classList.add('field-error');
    return;
  }

  errorBox.style.display = 'none';
  input.classList.remove('field-error');
  button.disabled = true;
  button.style.opacity = '0.6';
  button.textContent = 'در حال بررسی...';

  try {
    const result = await sbRpc('get_exam_subscription_code', {p_phone: phone});
    console.log('Supabase get code result:', result);

    if (result && result.success === true && result.code) {
      document.getElementById('modal-icon').textContent = '🎉';
      document.getElementById('modal-title').textContent = 'کد اشتراک شما';
      document.getElementById('modal-subtitle').textContent = 'این کد برای شماره تلفن شما اختصاص داده شده است.';
      document.getElementById('modal-body').innerHTML = `
        <div class="code-reveal-box">
          <div class="code-reveal-label">✦ کد اختصاصی آزمون</div>
          <div class="code-reveal-number">${result.code}</div>
          <div class="code-reveal-msg">این کد را ذخیره کنید.<br>برای ورود به آزمون از همین کد استفاده کنید.</div>
        </div>
        <button class="modal-btn-submit" onclick="closeModal()" style="margin-top:20px;width:100%">متوجه شدم ✓</button>
      `;
    } else {
      errorBox.textContent = (result && result.message) || 'برای این شماره اشتراک فعالی پیدا نشد.';
      errorBox.style.display = 'block';
      button.disabled = false;
      button.style.opacity = '1';
      button.textContent = 'دریافت کد ←';
    }
  } catch (error) {
    console.error('Get exam code error:', error);
    errorBox.textContent = 'ارتباط با سرور برقرار نشد. لطفاً چند لحظه بعد دوباره تلاش کنید.';
    errorBox.style.display = 'block';
    button.disabled = false;
    button.style.opacity = '1';
    button.textContent = 'دریافت کد ←';
  }
}

async function checkCode(){
  const i=document.getElementById('code-field');
  const e=document.getElementById('error-msg');
  if(!i)return;

  let val=i.value.trim()
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/\D/g,'');
  i.value=val;

  if(!/^\d{4}$/.test(val)){
    i.classList.add('error');
    if(e){
      e.querySelector('span:last-child').textContent='کد باید یک عدد ۴ رقمی باشد.';
      e.classList.add('visible');
    }
    setTimeout(()=>i.classList.remove('error'),400);
    return;
  }

  i.disabled=true;

  try {
    const result=await sbRpc('verify_exam_subscription_code',{p_code:val});
    console.log('Supabase verify result:',result);

    if(result && result.success===true){
      i.classList.add('success');
      setTimeout(()=>{state.screen='start';transition(renderStart);},400);
    } else {
      i.disabled=false;
      i.classList.add('error');
      if(e){
        e.querySelector('span:last-child').textContent='کد وارد شده معتبر نیست.';
        e.classList.add('visible');
      }
      setTimeout(()=>i.classList.remove('error'),400);
    }
  } catch(err) {
    console.error('Verify code error:',err);
    i.disabled=false;
    i.classList.add('error');
    if(e){
      e.querySelector('span:last-child').textContent='خطا در ارتباط با سرور. دوباره تلاش کنید.';
      e.classList.add('visible');
    }
    setTimeout(()=>i.classList.remove('error'),400);
  }
}

function renderQuestion(){
  const q=state.shuffled[state.currentQ];
  const total=state.shuffled.length;
  const progress=Math.round((state.currentQ/total)*100);
  const answered=state.answers[state.currentQ];

  card.innerHTML=`
    <div class="brand" style="margin-bottom:18px">
      <div class="brand-icon" style="width:32px;height:32px;font-size:15px;border-radius:8px">🇬🇧</div>

    </div>
    <div class="progress-wrap">
      <div class="progress-meta">
        <span class="step-label">سوال ${toPersian(state.currentQ+1)} از ${toPersian(total)}</span>
        <span>${toPersian(progress)}٪ تکمیل شده</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${progress}%"></div></div>
    </div>
    <div class="q-badge">✦ ${q.badge}</div>
    <div class="q-text">${q.text}</div>
    <div class="options" id="options-list">
      ${q.options.map((opt,i)=>{
        let cls='';
        if(answered!==undefined){
          if(i===q.correct)cls='correct';
          else if(i===answered&&answered!==q.correct)cls='wrong';
        }
        const icon=cls==='correct'?'✓':cls==='wrong'?'✕':'';
        const disabled=answered!==undefined?'pointer-events:none':'';
        return `<div class="option ${cls}" onclick="selectAnswer(${i})" style="${disabled}">
          <div class="opt-letter">${LETTERS[i]}</div>
          <div class="opt-text">${opt}</div>
          <div class="opt-icon">${icon}</div>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:10px;margin-top:22px;align-items:center">
      ${state.currentQ>0?`<button class="btn-ghost" onclick="prevQ()">→ قبلی</button>`:''}
      <button class="btn-primary" id="next-btn" style="margin-top:0;${answered===undefined?'opacity:.4;cursor:not-allowed':''}"
        onclick="nextQ()" ${answered===undefined?'disabled':''}>
        ${state.currentQ===total-1?'مشاهده نتیجه ✓':'سوال بعدی ←'}
      </button>
    </div>
  `;
}

function selectAnswer(idx){
  if(state.answers[state.currentQ]!==undefined)return;
  const q=state.shuffled[state.currentQ];
  state.answers[state.currentQ]=idx;
  if(idx===q.correct)state.score++;
  document.querySelectorAll('.option').forEach((el,i)=>{
    if(i===q.correct){el.classList.add('correct');el.querySelector('.opt-icon').textContent='✓';}
    else if(i===idx&&idx!==q.correct){el.classList.add('wrong');el.querySelector('.opt-icon').textContent='✕';}
    el.style.pointerEvents='none';
  });
  const btn=document.getElementById('next-btn');
  if(btn){btn.disabled=false;btn.style.opacity='1';btn.style.cursor='pointer';}
}
function nextQ(){
  if(state.answers[state.currentQ]===undefined)return;
  if(state.currentQ<state.shuffled.length-1){state.currentQ++;transition(renderQuestion);}
  else{state.screen='result';transition(renderResult);}
}
function prevQ(){if(state.currentQ>0){state.currentQ--;transition(renderQuestion);}}

      <div class="result-message-title">🚀 در مسیر درست هستید!</div>
      <div class="result-message-text">
        آفرین! آشنایی خوبی با مفاهیم پایه دارید و این پایه‌ای محکم برای رشد بیشتر است.
        با تمرین منظم و تمرکز بیشتر بر گرامر و گفتگوهای ساده روزمره،
        به زودی به سطح مقدماتی خواهید رسید.
        <br><br>
        ادامه دهید، موفقیت نزدیک است! ⭐
      </div>
    `;
  } else {
    emoji='🏆';
    levelTitle='سطح مقدماتی خوب';
    scoreColor='#34D399';
    pctBadgeClass='background:rgba(16,185,129,0.15);border:1.5px solid rgba(16,185,129,0.4);color:#6EE7B7;';
    message=`
      <div class="result-message-title">🎉 عالی بودید!</div>
      <div class="result-message-text">
        تبریک! شما درک بسیار خوبی از مفاهیم پایه زبان انگلیسی دارید.
        آمادگی کاملی برای ورود به سطوح بالاتر و مکالمات روزمره دارید.
        همین مسیر را ادامه دهید و به سراغ موضوعات پیشرفته‌تری مثل زمان‌های مختلف،
        مکالمه و مهارت شنیداری بروید.
        <br><br>
        به شما افتخار می‌کنیم! 🌟
      </div>
    `;
  }

  card.innerHTML=`
    <div class="result-wrap">
      <span class="result-big-emoji">${emoji}</span>
      <div class="result-level-label">نتیجه ارزیابی شما</div>
      <div class="result-level-title">${levelTitle}</div>
      <div class="result-divider"></div>
      <div class="result-score-display">
        <div class="result-score-big" style="color:${scoreColor}" id="score-num">۰</div>
        <div class="result-score-total">از ${toPersian(total)} سوال</div>
        <div style="margin-top:14px">
          <span class="result-pct-badge" style="${pctBadgeClass}" id="pct-badge">۰٪ موفقیت</span>
        </div>
      </div>
      <div class="result-stats-row">
        <div class="result-stat-mini">
          <div class="result-stat-mini-icon">✅</div>
          <div class="result-stat-mini-num" style="color:#6EE7B7">${toPersian(state.score)}</div>
          <div class="result-stat-mini-label">صحیح</div>
        </div>
        <div class="result-stat-mini">
          <div class="result-stat-mini-icon">❌</div>
          <div class="result-stat-mini-num" style="color:#FCA5A5">${toPersian(total-state.score)}</div>
          <div class="result-stat-mini-label">اشتباه</div>
        </div>
        <div class="result-stat-mini">
          <div class="result-stat-mini-icon">📊</div>
          <div class="result-stat-mini-num" style="color:${scoreColor}">${toPersian(pct)}٪</div>
          <div class="result-stat-mini-label">درصد</div>
        </div>
      </div>
      <div class="result-message-box">${message}</div>
    </div>
  `;

  setTimeout(()=>{
    animateCounter(document.getElementById('score-num'),0,state.score,1100,v=>toPersian(Math.round(v)));
    animateCounter(document.getElementById('pct-badge'),0,pct,1200,v=>toPersian(Math.round(v))+'٪ موفقیت');
  },100);
}

// ── Flow ───────────────────────────────────────
function startQuiz(){
  state.shuffled=buildShuffled();
  Object.assign(state,{screen:'quiz',currentQ:0,answers:[],score:0});
  transition(renderQuestion);
}

renderAccess();
</script>
</body>
</html>
