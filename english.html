<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>آزمون ارزیابی مقدماتی زبان انگلیسی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy:#0D1B2A; --blue:#1B5E9F; --blue-mid:#2070C8;
    --sky:#3A9AD9; --white:#FFFFFF; --green:#10B981;
    --orange:#F59E0B; --red:#EF4444;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-behavior: smooth; height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    font-family: 'Vazirmatn', sans-serif;
    background: linear-gradient(140deg, #0D1B2A 0%, #12304F 45%, #0A2540 70%, #0D1B2A 100%);
    min-height: 100vh; color: #fff; direction: rtl; overflow-x: hidden; height: 100%;
  }
  .bg-orb { position:fixed; border-radius:50%; filter:blur(90px); opacity:.15; pointer-events:none; z-index:0; }
  .orb1 { width:520px; height:520px; background:#2176AE; top:-180px; right:-120px; }
  .orb2 { width:420px; height:420px; background:#0D4F8A; bottom:-120px; left:-120px; }
  .orb3 { width:280px; height:280px; background:#0E7FC0; top:50%; left:50%; transform:translate(-50%,-50%); }

  #app { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 16px; }

  .card {
    background:rgba(255,255,255,0.06); backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px);
    border:1px solid rgba(255,255,255,0.13); border-radius:28px; width:100%; max-width:640px;
    padding:40px 38px; box-shadow:0 36px 90px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.09);
    animation:fadeUp .45s cubic-bezier(.22,.87,.33,1) both;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }

  /* Brand */
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:28px; }
  .brand-icon {
    width:42px; height:42px; background:linear-gradient(135deg,#2176AE,#0D4F8A);
    border-radius:11px; display:flex; align-items:center; justify-content:center;
    font-size:20px; box-shadow:0 4px 16px rgba(33,118,174,0.45); flex-shrink:0;
  }
  .brand-name { font-size:13px; font-weight:600; color:rgba(255,255,255,0.65); line-height:1.4; }
  .brand-name span { display:block; color:#fff; font-size:15px; font-weight:700; }

  /* Progress */
  .progress-wrap { margin-bottom:32px; }
  .progress-meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:12px; color:rgba(255,255,255,0.5); font-weight:500; }
  .step-label { color:rgba(255,255,255,0.85); font-weight:600; font-size:13px; }
  .progress-bar-bg { height:6px; background:rgba(255,255,255,0.09); border-radius:99px; overflow:hidden; }
  .progress-bar-fill { height:100%; background:linear-gradient(90deg,#56B4E9,#2176AE); border-radius:99px; transition:width .6s cubic-bezier(.22,.87,.33,1); box-shadow:0 0 10px rgba(86,180,233,0.55); }

  /* Question */
  .q-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(33,118,174,0.18); border:1px solid rgba(33,118,174,0.35); border-radius:99px; padding:4px 14px; font-size:11px; font-weight:600; color:#90CAF9; margin-bottom:14px; }
  .q-text { font-size:18px; font-weight:700; color:#fff; line-height:1.65; margin-bottom:26px; }
  .q-text .en { font-family: 'Vazirmatn', sans-serif; font-weight:800; color:#90CAF9; letter-spacing:.02em; direction:ltr; display:inline-block; }

  /* Options */
  .options { display:flex; flex-direction:column; gap:10px; }
  .option {
    background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,255,255,0.11); border-radius:16px;
    padding:14px 18px; cursor:pointer; display:flex; align-items:center; gap:14px;
    transition:all .22s cubic-bezier(.22,.87,.33,1); position:relative; overflow:hidden;
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  .option::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(33,118,174,0.18),rgba(13,79,138,0.12)); opacity:0; transition:opacity .22s; border-radius:inherit; }
  .option:hover { border-color:rgba(86,180,233,0.5); transform:translateX(-3px); }
  .option:hover::before { opacity:1; }
  .option:active { transform:scale(0.98); }
  .option.selected { border-color:#2176AE; background:rgba(33,118,174,0.18); box-shadow:0 0 0 1px rgba(33,118,174,0.4),0 8px 24px rgba(33,118,174,0.2); }
  .option.selected::before { opacity:1; }
  .option.correct { border-color:#10B981!important; background:rgba(16,185,129,0.15)!important; box-shadow:0 0 0 1px rgba(16,185,129,0.4),0 8px 24px rgba(16,185,129,0.2)!important; }
  .option.wrong   { border-color:#EF4444!important; background:rgba(239,68,68,0.15)!important; box-shadow:0 0 0 1px rgba(239,68,68,0.4)!important; }
  .opt-letter { width:30px; height:30px; border:2px solid rgba(255,255,255,0.2); border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:rgba(255,255,255,0.45); transition:all .2s; position:relative; z-index:1; }
  .option.selected .opt-letter { border-color:#2176AE; background:#2176AE; color:#fff; }
  .option.correct  .opt-letter { border-color:#10B981; background:#10B981; color:#fff; }
  .option.wrong    .opt-letter { border-color:#EF4444; background:#EF4444; color:#fff; }
  .opt-text { font-size:15px; font-weight:500; color:rgba(255,255,255,0.85); line-height:1.5; flex:1; position:relative; z-index:1; }
  .option.selected .opt-text { color:#fff; font-weight:600; }
  .option.correct  .opt-text { color:#6EE7B7; font-weight:600; }
  .option.wrong    .opt-text { color:#FCA5A5; }
  .opt-icon { font-size:17px; position:relative; z-index:1; opacity:0; transition:opacity .2s; min-width:20px; text-align:center; }
  .option.correct .opt-icon { opacity:1; }
  .option.wrong   .opt-icon { opacity:1; }

  /* Buttons */
  .btn-primary { width:100%; padding:16px 24px; background:linear-gradient(135deg,#2176AE,#0D4F8A); color:#fff; border:none; border-radius:14px; font-family:'Vazirmatn',sans-serif; font-size:16px; font-weight:700; cursor:pointer; margin-top:24px; box-shadow:0 8px 28px rgba(33,118,174,0.4); transition:all .22s; }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 12px 36px rgba(33,118,174,0.5); }
  .btn-primary:active { transform:scale(0.98); }
  .btn-primary:disabled { opacity:.4; cursor:not-allowed; transform:none; }
  .btn-ghost { background:rgba(255,255,255,0.07); border:1.5px solid rgba(255,255,255,0.14); color:rgba(255,255,255,0.7); border-radius:12px; padding:12px 22px; font-family:'Vazirmatn',sans-serif; font-size:14px; font-weight:600; cursor:pointer; transition:all .2s; }
  .btn-ghost:hover { background:rgba(255,255,255,0.12); color:#fff; }

  /* Access screen */
  .access-icon { width:72px; height:72px; background:linear-gradient(135deg,#2176AE,#0D4F8A); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:34px; margin:0 auto 24px auto; box-shadow:0 12px 40px rgba(33,118,174,0.45); }
  .access-title { font-size:22px; font-weight:800; color:#fff; text-align:center; margin-bottom:8px; }
  .access-subtitle { font-size:14px; color:rgba(255,255,255,0.5); text-align:center; margin-bottom:32px; line-height:1.7; }
  .code-input-label { font-size:12px; font-weight:600; color:rgba(255,255,255,0.45); margin-bottom:8px; display:block; }
  .code-input { width:100%; padding:16px 20px; background:rgba(255,255,255,0.07); border:1.5px solid rgba(255,255,255,0.14); border-radius:14px; color:#fff; font-family:'Vazirmatn',sans-serif; font-size:18px; font-weight:700; text-align:center; letter-spacing:.1em; outline:none; transition:all .22s; direction:ltr; }
  .code-input::placeholder { color:rgba(255,255,255,0.18); font-size:14px; font-weight:400; }
  .code-input:focus { border-color:rgba(86,180,233,0.6); background:rgba(33,118,174,0.1); box-shadow:0 0 0 3px rgba(33,118,174,0.15); }
  .code-input.error { border-color:rgba(239,68,68,0.6)!important; background:rgba(239,68,68,0.08)!important; animation:shake .35s both; }
  .code-input.success { border-color:rgba(16,185,129,0.6)!important; background:rgba(16,185,129,0.08)!important; }
  @keyframes shake { 10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)} 30%,50%,70%{transform:translateX(-4px)} 40%,60%{transform:translateX(4px)} }
  .error-msg { display:flex; align-items:center; gap:6px; color:#FCA5A5; font-size:13px; font-weight:600; margin-top:10px; opacity:0; transition:opacity .2s; }
  .error-msg.visible { opacity:1; }
  .access-footer { text-align:center; margin-top:20px; font-size:12px; color:rgba(255,255,255,0.22); }

  /* Start screen */
  .start-icon { width:72px; height:72px; background:linear-gradient(135deg,#2176AE,#0D4F8A); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:34px; margin-bottom:24px; box-shadow:0 12px 40px rgba(33,118,174,0.45); }
  .start-title { font-size:24px; font-weight:800; color:#fff; line-height:1.45; margin-bottom:14px; }
  .start-desc { font-size:14px; color:rgba(255,255,255,0.6); line-height:1.8; margin-bottom:26px; }
  .start-stats { display:flex; gap:10px; margin-bottom:28px; flex-wrap:wrap; }
  .stat-chip { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.11); border-radius:99px; padding:7px 16px; font-size:12px; font-weight:600; color:rgba(255,255,255,0.65); display:flex; align-items:center; gap:6px; }
  .stat-chip span { color:#90CAF9; }
  .stat-chip-warn { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); border-radius:99px; padding:7px 16px; font-size:12px; font-weight:700; color:#FCA5A5; display:flex; align-items:center; gap:6px; }

  /* Result screen */
  .result-header { background:linear-gradient(135deg,rgba(33,118,174,0.18),rgba(13,79,138,0.12)); border:1px solid rgba(33,118,174,0.3); border-radius:20px; padding:26px 22px; margin-bottom:18px; text-align:center; }
  .result-emoji { font-size:52px; margin-bottom:10px; }
  .result-level-label { font-size:12px; color:#90CAF9; font-weight:600; margin-bottom:4px; letter-spacing:.05em; }
  .result-level { font-size:24px; font-weight:800; color:#fff; margin-bottom:8px; }
  .result-desc { font-size:13px; color:rgba(255,255,255,0.6); line-height:1.75; }

  /* Score circle */
  .circle-wrap { display:flex; align-items:center; justify-content:center; gap:28px; margin-bottom:18px; flex-wrap:wrap; }
  .circle-svg { transform:rotate(-90deg); }
  .circle-bg { fill:none; stroke:rgba(255,255,255,0.07); stroke-width:8; }
  .circle-fill { fill:none; stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset 1.4s cubic-bezier(.22,.87,.33,1); }

  /* Score stats */
  .score-stats { display:flex; gap:10px; margin-bottom:18px; }
  .score-stat { flex:1; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09); border-radius:14px; padding:14px; text-align:center; }
  .score-stat-icon { font-size:20px; margin-bottom:6px; }
  .score-stat-label { font-size:11px; color:rgba(255,255,255,0.38); font-weight:600; margin-bottom:4px; }
  .score-stat-value { font-size:15px; font-weight:800; color:#fff; }

  /* Level badges */
  .level-badge { display:inline-flex; align-items:center; gap:8px; border-radius:99px; padding:8px 22px; font-size:14px; font-weight:700; margin-bottom:18px; }
  .level-begin { background:rgba(239,68,68,0.13); border:1px solid rgba(239,68,68,0.3); color:#FCA5A5; }
  .level-mid   { background:rgba(245,158,11,0.13); border:1px solid rgba(245,158,11,0.3); color:#FCD34D; }
  .level-good  { background:rgba(16,185,129,0.13); border:1px solid rgba(16,185,129,0.3); color:#6EE7B7; }

  /* CTA */
  .cta-buttons { display:flex; flex-direction:column; gap:10px; margin-top:4px; }
  .btn-cta-pdf { width:100%; padding:16px 24px; background:linear-gradient(135deg,#7C3AED,#4F46E5); color:#fff; border:none; border-radius:14px; font-family:'Vazirmatn',sans-serif; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 8px 28px rgba(124,58,237,0.3); transition:all .22s; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-cta-pdf:hover { transform:translateY(-2px); box-shadow:0 12px 36px rgba(124,58,237,0.42); }
  .btn-cta-home { width:100%; padding:14px 24px; background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,255,255,0.14); color:rgba(255,255,255,0.75); border-radius:14px; font-family:'Vazirmatn',sans-serif; font-size:15px; font-weight:600; cursor:pointer; transition:all .22s; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-cta-home:hover { background:rgba(255,255,255,0.11); color:#fff; }

  /* Blocked */
  .blocked-icon { width:80px; height:80px; background:linear-gradient(135deg,#EF4444,#B91C1C); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:38px; margin:0 auto 24px auto; box-shadow:0 12px 40px rgba(239,68,68,0.38); }
  .blocked-title { font-size:22px; font-weight:800; color:#fff; text-align:center; margin-bottom:12px; }
  .blocked-desc { font-size:14px; color:rgba(255,255,255,0.5); text-align:center; line-height:1.8; margin-bottom:28px; }

  /* Transitions */
  .slide-exit { animation:slideExit .22s ease forwards; }
  .slide-enter { animation:slideEnter .35s cubic-bezier(.22,.87,.33,1) forwards; }
  @keyframes slideExit { to{opacity:0;transform:translateX(30px)} }
  @keyframes slideEnter { from{opacity:0;transform:translateX(-30px)} to{opacity:1;transform:translateX(0)} }

  /* PDF overlay */
  #pdf-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:9999; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(8px); }
  #pdf-overlay.hidden { display:none; }
  #pdf-frame-wrap { background:#0D1B2A; border-radius:14px; overflow:hidden; box-shadow:0 40px 100px rgba(0,0,0,0.65); width:min(680px, 96vw); }
  #pdf-toolbar { background:#1A2A3F; padding:12px 16px; display:flex; gap:10px; align-items:center; justify-content:flex-end; }
  .pdf-btn { padding:9px 18px; border:none; border-radius:8px; font-family:'Vazirmatn',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:all .2s; }
  .pdf-btn-print { background:linear-gradient(135deg,#7C3AED,#4F46E5); color:#fff; }
  .pdf-btn-close  { background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(255,255,255,0.18); }
  .pdf-btn-close:hover { background:rgba(255,255,255,0.16); }
  #pdf-content { padding:0; max-height:82vh; overflow-y:auto; direction:rtl; }

  @media (max-width:480px) {
    .card { padding:28px 18px; border-radius:22px; }
    .q-text { font-size:16px; }
    .opt-text { font-size:14px; }
    .start-title { font-size:20px; }
    .score-stats { flex-direction:column; }
  }
</style>
</head>
<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="bg-orb orb3"></div>

<div id="pdf-overlay" class="hidden">
  <div id="pdf-frame-wrap">
    <div id="pdf-toolbar">
      <button class="pdf-btn pdf-btn-close" onclick="closePdfOverlay()">✕ بستن</button>
      <button class="pdf-btn pdf-btn-print" onclick="printPDF()">🖨️ دانلود / پرینت PDF</button>
    </div>
    <div id="pdf-content"></div>
  </div>
</div>

<div id="app">
  <div class="card" id="main-card"></div>
</div>

<script>
// ═══════════════════ تنظیمات ═══════════════════
const VALID_CODE = '252525';
const ONE_TIME_PER_DEVICE = true;
const STORAGE_KEY = 'eng_quiz_v1';

// ═══════════════════ اثر انگشت دستگاه ═══════════════════
function getFingerprint() {
  const nav = window.navigator;
  const raw = [nav.userAgent, nav.language, screen.width, screen.height,
    screen.colorDepth, nav.hardwareConcurrency||'',
    Intl.DateTimeFormat().resolvedOptions().timeZone||'', nav.platform||''].join('|');
  let h = 0;
  for (let i = 0; i < raw.length; i++) { h = ((h << 5) - h) + raw.charCodeAt(i); h |= 0; }
  return Math.abs(h).toString(36);
}
function hasAlreadyTaken() {
  if (!ONE_TIME_PER_DEVICE) return false;
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')[getFingerprint()]===true; } catch(e){return false;}
}
function markAsTaken() {
  if (!ONE_TIME_PER_DEVICE) return;
  try { const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); s[getFingerprint()]=true; localStorage.setItem(STORAGE_KEY,JSON.stringify(s)); } catch(e){}
}

// ═══════════════════ STATE ═══════════════════
const state = { screen:'access', currentQ:0, answers:[], score:0, shuffled:[] };

// ═══════════════════ بانک ۶۰ سوال ═══════════════════
const QUESTIONS_BANK = [
  // 1 – Vocabulary
  { badge:'معنی کلمه', text:'معنی کلمه "<span class="en">Book</span>" چیست؟', options:['خانه','کتاب','ماشین','آب'], correct:1 },
  // 2 – to be
  { badge:'گرامر - to be', text:'جای خالی را پر کنید: I ___ a student.', options:['am','is','are','be'], correct:0 },
  // 3 – Color
  { badge:'رنگ‌ها', text:'رنگ آسمان چیست؟', options:['Red','Green','Blue','Yellow'], correct:2 },
  // 4 – to be
  { badge:'گرامر - to be', text:'جای خالی را پر کنید: She ___ my sister.', options:['am','is','are','be'], correct:1 },
  // 5 – Greeting
  { badge:'احوالپرسی', text:'کدام کلمه به معنی «سلام» است؟', options:['Goodbye','Hello','Please','Thank you'], correct:1 },
  // 6 – Numbers
  { badge:'اعداد', text:'عدد "<span class="en">Five</span>" به فارسی چند است؟', options:['سه','چهار','پنج','شش'], correct:2 },
  // 7 – Family
  { badge:'اعضای خانواده', text:'معنی کلمه "<span class="en">Mother</span>" چیست؟', options:['پدر','مادر','خواهر','برادر'], correct:1 },
  // 8 – a/an
  { badge:'گرامر - a/an', text:'کدام جمله درست است؟', options:['a apple','an apple','an book','a orange'], correct:1 },
  // 9 – Pronoun
  { badge:'ضمایر', text:'در جمله "<span class="en">___ are friends.</span>" کدام ضمیر صحیح است؟', options:['I','He','We','She'], correct:2 },
  // 10 – Animals
  { badge:'حیوانات', text:'معنی کلمه "<span class="en">Cat</span>" چیست؟', options:['سگ','گربه','پرنده','ماهی'], correct:1 },
  // 11 – Days of week
  { badge:'روزهای هفته', text:'اولین روز هفته در انگلیسی کدام است؟', options:['Tuesday','Monday','Sunday','Wednesday'], correct:1 },
  // 12 – Food
  { badge:'غذاها', text:'معنی کلمه "<span class="en">Water</span>" چیست؟', options:['غذا','نان','آب','شیر'], correct:2 },
  // 13 – Plural
  { badge:'جمع اسم', text:'جمع کلمه "<span class="en">Dog</span>" چیست؟', options:['Dogies','Dogges','Dogs','Dogen'], correct:2 },
  // 14 – Negative
  { badge:'جمله منفی', text:'جمله "<span class="en">I am not a teacher.</span>" به چه معناست؟', options:['من معلم هستم','من معلم نیستم','تو معلم هستی','او معلم نیست'], correct:1 },
  // 15 – Colors vocab
  { badge:'رنگ‌ها', text:'معنی کلمه "<span class="en">Red</span>" چیست؟', options:['آبی','سبز','قرمز','زرد'], correct:2 },
  // 16 – can
  { badge:'گرامر - can', text:'جمله "<span class="en">I can swim.</span>" یعنی چه؟', options:['من نمی‌توانم شنا کنم','من شنا می‌کنم','من می‌توانم شنا کنم','آیا می‌توانی شنا کنی؟'], correct:2 },
  // 17 – this/that
  { badge:'this / that', text:'وقتی چیزی دور از ماست از کدام کلمه استفاده می‌کنیم؟', options:['This','These','That','Those'], correct:2 },
  // 18 – Preposition
  { badge:'حروف اضافه', text:'کتاب روی میز است. کدام جمله درست است؟', options:['The book is in the table','The book is on the table','The book is under the table','The book is at the table'], correct:1 },
  // 19 – have/has

// ═══════════════════ کمکی‌ها ═══════════════════
function toPersian(n) { return String(n).replace(/\d/g, d=>'۰۱۲۳۴۵۶۷۸۹'[d]); }
const LETTERS = ['A','B','C','D'];
const card = document.getElementById('main-card');

function shuffleArray(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function buildShuffled() {
  return shuffleArray(QUESTIONS_BANK).map(q=>{
    const ct=q.options[q.correct];
    const opts=shuffleArray(q.options);
    return {...q, options:opts, correct:opts.indexOf(ct)};
  });
}
function transition(fn) {
  card.classList.add('slide-exit');
  setTimeout(()=>{
    card.classList.remove('slide-exit'); fn();
    card.classList.add('slide-enter');
    setTimeout(()=>card.classList.remove('slide-enter'),380);
  },200);
}
function animateCounter(el,from,to,dur,fmt){
  const s=performance.now();
  function f(n){const p=Math.min((n-s)/dur,1),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(f);}
  requestAnimationFrame(f);
}

function clearError(){
  const i=document.getElementById('code-field'),e=document.getElementById('error-msg');
  if(i)i.classList.remove('error');if(e)e.classList.remove('visible');
}
function checkCode(){
  const i=document.getElementById('code-field'),e=document.getElementById('error-msg');
  if(!i)return;
  if(i.value.trim().toLowerCase()===VALID_CODE.toLowerCase()){
    i.classList.add('success');
    setTimeout(()=>{state.screen='start';transition(renderStart);},400);
  } else {
    i.classList.add('error');if(e)e.classList.add('visible');
    setTimeout(()=>i.classList.remove('error'),400);
  }
}

// ═══════════════════ QUESTION ═══════════════════
function renderQuestion(){
  const q=state.shuffled[state.currentQ];
  const total=state.shuffled.length;
  const progress=Math.round((state.currentQ/total)*100);
  const answered=state.answers[state.currentQ];

  card.innerHTML=`
    <div class="brand" style="margin-bottom:18px">
      <div class="brand-icon" style="width:32px;height:32px;font-size:15px;border-radius:8px">🇬🇧</div>
      <div class="brand-name" style="font-size:11px"><span style="font-size:13px">آزمون زبان انگلیسی</span>سطح مقدماتی</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-meta">
        <span class="step-label">سوال ${toPersian(state.currentQ+1)} از ${toPersian(total)}</span>
        <span>${toPersian(progress)}٪ تکمیل شده</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${progress}%"></div></div>
    </div>
    <div class="q-badge">✦ ${q.badge}</div>
    <div class="q-text">${q.text}</div>
    <div class="options" id="options-list">
      ${q.options.map((opt,i)=>{
        let cls='';
        if(answered!==undefined){
          if(i===q.correct)cls='correct';
          else if(i===answered&&answered!==q.correct)cls='wrong';
        }
        const icon=cls==='correct'?'✓':cls==='wrong'?'✕':'';
        const disabled=answered!==undefined?'pointer-events:none':'';
        return `<div class="option ${cls}" onclick="selectAnswer(${i})" style="${disabled}">
          <div class="opt-letter">${LETTERS[i]}</div>
          <div class="opt-text">${opt}</div>
          <div class="opt-icon">${icon}</div>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:10px;margin-top:22px;align-items:center">
      ${state.currentQ>0?`<button class="btn-ghost" onclick="prevQ()">→ قبلی</button>`:''}
      <button class="btn-primary" id="next-btn" style="margin-top:0;${answered===undefined?'opacity:.4;cursor:not-allowed':''}"
        onclick="nextQ()" ${answered===undefined?'disabled':''}>
        ${state.currentQ===total-1?'مشاهده نتیجه ✓':'سوال بعدی ←'}
      </button>
    </div>
  `;
}

function selectAnswer(idx){
  if(state.answers[state.currentQ]!==undefined)return;
  const q=state.shuffled[state.currentQ];
  state.answers[state.currentQ]=idx;
  if(idx===q.correct)state.score++;
  document.querySelectorAll('.option').forEach((el,i)=>{
    if(i===q.correct){el.classList.add('correct');el.querySelector('.opt-icon').textContent='✓';}
    else if(i===idx&&idx!==q.correct){el.classList.add('wrong');el.querySelector('.opt-icon').textContent='✕';}
    el.style.pointerEvents='none';
  });
  const btn=document.getElementById('next-btn');
  if(btn){btn.disabled=false;btn.style.opacity='1';btn.style.cursor='pointer';}
}
function nextQ(){
  if(state.answers[state.currentQ]===undefined)return;
  if(state.currentQ<state.shuffled.length-1){state.currentQ++;transition(renderQuestion);}
  else{markAsTaken();state.screen='result';transition(renderResult);}
}
function prevQ(){if(state.currentQ>0){state.currentQ--;transition(renderQuestion);}}

      <div class="score-stat"><div class="score-stat-icon">✅</div><div class="score-stat-label">صحیح</div><div class="score-stat-value" style="color:#6EE7B7">${toPersian(state.score)}</div></div>
      <div class="score-stat"><div class="score-stat-icon">❌</div><div class="score-stat-label">اشتباه</div><div class="score-stat-value" style="color:#FCA5A5">${toPersian(total-state.score)}</div></div>
      <div class="score-stat"><div class="score-stat-icon">📊</div><div class="score-stat-label">درصد</div><div class="score-stat-value" style="color:${strokeColor}">${toPersian(pct)}٪</div></div>
    </div>
    <div class="cta-buttons">
      <button class="btn-cta-pdf" onclick="showPDF()">📄 دریافت نتیجه به صورت PDF</button>
    </div>
  `;

  const fillEl=document.getElementById('circle-fill');
  setTimeout(()=>{
    if(fillEl)fillEl.style.strokeDashoffset=offset;
    animateCounter(document.getElementById('pct-num'),0,pct,1300,v=>toPersian(Math.round(v))+'٪');
    animateCounter(document.getElementById('score-num'),0,state.score,1100,v=>toPersian(Math.round(v)));
  },80);
}

// ═══════════════════ PDF ═══════════════════
function showPDF(){
  const total=state.shuffled.length;
  const pct=Math.round((state.score/total)*100);
  let levelLabel,levelDesc,levelColor,levelEmoji;
  if(pct<=40){levelLabel='سطح ابتدایی';levelEmoji='🌱';levelColor='#EF4444';levelDesc='تمرین بیشتری لازم دارید — پایه‌ها را محکم کنید!';}
  else if(pct<=70){levelLabel='سطح پیش‌مقدماتی';levelEmoji='📖';levelColor='#F59E0B';levelDesc='آشنایی خوبی دارید — با تمرین بیشتر رشد می‌کنید!';}
  else{levelLabel='سطح مقدماتی خوب';levelEmoji='🏆';levelColor='#10B981';levelDesc='عالی! آماده ورود به مباحث بالاتر هستید.';}

  const now=new Date();
  const dateFA=now.toLocaleDateString('fa-IR',{year:'numeric',month:'long',day:'numeric'});
  const html=`
    <div style="font-family:'Vazirmatn',sans-serif;direction:rtl;background:#0D1B2A;color:#fff;width:100%;padding:0;margin:0;">
      <div style="background:linear-gradient(135deg,#1B5E9F,#2070C8);padding:32px 40px;text-align:center;">
        <div style="font-size:26px;font-weight:900;color:#fff;margin-bottom:6px;">آزمون ارزیابی زبان انگلیسی</div>
        <div style="font-size:13px;color:rgba(255,255,255,0.7);margin-bottom:14px;">گزارش نتیجه — سطح مقدماتی</div>
        <div style="height:1px;background:rgba(255,255,255,0.2);margin:0 0 14px 0;"></div>
        <div style="font-size:12px;color:rgba(255,255,255,0.55);">📅 تاریخ: ${dateFA}</div>
      </div>
      <div style="padding:26px 30px 0 30px;">
        <div style="background:rgba(255,255,255,0.05);border:2px solid ${levelColor};border-radius:16px;padding:26px;display:flex;align-items:center;gap:24px;margin-bottom:18px;">
          <div style="text-align:center;min-width:100px;">
            <div style="font-size:52px;font-weight:900;color:${levelColor};line-height:1;">${state.score}</div>
            <div style="font-size:14px;color:rgba(255,255,255,0.35);font-weight:600;">از ${total}</div>
          </div>
          <div style="width:1px;background:${levelColor};opacity:.35;align-self:stretch;"></div>
          <div style="flex:1;">
            <div style="font-size:12px;color:rgba(255,255,255,0.45);font-weight:600;margin-bottom:6px;">نتیجه ارزیابی</div>
            <div style="font-size:22px;font-weight:900;color:${levelColor};margin-bottom:8px;">${levelEmoji} ${levelLabel}</div>
            <div style="display:inline-block;background:rgba(255,255,255,0.07);border-radius:99px;padding:5px 16px;font-size:20px;font-weight:800;color:#fff;margin-bottom:10px;">${pct}٪ موفقیت</div>
            <div style="font-size:13px;color:rgba(255,255,255,0.55);line-height:1.7;">${levelDesc}</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:18px;">
          <div style="background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);border-radius:12px;padding:14px;text-align:center;">
            <div style="font-size:20px;margin-bottom:4px;">✅</div>
            <div style="font-size:26px;font-weight:800;color:#10B981;">${state.score}</div>
            <div style="font-size:11px;color:rgba(255,255,255,0.4);font-weight:600;margin-top:4px;">پاسخ صحیح</div>
          </div>
          <div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:12px;padding:14px;text-align:center;">
            <div style="font-size:20px;margin-bottom:4px;">❌</div>
            <div style="font-size:26px;font-weight:800;color:#EF4444;">${total-state.score}</div>
            <div style="font-size:11px;color:rgba(255,255,255,0.4);font-weight:600;margin-top:4px;">پاسخ اشتباه</div>
          </div>
          <div style="background:rgba(33,118,174,0.1);border:1px solid rgba(33,118,174,0.3);border-radius:12px;padding:14px;text-align:center;">
            <div style="font-size:20px;margin-bottom:4px;">📊</div>
            <div style="font-size:26px;font-weight:800;color:#90CAF9;">${total}</div>
            <div style="font-size:11px;color:rgba(255,255,255,0.4);font-weight:600;margin-top:4px;">کل سوالات</div>
          </div>
        </div>
        <div style="background:rgba(33,118,174,0.08);border:1px solid rgba(33,118,174,0.25);border-radius:12px;padding:14px 18px;margin-bottom:22px;text-align:center;">
          <div style="font-size:12px;color:#90CAF9;font-weight:700;margin-bottom:6px;">📋 تحلیل نتیجه</div>
          <div style="font-size:13px;color:rgba(255,255,255,0.65);line-height:1.75;">${levelDesc}</div>
        </div>
      </div>
      <div style="background:linear-gradient(135deg,#1B5E9F,#2070C8);padding:14px 30px;text-align:center;">
        <div style="font-size:11px;color:rgba(255,255,255,0.55);">این گزارش توسط سیستم ارزیابی زبان انگلیسی به صورت خودکار تولید شده است.</div>
      </div>
    </div>
  `;
  document.getElementById('pdf-content').innerHTML=html;
  document.getElementById('pdf-overlay').classList.remove('hidden');
  document.body.style.overflow='hidden';
}
function closePdfOverlay(){
  document.getElementById('pdf-overlay').classList.add('hidden');
  document.body.style.overflow='';
}
function printPDF(){
  const content=document.getElementById('pdf-content').innerHTML;
  const w=window.open('','_blank','width=700,height=900');
  w.document.write(`<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><title>نتیجه آزمون زبان انگلیسی</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'Vazirmatn',sans-serif;background:#0D1B2A;direction:rtl;}@page{size:A4;margin:0;}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}</style>
  </head><body>${content}</body></html>`);
  w.document.close();
  w.onload=()=>setTimeout(()=>{w.focus();w.print();},600);
}

// ═══════════════════ FLOW ═══════════════════
function startQuiz(){
  state.shuffled=buildShuffled();
  Object.assign(state,{screen:'quiz',currentQ:0,answers:[],score:0});
  transition(renderQuestion);
}
document.getElementById('pdf-overlay').addEventListener('click',function(e){if(e.target===this)closePdfOverlay();});

renderAccess();
</script>
</body>
</html>
