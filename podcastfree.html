<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#eef2f6">
<title>PlanLife | پادکست های رایگان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #e6efe9;
  --bg2: #dde9f6;
  --shell: #ffffff;
  --ink: #12141c;
  --muted: #6b7280;
  --hair: #eef0f3;
  --blue: #2f6fed;
  --blue-ink: #1e4fc9;
  --lime: #d8f24c;
  --lime-ink: #4b5a10;
  --panel: #12141c;
  --panel2: #1b1f2a;
  --green: #3ddc84;
  --red: #ff5470;
  --radius-xl: 30px;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --shadow-card: 0 10px 30px rgba(18, 20, 28, 0.06);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  font-family: 'Vazirmatn', sans-serif;
  color: var(--ink);
}

body {
  background: linear-gradient(160deg, var(--bg1), var(--bg2));
  min-height: 100vh;
  padding: 22px;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  display: block;
  max-width: 100%;
}

/* ===== SHELL ===== */
.shell {
  max-width: 1280px;
  margin: 0 auto;
  background: var(--shell);
  border-radius: var(--radius-xl);
  box-shadow: 0 30px 80px rgba(18, 20, 28, 0.12);
  padding: 18px 22px 22px;
  min-height: calc(100vh - 44px);
}

/* ===== TOPBAR ===== */
.topbar {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 6px 4px 18px;
  margin-bottom: 20px;
  border-bottom: 1px solid #f0f0f0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.brand img {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  object-fit: cover;
}

.brand span {
  font-weight: 800;
  font-size: 17px;
  letter-spacing: 0.2px;
}

.back-btn {
  display: none;
  background: none;
  border: none;
  font-size: 26px;
  cursor: pointer;
  color: var(--ink);
  padding: 6px;
  margin-right: 10px;
}

.topbar-title {
  flex: 1;
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
}

.sort-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
  border: 1px solid #e4e7ec;
  padding: 8px 13px;
  border-radius: 999px;
  cursor: pointer;
  background: #fff;
  transition: 0.2s;
}

.sort-btn:hover {
  border-color: var(--blue);
  color: var(--blue);
}

/* ===== MAIN LAYOUT ===== */
.layout {
  display: flex;
  gap: 20px;
  align-items: flex-start;
}

.sidebar {
  width: 76px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 14px 0;
  position: sticky;
  top: 14px;
}

.side-btn {
  width: 50px;
  height: 50px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--muted);
  transition: 0.2s;
}

.side-btn.active {
  background: var(--blue);
  color: #fff;
  box-shadow: 0 8px 18px rgba(47, 111, 237, 0.35);
}

.side-btn:not(.active):hover {
  background: var(--hair);
}

.side-gap {
  flex: 1;
}

.side-plus {
  width: 50px;
  height: 50px;
  border-radius: 16px;
  background: var(--lime);
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
  color: var(--lime-ink);
  font-size: 22px;
  font-weight: 700;
  transition: 0.2s;
}

.side-plus:hover {
  transform: scale(1.08);
}

.side-avatar {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid var(--hair);
  cursor: pointer;
  transition: 0.2s;
}

.side-avatar:hover {
  border-color: var(--blue);
}

.side-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ===== MAIN COLUMN ===== */
.main-col {
  flex: 1 1 0;
  min-width: 0;
}

/* ===== SECTION HEADER ===== */
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 4px 20px;
}

.section-head h2 {
  font-size: 24px;
  font-weight: 800;
}

.section-head .count {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
}

/* ===== CARDS GRID ===== */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-bottom: 40px;
}

.podcast-card {
  background: var(--shell);
  border: 1px solid #eef0f3;
  border-radius: var(--radius-md);
  padding: 14px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: 12px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}

.podcast-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 20px 50px rgba(18, 20, 28, 0.14);
  border-color: var(--blue);
}

.podcast-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(47, 111, 237, 0.08), transparent);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.podcast-card:hover::before {
  opacity: 1;
}

.card-thumb {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  aspect-ratio: 1 / 0.85;
  background: #eef0f3;
  cursor: pointer;
}

.card-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}

.podcast-card:hover .card-thumb img {
  transform: scale(1.06);
}

.card-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  background: rgba(18, 20, 28, 0.72);
  color: #fff;
  font-size: 9.5px;
  font-weight: 700;
  padding: 4px 9px;
  border-radius: 999px;
  z-index: 2;
}

.card-play-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(18, 20, 28, 0);
  opacity: 0;
  transition: all 0.3s;
  z-index: 3;
}

.podcast-card:hover .card-play-overlay {
  background: rgba(18, 20, 28, 0.45);
  opacity: 1;
}

.play-icon-btn {
  width: 56px;
  height: 56px;
  background: var(--lime);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(216, 242, 76, 0.4);
  transition: all 0.2s;
}

.play-icon-btn:hover {
  transform: scale(1.12);
  box-shadow: 0 12px 28px rgba(216, 242, 76, 0.55);
}

.play-icon-btn:active {
  transform: scale(0.95);
}

.play-icon-btn svg {
  width: 24px;
  height: 24px;
  fill: var(--lime-ink);
  margin-left: 2px;
}

.card-title {
  font-size: 14.5px;
  font-weight: 800;
  line-height: 1.3;
  color: var(--ink);
  margin: 0;
}

.card-subtitle {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--muted);
}

.card-meta-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ===== PLAYER MODAL ===== */
.player-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(18, 20, 28, 0.85);
  backdrop-filter: blur(8px);
  z-index: 900;
  display: none;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.4s ease;
}

.player-backdrop.active {
  display: flex;
  opacity: 1;
}

.player-modal {
  position: relative;
  background: var(--shell);
  border-radius: var(--radius-xl);
  width: 90%;
  max-width: 500px;
  max-height: 90vh;
  padding: 30px;
  box-shadow: 0 30px 80px rgba(18, 20, 28, 0.3);
  display: flex;
  flex-direction: column;
  gap: 20px;
  overflow-y: auto;
  animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes slideUp {
  from {
    transform: translateY(60px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.player-close {
  position: absolute;
  top: 16px;
  left: 16px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--hair);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: var(--ink);
  transition: 0.2s;
  z-index: 10;
}

.player-close:hover {
  background: var(--red);
  color: #fff;
}

.player-cover {
  width: 100%;
  aspect-ratio: 1;
  border-radius: var(--radius-lg);
  object-fit: cover;
  box-shadow: 0 15px 40px rgba(47, 111, 237, 0.25);
}

.player-info {
  text-align: center;
}

.player-info h3 {
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 6px;
  color: var(--ink);
}

.player-info p {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}

/* ===== AUDIO CONTROLS ===== */
.audio-controls {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.progress-bar-wrap {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.progress-container {
  width: 100%;
  height: 5px;
  background: var(--hair);
  border-radius: 999px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(to right, var(--blue), var(--lime));
  border-radius: 999px;
  width: 0%;
  box-shadow: 0 0 10px rgba(47, 111, 237, 0.5);
  transition: width 0.1s linear;
}

.time-display {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
}

.controls-buttons {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
}

.control-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--hair);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  transition: all 0.2s;
  font-size: 20px;
}

.control-btn:hover {
  background: var(--blue);
  color: #fff;
  transform: scale(1.1);
}

.control-btn:active {
  transform: scale(0.92);
}

.play-btn {
  width: 70px;
  height: 70px;
  background: linear-gradient(135deg, var(--blue), var(--lime));
  color: #fff;
  font-size: 28px;
  box-shadow: 0 10px 30px rgba(47, 111, 237, 0.35);
}

.play-btn:hover {
  background: linear-gradient(135deg, var(--blue-ink), #b8d608);
  box-shadow: 0 15px 40px rgba(47, 111, 237, 0.5);
}

/* ===== BOTTOM NAV (MOBILE) ===== */
.bottom-nav {
  display: none;
  position: fixed;
  bottom: 12px;
  left: 12px;
  right: 12px;
  height: 60px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(16px);
  border-radius: 22px;
  box-shadow: 0 12px 30px rgba(18, 20, 28, 0.18);
  padding: 8px 10px;
  z-index: 200;
  justify-content: space-around;
  align-items: center;
}

.bn-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  color: var(--muted);
  font-size: 9.5px;
  font-weight: 700;
  flex: 1;
  padding: 6px 0;
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
}

.bn-item.active {
  color: var(--blue);
  background: rgba(47, 111, 237, 0.08);
}

.bn-item svg {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  stroke-width: 1.8;
  fill: none;
}

.bn-item.active svg {
  fill: currentColor;
}

/* ===== AUDIO ELEMENT ===== */
audio {
  width: 100%;
  margin: 10px 0;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 1080px) {
  .cards-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 960px) {
  body {
    padding: 0;
  }

  .shell {
    border-radius: 0;
    min-height: 100vh;
    padding: 14px 14px 90px;
  }

  .layout {
    flex-direction: column;
    gap: 0;
  }

  .sidebar {
    display: none;
  }

  .topbar {
    margin-bottom: 14px;
  }

  .back-btn {
    display: block;
  }

  .topbar-title {
    font-size: 16px;
  }

  .sort-btn {
    font-size: 11px;
    padding: 7px 11px;
  }

  .cards-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  .podcast-card {
    padding: 10px;
    gap: 8px;
  }

  .card-title {
    font-size: 13px;
  }

  .card-subtitle {
    font-size: 11px;
  }

  .bottom-nav {
    display: flex;
  }

  .player-modal {
    width: 95%;
    max-width: 100%;
    max-height: 95vh;
    border-radius: 22px 22px 0 0;
    padding: 20px;
  }
}

@media (max-width: 480px) {
  .cards-grid {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .topbar {
    margin-bottom: 10px;
  }

  .section-head h2 {
    font-size: 20px;
  }

  .player-modal {
    padding: 16px;
  }

  .player-cover {
    border-radius: var(--radius-md);
  }

  .player-info h3 {
    font-size: 18px;
  }

  .play-btn {
    width: 60px;
    height: 60px;
    font-size: 24px;
  }

  .control-btn {
    width: 38px;
    height: 38px;
    font-size: 18px;
  }

  .bn-item {
    font-size: 8px;
  }

  .bn-item svg {
    width: 18px;
    height: 18px;
  }
}

/* ===== SMOOTH SCROLL ===== */
html {
  scroll-behavior: smooth;
}

/* ===== LOADING SKELETON ===== */
.skeleton {
  background: linear-gradient(
    90deg,
    var(--hair) 25%,
    rgba(233, 236, 239, 0.5) 50%,
    var(--hair) 75%
  );
  background-size: 200% 100%;
  animation: loading 1.5s infinite;
}

@keyframes loading {
  0% {
    background-position: 200% 0;
  }
  100% {
    background-position: -200% 0;
  }
}
</style>
</head>

<div class="shell">

  <!-- TOPBAR -->
  <div class="topbar">
    <button class="back-btn" onclick="goBack()">←</button>
    <div class="brand">
      <img src="http://fs3.centraldnserver.com/~planlife/pics/planlife.jpeg" alt="PlanLife">
      <span>PlanLife</span>
    </div>
    <div class="topbar-title">پادکست های رایگان</div>
    <button class="sort-btn" onclick="toggleSort()">
      <span>امروز ▾</span>
    </button>
  </div>

  <!-- MAIN LAYOUT -->
  <div class="layout">

    <!-- SIDEBAR (Desktop) -->
    <aside class="sidebar">
      <button class="side-btn active" title="پادکست‌ها" onclick="goToHome()">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
          <path d="M4 13.5C4 8.25 7.58 4 12 4C16.42 4 20 8.25 20 13.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><rect x="3" y="13" width="3.4" height="6" rx="1.6" fill="currentColor"/><rect x="17.6" y="13" width="3.4" height="6" rx="1.6" fill="currentColor"/>
        </svg>
      </button>
      <button class="side-btn" title="دوره‌ها" onclick="navigate('courses')">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
          <path d="M12 3L22 8L12 13L2 8L12 3Z" fill="currentColor"/><path d="M2 16L12 21L22 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="side-btn" title="کتابخانه" onclick="navigate('library')">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
          <path d="M4 5.5C4 4.7 4.7 4 5.5 4H11V19H5.5C4.7 19 4 18.3 4 17.5V5.5Z" fill="currentColor" fill-opacity=".95"/><path d="M13 4H18.5C19.3 4 20 4.7 20 5.5V17.5C20 18.3 19.3 19 18.5 19H13V4Z" fill="currentColor" fill-opacity=".55"/>
        </svg>
      </button>
      <div class="side-gap"></div>
      <button class="side-plus" title="پیشنهاد امروز" onclick="navigate('today')">+</button>
      <div class="side-avatar" onclick="navigate('profile')">
        <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779454914/IMG_0217_fnjv9i.jpg" alt="پروفایل">
      </div>
    </aside>

    <!-- MAIN COLUMN -->
    <main class="main-col">

      <!-- SECTION HEADER -->
      <div class="section-head">
        <div>
          <h2>پادکست های رایگان</h2>
          <span class="count" id="podcast-count">(بارگذاری...)</span>
        </div>
      </div>

      <!-- CARDS GRID -->
      <div class="cards-grid" id="podcastGrid">
        <!-- کارت‌ها به صورت دینامیکی اضافه می‌شوند -->
      </div>

    </main>

  </div>

</div>

<!-- PLAYER MODAL -->
<div class="player-backdrop" id="playerBackdrop" onclick="closePlayer(event)">
  <div class="player-modal" id="playerModal" onclick="event.stopPropagation()">
    <button class="player-close" onclick="closePlayer()">✕</button>
    
    <img class="player-cover" id="playerCover" src="" alt="کاور پادکست">
    
    <div class="player-info">
      <h3 id="playerTitle">عنوان پادکست</h3>
      <p id="playerSubtitle">PlanLife</p>
    </div>

    <div class="audio-controls">

          <div class="progress-bar" id="progressBar"></div>

        <div class="time-display">
          <span id="currentTime">0:00</span>
          <span id="totalTime">0:00</span>
        </div>
      </div>

      <div class="controls-buttons">
        <button class="control-btn" onclick="previousTrack()">⏮</button>

          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="currentColor"/>
          </svg>
        </button>
        <button class="control-btn play-btn" id="playBtn" onclick="togglePlay()">
          <svg id="playIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
        <button class="control-btn" onclick="seek(10)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z" fill="currentColor"/>
          </svg>
        </button>
        <button class="control-btn" onclick="nextTrack()">⏭</button>
      </div>
    </div>

    <audio id="audioPlayer" preload="metadata"></audio>

  </div>
</div>

<!-- BOTTOM NAV (Mobile) -->
<nav class="bottom-nav">
  <a class="bn-item active" href="#" onclick="event.preventDefault(); scrollToTop();">

/* ================================================
   STATE
   ================================================ */
let currentTrackIndex = -1;
let isPlaying = false;
const audio = document.getElementById('audioPlayer');
const playIcon = document.getElementById('playIcon');
const progressBar = document.getElementById('progressBar');
const progressContainer = document.getElementById('progressContainer');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');

/* ================================================
   UTILS
   ================================================ */
function toPersianNum(n) {
  return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}

function formatTime(seconds) {
  if (!seconds || !isFinite(seconds)) return '0:00';
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${secs.toString().padStart(2, '0')}`;
}

/* ================================================
   RENDER GRID
   ================================================ */
function renderGrid() {
  const grid = document.getElementById('podcastGrid');
  grid.innerHTML = podcastsData.map((podcast, index) => `
    <div class="podcast-card">
      <div class="card-thumb">
        <img src="${podcast.cover}" alt="${podcast.episode}" loading="lazy">
        <div class="card-play-overlay">
          <button class="play-icon-btn" onclick="playTrack(${index})">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>
        </div>
        ${podcast.isNew ? `<div class="card-badge">🔥 جدید</div>` : ''}
      </div>
      <div>
        <h3 class="card-title">${podcast.episode}</h3>
        <p class="card-subtitle">${podcast.title}</p>
        <div class="card-meta">
          <span class="card-meta-item">📂 ${podcast.category}</span>
          <span class="card-meta-item">⏱️ ${podcast.duration}</span>
        </div>
      </div>
    </div>
  `).join('');

  document.getElementById('podcast-count').textContent = `(${toPersianNum(podcastsData.length)} پادکست)`;
}

/* ================================================
   PLAYER FUNCTIONS
   ================================================ */
function playTrack(index) {
  currentTrackIndex = index;
  const track = podcastsData[index];
  
  // Update UI
  document.getElementById('playerTitle').textContent = track.episode;
  document.getElementById('playerSubtitle').textContent = track.title;
  document.getElementById('playerCover').src = track.cover;
  
  // Load and play audio
  audio.src = track.src;
  audio.play().catch(err => console.warn('Play failed:', err));
  
  // Show player
  document.getElementById('playerBackdrop').classList.add('active');
  isPlaying = true;
  updatePlayIcon();
}

function closePlayer(event) {
  if (event && event.target !== document.getElementById('playerBackdrop')) return;
  document.getElementById('playerBackdrop').classList.remove('active');
}

function togglePlay() {
  if (!audio.src) return;
  if (audio.paused) {
    audio.play().catch(err => console.warn('Play failed:', err));
  } else {
    audio.pause();
  }
  updatePlayIcon();
}

function updatePlayIcon() {
  const icon = audio.paused 
    ? '<path d="M8 5v14l11-7z"/>' 
    : '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  playIcon.innerHTML = icon;
}

function seek(seconds) {
  if (audio.duration) {
    audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + seconds));
  }
}

function previousTrack() {
  if (currentTrackIndex > 0) {
    playTrack(currentTrackIndex - 1);
  }
}

function nextTrack() {
  if (currentTrackIndex < podcastsData.length - 1) {
    playTrack(currentTrackIndex + 1);
  }
}

/* ================================================
   AUDIO EVENTS
   ================================================ */
audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    const percent = (audio.currentTime / audio.duration) * 100;
    progressBar.style.width = percent + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
    totalTimeEl.textContent = formatTime(audio.duration);
  }
});

audio.addEventListener('loadedmetadata', () => {
  totalTimeEl.textContent = formatTime(audio.duration);
});

audio.addEventListener('play', () => {
  isPlaying = true;
  updatePlayIcon();
});

audio.addEventListener('pause', () => {
  isPlaying = false;
  updatePlayIcon();
});

audio.addEventListener('ended', () => {
  nextTrack();
});

progressContainer.addEventListener('click', (e) => {
  if (!audio.duration) return;
  const rect = progressContainer.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  audio.currentTime = percent * audio.duration;
});

   ================================================ */
function goBack() {

}

function goToHome() {

  renderGrid();
  
  // Preload first image for faster rendering

// Handle keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('playerBackdrop').classList.contains('active')) return;
  
  switch(e.key) {
    case ' ':
      e.preventDefault();
      togglePlay();
      break;
    case 'ArrowRight':
      e.preventDefault();
      seek(10);
      break;
    case 'ArrowLeft':
      e.preventDefault();
      seek(-10);
      break;
    case 'ArrowUp':
      e.preventDefault();
      previousTrack();
      break;
    case 'ArrowDown':
      e.preventDefault();
      nextTrack();
      break;
  }
});
