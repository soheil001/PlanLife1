<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#e2e6eb">
<title>PlanLife - محتوای رایگان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&family=Playfair+Display:ital,wght@1,700&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
<style>
/* =============================================
   ROOT TOKENS — تم صفحه اصلی
   ============================================= */
:root {
  --bg-page:    #d8dde4;
  --shell:      #f4f5f7;
  --section:    #ffffff;
  --section-border: rgba(0,0,0,0.09);
  --section-shadow: 0 2px 12px rgba(0,0,0,0.07), 0 0 0 1.5px rgba(0,0,0,0.06);
  --ink:        #12141c;
  --muted:      #6b7280;
  --hair:       #eef0f3;
  --blue:       #2f6fed;
  --blue-ink:   #1e4fc9;
  --accent:     #ff9500;
  --accent-dk:  #cc7700;
  --radius-xl:  22px;
  --radius-lg:  18px;
  --radius-md:  14px;
  --radius-sm:  10px;
  --gap:        14px;
}

/* =============================================
   BASE
   ============================================= */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  font-family: 'Vazirmatn', sans-serif;
  background: var(--bg-page);
  color: var(--ink);
  min-height: 100dvh;
}

/* =============================================
   HEADER — سبک صفحه اصلی
   ============================================= */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--section);
  box-shadow: var(--section-shadow);
  border-radius: 0 0 var(--radius-xl) var(--radius-xl);
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0 20px; height: 60px;
  margin-bottom: var(--gap);
}
.header-back {
  display: flex; align-items: center; gap: 6px;
  background: var(--hair); border: 1.5px solid #e0e3e9;
  border-radius: 999px; padding: 7px 14px;
  font-size: 13px; font-weight: 700; color: var(--ink);
  cursor: pointer; text-decoration: none; transition: .15s;
  font-family: inherit;
}
.header-back:hover { background: #e4e7ec; }
.header-brand {
  display: flex; align-items: center; gap: 8px;
  font-weight: 800; font-size: 15px;
}
.header-brand img {
  width: 32px; height: 32px; border-radius: 9px; object-fit: cover;
}
.admin-badge {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,149,0,0.12); border: 1.5px solid rgba(255,149,0,0.4);
  border-radius: 999px; padding: 7px 14px; font-size: 13px;
  font-weight: 700; color: var(--accent); cursor: pointer; font-family: inherit;
  transition: .15s;
}
.admin-badge:hover { background: rgba(255,149,0,0.2); }

/* =============================================
   SHELL / LAYOUT
   ============================================= */
.shell { max-width: 900px; margin: 0 auto; padding: 0 14px 100px; }

/* =============================================
   PAGE TITLE
   ============================================= */
.page-title-wrap {
  background: var(--section);
  border-radius: var(--radius-xl);
  box-shadow: var(--section-shadow);
  padding: 20px 22px 18px;
  margin-bottom: var(--gap);
  display: flex; align-items: center; justify-content: space-between;
}
.page-title {
  font-size: 18px; font-weight: 900; color: var(--ink);
}
.page-title span {
  color: var(--accent);
}
.page-count {
  font-size: 12px; color: var(--muted); font-weight: 600;
  background: var(--hair); border-radius: 999px; padding: 5px 12px;
}

/* =============================================
   SECTION SELECTOR TABS
   ============================================= */
.section-tabs {
  background: var(--section);
  border-radius: var(--radius-xl);
  box-shadow: var(--section-shadow);
  padding: 10px 14px;
  margin-bottom: var(--gap);
  display: flex; gap: 8px; overflow-x: auto;
  scrollbar-width: none;
}
.section-tabs::-webkit-scrollbar { display: none; }
.stab {
  flex-shrink: 0; padding: 9px 18px; border-radius: 999px;
  background: var(--hair); border: 1.5px solid transparent;
  font-size: 13px; font-weight: 700; color: var(--muted);
  cursor: pointer; transition: .18s; white-space: nowrap;
  font-family: inherit;
}
.stab.active {
  background: var(--ink); color: #fff; border-color: var(--ink);
}
.stab:not(.active):hover { border-color: #dde0e5; background: #eaecf0; }

/* scroll indicator dots */
.scroll-indicator {
  display: flex; gap: 6px; align-items: center; justify-content: center;
  margin: 0 0 var(--gap);
}
.scroll-line {
  height: 3px; border-radius: 999px;
  background: rgba(0,0,0,0.12); transition: all 0.3s ease;
}
.scroll-line.active {
  background: var(--accent);
  box-shadow: 0 0 8px rgba(255,149,0,0.4);
}
.scroll-line-long  { width: 44px; }
.scroll-line-short { width: 22px; }

/* =============================================
   CONTENT PANELS
   ============================================= */
.content-panel { display: none; }
.content-panel.active { display: block; }

.panel-header {
  background: var(--section);
  border-radius: var(--radius-xl);
  box-shadow: var(--section-shadow);
  padding: 16px 20px;
  margin-bottom: var(--gap);
  display: flex; align-items: center; justify-content: space-between;
}
.panel-header h2 { font-size: 15px; font-weight: 800; }
.panel-header .sort {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 600; color: var(--muted);
  border: 1.5px solid #e0e3e9; padding: 7px 12px;
  border-radius: 999px; cursor: pointer; background: var(--hair);
}

/* =============================================
   GRIDS
   ============================================= */
.grid-2col {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  padding-bottom: 20px;
}

/* =============================================
   PODCAST CARD — تم روشن صفحه اصلی
   ============================================= */
.podcast-card {
  background: var(--section);
  border-radius: var(--radius-lg);
  box-shadow: var(--section-shadow);
  padding: 10px 10px 14px;
  text-align: center; cursor: pointer;
  transition: .22s cubic-bezier(.25,.8,.25,1);
  -webkit-tap-highlight-color: transparent;
  border: 1.5px solid transparent;
}
.podcast-card:hover {
  box-shadow: 0 10px 28px rgba(0,0,0,.13), 0 0 0 1.5px rgba(255,149,0,.3);
  transform: translateY(-3px);
}
.podcast-card:active { transform: scale(0.97); }

.podcast-card-img-wrap { position: relative; }
.podcast-card-img-wrap img {
  width: 100%; aspect-ratio: 1/1;
  border-radius: var(--radius-md);
  object-fit: cover; display: block;
}

/* نشان تعداد نظر */
.podcast-badge-wrap {
  position: absolute; top: 8px; right: 8px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(0,0,0,0.1);
  border-radius: 999px; padding: 4px 9px;
  display: flex; align-items: center; gap: 5px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}
.podcast-badge-wrap svg { width: 12px; height: 12px; fill: var(--accent); }
.podcast-badge-wrap span { font-size: 11.5px; font-weight: 700; color: var(--ink); }

/* نشان جدید */
.new-badge {
  position: absolute; top: 8px; left: 8px;
  background: var(--accent); color: #fff;
  font-size: 10.5px; font-weight: 900;
  padding: 3px 9px; border-radius: 999px;
  box-shadow: 0 2px 8px rgba(255,149,0,0.4);
  white-space: nowrap; pointer-events: none;
}

/* آمار پخش ادمین */
.admin-play-badge {
  position: absolute; bottom: 8px; left: 8px;
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(6px);
  border-radius: 999px; padding: 4px 9px;
  display: flex; align-items: center; gap: 5px;
  border: 1px solid rgba(61,220,132,0.4);
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.admin-play-badge svg { width: 12px; height: 12px; fill: #22c55e; }
.admin-play-badge span { font-size: 11px; font-weight: 800; color: #16a34a; }

.podcast-card-title {
  font-size: 13.5px; font-weight: 700;
  color: var(--ink); margin: 10px 0 4px;
  line-height: 1.4;
}
.podcast-card-cat {
  font-size: 11.5px; color: var(--muted); font-weight: 500;
  margin-bottom: 10px;
}

/* دکمه پخش — سبک صفحه اصلی */
.podcast-play-circle {
  width: 44px; height: 44px;
  background: var(--accent);
  border-radius: 50%; margin: 4px auto 0;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 16px rgba(255,149,0,0.35);
  transition: .15s;
}
.podcast-card:hover .podcast-play-circle {
  box-shadow: 0 8px 22px rgba(255,149,0,0.5);
  transform: scale(1.07);
}
.podcast-play-circle svg { width: 20px; height: 20px; fill: #fff; margin-left: -2px; }

/* =============================================
   QA CARD — تم روشن
   ============================================= */
.qa-card {
  background: var(--section);
  border-radius: var(--radius-lg);
  box-shadow: var(--section-shadow);
  padding: 10px 10px 12px;
  text-align: center; cursor: pointer;
  display: flex; flex-direction: column;
  position: relative;
  transition: .22s cubic-bezier(.25,.8,.25,1);
  -webkit-tap-highlight-color: transparent;
  border: 1.5px solid transparent;
}
.qa-card:hover {
  box-shadow: 0 10px 28px rgba(0,0,0,.13), 0 0 0 1.5px rgba(255,149,0,.3);
  transform: translateY(-3px);
}
.qa-card:active { transform: scale(0.97); }

/* تکست‌باکس سوال */
.card-question-box {
  width: 100%;
  background: var(--hair);
  border: 1.5px solid #e0e3e9;
  border-radius: var(--radius-md);
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
  position: relative; height: 110px; overflow: hidden; margin-bottom: 10px;
}
.card-question-box-bg {
  position: absolute; inset: 0; border-radius: var(--radius-md);
  pointer-events: none; z-index: 0;
}
.card-question-text-scroll {
  position: absolute; inset: 0; z-index: 1;
  overflow-y: scroll; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain; touch-action: pan-y;
  padding: 10px; text-align: center;
  display: flex; align-items: center; justify-content: center;
}
.card-question-text-scroll::-webkit-scrollbar { width: 3px; }
.card-question-text-scroll::-webkit-scrollbar-thumb {
  background: rgba(255,149,0,0.25); border-radius: 10px;
}
.card-question-text {
  font-size: 12.5px; font-weight: 600; line-height: 1.65;
  color: var(--ink); word-break: break-word; width: 100%;
}

.card-cat-label {
  font-size: 11px; color: var(--muted); font-weight: 500;
  margin: 2px 0 8px; line-height: 1.4;
}
.card-bottom-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2px; margin-top: 6px;
}
.card-comment-chip {
  display: flex; align-items: center; gap: 4px;
  background: var(--hair); border: 1px solid #e0e3e9;
  border-radius: 999px; padding: 5px 10px;
  font-size: 11.5px; font-weight: 700; color: var(--muted);
}
.card-comment-chip svg { width: 12px; height: 12px; fill: var(--accent); flex-shrink: 0; }
.card-play-btn {
  width: 40px; height: 40px;
  background: var(--accent);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(255,149,0,0.35); flex-shrink: 0;
  transition: .15s;
}
.qa-card:hover .card-play-btn {
  box-shadow: 0 6px 18px rgba(255,149,0,0.5);
  transform: scale(1.07);
}
.card-play-btn svg { width: 18px; height: 18px; fill: #fff; margin-right: -2px; }
.card-empty-chip { width: 40px; display:flex; align-items:center; justify-content:center; }
.card-empty-chip .admin-inline-plays {
  display:flex; align-items:center; gap:4px;
  font-size:11px; font-weight:800; color:#16a34a;
}
.card-empty-chip .admin-inline-plays svg { width: 12px; height: 12px; fill: #22c55e; }

/* =============================================
   MINI PLAYER — تم روشن با اکسنت نارنجی
   ============================================= */
.mini-player {
  position: fixed; bottom: 15px; left: 15px; right: 15px; height: 72px;
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  border: 1.5px solid rgba(0,0,0,0.1);
  border-radius: var(--radius-xl);
  box-shadow: 0 8px 32px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.9);
  z-index: 290; display: none; align-items: center;
  padding: 0 16px; gap: 12px;
  cursor: pointer; overflow: hidden;
}
.mini-player.active { display: flex; }
.mini-cover {
  width: 48px; height: 48px; border-radius: var(--radius-sm);
  object-fit: cover; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.mini-info { flex: 1; overflow: hidden; }
.mini-title {
  font-size: 13.5px; font-weight: 700; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mini-ep {
  font-size: 11.5px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mini-progress {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 3px; background: rgba(0,0,0,0.07);
  border-radius: 0 0 var(--radius-xl) var(--radius-xl); overflow: hidden;
}
.mini-progress-bar {
  height: 100%;
  background: linear-gradient(to right, var(--accent), var(--accent-dk));
  border-radius: 999px; transition: width 0.5s linear;
}
.mini-play-btn {
  width: 42px; height: 42px; background: var(--accent); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; box-shadow: 0 4px 14px rgba(255,149,0,0.35);
}
.mini-play-btn svg { width: 22px; height: 22px; fill: #fff; }
.mini-close {
  width: 32px; height: 32px; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0; font-size: 18px;
  color: var(--muted); cursor: pointer;
}

/* =============================================
   NOW PLAYING SCREEN — تم روشن
   ============================================= */
.now-playing {
  position: fixed; top: 10px; left: 10px; right: 10px;
  height: calc(100% - 10px); height: calc(100dvh - 10px);
  background: rgba(248,249,252,0.98);
  z-index: 300; display: none; flex-direction: column;
  align-items: center; padding: 20px 20px 40px;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  transform: translateY(110%); border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  will-change: transform, border-radius; touch-action: pan-y;
  color: var(--ink);
}
.now-playing.active {
  display: flex; transform: translateY(0%);
  transition: transform 0.52s cubic-bezier(0.32,0.72,0,1),
              border-radius 0.52s cubic-bezier(0.32,0.72,0,1);
}
.drag-handle-wrap {
  width: 100%; display: flex; justify-content: center;
  padding: 6px 0 2px; flex-shrink: 0; cursor: grab;
}
.drag-handle {
  width: 44px; height: 5px;
  background: rgba(0,0,0,0.15); border-radius: 999px;
}
.player-topbar {
  width: 100%; max-width: 380px; display: flex;
  justify-content: space-between; align-items: center;
  padding: 8px 0 16px; flex-shrink: 0;
}
.player-status { font-size: 14px; font-weight: 600; color: var(--muted); }

/* کاور بزرگ */
.big-cover { width: 100%; max-width: 200px; margin: 6px 0 10px; position: relative; flex-shrink: 0; }
.big-cover img {
  width: 100%; aspect-ratio: 1/1; object-fit: cover;
  border-radius: var(--radius-lg);
  box-shadow: 0 15px 45px rgba(0,0,0,0.18);
}
.cover-comment-badge {
  position: absolute; bottom: -13px; left: 50%; transform: translateX(-50%);
  background: rgba(255,255,255,0.95); border: 1.5px solid rgba(0,0,0,0.1);
  backdrop-filter: blur(10px); border-radius: 999px; padding: 5px 14px;
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 700; white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0,0,0,0.12); color: var(--ink);
}
.cover-comment-badge svg { width: 14px; height: 14px; fill: var(--accent); flex-shrink: 0; }

/* باکس سوال QA */
.question-box {
  width: 100%; max-width: 320px; margin: 6px 0 10px;
  background: var(--hair);
  border: 1.5px solid #e0e3e9; border-radius: var(--radius-lg);
  box-shadow: 0 4px 20px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.9);
  position: relative; flex-shrink: 0; height: 260px; max-height: 260px; overflow: hidden;
}
.question-box-bg {
  position: absolute; inset: 0; border-radius: var(--radius-lg);
  pointer-events: none; z-index: 0;
}
.question-text-scroll {
  position: absolute; inset: 0; z-index: 1;
  overflow-y: scroll; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain; touch-action: pan-y;
  padding: 22px 20px; text-align: center;
  display: flex; align-items: center; justify-content: center;
}
.question-text {
  font-size: 15px; font-weight: 600; line-height: 1.7;
  color: var(--ink); word-break: break-word; width: 100%;
}

/* اطلاعات تراک */
.track-info {
  text-align: center; width: 100%; max-width: 360px;
  margin: 20px 0 10px; flex-shrink: 0;
}
.np-title { font-size: 19px; font-weight: 900; color: var(--ink); margin-bottom: 4px; }
.np-subtitle { font-size: 14px; color: var(--muted); }

/* پروگرس بار پادکست */
.progress-section { width: 100%; max-width: 360px; margin-bottom: 28px; flex-shrink: 0; }
.progress-container-podcast {
  width: 100%; height: 5px; background: rgba(0,0,0,0.1);
  border-radius: 999px; cursor: pointer; margin-bottom: 8px; position: relative;
}
.progress-bar-podcast {
  height: 100%;
  background: linear-gradient(to right, var(--accent), var(--accent-dk));
  border-radius: 999px; box-shadow: 0 0 8px rgba(255,149,0,0.4);
  position: relative; width: 0%; transition: width 0.1s linear;
}

/* پروگرس بار QA */
.progress-container-qa {
  width: 100%; height: 8px;
  background: rgba(0,0,0,0.07);
  border: 1px solid rgba(0,0,0,0.1);
  border-radius: 999px; cursor: pointer; margin-bottom: 8px; position: relative;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.08);
}
.progress-bar-qa {
  height: 100%;
  background: linear-gradient(to right, var(--accent), var(--accent-dk));
  border-radius: 999px; box-shadow: 0 0 8px rgba(255,149,0,0.35);
  width: 0%; transition: width 0.1s linear;
}

.time-display {
  display: flex; justify-content: space-between;
  font-size: 13px; color: var(--muted);
}

/* کنترل‌های اصلی */
.main-controls {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; max-width: 360px; padding: 0 10px;
  margin-bottom: 30px; flex-shrink: 0;
}
.control-btn {
  width: 46px; height: 46px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.control-btn svg { width: 30px; height: 30px; fill: var(--muted); transition: all 0.2s; }
.control-btn:active svg { fill: var(--accent); transform: scale(0.9); }
.play-main {
  width: 80px; height: 80px; background: var(--accent); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 30px rgba(255,149,0,0.4); cursor: pointer;
  transition: .15s;
}
.play-main:hover { box-shadow: 0 12px 36px rgba(255,149,0,0.55); transform: scale(1.04); }
.play-main svg { width: 34px; height: 34px; fill: #fff; }

/* =============================================
   COMMENTS — تم روشن
   ============================================= */
.comments-section {
  width: 100%; max-width: 360px; margin-top: 10px; padding-bottom: 30px;
}
.comments-list {
  max-height: 240px; overflow-y: auto; padding-right: 4px; margin-bottom: 14px;
}
.comments-list::-webkit-scrollbar { width: 5px; }
.comments-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 10px; }
.loading-comments { text-align: center; padding: 20px; color: var(--muted); font-size: 14px; }
.delete-btn {
  background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
  color: #dc2626; border-radius: 8px; padding: 4px 10px;
  font-size: 12px; cursor: pointer; font-family: inherit; transition: .15s;
}
.delete-btn:hover { background: rgba(239,68,68,0.2); }

/* فرم ارسال نظر */
.comment-form-wrap {
  background: var(--hair);
  border: 1.5px solid #e0e3e9;
  border-radius: var(--radius-lg);
  padding: 16px 16px 18px;
}
.comment-field {
  width: 100%; background: var(--section);
  border: 1.5px solid #e0e3e9; border-radius: var(--radius-md);
  padding: 12px 14px; color: var(--ink); font-size: 14px;
  margin-bottom: 10px; outline: none; font-family: inherit;
  transition: border .18s; -webkit-appearance: none;
}
.comment-field:focus { border-color: var(--accent); }
.comment-textarea {
  width: 100%; background: var(--section);
  border: 1.5px solid #e0e3e9; border-radius: var(--radius-md);
  padding: 12px 14px; color: var(--ink); font-size: 14px;
  resize: none; height: 80px; outline: none; font-family: inherit;

  try {

    sessionStorage.setItem('pl_visited', '1');
    await supabaseClient.from('site_visits').insert([{}]);
  } catch(e) {}

      .from('site_visits').select('*', { count: 'exact', head: true });

async function fetchPlayCounts() {

    (pRes.data || []).forEach(r => { pCounts[r.podcast_id] = (pCounts[r.podcast_id] || 0) + 1; });
    (qRes.data || []).forEach(r => { qCounts[r.qa_id] = (qCounts[r.qa_id] || 0) + 1; });
    return { pCounts, qCounts };
  } catch(e) { return { pCounts: {}, qCounts: {} }; }

    if (currentId !== null) renderComments();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}
async function doLogout() {
  isAdmin = false;
  await updateAdminHeader();
  await refreshGridsWithCounts();
  if (currentId !== null) renderComments();
}
async function updateAdminHeader() {
  const area = document.getElementById('headerAuthArea');
  if (isAdmin) {
    const visits = await fetchVisitCount();
    area.innerHTML = `<div style="display:flex;align-items:center;gap:8px;">
      <span style="display:flex;align-items:center;gap:5px;font-size:12px;background:rgba(34,197,94,0.12);border:1.5px solid rgba(34,197,94,0.3);padding:6px 12px;border-radius:999px;color:#16a34a;font-weight:800;">
        <svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:#22c55e;"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 7.61 17 4.5 12 4.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        ${toPersianNum(visits)} بازدید
      </span>
      <button onclick="doLogout()" style="background:var(--hair);border:1.5px solid #e0e3e9;border-radius:999px;color:var(--muted);padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700;">خروج</button>
    </div>`;
  } else {
    area.innerHTML = `<button onclick="openLogin()" class="admin-badge">🔐 ادمین</button>`;
  }
}

/* ================================================
   UTILS
   ================================================ */
function toPersianNum(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatTime(s) { if (!s || !isFinite(s) || s < 0) return "0:00"; return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; }
function formatCommentTime(iso) {
  const d = new Date(iso);
  return `${d.toLocaleDateString('fa-IR',{year:'numeric',month:'short',day:'numeric'})} • ${d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}`;
}

/* ================================================
   SECTION TOGGLE
   ================================================ */
function showSection(section) {
  document.getElementById('stab-podcast').classList.toggle('active', section === 'podcast');
  document.getElementById('stab-qa').classList.toggle('active', section === 'qa');
  document.getElementById('panel-podcast').classList.toggle('active', section === 'podcast');
  document.getElementById('panel-qa').classList.toggle('active', section === 'qa');

  const linePodcast = document.getElementById('line-podcast');
  const lineQA      = document.getElementById('line-qa');
  if (section === 'podcast') {
    linePodcast.classList.add('active');    linePodcast.classList.remove('scroll-line-short'); linePodcast.classList.add('scroll-line-long');
    lineQA.classList.remove('active');      lineQA.classList.remove('scroll-line-long');        lineQA.classList.add('scroll-line-short');
  } else {
    lineQA.classList.add('active');         lineQA.classList.remove('scroll-line-short');       lineQA.classList.add('scroll-line-long');
    linePodcast.classList.remove('active'); linePodcast.classList.remove('scroll-line-long');   linePodcast.classList.add('scroll-line-short');
  }
}

/* ================================================
   RENDER GRIDS
   ================================================ */

  document.getElementById('podcastGrid').innerHTML = podcastData.map(item => {
    const cnt   = toPersianNum(counts[item.id] || 0);
    const plays = toPersianNum((playCounts.pCounts && playCounts.pCounts[item.id]) || 0);
    return `<div class="podcast-card" onclick="playPodcast(${item.id})">
      <div class="podcast-card-img-wrap">
        <img src="${item.cover}" alt="${item.episode}">
        <div class="podcast-badge-wrap">
          <svg viewBox="0 0 24 24"><path d="M21 6.5C21 5.12 19.88 4 18.5 4h-13C4.12 4 3 5.12 3 6.5v8C3 15.88 4.12 17 5.5 17H7l3 3 3-3h5.5c1.38 0 2.5-1.12 2.5-2.5v-8z"/></svg>
          <span id="card-badge-p${item.id}">${cnt}</span>
        </div>
        ${item.isNew ? '<div class="new-badge">جدید</div>' : ''}
        ${isAdmin ? `<div class="admin-play-badge">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <span>${plays} پخش</span>
        </div>` : ''}

      <div class="podcast-card-cat">${item.title}</div>
      <div class="podcast-play-circle">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>`;
  }).join('');
}

function renderQAGrid(counts) {
  document.getElementById('qaGrid').innerHTML = qaData.map(item => {
    const cnt   = toPersianNum(counts[item.id] || 0);
    const plays = toPersianNum((playCounts.qCounts && playCounts.qCounts[item.id]) || 0);
    return `<div class="qa-card" onclick="playQA(${item.id})">
      <div class="card-question-box">
        <div class="card-question-box-bg"></div>
        <div class="card-question-text-scroll">
          <span class="card-question-text">${item.question}</span>
        </div>

      <div class="card-cat-label">${item.category}</div>
      <div class="card-bottom-row">
        <div class="card-comment-chip">
          <svg viewBox="0 0 24 24"><path d="M21 6.5C21 5.12 19.88 4 18.5 4h-13C4.12 4 3 5.12 3 6.5v8C3 15.88 4.12 17 5.5 17H7l3 3 3-3h5.5c1.38 0 2.5-1.12 2.5-2.5v-8z"/></svg>

/* ================================================
   PLAY — پادکست
   ================================================ */
function playPodcast(id) {
  const item = podcastData.find(p => p.id === id);
  if (!item) return;
  currentMode  = 'podcast';
  currentId    = id;
  currentIndex = podcastData.findIndex(p => p.id === id);

  document.getElementById('bigCoverWrap').style.display    = '';
  document.getElementById('questionBoxWrap').style.display  = 'none';
  document.getElementById('progressSectionPodcast').style.display = '';
  document.getElementById('progressSectionQA').style.display      = 'none';
  document.getElementById('miniCover').style.display        = '';
  document.getElementById('miniPlayIcon2Wrap').style.display = 'none';

  document.getElementById('npTitle').textContent    = item.episode;
  document.getElementById('npSubtitle').textContent = item.title;
  document.getElementById('miniTitle').textContent  = item.episode;
  document.getElementById('miniEp').textContent     = item.title;
  document.getElementById('npCover').src            = item.cover;
  document.getElementById('miniCover').src          = item.cover;

  resetProgress();
  audio.src = item.src;
  audio.play().then(() => setPlayIcons(true)).catch(() => setPlayIcons(false));
  recordPlay('podcast', id);
  if (isAdmin) playCounts.pCounts[id] = (playCounts.pCounts[id] || 0) + 1;
  loadComments();
  expandPlayer();
}

/* ================================================
   PLAY — QA
   ================================================ */
function playQA(id) {
  const item = qaData.find(q => q.id === id);
  if (!item) return;
  currentMode  = 'qa';
  currentId    = id;
  currentIndex = qaData.findIndex(q => q.id === id);

  document.getElementById('bigCoverWrap').style.display    = 'none';
  document.getElementById('questionBoxWrap').style.display  = '';
  document.getElementById('progressSectionPodcast').style.display = 'none';
  document.getElementById('progressSectionQA').style.display      = '';
  document.getElementById('miniCover').style.display        = 'none';
  document.getElementById('miniPlayIcon2Wrap').style.display = '';

  document.getElementById('questionText').textContent   = item.question;
  document.getElementById('npTitle').textContent        = item.category;
  document.getElementById('npSubtitle').textContent     = 'PlanLife';
  document.getElementById('miniTitle').textContent      = item.question.substring(0, 45) + '…';
  document.getElementById('miniEp').textContent         = item.category;

  resetProgress();
  if (item.audio) {
    audio.src = item.audio;
    audio.play().then(() => setPlayIcons(true)).catch(() => setPlayIcons(false));
    recordPlay('qa', id);
    if (isAdmin) playCounts.qCounts[id] = (playCounts.qCounts[id] || 0) + 1;
  } else {
    audio.removeAttribute('src'); audio.load(); setPlayIcons(false);
  }
  loadComments();
  expandPlayer();
}

/* ================================================
   AUDIO EVENTS
   ================================================ */
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  document.getElementById('progressBarPodcast').style.width = pct + '%';
  document.getElementById('progressBarQA').style.width      = pct + '%';
  document.getElementById('miniProgressBar').style.width    = pct + '%';
  document.getElementById('currentTimePodcast').textContent = formatTime(audio.currentTime);
  document.getElementById('currentTimeQA').textContent      = formatTime(audio.currentTime);
});
audio.addEventListener('loadedmetadata', () => {
  document.getElementById('totalTimePodcast').textContent = formatTime(audio.duration);
  document.getElementById('totalTimeQA').textContent      = formatTime(audio.duration);
});
audio.addEventListener('play',  () => setPlayIcons(true));
audio.addEventListener('pause', () => setPlayIcons(false));
audio.addEventListener('ended', () => { setPlayIcons(false); resetProgress(); });

document.getElementById('progressContainerPodcast').addEventListener('click', e => {
  if (!audio.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
});
document.getElementById('progressContainerQA').addEventListener('click', e => {
  if (!audio.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  const ratio = 1 - ((e.clientX - r.left) / r.width);
  audio.currentTime = Math.max(0, Math.min(1, ratio)) * audio.duration;
});

function resetProgress() {
  ['progressBarPodcast','progressBarQA','miniProgressBar'].forEach(id => {
    document.getElementById(id).style.width = '0%';
  });
  ['currentTimePodcast','currentTimeQA'].forEach(id => {
    document.getElementById(id).textContent = '0:00';
  });
  ['totalTimePodcast','totalTimeQA'].forEach(id => {
    document.getElementById(id).textContent = '0:00';
  });
}

/* ================================================
   CONTROLS
   ================================================ */
function setPlayIcons(playing) {
  const icon = playing
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  playIcon.innerHTML = icon;
  document.getElementById('miniPlayIcon').innerHTML = icon;
  statusEl.textContent = playing ? 'در حال پخش' : 'متوقف شده';
}
function togglePlay() {
  if (!audio.src) return;
  if (audio.paused) { audio.play().catch(()=>{}); } else { audio.pause(); }
}
function miniTogglePlay() { togglePlay(); }
function seek(sec) {
  if (!audio.duration) return;
  audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + sec));
}
function prevTrack() {
  if (currentMode === 'podcast' && currentIndex > 0) playPodcast(podcastData[currentIndex-1].id);
  else if (currentMode === 'qa' && currentIndex > 0) playQA(qaData[currentIndex-1].id);
}
function nextTrack() {
  if (currentMode === 'podcast' && currentIndex < podcastData.length-1) playPodcast(podcastData[currentIndex+1].id);
  else if (currentMode === 'qa' && currentIndex < qaData.length-1) playQA(qaData[currentIndex+1].id);
}

/* ================================================
   COMMENTS
   ================================================ */
function commentKey() {
  return currentMode === 'podcast' ? `p_${currentId}` : `q_${currentId}`;
}
async function loadComments() {
  document.getElementById('commentsList').innerHTML = '<div class="loading-comments">⏳ در حال بارگذاری نظرات...</div>';
  document.getElementById('commentCount').textContent = '...';
  if (currentMode === 'podcast') await fetchPodcastComments(currentId);
  else await fetchQAComments(currentId);
  renderComments();
  refreshBadges();
}
function renderComments() {
  const key      = commentKey();
  const comments = allComments[key] || [];
  const list     = document.getElementById('commentsList');
  document.getElementById('commentCount').textContent       = comments.length;
  document.getElementById('coverCommentCount').textContent  = toPersianNum(comments.length);
  list.innerHTML = '';
  if (comments.length === 0) {
    list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:22px 10px;font-size:14px;line-height:1.7;">هنوز نظری ثبت نشده.<br>اولین نفر باشید!</p>';
    return;
  }
  comments.forEach(c => {
    const div = document.createElement('div');
    div.style.cssText = 'background:var(--hair);border-radius:14px;padding:13px 15px;margin-bottom:9px;border:1.5px solid #e0e3e9;';
    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
        <strong style="color:var(--accent);font-size:14px;">${escapeHtml(c.name)}</strong>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:11px;color:var(--muted);white-space:nowrap;">${formatCommentTime(c.created_at)}</span>
          ${isAdmin ? `<button class="delete-btn" onclick="deleteComment(${c.id})">🗑 حذف</button>` : ''}
        </div>
      </div>
      <p style="font-size:14px;line-height:1.6;margin:0;color:var(--ink);">${escapeHtml(c.text)}</p>`;
    list.appendChild(div);
  });
}
async function addComment() {
  if (currentId === null) return;
  const name = document.getElementById('commentName').value.trim() || 'ناشناس';
  const text = document.getElementById('commentText').value.trim();
  if (!text) { alert('لطفاً متن نظر را وارد کنید.'); return; }
  const btn = document.getElementById('submitCommentBtn');
  btn.textContent = '⏳ در حال ارسال...'; btn.disabled = true;

  let inserted = null;
  if (currentMode === 'podcast') inserted = await insertPodcastComment(currentId, name, text);
  else inserted = await insertQAComment(currentId, name, text);

  if (inserted) {
    const key = commentKey();
    if (!allComments[key]) allComments[key] = [];
    allComments[key].unshift(inserted);
    renderComments(); refreshBadges();
    document.getElementById('commentText').value = '';
    document.getElementById('commentName').value = '';
  } else {
    alert('ارسال نظر با خطا مواجه شد.');
  }
  btn.textContent = 'ارسال نظر'; btn.disabled = false;
}
async function deleteComment(commentId) {
  if (!isAdmin || !confirm('این نظر حذف شود؟')) return;
  let ok = false;
  if (currentMode === 'podcast') ok = await deletePodcastCommentRemote(commentId);
  else ok = await deleteQACommentRemote(commentId);
  if (!ok) return;
  const key = commentKey();
  allComments[key] = (allComments[key] || []).filter(c => c.id !== commentId);
  renderComments(); refreshBadges();
}
async function refreshBadges() {
  const [pCounts, qCounts] = await Promise.all([fetchAllPodcastCounts(), fetchAllQACounts()]);
  podcastData.forEach(item => {
    const el = document.getElementById(`card-badge-p${item.id}`);
    if (el) el.textContent = toPersianNum(pCounts[item.id] || 0);
  });
  qaData.forEach(item => {
    const el = document.getElementById(`card-badge-q${item.id}`);
    if (el) el.textContent = toPersianNum(qCounts[item.id] || 0);
  });
}

/* ================================================
   PLAYER UI
   ================================================ */
function expandPlayer() {
  const screen = document.getElementById('nowPlayingScreen');
  document.getElementById('miniPlayer').classList.remove('active');
  screen.style.transition   = 'none';
  screen.style.transform    = 'translateY(110%)';
  screen.style.borderRadius = `${getComputedStyle(document.documentElement).getPropertyValue('--radius-xl')} ${getComputedStyle(document.documentElement).getPropertyValue('--radius-xl')} 0 0`;
  screen.scrollTop = 0;
  screen.classList.add('active');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    screen.style.transition   = 'transform 0.52s cubic-bezier(0.32,0.72,0,1), border-radius 0.52s cubic-bezier(0.32,0.72,0,1)';
    screen.style.transform    = 'translateY(0%)';
  }));
}
function minimizePlayer() {
  const screen = document.getElementById('nowPlayingScreen');
  screen.style.transition = 'transform 0.48s cubic-bezier(0.32,0.72,0,1), border-radius 0.48s cubic-bezier(0.32,0.72,0,1)';
  screen.style.transform  = 'translateY(110%)';
  setTimeout(() => {
    screen.classList.remove('active');
    screen.style.transform = screen.style.borderRadius = screen.style.transition = '';
    if (currentId !== null) document.getElementById('miniPlayer').classList.add('active');
  }, 480);
}
function killPlayer() {
  const screen = document.getElementById('nowPlayingScreen');
  screen.style.transition = 'transform 0.38s cubic-bezier(0.32,0.72,0,1)';
  screen.style.transform  = 'translateY(100%)';
  setTimeout(() => {
    screen.classList.remove('active'); screen.style.cssText = '';
    document.getElementById('miniPlayer').classList.remove('active');
  }, 380);
  audio.pause(); audio.removeAttribute('src'); audio.load();
  currentId = null; setPlayIcons(false);
}
function closeNowPlaying() { minimizePlayer(); }
function scrollToForm() {
  setTimeout(() => {
    const f = document.getElementById('commentForm');
    if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 320);
}

/* ================================================
   SWIPE TO MINIMIZE
   ================================================ */
(function() {
  const screen = document.getElementById('nowPlayingScreen');
  let startY = 0, startX = 0, lastY = 0, velocity = 0, lastTime = 0;
  let intentDecided = false, isMinimizing = false;
  function onStart(e) {
    const t = e.touches[0];
    startY = t.clientY; startX = t.clientX;
    lastY = startY; lastTime = Date.now();
    velocity = 0; intentDecided = false; isMinimizing = false;
    screen.style.transition = 'none';
  }
  function onMove(e) {
    const t = e.touches[0];
    const dy  = t.clientY - startY;
    const adx = Math.abs(t.clientX - startX);
    const now = Date.now(), dt = now - lastTime;
    if (dt > 0) velocity = (t.clientY - lastY) / dt;
    lastY = t.clientY; lastTime = now;
    if (!intentDecided && (Math.abs(dy) > 8 || adx > 8)) {
      intentDecided = true;
      if (adx > Math.abs(dy) * 1.2) return;
      if (dy < 0) return;
      if (dy > 0 && screen.scrollTop <= 1) { isMinimizing = true; screen.style.willChange = 'transform, border-radius'; }
    }
    if (!isMinimizing || dy <= 0) return;
    e.preventDefault();
    const progress   = Math.min(dy / 380, 1);
    const resistance = dy * (1 - progress * 0.3);
    screen.style.transform    = `translateY(${resistance}px) scale(${1 - progress * 0.08})`;
    screen.style.borderRadius = `${progress * 28}px ${progress * 28}px 0 0`;
    screen.style.opacity      = 1 - progress * 0.15;
  }
  function onEnd() {
    if (!isMinimizing) return;
    isMinimizing = false; screen.style.willChange = '';
    const dy = lastY - startY;
    const shouldMin = velocity > 0.4 || dy > 130;
    screen.style.transition = 'transform 0.46s cubic-bezier(0.32,0.72,0,1), border-radius 0.46s cubic-bezier(0.32,0.72,0,1), opacity 0.46s ease';
    if (shouldMin) {
      screen.style.transform    = 'translateY(100%) scale(0.92)';
      screen.style.borderRadius = '28px 28px 0 0';
      screen.style.opacity      = '0.6';
      setTimeout(() => {
        screen.classList.remove('active'); screen.style.cssText = '';
        if (currentId !== null) document.getElementById('miniPlayer').classList.add('active');
      }, 460);
    } else {
      screen.style.transform    = 'translateY(0) scale(1)';
      screen.style.borderRadius = '0px';
      screen.style.opacity      = '1';
      setTimeout(() => { screen.style.transition = screen.style.transform = screen.style.borderRadius = screen.style.opacity = ''; }, 460);
    }
  }
  screen.addEventListener('touchstart', onStart, { passive: true });
  screen.addEventListener('touchmove',  onMove,  { passive: false });
  document.addEventListener('touchend',    onEnd);
  document.addEventListener('touchcancel', onEnd);
})();

/* ================================================
   INIT
   ================================================ */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('loginOverlay').classList.contains('active')) doLogin();
});

window.onload = async function() {
  renderPodcastGrid({});
  renderQAGrid({});

  recordVisit();

  const [pCounts, qCounts, pc] = await Promise.all([
    fetchAllPodcastCounts(), fetchAllQACounts(), fetchPlayCounts()
  ]);
  playCounts = pc;
  renderPodcastGrid(pCounts);
  renderQAGrid(qCounts);
};
