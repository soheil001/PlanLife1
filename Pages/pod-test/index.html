<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>پادکست‌های PlanLife</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════ */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Vazirmatn', sans-serif; background: #030303; color: white; overflow-x: hidden; }

/* ═══════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════ */
.site-header {
    position: fixed; top: 0; left: 0; right: 0; height: 65px;
    background: rgba(0,0,0,0.3); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; z-index: 100;
}
.back-btn { font-size: 28px; cursor: pointer; }
.admin-badge {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,149,0,0.2); border: 1px solid rgba(255,149,0,0.5);
    border-radius: 999px; padding: 6px 14px;
    font-size: 13px; font-weight: 700; color: #ff9500; cursor: pointer;
    font-family: inherit;
}
.admin-logout-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px; color: white; padding: 6px 14px;
    font-size: 13px; cursor: pointer; font-family: inherit;
}

/* ═══════════════════════════════════════════════
   PAGE HEADER & TAB PILLS (وسط صفحه)
═══════════════════════════════════════════════ */
.page-header {
    margin-top: 75px;
    text-align: center;
    padding: 12px 20px 0;
}
.page-title { font-size: 30px; font-weight: 900; margin-bottom: 18px; }

/* دو باکس شیشه‌ای گرد برای انتخاب بخش */
.section-pills {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 18px;
}
.section-pill {
    flex: 1; max-width: 160px;
    padding: 14px 10px;
    border-radius: 999px;
    border: 1.5px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    font-size: 15px; font-weight: 700;
    color: rgba(255,255,255,0.6);
    cursor: pointer; font-family: inherit;
    transition: all 0.28s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
}
.section-pill.active {
    background: linear-gradient(135deg, rgba(255,149,0,0.9), rgba(255,107,0,0.9));
    border-color: rgba(255,149,0,0.6);
    color: #1a0033;
    box-shadow: 0 6px 20px rgba(255,149,0,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
    transform: scale(1.04);
}

/* نقطه‌های اسلایدر */
.slide-dots {
    display: flex; gap: 7px; justify-content: center;
    margin-bottom: 22px;
}
.slide-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    transition: all 0.3s ease; cursor: pointer;
}
.slide-dot.active {
    width: 22px; border-radius: 999px;
    background: #ff9500;
    box-shadow: 0 0 8px rgba(255,149,0,0.6);
}

/* ═══════════════════════════════════════════════
   SLIDER CONTAINER (اسکرول افقی)
═══════════════════════════════════════════════ */
.slides-viewport {
    overflow: hidden;
    width: 100%;
}
.slides-track {
    display: flex;
    width: 200%; /* 2 slides */
    transition: transform 0.42s cubic-bezier(0.32,0.72,0,1);
    will-change: transform;
}
.slide-page {
    width: 50%; /* each = 100vw */
    flex-shrink: 0;
    padding: 0 20px 120px;
}

/* ═══════════════════════════════════════════════
   GRIDS
═══════════════════════════════════════════════ */
.content-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

/* ═══════════════════════════════════════════════
   QA SECTION — دسته‌بندی‌ها
═══════════════════════════════════════════════ */
.qa-section-label {
    font-size: 20px; font-weight: 700;
    margin-bottom: 12px;
}
.qa-categories-scroll {
    display: flex; gap: 12px;
    overflow-x: auto; padding-bottom: 16px;
    scrollbar-width: none; margin-bottom: 18px;
}
.qa-categories-scroll::-webkit-scrollbar { display: none; }
.qa-cat-card {
    min-width: 120px; text-align: center;
    background: rgba(255,255,255,0.11);
    border-radius: 16px; padding: 8px;
    cursor: pointer; flex-shrink: 0;
}
.qa-cat-card img {
    width: 104px; height: 104px;
    border-radius: 12px; object-fit: cover; display: block;
}
.qa-cat-card p { margin-top: 8px; font-size: 13px; font-weight: 600; }
.qa-current-cat {
    font-size: 20px; font-weight: 700; margin-bottom: 14px;
}

/* ═══════════════════════════════════════════════
   CARD — SHARED BASE
═══════════════════════════════════════════════ */
.card {
    background: rgba(255,255,255,0.11);
    border-radius: 22px; padding: 12px;
    text-align: center; cursor: pointer;
    display: flex; flex-direction: column;
}

/* ── Podcast card ── */
.card-cover-wrap { position: relative; }
.card-cover-img {
    width: 100%; aspect-ratio: 1/1;
    border-radius: 18px; object-fit: cover; display: block;
}
.card-comment-chip {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,0.62); backdrop-filter: blur(6px);
    border-radius: 999px; padding: 4px 9px;
    display: flex; align-items: center; gap: 5px;
}
.card-comment-chip svg { width: 13px; height: 13px; fill: #ff9500; }
.card-comment-chip span { font-size: 12px; font-weight: 700; color: white; }
.new-badge {
    position: absolute; top: 8px; left: 8px;
    background: #ff9500; color: #1a0033;
    font-size: 11px; font-weight: 900;
    padding: 3px 9px; border-radius: 999px;
    pointer-events: none;
}
.card-podcast-label {
    font-size: 14px; font-weight: 600;
    margin: 10px 0 10px; line-height: 1.4;
}
.card-play-circle {
    width: 48px; height: 48px;
    background: #ffd700; border-radius: 50%;
    margin: 0 auto;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
}
.card-play-circle .play-arrow {
    width: 0; height: 0;
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-left: 16px solid #1a0033;
    margin-left: 3px;
}

/* ── QA card ── */
.card-qa-question-box {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 18px;
    position: relative;
    height: 110px; overflow: hidden;
    box-shadow:
        0 0 22px rgba(255,149,0,0.2),
        0 8px 24px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.12);
    margin-bottom: 8px;
}
.card-qa-question-box::before {
    content: '';
    position: absolute; inset: -1px;
    background: linear-gradient(135deg, rgba(255,149,0,0.3), rgba(212,175,55,0.15), transparent);
    border-radius: 18px; z-index: -1;
    filter: blur(8px); pointer-events: none;
}
.card-qa-question-bg {
    position: absolute; inset: 0; border-radius: 18px;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    pointer-events: none; z-index: 0;
}
.card-qa-question-scroll {
    position: absolute; inset: 0; z-index: 1;
    overflow-y: scroll; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain; touch-action: pan-y;
    padding: 10px; text-align: center;
    display: flex; align-items: center; justify-content: center;
}
.card-qa-question-scroll::-webkit-scrollbar { width: 3px; }
.card-qa-question-scroll::-webkit-scrollbar-thumb { background: rgba(255,149,0,0.35); border-radius: 10px; }
.card-qa-question-text {
    font-size: 12.5px; font-weight: 600; line-height: 1.6;
    color: #f0f0f0; word-break: break-word; width: 100%;
}
.card-qa-category {
    font-size: 11px; opacity: 0.6; font-weight: 400;
    margin-bottom: 8px; text-align: center;
}
.card-bottom-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2px;
}
.card-bottom-comment {
    display: flex; align-items: center; gap: 4px;
    background: rgba(0,0,0,0.45); backdrop-filter: blur(6px);
    border-radius: 999px; padding: 5px 10px;
    font-size: 12px; font-weight: 700; color: white;
}
.card-bottom-comment svg { width: 13px; height: 13px; fill: #ff9500; flex-shrink: 0; }
.card-qa-play-btn {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, #ff9500, #ff6b00);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(255,149,0,0.5);
    flex-shrink: 0;
}
.card-qa-play-btn svg { width: 20px; height: 20px; fill: #1a0033; margin-right: -2px; }

/* ═══════════════════════════════════════════════
   MINI PLAYER
═══════════════════════════════════════════════ */
.mini-player {
    position: fixed; bottom: 15px; left: 15px; right: 15px; height: 72px;
    background: rgba(18,18,40,0.72);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 22px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.1);
    z-index: 290; display: none; align-items: center;
    padding: 0 16px; gap: 12px; cursor: pointer; overflow: hidden;
}
.mini-player.active { display: flex; }
.mini-cover-img { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
.mini-info { flex: 1; overflow: hidden; }
.mini-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-sub   { font-size: 12px; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-play-btn {
    width: 42px; height: 42px; background: #ff9500; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; box-shadow: 0 4px 14px rgba(255,149,0,0.5);
}
.mini-play-btn svg { width: 22px; height: 22px; fill: #1a0033; }
.mini-close-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.5; flex-shrink: 0; font-size: 20px;
}
.mini-progress-wrap {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 3px; background: rgba(255,255,255,0.10);
    border-radius: 0 0 22px 22px; overflow: hidden;
}
.mini-progress-bar {
    height: 100%;
    background: linear-gradient(to right, #ff9500, #ff6b00);
    border-radius: 999px; transition: width 0.5s linear; width: 0%;
}

/* ═══════════════════════════════════════════════
   NOW PLAYING — SHARED
═══════════════════════════════════════════════ */
.now-playing {
    position: fixed; top: 10px; left: 10px; right: 10px;
    height: calc(100% - 10px); height: calc(100dvh - 10px);
    background: rgba(10,10,25,0.98);
    z-index: 300; display: none; flex-direction: column;
    align-items: center; padding: 20px 20px 40px;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    transform: translateY(110%);
    border-radius: 22px 22px 0 0;
    will-change: transform, border-radius;
    touch-action: pan-y;
}
.now-playing.active {
    display: flex; transform: translateY(0%);
    transition: transform 0.52s cubic-bezier(0.32,0.72,0,1),
                border-radius 0.52s cubic-bezier(0.32,0.72,0,1);
}
.drag-handle-wrap {
    width: 100%; display: flex; justify-content: center;
    padding: 6px 0 2px; flex-shrink: 0; cursor: grab;
}
.drag-handle {
    width: 44px; height: 5px;
    background: rgba(255,255,255,0.65); border-radius: 999px;
    box-shadow: 0 0 8px rgba(255,255,255,0.2);
}
.player-topbar {
    width: 100%; max-width: 380px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0 16px; flex-shrink: 0;
}
.player-topbar button { font-size: 26px; background: none; border: none; color: white; cursor: pointer; }
.player-status { font-size: 15px; font-weight: 600; opacity: 0.85; }

/* Progress bar — بدون گردی سفید */
.progress-section { width: 100%; max-width: 360px; margin-bottom: 28px; flex-shrink: 0; }
.progress-container {
    width: 100%; height: 7px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px; cursor: pointer; margin-bottom: 8px;
    position: relative;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.35);
    overflow: hidden;
}
/* پادکست پلیر — progress bar */
.progress-bar-podcast {
    height: 100%;
    background: linear-gradient(to right, #ff9500, #ff6b00);
    border-radius: 999px;
    box-shadow: 0 0 10px rgba(255,149,0,0.7), 0 0 20px rgba(255,107,0,0.4);
    width: 0%; transition: width 0.1s linear;
}
/* QA پلیر — progress bar بدون گردی، نورانی‌تر */
.progress-bar-qa {
    height: 100%;
    background: linear-gradient(to right, #ffb300, #ff6b00);
    border-radius: 999px;
    box-shadow: 0 0 14px rgba(255,149,0,0.9), 0 0 28px rgba(255,180,0,0.5), 0 0 4px rgba(255,255,255,0.3);
    width: 0%; transition: width 0.1s linear;
}
.time-display { display: flex; justify-content: space-between; font-size: 13.5px; opacity: 0.75; }

/* Controls */
.main-controls {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; max-width: 360px; padding: 0 10px; margin-bottom: 30px; flex-shrink: 0;
}
.control-btn {
    width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.control-btn svg { width: 30px; height: 30px; fill: #ddd; transition: all 0.2s; }
.control-btn:active svg { fill: #ff9500; transform: scale(0.9); }
.play-main {
    width: 82px; height: 82px; background: #ff9500; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 30px rgba(255,149,0,0.65); cursor: pointer;
}
.play-main svg { width: 36px; height: 36px; fill: #1a0033; }

/* ── Podcast now-playing ── */
.np-podcast-cover {
    width: 100%; max-width: 200px; margin: 6px 0 26px;
    flex-shrink: 0; position: relative;
}
.np-podcast-cover img {
    width: 100%; aspect-ratio: 1/1; object-fit: cover;
    border-radius: 20px; box-shadow: 0 15px 45px rgba(192,38,211,0.5);
}
.np-cover-badge {
    position: absolute; bottom: -13px; left: 50%; transform: translateX(-50%);
    background: rgba(20,20,40,0.92); border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(10px); border-radius: 999px; padding: 5px 14px;
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
}
.np-cover-badge svg { width: 15px; height: 15px; fill: #ff9500; flex-shrink: 0; }
.np-track-info { text-align: center; width: 100%; max-width: 360px; margin: 20px 0 10px; flex-shrink: 0; }
.np-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }

/* ── QA now-playing ── */
.np-qa-question-box {
    width: 100%; max-width: 320px; margin: 6px 0 10px;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.18);
    border-radius: 20px; position: relative; flex-shrink: 0;
    height: 260px; overflow: hidden;
    box-shadow: 0 0 30px rgba(255,149,0,0.25), 0 15px 45px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.12), 0 0 20px rgba(212,175,55,0.15);
}
.np-qa-question-box::before {
    content: ''; position: absolute; inset: -2px;
    background: linear-gradient(135deg, rgba(255,149,0,0.4), rgba(212,175,55,0.2), transparent);
    border-radius: 20px; z-index: -1; filter: blur(12px); pointer-events: none;
}
.np-qa-question-bg {
    position: absolute; inset: 0; border-radius: 20px;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    pointer-events: none; z-index: 0;
}
.np-qa-question-scroll {
    position: absolute; inset: 0; z-index: 1;
    overflow-y: scroll; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain; touch-action: pan-y;
    padding: 22px 20px; text-align: center;
    display: flex; align-items: center; justify-content: center;
}
.np-qa-question-scroll::-webkit-scrollbar { width: 4px; }
.np-qa-question-scroll::-webkit-scrollbar-thumb { background: rgba(255,149,0,0.4); border-radius: 10px; }
.np-qa-question-text {
    font-size: 16px; font-weight: 600; line-height: 1.7;
    color: #f0f0f0; word-break: break-word; width: 100%;
}
.np-qa-comment-badge {
    display: flex; align-items: center; gap: 6px;
    background: rgba(20,20,40,0.92); border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(10px); border-radius: 999px; padding: 5px 14px;
    font-size: 13px; font-weight: 700; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4); margin-bottom: 20px; flex-shrink: 0;
}
.np-qa-comment-badge svg { width: 15px; height: 15px; fill: #ff9500; flex-shrink: 0; }

/* ═══════════════════════════════════════════════
   COMMENTS — SHARED
═══════════════════════════════════════════════ */
.comments-section { width: 100%; max-width: 360px; margin-top: 10px; padding-bottom: 30px; }
.comments-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 0 4px; }
.comments-header span:first-child { font-size: 19px; font-weight: 700; }
.comments-count {
    background: #ff9500; color: #1a0033;
    font-size: 12.5px; font-weight: 800;
    padding: 3px 11px; border-radius: 999px; min-width: 22px; text-align: center;
}
.comments-list { max-height: 240px; overflow-y: auto; padding-right: 4px; margin-bottom: 14px; }
.comments-list::-webkit-scrollbar { width: 5px; }
.comments-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 10px; }
.comment-item {
    background: rgba(255,255,255,0.085); border-radius: 14px;
    padding: 13px 15px; margin-bottom: 9px;
    border: 1px solid rgba(255,255,255,0.06);
}
.comment-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
.comment-name  { color: #ffd700; font-size: 14.5px; font-weight: 700; }
.comment-time  { font-size: 11.5px; opacity: 0.55; white-space: nowrap; }
.comment-text  { font-size: 14.8px; line-height: 1.55; color: #f0f0f0; }
.delete-btn {
    background: rgba(255,50,50,0.2); border: 1px solid rgba(255,50,50,0.4);
    color: #ff6464; border-radius: 8px; padding: 4px 10px;
    font-size: 12px; cursor: pointer; font-family: inherit;
}
.comment-form { background: rgba(255,255,255,0.09); border-radius: 18px; padding: 16px 16px 18px; }
.comment-input {
    width: 100%; background: rgba(0,0,0,0.4);
    border: 1.5px solid rgba(255,255,255,0.1); border-radius: 14px;
    padding: 13px 16px; color: white; font-size: 16px;
    outline: none; font-family: inherit;
    -webkit-appearance: none; appearance: none;
}
.comment-input:focus { border-color: #ff9500; }
.comment-name-input { margin-bottom: 10px; }
.comment-textarea { resize: none; height: 80px; line-height: 1.5; display: block; }
.comment-submit-btn {
    margin-top: 12px; width: 100%; background: #ff9500; color: #1a0033;
    border: none; border-radius: 999px; padding: 15px 0;
    font-weight: 800; font-size: 16px; cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 18px rgba(255,149,0,0.35);
    -webkit-tap-highlight-color: transparent;
}
.loading-comments { text-align: center; padding: 20px; opacity: 0.6; font-size: 14px; }

/* ═══════════════════════════════════════════════
   LOGIN OVERLAY
═══════════════════════════════════════════════ */
.login-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    backdrop-filter: blur(12px); z-index: 999;
    display: none; align-items: center; justify-content: center;
}
.login-overlay.active { display: flex; }
.login-box {
    background: rgba(255,255,255,0.1); backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 28px; padding: 36px 30px;
    width: 90%; max-width: 340px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5); position: relative;
}
.login-box h3 { font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 6px; }
.login-box p  { font-size: 13px; opacity: 0.6; text-align: center; margin-bottom: 24px; }
.login-field {
    width: 100%; background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 14px;

const dots   = document.querySelectorAll('.slide-dot');

function goToSlide(index) {
    currentSlide = index;
    track.style.transform = `translateX(${index === 0 ? '0%' : '-50%'})`;
    pills.forEach((p, i) => p.classList.toggle('active', i === index));
    dots.forEach((d, i)  => d.classList.toggle('active', i === index));
}

/* ── افقی swipe برای رفتن بین صفحه‌ها ── */
(function() {
    const vp = document.querySelector('.slides-viewport');
    let startX = 0, startY = 0, moving = false, axisLocked = false, isHorizontal = false;

    vp.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        moving = true; axisLocked = false; isHorizontal = false;
    }, { passive: true });

    vp.addEventListener('touchmove', e => {
        if (!moving) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        if (!axisLocked) {
            axisLocked = true;
            isHorizontal = Math.abs(dx) > Math.abs(dy);
        }
        if (isHorizontal) e.preventDefault();
    }, { passive: false });

    vp.addEventListener('touchend', e => {
        if (!moving || !isHorizontal) { moving = false; return; }
        moving = false;
        const dx = e.changedTouches[0].clientX - startX;
        // RTL: کشیدن از چپ به راست (dx > 0) = رفتن به راست = slide قبلی
        // کشیدن از راست به چپ (dx < 0) = slide بعدی
        if (Math.abs(dx) < 40) return;
        if (dx < 0 && currentSlide === 0) goToSlide(1);
        else if (dx > 0 && currentSlide === 1) goToSlide(0);
    }, { passive: true });
})();

async function fetchPodcastComments(id) {
    try {
        const { data, error } = await db.from('comments')
            .select('*').eq('podcast_id', id).order('created_at', { ascending: false });
        if (error) throw error;
        podcastComments[id] = data || [];
    } catch(e) { podcastComments[id] = []; }
}
async function fetchAllPodcastCounts() {
    try {
        const { data, error } = await db.from('comments').select('podcast_id');
        if (error) throw error;
        const counts = {};
        (data || []).forEach(r => { counts[r.podcast_id] = (counts[r.podcast_id] || 0) + 1; });
        return counts;
    } catch(e) { return {}; }
}
async function insertPodcastComment(id, name, text) {
    try {
        const { data, error } = await db.from('comments').insert([{ podcast_id: id, name, text }]).select();
        if (error) throw error;
        return data && data[0];
    } catch(e) { return null; }
}
async function deletePodcastCommentRemote(commentId) {
    try {
        const res = await fetch(DELETE_PODCAST_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY },
            body: JSON.stringify({ commentId, adminPassword: ADMIN_API_PASSWORD })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'HTTP ' + res.status);
        return true;
    } catch(e) { alert('خطا در حذف: ' + e.message); return false; }
}

        (data || []).forEach(r => { counts[r.qa_id] = (counts[r.qa_id] || 0) + 1; });
        return counts;
    } catch(e) { return {}; }
}
async function insertQAComment(id, name, text) {
    try {
        const { data, error } = await db.from('qa_comments').insert([{ qa_id: id, name, text }]).select();
        if (error) throw error;
        return data && data[0];
    } catch(e) { return null; }
}
async function deleteQACommentRemote(commentId) {
    try {
        const res = await fetch(DELETE_QA_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY },
            body: JSON.stringify({ commentId, adminPassword: ADMIN_API_PASSWORD })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'HTTP ' + res.status);
        return true;
    } catch(e) { alert('خطا در حذف: ' + e.message); return false; }
}

function toPersian(n)    { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
function escapeHtml(s)   { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    return `${Math.floor(sec/60)}:${Math.floor(sec%60).toString().padStart(2,'0')}`;
}
function formatCommentDate(iso) {
    const d = new Date(iso);
    return `${d.toLocaleDateString('fa-IR',{year:'numeric',month:'short',day:'numeric'})} • ${d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}`;
}

/* ── Swipe to close (هر دو صفحه پلی) ── */
function attachSwipeToClose(screenId) {
    const screen = document.getElementById(screenId);
    let startY = 0, startX = 0, lastY = 0, velocity = 0, lastTime = 0;
    let intentDecided = false, isMinimizing = false;

    screen.addEventListener('touchstart', e => {
        const t = e.touches[0];
        startY = lastY = t.clientY; startX = t.clientX;
        lastTime = Date.now(); velocity = 0;
        intentDecided = false; isMinimizing = false;
        screen.style.transition = 'none';
    }, { passive: true });

    screen.addEventListener('touchmove', e => {
        const t   = e.touches[0];
        const dy  = t.clientY - startY;
        const adx = Math.abs(t.clientX - startX);
        const now = Date.now(), dt = now - lastTime;
        if (dt > 0) velocity = (t.clientY - lastY) / dt;
        lastY = t.clientY; lastTime = now;
        if (!intentDecided && (Math.abs(dy) > 8 || adx > 8)) {
            intentDecided = true;
            if (adx > Math.abs(dy) * 1.2) return;
            if (dy < 0) return;
            if (dy > 0 && screen.scrollTop <= 1) { isMinimizing = true; screen.style.willChange = 'transform, border-radius'; }
        }
        if (!isMinimizing || dy <= 0) return;
        e.preventDefault();
        const progress   = Math.min(dy / 380, 1);
        const resistance = dy * (1 - progress * 0.3);
        screen.style.transform    = `translateY(${resistance}px) scale(${1 - progress * 0.08})`;
        screen.style.borderRadius = `${progress * 28}px ${progress * 28}px 0 0`;
        screen.style.opacity      = 1 - progress * 0.15;
    }, { passive: false });

    const onEnd = () => {
        if (!isMinimizing) return;
        isMinimizing = false; screen.style.willChange = '';
        const dy = lastY - startY;
        const shouldMin = velocity > 0.4 || dy > 130;
        screen.style.transition = 'transform 0.46s cubic-bezier(0.32,0.72,0,1), border-radius 0.46s cubic-bezier(0.32,0.72,0,1), opacity 0.46s ease';
        if (shouldMin) {
            screen.style.transform    = 'translateY(100%) scale(0.92)';
            screen.style.borderRadius = '28px 28px 0 0';
            screen.style.opacity      = '0.6';
            setTimeout(() => {
                screen.classList.remove('active'); screen.style.cssText = '';
                if (activePodcastId !== null || activeQAId !== null) {
                    document.getElementById('miniPlayer').classList.add('active');
                }
            }, 460);
        } else {
            screen.style.transform    = 'translateY(0) scale(1)';
            screen.style.borderRadius = '0px'; screen.style.opacity = '1';
            setTimeout(() => { screen.style.transition = screen.style.transform = screen.style.borderRadius = screen.style.opacity = ''; }, 460);
        }
    };
    document.addEventListener('touchend',    onEnd);
    document.addEventListener('touchcancel', onEnd);
}

                <img src="${img}" alt="${cat}" loading="lazy">
                <p>${cat}</p>
            </div>`;
    }).join('');
    document.getElementById('qaCategorySlides').innerHTML = allBtn + catBtns;
}
function filterQAByCat(cat) {
    document.getElementById('qaCurrentCat').textContent = cat || 'همه سوالات';
    renderQAGrid(cat ? QA_ITEMS.filter(q => q.category === cat) : QA_ITEMS);
}

/* ────────────────────────────────────────────
   INIT
──────────────────────────────────────────── */
async function init() {
    attachSwipeToClose('npPodcast');
    attachSwipeToClose('npQa');

    document.addEventListener('keydown', e => {
        if (e.key === 'Enter' && document.getElementById('loginOverlay').classList.contains('active')) doLogin();
    });

    // رندر اولیه (badges = 0)
    renderPodcastGrid();
    renderQAGrid(QA_ITEMS);
    renderQACategories();

    // fetch شمارش نظرات و آپدیت badges
    const [pcCounts, qaCounts] = await Promise.all([fetchAllPodcastCounts(), fetchAllQACounts()]);
    PODCASTS.forEach(p => {
        const el = document.getElementById(`pc-badge-${p.id}`);
        if (el) el.textContent = toPersian(pcCounts[p.id] || 0);
    });
    QA_ITEMS.forEach(q => {
        const el = document.getElementById(`qa-badge-${q.id}`);
        if (el) el.textContent = toPersian(qaCounts[q.id] || 0);
    });
}

window.onload = init;
</script>
</body>
</html>
