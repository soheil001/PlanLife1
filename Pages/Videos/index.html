<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ویدیوهای ماورایی • PlanLife</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
    :root {
        --gold: #d4af37;
        --gold-light: #f0d060;
        --gold-glow: rgba(212,175,55,0.35);
        --glass-bg: rgba(255,255,255,0.07);
        --glass-border: rgba(255,255,255,0.15);
        --glass-shine: rgba(255,255,255,0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        min-height: 100%;
        font-family: 'Vazirmatn', sans-serif;
        color: white;
        background: #02000d;
        overflow-x: hidden;
    }

    /* ===== GALAXY BACKGROUND ===== */
    .galaxy {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
    }

    /* Deep space base */
    .galaxy::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
            radial-gradient(ellipse 120% 80% at 60% -10%, rgba(80,20,180,0.6) 0%, transparent 55%),
            radial-gradient(ellipse 80% 60% at -10% 40%, rgba(140,40,220,0.4) 0%, transparent 50%),
            radial-gradient(ellipse 60% 50% at 100% 70%, rgba(180,50,120,0.35) 0%, transparent 50%),
            radial-gradient(ellipse 40% 40% at 50% 100%, rgba(60,10,140,0.5) 0%, transparent 60%),
            radial-gradient(ellipse 100% 100% at 50% 50%, rgba(5,0,25,0.95) 0%, transparent 100%);
    }

    /* Milky Way arm */
    .galaxy-arm {
        position: absolute;
        width: 200%;
        height: 300px;
        top: 20%;
        left: -50%;
        background: radial-gradient(ellipse 100% 100% at 50% 50%,
            rgba(180,140,255,0.12) 0%,
            rgba(120,80,220,0.06) 40%,
            transparent 70%);
        transform: rotate(-20deg);
        filter: blur(30px);
        animation: armPulse 12s ease-in-out infinite alternate;
    }
    @keyframes armPulse {
        0% { opacity: 0.6; transform: rotate(-20deg) scaleY(1); }
        100% { opacity: 1; transform: rotate(-18deg) scaleY(1.1); }
    }

    /* Nebula clouds */
    .nebula {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        animation: nebulaDrift 18s ease-in-out infinite alternate;
    }
    .nebula-1 { width: 500px; height: 300px; background: rgba(120,40,200,0.28); top: -80px; left: -100px; animation-delay: 0s; }
    .nebula-2 { width: 400px; height: 400px; background: rgba(200,60,140,0.2); top: 30%; right: -100px; animation-delay: -6s; }
    .nebula-3 { width: 350px; height: 250px; background: rgba(40,80,200,0.22); bottom: 10%; left: 10%; animation-delay: -12s; }
    .nebula-4 { width: 250px; height: 250px; background: rgba(212,175,55,0.12); top: 55%; left: 40%; animation-delay: -4s; }
    @keyframes nebulaDrift {
        0% { transform: translate(0,0) scale(1); opacity: 0.7; }
        100% { transform: translate(15px,-25px) scale(1.06); opacity: 1; }
    }

    /* Stars canvas */
    #stars { position: absolute; inset: 0; }

    /* ===== HEADER / LOGO ===== */
    .header {
        position: relative;
        z-index: 2;
        padding: 28px 24px 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .logo-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(212,175,55,0.5), rgba(212,175,55,0.15));
        border: 1px solid rgba(212,175,55,0.5);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px rgba(212,175,55,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
        font-size: 20px;
    }

    .logo-text {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 2px;
        background: linear-gradient(135deg, #ffffff 0%, var(--gold-light) 45%, var(--gold) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 16px rgba(212,175,55,0.5));
        text-transform: uppercase;
    }

    .back-btn {
        position: absolute;
        left: 24px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
        gap: 7px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.18);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 9px 16px 9px 12px;
        border-radius: 50px;
        cursor: pointer;
        text-decoration: none;
        color: rgba(255,255,255,0.8);
        font-size: 13px;
        font-weight: 600;
        font-family: 'Vazirmatn', sans-serif;
        transition: all 0.3s ease;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .back-btn::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 1px;
        border-radius: 50px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    }
    .back-btn:hover {
        background: rgba(255,255,255,0.14);
        border-color: rgba(212,175,55,0.5);
        color: var(--gold-light);
        box-shadow: 0 0 18px rgba(212,175,55,0.2), inset 0 1px 0 rgba(255,255,255,0.2);
        transform: translateY(-50%) scale(1.04);
    }
    .back-arrow {
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .back-arrow svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    /* ===== LAYOUT ===== */
    .main {
        position: relative;
        z-index: 1;
        padding: 28px 20px 80px;
        max-width: 760px;
        margin: 0 auto;
    }

    /* ===== PAGE TITLE ===== */
    .page-title {
        font-size: 24px;
        font-weight: 800;
        text-align: center;
        margin-bottom: 28px;
        color: rgba(255,255,255,0.75);
        letter-spacing: -0.3px;
    }

    /* ===== CATEGORY SCROLL (slider style) ===== */
    .cat-wrapper {
        position: relative;
        margin-bottom: 28px;
    }

    .category-scroll {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding: 6px 4px 10px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .category-scroll::-webkit-scrollbar { display: none; }

    /* fade edges */
    .cat-wrapper::before,
    .cat-wrapper::after {
        content: '';
        position: absolute;
        top: 0; bottom: 10px;
        width: 40px;
        z-index: 2;
        pointer-events: none;
    }
    .cat-wrapper::before { left: 0; background: linear-gradient(to right, rgba(2,0,13,0.8), transparent); }
    .cat-wrapper::after { right: 0; background: linear-gradient(to left, rgba(2,0,13,0.8), transparent); }

    .chip {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.18);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 13px 26px;
        border-radius: 50px;
        white-space: nowrap;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        color: rgba(255,255,255,0.75);
        position: relative;
        overflow: hidden;
        flex-shrink: 0;
    }
    .chip::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    }
    .chip.active {
        background: linear-gradient(135deg, rgba(212,175,55,0.45), rgba(212,175,55,0.2));
        border-color: rgba(212,175,55,0.75);
        color: var(--gold-light);
        box-shadow: 0 0 24px rgba(212,175,55,0.3), inset 0 1px 0 rgba(255,255,255,0.25);
        transform: scale(1.04);
    }
    .chip:hover:not(.active) {
        background: rgba(255,255,255,0.13);
        border-color: rgba(255,255,255,0.28);
        color: white;
        transform: scale(1.02);
    }

    /* ===== SECTION LABEL ===== */
    .section-label {
        font-size: 13px;
        font-weight: 700;
        color: rgba(255,255,255,0.45);
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 14px;
    }
    .section-label span { color: var(--gold); }

    /* ===== VIDEO GRID (horizontal, 3 rows) ===== */
    .video-grid {
        display: grid;
        grid-template-rows: repeat(3, auto);
        grid-auto-flow: column;
        grid-auto-columns: 220px;
        gap: 14px 13px;
        overflow-x: auto;
        padding: 6px 4px 34px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
    }
    .video-grid::-webkit-scrollbar { display: none; }

    /* ===== VIDEO CARD ===== */
    .vcard {
        width: 220px;
        border-radius: 18px;
        overflow: hidden;
        position: relative;
        cursor: pointer;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.14);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12);
        transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease;
    }
    .vcard::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
        z-index: 10;
        pointer-events: none;
    }
    .vcard:hover {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 22px 55px rgba(0,0,0,0.55), 0 0 35px var(--gold-glow), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .vcard:hover .play-glass { opacity: 1; transform: translate(-50%,-50%) scale(1); }

    .vcard-thumb {
        width: 100%;
        aspect-ratio: 16/9;
        object-fit: cover;
        display: block;
    }

    .vcard-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, transparent 25%, rgba(3,0,18,0.88) 80%);
        display: flex;
        align-items: flex-end;
        padding: 12px 13px;
    }

    .vcard-text { flex: 1; padding-left: 8px; }
    .vcard-title { font-size: 13.5px; font-weight: 700; margin-bottom: 2px; line-height: 1.3; }
    .vcard-sub { font-size: 11px; color: rgba(255,255,255,0.55); }

    /* ===== GLASS PLAY BUTTON (center hover) ===== */
    .play-glass {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%,-50%) scale(0.8);
        width: 54px; height: 54px;
        border-radius: 50%;
        background: rgba(255,255,255,0.13);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1.5px solid rgba(255,255,255,0.38);
        box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.35), 0 0 0 10px rgba(255,255,255,0.04);
        display: flex; align-items: center; justify-content: center;
        opacity: 0;
        transition: opacity 0.28s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
        z-index: 20;
        pointer-events: none;
    }
    .play-glass::before {
        content: '';
        position: absolute; inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 28%, rgba(255,255,255,0.28) 0%, transparent 65%);
    }
    .play-tri {
        width: 0; height: 0;
        border-top: 10px solid transparent;
        border-bottom: 10px solid transparent;
        border-left: 18px solid rgba(255,255,255,0.95);
        margin-left: 4px;
        position: relative; z-index: 1;
        filter: drop-shadow(0 0 5px rgba(255,255,255,0.4));
    }

    /* Small play at card bottom */
    .play-sm {
        width: 36px; height: 36px;
        border-radius: 50%;
        background: rgba(255,255,255,0.11);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,0.28);
        box-shadow: 0 4px 14px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        position: relative;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .play-sm::before {
        content: '';
        position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(circle at 35% 28%, rgba(255,255,255,0.22) 0%, transparent 70%);
    }
    .play-sm-tri {
        width: 0; height: 0;
        border-top: 6px solid transparent;
        border-bottom: 6px solid transparent;
        border-left: 10px solid white;
        margin-left: 2px;
        position: relative; z-index: 1;
    }
    .play-sm:hover { transform: scale(1.14); box-shadow: 0 6px 22px rgba(212,175,55,0.35), inset 0 1px 0 rgba(255,255,255,0.25); }

    /* ===== POSTER ROWS (3 rows) ===== */
    .poster-row {
        display: flex;
        gap: 13px;
        overflow-x: auto;
        padding: 6px 4px 22px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
    }
    .poster-row::-webkit-scrollbar { display: none; }

    .pcard {
        width: 148px;
        flex-shrink: 0;
        cursor: pointer;
        transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }
    .pcard:hover { transform: translateY(-10px) scale(1.03); }
    .pcard:hover .pcard-play { opacity: 1; transform: scale(1); }

    .pcard-img-wrap {
        position: relative;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 6px 24px rgba(0,0,0,0.5);
        border: 1px solid rgba(255,255,255,0.13);
    }
    .pcard-img-wrap::before {
        content: '';
        position: absolute; top: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
        z-index: 2;
    }
    .pcard-img {
        width: 100%;
        aspect-ratio: 2/3;
        object-fit: cover;
        display: block;
    }
    .pcard-play {
        position: absolute;
        bottom: 9px; left: 9px;
        width: 34px; height: 34px;
        border-radius: 50%;
        background: rgba(255,255,255,0.14);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.32);
        box-shadow: 0 4px 14px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.22);
        display: flex; align-items: center; justify-content: center;
        z-index: 5;
        opacity: 0;
        transform: scale(0.78);
        transition: opacity 0.25s, transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
    }
    .pcard-play-tri {
        width: 0; height: 0;
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
        border-left: 9px solid white;
        margin-left: 2px;
    }
    .pcard-info { padding: 9px 2px 0; }
    .pcard-title { font-size: 12.5px; font-weight: 700; color: white; line-height: 1.3; margin-bottom: 2px; }
    .pcard-sub { font-size: 10.5px; color: rgba(255,255,255,0.45); }

    /* ===== MODAL ===== */
    #modal {
        position: fixed; inset: 0;
        background: rgba(0,0,8,0.92);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        z-index: 999;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .modal-box {
        width: 100%; max-width: 780px;
        background: rgba(15,8,40,0.88);
        border: 1px solid rgba(255,255,255,0.13);
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 40px 100px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,255,255,0.13);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
    }
    .modal-top {
        padding: 15px 18px;
        display: flex; justify-content: space-between; align-items: center;
        border-bottom: 1px solid rgba(255,255,255,0.07);
        background: rgba(255,255,255,0.03);
    }
    .modal-title-text { font-size: 16px; font-weight: 700; }
    .modal-close {
        width: 30px; height: 30px;
        border-radius: 50%;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.18);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; font-size: 15px; color: rgba(255,255,255,0.8);
        transition: background 0.2s;
    }
    .modal-close:hover { background: rgba(255,255,255,0.18); }
    video { width: 100%; display: block; }

    .mt { margin-top: 28px; }
    .mb { margin-bottom: 14px; }
</style>
</head>

<script>
/* ===== STARS CANVAS ===== */
(function() {
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function createStars() {
        stars = [];
        const count = Math.floor((canvas.width * canvas.height) / 3000);
        for (let i = 0; i < count; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 1.4 + 0.2,
                alpha: Math.random() * 0.7 + 0.2,
                speed: Math.random() * 0.008 + 0.002,
                offset: Math.random() * Math.PI * 2,
                color: Math.random() > 0.85 ? '#ffd080' : (Math.random() > 0.7 ? '#c0b0ff' : '#ffffff')
            });
        }
    }

    let t = 0;
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        t += 0.012;
        stars.forEach(s => {
            const a = s.alpha * (0.6 + 0.4 * Math.sin(t * s.speed * 60 + s.offset));
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = s.color.replace(')', `,${a})`).replace('rgb', 'rgba').replace('#ffffff', `rgba(255,255,255,${a})`).replace('#ffd080', `rgba(255,208,128,${a})`).replace('#c0b0ff', `rgba(192,176,255,${a})`);
            ctx.fill();
        });
        requestAnimationFrame(draw);
    }

    resize();
    createStars();
    draw();
    window.addEventListener('resize', () => { resize(); createStars(); });
})();

/* ===== PLAY ===== */
function play(id) {
    const v = data.find(x => x.id === id);
    if (!v) return;
    document.getElementById('mTitle').textContent = v.title;
    document.getElementById('vPlayer').src = v.src;
    document.getElementById('modal').style.display = 'flex';
    document.getElementById('vPlayer').play();
}

function closeModal() {
    const p = document.getElementById('vPlayer');
    p.pause(); p.src = '';
    document.getElementById('modal').style.display = 'none';
}

/* ===== RENDER GRID ===== */
function renderGrid(items) {
    const g = document.getElementById('vGrid');
    g.innerHTML = '';
    items.forEach(v => {
        const d = document.createElement('div');
        d.className = 'vcard';
        d.innerHTML = `
            <img src="${v.cover}" class="vcard-thumb" alt="${v.title}" loading="lazy">
            <div class="play-glass"><div class="play-tri"></div></div>
            <div class="vcard-overlay">
                <div class="vcard-text">
                    <div class="vcard-title">${v.title}</div>
                    <div class="vcard-sub">${v.sub}</div>
                </div>
                <div class="play-sm" onclick="event.stopPropagation();play(${v.id})">
                    <div class="play-sm-tri"></div>
                </div>
            </div>`;
        d.onclick = () => play(v.id);
        g.appendChild(d);
    });
}

/* ===== RENDER POSTERS (3 rows) ===== */
function renderPosters(items) {
    const rows = [
        document.getElementById('pRow1'),
        document.getElementById('pRow2'),
        document.getElementById('pRow3')
    ];
    rows.forEach(r => r.innerHTML = '');

    const third = Math.ceil(items.length / 3);
    const chunks = [items.slice(0, third), items.slice(third, third*2), items.slice(third*2)];

    chunks.forEach((chunk, ri) => {
        chunk.forEach(v => {
            const d = document.createElement('div');
            d.className = 'pcard';
            d.innerHTML = `
                <div class="pcard-img-wrap">
                    <img src="${v.cover}" class="pcard-img" alt="${v.title}" loading="lazy">
                    <div class="pcard-play"><div class="pcard-play-tri"></div></div>
                </div>
                <div class="pcard-info">
                    <div class="pcard-title">${v.title}</div>
                    <div class="pcard-sub">${v.sub}</div>
                </div>`;
            d.onclick = () => play(v.id);
            rows[ri].appendChild(d);
        });
    });
}

/* ===== FILTER ===== */
function filter(cat, el) {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    const items = cat === 'all' ? data : data.filter(v => v.cat === cat);
    renderGrid(items);
    renderPosters(items);
}

/* ===== INIT ===== */
renderGrid(data);
renderPosters(data);

document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});
