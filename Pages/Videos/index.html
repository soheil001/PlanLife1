<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ویدیوهای ماورایی • PlanLife</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
    :root {
        --gold: #d4af37;
        --gold-light: #f0d060;
        --gold-glow: rgba(212,175,55,0.35);
        --glass-bg: rgba(255,255,255,0.07);
        --glass-border: rgba(255,255,255,0.15);
        --reel-w: 148px;
        --reel-h: 263px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        min-height: 100%;
        font-family: 'Vazirmatn', sans-serif;
        color: white;
        background: #02000d;
        overflow-x: hidden;
    }

    /* ===== GALAXY BACKGROUND ===== */
    .galaxy { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .galaxy::before {
        content: '';
        position: absolute; inset: 0;
        background:
            radial-gradient(ellipse 120% 80% at 60% -10%, rgba(80,20,180,0.6) 0%, transparent 55%),
            radial-gradient(ellipse 80% 60% at -10% 40%, rgba(140,40,220,0.4) 0%, transparent 50%),
            radial-gradient(ellipse 60% 50% at 100% 70%, rgba(180,50,120,0.35) 0%, transparent 50%),
            radial-gradient(ellipse 40% 40% at 50% 100%, rgba(60,10,140,0.5) 0%, transparent 60%),
            radial-gradient(ellipse 100% 100% at 50% 50%, rgba(5,0,25,0.95) 0%, transparent 100%);
    }
    .galaxy-arm {
        position: absolute; width: 200%; height: 300px; top: 20%; left: -50%;
        background: radial-gradient(ellipse 100% 100% at 50% 50%, rgba(180,140,255,0.12) 0%, rgba(120,80,220,0.06) 40%, transparent 70%);
        transform: rotate(-20deg); filter: blur(30px);
        animation: armPulse 12s ease-in-out infinite alternate;
    }
    @keyframes armPulse {
        0% { opacity: 0.6; transform: rotate(-20deg) scaleY(1); }
        100% { opacity: 1; transform: rotate(-18deg) scaleY(1.1); }
    }
    .nebula { position: absolute; border-radius: 50%; filter: blur(60px); animation: nebulaDrift 18s ease-in-out infinite alternate; }
    .nebula-1 { width: 500px; height: 300px; background: rgba(120,40,200,0.28); top: -80px; left: -100px; animation-delay: 0s; }
    .nebula-2 { width: 400px; height: 400px; background: rgba(200,60,140,0.2); top: 30%; right: -100px; animation-delay: -6s; }
    .nebula-3 { width: 350px; height: 250px; background: rgba(40,80,200,0.22); bottom: 10%; left: 10%; animation-delay: -12s; }
    .nebula-4 { width: 250px; height: 250px; background: rgba(212,175,55,0.12); top: 55%; left: 40%; animation-delay: -4s; }
    @keyframes nebulaDrift {
        0% { transform: translate(0,0) scale(1); opacity: 0.7; }
        100% { transform: translate(15px,-25px) scale(1.06); opacity: 1; }
    }
    #stars { position: absolute; inset: 0; }

    /* ===== HEADER ===== */
    .header {
        position: relative; z-index: 2;
        padding: 52px 24px 20px;
        display: flex; align-items: center; justify-content: center;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
        width: 42px; height: 42px; border-radius: 12px;
        background: linear-gradient(135deg, rgba(212,175,55,0.5), rgba(212,175,55,0.15));
        border: 1px solid rgba(212,175,55,0.5);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 20px rgba(212,175,55,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
        font-size: 20px;
    }
    .logo-text {
        font-size: 26px; font-weight: 900; letter-spacing: 2px;
        background: linear-gradient(135deg, #ffffff 0%, var(--gold-light) 45%, var(--gold) 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        filter: drop-shadow(0 0 16px rgba(212,175,55,0.5)); text-transform: uppercase;
    }
    .back-btn {
        position: absolute; left: 24px; top: 50%; transform: translateY(-50%);
        display: flex; align-items: center; gap: 7px;
        background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        padding: 9px 16px 9px 12px; border-radius: 50px;
        cursor: pointer; text-decoration: none; color: rgba(255,255,255,0.8);
        font-size: 13px; font-weight: 600; font-family: 'Vazirmatn', sans-serif;
        transition: all 0.3s ease; box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .back-btn:hover {
        background: rgba(255,255,255,0.14); border-color: rgba(212,175,55,0.5); color: var(--gold-light);
        box-shadow: 0 0 18px rgba(212,175,55,0.2), inset 0 1px 0 rgba(255,255,255,0.2);
        transform: translateY(-50%) scale(1.04);
    }
    .back-arrow { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .back-arrow svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    /* ===== LAYOUT ===== */
    .main { position: relative; z-index: 1; padding: 0 0 80px; }

    /* ===== PAGE TITLE ===== */
    .page-title {
        font-size: 22px; font-weight: 800; text-align: center;
        margin-bottom: 28px; padding: 0 20px;
        color: rgba(255,255,255,0.75); letter-spacing: -0.3px;
    }

    /* ===== SECTION LABEL ===== */
    .section-label {
        font-size: 19px; font-weight: 900;
        color: rgba(255,255,255,0.55); letter-spacing: 0.5px;
        margin-bottom: 16px;
        padding: 0 20px;
        font-family: 'Vazirmatn', sans-serif;
    }
    .section-label span { color: var(--gold); }
    .section-label em { color: rgba(255,255,255,0.3); font-style: normal; font-size: 14px; font-weight: 500; }

    /* ===== DOCS SECTION ===== */
    /* 2-row horizontal scroll grid */
    .docs-scroll {
        display: grid;
        grid-template-rows: repeat(2, auto);
        grid-auto-flow: column;
        grid-auto-columns: 195px;
        gap: 14px 16px;
        overflow-x: auto;
        padding: 6px 20px 20px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
    }
    .docs-scroll::-webkit-scrollbar { display: none; }

    /* Doc card — glass bg, rounded cover inside */
    .dcard {
        flex-shrink: 0;
        width: 195px;
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.15);
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
        border-radius: 22px;
        padding: 12px;
        cursor: pointer;
        transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.14);
        position: relative;
        overflow: hidden;
    }
    .dcard::before {
        content: '';
        position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        pointer-events: none;
    }
    .dcard:hover {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 0 40px var(--gold-glow), inset 0 1px 0 rgba(255,255,255,0.18);
    }
    .dcard:hover .play-overlay { opacity: 1; }
    .dcard:hover .play-btn-lg { transform: translate(-50%,-50%) scale(1); opacity: 1; }

    .dcard-thumb-wrap {
        position: relative;
        border-radius: 14px;
        overflow: hidden;
    }
    .dcard-thumb {
        width: 100%;
        aspect-ratio: 16/9;
        object-fit: cover;
        display: block;
        border-radius: 14px;
    }
    .play-overlay {
        position: absolute; inset: 0; border-radius: 14px;
        background: rgba(0,0,0,0.3);
        opacity: 0; transition: opacity 0.25s;
    }
    .play-btn-lg {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%,-50%) scale(0.75);
        opacity: 0;
        width: 52px; height: 52px; border-radius: 50%;
        background: rgba(255,255,255,0.16);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border: 1.5px solid rgba(255,255,255,0.4);
        box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.35), 0 0 0 8px rgba(255,255,255,0.05);
        display: flex; align-items: center; justify-content: center;
        transition: transform 0.32s cubic-bezier(0.34,1.56,0.64,1), opacity 0.28s ease;
        z-index: 5;
    }
    .play-btn-lg::before {
        content: '';
        position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(circle at 35% 28%, rgba(255,255,255,0.3) 0%, transparent 65%);
    }
    .play-tri-lg {
        width: 0; height: 0;
        border-top: 10px solid transparent;
        border-bottom: 10px solid transparent;
        border-left: 18px solid rgba(255,255,255,0.95);
        margin-left: 4px; position: relative; z-index: 1;
        filter: drop-shadow(0 0 6px rgba(255,255,255,0.5));
    }

    .dcard-info { padding: 10px 4px 2px; }
    .dcard-title { font-size: 13.5px; font-weight: 700; margin-bottom: 3px; line-height: 1.3; }
    .dcard-sub { font-size: 11px; color: rgba(255,255,255,0.5); }

    /* ===== SECTION DIVIDER ===== */
    .section-gap { height: 36px; }

    /* ===== PLANLIFE REELS SECTION ===== */
    /* 2 rows, each independently scrollable, reel size */
    .reel-row-wrap {
        margin-bottom: 14px;
        overflow: hidden;
    }
    .reel-row {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding: 4px 20px 12px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
    }
    .reel-row::-webkit-scrollbar { display: none; }

    /* Reel card — Instagram reel proportions */
    .rcard {
        flex-shrink: 0;
        width: var(--reel-w);
        height: var(--reel-h);
        border-radius: 16px;
        overflow: hidden;
        position: relative;
        cursor: pointer;
        border: 1px solid rgba(255,255,255,0.13);
        box-shadow: 0 6px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12);
        transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease;
        background: #0a0618;
    }
    .rcard::before {
        content: '';
        position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
        z-index: 10; pointer-events: none;

    .rcard:hover {
        transform: translateY(-8px) scale(1.03);
        box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px var(--gold-glow);
    }
    .rcard:hover .rplay { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    .rcard:hover .roverlay { opacity: 1; }

    .rcard-img {
        width: 100%; height: 100%;
        object-fit: cover; display: block;
    }
    .roverlay {
        position: absolute; inset: 0;
        background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, transparent 35%, rgba(3,0,18,0.85) 80%);
        opacity: 0.7;
        transition: opacity 0.25s;
    }
    .rplay {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%,-50%) scale(0.78);
        opacity: 0;
        width: 52px; height: 52px; border-radius: 50%;
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
        border: 1.5px solid rgba(255,255,255,0.42);
        box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.4), 0 0 0 10px rgba(255,255,255,0.04);
        display: flex; align-items: center; justify-content: center;
        transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s;
        z-index: 10;
    }
    .rplay::before {
        content: '';
        position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(circle at 35% 28%, rgba(255,255,255,0.3) 0%, transparent 65%);
    }
    .rplay-tri {
        width: 0; height: 0;
        border-top: 9px solid transparent;
        border-bottom: 9px solid transparent;
        border-left: 16px solid rgba(255,255,255,0.95);
        margin-left: 3px; position: relative; z-index: 1;
        filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
    }
    .rcard-num {
        position: absolute; top: 9px; right: 9px;
        background: rgba(0,0,0,0.4);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 20px;
        font-size: 10px; font-weight: 700;
        color: rgba(255,255,255,0.8);
        padding: 3px 8px;
        z-index: 11;
        letter-spacing: 0.5px;
    }
    .rcard-bottom {
        position: absolute; bottom: 0; left: 0; right: 0;
        padding: 10px 10px;
        z-index: 10;
    }
    .rcard-title { font-size: 12px; font-weight: 700; line-height: 1.3; margin-bottom: 1px; }
    .rcard-sub { font-size: 10px; color: rgba(255,255,255,0.5); }

    /* ===== BELIEF / TAQVIYAT SECTION ===== */
    /* 4 rows, each independently scrollable */
    .belief-row-wrap { margin-bottom: 14px; }
    .belief-row {
        display: flex; gap: 10px;
        overflow-x: auto;
        padding: 4px 20px 12px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
    }
    .belief-row::-webkit-scrollbar { display: none; }

    /* Same reel size as above */
    .bcard {
        flex-shrink: 0;
        width: var(--reel-w);
        height: var(--reel-h);
        border-radius: 16px;
        overflow: hidden;
        position: relative;
        cursor: pointer;
        border: 1px solid rgba(255,255,255,0.13);
        box-shadow: 0 6px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12);
        transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease;
        background: #06030f;
    }
    .bcard::before {
        content: '';
        position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(212,175,55,0.35), transparent);
        z-index: 10; pointer-events: none;
    }
    .bcard:hover {
        transform: translateY(-8px) scale(1.03);
        box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(212,175,55,0.25);
    }
    .bcard:hover .bplay { opacity: 1; transform: translate(-50%,-50%) scale(1); }

    .bcard-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .boverlay {
        position: absolute; inset: 0;
        background: linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, transparent 35%, rgba(3,0,18,0.88) 80%);
    }
    .bplay {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%,-50%) scale(0.78);
        opacity: 0;
        width: 52px; height: 52px; border-radius: 50%;
        background: rgba(212,175,55,0.18);
        backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
        border: 1.5px solid rgba(212,175,55,0.55);
        box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.3), 0 0 0 10px rgba(212,175,55,0.06);
        display: flex; align-items: center; justify-content: center;
        transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s;
        z-index: 10;
    }
    .bplay::before {
        content: '';
        position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(circle at 35% 28%, rgba(255,220,100,0.3) 0%, transparent 65%);
    }
    .bplay-tri {
        width: 0; height: 0;
        border-top: 9px solid transparent;
        border-bottom: 9px solid transparent;
        border-left: 16px solid rgba(255,230,120,0.95);
        margin-left: 3px; position: relative; z-index: 1;
        filter: drop-shadow(0 0 5px rgba(212,175,55,0.6));
    }
    .bcard-num {
        position: absolute; top: 9px; right: 9px;
        background: rgba(212,175,55,0.18);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(212,175,55,0.35);
        border-radius: 20px;
        font-size: 10px; font-weight: 700;
        color: var(--gold-light);
        padding: 3px 8px;

    .bcard-bottom {

        padding: 10px 10px; z-index: 10;

    .bcard-title { font-size: 12px; font-weight: 700; line-height: 1.3; margin-bottom: 1px; }
    .bcard-sub { font-size: 10px; color: rgba(255,255,255,0.5); }

    /* ===== MODAL ===== */
    #modal {
        position: fixed; inset: 0;
        background: rgba(0,0,8,0.92);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);

    .modal-box {

    }
    .modal-close:hover { background: rgba(255,255,255,0.18); }
    video { width: 100%; display: block; }
</style>

<script>
/* ===== STARS ===== */
(function() {
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    function createStars() {
        stars = [];
        const count = Math.floor((canvas.width * canvas.height) / 3000);
        for (let i = 0; i < count; i++) {
            stars.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                r: Math.random() * 1.4 + 0.2, alpha: Math.random() * 0.7 + 0.2,
                speed: Math.random() * 0.008 + 0.002, offset: Math.random() * Math.PI * 2,
                color: Math.random() > 0.85 ? 'gold' : (Math.random() > 0.7 ? 'purple' : 'white')
            });
        }
    }
    let t = 0;
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        t += 0.012;
        stars.forEach(s => {
            const a = s.alpha * (0.6 + 0.4 * Math.sin(t * s.speed * 60 + s.offset));
            const colors = { gold: `rgba(255,208,128,${a})`, purple: `rgba(192,176,255,${a})`, white: `rgba(255,255,255,${a})` };
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = colors[s.color];
            ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    resize(); createStars(); draw();
    window.addEventListener('resize', () => { resize(); createStars(); });
})();

/* ===== PLAY ===== */
function play(src, title) {
    document.getElementById('mTitle').textContent = title;
    document.getElementById('vPlayer').src = src;
    document.getElementById('modal').style.display = 'flex';
    document.getElementById('vPlayer').play();
}
function closeModal() {
    const p = document.getElementById('vPlayer');
    p.pause(); p.src = '';
    document.getElementById('modal').style.display = 'none';
}
document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

/* ===== RENDER DOCS ===== */
function renderDocs() {
    const row = document.getElementById('docsRow');
    docsData.forEach(v => {
        const d = document.createElement('div');
        d.className = 'dcard';
        d.innerHTML = `
            <div class="dcard-thumb-wrap">
                <img src="${v.cover}" class="dcard-thumb" alt="${v.title}" loading="lazy">
                <div class="play-overlay"></div>
                <div class="play-btn-lg"><div class="play-tri-lg"></div></div>
            </div>
            <div class="dcard-info">
                <div class="dcard-title">${v.title}</div>
                <div class="dcard-sub">${v.sub}</div>
            </div>`;
        d.onclick = () => play(v.src, v.title);
        row.appendChild(d);
    });
}

/* ===== RENDER REEL CARD ===== */
function makeReelCard(v, cls, playClass, playTriClass, numClass, bottomClass, titleClass, subClass) {
    const d = document.createElement('div');
    d.className = cls;
    d.innerHTML = `
        <img src="${v.cover}" class="rcard-img" alt="${v.title}" loading="lazy">
        <div class="roverlay"></div>
        <div class="${playClass}"><div class="${playTriClass}"></div></div>
        <div class="${numClass}">#${v.num}</div>
        <div class="${bottomClass}">
            <div class="${titleClass}">${v.title}</div>
            <div class="${subClass}">${v.sub}</div>
        </div>`;
    d.onclick = () => play(v.src, v.title);
    return d;
}
