<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0033">
<title>ویدیوهای ماورایی • PlanLife</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: 'Vazirmatn', sans-serif;
        color: white;
        background: #030303;
    }

    .stars { 
        position: fixed; inset: 0; background: transparent; z-index: 1; pointer-events: none; 
    }
    .stars::before, .stars::after {
        content: ''; position: absolute; inset: 0;
        background-image: radial-gradient(white 1px, transparent 1px);
        background-size: 80px 80px; opacity: 0.45; animation: twinkle 10s infinite alternate;
    }

    .main-center {
        padding: 30px 20px 50px;
        max-width: 720px;
        margin: 0 auto;
    }

    .page-title {
        font-size: 34px;
        font-weight: 900;
        text-align: center;
        margin-bottom: 25px;
        color: #ffd700;
        text-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
    }

    /* دسته‌بندی‌های افقی */
    .category-scroll {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding: 12px 0 25px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
    }
    .category-scroll::-webkit-scrollbar { display: none; }

    .category-chip {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(212, 175, 55, 0.4);
        padding: 10px 22px;
        border-radius: 30px;
        white-space: nowrap;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
    }
    .category-chip.active {
        background: #d4af37;
        color: #1a0033;
        border-color: #d4af37;
    }

    /* لیست مستند ها - ۳ ردیف با اسکرول افقی */
    .video-list {
        display: grid;
        grid-template-rows: repeat(3, auto);
        grid-auto-flow: column;
        grid-auto-columns: 240px;
        gap: 18px 14px;
        overflow-x: auto;
        padding: 10px 5px 40px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .video-list::-webkit-scrollbar { display: none; }

    .video-card {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(212, 175, 55, 0.35);
        border-radius: 18px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s;
        width: 240px;
        flex-shrink: 0;
    }
    .video-card:hover { 
        transform: translateY(-12px) scale(1.02); 
        box-shadow: 0 20px 60px rgba(212, 175, 55, 0.25);
    }

    .video-cover {
        width: 100%;
        aspect-ratio: 16/9;
        object-fit: cover;
        display: block;
    }

    .video-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, transparent 35%, rgba(0,0,0,0.85) 80%);
        display: flex;
        align-items: flex-end;
        padding: 16px 14px;
    }

    .video-info {
        flex: 1;
        padding-right: 8px;
    }
    .video-title {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 3px;
        line-height: 1.3;
    }
    .video-subtitle {
        font-size: 12px;
        opacity: 0.75;
        line-height: 1.2;
    }

    .play-btn {
        width: 44px;
        height: 44px;
        background: #d4af37;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.7);
        flex-shrink: 0;
        transition: transform 0.2s;
    }
    .play-btn:hover {
        transform: scale(1.1);
    }
    .play-btn .triangle {
        width: 0;
        height: 0;
        border-top: 9px solid transparent;
        border-bottom: 9px solid transparent;
        border-left: 15px solid #1a0033;
        margin-left: 3px;
    }

    /* هر ردیف پیشنهادها - اسکرول افقی مستقل */
    .poster-list {
        display: flex;
        flex-direction: row;
        gap: 14px;
        overflow-x: auto;
        padding: 10px 5px 30px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .poster-list::-webkit-scrollbar { display: none; }

    .poster-card {
        background: transparent;
        border: none;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        width: 168px;
        flex-shrink: 0;
    }
    .poster-card:hover {
        transform: translateY(-10px) scale(1.03);
    }

    .poster-cover {
        width: 100%;
        aspect-ratio: 2 / 3;           /* دقیقاً مثل پوسترهای اپل تی‌وی */
        object-fit: cover;
        border-radius: 14px;
        display: block;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .poster-info {
        padding: 10px 4px 0;
    }
    .poster-title {
        font-size: 13.5px;
        font-weight: 700;
        color: #fff;
        line-height: 1.35;
        margin-bottom: 2px;
    }
    .poster-subtitle {
        font-size: 11.5px;
        color: #aaa;
        opacity: 0.85;
    }

    /* مودال پخش ویدیو */
    #videoModal {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.95);
        z-index: 500;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .modal-content {
        width: 100%;
        max-width: 800px;
        background: #111;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0,0,0,0.8);
    }
    .modal-header {
        padding: 16px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #1a1a1a;
    }
    .modal-close {
        font-size: 28px;
        color: #d4af37;
        cursor: pointer;
    }
    video {
        width: 100%;
        display: block;
    }

    /* بخش عنوان مثل اپل تی‌وی */
    .section-header {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #ffd700;
        padding-left: 5px;
    }
</style>

// ==================== بارگذاری ویدیوها (اسکرول افقی) ====================
function loadVideos(filter = 'all', containerId = 'videoList') {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';

    let filtered = filter === 'all' 
        ? videoData 
        : videoData.filter(v => v.category === filter);

    filtered.forEach(video => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
            <img src="${video.cover}" class="video-cover" alt="${video.title}">
            <div class="video-overlay">
                <div class="video-info">
                    <div class="video-title">${video.title}</div>
                    <div class="video-subtitle">${video.subtitle}</div>
                </div>
                <div class="play-btn" onclick="event.stopImmediatePropagation(); playVideo(${video.id})">
                    <div class="triangle"></div>
                </div>
            </div>
        `;
        card.onclick = () => playVideo(video.id);
        container.appendChild(card);
    });
}

// ==================== بارگذاری لیست پایین (پوستر مثل اپل تی‌وی) ====================
function loadPosters(filter = 'all') {
    const row1 = document.getElementById('posterRow1');
    const row2 = document.getElementById('posterRow2');
    if (!row1 || !row2) return;
    
    row1.innerHTML = '';
    row2.innerHTML = '';

    let filtered = filter === 'all' 
        ? videoData 
        : videoData.filter(v => v.category === filter);

    // ردیف اول: ۶ ویدیو اول
    const firstRow = filtered.slice(0, 6);
    firstRow.forEach(video => {
        const card = document.createElement('div');
        card.className = 'poster-card';
        card.innerHTML = `
            <img src="${video.cover}" class="poster-cover" alt="${video.title}">
            <div class="poster-info">
                <div class="poster-title">${video.title}</div>
                <div class="poster-subtitle">${video.subtitle}</div>
            </div>
        `;
        card.onclick = () => playVideo(video.id);
        row1.appendChild(card);
    });

    // ردیف دوم: بقیه ویدیوها (۶ تا)
    const secondRow = filtered.slice(6, 12);
    secondRow.forEach(video => {
        const card = document.createElement('div');
        card.className = 'poster-card';
        card.innerHTML = `
            <img src="${video.cover}" class="poster-cover" alt="${video.title}">
            <div class="poster-info">
                <div class="poster-title">${video.title}</div>
                <div class="poster-subtitle">${video.subtitle}</div>
            </div>
        `;
        card.onclick = () => playVideo(video.id);
        row2.appendChild(card);
    });
}

// ==================== پخش ویدیو ====================
function playVideo(id) {
    const video = videoData.find(v => v.id === id);
    if (!video) return;

    const modal = document.getElementById('videoModal');
    const player = document.getElementById('videoPlayer');
    const title = document.getElementById('modalTitle');

    title.textContent = video.title;
    player.src = video.src;
    modal.style.display = 'flex';
    player.play();
}

function closeVideoModal() {
    const modal = document.getElementById('videoModal');
    const player = document.getElementById('videoPlayer');
    player.pause();
    player.src = '';
    modal.style.display = 'none';
}

// ==================== فیلتر دسته‌بندی ====================
function filterVideos(category) {
    // حذف کلاس active از همه
    document.querySelectorAll('.category-chip').forEach(chip => {
        chip.classList.remove('active');
    });

    // اضافه کردن کلاس active به چیپ کلیک‌شده
    if (event && event.target) {
        event.target.classList.add('active');
    }

    // بارگذاری مجدد هر دو لیست با فیلتر
    loadVideos(category, 'videoList');
    loadPosters(category);
}

// ==================== شروع ====================
window.onload = () => {
    loadVideos('all', 'videoList');   // لیست بالا - مستند ها (اندازه قبلی)
    loadPosters('all');               // لیست پایین - پوستر مثل اپل تی‌وی
};
