        background: rgba(10, 10, 25, 0.96);
        backdrop-filter: blur(30px);

        will-change: transform;
    }

    .player-topbar {
        width: 100%; max-width: 380px;
        display: flex; justify-content: space-between; align-items: center;
        padding: 8px 0 16px;

        width: 100%; max-width: 310px; margin: 10px 0 20px;

        border-radius: 24px;
        box-shadow: 0 25px 70px rgba(192, 38, 211, 0.55);
    }

    .track-info {
        text-align: center; width: 100%; max-width: 360px; margin-bottom: 16px;
    }
    .np-title { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
    .np-subtitle { font-size: 16.5px; opacity: 0.7; }

        width: 100%; max-width: 360px; margin-bottom: 28px;
    }
    .progress-container {
        width: 100%; height: 5px; background: rgba(255,255,255,0.18);
        border-radius: 999px; cursor: pointer; margin-bottom: 8px;
    }
    .progress-bar {
        height: 100%; background: linear-gradient(to right, #ff9500, #ff6b00);
        border-radius: 999px; box-shadow: 0 0 12px #ff9500;
    }
    .time-display {
        display: flex; justify-content: space-between;
        font-size: 13.5px; opacity: 0.75;
    }

    .main-controls {
        display: flex; align-items: center; justify-content: space-between;
        width: 100%; max-width: 360px; padding: 0 10px; margin-bottom: 30px;
    }
    .control-btn {
        width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
        cursor: pointer;
    }
    .control-btn svg { width: 30px; height: 30px; fill: #ddd; transition: all 0.2s; }
    .control-btn:active svg { fill: #ff9500; transform: scale(0.9); }

        box-shadow: 0 10px 30px rgba(255, 149, 0, 0.65); cursor: pointer;

    .play-main svg { width: 36px; height: 36px; fill: #1a0033; }

    .comments-section {
        width: 100%;

        margin-top: 10px;
        padding-bottom: 30px;
    }

        max-height: 240px;

        padding-right: 4px;
        margin-bottom: 14px;

    }

        backdrop-filter: blur(12px);

        display: none; align-items: center; justify-content: center;

<header style="position:fixed;top:0;left:0;right:0;height:65px;background:rgba(0,0,0,0.3);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:100;">

// ===== متغیرهای سراسری =====
let currentTrackIndex = 0;
let currentPodcastId = null;
let isAdmin = false;
let allComments = {}; // { podcastId: [ {id, name, text, time}, ... ] }

const ADMIN_USER = 'Admin';
const ADMIN_PASS = '12345';

const audio = document.getElementById('mainAudio');
const progressBar = document.getElementById('progressBar');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const progressContainer = document.getElementById('progressContainer');
const statusEl = document.getElementById('playerStatus');
const playIcon = document.getElementById('playIcon');

// ===== ادمین =====
function openLogin() {
    document.getElementById('loginOverlay').classList.add('active');
    document.getElementById('loginError').style.display = 'none';
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPassword').value = '';
    setTimeout(() => document.getElementById('loginUsername').focus(), 100);
}

function closeLogin() {
    document.getElementById('loginOverlay').classList.remove('active');
}

function doLogin() {
    const u = document.getElementById('loginUsername').value.trim();
    const p = document.getElementById('loginPassword').value;
    if (u === ADMIN_USER && p === ADMIN_PASS) {
        isAdmin = true;
        closeLogin();
        updateAdminHeader();
        if (currentPodcastId) renderComments(currentPodcastId);
    } else {
        document.getElementById('loginError').style.display = 'block';
    }
}

function doLogout() {
    isAdmin = false;
    updateAdminHeader();
    if (currentPodcastId) renderComments(currentPodcastId);
}

function updateAdminHeader() {
    const area = document.getElementById('headerAuthArea');
    if (isAdmin) {
        area.innerHTML = `<div style="display:flex;align-items:center;gap:10px;">
            <span style="font-size:13px;opacity:0.7;">👑 Admin</span>
            <button onclick="doLogout()" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:999px;color:white;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;">خروج</button>
        </div>`;
    } else {
        area.innerHTML = `<button onclick="openLogin()" class="admin-badge">🔐 ورود</button>`;
    }
}

// ===== کامنت‌ها (در حافظه مرورگر، عمومی با storage API) =====
// از window.storage برای ذخیره عمومی استفاده می‌کنیم

async function loadComments(id) {
    const list = document.getElementById('commentsList');
    list.innerHTML = `<div class="loading-comments">در حال بارگذاری نظرات...</div>`;
    document.getElementById('commentCount').textContent = '...';

    try {
        const result = await window.storage.get(`planlife_comments_${id}`, true);
        const comments = result ? JSON.parse(result.value) : [];
        allComments[id] = comments;
        renderComments(id);
    } catch (e) {
        allComments[id] = allComments[id] || [];
        renderComments(id);
    }
}

async function saveComments(id) {
    try {
        await window.storage.set(`planlife_comments_${id}`, JSON.stringify(allComments[id] || []), true);
    } catch(e) {
        console.error('خطا در ذخیره‌سازی:', e);
    }
}

function renderComments(id) {
    const comments = allComments[id] || [];
    const list = document.getElementById('commentsList');
    const countEl = document.getElementById('commentCount');
    
    if (!list || !countEl) return;
    
    countEl.textContent = comments.length;
    list.innerHTML = '';
    
    if (comments.length === 0) {
        list.innerHTML = `<p style="opacity:0.6; text-align:center; padding:22px 10px; font-size:14px; line-height:1.6;">هنوز نظری ثبت نشده.<br>اولین نفر باشید و نظرتون رو بنویسید!</p>`;
        return;
    }
    
    comments.forEach(c => {
        const div = document.createElement('div');
        div.style.cssText = 'background:rgba(255,255,255,0.085); border-radius:14px; padding:13px 15px; margin-bottom:9px; border:1px solid rgba(255,255,255,0.06);';
        div.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:7px;">
                <strong style="color:#ffd700; font-size:14.5px;">${c.name}</strong>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span style="font-size:11.5px; opacity:0.55; white-space:nowrap;">${c.time}</span>
                    ${isAdmin ? `<button class="delete-btn" onclick="deleteComment(${id}, ${c.id})">🗑 حذف</button>` : ''}
                </div>
            </div>
            <p style="font-size:14.8px; line-height:1.55; margin:0; color:#f0f0f0;">${c.text}</p>
        `;
        list.appendChild(div);
    });
}

async function addComment() {
    if (!currentPodcastId) return;
    
    const nameInput = document.getElementById('commentName').value.trim() || 'ناشناس';
    const text = document.getElementById('commentText').value.trim();
    
    if (!text) {
        alert('لطفاً متن نظر را وارد کنید.');
        return;
    }
    
    if (!allComments[currentPodcastId]) allComments[currentPodcastId] = [];
    
    const now = new Date();
    const persianDate = now.toLocaleDateString('fa-IR', { year: 'numeric', month: 'short', day: 'numeric' });
    const persianTime = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
    
    allComments[currentPodcastId].unshift({
        id: Date.now(),
        name: nameInput,
        text: text,
        time: `${persianDate} • ${persianTime}`
    });
    
    await saveComments(currentPodcastId);
    renderComments(currentPodcastId);
    
    document.getElementById('commentText').value = '';
    document.getElementById('commentName').value = '';
}

async function deleteComment(podcastId, commentId) {
    if (!isAdmin) return;
    if (!confirm('این نظر حذف شود؟')) return;
    
    allComments[podcastId] = (allComments[podcastId] || []).filter(c => c.id !== commentId);
    await saveComments(podcastId);
    renderComments(podcastId);
}

// ===== پلیر =====
function formatTime(s) {
    if (!s || isNaN(s)) return "0:00";
    return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`;
}

function updateProgress() {
    if (!audio.duration) return;
    progressBar.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
    currentTimeEl.textContent = formatTime(audio.currentTime);
}

audio.addEventListener('timeupdate', updateProgress);
audio.addEventListener('loadedmetadata', () => totalTimeEl.textContent = formatTime(audio.duration));

progressContainer.addEventListener('click', e => {
    const rect = progressContainer.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
});

function updatePlayerStatus(playing) {
    statusEl.textContent = playing ? 'در حال پخش' : 'متوقف شده';
}

function playAudio(title, episode, src, cover, id) {
    document.getElementById('npTitle').textContent = title;
    document.getElementById('npSubtitle').textContent = episode;
    document.getElementById('npCover').src = cover;
    document.getElementById('nowPlayingScreen').classList.add('active');
    
    currentPodcastId = id;
    currentTrackIndex = podcastData.findIndex(item => item.id === id);
    
    audio.src = src;
    audio.play().then(() => {
        updatePlayerStatus(true);
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    }).catch(() => updatePlayerStatus(false));

    loadComments(id);
}

function togglePlay() {
    if (audio.paused) {
        audio.play();
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        updatePlayerStatus(true);
    } else {
        audio.pause();
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        updatePlayerStatus(false);
    }
}

function seek(sec) { 
    if (audio.src) audio.currentTime += sec; 
}

function prevTrack() {
    if (currentTrackIndex > 0) {
        const p = podcastData[currentTrackIndex - 1];
        playAudio(p.title, p.episode, p.src, p.cover, p.id);
    }
}

function nextTrack() {
    if (currentTrackIndex < podcastData.length - 1) {
        const n = podcastData[currentTrackIndex + 1];
        playAudio(n.title, n.episode, n.src, n.cover, n.id);
    }
}

function closeNowPlaying() {
    document.getElementById('nowPlayingScreen').classList.remove('active');
    audio.pause();
    updatePlayerStatus(false);
}

function loadPodcastPage() {
    const cats = ["باورهای ثروت","عشق و روابط","تحول حال و احساس","رشد کسب و کار","اعتماد به نفس","احساس لیاقت"];
    let h = '';
    cats.forEach(c => h += `<div onclick="selectPodcastCat('${c}')" style="min-width:140px;text-align:center;background:rgba(255,255,255,0.11);border-radius:18px;padding:10px;cursor:pointer;flex-shrink:0;"><img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg" style="width:130px;height:130px;border-radius:18px;object-fit:cover;"><p style="margin-top:10px;font-size:14.5px;font-weight:600;">${c}</p></div>`);
    document.getElementById('categorySlides').innerHTML = h;
    renderGrid(podcastData);
}

function renderGrid(items) {
    let g = '';
    items.forEach(item => {
        g += `<div onclick="playAudio('${item.title.replace(/'/g,"\\'")}','${item.episode.replace(/'/g,"\\'")}','${item.src}','${item.cover}',${item.id})" style="background:rgba(255,255,255,0.11);border-radius:22px;padding:12px;text-align:center;cursor:pointer;"><img src="${item.cover}" style="width:100%;aspect-ratio:1/1;border-radius:18px;object-fit:cover;"><div style="font-size:15.5px;font-weight:600;margin:10px 0 6px;">${item.title}<br><small style="opacity:0.75;font-weight:400;">${item.episode}</small></div><div style="width:48px;height:48px;background:#ffd700;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;"><div style="width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #1a0033;margin-left:3px;"></div></div></div>`;
    });
    document.getElementById('podcastGrid').innerHTML = g;
}

function selectPodcastCat(cat) {
    document.getElementById('currentCategoryTitle').textContent = cat;
    renderGrid(podcastData.filter(item => item.title === cat));
}
