let currentTrackIndex = 0;

const audio = document.getElementById('mainAudio');
const progressBar = document.getElementById('progressBar');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const progressContainer = document.getElementById('progressContainer');
const statusEl = document.getElementById('playerStatus');
const playIcon = document.getElementById('playIcon');

function formatTime(s) {
    if (!s || isNaN(s)) return "0:00";
    return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`;
}

function updateProgress() {
    if (!audio.duration) return;
    progressBar.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
    currentTimeEl.textContent = formatTime(audio.currentTime);
}

audio.addEventListener('timeupdate', updateProgress);
audio.addEventListener('loadedmetadata', () => totalTimeEl.textContent = formatTime(audio.duration));

progressContainer.addEventListener('click', e => {
    const rect = progressContainer.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
});

function updatePlayerStatus(playing) {
    statusEl.textContent = playing ? 'در حال پخش' : 'متوقف شده';
}

function playAudio(title, episode, src, cover) {
    document.getElementById('npTitle').textContent = title;
    document.getElementById('npSubtitle').textContent = episode;
    document.getElementById('npCover').src = cover;
    document.getElementById('nowPlayingScreen').classList.add('active');
    
    audio.src = src;
    audio.play().then(() => {
        updatePlayerStatus(true);
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    });
    currentTrackIndex = podcastData.findIndex(item => item.src === src);
}

function togglePlay() {
    if (audio.paused) {
        audio.play();
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        updatePlayerStatus(true);
    } else {
        audio.pause();
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        updatePlayerStatus(false);
    }
}

function seek(sec) { audio.currentTime += sec; }

function prevTrack() {
    if (currentTrackIndex > 0) {
        const p = podcastData[currentTrackIndex - 1];
        playAudio(p.title, p.episode, p.src, p.cover);
    }
}

function nextTrack() {
    if (currentTrackIndex < podcastData.length - 1) {
        const n = podcastData[currentTrackIndex + 1];
        playAudio(n.title, n.episode, n.src, n.cover);
    }
}

function closeNowPlaying() {
    document.getElementById('nowPlayingScreen').classList.remove('active');
    audio.pause();
    updatePlayerStatus(false);
}

function showMenu() { alert("منو"); }
function goToHome() { window.location.href = "https://planlife.ir"; }

function loadPodcastPage() {
    const cats = ["باورهای ثروت","عشق و روابط","تحول حال و احساس","رشد کسب و کار","اعتماد به نفس","احساس لیاقت"];
    let h = '';
    cats.forEach(c => h += `<div onclick="selectPodcastCat('${c}')" style="min-width:140px;text-align:center;background:rgba(255,255,255,0.11);border-radius:18px;padding:10px;cursor:pointer;"><img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg" style="width:130px;height:130px;border-radius:18px;"><p>${c}</p></div>`);
    document.getElementById('categorySlides').innerHTML = h;

    let g = '';
    podcastData.forEach(item => {
        g += `<div onclick="playAudio('${item.title}','${item.episode}','${item.src}','${item.cover}')" style="background:rgba(255,255,255,0.11);border-radius:22px;padding:12px;text-align:center;cursor:pointer;"><img src="${item.cover}" style="width:100%;aspect-ratio:1/1;border-radius:18px;"><div style="font-size:15.5px;font-weight:600;margin:10px 0;">${item.title}<br><small>${item.episode}</small></div><div style="width:48px;height:48px;background:#ffd700;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;"><div style="width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #1a0033;margin-left:3px;"></div></div></div>`;
    });
    document.getElementById('podcastGrid').innerHTML = g;
}

function selectPodcastCat(cat) {
    document.getElementById('currentCategoryTitle').textContent = cat;
    let g = '';
    const filtered = podcastData.filter(item => item.title === cat);
    filtered.forEach(item => {
        g += `<div onclick="playAudio('${item.title}','${item.episode}','${item.src}','${item.cover}')" style="background:rgba(255,255,255,0.11);border-radius:22px;padding:12px;text-align:center;cursor:pointer;"><img src="${item.cover}" style="width:100%;aspect-ratio:1/1;border-radius:18px;"><div style="font-size:15.5px;font-weight:600;margin:10px 0;">${item.title}<br><small>${item.episode}</small></div><div style="width:48px;height:48px;background:#ffd700;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;"><div style="width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #1a0033;margin-left:3px;"></div></div></div>`;
    });
    document.getElementById('podcastGrid').innerHTML = g;
}

window.onload = loadPodcastPage;
</script>
