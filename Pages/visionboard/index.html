<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2026 Vision Board</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* ── PAGE ── */
html, body {
  width: 100%;
  min-height: 100vh;
  background: #05010f;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* ── GALAXY BACKGROUND (static SVG noise + stars) ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, #1a0a3a 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 90%, #0a0520 0%, transparent 70%),
    radial-gradient(ellipse 50% 50% at 50% 40%, #0d0628 0%, transparent 80%),
    radial-gradient(ellipse 100% 100% at 50% 50%, #090415 0%, #02000a 100%);
  pointer-events: none;
}
/* star field layer */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  background-image:
    radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.9) 0%, transparent 100%),
    radial-gradient(1px 1px at 23% 48%, rgba(255,255,255,0.7) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 37% 8%, rgba(255,255,255,0.85) 0%, transparent 100%),
    radial-gradient(1px 1px at 52% 72%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 68% 22%, rgba(255,255,255,0.75) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 78% 55%, rgba(255,255,255,0.8) 0%, transparent 100%),
    radial-gradient(1px 1px at 91% 12%, rgba(255,255,255,0.65) 0%, transparent 100%),
    radial-gradient(1px 1px at 5% 63%, rgba(255,255,255,0.7) 0%, transparent 100%),
    radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.55) 0%, transparent 100%),
    radial-gradient(2px 2px at 44% 33%, rgba(200,180,255,0.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 60% 88%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 83% 78%, rgba(180,160,255,0.7) 0%, transparent 100%),
    radial-gradient(1px 1px at 29% 91%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 96% 43%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 72% 6%, rgba(255,255,255,0.8) 0%, transparent 100%),
    radial-gradient(2px 2px at 8% 37%, rgba(160,140,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 55% 16%, rgba(255,255,255,0.65) 0%, transparent 100%),
    radial-gradient(1px 1px at 88% 66%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 33% 59%, rgba(220,200,255,0.55) 0%, transparent 100%),
    radial-gradient(1px 1px at 47% 94%, rgba(255,255,255,0.5) 0%, transparent 100%),
    /* nebula glows */
    radial-gradient(ellipse 25% 15% at 30% 25%, rgba(120,60,200,0.12) 0%, transparent 100%),
    radial-gradient(ellipse 30% 20% at 70% 65%, rgba(60,100,200,0.1) 0%, transparent 100%),
    radial-gradient(ellipse 20% 25% at 85% 30%, rgba(200,80,120,0.08) 0%, transparent 100%);
  pointer-events: none;
}

/* ── WRAPPER ── */
.wrapper {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 430px;
  padding: 28px 16px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

/* ── TITLE ── */
.title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(34px, 9vw, 52px);
  letter-spacing: 10px;
  color: #fff;
  text-align: center;
  text-shadow:
    0 0 30px rgba(160,120,255,0.6),
    0 0 60px rgba(100,80,200,0.3);
  line-height: 1.1;
}
.title span {
  display: block;
  font-size: 0.38em;
  letter-spacing: 6px;
  color: rgba(200,180,255,0.7);
  font-weight: 300;
  margin-top: 4px;
}

/* ── GLASS BOARD ── */
.board {
  width: 100%;
  /* Instagram Reel ratio 9:16 */
  aspect-ratio: 9 / 16;
  position: relative;
  border-radius: 24px;
  overflow: hidden;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow:
    0 0 0 1px rgba(160,120,255,0.2),
    0 20px 60px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.1),
    inset 0 -1px 0 rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

/* inner shimmer edge */
.board::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 24px;
  background: linear-gradient(135deg,
    rgba(255,255,255,0.07) 0%,
    transparent 40%,
    transparent 60%,
    rgba(160,120,255,0.05) 100%);
  pointer-events: none;
  z-index: 10;
}

/* ── PHOTO SLOTS ── */
/* 18 slots, each absolutely positioned with random-looking but fixed offsets & rotations */
/* We use a 3-col × 6-row logical grid inside the board, then apply transforms */

.slot {
  position: absolute;
  cursor: pointer;
  transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s;
  z-index: 2;
}
.slot:hover { z-index: 20; }

/* photo frame */
.slot-inner {
  width: 100%;
  height: 100%;
  border-radius: 4px;
  overflow: hidden;
  background: rgba(255,255,255,0.06);
  border: 1.5px dashed rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.3);
  font-size: 22px;
  box-shadow:
    0 4px 20px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.08);
  transition: border-color 0.2s, background 0.2s;
}
.slot:hover .slot-inner {
  border-color: rgba(200,160,255,0.5);
  background: rgba(255,255,255,0.1);
}
.slot.filled .slot-inner {
  border: none;
  background: #000;
  padding: 6px;
  box-shadow:
    0 6px 24px rgba(0,0,0,0.5),
    0 2px 8px rgba(0,0,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.15);
}
.slot.filled img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: 2px;
}
.slot.filled:hover {
  transform: scale(1.06) rotate(0deg) !important;
  z-index: 25;
  box-shadow:
    0 16px 40px rgba(0,0,0,0.6),
    0 0 0 2px rgba(200,160,255,0.4);
}

/* remove btn */
.slot .rm {
  position: absolute;
  top: -9px; right: -9px;
  width: 24px; height: 24px;
  background: #e05252;
  border: 2px solid #fff;
  border-radius: 50%;
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 30;
  line-height: 1;
}
.slot.filled:hover .rm { display: flex; }

/* ── SLOT POSITIONS (18 slots, scattered) ── */
/* Board is 9:16 ratio. We'll use % coords relative to board size. */
/* Each slot: top, left, width, height (all %), rotation (deg) */

/* Row 1 — 3 slots scattered across top third */
.s0  { top:2%;  left:3%;  width:36%; height:22%; --r:-4deg; }
.s1  { top:1%;  left:34%; width:34%; height:21%; --r:2deg; }
.s2  { top:3%;  left:62%; width:33%; height:20%; --r:-2deg; }

/* Row 2 */
.s3  { top:22%; left:2%;  width:32%; height:20%; --r:3deg; }
.s4  { top:21%; left:31%; width:36%; height:21%; --r:-3deg; }
.s5  { top:23%; left:64%; width:31%; height:19%; --r:2.5deg; }

/* Row 3 */
.s6  { top:41%; left:4%;  width:34%; height:21%; --r:-2deg; }
.s7  { top:40%; left:33%; width:33%; height:22%; --r:3.5deg; }
.s8  { top:42%; left:63%; width:33%; height:20%; --r:-3deg; }

/* Row 4 */
.s9  { top:61%; left:2%;  width:33%; height:20%; --r:2deg; }
.s10 { top:60%; left:32%; width:35%; height:21%; --r:-4deg; }
.s11 { top:62%; left:63%; width:32%; height:20%; --r:3deg; }

/* Row 5 */
.s12 { top:80%; left:3%;  width:35%; height:19%; --r:-2.5deg; }
.s13 { top:79%; left:33%; width:33%; height:20%; --r:2deg; }
.s14 { top:81%; left:63%; width:33%; height:19%; --r:-3deg; }

/* Extras — 3 overlapping slots for that collage feel */
.s15 { top:11%; left:14%; width:30%; height:13%; --r:5deg; z-index:4; }
.s16 { top:51%; left:21%; width:29%; height:12%; --r:-4.5deg; z-index:4; }
.s17 { top:71%; left:38%; width:29%; height:12%; --r:3.5deg; z-index:4; }

.slot { transform: rotate(var(--r)); }

/* ── CONTROLS ── */
.controls {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

/* glassmorphism button base */
.glass-box {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 14px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.12),
    0 4px 20px rgba(0,0,0,0.3);
}

.btn {
  padding: 13px 24px;
  border: none;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: transform 0.15s, box-shadow 0.15s;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 4px 20px rgba(0,0,0,0.3);
}
.btn:active { transform: scale(0.96); }
.btn-add {
  background: linear-gradient(135deg,
    rgba(160,100,255,0.35) 0%,
    rgba(80,60,200,0.25) 100%);
  border-color: rgba(200,160,255,0.35);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.15),
    0 4px 20px rgba(120,80,200,0.25),
    0 0 20px rgba(160,100,255,0.15);
}
.btn-add:hover {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.2),
    0 6px 24px rgba(120,80,200,0.4),
    0 0 30px rgba(160,100,255,0.25);
}

.counter {
  padding: 13px 18px;
  font-size: 12px;
  font-weight: 600;
  color: rgba(200,180,255,0.8);
  letter-spacing: 1px;
}

#imageInput { display: none; }

/* ── MODAL ── */
.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  z-index: 999;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.overlay.show { display: flex; }
.modal {
  width: 100%; max-width: 340px;
  background: rgba(20,10,40,0.85);
  border: 1px solid rgba(200,160,255,0.25);
  border-radius: 20px;
  padding: 30px 24px;
  text-align: center;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.1),
    0 20px 60px rgba(0,0,0,0.5);
  position: relative;
}
.modal h2 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: 22px;
  letter-spacing: 4px;
  color: #fff;
  margin-bottom: 10px;
}
.modal p { font-size: 12px; color: rgba(200,180,255,0.6); margin-bottom: 24px; line-height: 1.7; }
.modal .close-btn {
  position: absolute; top: 14px; right: 14px;
  background: rgba(255,80,80,0.3);
  border: 1px solid rgba(255,80,80,0.4);
  color: #fff; width: 30px; height: 30px;
  border-radius: 50%; font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.modal-btns { display: flex; flex-direction: column; gap: 10px; }
.modal-btns .btn { width: 100%; padding: 14px; font-size: 13px; }

/* toast */
.toast {
  position: fixed;
  bottom: 24px; left: 50%; transform: translateX(-50%);
  background: rgba(20,10,40,0.9);
  border: 1px solid rgba(200,160,255,0.3);
  color: rgba(220,200,255,0.9);
  padding: 12px 24px;
  border-radius: 30px;
  font-size: 12px;
  letter-spacing: 1px;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 9999;
  backdrop-filter: blur(12px);
}
.toast.show { opacity: 1; }

/* sparkle dots on board corners */
.spark {
  position: absolute;
  pointer-events: none;
  z-index: 5;
  font-size: 10px;
  opacity: 0.5;
  color: rgba(220,200,255,0.7);
}
</style>
</head>
<body>

<div class="wrapper">
  <div class="title">
    VISION
    <span>2026</span>
  </div>

  <div class="board" id="board">
    <!-- sparkle decorations -->
    <span class="spark" style="top:4%;left:2%">✦</span>
    <span class="spark" style="top:4%;right:3%">✦</span>
    <span class="spark" style="top:50%;left:1%">✧</span>
    <span class="spark" style="bottom:5%;right:2%">✦</span>
    <span class="spark" style="bottom:5%;left:3%">✧</span>
    <span class="spark" style="top:25%;right:2%">·</span>
    <span class="spark" style="top:75%;left:2%">·</span>

    <!-- 18 photo slots -->
    <div class="slot s0"  data-idx="0"><div class="slot-inner">＋</div><button class="rm">✕</button></div>
    <div class="slot s1"  data-idx="1"><div class="slot-inner">＋</div><button class="rm">✕</button></div>
    <div class="slot s2"  data-idx="2"><div class="slot-inner">＋</div><button class="rm">✕</button></div>
    <div class="slot s3"  data-idx="3"><div class="slot-inner">＋</div><button class="rm">✕</button></div>
    <div class="slot s4"  data-idx="4"><div class="slot-inner">＋</div><button class="rm">✕</button></div>
    <div class="slot s5"  data-idx="5"><div class="slot-inner">＋</div><button class="rm">✕</button></div>
    <div class="slot s6"  data-idx="6"><div class="slot-inner">＋</div><button class="rm">✕</button></div>
    <div class="slot s7"  data-idx="7"><div class="slot-inner">＋</div><button class="rm">✕</button></div>
    <div class="slot s8"  data-idx="8"><div class="slot-inner">＋</div><button class="rm">✕</button></div>
    <div class="slot s9"  data-idx="9"><div class="slot-inner">＋</div><button class="rm">✕</button></div>
    <div class="slot s10" data-idx="10"><div class="slot-inner">＋</div><button class="rm">✕</button></div>
    <div class="slot s11" data-idx="11"><div class="slot-inner">＋</div><button class="rm">✕</button></div>
    <div class="slot s12" data-idx="12"><div class="slot-inner">＋</div><button class="rm">✕</button></div>
    <div class="slot s13" data-idx="13"><div class="slot-inner">＋</div><button class="rm">✕</button></div>
    <div class="slot s14" data-idx="14"><div class="slot-inner">＋</div><button class="rm">✕</button></div>
    <div class="slot s15" data-idx="15"><div class="slot-inner">＋</div><button class="rm">✕</button></div>
    <div class="slot s16" data-idx="16"><div class="slot-inner">＋</div><button class="rm">✕</button></div>
    <div class="slot s17" data-idx="17"><div class="slot-inner">＋</div><button class="rm">✕</button></div>
  </div>

  <!-- controls glass box -->
  <div class="controls">
    <div class="glass-box counter"><span id="cnt">0</span> / 18 ✦</div>
    <input type="file" id="imageInput" accept="image/*" multiple>
    <button class="btn btn-add" onclick="document.getElementById('imageInput').click()">+ افزودن عکس</button>
    <button class="btn" onclick="showModal()">↓ دانلود</button>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <h2>READY</h2>
    <p>تابلوی رویایی شما آماده دانلود است.</p>
    <div class="modal-btns">
      <button class="btn btn-add" onclick="doDownload()">↓ دانلود تصویر</button>
      <button class="btn" onclick="closeModal()">بستن</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">✦ ذخیره شد</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const KEY = 'visionGalaxy2026';
let imgs = {};

// ── init ──
window.addEventListener('DOMContentLoaded', () => {
  load();
  render();
  document.getElementById('imageInput').addEventListener('change', onFileChange);

  // slot click → open file picker, store which slot was clicked
  document.querySelectorAll('.slot').forEach(slot => {
    slot.addEventListener('click', function(e) {
      if (e.target.classList.contains('rm')) return;
      const idx = parseInt(this.dataset.idx);
      window._targetSlot = idx;
      document.getElementById('imageInput').click();
    });
    const rm = slot.querySelector('.rm');
    rm.addEventListener('click', function(e) {
      e.stopPropagation();
      const idx = parseInt(slot.dataset.idx);
      delete imgs[idx];
      save();
      render();
    });
  });

  // drag & drop
  const board = document.getElementById('board');
  board.addEventListener('dragover', e => e.preventDefault());
  board.addEventListener('drop', e => {
    e.preventDefault();
    Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/')).forEach((file, i) => {
      const idx = nextEmpty(i);
      if (idx < 0) return;
      readFile(file, idx);
    });
  });
});

function onFileChange(e) {
  const files = Array.from(e.target.files);
  const targetSlot = window._targetSlot;

  if (targetSlot !== undefined && !imgs[targetSlot]) {
    // place in specific clicked slot
    if (files[0]) readFile(files[0], targetSlot);
    // remaining go to next empty
    files.slice(1).forEach((f, i) => {
      const idx = nextEmpty();
      if (idx >= 0) readFile(f, idx);
    });
  } else {
    files.forEach(f => {
      const idx = nextEmpty();
      if (idx >= 0) readFile(f, idx);
    });
  }
  window._targetSlot = undefined;
  e.target.value = '';
}

function readFile(file, idx) {
  const r = new FileReader();
  r.onload = ev => {
    imgs[idx] = ev.target.result;
    save();
    render();
  };
  r.readAsDataURL(file);
}

function nextEmpty(startOffset = 0) {
  let count = 0;
  for (let i = 0; i < 18; i++) {
    if (!imgs[i]) {
      if (count >= startOffset) return i;
      count++;
    }
  }
  return -1;
}

function render() {
  document.querySelectorAll('.slot').forEach(slot => {
    const idx = parseInt(slot.dataset.idx);
    const inner = slot.querySelector('.slot-inner');
    let img = slot.querySelector('img');

    if (imgs[idx]) {
      slot.classList.add('filled');
      if (!img) {
        img = document.createElement('img');
        img.alt = '';
        inner.innerHTML = '';
        inner.appendChild(img);
      }
      img.src = imgs[idx];
    } else {
      slot.classList.remove('filled');
      inner.innerHTML = '＋';
      if (img) img.remove();
    }
  });
  document.getElementById('cnt').textContent = Object.keys(imgs).length;
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(imgs)); } catch(e) {}
  showToast();
}

function load() {
  try { const d = localStorage.getItem(KEY); if (d) imgs = JSON.parse(d); } catch(e) {}
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function showModal() { document.getElementById('overlay').classList.add('show'); }
function closeModal() { document.getElementById('overlay').classList.remove('show'); }

async function doDownload() {
  closeModal();
  const board = document.getElementById('board');
  try {
    const canvas = await html2canvas(board, {
      scale: 3,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#05010f',
      logging: false,
    });

    // wrap with title
    const W = canvas.width;
    const H = canvas.height;
    const titleH = Math.round(W * 0.18);
    const final = document.createElement('canvas');
    final.width = W;
    final.height = H + titleH * 2;
    const ctx = final.getContext('2d');

    // bg
    const grd = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H));
    grd.addColorStop(0, '#0d0628');
    grd.addColorStop(1, '#02000a');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, final.width, final.height);

    // title
    ctx.fillStyle = '#fff';
    ctx.font = `300 ${titleH * 0.5}px "Cormorant Garamond", Georgia, serif`;
    ctx.textAlign = 'center';
    ctx.letterSpacing = '8px';
    ctx.shadowColor = 'rgba(160,120,255,0.6)';
    ctx.shadowBlur = 30;
    ctx.fillText('VISION  2026', W / 2, titleH * 1.1);

    // board
    ctx.shadowBlur = 0;
    ctx.drawImage(canvas, 0, titleH * 1.4);

    const link = document.createElement('a');
    link.href = final.toDataURL('image/png');
    link.download = `vision-board-2026.png`;
    link.click();
  } catch(err) {
    alert('خطا در دانلود. دوباره تلاش کنید.');
  }
}

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeModal();
});
</script>
