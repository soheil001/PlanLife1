<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vision Board 2026 - PlanLife</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: rgba(15, 15, 30, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            z-index: 100;
            gap: 6px;
            flex-wrap: wrap;
            min-height: 50px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .home-btn {
            width: 38px;
            height: 38px;
            background: rgba(212, 175, 55, 0.2);
            border: 1.5px solid #d4af37;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .home-btn:active {
            background: rgba(212, 175, 55, 0.4);
            transform: scale(0.95);
        }

        .title-section {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .title-section h1 {
            font-size: 16px;
            background: linear-gradient(135deg, #d4af37 0%, #e8d96f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            white-space: nowrap;
        }

        .title-section p {
            font-size: 9px;
            color: #666;
            margin: 0;
        }

        .controls {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .counter {
            font-size: 10px;
            color: #d4af37;
            padding: 4px 8px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 4px;
            border: 0.5px solid rgba(212, 175, 55, 0.2);
            white-space: nowrap;
        }

        .btn {
            padding: 6px 10px;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 10px;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4af37 0%, #e8d96f 100%);
            color: #000;
        }

        .btn-primary:active {
            transform: scale(0.95);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn-secondary {
            background: rgba(212, 175, 55, 0.2);
            color: #d4af37;
            border: 1px solid #d4af37;
        }

        .btn-secondary:active {
            background: rgba(212, 175, 55, 0.4);
            transform: scale(0.95);
        }

        #imageInput {
            display: none;
        }

        /* Board Container */
        .board-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .viewport {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        .board-wrapper {
            position: absolute;
            transform-origin: top center;
            width: 100%;
            height: 100%;
        }

        .board {
            width: 100%;
            height: 100%;
            position: relative;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><defs><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise"/></filter></defs><rect width="300" height="300" fill="%23D4A574"/><rect width="300" height="300" fill="%23C99468" opacity="0.4" filter="url(%23noise)"/><circle cx="30" cy="40" r="1" fill="%23999" opacity="0.2"/><circle cx="120" cy="80" r="1.2" fill="%23888" opacity="0.15"/></svg>') repeat;
            background-size: 300px 300px;
        }

        /* Drop Zones */
        .drop-zone {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px dashed rgba(212, 175, 55, 0.25);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(212, 175, 55, 0.03);
            transition: all 0.3s;
            z-index: 5;
        }

        .drop-zone:active {
            border-color: rgba(212, 175, 55, 0.7);
            background: rgba(212, 175, 55, 0.15);
            transform: scale(1.05);
        }

        .drop-zone-icon {
            font-size: 28px;
            opacity: 0.6;
        }

        /* Polaroid */
        .polaroid {
            position: absolute;
            width: 110px;
            height: 140px;
            background: white;
            border: 6px solid white;
            border-bottom: 30px solid white;
            box-shadow: 2px 8px 25px rgba(0, 0, 0, 0.4);
            cursor: grab;
            user-select: none;
            font-family: 'Vazirmatn', sans-serif;
            z-index: 20;
            transition: filter 0.2s;
        }

        .polaroid:active {
            filter: brightness(1.05) drop-shadow(4px 12px 35px rgba(0, 0, 0, 0.5));
        }

        .polaroid.dragging {
            opacity: 0.85;
            cursor: grabbing;
            z-index: 1000;
            filter: drop-shadow(4px 12px 35px rgba(212, 175, 55, 0.3));
        }

        .polaroid-image {
            width: 100%;
            height: 100px;
            object-fit: cover;
            display: block;
        }

        .polaroid-label {
            position: absolute;
            bottom: 6px;
            left: 6px;
            right: 6px;
            color: #333;
            font-size: 8px;
            font-weight: 500;
            text-align: center;
            max-height: 16px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .remove-btn {
            position: absolute;
            top: -12px;
            right: -12px;
            background: #ff5555;
            border: 2px solid white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 30;
            color: white;
            font-weight: bold;
            padding: 0;
        }

        .polaroid:active .remove-btn {
            opacity: 1;
        }

        /* Decorations */
        .decoration {
            position: absolute;
            pointer-events: none;
            z-index: 8;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .decoration.icon1 {
            width: 50px;
            height: 50px;
            background-image: url('https://res.cloudinary.com/dwxaids40/image/upload/q_auto/f_auto/v1781583397/MagicEraser_260616_074119_hxs7nu.png');
        }

        .decoration.icon2 {
            width: 55px;
            height: 55px;
            background-image: url('https://res.cloudinary.com/dwxaids40/image/upload/q_auto/f_auto/v1781583399/MagicEraser_260616_074543_mjbegg.png');
        }

        .decoration.icon3 {
            width: 48px;
            height: 48px;
            background-image: url('https://res.cloudinary.com/dwxaids40/image/upload/q_auto/f_auto/v1781583400/MagicEraser_260616_074516_xggiut.png');
        }

        .decoration.icon4 {
            width: 52px;
            height: 52px;
            background-image: url('https://res.cloudinary.com/dwxaids40/image/upload/q_auto/f_auto/v1781583400/MagicEraser_260616_074459_jez5aw.png');
        }

        .decoration.icon5 {
            width: 54px;
            height: 54px;
            background-image: url('https://res.cloudinary.com/dwxaids40/image/upload/q_auto/f_auto/v1781583400/MagicEraser_260616_074340_dfwlij.png');
        }

        .decoration.icon6 {
            width: 50px;
            height: 50px;
            background-image: url('https://res.cloudinary.com/dwxaids40/image/upload/q_auto/f_auto/v1781583403/MagicEraser_260616_074313_vv9rrh.png');
        }

        .pin {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ff6b6b, #cc0000);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3), inset -1px -1px 2px rgba(0, 0, 0, 0.3);
        }

        .pin::after {
            content: '';
            position: absolute;
            width: 1.5px;
            height: 7px;
            background: #333;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
        }

        .tape {
            width: 70px;
            height: 22px;
            background: linear-gradient(45deg, rgba(255, 255, 150, 0.7), rgba(255, 255, 180, 0.8));
            border: 0.5px solid rgba(200, 180, 100, 0.5);
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.3);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: rgba(20, 20, 40, 0.95);
            backdrop-filter: blur(20px);
            border: 1.5px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 24px;
            max-width: 420px;
            width: 100%;
            color: #fff;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(255, 100, 100, 0.3);
            border: none;
            color: #ff6b6b;
            font-size: 22px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            padding: 0;
        }

        .close-modal:active {
            background: rgba(255, 100, 100, 0.5);
            transform: scale(0.95);
        }

        .modal-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
            color: #d4af37;
        }

        .modal-text {
            font-size: 11px;
            line-height: 1.6;
            margin-bottom: 18px;
            color: #aaa;
            text-align: center;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            flex-direction: column;
        }

        .modal-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 11px;
            transition: all 0.2s;
        }

        .modal-btn-primary {
            background: linear-gradient(135deg, #d4af37 0%, #e8d96f 100%);
            color: #000;
        }

        .modal-btn-primary:active {
            transform: scale(0.95);
            box-shadow: 0 6px 16px rgba(212, 175, 55, 0.3);
        }

        .modal-btn-secondary {
            background: rgba(212, 175, 55, 0.2);
            color: #d4af37;
            border: 1.5px solid #d4af37;
        }

        .modal-btn-secondary:active {
            background: rgba(212, 175, 55, 0.4);
            transform: scale(0.95);
        }

        .save-message {
            position: fixed;
            bottom: 12px;
            right: 12px;
            padding: 10px 16px;
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            border-radius: 6px;
            color: #4CAF50;
            font-size: 10px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 999;
        }

        .save-message.show {
            opacity: 1;
        }

        @media (max-width: 480px) {
            .header {
                padding: 6px 8px;
                min-height: 48px;
            }

            .title-section h1 {
                font-size: 14px;
            }

            .title-section p {
                font-size: 8px;
            }

            .btn {
                padding: 5px 8px;
                font-size: 9px;
            }

            .home-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }

            .drop-zone {
                width: 85px;
                height: 85px;
            }

            .polaroid {
                width: 95px;
                height: 120px;
            }

            .polaroid-image {
                height: 85px;
            }

            .decoration.icon1,
            .decoration.icon6 {
                width: 40px;
                height: 40px;
            }

            .decoration.icon2 {
                width: 45px;
                height: 45px;
            }

            .decoration.icon3 {
                width: 38px;
                height: 38px;
            }

            .decoration.icon4 {
                width: 42px;
                height: 42px;
            }

            .decoration.icon5 {
                width: 44px;
                height: 44px;
            }
        }

        @media (max-width: 360px) {
            .title-section h1 {
                font-size: 13px;
            }

            .drop-zone {
                width: 75px;
                height: 75px;
            }

            .polaroid {
                width: 85px;
                height: 108px;
            }

            .polaroid-image {
                height: 75px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <button class="home-btn" onclick="goHome()">🏠</button>
                <div class="title-section">
                    <h1>تابلوی رویایی</h1>
                    <p>PlanLife 2026</p>
                </div>
            </div>
            <div class="controls">
                <div class="counter"><span id="imageCount">0</span>/20</div>
                <input type="file" id="imageInput" accept="image/*" multiple>
                <button class="btn btn-primary" onclick="document.getElementById('imageInput').click()">➕</button>
                <button class="btn btn-secondary" onclick="showCompleteModal()">✓</button>
            </div>
        </div>

        <!-- Board -->
        <div class="board-container">
            <div class="viewport" id="viewport">
                <div class="board-wrapper" id="boardWrapper">
                    <div class="board" id="board"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="completeModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeCompleteModal()">✕</button>
            <div class="modal-header">تابلو آماده است! 🎯</div>
            <div class="modal-text">
                تابلوی خود را دانلود کنید. عکس‌های شما فقط در دستگاه ذخیره می‌شوند.
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-primary" onclick="downloadBoard()">
                    💾 دانلود
                </button>
                <button class="modal-btn modal-btn-secondary" onclick="closeCompleteModal()">
                    بستن
                </button>
            </div>
        </div>
    </div>

    <div class="save-message" id="saveMessage">✓ ذخیره شد</div>

    <script>
        const STORAGE_KEY = 'visionBoard2026';
        const MAX_IMAGES = 20;
        let images = {};
        let zoom = 1;
        let panX = 0;
        let panY = 0;
        let isPanning = false;
        let panStartX = 0;
        let panStartY = 0;
        let lastTouchDistance = 0;

        function generateDropZonePositions() {
            const positions = [];
            const cols = Math.ceil(Math.sqrt(20));
            const cellWidth = 100 / cols;
            const cellHeight = 100 / cols;

            for (let i = 0; i < 20; i++) {
                const col = i % cols;
                const row = Math.floor(i / cols);
                const baseX = col * cellWidth;
                const baseY = row * cellHeight;
                
                const offsetX = (Math.random() - 0.5) * cellWidth * 0.6;
                const offsetY = (Math.random() - 0.5) * cellHeight * 0.6;

                positions.push({
                    x: baseX + cellWidth * 0.5 + offsetX,
                    y: baseY + cellHeight * 0.5 + offsetY,
                    id: i
                });
            }
            return positions;
        }

        const dropZonePositions = generateDropZonePositions();
        const iconClasses = ['icon1', 'icon2', 'icon3', 'icon4', 'icon5', 'icon6'];
        
        function generateDecorations() {
            const decorations = [];
            const positions = [
                { x: 5, y: 8, type: 'icon' },
                { x: 92, y: 12, type: 'icon' },
                { x: 10, y: 55, type: 'pin' },
                { x: 88, y: 65, type: 'icon' },
                { x: 45, y: 15, type: 'icon' },
                { x: 20, y: 80, type: 'icon' },
                { x: 75, y: 85, type: 'pin' },
                { x: 15, y: 25, type: 'tape' },
                { x: 80, y: 50, type: 'icon' },
                { x: 50, y: 75, type: 'tape' }
            ];

            positions.forEach((pos, idx) => {
                if (pos.type === 'icon') {
                    decorations.push({
                        type: 'icon',
                        x: pos.x,
                        y: pos.y,
                        class: iconClasses[idx % iconClasses.length],
                        rotation: Math.random() * 15 - 7.5
                    });
                } else if (pos.type === 'pin') {
                    decorations.push({
                        type: 'pin',
                        x: pos.x,
                        y: pos.y
                    });
                } else {
                    decorations.push({
                        type: 'tape',
                        x: pos.x,
                        y: pos.y,
                        rotation: Math.random() * 20 - 10
                    });
                }
            });
            return decorations;
        }

        const decorations = generateDecorations();

        document.addEventListener('DOMContentLoaded', () => {
            loadImagesFromStorage();
            renderBoard();
            setupFileInput();
            setupViewport();
        });

        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';

            // Add decorations
            decorations.forEach(deco => {
                const el = document.createElement('div');
                el.className = 'decoration ' + (deco.class || deco.type);
                el.style.left = deco.x + '%';
                el.style.top = deco.y + '%';
                el.style.transform = `translate(-50%, -50%)${deco.rotation ? ` rotate(${deco.rotation}deg)` : ''}`;
                board.appendChild(el);
            });

            // Add drop zones and polaroids
            dropZonePositions.forEach(pos => {
                if (images[pos.id]) {
                    const polaroid = document.createElement('div');
                    polaroid.className = 'polaroid';
                    polaroid.draggable = true;
                    polaroid.style.left = pos.x + '%';
                    polaroid.style.top = pos.y + '%';
                    polaroid.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 6 - 3}deg)`;
                    
                    polaroid.innerHTML = `
                        <img src="${images[pos.id]}" class="polaroid-image" alt="Vision">
                        <div class="polaroid-label">آرزو ${pos.id + 1}</div>
                        <button class="remove-btn" onclick="removeImage(${pos.id})">✕</button>
                    `;

                    setupPolaroidDrag(polaroid, pos.id);
                    board.appendChild(polaroid);
                } else {
                    const zone = document.createElement('div');
                    zone.className = 'drop-zone';
                    zone.dataset.zoneId = pos.id;
                    zone.style.left = pos.x + '%';
                    zone.style.top = pos.y + '%';
                    zone.style.transform = 'translate(-50%, -50%)';
                    zone.innerHTML = '➕';
                    zone.onclick = () => document.getElementById('imageInput').click();
                    board.appendChild(zone);
                }
            });

            document.getElementById('imageCount').textContent = Object.keys(images).length;
        }

        function setupPolaroidDrag(el, zoneId) {
            let startX = 0, startY = 0;

            el.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                el.classList.add('dragging');
            });

            el.addEventListener('touchmove', (e) => {
                e.preventDefault();
            });

            el.addEventListener('touchend', (e) => {
                el.classList.remove('dragging');
                const endX = e.changedTouches[0].clientX;
                const endY = e.changedTouches[0].clientY;

                if (Math.abs(endX - startX) > 10 || Math.abs(endY - startY) > 10) {
                    const board = document.getElementById('board');
                    const boardRect = board.getBoundingClientRect();
                    let newX = ((endX - boardRect.left) / boardRect.width) * 100;
                    let newY = ((endY - boardRect.top) / boardRect.height) * 100;

                    newX = Math.max(8, Math.min(92, newX));
                    newY = Math.max(8, Math.min(92, newY));

                    const newZoneId = Math.floor(Math.random() * 20);
                    dropZonePositions[newZoneId].x = newX;
                    dropZonePositions[newZoneId].y = newY;

                    saveImagesToStorage();
                    renderBoard();
                }
            });

            el.addEventListener('dragstart', (e) => {
                e.dataTransfer.effectAllowed = 'move';
                el.classList.add('dragging');
            });

            el.addEventListener('dragend', (e) => {
                el.classList.remove('dragging');
            });
        }

        function setupFileInput() {
            document.getElementById('imageInput').addEventListener('change', (e) => {
                const files = Array.from(e.target.files);
                let addedCount = 0;

                files.forEach(file => {
                    if (addedCount >= MAX_IMAGES - Object.keys(images).length) return;

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        for (let i = 0; i < 20; i++) {
                            if (!images[i]) {
                                images[i] = event.target.result;
                                addedCount++;
                                break;
                            }
                        }
                        saveImagesToStorage();
                        renderBoard();
                    };
                    reader.readAsDataURL(file);
                });

                document.getElementById('imageInput').value = '';
            });
        }

        function setupViewport() {
            const viewport = document.getElementById('viewport');

            viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                zoom += (e.deltaY < 0 ? 0.1 : -0.1);
                zoom = Math.max(0.5, Math.min(2.5, zoom));
                updateTransform();
            }, { passive: false });

            viewport.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    lastTouchDistance = Math.sqrt(dx * dx + dy * dy);
                } else if (e.touches.length === 1) {
                    isPanning = true;
                    panStartX = e.touches[0].clientX - panX;
                    panStartY = e.touches[0].clientY - panY;
                }
            }, { passive: true });

            viewport.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const newDistance = Math.sqrt(dx * dx + dy * dy);
                    const delta = newDistance - lastTouchDistance;
                    zoom += delta * 0.01;
                    zoom = Math.max(0.5, Math.min(2.5, zoom));
                    lastTouchDistance = newDistance;
                    updateTransform();
                } else if (isPanning && e.touches.length === 1) {
                    panX = e.touches[0].clientX - panStartX;
                    panY = e.touches[0].clientY - panStartY;
                    updateTransform();
                }
            }, { passive: true });

            viewport.addEventListener('touchend', () => {
                isPanning = false;
            });

            viewport.addEventListener('mousedown', (e) => {
                if (e.target.closest('.polaroid') || e.target.closest('.drop-zone')) return;
                isPanning = true;
                panStartX = e.clientX - panX;
                panStartY = e.clientY - panY;
                viewport.classList.add('grabbing');
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPanning) return;
                panX = e.clientX - panStartX;
                panY = e.clientY - panStartY;
                updateTransform();
            });

            document.addEventListener('mouseup', () => {
                isPanning = false;
                viewport.classList.remove('grabbing');
            });
        }

        function updateTransform() {
            const wrapper = document.getElementById('boardWrapper');
            wrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
        }

        function removeImage(zoneId) {
            delete images[zoneId];
            saveImagesToStorage();
            renderBoard();
        }

        function saveImagesToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(images));
            showSaveMessage();
        }

        function loadImagesFromStorage() {
            const stored = localStorage.getItem(STORAGE_KEY);
            images = stored ? JSON.parse(stored) : {};
        }

        function showSaveMessage() {
            const msg = document.getElementById('saveMessage');
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 1500);
        }

        function showCompleteModal() {
            document.getElementById('completeModal').classList.add('show');
        }

        function closeCompleteModal() {
            document.getElementById('completeModal').classList.remove('show');
        }

        function downloadBoard() {
            const canvas = document.createElement('canvas');
            canvas.width = 3000;
            canvas.height = 3000;

            const ctx = canvas.getContext('2d');

            // Cork texture
            ctx.fillStyle = '#C99468';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Noise
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = Math.random() * 40;
                data[i] += noise;
                data[i + 1] += noise * 0.8;
                data[i + 2] += noise * 0.6;
            }
            ctx.putImageData(imageData, 0, 0);

            let loaded = 0;
            const polaroidElements = document.querySelectorAll('.polaroid');

            if (polaroidElements.length === 0) {
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = `vision-board-${Date.now()}.png`;
                link.click();
                closeCompleteModal();
                return;
            }

            polaroidElements.forEach((el) => {
                const img = el.querySelector('.polaroid-image');
                const polaroidImg = new Image();
                polaroidImg.crossOrigin = 'anonymous';

                polaroidImg.onload = () => {
                    const x = parseFloat(el.style.left);
                    const y = parseFloat(el.style.top);
                    const px = (x / 100) * canvas.width - 60;
                    const py = (y / 100) * canvas.height - 80;
                    const w = 240;
                    const h = 320;

                    ctx.fillStyle = '#fff';
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                    ctx.shadowBlur = 15;
                    ctx.shadowOffsetX = 3;
                    ctx.shadowOffsetY = 8;
                    ctx.fillRect(px, py, w, h);

                    ctx.drawImage(polaroidImg, px + 12, py + 12, w - 24, h - 72);

                    ctx.font = 'bold 20px Vazirmatn';
                    ctx.fillStyle = '#333';
                    ctx.textAlign = 'center';
                    ctx.fillText('آرزو', px + w / 2, py + h - 10);

                    loaded++;
                    if (loaded === polaroidElements.length) {
                        const link = document.createElement('a');
                        link.href = canvas.toDataURL('image/png');
                        link.download = `vision-board-${Date.now()}.png`;
                        link.click();
                        closeCompleteModal();
                    }
                };
                polaroidImg.src = img.src;
            });
        }

        function goHome() {
            window.location.href = 'https://planlife.ir';
        }

        document.getElementById('completeModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('completeModal')) {
                closeCompleteModal();
            }
        });
    </script>
</body>
</html>
