<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PlanLife – مسیر هدف</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Vazirmatn',sans-serif;background:#1a1a1a;}

/* ══════════════════════════════════
   SCREEN 1 – GOAL INPUT
══════════════════════════════════ */
#screen-goal{
  position:fixed;inset:0;z-index:200;
  background:radial-gradient(ellipse at 60% 30%, #1c2a3a 0%, #0a0a0a 100%);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .8s ease;
}
.stars-wrap{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 2.5s ease-in-out infinite alternate;}
@keyframes twinkle{0%{opacity:.05}100%{opacity:.8}}

.goal-box{
  position:relative;z-index:2;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.12);
  border-radius:28px;padding:2.8rem 2.2rem;
  width:90%;max-width:400px;text-align:center;
  backdrop-filter:blur(20px);
  box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.goal-box .logo-top{
  font-size:.78rem;letter-spacing:.15em;color:rgba(255,255,255,.35);
  text-transform:uppercase;margin-bottom:1.8rem;font-weight:300;
}
.goal-box h1{
  font-size:1.65rem;font-weight:900;color:#fff;line-height:1.5;
  margin-bottom:.5rem;
}
.goal-box p{color:rgba(255,255,255,.45);font-size:.85rem;margin-bottom:1.8rem;line-height:1.7;}
.goal-box textarea{
  width:100%;background:rgba(255,255,255,.07);
  border:1.5px solid rgba(255,255,255,.15);border-radius:14px;
  padding:1rem 1.1rem;color:#fff;font-family:'Vazirmatn',sans-serif;
  font-size:.98rem;resize:none;outline:none;min-height:90px;
  transition:border-color .3s,background .3s;
}
.goal-box textarea::placeholder{color:rgba(255,255,255,.25);}
.goal-box textarea:focus{border-color:#C8A96E;background:rgba(255,255,255,.1);}
.btn-start{
  margin-top:1.3rem;
  background:linear-gradient(135deg,#C8A96E,#A07840);
  color:#fff;font-family:'Vazirmatn',sans-serif;font-weight:700;font-size:1rem;
  border:none;border-radius:50px;padding:.9rem 2.4rem;cursor:pointer;
  box-shadow:0 4px 24px rgba(200,169,110,.35);
  transition:transform .2s,box-shadow .2s;
  letter-spacing:.02em;
}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 8px 36px rgba(200,169,110,.5);}

/* ══════════════════════════════════
   JOURNEY SCREEN
══════════════════════════════════ */
#screen-journey{
  position:fixed;inset:0;z-index:10;
  display:none;background:#2a2a2a;overflow:hidden;
}

/* SVG fills whole screen */
#road-svg{
  position:absolute;inset:0;width:100%;height:100%;
}

/* Goal banner – top strip */
#goal-banner{
  position:fixed;top:0;left:0;right:0;z-index:80;
  display:none;
  padding:.55rem 1rem;
  background:rgba(0,0,0,.65);
  border-bottom:2px solid #C8A96E;
  backdrop-filter:blur(12px);
  text-align:center;
}
#goal-banner .gl{font-size:.65rem;letter-spacing:.1em;color:#C8A96E;text-transform:uppercase;}
#goal-banner .gt{font-size:.9rem;font-weight:700;color:#fff;margin-top:.1rem;}

/* ══════════════════════════════════
   STEP CARD – glassmorphism
══════════════════════════════════ */
#step-card{
  position:fixed;bottom:0;left:0;right:0;z-index:90;
  display:none;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid rgba(255,255,255,.22);
  border-radius:26px 26px 0 0;
  padding:1.6rem 1.4rem 2.4rem;
  box-shadow:0 -12px 50px rgba(0,0,0,.45);
}
#step-card.up{animation:cardUp .42s cubic-bezier(.2,0,.2,1) forwards;}
#step-card.down{animation:cardDown .35s cubic-bezier(.2,0,.2,1) forwards;}
@keyframes cardUp{from{transform:translateY(110%)}to{transform:translateY(0)}}
@keyframes cardDown{from{transform:translateY(0)}to{transform:translateY(110%)}}

.sc-tag{
  display:inline-block;background:rgba(200,169,110,.2);
  color:#C8A96E;border-radius:20px;padding:.2rem .85rem;
  font-size:.7rem;font-weight:700;margin-bottom:.6rem;letter-spacing:.04em;
}
.sc-q{font-size:1rem;font-weight:700;color:#fff;line-height:1.6;margin-bottom:.85rem;}
#step-card textarea{
  width:100%;background:rgba(255,255,255,.1);
  border:1.5px solid rgba(255,255,255,.2);border-radius:14px;
  padding:.85rem 1rem;font-family:'Vazirmatn',sans-serif;font-size:.93rem;
  color:#fff;resize:none;outline:none;min-height:78px;
  transition:border-color .25s,background .25s;
}
#step-card textarea::placeholder{color:rgba(255,255,255,.3);}
#step-card textarea:focus{border-color:#C8A96E;background:rgba(255,255,255,.15);}
.sc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:.9rem;}
.sc-dots{display:flex;gap:5px;flex-wrap:wrap;max-width:55%;}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s;}
.dot.done{background:#C8A96E;}
.dot.active{background:#fff;transform:scale(1.3);}
.btn-next{
  background:linear-gradient(135deg,#C8A96E,#A07840);color:#fff;
  font-family:'Vazirmatn',sans-serif;font-weight:700;font-size:.9rem;
  border:none;border-radius:50px;padding:.7rem 1.7rem;cursor:pointer;
  transition:transform .2s;box-shadow:0 4px 16px rgba(200,169,110,.35);
}
.btn-next:hover{transform:translateY(-1px);}

/* ══════════════════════════════════
   FINISH SCREEN
══════════════════════════════════ */
#screen-finish{
  position:fixed;inset:0;z-index:300;
  background:radial-gradient(ellipse at 50% 20%,#1c2a1c,#0a0a0a);
  display:none;flex-direction:column;align-items:center;
  padding:2rem 1.2rem;overflow-y:auto;gap:1.2rem;
}
.fin-inner{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);
  border-radius:24px;padding:2rem 1.6rem;width:100%;max-width:460px;
  backdrop-filter:blur(16px);text-align:center;
}
.fin-inner .trophy{font-size:3rem;animation:bob 1s ease infinite alternate;}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.fin-inner h2{font-size:1.6rem;font-weight:900;color:#C8A96E;margin:.4rem 0 .3rem;}
.goal-pill{
  background:rgba(200,169,110,.15);border:1px solid rgba(200,169,110,.3);
  border-radius:12px;padding:.65rem 1rem;color:#fff;font-size:.9rem;
  line-height:1.6;margin-bottom:1.2rem;
}
.fin-steps{text-align:right;margin-bottom:1.4rem;}
.fi{display:flex;gap:.65rem;padding:.6rem 0;border-bottom:1px solid rgba(255,255,255,.07);}
.fn{min-width:24px;height:24px;border-radius:50%;background:#C8A96E;color:#000;
  font-size:.72rem;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:2px;}
.ft{color:rgba(255,255,255,.8);font-size:.87rem;line-height:1.5;}
.btn-pdf{
  width:100%;background:linear-gradient(135deg,#C8A96E,#A07840);color:#fff;
  font-family:'Vazirmatn',sans-serif;font-weight:700;font-size:1rem;
  border:none;border-radius:50px;padding:1rem;cursor:pointer;
  box-shadow:0 4px 20px rgba(200,169,110,.4);transition:transform .2s;
}
.btn-pdf:hover{transform:translateY(-2px);}
</style>
</head>
<body>

<!-- ══ SCREEN 1 ══ -->
<div id="screen-goal">
  <div class="stars-wrap" id="stars-wrap"></div>
  <div class="goal-box">
    <div class="logo-top">planlife.ir</div>
    <h1>هدف امسال شما چیه؟</h1>
    <p>مقصدت رو بنویس. ما مسیر رو با هم می‌سازیم.</p>
    <textarea id="goal-input" rows="3" placeholder="مثلاً: راه‌اندازی کسب‌وکار، یادگیری زبان، کاهش وزن..."></textarea>
    <br>
    <button class="btn-start" onclick="startJourney()">شروع مسیر ←</button>
  </div>
</div>

<!-- ══ GOAL BANNER ══ -->
<div id="goal-banner">
  <div class="gl">planlife.ir – هدف نهایی شما</div>
  <div class="gt" id="banner-txt"></div>
</div>

<!-- ══ JOURNEY ══ -->
<div id="screen-journey">
  <svg id="road-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" preserveAspectRatio="xMidYMid slice"></svg>
</div>

<!-- ══ STEP CARD ══ -->
<div id="step-card">
  <div class="sc-tag" id="sc-tag">قدم ۱ از ۱۰</div>
  <div class="sc-q" id="sc-q">یه قدم کوچیک که تو رو به هدفت نزدیک‌تر می‌کنه چیه؟</div>
  <textarea id="step-input" rows="3" placeholder="مثلاً: مطالعه ۲۰ دقیقه، تماس با یه متخصص..."></textarea>
  <div class="sc-foot">
    <div class="sc-dots" id="dots"></div>
    <button class="btn-next" onclick="nextStep()">ثبت ←</button>
  </div>
</div>

<!-- ══ FINISH ══ -->
<div id="screen-finish">
  <div class="fin-inner">
    <div class="trophy">🏆</div>
    <h2>به هدفت رسیدی!</h2>
    <div class="goal-pill" id="fin-goal"></div>
    <div class="fin-steps" id="fin-steps"></div>
    <button class="btn-pdf" onclick="generatePDF()">📄 دانلود نقشه راه</button>
  </div>
</div>

<script>
// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════
let userGoal='', steps=[], cur=0;
const TOTAL=10;

// ═══════════════════════════════════
// ROAD GEOMETRY
// The road is an SVG snake path that fills the screen.
// We define 10 "stop" circles along the snake path.
// viewBox: 400 x 860
// ═══════════════════════════════════

// The snake road: a series of straight + curved segments
// going from bottom to top, snaking left/right
// Each STOP point: {x, y, side:'L'|'R'} — side = which side the label pops out

const STOPS = [
  // stop 0 = start (bottom), stop 10 = destination (top)
  {x:200, y:810}, // start
  {x:100, y:745},
  {x:300, y:670},
  {x:100, y:595},
  {x:300, y:520},
  {x:100, y:445},
  {x:300, y:370},
  {x:100, y:295},
  {x:300, y:220},
  {x:100, y:145},
  {x:200, y:70},  // destination
];

// Build smooth road path through stops
function buildPath(pts){
  let d=`M ${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<pts.length;i++){
    const p=pts[i-1], c=pts[i];
    const mx=(p.x+c.x)/2, my=(p.y+c.y)/2;
    d+=` Q ${p.x} ${my} ${c.x} ${c.y}`;
  }
  return d;
}

const ROAD_PATH = buildPath(STOPS);

// ═══════════════════════════════════
// BUILD SVG
// ═══════════════════════════════════
function buildSVG(){
  const svg=document.getElementById('road-svg');

  // Road width
  const RW=52, RWH=RW/2;

  // Build stop circles HTML (all hidden initially)
  let stopCircles='';
  for(let i=1;i<=10;i++){
    const s=STOPS[i];
    const side = s.x < 200 ? 'R' : 'L'; // label on opposite side from bend
    stopCircles+=`<g id="stop-${i}" opacity="0" style="transition:opacity .6s">
      <circle cx="${s.x}" cy="${s.y}" r="13" fill="#C8A96E" stroke="white" stroke-width="2.5"/>
      <circle cx="${s.x}" cy="${s.y}" r="6" fill="white" opacity=".9"/>
    </g>`;
  }

  // Destination marker
  const dst=STOPS[10];

  svg.innerHTML=`
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2222"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <!-- Grid pattern for road texture feel -->
    <pattern id="gridP" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,.025)" stroke-width=".5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,.6)"/>
    </filter>
    <filter id="carShadow">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="rgba(0,0,0,.7)"/>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="400" height="860" fill="url(#bgG)"/>
  <rect width="400" height="860" fill="url(#gridP)"/>

  <!-- planlife.ir watermark -->
  <text x="200" y="430" text-anchor="middle" fill="rgba(255,255,255,.04)"
    font-size="28" font-family="Georgia,serif" font-weight="bold" letter-spacing="4"
    transform="rotate(-90 200 430)">planlife.ir planlife.ir planlife.ir planlife.ir</text>

  <!-- ROAD SHADOW -->
  <path d="${ROAD_PATH}" stroke="rgba(0,0,0,.5)" stroke-width="${RW+12}"
    fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ROAD BASE (dark asphalt) -->
  <path d="${ROAD_PATH}" stroke="#1a1a1a" stroke-width="${RW}"
    fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ROAD SURFACE -->
  <path d="${ROAD_PATH}" stroke="#2d2d2d" stroke-width="${RW-4}"
    fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ROAD EDGE LINES (white solid) -->
  <path d="${ROAD_PATH}" stroke="rgba(255,255,255,.55)" stroke-width="${RW}"
    fill="none" stroke-linecap="round" stroke-linejoin="round"
    stroke-dasharray="${RW-4} 0" style="mix-blend-mode:overlay" opacity=".15"/>

  <!-- LEFT edge line -->
  <path d="${ROAD_PATH}" stroke="white" stroke-width="1.5"
    fill="none" stroke-linecap="round" opacity=".7"
    style="transform:translate(-${RWH-3}px,0)"/>

  <!-- RIGHT edge line -->
  <path d="${ROAD_PATH}" stroke="white" stroke-width="1.5"
    fill="none" stroke-linecap="round" opacity=".7"
    style="transform:translate(${RWH-3}px,0)"/>

  <!-- CENTER DASHES -->
  <path id="road-dashes" d="${ROAD_PATH}" stroke="#C8A96E" stroke-width="2"
    fill="none" stroke-linecap="round" stroke-dasharray="18 22" opacity=".8"/>

  <!-- PROGRESS GLOW (hidden initially, revealed as user progresses) -->
  <path id="road-glow" d="${ROAD_PATH}" stroke="#C8A96E" stroke-width="6"
    fill="none" stroke-linecap="round" opacity=".5" stroke-dasharray="0 9999"
    style="filter:url(#glow)"/>

  <!-- STOP CIRCLES -->
  ${stopCircles}

  <!-- START marker -->
  <circle cx="${STOPS[0].x}" cy="${STOPS[0].y}" r="16" fill="#C8A96E" stroke="white" stroke-width="2.5"/>
  <text x="${STOPS[0].x}" y="${STOPS[0].y+5}" text-anchor="middle" fill="white"
    font-size="9" font-weight="bold" font-family="sans-serif">START</text>

  <!-- DESTINATION star/flag -->
  <g id="dest-marker">
    <circle cx="${dst.x}" cy="${dst.y}" r="20" fill="#C8A96E" stroke="white" stroke-width="3"
      style="filter:url(#glow)"/>
    <text x="${dst.x}" y="${dst.y+6}" text-anchor="middle" fill="white"
      font-size="16" font-family="serif">★</text>
  </g>

  <!-- DESTINATION GOAL TEXT (shown at end) -->
  <text id="dest-goal-txt" x="${dst.x}" y="${dst.y-30}" text-anchor="middle"
    fill="white" font-size="9" font-family="Vazirmatn,sans-serif" font-weight="700"
    opacity="0" style="transition:opacity 1s"
    paint-order="stroke" stroke="#000" stroke-width="3" stroke-linejoin="round"
  ></text>

  <!-- MERCEDES G-CLASS CAR -->
  <g id="car" transform="translate(${STOPS[0].x},${STOPS[0].y})">
    ${benzGClass()}
  </g>

  <!-- STEP LABELS (populated dynamically) -->
  <g id="labels"></g>
  `;
}

// ═══════════════════════════════════
// MERCEDES G-CLASS SVG (top-down view)
// ═══════════════════════════════════
function benzGClass(){
  return `
  <g transform="translate(-14,-24) scale(.9)">
    <!-- Car shadow -->
    <ellipse cx="15" cy="30" rx="16" ry="8" fill="rgba(0,0,0,.5)" transform="translate(0,6)"/>
    <!-- Body -->
    <rect x="0" y="2" width="30" height="52" rx="4" fill="#111"/>
    <!-- Hood -->
    <rect x="2" y="2" width="26" height="14" rx="3" fill="#1a1a1a"/>
    <!-- Windshield -->
    <rect x="3" y="14" width="24" height="10" rx="2" fill="#1a3a4a" opacity=".85"/>
    <line x1="15" y1="14" x2="15" y2="24" stroke="rgba(255,255,255,.15)" stroke-width="1"/>
    <!-- Roof -->
    <rect x="3" y="22" width="24" height="20" rx="2" fill="#1c1c1c"/>
    <!-- Rear window -->
    <rect x="3" y="40" width="24" height="8" rx="2" fill="#1a3a4a" opacity=".75"/>
    <!-- Rear -->
    <rect x="2" y="46" width="26" height="8" rx="3" fill="#1a1a1a"/>
    <!-- Side details -->
    <rect x="0" y="15" width="3" height="28" rx="1.5" fill="#222"/>
    <rect x="27" y="15" width="3" height="28" rx="1.5" fill="#222"/>
    <!-- Wheels -->
    <rect x="-3" y="6" width="6" height="10" rx="2" fill="#333"/>
    <rect x="-3" y="38" width="6" height="10" rx="2" fill="#333"/>
    <rect x="27" y="6" width="6" height="10" rx="2" fill="#333"/>
    <rect x="27" y="38" width="6" height="10" rx="2" fill="#333"/>
    <!-- Wheel rims -->
    <circle cx="0" cy="11" r="3" fill="#555"/>
    <circle cx="30" cy="11" r="3" fill="#555"/>
    <circle cx="0" cy="43" r="3" fill="#555"/>
    <circle cx="30" cy="43" r="3" fill="#555"/>
    <!-- Headlights -->
    <rect x="2" y="2" width="8" height="4" rx="1" fill="#FFF8DC" opacity=".9"/>
    <rect x="20" y="2" width="8" height="4" rx="1" fill="#FFF8DC" opacity=".9"/>
    <!-- Grill -->
    <rect x="5" y="0" width="20" height="3" rx="1" fill="#333"/>
    <line x1="8" y1="0" x2="8" y2="3" stroke="#444" stroke-width=".8"/>
    <line x1="11" y1="0" x2="11" y2="3" stroke="#444" stroke-width=".8"/>
    <line x1="14" y1="0" x2="14" y2="3" stroke="#444" stroke-width=".8"/>
    <line x1="17" y1="0" x2="17" y2="3" stroke="#444" stroke-width=".8"/>
    <line x1="20" y1="0" x2="20" y2="3" stroke="#444" stroke-width=".8"/>
    <line x1="23" y1="0" x2="23" y2="3" stroke="#444" stroke-width=".8"/>
    <!-- Tail lights -->
    <rect x="2" y="50" width="8" height="4" rx="1" fill="#FF3333" opacity=".8"/>
    <rect x="20" y="50" width="8" height="4" rx="1" fill="#FF3333" opacity=".8"/>
    <!-- Mercedes star -->
    <circle cx="15" cy="2" r="3" fill="#888"/>
    <circle cx="15" cy="2" r="1.5" fill="#aaa"/>
  </g>`;
}

// ═══════════════════════════════════
// ANIMATE CAR TO STOP
// ═══════════════════════════════════
let carPos = 0; // current stop index

function animateCarTo(stopIdx, done){
  // collect intermediate stops
  const from=carPos, to=stopIdx;
  let i=from;
  function step(){
    if(i>=to){
      carPos=to;
      // reveal the stop circle
      const el=document.getElementById(`stop-${to}`);
      if(el) el.setAttribute('opacity','1');
      // advance road glow
      advanceGlow(to);
      done&&done();
      return;
    }
    i++;
    moveCar(STOPS[i].x, STOPS[i].y, 900, step);
    // reveal circle as car arrives
    setTimeout(()=>{
      const el=document.getElementById(`stop-${i}`);
      if(el) el.setAttribute('opacity','1');
    }, 700);
  }
  step();
}

function moveCar(tx, ty, dur, cb){
  const car=document.getElementById('car');
  // compute angle from current to target
  const cur=car.getAttribute('transform');
  const match=cur.match(/translate\(([^,]+),([^)]+)\)/);
  let cx=parseFloat(match[1]), cy=parseFloat(match[2]);
  const angle=Math.atan2(ty-cy,tx-cx)*180/Math.PI + 90;

  const start=performance.now();
  const fx=tx, fy=ty;
  function frame(now){
    const t=Math.min((now-start)/dur,1);
    const e=t<.5?2*t*t:(4-2*t)*t-1; // easeInOutQuad
    const nx=cx+(fx-cx)*e;
    const ny=cy+(fy-cy)*e;
    car.setAttribute('transform',`translate(${nx},${ny}) rotate(${angle} 14 24)`);
    if(t<1) requestAnimationFrame(frame);
    else{ car.setAttribute('transform',`translate(${fx},${fy}) rotate(${angle} 14 24)`); cb&&cb(); }
  }
  requestAnimationFrame(frame);
}

// ═══════════════════════════════════
// GLOW PROGRESS ALONG ROAD
// ═══════════════════════════════════
// We'll animate stroke-dasharray to reveal road up to current stop
// Approximate path lengths (pre-calculated for our snake)
// Total path ~2800 units, ~280 per segment
const SEGMENT_LEN = 280;
function advanceGlow(stopIdx){
  const glow=document.getElementById('road-glow');
  const len=stopIdx*SEGMENT_LEN;
  glow.style.strokeDasharray=`${len} 9999`;
}

// ═══════════════════════════════════
// ADD STEP LABEL TO MAP
// ═══════════════════════════════════
function addLabel(stopIdx, text){
  const g=document.getElementById('labels');
  const s=STOPS[stopIdx];
  // Determine side
  const side = s.x < 200 ? 'right' : 'left';
  const lx = side==='right' ? s.x+22 : s.x-22;
  const anchor = side==='right' ? 'start' : 'end';
  const lineEx = side==='right' ? s.x+60 : s.x-60;

  // truncate text
  const short = text.length>22 ? text.substring(0,20)+'…' : text;

  const el=document.createElementNS('http://www.w3.org/2000/svg','g');
  el.setAttribute('opacity','0');
  el.style.transition='opacity .6s';
  el.innerHTML=`
    <line x1="${s.x}" y1="${s.y}" x2="${lineEx}" y2="${s.y}"
      stroke="#C8A96E" stroke-width="1.5" opacity=".7"/>
    <rect x="${side==='right'?lineEx:lineEx-80}" y="${s.y-14}" width="80" height="22" rx="6"
      fill="rgba(0,0,0,.55)" stroke="rgba(200,169,110,.35)" stroke-width="1"/>
    <text x="${side==='right'?lineEx+4:lineEx-4}" y="${s.y+3}"
      text-anchor="${anchor}" fill="white"
      font-size="8" font-family="Vazirmatn,sans-serif" font-weight="600">${short}</text>
  `;
  g.appendChild(el);
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>el.setAttribute('opacity','1'));
  });
}

// ═══════════════════════════════════
// INIT DOTS
// ═══════════════════════════════════
function buildDots(){
  const c=document.getElementById('dots'); c.innerHTML='';
  for(let i=0;i<TOTAL;i++){
    const d=document.createElement('div');
    d.className='dot'; d.id=`dot-${i}`; c.appendChild(d);
  }
}
function refreshDots(){
  for(let i=0;i<TOTAL;i++){
    const d=document.getElementById(`dot-${i}`);
    d.className='dot'+(i<cur?' done':i===cur?' active':'');
  }
}

// ═══════════════════════════════════
// STARS
// ═══════════════════════════════════
function buildStars(){
  const c=document.getElementById('stars-wrap'); let h='';
  for(let i=0;i<80;i++){
    const s=Math.random()*2+.5;
    h+=`<div class="star" style="width:${s}px;height:${s}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${1.5+Math.random()*2.5}s;"></div>`;
  }
  c.innerHTML=h;
}

// ═══════════════════════════════════
// STEP QUESTIONS
// ═══════════════════════════════════
const QS=[
  'اولین قدم کوچیکی که می‌تونی همین هفته برداری چیه؟',
  'قدم بعدی که مسیرت رو هموار می‌کنه چیه؟',
  'یه کار کوچیک که بیشترین تأثیر رو داره چیه؟',
  'اگه فقط یه چیز بتونی انجام بدی، چی باشه؟',
  'قدم پنجم – نیمه راهی! چی باید انجام بدی؟',
  'یه عادت کوچیک که می‌تونه همه چیز رو تغییر بده چیه؟',
  'چه کسی یا چه چیزی می‌تونه کمکت کنه؟',
  'قدم بعدی هوشمندانه‌ات چیه؟',
  'نزدیک خط پایانی! قدم قبل از آخر چیه؟',
  'آخرین قدم! چه کاری می‌تونه تو رو به هدفت برسونه؟',
];

// ═══════════════════════════════════
// SHOW / HIDE CARD
// ═══════════════════════════════════
function showCard(){
  document.getElementById('sc-tag').textContent=`قدم ${toF(cur+1)} از ${toF(TOTAL)}`;
  document.getElementById('sc-q').textContent=QS[cur];
  document.getElementById('step-input').value='';
  refreshDots();
  const card=document.getElementById('step-card');
  card.style.display='block';
  card.classList.remove('down'); void card.offsetWidth; card.classList.add('up');
  setTimeout(()=>document.getElementById('step-input').focus(),400);
}
function hideCard(cb){
  const card=document.getElementById('step-card');
  card.classList.remove('up'); card.classList.add('down');
  setTimeout(()=>{card.style.display='none';cb&&cb();},360);
}

// ═══════════════════════════════════
// START JOURNEY
// ═══════════════════════════════════
function startJourney(){
  const val=document.getElementById('goal-input').value.trim();
  if(!val){document.getElementById('goal-input').style.borderColor='#C8A96E';return;}
  userGoal=val;

  // Banner
  document.getElementById('banner-txt').textContent=userGoal;
  document.getElementById('goal-banner').style.display='block';

  // Dest text
  const dtxt=document.getElementById('dest-goal-txt');
  if(dtxt){
    const words=userGoal.split(' ');
    // show first 4 words
    dtxt.textContent=words.slice(0,4).join(' ')+(words.length>4?'…':'');
  }

  buildSVG();
  buildDots();

  const gs=document.getElementById('screen-goal');
  gs.style.opacity='0'; gs.style.pointerEvents='none';
  setTimeout(()=>gs.style.display='none',800);

  document.getElementById('screen-journey').style.display='block';

  // move car to stop 1 then show first card
  setTimeout(()=>{
    animateCarTo(1,()=>showCard());
  },500);
}

// ═══════════════════════════════════
// NEXT STEP
// ═══════════════════════════════════
function nextStep(){
  const val=document.getElementById('step-input').value.trim();
  if(!val){
    const ta=document.getElementById('step-input');
    ta.style.borderColor='#C8A96E';
    setTimeout(()=>ta.style.borderColor='',900);
    return;
  }
  steps.push(val);
  addLabel(cur+1, val);

  if(cur>=TOTAL-1){
    hideCard(()=>showFinish());
    return;
  }
  hideCard(()=>{
    cur++;
    animateCarTo(cur+1,()=>showCard());
  });
}

// ═══════════════════════════════════
// FINISH
// ═══════════════════════════════════
function showFinish(){
  // move car to destination
  animateCarTo(10,()=>{
    // reveal goal text at destination
    const dtxt=document.getElementById('dest-goal-txt');
    if(dtxt) dtxt.setAttribute('opacity','1');
  });

  setTimeout(()=>{
    const fs=document.getElementById('screen-finish');
    fs.style.display='flex';
    document.getElementById('fin-goal').textContent='🎯 '+userGoal;
    document.getElementById('fin-steps').innerHTML=
      steps.map((s,i)=>`<div class="fi"><div class="fn">${toF(i+1)}</div><div class="ft">${s}</div></div>`).join('');
  },2000);
}

// ═══════════════════════════════════
// PDF
// ═══════════════════════════════════
function generatePDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  doc.setFillColor(15,15,20); doc.rect(0,0,210,297,'F');
  doc.setFillColor(200,169,110); doc.roundedRect(0,0,210,38,0,0,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(0,0,0);
  doc.text('PlanLife.ir',105,15,{align:'center'});
  doc.setFontSize(11); doc.text('نقشه راه رسیدن به هدف',105,28,{align:'center'});
  doc.setDrawColor(200,169,110); doc.setLineWidth(.5);
  doc.roundedRect(14,46,182,20,4,4,'S');
  doc.setTextColor(200,169,110); doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.text('هدف شما:',20,54);
  doc.setTextColor(255,255,255); doc.setFontSize(12); doc.setFont('helvetica','bold');
  doc.text(doc.splitTextToSize(userGoal,155),105,60,{align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.setTextColor(180,210,255); doc.text('قدم‌های کوچیک:',20,76);
  steps.forEach((s,i)=>{
    const y=84+i*19;
    doc.setFillColor(200,169,110); doc.circle(21,y-1,4,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(0,0,0);
    doc.text(String(i+1),21,y+.5,{align:'center'});
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(225,240,255);
    doc.text(doc.splitTextToSize(s,158),29,y);
    if(i<steps.length-1){doc.setDrawColor(80,80,80);doc.setLineWidth(.2);doc.line(29,y+5,190,y+5);}
  });
  doc.setFillColor(200,169,110); doc.rect(0,280,210,17,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(0,0,0);
  doc.text('planlife.ir – هر هدف بزرگ با یه قدم کوچیک شروع می‌شه',105,291,{align:'center'});
  doc.save('planlife-roadmap.pdf');
}

// ═══════════════════════════════════
// HELPERS
// ═══════════════════════════════════
function toF(n){return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);}
