<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>موزیک آرامش بخش • PlanLife</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Vazirmatn', sans-serif; background: #030303; color: white; min-height: 100vh; }

    /* ---- دسته‌بندی‌ها ---- */
    .categories-wrap {
        display: flex;
        gap: 14px;
        padding: 0 20px;
        margin-bottom: 22px;
    }
    .cat-card {
        flex: 1;
        min-height: 90px;
        border-radius: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 900;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: transform 0.2s, box-shadow 0.2s;
        border: 1.5px solid rgba(255,255,255,0.18);
        /* شیشه‌ای */
        background: rgba(255,255,255,0.07);
        backdrop-filter: blur(22px) saturate(180%);
        -webkit-backdrop-filter: blur(22px) saturate(180%);
        box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .cat-card.active {
        border-color: #ff9500;
        background: rgba(255,149,0,0.15);
        box-shadow: 0 0 24px rgba(255,149,0,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .cat-card:active { transform: scale(0.96); }
    .cat-card-label { font-size: 19px; font-weight: 800; letter-spacing: 0.01em; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }

    /* ---- گرید موزیک ---- */
    .music-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 0 20px 130px;
    }

    .music-box {
        background: rgba(255,255,255,0.09);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 22px;
        padding: 12px;
        text-align: center;
        cursor: pointer;
        transition: transform 0.2s;
        position: relative;
    }
    .music-box:active { transform: scale(0.97); }
    .music-cover-wrap { position: relative; width: 100%; }
    .music-cover {
        width: 100%;
        aspect-ratio: 1/1;
        border-radius: 16px;
        object-fit: cover;
        display: block;
        box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    /* آیکون پلی روی کاور */
    .play-overlay {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 42px;
        height: 42px;
        background: rgba(255, 149, 0, 0.92);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 16px rgba(255,149,0,0.6), 0 0 0 3px rgba(255,255,255,0.15);
        transition: transform 0.2s;
    }
    .play-overlay svg { width: 18px; height: 18px; fill: #1a0033; margin-right: -2px; }

    .music-name {
        font-size: 14px;
        font-weight: 600;
        margin-top: 10px;
        line-height: 1.4;
    }
    .music-duration {
        font-size: 12px;
        opacity: 0.55;
        margin-top: 4px;
    }

    /* ==================== مینی‌پلیر ==================== */
    .mini-player {
        position: fixed; bottom: 15px; left: 15px; right: 15px; height: 72px;
        background: rgba(18,18,40,0.72);
        backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
        border: 1px solid rgba(255,255,255,0.14); border-radius: 22px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.1);
        z-index: 290; display: none; align-items: center; padding: 0 16px; gap: 12px; cursor: pointer; overflow: hidden;
    }
    .mini-player.active { display: flex; }
    .mini-cover { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
    .mini-info { flex: 1; overflow: hidden; }
    .mini-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-ep { font-size: 12px; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-progress { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: rgba(255,255,255,0.10); border-radius: 0 0 22px 22px; overflow: hidden; }
    .mini-progress-bar { height: 100%; background: linear-gradient(to right, #ff9500, #ff6b00); border-radius: 999px; transition: width 0.5s linear; }
    .mini-play-btn { width: 42px; height: 42px; background: #ff9500; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 14px rgba(255,149,0,0.5); }
    .mini-play-btn svg { width: 22px; height: 22px; fill: #1a0033; }
    .mini-close { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; opacity: 0.5; flex-shrink: 0; font-size: 20px; }

    /* ==================== پلیر تمام‌صفحه ==================== */
    .now-playing {
        position: fixed;
        top: 10px; left: 10px; right: 10px;
        height: calc(100% - 10px); height: calc(100dvh - 10px);
        background: rgba(10,10,25,0.98);
        z-index: 300;
        display: none;
        flex-direction: column;
        align-items: center;
        padding: 20px 20px 40px;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        transform: translateY(110%);
        border-radius: 22px 22px 0 0;
        will-change: transform, border-radius;
        touch-action: pan-y;
    }
    .now-playing.active {
        display: flex;
        transform: translateY(0%);
        border-radius: 22px 22px 0 0;
        transition: transform 0.52s cubic-bezier(0.32,0.72,0,1), border-radius 0.52s cubic-bezier(0.32,0.72,0,1);
    }
    .drag-handle-wrap { width: 100%; display: flex; justify-content: center; padding: 6px 0 2px; flex-shrink: 0; cursor: grab; }
    .drag-handle { width: 44px; height: 5px; background: rgba(255,255,255,0.65); border-radius: 999px; }

    .player-topbar { width: 100%; max-width: 380px; display: flex; justify-content: space-between; align-items: center; padding: 8px 0 16px; flex-shrink: 0; }
    .player-status { font-size: 15px; font-weight: 600; opacity: 0.85; }

    .big-cover { width: 100%; max-width: 220px; margin: 6px 0 20px; flex-shrink: 0; }
    .big-cover img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 22px; box-shadow: 0 20px 60px rgba(255,149,0,0.3); }

    .track-info { text-align: center; width: 100%; max-width: 360px; margin-bottom: 16px; flex-shrink: 0; }
    .np-title { font-size: 21px; font-weight: 800; margin-bottom: 4px; }
    .np-subtitle { font-size: 14px; opacity: 0.6; }

    .progress-section { width: 100%; max-width: 360px; margin-bottom: 28px; flex-shrink: 0; }
    .progress-container { width: 100%; height: 5px; background: rgba(255,255,255,0.18); border-radius: 999px; cursor: pointer; margin-bottom: 8px; }
    .progress-bar { height: 100%; background: linear-gradient(to right, #ff9500, #ff6b00); border-radius: 999px; box-shadow: 0 0 12px #ff9500; }
    .time-display { display: flex; justify-content: space-between; font-size: 13px; opacity: 0.65; }

    .main-controls { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 360px; padding: 0 10px; margin-bottom: 20px; flex-shrink: 0; }
    .control-btn { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .control-btn svg { width: 30px; height: 30px; fill: #ddd; transition: all 0.2s; }
    .control-btn:active svg { fill: #ff9500; transform: scale(0.9); }
    .play-main { width: 82px; height: 82px; background: #ff9500; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(255,149,0,0.65); cursor: pointer; }
    .play-main svg { width: 36px; height: 36px; fill: #1a0033; }
</style>
</head>
<body>

<!-- هدر -->
<header style="position:fixed;top:0;left:0;right:0;height:65px;background:rgba(0,0,0,0.3);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:0 20px;z-index:100;">
    <div style="font-size:22px;font-weight:900;color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,0.5);">موزیک آرامش‌بخش</div>
</header>

<!-- محتوای صفحه -->
<div style="margin-top:80px;">

    <!-- دسته‌بندی‌ها -->
    <div class="categories-wrap">
        <!-- =====================================================
             دسته‌بندی ۱: بی‌کلام
             برای تغییر نام: متن داخل span را عوض کن
        ====================================================== -->
        <div class="cat-card active" id="cat-bikalaam" onclick="selectCategory('bikalaam')">
            <span class="cat-card-label">🎵 بی‌کلام</span>
        </div>

        <!-- =====================================================
             دسته‌بندی ۲: باکلام
             برای تغییر نام: متن داخل span را عوض کن
        ====================================================== -->
        <div class="cat-card" id="cat-bakalaam" onclick="selectCategory('bakalaam')">
            <span class="cat-card-label">🎤 باکلام</span>
        </div>
    </div>

    <!-- گرید موزیک‌ها -->
    <div class="music-grid" id="musicGrid"></div>
</div>

<!-- مینی‌پلیر -->
<div id="miniPlayer" class="mini-player" onclick="expandPlayer()">
    <img id="miniCover" class="mini-cover" src="" alt="">
    <div class="mini-info">
        <div id="miniTitle" class="mini-title">در حال پخش</div>
        <div id="miniEp" class="mini-ep">PlanLife</div>
    </div>
    <div class="mini-play-btn" id="miniPlayBtn" onclick="event.stopPropagation(); miniTogglePlay()">
        <svg id="miniPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div class="mini-close" onclick="event.stopPropagation(); killPlayer()">✕</div>
    <div class="mini-progress">
        <div class="mini-progress-bar" id="miniProgressBar" style="width:0%"></div>
    </div>
</div>

<!-- پلیر تمام‌صفحه -->
<div id="nowPlayingScreen" class="now-playing">
    <div class="drag-handle-wrap" id="dragHandleWrap">
        <div class="drag-handle"></div>
    </div>
    <div class="player-topbar">
        <button onclick="closeNowPlaying()" style="font-size:26px;background:none;border:none;color:white;">←</button>
        <span id="playerStatus" class="player-status">در حال پخش</span>
        <div style="font-size:24px;opacity:0.5;">⋯</div>
    </div>

    <div class="big-cover">
        <img id="npCover" src="" alt="">
    </div>

    <div class="track-info">
        <h2 id="npTitle" class="np-title">عنوان موزیک</h2>
        <p id="npSubtitle" class="np-subtitle">PlanLife</p>
    </div>

    <div class="progress-section">
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar" style="width:0%"></div>
        </div>
        <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>
    </div>

    <div class="main-controls">
        <div class="control-btn" onclick="prevTrack()">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg>
        </div>
        <div class="control-btn" onclick="seek(-10)">
            <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        </div>
        <div onclick="togglePlay()" class="play-main" id="playBtn">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <div class="control-btn" onclick="seek(10)">
            <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
        </div>
        <div class="control-btn" onclick="nextTrack()">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </div>
    </div>

    <div style="font-size:12px;opacity:0.4;margin-top:10px;">planlife.ir</div>
    <audio id="mainAudio" style="display:none;"></audio>
</div>

<script>
// ============================================================
// داده‌های موزیک
//
// هر آیتم دارای فیلدهای زیر است:
//   id       : شماره یکتا (عدد صحیح)
//   title    : نام موزیک که روی کارت نمایش داده می‌شود
//   subtitle : نام زیر عنوان در پلیر (مثلاً: PlanLife)
//   src      : لینک مستقیم فایل صوتی (mp3 / m4a / ...)
//   cover    : لینک تصویر کاور
//   duration : مدت زمان به صورت رشته (مثلاً: "۴:۳۲") — برای نمایش زیر کاور
//   category : دسته‌بندی — "bikalaam" یا "bakalaam"
// ============================================================
const musicData = [

    // ===== بی‌کلام =====
    {
        id: 1,
        title: "موزیک آرامش ۱",
        subtitle: "PlanLife",
        src: "https://sv.jenabmusic.com/music/2025/03/10/Podcast%20Bikalam%20%20005.mp3",
        cover: "https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779569485/IMG_1110_p0sbb6.jpg",
        duration: "",          // ← مدت زمان را اینجا وارد کن (مثلاً: "۵:۲۰")
        category: "bikalaam"
    },
    {
        id: 2,
        title: "موزیک آرامش ۲",
        subtitle: "PlanLife",
        src: "https://s3.castbox.fm/13/4b/04/ce5935400d8b31401227f466b0.mp3",
        cover: "https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779449481/IMG_1048_wrc4iq.jpg",
        duration: "",
        category: "bikalaam"
    },
    {
        id: 3,
        title: "موزیک آرامش ۳",
        subtitle: "PlanLife",
        src: "https://s3.castbox.fm/78/f5/fe/ebd5e14a859cd629ea4bffa931.mp3",
        cover: "https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779449479/IMG_1047_mzxexo.jpg",
        duration: "",
        category: "bikalaam"
    },
    {
        id: 4,
        title: "موزیک آرامش ۴",
        subtitle: "PlanLife",
        src: "https://s3.castbox.fm/3b/a0/49/2ed3ed48d18de19f03fc69667e.mp3",
        cover: "https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779449504/IMG_1045_lgkcd4.jpg",
        duration: "",
        category: "bikalaam"
    },
    {
        id: 5,
        title: "موزیک آرامش ۵",
        subtitle: "PlanLife",
        src: "https://s3.castbox.fm/8e/dd/f5/becf814845927ab14f6cb05ec0.mp3",
        cover: "https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779449481/IMG_1048_wrc4iq.jpg",
        duration: "",
        category: "bikalaam"
    },

    // ===== باکلام =====
    {
        id: 6,
        title: "موزیک باکلام ۱",
        subtitle: "PlanLife",
        src: "https://s3.castbox.fm/2c/e9/88/5872e64484acc259dd45b0e2af.mp3",   // ← لینک فایل صوتی را عوض کن
        cover: "https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779449479/IMG_1047_mzxexo.jpg",  // ← لینک کاور را عوض کن
        duration: "",
        category: "bakalaam"
    },
    {
        id: 7,
        title: "موزیک باکلام ۲",
        subtitle: "PlanLife",
        src: "https://s3.castbox.fm/0a/75/1d/03c40549d695f00bbeceb43967.mp3",
        cover: "https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779449504/IMG_1045_lgkcd4.jpg",
        duration: "",
        category: "bakalaam"
    },
    {
        id: 8,
        title: "موزیک باکلام ۳",
        subtitle: "PlanLife",
        src: "https://res.cloudinary.com/dshielkdt/video/upload/q_auto/f_auto/v1779205048/YTDown_YouTube_Media_jrK9TiZ251M_008_128k_jxdssu.mp3",
        cover: "https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779449481/IMG_1048_wrc4iq.jpg",
        duration: "",
        category: "bakalaam"
    },
    // برای افزودن موزیک جدید این الگو را کپی کن:
    // {
    //     id: 9,
    //     title: "نام موزیک",
    //     subtitle: "PlanLife",
    //     src: "https://...",       ← لینک فایل صوتی
    //     cover: "https://...",     ← لینک تصویر کاور
    //     duration: "۴:۳۰",        ← مدت زمان (اختیاری)
    //     category: "bikalaam"     ← یا "bakalaam"
    // },
];

// ============================================================
let currentTrackIndex = 0, currentCategory = 'bikalaam';
const audio = document.getElementById('mainAudio');
const progressBarEl = document.getElementById('progressBar');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl   = document.getElementById('totalTime');
const progressContainer = document.getElementById('progressContainer');
const statusEl      = document.getElementById('playerStatus');

// ---- رندر گرید ----
function renderGrid(items) {
    const grid = document.getElementById('musicGrid');
    grid.innerHTML = items.map(item => {
        const si = item.title.replace(/'/g,"\\'");
        const ss = item.subtitle.replace(/'/g,"\\'");
        const sc = item.src.replace(/'/g,"\\'");
        const sv = item.cover.replace(/'/g,"\\'");
        return `
        <div class="music-box" onclick="playAudio('${si}','${ss}','${sc}','${sv}',${item.id})">
            <div class="music-cover-wrap">
                <img src="${item.cover}" class="music-cover" alt="${item.title}">
                <div class="play-overlay">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
            </div>
            <div class="music-name">${item.title}</div>
            ${item.duration ? `<div class="music-duration">⏱ ${item.duration}</div>` : ''}
        </div>`;
    }).join('');
}

function selectCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll('.cat-card').forEach(el => el.classList.remove('active'));
    document.getElementById('cat-' + cat).classList.add('active');
    renderGrid(musicData.filter(m => m.category === cat));
}

// ---- Audio ----
function formatTime(s) {
    if (!s || isNaN(s)) return "0:00";
    return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`;
}

audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressBarEl.style.width = pct + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
    const mpb = document.getElementById('miniProgressBar');
    if (mpb) mpb.style.width = pct + '%';
});
audio.addEventListener('loadedmetadata', () => {
    totalTimeEl.textContent = formatTime(audio.duration);
});
progressContainer.addEventListener('click', e => {
    const r = progressContainer.getBoundingClientRect();
    audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
});

function setPlayIcons(playing) {
    const icon = playing
        ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';
    document.getElementById('playIcon').innerHTML = icon;
    document.getElementById('miniPlayIcon').innerHTML = icon;
    statusEl.textContent = playing ? 'در حال پخش' : 'متوقف شده';
}

function playAudio(title, subtitle, src, cover, id) {
    document.getElementById('npTitle').textContent    = title;
    document.getElementById('npSubtitle').textContent = subtitle;
    document.getElementById('npCover').src            = cover;
    document.getElementById('miniTitle').textContent  = title;
    document.getElementById('miniEp').textContent     = subtitle;
    document.getElementById('miniCover').src          = cover;

    // پیدا کردن ایندکس در آرایه فیلتر شده فعلی
    const filtered = musicData.filter(m => m.category === currentCategory);
    currentTrackIndex = filtered.findIndex(m => m.id === id);

    audio.src = src;
    audio.play().then(() => setPlayIcons(true)).catch(() => setPlayIcons(false));
    expandPlayer();
}

function expandPlayer() {
    const screen = document.getElementById('nowPlayingScreen');
    document.getElementById('miniPlayer').classList.remove('active');
    screen.style.transition = 'none';
    screen.style.transform  = 'translateY(110%)';
    screen.scrollTop = 0;
    screen.classList.add('active');
    requestAnimationFrame(() => requestAnimationFrame(() => {
        screen.style.transition = 'transform 0.52s cubic-bezier(0.32,0.72,0,1), border-radius 0.52s cubic-bezier(0.32,0.72,0,1)';
        screen.style.transform  = 'translateY(0%)';
    }));
}

function minimizePlayer() {
    const screen = document.getElementById('nowPlayingScreen');
    screen.style.transition = 'transform 0.48s cubic-bezier(0.32,0.72,0,1)';
    screen.style.transform  = 'translateY(110%)';
    setTimeout(() => {
        screen.classList.remove('active');
        screen.style.cssText = '';
        if (audio.src) document.getElementById('miniPlayer').classList.add('active');
    }, 480);
}

function killPlayer() {
    const screen = document.getElementById('nowPlayingScreen');
    screen.style.transition = 'transform 0.38s cubic-bezier(0.32,0.72,0,1)';
    screen.style.transform  = 'translateY(100%)';
    setTimeout(() => {
        screen.classList.remove('active');
        screen.style.cssText = '';
        document.getElementById('miniPlayer').classList.remove('active');
        audio.pause();
    }, 380);
    setPlayIcons(false);
}

function miniTogglePlay() {
    if (audio.paused) { audio.play(); setPlayIcons(true); }
    else              { audio.pause(); setPlayIcons(false); }
}
function togglePlay() { miniTogglePlay(); }
function seek(sec) { if (audio.src) audio.currentTime = Math.max(0, audio.currentTime + sec); }
function closeNowPlaying() { minimizePlayer(); }

function prevTrack() {
    const filtered = musicData.filter(m => m.category === currentCategory);
    if (currentTrackIndex > 0) {
        const p = filtered[currentTrackIndex - 1];
        playAudio(p.title, p.subtitle, p.src, p.cover, p.id);
    }
}
function nextTrack() {
    const filtered = musicData.filter(m => m.category === currentCategory);
    if (currentTrackIndex < filtered.length - 1) {
        const n = filtered[currentTrackIndex + 1];
        playAudio(n.title, n.subtitle, n.src, n.cover, n.id);
    }
}

// ---- Drag to minimize ----
(function() {
    const screen = document.getElementById('nowPlayingScreen');
    let startY = 0, startX = 0, lastY = 0, velocity = 0, lastTime = 0;
    let intentDecided = false, isMinimizing = false;
    function onStart(e) {
        const t = e.touches[0];
        startY = t.clientY; startX = t.clientX;
        lastY = startY; lastTime = Date.now();
        velocity = 0; intentDecided = false; isMinimizing = false;
        screen.style.transition = 'none';
    }
    function onMove(e) {
        const t = e.touches[0];
        const dy = t.clientY - startY;
        const adx = Math.abs(t.clientX - startX);
        const now = Date.now(), dt = now - lastTime;
        if (dt > 0) velocity = (t.clientY - lastY) / dt;
        lastY = t.clientY; lastTime = now;
        if (!intentDecided && (Math.abs(dy) > 8 || adx > 8)) {
            intentDecided = true;
            if (adx > Math.abs(dy) * 1.2) return;
            if (dy < 0) return;
            if (dy > 0 && screen.scrollTop <= 1) { isMinimizing = true; }
        }
        if (!isMinimizing || dy <= 0) return;
        e.preventDefault();
        const progress = Math.min(dy / 380, 1);
        screen.style.transform = `translateY(${dy * (1 - progress * 0.3)}px) scale(${1 - progress * 0.08})`;
        screen.style.borderRadius = `${progress * 28}px ${progress * 28}px 0 0`;
        screen.style.opacity = 1 - progress * 0.15;
    }
    function onEnd() {
        if (!isMinimizing) return;
        isMinimizing = false;
        const dy = lastY - startY;
        const shouldMin = velocity > 0.4 || dy > 130;
        screen.style.transition = 'transform 0.46s cubic-bezier(0.32,0.72,0,1), border-radius 0.46s, opacity 0.46s';
        if (shouldMin) {
            screen.style.transform = 'translateY(100%) scale(0.92)';
            screen.style.opacity = '0.6';
            setTimeout(() => {
                screen.classList.remove('active');
                screen.style.cssText = '';
                if (audio.src) document.getElementById('miniPlayer').classList.add('active');
            }, 460);
        } else {
            screen.style.transform = 'translateY(0) scale(1)';
            screen.style.borderRadius = '0';
            screen.style.opacity = '1';
            setTimeout(() => { screen.style.transition = screen.style.transform = screen.style.borderRadius = screen.style.opacity = ''; }, 460);
        }
    }
    screen.addEventListener('touchstart', onStart, { passive: true });
    screen.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
    document.addEventListener('touchcancel', onEnd);
})();

// ---- شروع ----
window.onload = () => selectCategory('bikalaam');
</script>
