<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>دوره‌های PlanLife</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Vazirmatn', sans-serif; overflow-x: hidden; color: white; background: #030303; }
    .stars { position: fixed; inset: 0; background: transparent; z-index: 1; pointer-events: none; }
    .stars::before, .stars::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(white 1px, transparent 1px); background-size: 80px 80px; opacity: 0.45; animation: twinkle 10s infinite alternate; }
    .stars::after { background-size: 140px 140px; opacity: 0.3; animation-duration: 16s; }
    @keyframes twinkle { 0% { opacity: 0.35; } 100% { opacity: 0.65; } }

    header { position: fixed; top: 0; left: 0; right: 0; height: 65px; display: flex; align-items: center; padding: 0 20px; z-index: 100; background: rgba(0,0,0,0.25); backdrop-filter: blur(10px); }

    .main-center { position: relative; z-index: 5; min-height: 100vh; padding: 75px 20px 120px; }

    h2 { font-size: 32px; margin-bottom: 15px; text-align: center; font-weight: 900; }

    .section-title { font-size: 22px; margin: 20px 0 12px; padding: 0 5px; }

    .horizontal-scroll { display: flex; gap: 15px; overflow-x: auto; padding: 12px 0 25px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .horizontal-scroll::-webkit-scrollbar { display: none; }

    .slide-item { min-width: 140px; flex-shrink: 0; text-align: center; cursor: pointer; background: rgba(255,255,255,0.11); backdrop-filter: blur(12px); border-radius: 18px; padding: 10px 8px; }
    .slide-item img { width: 130px; height: 130px; object-fit: cover; border-radius: 18px; margin-bottom: 8px; }

    .podcast-item { background: rgba(255,255,255,0.1); backdrop-filter: blur(12px); border-radius: 18px; padding: 12px 15px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; }
    .podcast-item img { width: 55px; height: 55px; object-fit: cover; border-radius: 12px; }
    .music-info { flex: 1; }
    .music-title { font-weight: 600; font-size: 16px; }
    .music-artist { font-size: 14px; opacity: 0.8; }
    .music-duration { font-size: 14px; opacity: 0.7; align-self: center; }

    .play-circle { width: 42px; height: 42px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; }

    .now-playing { position: fixed; inset: 0; background: rgba(10, 10, 25, 0.96); backdrop-filter: blur(30px); z-index: 300; display: none; flex-direction: column; align-items: center; padding: 20px 20px 40px; overflow: hidden; }
    .now-playing.active { display: flex; }

    .player-topbar { width: 100%; max-width: 380px; display: flex; justify-content: space-between; align-items: center; padding: 8px 0 16px; }
    .player-status { font-size: 15px; font-weight: 600; opacity: 0.85; }

    .big-cover { width: 100%; max-width: 310px; margin: 10px 0 20px; }
    .big-cover img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 24px; box-shadow: 0 25px 70px rgba(192, 38, 211, 0.55); }

    .track-info { text-align: center; width: 100%; max-width: 360px; margin-bottom: 16px; }
    .np-title { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
    .np-subtitle { font-size: 16.5px; opacity: 0.7; }

    .progress-section { width: 100%; max-width: 360px; margin-bottom: 28px; }
    .progress-container { width: 100%; height: 5px; background: rgba(255,255,255,0.18); border-radius: 999px; cursor: pointer; margin-bottom: 8px; }
    .progress-bar { height: 100%; background: linear-gradient(to right, #ff9500, #ff6b00); border-radius: 999px; box-shadow: 0 0 12px #ff9500; }
    .time-display { display: flex; justify-content: space-between; font-size: 13.5px; opacity: 0.75; }

    .main-controls { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 360px; padding: 0 10px; margin-bottom: 30px; }
    .control-btn { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .control-btn svg { width: 30px; height: 30px; fill: #ddd; transition: all 0.2s; }
    .control-btn:active svg { fill: #ff9500; transform: scale(0.9); }

    .play-main { width: 82px; height: 82px; background: #ff9500; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(255, 149, 0, 0.65); cursor: pointer; }
    .play-main svg { width: 36px; height: 36px; fill: #1a0033; }
</style>
</head>

<div class="stars"></div>

<header>

        ← خانه

    <h2>دوره‌های PlanLife</h2>

    <div class="section-title" id="currentCategoryTitle">همه دوره‌ها</div>

</div>

<!-- پلیر مدرن بزرگ -->
<div id="nowPlayingScreen" class="now-playing">
    <div class="player-topbar">
        <button onclick="closeNowPlaying()" style="font-size:26px;background:none;border:none;color:white;">←</button>
        <span id="playerStatus" class="player-status">در حال پخش</span>
        <button onclick="showMenu()" style="font-size:26px;background:none;border:none;color:white;">⋯</button>
    </div>
    
    <div class="big-cover">
        <img id="npCover" src="" alt="">
    </div>
    
    <div class="track-info">

    </div>

    <div class="progress-section">

        </div>
        <div class="time-display">
            <span id="currentTime">0:00</span>

        </div>
    </div>

    <div class="main-controls">
        <div class="control-btn" onclick="prevTrack()">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg>
        </div>
        <div class="control-btn" onclick="seek(-10)">

        </div>
        <div class="control-btn" onclick="nextTrack()">

        </div>

    const cats = cat ? [cat] : ["دوره کارگاه ثروتسازی", "دوره عشق و روابط", "دوره تحول حال و احساس", "دوره اعتماد به نفس", "دوره احساس لیاقت"];
    cats.forEach(c => {
        const filtered = courseData.filter(item => item.title === c);
        filtered.forEach(item => {
            const duration = ["32:45", "43:12", "21:58", "35:05", "33:30"][(item.episode-1) % 5] || "00:00";
            html += `
                <div class="podcast-item" onclick="playCourse('${item.title}', ${item.episode}, '${item.src}', '${item.cover}')">
                    <img src="${item.cover}" alt="">
                    <div class="music-info">
                        <div class="music-title">${item.title}</div>
                        <div class="music-artist">قسمت ${item.episode}</div>
                    </div>
                    <div class="music-duration">${duration}</div>
                    <div class="play-circle"><div class="play-triangle" style="width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:14px solid white;margin-left:3px;"></div></div>
                </div>`;
        });
    });
    document.getElementById('podcastList').innerHTML = html || '<p style="text-align:center; padding:40px; opacity:0.7;">موردی یافت نشد</p>';
}

function playCourse(title, episode, src, cover) {

}

const audio = document.getElementById('mainAudio');
const progressBar = document.getElementById('progressBar');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const progressContainer = document.getElementById('progressContainer');
const statusEl = document.getElementById('playerStatus');
const playIcon = document.getElementById('playIcon');

function formatTime(s) { if (!s || isNaN(s)) return "0:00"; return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; }
function updateProgress() { if (!audio.duration) return; progressBar.style.width = `${(audio.currentTime / audio.duration) * 100}%`; currentTimeEl.textContent = formatTime(audio.currentTime); }
audio.addEventListener('timeupdate', updateProgress);
audio.addEventListener('loadedmetadata', () => totalTimeEl.textContent = formatTime(audio.duration));
progressContainer.addEventListener('click', e => { const rect = progressContainer.getBoundingClientRect(); audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration; });
function updatePlayerStatus(playing) { statusEl.textContent = playing ? 'در حال پخش' : 'متوقف شده'; }

function playAudio(title, src, cover) {
    document.getElementById('npTitle').textContent = title;
    document.getElementById('npSubtitle').textContent = "PlanLife";
    document.getElementById('npCover').src = cover;
    document.getElementById('nowPlayingScreen').classList.add('active');
    audio.src = src;
    audio.play().then(() => { updatePlayerStatus(true); playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; });
    currentTrackIndex = courseData.findIndex(item => item.src === src);
}

function togglePlay() { if (audio.paused) { audio.play(); playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; updatePlayerStatus(true); } else { audio.pause(); playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; updatePlayerStatus(false); } }
function seek(sec) { audio.currentTime += sec; }
function prevTrack() { if (currentTrackIndex > 0) { const p = courseData[currentTrackIndex - 1]; playAudio(p.title, p.src, p.cover); } }
function nextTrack() { if (currentTrackIndex < courseData.length - 1) { const n = courseData[currentTrackIndex + 1]; playAudio(n.title, n.src, n.cover); } }
function closeNowPlaying() { document.getElementById('nowPlayingScreen').classList.remove('active'); audio.pause(); updatePlayerStatus(false); }
function showMenu() { alert("منو"); }
function goToHome() { window.location.href = "https://planlife.ir"; }

window.onload = loadPage;
