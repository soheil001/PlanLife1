<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0033">
<title>دوره‌های PlanLife</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Vazirmatn', sans-serif; overflow-x: hidden; color: white; background: #030303; }
    .stars { position: fixed; inset: 0; background: transparent; z-index: 1; pointer-events: none; }
    .stars::before, .stars::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(white 1px, transparent 1px); background-size: 80px 80px; opacity: 0.45; animation: twinkle 10s infinite alternate; }
    .stars::after { background-size: 140px 140px; opacity: 0.3; animation-duration: 16s; }
    @keyframes twinkle { 0% { opacity: 0.35; } 100% { opacity: 0.65; } }

    header { position: fixed; top: 0; left: 0; right: 0; height: 65px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; background: rgba(0,0,0,0.25); backdrop-filter: blur(10px); }

    .main-center { position: relative; z-index: 5; min-height: 100vh; padding: 75px 20px 140px; }
    h2 { font-size: 32px; margin-bottom: 15px; text-align: center; font-weight: 900; }
    .section-title { font-size: 22px; margin: 20px 0 12px; padding: 0 5px; }

    .horizontal-scroll { display: flex; gap: 15px; overflow-x: auto; padding: 12px 0 25px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .horizontal-scroll::-webkit-scrollbar { display: none; }

    .slide-item { min-width: 140px; flex-shrink: 0; text-align: center; cursor: pointer; background: rgba(255,255,255,0.11); backdrop-filter: blur(12px); border-radius: 18px; padding: 10px 8px; }
    .slide-item img { width: 130px; height: 130px; object-fit: cover; border-radius: 18px; margin-bottom: 8px; }

    .podcast-item { background: rgba(255,255,255,0.1); backdrop-filter: blur(12px); border-radius: 18px; padding: 12px 15px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; }
    .podcast-item img { width: 55px; height: 55px; object-fit: cover; border-radius: 12px; }
    .music-info { flex: 1; }
    .music-title { font-weight: 600; font-size: 16px; }
    .music-artist { font-size: 14px; opacity: 0.8; }
    .music-duration { font-size: 14px; opacity: 0.7; align-self: center; }
    .play-circle { width: 42px; height: 42px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    /* ===== now playing ===== */
    .now-playing {
        position: fixed;
        top: 10px; left: 10px; right: 10px;
        height: calc(100% - 10px); height: calc(100dvh - 10px);
        background: rgba(10, 10, 25, 0.98);
        z-index: 300;
        display: none;
        flex-direction: column;
        align-items: center;
        padding: 20px 20px 40px;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        transform: translateY(110%);
        border-radius: 22px 22px 0 0;
        will-change: transform, border-radius;
        touch-action: pan-y;
    }
    .now-playing.active {
        display: flex;
        transform: translateY(0%);
        border-radius: 22px 22px 0 0;
        transition: transform 0.52s cubic-bezier(0.32, 0.72, 0, 1),
                    border-radius 0.52s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .drag-handle-wrap { width: 100%; display: flex; justify-content: center; padding: 6px 0 2px; flex-shrink: 0; cursor: grab; }
    .drag-handle { width: 44px; height: 5px; background: rgba(255,255,255,0.65); border-radius: 999px; box-shadow: 0 0 8px rgba(255,255,255,0.2); }

    /* ===== mini player ===== */
    .mini-player {
        position: fixed;
        bottom: 15px; left: 15px; right: 15px;
        height: 72px;
        background: rgba(18, 18, 40, 0.72);
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 22px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
        z-index: 290;
        display: none; align-items: center;
        padding: 0 16px; gap: 12px;
        cursor: pointer; overflow: hidden;
    }
    .mini-player.active { display: flex; }
    .mini-cover { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
    .mini-info { flex: 1; overflow: hidden; }
    .mini-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-ep { font-size: 12px; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-progress { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: rgba(255,255,255,0.10); border-radius: 0 0 22px 22px; overflow: hidden; }
    .mini-progress-bar { height: 100%; background: linear-gradient(to right, #ff9500, #ff6b00); border-radius: 999px; transition: width 0.5s linear; }
    .mini-play-btn { width: 42px; height: 42px; background: #ff9500; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 14px rgba(255,149,0,0.5); }
    .mini-play-btn svg { width: 22px; height: 22px; fill: #1a0033; }
    .mini-close { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; opacity: 0.5; flex-shrink: 0; font-size: 20px; }

    .player-topbar { width: 100%; max-width: 380px; display: flex; justify-content: space-between; align-items: center; padding: 8px 0 16px; flex-shrink: 0; }
    .player-status { font-size: 15px; font-weight: 600; opacity: 0.85; }

    .big-cover { width: 100%; max-width: 200px; margin: 6px 0 10px; position: relative; flex-shrink: 0; }
    .big-cover img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 20px; box-shadow: 0 15px 45px rgba(192,38,211,0.5); }
    .cover-comment-badge {
        position: absolute; bottom: -13px; left: 50%; transform: translateX(-50%);
        background: rgba(20,20,40,0.92); border: 1px solid rgba(255,255,255,0.18);
        backdrop-filter: blur(10px); border-radius: 999px; padding: 5px 14px;
        display: flex; align-items: center; gap: 6px;
        font-size: 13px; font-weight: 700; white-space: nowrap;
        box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .cover-comment-badge svg { width: 15px; height: 15px; fill: #ff9500; flex-shrink: 0; }

    .track-info { text-align: center; width: 100%; max-width: 360px; margin: 20px 0 10px; flex-shrink: 0; }
    .np-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .np-subtitle { font-size: 14.5px; opacity: 0.7; }

    .progress-section { width: 100%; max-width: 360px; margin-bottom: 28px; flex-shrink: 0; }
    .progress-container { width: 100%; height: 5px; background: rgba(255,255,255,0.18); border-radius: 999px; cursor: pointer; margin-bottom: 8px; }
    .progress-bar { height: 100%; background: linear-gradient(to right, #ff9500, #ff6b00); border-radius: 999px; box-shadow: 0 0 12px #ff9500; }
    .time-display { display: flex; justify-content: space-between; font-size: 13.5px; opacity: 0.75; }

    .main-controls { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 360px; padding: 0 10px; margin-bottom: 30px; flex-shrink: 0; }
    .control-btn { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .control-btn svg { width: 30px; height: 30px; fill: #ddd; transition: all 0.2s; }
    .control-btn:active svg { fill: #ff9500; transform: scale(0.9); }
    .play-main { width: 82px; height: 82px; background: #ff9500; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(255,149,0,0.65); cursor: pointer; }
    .play-main svg { width: 36px; height: 36px; fill: #1a0033; }

    /* ===== comments ===== */
    .comments-section { width: 100%; max-width: 360px; margin-top: 10px; padding-bottom: 30px; }
    .comments-list { max-height: 240px; overflow-y: auto; padding-right: 4px; margin-bottom: 14px; }
    .comments-list::-webkit-scrollbar { width: 5px; }
    .comments-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 10px; }
    .delete-btn { background: rgba(255,50,50,0.2); border: 1px solid rgba(255,50,50,0.4); color: #ff6464; border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
    .delete-btn:active { background: rgba(255,50,50,0.5); }
    .loading-comments { text-align: center; padding: 20px; opacity: 0.6; font-size: 14px; }

    /* admin badge */
    .admin-badge { display: flex; align-items: center; gap: 6px; background: rgba(255,149,0,0.2); border: 1px solid rgba(255,149,0,0.5); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700; color: #ff9500; cursor: pointer; font-family: inherit; }

    /* modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 400; display: none; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: rgba(255,255,255,0.11); backdrop-filter: blur(20px); border-radius: 24px; padding: 30px 25px; width: 90%; max-width: 360px; text-align: center; max-height: 90vh; overflow-y: auto; }
    .modal-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; cursor: pointer; margin-top: 10px; font-family: inherit; }

    /* ===== pricing modal ===== */
    .pricing-box {
        background: linear-gradient(135deg, rgba(255,255,255,0.10) 0%, rgba(160,120,255,0.08) 50%, rgba(255,149,0,0.06) 100%);
        backdrop-filter: blur(22px) saturate(160%);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 20px;
        padding: 18px 20px;
        margin-bottom: 12px;
        text-align: right;
        box-shadow: 0 4px 24px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.15);
        position: relative;
        overflow: hidden;
    }
    .pricing-box::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    }
    .pricing-box .course-name { font-size: 15px; font-weight: 800; margin-bottom: 10px; color: #fff; letter-spacing: 0.2px; }
    .pricing-box .old-price { font-size: 13px; color: rgba(255,255,255,0.38); text-decoration: line-through; margin-bottom: 5px; }
    .pricing-box .new-price { font-size: 20px; font-weight: 900; background: linear-gradient(135deg, #ffd700, #ff9500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .pricing-box .discount-tag { display: inline-block; background: rgba(255,149,0,0.18); border: 1px solid rgba(255,149,0,0.4); color: #ffb347; border-radius: 999px; padding: 3px 12px; font-size: 11.5px; font-weight: 800; margin-right: 8px; vertical-align: middle; }

    .pay-btn-gold {
        width: 100%; padding: 17px; border: none; border-radius: 16px;
        background: linear-gradient(135deg, #ffd700 0%, #ffaa00 50%, #ff8c00 100%);
        color: #1a0033; font-size: 16px; font-weight: 900;
        cursor: pointer; font-family: inherit; margin-top: 16px;
        box-shadow: 0 8px 28px rgba(255,149,0,0.55), 0 2px 8px rgba(255,149,0,0.3);
        letter-spacing: 0.5px;
        transition: transform 0.15s, box-shadow 0.15s;
    }
    .pay-btn-gold:active { transform: scale(0.97); box-shadow: 0 4px 14px rgba(255,149,0,0.4); }

    /* ===== card payment modal ===== */
    .card-modal-inner {
        background: linear-gradient(145deg, rgba(20,10,50,0.92) 0%, rgba(10,20,60,0.88) 100%);
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        border: 1px solid rgba(120,100,255,0.28);
        border-radius: 24px;
        padding: 24px 20px;
        box-shadow: 0 8px 40px rgba(80,40,200,0.25), inset 0 1px 0 rgba(255,255,255,0.1);
        position: relative;
        overflow: hidden;
    }
    .card-modal-inner::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(160,120,255,0.6), rgba(255,149,0,0.4), transparent);
    }

    .card-number-box {
        display: flex; align-items: center; justify-content: space-between;
        background: linear-gradient(135deg, rgba(80,60,200,0.22) 0%, rgba(120,80,255,0.18) 50%, rgba(60,40,160,0.22) 100%);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(140,100,255,0.35);
        border-radius: 16px; padding: 12px 16px; margin: 12px 0;
        direction: ltr;
        box-shadow: 0 4px 20px rgba(80,40,200,0.2), inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .card-number-text { font-size: 15px; font-weight: 800; letter-spacing: 3px; background: linear-gradient(135deg, #c9b8ff, #9b7fff, #7b5fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .copy-btn {
        background: rgba(120,80,255,0.22);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(140,100,255,0.4);
        border-radius: 10px; padding: 7px 12px;
        color: #c9b8ff; font-size: 13px; cursor: pointer; font-family: inherit;
        display: flex; align-items: center; gap: 5px; white-space: nowrap;
        transition: background 0.2s;
    }
    .copy-btn:active { background: rgba(120,80,255,0.42); }

    .platform-btn {
        width: 100%; padding: 13px 16px; border: none; border-radius: 14px;
        font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
        display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
        backdrop-filter: blur(16px); transition: opacity 0.2s, transform 0.15s;
    }
    .platform-btn:active { opacity: 0.75; transform: scale(0.98); }
    .platform-btn img { width: 28px; height: 28px; border-radius: 7px; object-fit: cover; flex-shrink: 0; }

    .btn-telegram { background: linear-gradient(135deg, rgba(33,150,243,0.22), rgba(0,136,204,0.18)); border: 1px solid rgba(33,150,243,0.45); color: #82cbff; }
    .btn-whatsapp { background: linear-gradient(135deg, rgba(37,211,102,0.18), rgba(18,183,84,0.14)); border: 1px solid rgba(37,211,102,0.4); color: #7fffc4; }
    .btn-bale     { background: linear-gradient(135deg, rgba(130,80,255,0.22), rgba(100,60,200,0.18)); border: 1px solid rgba(130,80,255,0.45); color: #d4b3ff; }

    .receipt-img { width: 160px; margin: 0 auto 18px; display: block; border-radius: 18px; box-shadow: 0 8px 28px rgba(0,0,0,0.4); }
</style>
</head>
<body>

<div class="stars"></div>

<header>
    <div onclick="goToHome()"
         style="font-size:15px; cursor:pointer; color:white;
                background: rgba(255,255,255,0.12); backdrop-filter: blur(12px);
                padding: 9px 22px; border-radius: 30px;
                display: inline-flex; align-items: center; gap: 8px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        ← خانه
    </div>
    <div id="headerAuthArea">
        <button onclick="openAdminModal()" class="admin-badge">🔐 ورود ادمین</button>
    </div>
</header>

<div class="main-center">
    <h2>دوره‌های PlanLife</h2>
    <div class="section-title">دسته‌بندی‌ها</div>
    <div class="horizontal-scroll" id="categorySlides"></div>
    <div class="section-title" id="currentCategoryTitle">همه دوره‌ها</div>
    <div id="podcastList"></div>
</div>

<!-- Modal اشتراک / ادمین -->
<div id="subscriptionModal" class="modal-overlay">
    <div class="modal-box" id="modalContent"></div>
</div>

<!-- modal پرداخت -->
<div id="pricingModal" class="modal-overlay">
    <div class="modal-box" id="pricingContent" style="max-width:400px;"></div>
</div>

<!-- modal شماره کارت -->
<div id="cardModal" class="modal-overlay">
    <div class="modal-box" id="cardContent" style="max-width:400px;"></div>
</div>

<!-- mini player -->
<div id="miniPlayer" class="mini-player" onclick="expandPlayer()">
    <img id="miniCover" class="mini-cover" src="" alt="">
    <div class="mini-info">
        <div id="miniTitle" class="mini-title">در حال پخش</div>
        <div id="miniEp" class="mini-ep">PlanLife</div>
    </div>
    <div class="mini-play-btn" onclick="event.stopPropagation(); miniTogglePlay()">
        <svg id="miniPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div class="mini-close" onclick="event.stopPropagation(); killPlayer()">✕</div>
    <div class="mini-progress">
        <div class="mini-progress-bar" id="miniProgressBar" style="width:0%"></div>
    </div>
</div>

<!-- پلیر بزرگ -->
<div id="nowPlayingScreen" class="now-playing">
    <div class="drag-handle-wrap"><div class="drag-handle"></div></div>
    <div class="player-topbar">
        <button onclick="closeNowPlaying()" style="font-size:26px;background:none;border:none;color:white;">←</button>
        <span id="playerStatus" class="player-status">در حال پخش</span>
        <button onclick="showMenu()" style="font-size:26px;background:none;border:none;color:white;">⋯</button>
    </div>

    <div class="big-cover">
        <img id="npCover" src="" alt="">
        <div class="cover-comment-badge" id="coverCommentBadge">
            <svg viewBox="0 0 24 24"><path d="M21 6.5C21 5.12 19.88 4 18.5 4h-13C4.12 4 3 5.12 3 6.5v8C3 15.88 4.12 17 5.5 17H7l3 3 3-3h5.5c1.38 0 2.5-1.12 2.5-2.5v-8z"/></svg>
            <span id="coverCommentCount">۰</span>
            <span style="opacity:0.7; font-weight:500;">نظر</span>
        </div>
    </div>

    <div class="track-info">
        <h2 id="npTitle" class="np-title">عنوان دوره</h2>
        <p id="npSubtitle" class="np-subtitle">PlanLife</p>
    </div>
    <div class="progress-section">
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>
    </div>
    <div class="main-controls">
        <div class="control-btn" onclick="prevTrack()"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg></div>
        <div class="control-btn" onclick="seek(-10)"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg></div>
        <div onclick="togglePlay()" class="play-main"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        <div class="control-btn" onclick="seek(10)"><svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg></div>
        <div class="control-btn" onclick="nextTrack()"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></div>
    </div>

    <!-- بخش نظرات -->
    <div class="comments-section">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:0 4px;">
            <span style="font-size:19px;font-weight:700;">💬 نظرات</span>
            <span id="commentCount" style="background:#ff9500;color:#1a0033;font-size:12.5px;font-weight:800;padding:3px 11px;border-radius:999px;min-width:22px;text-align:center;">0</span>
        </div>
        <div id="commentsList" class="comments-list"></div>
        <div id="commentForm" style="background:rgba(255,255,255,0.09);border-radius:18px;padding:16px 16px 18px;">
            <input id="commentName" type="text" placeholder="نام شما (اختیاری)" onfocus="scrollToForm()"
                   style="width:100%;background:rgba(0,0,0,0.4);border:1.5px solid rgba(255,255,255,0.1);border-radius:14px;padding:13px 16px;color:white;font-size:16px;margin-bottom:10px;outline:none;font-family:inherit;-webkit-appearance:none;">
            <textarea id="commentText" placeholder="نظر خود را اینجا بنویسید..." rows="3" onfocus="scrollToForm()"
                      style="width:100%;background:rgba(0,0,0,0.4);border:1.5px solid rgba(255,255,255,0.1);border-radius:14px;padding:13px 16px;color:white;font-size:16px;resize:none;height:80px;outline:none;font-family:inherit;line-height:1.5;display:block;-webkit-appearance:none;"></textarea>
            <button id="submitCommentBtn" onclick="addComment()"
                    style="margin-top:12px;width:100%;background:#ff9500;color:#1a0033;border:none;border-radius:999px;padding:15px 0;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit;box-shadow:0 4px 18px rgba(255,149,0,0.35);">
                ارسال نظر
            </button>
        </div>
    </div>

    <audio id="mainAudio" style="display:none;"></audio>
</div>

<script>
// ==================== JSONBin ====================
const JSONBIN_BIN_ID     = '6a257a88da38895dfe94f630';
const JSONBIN_MASTER_KEY = '$2a$10$0LIPWu8zUHDSSPOGS0v5z.qSAdQB0ruLVwurkAvAHEEuk61021Xzi';
const JSONBIN_URL        = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

let allComments  = {};
let remoteRecord = {};
let isSaving     = false;

async function fetchAllComments() {
    try {
        const res = await fetch(`${JSONBIN_URL}/latest`, {
            headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
        });
        if (!res.ok) throw new Error('fetch ' + res.status);
        const data = await res.json();
        remoteRecord = data.record || {};
        Object.keys(remoteRecord).forEach(k => { allComments[k] = remoteRecord[k]; });
        return true;
    } catch(e) { console.warn('JSONBin fetch:', e); return false; }
}

async function pushAllComments() {
    if (isSaving) return;
    isSaving = true;
    try {
        const payload = Object.assign({}, remoteRecord, allComments);
        const res = await fetch(JSONBIN_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_MASTER_KEY },
            body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('push ' + res.status);
        remoteRecord = payload;
    } catch(e) { console.warn('JSONBin push:', e); }
    finally    { isSaving = false; }
}

// ==================== کلید کامنت ====================
function commentKey(title, episode) { return `course_${title}_ep${episode}`; }
function toPersianNum(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ==================== بارگذاری کامنت‌ها ====================
async function loadComments(title, episode) {
    const key = commentKey(title, episode);
    currentTrackKey = key;
    document.getElementById('commentsList').innerHTML = '<div class="loading-comments">⏳ در حال بارگذاری نظرات...</div>';
    document.getElementById('commentCount').textContent = '...';
    await fetchAllComments();
    if (!allComments[key]) allComments[key] = [];
    renderComments(key);
    courseData.forEach((_, idx) => updateListBadge(idx));
}

function renderComments(key) {
    const comments = allComments[key] || [];
    const list = document.getElementById('commentsList');
    const countEl = document.getElementById('commentCount');
    const coverCount = document.getElementById('coverCommentCount');
    if (!list || !countEl) return;
    countEl.textContent = comments.length;
    if (coverCount) coverCount.textContent = toPersianNum(comments.length);
    list.innerHTML = '';
    if (comments.length === 0) {
        list.innerHTML = '<p style="opacity:0.6;text-align:center;padding:22px 10px;font-size:14px;line-height:1.6;">هنوز نظری ثبت نشده.<br>اولین نفر باشید!</p>';
        return;
    }
    comments.forEach(c => {
        const div = document.createElement('div');
        div.style.cssText = 'background:rgba(255,255,255,0.085);border-radius:14px;padding:13px 15px;margin-bottom:9px;border:1px solid rgba(255,255,255,0.06);';
        div.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
                <strong style="color:#ffd700;font-size:14.5px;">${escapeHtml(c.name)}</strong>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span style="font-size:11.5px;opacity:0.55;white-space:nowrap;">${c.time}</span>
                    ${isAdmin ? `<button class="delete-btn" onclick="deleteComment('${key}',${c.id})">🗑 حذف</button>` : ''}
                </div>
            </div>
            <p style="font-size:14.8px;line-height:1.55;margin:0;color:#f0f0f0;">${escapeHtml(c.text)}</p>`;
        list.appendChild(div);
    });
}

async function addComment() {
    if (!currentTrackKey) return;
    const name = document.getElementById('commentName').value.trim() || 'ناشناس';
    const text = document.getElementById('commentText').value.trim();
    if (!text) { alert('لطفاً متن نظر را وارد کنید.'); return; }
    const btn = document.getElementById('submitCommentBtn');
    btn.textContent = '⏳ در حال ارسال...';
    btn.disabled = true;
    if (!allComments[currentTrackKey]) allComments[currentTrackKey] = [];
    const now = new Date();
    allComments[currentTrackKey].unshift({
        id: Date.now(), name, text,
        time: `${now.toLocaleDateString('fa-IR',{year:'numeric',month:'short',day:'numeric'})} • ${now.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}`
    });
    await pushAllComments();
    renderComments(currentTrackKey);
    const idx = courseData.findIndex(item => commentKey(item.title, item.episode) === currentTrackKey);
    if (idx !== -1) updateListBadge(idx);
    document.getElementById('commentText').value = '';
    document.getElementById('commentName').value = '';
    btn.textContent = 'ارسال نظر';
    btn.disabled = false;
}

async function deleteComment(key, commentId) {
    if (!isAdmin || !confirm('این نظر حذف شود؟')) return;
    allComments[key] = (allComments[key] || []).filter(c => c.id !== commentId);
    await pushAllComments();
    renderComments(key);
    const idx = courseData.findIndex(item => commentKey(item.title, item.episode) === key);
    if (idx !== -1) updateListBadge(idx);
}

function updateListBadge(idx) {
    const item = courseData[idx];
    const key = commentKey(item.title, item.episode);
    const cnt = toPersianNum((allComments[key] || []).length);
    const el = document.getElementById(`list-badge-${idx}`);
    if (el) el.textContent = cnt;
}

        if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' });

}

// ==================== پلیر ====================
function formatTime(s) { if (!s || isNaN(s)) return "0:00"; return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; }

audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    progressBar.style.width = `${(audio.currentTime/audio.duration)*100}%`;
    currentTimeEl.textContent = formatTime(audio.currentTime);
    const mpb = document.getElementById('miniProgressBar');
    if (mpb) mpb.style.width = `${(audio.currentTime/audio.duration)*100}%`;
});
audio.addEventListener('loadedmetadata', () => totalTimeEl.textContent = formatTime(audio.duration));
progressContainer.addEventListener('click', e => {
    const r = progressContainer.getBoundingClientRect();
    audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
});

function setPlayIcons(playing) {
    const icon = playing ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    playIcon.innerHTML = icon;
    document.getElementById('miniPlayIcon').innerHTML = icon;
    statusEl.textContent = playing ? 'در حال پخش' : 'متوقف شده';
}

function playAudio(item) {
    currentTrackIndex = courseData.indexOf(item);
    document.getElementById('npTitle').textContent = item.title;
    document.getElementById('npSubtitle').textContent = `قسمت ${item.episode}`;
    document.getElementById('npCover').src = item.cover;
    document.getElementById('miniTitle').textContent = item.title;
    document.getElementById('miniEp').textContent = `قسمت ${item.episode}`;
    document.getElementById('miniCover').src = item.cover;
    audio.src = item.src;
    audio.play().then(() => setPlayIcons(true)).catch(() => setPlayIcons(false));
    loadComments(item.title, item.episode);
    expandPlayer();
}

function expandPlayer() {
    const screen = document.getElementById('nowPlayingScreen');
    document.getElementById('miniPlayer').classList.remove('active');
    screen.style.transition = 'none';
    screen.style.transform = 'translateY(110%)';
    screen.style.borderRadius = '22px 22px 0 0';
    screen.scrollTop = 0;
    screen.classList.add('active');
    requestAnimationFrame(() => requestAnimationFrame(() => {
        screen.style.transition = 'transform 0.52s cubic-bezier(0.32,0.72,0,1), border-radius 0.52s cubic-bezier(0.32,0.72,0,1)';
        screen.style.transform = 'translateY(0%)';
        screen.style.borderRadius = '22px 22px 0 0';
    }));
}

function minimizePlayer() {
    const screen = document.getElementById('nowPlayingScreen');
    screen.style.transition = 'transform 0.48s cubic-bezier(0.32,0.72,0,1), border-radius 0.48s cubic-bezier(0.32,0.72,0,1)';
    screen.style.transform = 'translateY(110%)';
    screen.style.borderRadius = '22px 22px 0 0';
    setTimeout(() => {
        screen.classList.remove('active');
        screen.style.transform = '';
        screen.style.borderRadius = '';
        screen.style.transition = '';
        if (audio.src) document.getElementById('miniPlayer').classList.add('active');
    }, 480);
}

function killPlayer() {
    const screen = document.getElementById('nowPlayingScreen');
    screen.style.transition = 'transform 0.38s cubic-bezier(0.32,0.72,0,1)';
    screen.style.transform = 'translateY(100%)';
    setTimeout(() => {
        screen.classList.remove('active');
        screen.style.cssText = '';
        document.getElementById('miniPlayer').classList.remove('active');
        audio.pause();
    }, 380);
    setPlayIcons(false);
}

function miniTogglePlay() {
    if (audio.paused) { audio.play(); setPlayIcons(true); }
    else { audio.pause(); setPlayIcons(false); }
}
function togglePlay() { miniTogglePlay(); }
function seek(sec) { if (audio.src) audio.currentTime += sec; }
function prevTrack() { if (currentTrackIndex > 0) playAudio(courseData[currentTrackIndex-1]); }
function nextTrack() { if (currentTrackIndex < courseData.length-1) playAudio(courseData[currentTrackIndex+1]); }
function closeNowPlaying() { minimizePlayer(); }
function showMenu() { alert("منو (به زودی)"); }
function goToHome() { window.location.href = "https://planlife.ir"; }

// ==================== swipe gesture ====================
(function() {
    const screen = document.getElementById('nowPlayingScreen');
    let startY = 0, startX = 0, lastY = 0, velocity = 0, lastTime = 0;
    let intentDecided = false, isMinimizing = false;
    function onStart(e) {
        const t = e.touches[0];
        startY = t.clientY; startX = t.clientX;
        lastY = startY; lastTime = Date.now();
        velocity = 0; intentDecided = false; isMinimizing = false;
        screen.style.transition = 'none';
    }
    function onMove(e) {
        const t = e.touches[0];
        const dy = t.clientY - startY;
        const adx = Math.abs(t.clientX - startX);
        const now = Date.now(), dt = now - lastTime;
        if (dt > 0) velocity = (t.clientY - lastY) / dt;
        lastY = t.clientY; lastTime = now;
        if (!intentDecided && (Math.abs(dy) > 8 || adx > 8)) {
            intentDecided = true;
            if (adx > Math.abs(dy) * 1.2) return;
            if (dy < 0) return;
            if (dy > 0 && screen.scrollTop <= 1) { isMinimizing = true; screen.style.willChange = 'transform, border-radius'; }
        }
        if (!isMinimizing || dy <= 0) return;
        e.preventDefault();
        const progress = Math.min(dy / 380, 1);
        const resistance = dy * (1 - progress * 0.3);
        screen.style.transform = `translateY(${resistance}px) scale(${1 - progress * 0.08})`;
        screen.style.borderRadius = `${progress * 28}px ${progress * 28}px 0 0`;
        screen.style.opacity = 1 - progress * 0.15;
    }
    function onEnd() {
        if (!isMinimizing) return;
        isMinimizing = false;
        screen.style.willChange = '';
        const dy = lastY - startY;
        const shouldMinimize = velocity > 0.4 || dy > 130;
        screen.style.transition = 'transform 0.46s cubic-bezier(0.32,0.72,0,1), border-radius 0.46s cubic-bezier(0.32,0.72,0,1), opacity 0.46s ease';
        if (shouldMinimize) {
            screen.style.transform = 'translateY(100%) scale(0.92)';
            screen.style.borderRadius = '28px 28px 0 0';
            screen.style.opacity = '0.6';
            setTimeout(() => {
                screen.classList.remove('active');
                screen.style.cssText = '';
                if (audio.src) document.getElementById('miniPlayer').classList.add('active');
            }, 460);
        } else {
            screen.style.transform = 'translateY(0) scale(1)';
            screen.style.borderRadius = '0px';
            screen.style.opacity = '1';
            setTimeout(() => { screen.style.transition = ''; screen.style.transform = ''; screen.style.borderRadius = ''; screen.style.opacity = ''; }, 460);
        }
    }
    screen.addEventListener('touchstart', onStart, { passive: true });
    screen.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
    document.addEventListener('touchcancel', onEnd);
})();

window.onload = loadPage;
</script>
</body>
</html>
