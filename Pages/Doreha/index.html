<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0033">
<title>دوره‌های PlanLife</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: 'Vazirmatn', sans-serif;
        overflow-x: hidden;
        color: white;
        background: #030303;
    }

    .stars { position: fixed; inset: 0; background: transparent; z-index: 1; pointer-events: none; }
    .stars::before, .stars::after {
        content: ''; position: absolute; inset: 0;
        background-image: radial-gradient(white 1px, transparent 1px);
        background-size: 80px 80px; opacity: 0.45; animation: twinkle 10s infinite alternate;
    }
    .stars::after { background-size: 140px 140px; opacity: 0.3; animation-duration: 16s; }
    @keyframes twinkle { 0% { opacity: 0.35; } 100% { opacity: 0.65; } }

    header { position: fixed; top: 0; left: 0; right: 0; height: 65px; display: flex; align-items: center; padding: 0 20px; z-index: 100; background: rgba(0,0,0,0.25); backdrop-filter: blur(10px); }

    .main-center { position: relative; z-index: 5; min-height: 100vh; padding: 75px 20px 120px; }

    h2 { font-size: 32px; margin-bottom: 15px; text-align: center; font-weight: 900; }

    .section-title { font-size: 22px; margin: 20px 0 12px; padding: 0 5px; }

    .horizontal-scroll {
        display: flex; gap: 15px; overflow-x: auto; padding: 12px 0 25px; 
        scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .horizontal-scroll::-webkit-scrollbar { display: none; }

    .slide-item {
        min-width: 140px; flex-shrink: 0; text-align: center; cursor: pointer;
        background: rgba(255,255,255,0.11); backdrop-filter: blur(12px);
        border-radius: 18px; padding: 10px 8px;
    }
    .slide-item img { width: 130px; height: 130px; object-fit: cover; border-radius: 18px; margin-bottom: 8px; }

    .podcast-item {
        background: rgba(255,255,255,0.1); backdrop-filter: blur(12px);
        border-radius: 18px; padding: 12px 15px; margin-bottom: 20px;
        display: flex; align-items: center; gap: 15px; cursor: pointer;
    }
    .podcast-item img { width: 55px; height: 55px; object-fit: cover; border-radius: 12px; }
    .music-info { flex: 1; }
    .music-title { font-weight: 600; font-size: 16px; }
    .music-artist { font-size: 14px; opacity: 0.8; }
    .music-duration { font-size: 14px; opacity: 0.7; align-self: center; }

    .play-circle {
        width: 42px; height: 42px;
        background: rgba(255,255,255,0.15);
        border: 2px solid rgba(255,255,255,0.6);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
    }

    .now-playing {
        position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 300;
        display: none; flex-direction: column; align-items: center; padding: 40px 20px 30px;
    }
    .now-playing.active { display: flex; }

    .big-cover img {
        width: 280px; height: 280px; object-fit: cover; border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    .custom-player { width: 100%; max-width: 340px; }
    .progress-container {
        height: 7px; background: rgba(255,255,255,0.2); border-radius: 10px;
        margin: 15px 0; cursor: pointer;
    }
    .progress-bar { height: 100%; width: 0%; background: linear-gradient(to right, #c026d3, #ff8800); }
</style>
</head>
<body>

<div class="stars"></div>

<header>
    <div onclick="goToHome()" style="font-size:28px; cursor:pointer; color:white;">← خانه</div>

    <h2>دوره‌های PlanLife</h2>
    
    <div class="section-title">دسته‌بندی‌ها</div>
    <div class="horizontal-scroll" id="categorySlides"></div>

    <div id="podcastList"></div>

<!-- Modal اشتراک -->
<div id="subscriptionModal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 400; display: none; align-items: center; justify-content: center;">
    <div class="modal-content" id="modalContent" style="background: rgba(255,255,255,0.11); backdrop-filter: blur(20px); border-radius: 24px; padding: 30px 25px; width: 90%; max-width: 360px; text-align: center;">
        <!-- محتوا توسط جاوااسکریپت پر می‌شود -->
    </div>
</div>

<!-- Now Playing -->
<div id="nowPlayingScreen" class="now-playing">
    <button onclick="closeNowPlaying()" style="align-self:flex-start; background:none; border:none; color:white; font-size:32px;">←</button>
    
    <div class="big-cover">
        <img id="npCover" src="" alt="">

        </div>
        <button onclick="togglePlay()" id="playBtn" style="background:#ffd700; color:#1a0033; border:none; padding:15px 50px; border-radius:50px; font-weight:bold; font-size:18px;">▶ پخش</button>

    <button onclick="closeNowPlaying()" style="margin-top:40px; background:rgba(255,255,255,0.1); color:white; border:none; padding:12px 40px; border-radius:30px;">بستن</button>

// متغیرهای اشتراک
let unlockedCategories = {};
const subscriptionCodes = {
    "دوره کارگاه ثروتسازی": ["77777", "BA777", "TH777", "Servat"],
    "دوره عشق و روابط": ["88888", "ESH88", "Love"],
    "دوره تحول حال و احساس": ["99999", "TA999", "Ehsas"],
    "دوره اعتماد به نفس": ["11111", "ET111", "Etemad"],
    "دوره احساس لیاقت": ["22222", "EL222", "Liyaghat"]
};

// توابع صفحه
function loadPage() {
    const categories = ["دوره کارگاه ثروتسازی", "دوره عشق و روابط", "دوره تحول حال و احساس", "دوره اعتماد به نفس", "دوره احساس لیاقت"];
    let html = '';
    categories.forEach(cat => {
        html += `<div class="slide-item" onclick="selectCat('${cat}')"><img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg"><p>${cat}</p></div>`;
    });
    document.getElementById('categorySlides').innerHTML = html;
    loadItems(null);
}

function selectCat(cat) {
    document.getElementById('currentCategoryTitle').textContent = cat;
    loadItems(cat);
}

function loadItems(cat) {
    let html = '';
    const cats = cat ? [cat] : ["دوره کارگاه ثروتسازی", "دوره عشق و روابط", "دوره تحول حال و احساس", "دوره اعتماد به نفس", "دوره احساس لیاقت"];

    cats.forEach(c => {
        const filtered = courseData.filter(item => item.title === c);
        filtered.forEach(item => {
            const duration = ["32:45", "43:12", "21:58", "35:05", "33:30"][(item.episode-1) % 5] || "00:00";
            html += `
                <div class="podcast-item" onclick="playCourse('${item.title}', ${item.episode}, '${item.src}', '${item.cover}')">
                    <img src="${item.cover}" alt="">
                    <div class="music-info">
                        <div class="music-title">${item.title}</div>
                        <div class="music-artist">قسمت ${item.episode}</div>
                    </div>
                    <div class="music-duration">${duration}</div>
                    <div class="play-circle"><div class="play-triangle" style="width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:14px solid white;margin-left:3px;"></div></div>
                </div>`;
        });
    });
    document.getElementById('podcastList').innerHTML = html || '<p style="text-align:center; padding:40px; opacity:0.7;">موردی یافت نشد</p>';
}

function playCourse(title, episode, src, cover) {
    if (unlockedCategories[title]) {
        playAudio(title, src, cover);
    } else {
        showSubscriptionModal(title);
    }
}

function showSubscriptionModal(category) {
    window.currentUnlockCategory = category;
    const content = document.getElementById('modalContent');
    content.innerHTML = `
        <h3 style="margin-bottom:15px;">🔐 نیاز به اشتراک دارید</h3>
        <p style="margin-bottom:20px; opacity:0.9;">دسته‌بندی: <strong>${category}</strong></p>
        <p style="margin:20px 0 10px;">کد اشتراک را وارد کنید :</p>
        <input id="unlockCode" type="text" maxlength="10" placeholder="*****" 
               style="width:100%; padding:14px; border-radius:12px; border:none; text-align:center; font-size:34px; margin-bottom:14px; background:rgba(255,255,255,0.1); color:white;">
        <button onclick="checkUnlockCode()" style="width:100%; padding:14px; background:#00ff88; color:black; border:none; border-radius:12px; font-weight:bold;">فعال‌سازی</button>
        <button onclick="showSupportModal()" style="width:100%; padding:14px; background:rgba(255,255,255,0.2); color:white; border:none; border-radius:12px; margin-top:10px;">ارتباط با پشتیبانی 🔓</button>
        <button onclick="closeModal()" style="width:100%; padding:14px; background:rgba(255,255,255,0.15); color:white; border:none; border-radius:12px; margin-top:10px;">بستن</button>
    `;
    document.getElementById('subscriptionModal').style.display = 'flex';
}

function checkUnlockCode() {
    const code = document.getElementById('unlockCode').value.trim();
    const category = window.currentUnlockCategory;
    const content = document.getElementById('modalContent');

    if (subscriptionCodes[category] && subscriptionCodes[category].includes(code)) {
        unlockedCategories[category] = true;
        content.innerHTML = `<div style="font-size:70px; color:#00ff88;">✅</div><h3 style="color:#00ff88;">اشتراک فعال شد!</h3><p>حالا می‌توانید به این دوره دسترسی داشته باشید.</p><button onclick="closeModal()" style="width:100%; padding:14px; background:#00ff88; color:black; border:none; border-radius:12px;">بستن</button>`;
    } else {
        content.innerHTML = `<div style="font-size:70px; color:#ff3366;">✕</div><h3>کد اشتباه است</h3><p>لطفاً کد صحیح را وارد کنید یا با پشتیبانی تماس بگیرید.</p><button onclick="closeModal()" style="width:100%; padding:14px; background:rgba(255,255,255,0.2); color:white; border:none; border-radius:12px;">بستن</button>`;
    }
}

function closeModal() { 
    document.getElementById('subscriptionModal').style.display = 'none'; 
}

function showSupportModal() {
    closeModal();
    alert("لینک پشتیبانی: https://t.me/planlifeir");
}

// پخش‌کننده
const audio = document.getElementById('mainAudio');
const progressBar = document.getElementById('progressBar');
const progressContainer = document.getElementById('progressContainer');

function playAudio(title, src, cover) {
    document.getElementById('npTitle').textContent = title;
    document.getElementById('npCover').src = cover;
    document.getElementById('nowPlayingScreen').classList.add('active');
    
    audio.src = src;
    audio.play().catch(() => {});
}

function togglePlay() {
    if (audio.paused) audio.play();
    else audio.pause();
}

function closeNowPlaying() {
    document.getElementById('nowPlayingScreen').classList.remove('active');
    audio.pause();
}

function goToHome() {
    window.location.href = "index.html";
}
