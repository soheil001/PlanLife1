<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0033">
<title>دوره‌های PlanLife</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Vazirmatn', sans-serif; overflow-x: hidden; color: white; background: #030303; }
    .stars { position: fixed; inset: 0; background: transparent; z-index: 1; pointer-events: none; }
    .stars::before, .stars::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(white 1px, transparent 1px); background-size: 80px 80px; opacity: 0.45; animation: twinkle 10s infinite alternate; }
    .stars::after { background-size: 140px 140px; opacity: 0.3; animation-duration: 16s; }
    @keyframes twinkle { 0% { opacity: 0.35; } 100% { opacity: 0.65; } }

    header { position: fixed; top: 0; left: 0; right: 0; height: 65px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; background: rgba(0,0,0,0.25); backdrop-filter: blur(10px); }

    .main-center { position: relative; z-index: 5; min-height: 100vh; padding: 85px 16px 140px; }
    h2 { font-size: 28px; margin-bottom: 24px; text-align: center; font-weight: 900; }

    .categories-wrapper {
        display: flex;
        flex-direction: column;
        gap: 0;
    }

    .cat-row {
        display: flex;
        flex-direction: column;
        gap: 0;
    }

    .cat-row-cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-bottom: 0;
    }

    .cat-card {
        position: relative;
        cursor: pointer;
        border-radius: 22px;
        overflow: hidden;
        background: linear-gradient(145deg,
            rgba(255,215,0,0.14) 0%,
            rgba(180,90,255,0.10) 50%,
            rgba(255,100,0,0.08) 100%);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1.2px solid rgba(255,215,0,0.28);
        box-shadow:
            0 8px 32px rgba(0,0,0,0.35),
            0 2px 8px rgba(0,0,0,0.2),
            inset 0 1px 0 rgba(255,255,255,0.18);
        transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
        margin-bottom: 14px;
    }
    .cat-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,215,0,0.55), rgba(200,120,255,0.35), transparent);
    }
    .cat-card:active { transform: scale(0.96); box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    .cat-card.open {
        border-color: rgba(255,215,0,0.65);
        box-shadow: 0 8px 32px rgba(255,149,0,0.22), 0 2px 8px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.18);
    }

    .cat-card.cat-soon {
        opacity: 0.62;
    }
    .cat-card.cat-soon .cat-cover-wrap img {
        filter: grayscale(45%);
    }
    .soon-ribbon {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(20,10,40,0.78);
        border: 1px solid rgba(255,215,0,0.4);
        backdrop-filter: blur(8px);
        color: #ffd700;
        font-size: 10.5px;
        font-weight: 800;
        padding: 4px 10px;
        border-radius: 999px;
        z-index: 2;
        white-space: nowrap;
    }

    .cat-cover-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
    }
    .cat-cover-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .cat-cover-wrap::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, transparent 40%, rgba(5,0,20,0.82) 100%);
    }

    .cat-info {
        padding: 10px 12px 13px;
    }
    .cat-name {
        font-size: 13px;
        font-weight: 900;
        line-height: 1.4;
        color: #ffffff;
        margin-bottom: 5px;
        text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        min-height: 2.8em;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .cat-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .cat-ep-label {
        font-size: 11px;
        opacity: 0.6;
    }
    .cat-arrow {
        width: 22px; height: 22px;
        background: rgba(255,215,0,0.15);
        border: 1px solid rgba(255,215,0,0.3);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 11px;
        transition: transform 0.3s ease;
        flex-shrink: 0;
    }
    .cat-card.open .cat-arrow { transform: rotate(90deg); }

    .episodes-accordion {
        overflow: hidden;
        max-height: 0;
        transition: max-height 0.42s cubic-bezier(0.4,0,0.2,1);
        margin-bottom: 0;
    }
    .episodes-accordion.open {
        max-height: 4000px;
        margin-bottom: 14px;
    }

    .episodes-inner {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,215,0,0.18);
        border-radius: 20px;
        padding: 12px;
        margin-bottom: 4px;
    }
    .episodes-header {
        font-size: 14px;
        font-weight: 800;
        color: #ffd700;
        margin-bottom: 10px;
        padding: 0 4px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .podcast-item { background: rgba(255,255,255,0.1); backdrop-filter: blur(12px); border-radius: 18px; padding: 12px 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: transform 0.18s; }
    .podcast-item:active { transform: scale(0.97); }
    .podcast-item:last-child { margin-bottom: 0; }
    .podcast-item img { width: 48px; height: 48px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
    .music-info { flex: 1; overflow: hidden; }
    .music-title { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .music-artist { font-size: 12px; opacity: 0.7; margin-top: 2px; }
    .music-duration { font-size: 12px; opacity: 0.65; align-self: center; flex-shrink: 0; }
    .play-circle { width: 36px; height: 36px; background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.5); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .podcast-comment-badge {
        display: inline-flex; align-items: center; gap: 4px; margin-top: 4px;
        background: rgba(255,149,0,0.15); border-radius: 999px; padding: 2px 8px;
    }
    .podcast-comment-badge svg { width: 11px; height: 11px; fill: #ff9500; }
    .podcast-comment-badge span { font-size: 11px; color: #ff9500; font-weight: 700; }

    .intro-badge {
        display: inline-flex; align-items: center; gap: 5px;
        background: rgba(0,255,136,0.13); border: 1px solid rgba(0,255,136,0.32);
        border-radius: 999px; padding: 3px 10px;
        font-size: 11px; font-weight: 700; color: #00ff88; margin-top: 3px;
    }

    .now-playing {
        position: fixed;
        top: 10px; left: 10px; right: 10px;
        height: calc(100% - 10px); height: calc(100dvh - 10px);
        background: rgba(10, 10, 25, 0.98);
        z-index: 300;
        display: none;
        flex-direction: column;
        align-items: center;
        padding: 20px 20px 40px;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        transform: translateY(110%);
        border-radius: 22px 22px 0 0;
        will-change: transform, border-radius;
        touch-action: pan-y;
    }
    .now-playing.active {
        display: flex;
        transform: translateY(0%);
        border-radius: 22px 22px 0 0;
        transition: transform 0.52s cubic-bezier(0.32, 0.72, 0, 1),
                    border-radius 0.52s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .drag-handle-wrap { width: 100%; display: flex; justify-content: center; padding: 6px 0 2px; flex-shrink: 0; cursor: grab; }
    .drag-handle { width: 44px; height: 5px; background: rgba(255,255,255,0.65); border-radius: 999px; box-shadow: 0 0 8px rgba(255,255,255,0.2); }

    .mini-player {
        position: fixed;
        bottom: 15px; left: 15px; right: 15px;
        height: 72px;
        background: rgba(18, 18, 40, 0.72);
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 22px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
        z-index: 290;
        display: none; align-items: center;
        padding: 0 16px; gap: 12px;
        cursor: pointer; overflow: hidden;
    }
    .mini-player.active { display: flex; }
    .mini-cover { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
    .mini-info { flex: 1; overflow: hidden; }
    .mini-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-ep { font-size: 12px; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-progress { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: rgba(255,255,255,0.10); border-radius: 0 0 22px 22px; overflow: hidden; }
    .mini-progress-bar { height: 100%; background: linear-gradient(to right, #ff9500, #ff6b00); border-radius: 999px; transition: width 0.5s linear; }
    .mini-play-btn { width: 42px; height: 42px; background: #ff9500; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 14px rgba(255,149,0,0.5); }
    .mini-play-btn svg { width: 22px; height: 22px; fill: #1a0033; }
    .mini-close { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; opacity: 0.5; flex-shrink: 0; font-size: 20px; }

    .player-topbar { width: 100%; max-width: 380px; display: flex; justify-content: space-between; align-items: center; padding: 8px 0 16px; flex-shrink: 0; }
    .player-status { font-size: 15px; font-weight: 600; opacity: 0.85; }

    .big-cover { width: 100%; max-width: 200px; margin: 6px 0 10px; position: relative; flex-shrink: 0; }
    .big-cover img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 20px; box-shadow: 0 15px 45px rgba(192,38,211,0.5); }
    .cover-comment-badge {
        position: absolute; bottom: -13px; left: 50%; transform: translateX(-50%);
        background: rgba(20,20,40,0.92); border: 1px solid rgba(255,255,255,0.18);
        backdrop-filter: blur(10px); border-radius: 999px; padding: 5px 14px;
        display: flex; align-items: center; gap: 6px;
        font-size: 13px; font-weight: 700; white-space: nowrap;
        box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .cover-comment-badge svg { width: 15px; height: 15px; fill: #ff9500; flex-shrink: 0; }

    .stars-section {
        width: 100%; max-width: 360px; margin: 18px 0; padding: 12px 16px;
        border-radius: 16px;
        display: none;
    }
    .stars-section.active { display: block; }
    .stars-label { font-size: 13px; opacity: 0.8; margin-bottom: 8px; display: block; text-align: center; }
    .stars-container { display: flex; gap: 6px; align-items: center; justify-content: center; direction: ltr; }
    .star-btn {
        width: 42px; height: 42px; border: none; background: none;
        color: rgba(255,215,0,0.25); font-size: 32px; cursor: pointer; font-family: inherit;
        transition: color 0.2s, transform 0.15s;
        display: flex; align-items: center; justify-content: center;
        padding: 0; line-height: 1;
    }
    .star-btn:active { transform: scale(0.88); }
    .star-btn.filled { color: #ffd700; }

    .track-info { text-align: center; width: 100%; max-width: 360px; margin: 20px 0 10px; flex-shrink: 0; }
    .np-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .np-subtitle { font-size: 14.5px; opacity: 0.7; }

    .progress-section { width: 100%; max-width: 360px; margin-bottom: 28px; flex-shrink: 0; }
    .progress-container { width: 100%; height: 5px; background: rgba(255,255,255,0.18); border-radius: 999px; cursor: pointer; margin-bottom: 8px; }
    .progress-bar { height: 100%; background: linear-gradient(to right, #ff9500, #ff6b00); border-radius: 999px; box-shadow: 0 0 12px #ff9500; }
    .time-display { display: flex; justify-content: space-between; font-size: 13.5px; opacity: 0.75; }

    .main-controls { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 360px; padding: 0 10px; margin-bottom: 30px; flex-shrink: 0; }
    .control-btn { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .control-btn svg { width: 30px; height: 30px; fill: #ddd; transition: all 0.2s; }
    .control-btn:active svg { fill: #ff9500; transform: scale(0.9); }
    .play-main { width: 82px; height: 82px; background: #ff9500; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(255,149,0,0.65); cursor: pointer; }
    .play-main svg { width: 36px; height: 36px; fill: #1a0033; }

    .comments-section { width: 100%; max-width: 360px; margin-top: 10px; padding-bottom: 30px; }
    .comments-list { max-height: 240px; overflow-y: auto; padding-right: 4px; margin-bottom: 14px; }
    .comments-list::-webkit-scrollbar { width: 5px; }
    .comments-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 10px; }
    .delete-btn { background: rgba(255,50,50,0.2); border: 1px solid rgba(255,50,50,0.4); color: #ff6464; border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
    .delete-btn:active { background: rgba(255,50,50,0.5); }
    .loading-comments { text-align: center; padding: 20px; opacity: 0.6; font-size: 14px; }

    .admin-badge { display: flex; align-items: center; gap: 6px; background: rgba(255,149,0,0.2); border: 1px solid rgba(255,149,0,0.5); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700; color: #ff9500; cursor: pointer; font-family: inherit; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 400; display: none; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: rgba(255,255,255,0.11); backdrop-filter: blur(20px); border-radius: 24px; padding: 30px 25px; width: 90%; max-width: 360px; text-align: center; max-height: 90vh; overflow-y: auto; }
    .modal-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; cursor: pointer; margin-top: 10px; font-family: inherit; }

    .card-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
    }
    .buy-course-btn,
    .play-course-btn,
    .results-course-btn {
        width: 100%;
        border-radius: 12px;
        padding: 10px 8px;
        font-size: 12.5px;
        font-weight: 800;
        font-family: inherit;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        transition: transform 0.15s ease, background 0.2s ease;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }
    .results-course-btn {
        background: linear-gradient(135deg, rgba(0,229,160,0.22), rgba(0,180,255,0.12));
        border: 1px solid rgba(0,229,160,0.45);
        color: #4dffc4;
        box-shadow: 0 4px 14px rgba(0,229,160,0.10);
    }
    .results-course-btn:active { transform: scale(0.96); background: rgba(0,229,160,0.32); }
    .buy-course-btn {
        background: linear-gradient(135deg, rgba(255,215,0,0.24), rgba(255,170,0,0.14));
        border: 1px solid rgba(255,215,0,0.5);
        color: #ffd700;
        box-shadow: 0 4px 14px rgba(255,180,0,0.12);
    }
    .buy-course-btn:active { transform: scale(0.96); background: rgba(255,215,0,0.34); }
    .play-course-btn {
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.16);
        color: #f2f2f2;
    }
    .play-course-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.14); }

    .toast {
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: rgba(25,15,50,0.96);
        border: 1px solid rgba(255,215,0,0.4);
        backdrop-filter: blur(16px);
        color: #ffd700;
        font-size: 14px;
        font-weight: 700;
        padding: 13px 22px;
        border-radius: 999px;
        z-index: 500;
        box-shadow: 0 8px 28px rgba(0,0,0,0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        white-space: nowrap;
    }
    .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
</style>
</head>
<body>

<div class="stars"></div>

<header>
    <div onclick="goToHome()"
         style="font-size:15px; cursor:pointer; color:white;
                background: rgba(255,255,255,0.12); backdrop-filter: blur(12px);
                padding: 9px 22px; border-radius: 30px;
                display: inline-flex; align-items: center; gap: 8px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
← خانه
    </div>
    <div id="headerAuthArea">
        <button onclick="openAdminModal()" class="admin-badge">🔐 ورود ادمین</button>
    </div>
</header>

<div class="main-center">
    <h2>دوره‌های آنلاین PlanLife.ir</h2>
    <div class="categories-wrapper" id="categoriesWrapper"></div>
</div>

<!-- Modal اشتراک / ادمین -->
<div id="subscriptionModal" class="modal-overlay">
    <div class="modal-box" id="modalContent"></div>
</div>

<!-- toast -->
<div id="toast" class="toast"></div>

<!-- mini player -->
<div id="miniPlayer" class="mini-player" onclick="expandPlayer()">
    <img id="miniCover" class="mini-cover" src="" alt="">
    <div class="mini-info">
        <div id="miniTitle" class="mini-title">در حال پخش</div>
        <div id="miniEp" class="mini-ep">PlanLife</div>
    </div>
    <div class="mini-play-btn" onclick="event.stopPropagation(); miniTogglePlay()">
        <svg id="miniPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div class="mini-close" onclick="event.stopPropagation(); killPlayer()">✕</div>
    <div class="mini-progress">
        <div class="mini-progress-bar" id="miniProgressBar" style="width:0%"></div>
    </div>
</div>

<!-- پلیر بزرگ -->
<div id="nowPlayingScreen" class="now-playing">
    <div class="drag-handle-wrap"><div class="drag-handle"></div></div>
    <div class="player-topbar">
        <button onclick="closeNowPlaying()" style="font-size:26px;background:none;border:none;color:white;">←</button>
        <span id="playerStatus" class="player-status">در حال پخش</span>
        <button onclick="showMenu()" style="font-size:26px;background:none;border:none;color:white;">⋯</button>
    </div>

    <div class="big-cover">
        <img id="npCover" src="" alt="">
        <div class="cover-comment-badge" id="coverCommentBadge">
            <svg viewBox="0 0 24 24"><path d="M21 6.5C21 5.12 19.88 4 18.5 4h-13C4.12 4 3 5.12 3 6.5v8C3 15.88 4.12 17 5.5 17H7l3 3 3-3h5.5c1.38 0 2.5-1.12 2.5-2.5v-8z"/></svg>
            <span id="coverCommentCount">۰</span>
            <span style="opacity:0.7; font-weight:500;">نظر</span>
        </div>
    </div>

    <div class="track-info">
        <h2 id="npTitle" class="np-title">عنوان دوره</h2>
        <p id="npSubtitle" class="np-subtitle">PlanLife</p>
    </div>

    <div id="starsSection" class="stars-section">
        <span class="stars-label">امتیاز این دوره را بدهید ⭐</span>
        <div class="stars-container" id="starsContainer"></div>
    </div>

    <div class="progress-section">
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>
    </div>
    <div class="main-controls">
        <div class="control-btn" onclick="prevTrack()"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg></div>
        <div class="control-btn" onclick="seek(-10)"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg></div>
        <div onclick="togglePlay()" class="play-main"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        <div class="control-btn" onclick="seek(10)"><svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg></div>
        <div class="control-btn" onclick="nextTrack()"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></div>
    </div>

    <!-- بخش نظرات -->

async function fetchCommentsForKey(key) {
    try {
        const { data, error } = await supabaseClient
            .from('course_comments').select('*').eq('comment_key', key).order('created_at', { ascending: false });
        if (error) throw error;
        allComments[key] = data || [];
        return true;
    } catch(e) { console.warn('Supabase fetch:', e); return false; }
}

async function fetchAllCommentCounts() {
    try {
        const { data, error } = await supabaseClient.from('course_comments').select('comment_key');
        if (error) throw error;
        const counts = {};
        (data || []).forEach(row => { counts[row.comment_key] = (counts[row.comment_key] || 0) + 1; });
        return counts;
    } catch(e) { console.warn('Supabase counts fetch:', e); return {}; }
}

async function insertCourseComment(key, name, text) {
    try {
        const { data, error } = await supabaseClient.from('course_comments').insert([{ comment_key: key, name, text }]).select();
        if (error) throw error;
        return data && data[0];
    } catch(e) { console.warn('Supabase insert:', e); return null; }
}

async function deleteCourseCommentRemote(commentId) {
    try {
        const res = await fetch(DELETE_FUNCTION_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY },
            body: JSON.stringify({ commentId, adminPassword: ADMIN_API_PASSWORD })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || ('HTTP ' + res.status));
        return true;
    } catch(e) { console.warn('Edge function delete:', e); alert('خطا در حذف نظر: ' + e.message); return false; }
}

function loadPage() {
    const categories = Object.keys(categoryConfig);
    const wrapper = document.getElementById('categoriesWrapper');
    wrapper.innerHTML = '';

    for (let i = 0; i < categories.length; i += 2) {
        const row = document.createElement('div');
        row.className = 'cat-row';

        const cardsRow = document.createElement('div');
        cardsRow.className = 'cat-row-cards';

        const cats = [categories[i], categories[i+1]].filter(Boolean);
        cats.forEach((cat, j) => {
            const catIdx = i + j;
            const cfg = categoryConfig[cat];
            const epCount = cfg.episodes.filter(e => !e.isIntro).length;
            const coverSrc = cfg.cover;
            const soon = !!cfg.comingSoon;

            const card = document.createElement('div');
            card.className = 'cat-card' + (soon ? ' cat-soon' : '');
            card.id = `cat-card-${catIdx}`;
            card.innerHTML = `
                <div class="cat-cover-wrap">
                    ${soon ? '<div class="soon-ribbon">به‌زودی</div>' : ''}
                    <img src="${coverSrc}" alt="${cat}" loading="lazy">
                </div>
                <div class="cat-info">
                    <div class="cat-name">${cat}</div>
                    <div class="cat-meta">
                        <span class="cat-ep-label">${toPersianNum(epCount)} قسمت</span>
                        <span class="cat-arrow">›</span>
                    </div>
                </div>`;

            // دکمه‌های نتایج / خرید / پخش زیر هر کارت
            const actions = document.createElement('div');
            actions.className = 'card-actions';
            actions.innerHTML = `
                <button type="button" class="results-course-btn">🏆 نتایج بچه‌های دوره</button>
                <button type="button" class="buy-course-btn">💳 خرید دوره</button>
                <button type="button" class="play-course-btn">▶ پخش دوره</button>`;
            const resultsBtn = actions.querySelector('.results-course-btn');
            const buyBtn = actions.querySelector('.buy-course-btn');
            const playBtn = actions.querySelector('.play-course-btn');
            resultsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (soon) { showToast(SOON_MESSAGE); return; }
                goToResults(cat);
            });
            buyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (soon) { showToast(SOON_MESSAGE); return; }
                goToPayment(cat);
            });
            playBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (soon) { showToast(SOON_MESSAGE); return; }
                toggleAccordion(cat, catIdx, i);
            });
            card.querySelector('.cat-info').appendChild(actions);

            card.onclick = soon
                ? () => showToast(SOON_MESSAGE)
                : () => toggleAccordion(cat, catIdx, i);
            cardsRow.appendChild(card);
        });

        row.appendChild(cardsRow);

        const acc = document.createElement('div');
        acc.className = 'episodes-accordion';
        acc.id = `acc-row-${i}`;
        row.appendChild(acc);

        wrapper.appendChild(row);
    }

    refreshAllListBadges();
}

let openCatIdx = null;

function toggleAccordion(cat, catIdx, rowStart) {
    const accId = `acc-row-${rowStart}`;
    const acc = document.getElementById(accId);
    const card = document.getElementById(`cat-card-${catIdx}`);
    const isSameCat = openCatIdx === catIdx && acc.classList.contains('open');

    document.querySelectorAll('.episodes-accordion').forEach(el => { el.classList.remove('open'); el.innerHTML = ''; });
    document.querySelectorAll('.cat-card').forEach(el => el.classList.remove('open'));

    if (!isSameCat) {
        acc.innerHTML = buildEpisodesHTML(cat);
        acc.classList.add('open');
        card.classList.add('open');
        openCatIdx = catIdx;
        setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
    } else {
        openCatIdx = null;
    }
}

            </div>
            <div class="music-duration">${intro.duration}</div>
            <div class="play-circle"><div style="width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:12px solid white;margin-left:2px;"></div></div>
        </div>`;
    }

    items.filter(x => !x.isIntro).forEach(item => {
        const idx = courseData.indexOf(item);
        const key = commentKey(item.title, item.episode);
        const cnt = toPersianNum((allComments[key] || []).length);
        html += `
        <div class="podcast-item" onclick="playCourse(${idx})">
            <img src="${item.cover}" alt="">
            <div class="music-info">
                <div class="music-title">${item.title}</div>
                <div class="music-artist">قسمت ${item.episode}</div>
                <div class="podcast-comment-badge">
                    <svg viewBox="0 0 24 24"><path d="M21 6.5C21 5.12 19.88 4 18.5 4h-13C4.12 4 3 5.12 3 6.5v8C3 15.88 4.12 17 5.5 17H7l3 3 3-3h5.5c1.38 0 2.5-1.12 2.5-2.5v-8z"/></svg>
                    <span id="list-badge-${idx}">${cnt}</span>
                </div>
            </div>
            <div class="music-duration">${item.duration}</div>
            <div class="play-circle"><div style="width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:12px solid white;margin-left:2px;"></div></div>
        </div>`;
    });

    html += '</div>';
    return html;
}

function renderStars() {
    const container = document.getElementById('starsContainer');
    container.innerHTML = '';
    const rating = userRatings[currentTrackKey] || 0;
    for (let i = 1; i <= 5; i++) {
        const btn = document.createElement('button');
        btn.className = `star-btn ${rating >= i ? 'filled' : ''}`;
        btn.textContent = '★';
        btn.onclick = (e) => { e.preventDefault(); userRatings[currentTrackKey] = i; renderStars(); };
        container.appendChild(btn);
    }
}

async function loadComments(title, episode) {
    const key = commentKey(title, episode);
    currentTrackKey = key;
    const starsSection = document.getElementById('starsSection');
    if (isAdmin || unlockedCategories[courseData[currentTrackIndex].category]) {
        starsSection.classList.add('active'); renderStars();
    } else { starsSection.classList.remove('active'); }
    document.getElementById('commentsList').innerHTML = '<div class="loading-comments">⏳ در حال بارگذاری نظرات...</div>';
    document.getElementById('commentCount').textContent = '...';
    await fetchCommentsForKey(key);
    renderComments(key);
    refreshAllListBadges();
}

function renderComments(key) {
    const comments = allComments[key] || [];
    const list = document.getElementById('commentsList');
    const countEl = document.getElementById('commentCount');
    const coverCount = document.getElementById('coverCommentCount');
    if (!list || !countEl) return;
    countEl.textContent = comments.length;
    if (coverCount) coverCount.textContent = toPersianNum(comments.length);
    list.innerHTML = '';
    if (comments.length === 0) {
        list.innerHTML = '<p style="opacity:0.6;text-align:center;padding:22px 10px;font-size:14px;line-height:1.6;">هنوز نظری ثبت نشده.<br>اولین نفر باشید!</p>';
        return;
    }
    comments.forEach(c => {
        const div = document.createElement('div');
        div.style.cssText = 'background:rgba(255,255,255,0.085);border-radius:14px;padding:13px 15px;margin-bottom:9px;border:1px solid rgba(255,255,255,0.06);';
        div.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
                <strong style="color:#ffd700;font-size:14.5px;">${escapeHtml(c.name)}</strong>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span style="font-size:11.5px;opacity:0.55;white-space:nowrap;">${formatCommentTime(c.created_at)}</span>
                    ${isAdmin ? `<button class="delete-btn" onclick="deleteComment('${key}',${c.id})">🗑 حذف</button>` : ''}
                </div>
            </div>
            <p style="font-size:14.8px;line-height:1.55;margin:0;color:#f0f0f0;">${escapeHtml(c.text)}</p>`;
        list.appendChild(div);
    });
}

async function addComment() {
    if (!currentTrackKey) return;
    const name = document.getElementById('commentName').value.trim() || 'ناشناس';
    const text = document.getElementById('commentText').value.trim();
    if (!text) { alert('لطفاً متن نظر را وارد کنید.'); return; }
    const btn = document.getElementById('submitCommentBtn');
    btn.textContent = '⏳ در حال ارسال...'; btn.disabled = true;
    const inserted = await insertCourseComment(currentTrackKey, name, text);
    if (inserted) {
        if (!allComments[currentTrackKey]) allComments[currentTrackKey] = [];
        allComments[currentTrackKey].unshift(inserted);
        renderComments(currentTrackKey); refreshAllListBadges();
        document.getElementById('commentText').value = '';
        document.getElementById('commentName').value = '';
    } else { alert('ارسال نظر با خطا مواجه شد. لطفاً دوباره تلاش کنید.'); }
    btn.textContent = 'ارسال نظر'; btn.disabled = false;
}

async function deleteComment(key, commentId) {
    if (!isAdmin || !confirm('این نظر حذف شود؟')) return;
    const ok = await deleteCourseCommentRemote(commentId);
    if (!ok) return;
    allComments[key] = (allComments[key] || []).filter(c => c.id !== commentId);
    renderComments(key); refreshAllListBadges();
}

function updateListBadge(idx, count) {
    const el = document.getElementById(`list-badge-${idx}`);
    if (el) el.textContent = toPersianNum(count);
}

async function refreshAllListBadges() {
    const counts = await fetchAllCommentCounts();
    courseData.forEach((item, idx) => {
        const key = commentKey(item.title, item.episode);
        updateListBadge(idx, counts[key] || 0);
    });
    if (currentTrackKey) {
        const cc = document.getElementById('coverCommentCount');
        const mc = document.getElementById('commentCount');
        const cnt = counts[currentTrackKey] || 0;
        if (cc) cc.textContent = toPersianNum(cnt);
        if (mc) mc.textContent = cnt;
    }
}

function formatTime(s) { if (!s || isNaN(s)) return "0:00"; return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; }

audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    progressBar.style.width = `${(audio.currentTime/audio.duration)*100}%`;
    currentTimeEl.textContent = formatTime(audio.currentTime);
    const mpb = document.getElementById('miniProgressBar');
    if (mpb) mpb.style.width = `${(audio.currentTime/audio.duration)*100}%`;
});
audio.addEventListener('loadedmetadata', () => totalTimeEl.textContent = formatTime(audio.duration));
progressContainer.addEventListener('click', e => {
    const r = progressContainer.getBoundingClientRect();
    audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
});

function setPlayIcons(playing) {
    const icon = playing ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    playIcon.innerHTML = icon;
    document.getElementById('miniPlayIcon').innerHTML = icon;
    statusEl.textContent = playing ? 'در حال پخش' : 'متوقف شده';
}

function playAudio(item) {
    currentTrackIndex = courseData.indexOf(item);
    document.getElementById('npTitle').textContent = item.title;
    document.getElementById('npSubtitle').textContent = item.isIntro ? '🎁 معرفی رایگان' : `قسمت ${item.episode}`;
    document.getElementById('npCover').src = item.cover;
    document.getElementById('miniTitle').textContent = item.title;
    document.getElementById('miniEp').textContent = item.isIntro ? '🎁 معرفی' : `قسمت ${item.episode}`;
    document.getElementById('miniCover').src = item.cover;
    audio.src = item.src;
    audio.play().then(() => setPlayIcons(true)).catch(() => setPlayIcons(false));
    loadComments(item.title, item.episode);
    expandPlayer();
}

function expandPlayer() {
    const screen = document.getElementById('nowPlayingScreen');
    document.getElementById('miniPlayer').classList.remove('active');
    screen.style.transition = 'none';
    screen.style.transform = 'translateY(110%)';
    screen.style.borderRadius = '22px 22px 0 0';
    screen.scrollTop = 0;
    screen.classList.add('active');
    requestAnimationFrame(() => requestAnimationFrame(() => {
        screen.style.transition = 'transform 0.52s cubic-bezier(0.32,0.72,0,1), border-radius 0.52s cubic-bezier(0.32,0.72,0,1)';
        screen.style.transform = 'translateY(0%)';
        screen.style.borderRadius = '22px 22px 0 0';
    }));
}

function minimizePlayer() {
    const screen = document.getElementById('nowPlayingScreen');
    screen.style.transition = 'transform 0.48s cubic-bezier(0.32,0.72,0,1), border-radius 0.48s cubic-bezier(0.32,0.72,0,1)';
    screen.style.transform = 'translateY(110%)';
    screen.style.borderRadius = '22px 22px 0 0';
    setTimeout(() => {
        screen.classList.remove('active');
        screen.style.transform = '';
        screen.style.borderRadius = '';
        screen.style.transition = '';
        if (audio.src) document.getElementById('miniPlayer').classList.add('active');
    }, 480);
}

function killPlayer() {
    const screen = document.getElementById('nowPlayingScreen');
    screen.style.transition = 'transform 0.38s cubic-bezier(0.32,0.72,0,1)';
    screen.style.transform = 'translateY(100%)';
    setTimeout(() => {
        screen.classList.remove('active');
        screen.style.cssText = '';
        document.getElementById('miniPlayer').classList.remove('active');
        audio.pause();
    }, 380);
    setPlayIcons(false);
}

function miniTogglePlay() {
    if (audio.paused) { audio.play(); setPlayIcons(true); }
    else { audio.pause(); setPlayIcons(false); }
}
function togglePlay() { miniTogglePlay(); }
function seek(sec) { if (audio.src) audio.currentTime += sec; }

(function() {
    const screen = document.getElementById('nowPlayingScreen');
    let startY = 0, startX = 0, lastY = 0, velocity = 0, lastTime = 0;
    let intentDecided = false, isMinimizing = false;
    function onStart(e) {
        const t = e.touches[0];
        startY = t.clientY; startX = t.clientX;
        lastY = startY; lastTime = Date.now();
        velocity = 0; intentDecided = false; isMinimizing = false;
        screen.style.transition = 'none';
    }
    function onMove(e) {
        const t = e.touches[0];
        const dy = t.clientY - startY;
        const adx = Math.abs(t.clientX - startX);
        const now = Date.now(), dt = now - lastTime;
        if (dt > 0) velocity = (t.clientY - lastY) / dt;
        lastY = t.clientY; lastTime = now;
        if (!intentDecided && (Math.abs(dy) > 8 || adx > 8)) {
            intentDecided = true;
            if (adx > Math.abs(dy) * 1.2) return;
            if (dy < 0) return;
            if (dy > 0 && screen.scrollTop <= 1) { isMinimizing = true; screen.style.willChange = 'transform, border-radius'; }
        }
        if (!isMinimizing || dy <= 0) return;
        e.preventDefault();
        const progress = Math.min(dy / 380, 1);
        const resistance = dy * (1 - progress * 0.3);
        screen.style.transform = `translateY(${resistance}px) scale(${1 - progress * 0.08})`;
        screen.style.borderRadius = `${progress * 28}px ${progress * 28}px 0 0`;
        screen.style.opacity = 1 - progress * 0.15;
    }
    function onEnd() {
        if (!isMinimizing) return;
        isMinimizing = false; screen.style.willChange = '';
        const dy = lastY - startY;
        const shouldMinimize = velocity > 0.4 || dy > 130;
        screen.style.transition = 'transform 0.46s cubic-bezier(0.32,0.72,0,1), border-radius 0.46s cubic-bezier(0.32,0.72,0,1), opacity 0.46s ease';
        if (shouldMinimize) {
            screen.style.transform = 'translateY(100%) scale(0.92)';
            screen.style.borderRadius = '28px 28px 0 0';
            screen.style.opacity = '0.6';
            setTimeout(() => {
                screen.classList.remove('active');
                screen.style.cssText = '';
                if (audio.src) document.getElementById('miniPlayer').classList.add('active');
            }, 460);
        } else {
            screen.style.transform = 'translateY(0) scale(1)';
            screen.style.borderRadius = '0px';
            screen.style.opacity = '1';
            setTimeout(() => { screen.style.transition = ''; screen.style.transform = ''; screen.style.borderRadius = ''; screen.style.opacity = ''; }, 460);
        }
    }
    screen.addEventListener('touchstart', onStart, { passive: true });
    screen.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
    document.addEventListener('touchcancel', onEnd);
})();

window.onload = loadPage;
