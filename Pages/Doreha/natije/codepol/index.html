<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#d8dde4">
<title>نتایج بچه‌های دوره - PlanLife</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="preconnect" href="http://fs3.centraldnserver.com">
<link rel="dns-prefetch" href="http://fs3.centraldnserver.com">
<link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
<link rel="dns-prefetch" href="https://res.cloudinary.com">
<style>
:root {
  --bg-page: #d8dde4;
  --section: #ffffff;
  --section-shadow: 0 2px 12px rgba(0,0,0,0.07), 0 0 0 1.5px rgba(0,0,0,0.06);
  --ink: #12141c;
  --muted: #6b7280;
  --hair: #eef0f3;
  --blue: #2f6fed;
  --blue-ink: #1e4fc9;
  --lime: #d8f24c;
  --lime-ink: #4b5a10;
  --radius-xl: 22px;
  --radius-lg: 18px;
  --radius-md: 14px;
  --gap: 14px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  font-family: 'Vazirmatn', sans-serif;
  background: var(--bg-page);
  color: var(--ink);
  overflow-x: hidden;
}

/* ===== TOPBAR ===== */
.topbar {
  background: var(--section);
  border-radius: 0 0 var(--radius-xl) var(--radius-xl);
  box-shadow: var(--section-shadow);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.back-btn {
  width: 40px; height: 40px; border-radius: 13px;
  background: var(--hair);
  border: 1.5px solid rgba(0,0,0,0.07);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink); text-decoration: none;
  flex-shrink: 0;
  transition: .15s;
}
.back-btn:active { background: #e4e7ec; transform: scale(0.95); }
.back-btn svg { width: 18px; height: 18px; }
.brand {
  display: flex; align-items: center; gap: 9px;
}
.brand img {
  width: 36px; height: 36px; border-radius: 10px; object-fit: cover;
}
.brand span { font-weight: 800; font-size: 15px; }
.topbar-title {
  flex: 1;
  font-size: 15px; font-weight: 800; color: var(--ink);
  text-align: center;
}
.topbar-spacer { width: 40px; flex-shrink: 0; }

/* ===== PAGE WRAPPER ===== */
.page-wrapper {
  max-width: 560px;
  margin: 0 auto;
  padding: 16px 14px 80px;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}

/* ===== SUB LABEL ===== */
.page-sub-card {
  background: var(--section);
  border-radius: var(--radius-lg);
  box-shadow: var(--section-shadow);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.page-sub-icon {
  width: 38px; height: 38px; border-radius: 11px;
  background: rgba(47,111,237,.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.page-sub-text .title {
  font-size: 13.5px; font-weight: 800; color: var(--ink);
  margin-bottom: 2px;
}
.page-sub-text .sub {
  font-size: 11.5px; color: var(--muted);
}

/* ===== RESULTS SECTION CARD ===== */
.section-card {
  background: var(--section);
  border-radius: var(--radius-xl);
  box-shadow: var(--section-shadow);
  padding: 18px;
  overflow: hidden;
}
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.section-head h2 { font-size: 15px; font-weight: 800; }
.section-head .count {
  font-size: 11.5px; color: var(--muted); font-weight: 500;
}

/* ===== RESULTS GRID ===== */
.results-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px 10px;
  direction: ltr;
}
.result-item {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  direction: rtl;
}
.result-ring {
  width: 100%; max-width: 70px; aspect-ratio: 1/1;
  border-radius: 50%;
  padding: 2.5px;
  margin: 0 auto;
  background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888, #833ab4, #405de6, #5851db);
  transition: background 0.4s ease;
}
.result-item.seen .result-ring {
  background: #dde0e6;
}
.result-avatar {
  width: 100%; height: 100%; border-radius: 50%;
  border: 2.5px solid var(--section);
  overflow: hidden;
  background: var(--hair);
  display: flex; align-items: center; justify-content: center;
}
.result-avatar img, .result-avatar video {
  width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
}
.result-label {
  font-size: 10.5px; font-weight: 600;
  color: var(--muted);
  text-align: center; line-height: 1.35;
  max-width: 78px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}

.empty-msg {
  text-align: center; color: var(--muted); font-size: 13px;
  padding: 40px 20px;
}

/* ===== STORY MODAL ===== */
#story-modal {
  position: fixed; inset: 0; z-index: 9800;
  background: rgba(12, 14, 22, 0.88);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
#story-modal.open { opacity: 1; pointer-events: auto; }

.story-container {
  width: 100%; max-width: 375px; aspect-ratio: 9/16;
  background: var(--ink); border-radius: var(--radius-xl); overflow: hidden; position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.story-modal-content {
  position: absolute; inset: 0; z-index: 1; background: var(--ink);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.story-modal-content img, .story-modal-content video {
  width: 100%; height: 100%; object-fit: cover; display: block;
}

.story-progress-bar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 10;
  display: flex; gap: 3px; direction: ltr;
  padding: 10px 12px 6px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
}
.progress-seg { flex: 1; height: 2.5px; background: rgba(255,255,255,0.28); border-radius: 3px; overflow: hidden; }
.progress-seg-fill { height: 100%; background: white; width: 0%; transition: none; border-radius: 3px; }
.progress-seg.done .progress-seg-fill { width: 100%; }
.progress-seg.active .progress-seg-fill { animation: progress-run 5s linear forwards; }
@keyframes progress-run { from { width: 0%; } to { width: 100%; } }

.story-modal-header {
  position: absolute; top: 26px; left: 0; right: 0; z-index: 10;
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  direction: rtl; justify-content: space-between; flex-direction: row-reverse;
  background: linear-gradient(to bottom, rgba(0,0,0,0.35), transparent);
}
.story-logo-section { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; direction: ltr; }
.story-logo-img {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.3);
  overflow: hidden; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.story-logo-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.story-branding-text {
  font-size: 13px; font-weight: 700; color: #fff; line-height: 1;
  text-shadow: 0 1px 6px rgba(0,0,0,.7);
}
.story-modal-close {
  font-size: 20px; color: rgba(255,255,255,.85); cursor: pointer; padding: 4px 6px;
  line-height: 1; text-shadow: 0 1px 6px rgba(0,0,0,.8);
}

.story-nav-left, .story-nav-right {
  position: absolute; top: 0; bottom: 0; width: 40%; cursor: pointer; z-index: 9;
  -webkit-tap-highlight-color: transparent;
}
.story-nav-right { right: 0; }
.story-nav-left { left: 0; }

.story-footer {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
  display: flex; flex-direction: column; gap: 10px;
  padding: 40px 14px 18px;
  background: linear-gradient(to top, rgba(0,0,0,0.72) 60%, transparent);
}
.story-caption {
  font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.95);
  text-align: center; line-height: 1.6; min-height: 20px;
  display: flex; align-items: center; justify-content: center;
  text-shadow: 0 1px 8px rgba(0,0,0,0.9);
}

/* دکمه‌ی «وارد دوره شوید» — همون طراحی، رنگ‌بندی با تم روشن هماهنگ */
.story-action-btn {
  display: flex; align-items: center; justify-content: center;
  width: 100%; padding: 13px 16px;
  background: var(--blue);
  border: none;
  border-radius: var(--radius-md);
  box-shadow: 0 6px 20px rgba(47,111,237,.45);
  color: #fff;
  font-family: 'Vazirmatn', sans-serif;
  font-size: 14px; font-weight: 800;
  text-decoration: none; text-align: center;
  cursor: pointer;
  position: relative; overflow: hidden;
  transition: .18s;
}
.story-action-btn::before {
  content: ''; position: absolute; top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
  animation: glass-shine 2.5s ease-in-out infinite;
}
@keyframes glass-shine { 0% { left: -100%; } 50% { left: 100%; } 100% { left: 100%; } }
.story-action-btn:active { transform: scale(0.97); background: var(--blue-ink); }

/* ===== PREFETCH POOL ===== */
#prefetchPool {
  position: fixed; top: -9999px; left: -9999px;
  width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 400px) {
  .results-grid { gap: 14px 6px; }
  .result-ring { max-width: 62px; }
  .result-label { font-size: 10px; }
  .page-wrapper { padding: 12px 10px 80px; }
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <a href="https://planlife.ir/Pages/Doreha/index.html" class="back-btn" aria-label="بازگشت">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 6l-6 6 6 6"/>
    </svg>
  </a>
  <div class="brand">
    <img src="http://fs3.centraldnserver.com/~planlife/pics/planlife.jpeg" alt="PlanLife">
    <span>PlanLife</span>
  </div>
  <div class="topbar-title">نتایج بچه‌های دوره</div>
  <div class="topbar-spacer"></div>
</div>

<!-- PAGE CONTENT -->
<div class="page-wrapper">

  <!-- توضیح صفحه -->
  <div class="page-sub-card">
    <div class="page-sub-icon">✨</div>
    <div class="page-sub-text">
      <div class="title">نتایج واقعی دانشجوها</div>
      <div class="sub">روی هر استوری بزن و نتیجه رو ببین</div>
    </div>
  </div>

  <!-- گرید نتایج -->
  <div class="section-card">
    <div class="section-head">
      <h2>همه نتایج</h2>
      <span class="count" id="results-count"></span>
    </div>
    <div class="results-grid" id="resultsGrid"></div>
  </div>

</div>

<!-- پول پیش‌بارگذاری مخفی -->
<div id="prefetchPool"></div>

<!-- ===== مودال استوری تمام‌صفحه ===== -->
<div id="story-modal">
  <div class="story-container">
    <div class="story-progress-bar" id="story-progress-bar"></div>
    <div class="story-modal-header">
      <div class="story-logo-section">
        <div class="story-logo-img">
          <img src="http://fs3.centraldnserver.com/~planlife/pics/planlife.jpeg" alt="PlanLife">
        </div>
        <div class="story-branding-text">planlife.ir</div>
      </div>
      <div class="story-modal-close" onclick="closeStoryModal()">✕</div>
    </div>
    <div class="story-modal-content" id="story-modal-content">
      <div class="story-nav-left" onclick="storyNavigate(-1)"></div>
      <div class="story-nav-right" onclick="storyNavigate(1)"></div>
    </div>
    <div class="story-footer">
      <div class="story-caption" id="story-caption"></div>
      <a class="story-action-btn" id="story-action-btn" href="#" target="_blank" rel="noopener">وارد دوره شوید</a>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   ✅ فقط این بخش رو برای هر دوره تغییر بده:

   1) RESULTS_PAGE_ID : یک شناسه‌ی یکتا برای همین صفحه بذار
      (مثلاً "servat" یا "jaryan") تا وضعیت «دیده‌شده» استوری‌ها
      قاطی صفحه‌های دیگه نشه.

   2) ENTRY_LINK : لینک دکمه‌ی «وارد دوره شوید» — اینو با لینک
      همون دوره عوض کن.

   3) resultsData : برای هر نتیجه یک آبجکت اضافه کن. هر چقدر
      آبجکت اضافه کنی خودش می‌ره ردیف بعدی (۴ ستون ثابت، ردیف
      بی‌نهایت). نیازی به تغییر چیز دیگه‌ای نیست.
   ===================================================================== */

const RESULTS_PAGE_ID = "template"; // برای هر دوره عوضش کن، مثلا "servat"
const ENTRY_LINK = "https://planlife.ir/Pages/Doreha/index.html"; // لینک دکمه‌ی وارد دوره شوید

const SAMPLE_SURNAMES = [
    "احمدی","محمدی","رضایی","رحیمی","کریمی","حسینی","صادقی","طاهری",
    "نوری","یوسفی","قاسمی","رستمی","شریفی","عزیزی","فرهادی","جعفری",
    "مرادی","صالحی","هاشمی","نجفی"
];

const resultsData = [];
SAMPLE_SURNAMES.forEach(surname => {
    resultsData.push({
        name: `نتیجه‌ی آقای ${surname}`,
        media: "http://fs3.centraldnserver.com/~planlife/pics/planlife.jpeg"
    });
    resultsData.push({
        name: `نتیجه‌ی خانم ${surname}`,
        media: "http://fs3.centraldnserver.com/~planlife/pics/planlife.jpeg"
    });
});

/* =====================================================================
   منطق «دیده‌شده» — دقیقاً همان صفحه قبلی، هیچ تغییری نکرده
   ===================================================================== */
const SEEN_KEY = 'planlife_results_seen_' + RESULTS_PAGE_ID;
const DAY_MS = 24 * 60 * 60 * 1000;

function getSeenMap() {
    try {
        const raw = localStorage.getItem(SEEN_KEY);
        if (!raw) return {};
        const map = JSON.parse(raw);
        const now = Date.now();
        const cleaned = {};
        Object.keys(map).forEach(idx => { if (now - map[idx] < DAY_MS) cleaned[idx] = map[idx]; });
        return cleaned;
    } catch(e) { return {}; }
}
function markSeenPersisted(idx) {
    try {
        const map = getSeenMap();
        map[idx] = Date.now();
        localStorage.setItem(SEEN_KEY, JSON.stringify(map));
    } catch(e) {}
}
function isSeenPersisted(idx) {
    return Object.prototype.hasOwnProperty.call(getSeenMap(), idx);
}

let stories = [];
let storyIndex = 0;
let storyTimer = null;
let savedScrollY = 0;

const EAGER_ROWS_COUNT = 8;

function buildCoverMarkup(url, alt, isEager) {
    const type = getMediaType(url);
    if (type === 'video') {
        return `<video src="${url}" muted playsinline preload="${isEager ? 'auto' : 'metadata'}"${isEager ? ' fetchpriority="high"' : ''}></video>`;
    }
    return `<img src="${url}" alt="${alt}" loading="${isEager ? 'eager' : 'lazy'}" decoding="async" fetchpriority="${isEager ? 'high' : 'auto'}">`;
}

function renderGrid() {
    const grid = document.getElementById('resultsGrid');
    const countEl = document.getElementById('results-count');
    grid.innerHTML = '';

    if (!resultsData.length) {
        grid.innerHTML = '<div class="empty-msg">هنوز نتیجه‌ای اضافه نشده</div>';
        return;
    }

    if (countEl) countEl.textContent = '(' + toFa(resultsData.length) + ' نفر)';

    resultsData.forEach((r, idx) => {
        const alreadySeen = isSeenPersisted(idx);
        stories.push({ ...r, seen: alreadySeen, _preloaded: false });

        const isEager = idx < EAGER_ROWS_COUNT;
        const item = document.createElement('div');
        item.className = 'result-item' + (alreadySeen ? ' seen' : '');
        item.id = `result-item-${idx}`;
        item.dataset.idx = idx;
        item.innerHTML = `
            <div class="result-ring">
                <div class="result-avatar">${buildCoverMarkup(r.media, r.name, isEager)}</div>
            </div>
            <div class="result-label">${r.name}</div>`;
        item.addEventListener('click', () => openStoryModal(idx));
        grid.appendChild(item);
    });

    stories.slice(0, EAGER_ROWS_COUNT).forEach(s => preloadMedia(s, true));
    setupMediaPrefetchObserver();
}

function toFa(n) {
    return String(n).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}

function preloadMedia(storyObj, priority) {
    if (!storyObj || storyObj._preloaded) return;
    storyObj._preloaded = true;
    const type = getMediaType(storyObj.media);
    const pool = document.getElementById('prefetchPool');

    if (type === 'video') {
        const v = document.createElement('video');
        v.muted = true;
        v.setAttribute('playsinline', '');
        v.setAttribute('webkit-playsinline', '');
        v.preload = 'auto';
        if (priority) { try { v.fetchPriority = 'high'; } catch(e) {} v.setAttribute('fetchpriority', 'high'); }
        v.src = storyObj.media;
        v.load();
        pool.appendChild(v);
    } else {
        const img = new Image();
        img.decoding = 'async';
        if (priority) { try { img.fetchPriority = 'high'; } catch(e) {} }
        img.src = storyObj.media;
        pool.appendChild(img);
    }
}

let mediaIO = null;
function setupMediaPrefetchObserver() {
    if (mediaIO) mediaIO.disconnect();
    mediaIO = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            const idx = parseInt(entry.target.dataset.idx, 10);
            preloadMedia(stories[idx], false);
        });
    }, { rootMargin: '1000% 0px', threshold: 0 });

    document.querySelectorAll('.result-item').forEach(el => mediaIO.observe(el));
}

function openStoryModal(idx) {
    storyIndex = idx;
    savedScrollY = window.scrollY || window.pageYOffset || 0;
    document.body.style.position = 'fixed';
    document.body.style.top = (-savedScrollY) + 'px';
    document.body.style.left = '0';
    document.body.style.right = '0';
    document.body.style.width = '100%';
    document.getElementById('story-modal').classList.add('open');
    document.getElementById('story-action-btn').href = ENTRY_LINK;
    renderStoryModal();
    buildProgressBar();
    startStoryTimer();
}

function closeStoryModal() {
    document.getElementById('story-modal').classList.remove('open');
    clearStoryTimer();
    const contentDiv = document.getElementById('story-modal-content');
    const vid = contentDiv.querySelector('video');
    if (vid) { vid.pause(); vid.muted = true; vid.removeAttribute('src'); vid.load(); vid.remove(); }
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.left = '';
    document.body.style.right = '';
    document.body.style.width = '';
    window.scrollTo(0, savedScrollY);
}

function getMediaType(url) {
    if (!url) return 'image';
    const clean = url.toLowerCase().split('?')[0].split('#')[0];
    const ext = clean.split('.').pop();
    if (['mp4','webm','ogg','mov','avi','mkv','m4v'].includes(ext)) return 'video';
    if (clean.indexOf('/video/upload/') >= 0) return 'video';
    return 'image';
}

function renderStoryModal() {
    const s = stories[storyIndex];
    if (!s) { closeStoryModal(); return; }

    s.seen = true;
    const itemEl = document.getElementById(`result-item-${storyIndex}`);
    if (itemEl) itemEl.classList.add('seen');
    markSeenPersisted(storyIndex);

    const mediaType = getMediaType(s.media);
    const contentDiv = document.getElementById('story-modal-content');

    const oldVideo = contentDiv.querySelector('video');
    if (oldVideo) { oldVideo.pause(); oldVideo.src = ''; oldVideo.remove(); }
    const oldImg = contentDiv.querySelector('img');
    if (oldImg) oldImg.remove();

    if (mediaType === 'video') {
        const video = document.createElement('video');
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.muted = false;
        video.autoplay = true;
        video.controls = false;
        video.preload = 'auto';
        video.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;';
        video.addEventListener('ended', () => storyNavigate(1));
        video.addEventListener('error', () => startStoryTimer());
        video.addEventListener('loadedmetadata', () => { clearStoryTimer(); updateProgressForVideo(video); });

        const source = document.createElement('source');
        source.src = s.media;
        const ext = s.media.toLowerCase().split('?')[0].split('.').pop();
        source.type = ['webm','ogg'].includes(ext) ? 'video/' + ext : 'video/mp4';
        video.appendChild(source);
        contentDiv.appendChild(video);

        const playPromise = video.play();
        if (playPromise !== undefined) playPromise.catch(() => showPlayOverlay(video, contentDiv));
    } else {
        const img = document.createElement('img');
        img.src = s.media;
        img.alt = '';
        img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;';
        contentDiv.appendChild(img);
    }

    document.getElementById('story-caption').textContent = s.name || '';

    [stories[storyIndex - 1], stories[storyIndex + 1]].forEach(neighbor => {
        if (neighbor) preloadMedia(neighbor, true);
    });
}

function updateProgressForVideo(video) {
    const bar = document.getElementById('story-progress-bar');
    const segs = bar.querySelectorAll('.progress-seg');
    const activeSeg = segs[storyIndex];
    if (!activeSeg) return;
    const fill = activeSeg.querySelector('.progress-seg-fill');
    activeSeg.classList.remove('active');
    fill.style.transition = 'none';
    fill.style.width = '0%';

    function updateFill() {
        if (!video.duration || video.paused || video.ended) return;
        fill.style.width = ((video.currentTime / video.duration) * 100) + '%';
        requestAnimationFrame(updateFill);
    }
    video.addEventListener('play', () => requestAnimationFrame(updateFill));
    video.addEventListener('timeupdate', () => {
        if (!video.duration) return;
        fill.style.width = ((video.currentTime / video.duration) * 100) + '%';
    });
}

function showPlayOverlay(video, container) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.3);cursor:pointer;';
    const btn = document.createElement('div');
    btn.style.cssText = 'width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.18);backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,0.45);display:flex;align-items:center;justify-content:center;font-size:28px;';
    btn.textContent = '▶';
    overlay.appendChild(btn);
    overlay.addEventListener('click', () => { video.play(); overlay.remove(); });
    container.appendChild(overlay);
}

function buildProgressBar() {
    const bar = document.getElementById('story-progress-bar');
    bar.innerHTML = '';
    stories.forEach((s, i) => {
        const seg = document.createElement('div');
        seg.className = 'progress-seg';
        if (i < storyIndex) seg.classList.add('done');
        if (i === storyIndex) seg.classList.add('active');
        const fill = document.createElement('div');
        fill.className = 'progress-seg-fill';
        seg.appendChild(fill);
        bar.appendChild(seg);
    });
}

function startStoryTimer() {
    clearStoryTimer();
    storyTimer = setTimeout(() => storyNavigate(1), 5000);
}
function clearStoryTimer() {
    if (storyTimer) { clearTimeout(storyTimer); storyTimer = null; }
}

function storyNavigate(dir) {
    clearStoryTimer();
    storyIndex += dir;
    if (storyIndex < 0) storyIndex = 0;
    if (storyIndex >= stories.length) { closeStoryModal(); return; }
    renderStoryModal();
    buildProgressBar();
    startStoryTimer();
}

document.getElementById('story-modal').addEventListener('click', function(e) {
    if (e.target === this) closeStoryModal();
});

window.addEventListener('load', renderGrid);
</script>
</body>
</html>
