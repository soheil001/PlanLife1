<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a0033">
    <title>اکسپلور - PlanLife</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            font-family: 'Vazirmatn', sans-serif;
            background: #030303;
            color: white;
            overflow-x: hidden;
        }
        
        /* ========== ستاره‌های پس‌زمینه ========== */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: transparent;
            z-index: 0;
            pointer-events: none;
        }
        .stars::before, .stars::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 80px 80px;
            opacity: 0.45;
        }
        .stars::after {
            background-size: 140px 140px;
            opacity: 0.3;
        }
        
        /* ========== هدر ========== */
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .header-title {
            font-size: 24px;
            font-weight: 900;
            color: #d4af37;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }
        
        .header-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .header-icon:active {
            transform: scale(0.95);
        }
        
        /* ========== کانتینر گرید ========== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 100%;
            padding: 0;
        }
        
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            background: rgba(0, 0, 0, 0.3);
            padding: 0;
        }
        
        /* ========== آیتم ویدیو ========== */
        .video-item {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.2s ease;
        }
        .video-item:active {
            transform: scale(0.98);
        }
        
        .video-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        /* overlay شفاف برای hoverاثر */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: all 0.3s ease;
        }
        .video-item:hover .video-overlay {
            background: rgba(0, 0, 0, 0.3);
        }
        
        /* آیکن پلی */
        .play-icon {
            width: 56px;
            height: 56px;
            background: rgba(212, 175, 55, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #1a0033;
            font-weight: bold;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
        }
        .video-item:hover .play-icon {
            opacity: 1;
            transform: scale(1);
        }
        
        /* شمارنده لایک و ویوز */
        .video-stats {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            z-index: 3;
            display: flex;
            gap: 12px;
            font-size: 12px;
            font-weight: 600;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 8px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
        }
        
        /* ========== مودال ویدیو ========== */
        .video-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 9000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .video-modal.open {
            opacity: 1;
            pointer-events: auto;
        }
        
        .modal-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .modal-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
                
        /* دکمه بستن */
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 28px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }
        .modal-close:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.25);
        }
        
        /* نوار اطلاعات پایین ======== */
        .modal-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            padding: 60px 24px 32px;
            z-index: 5;
        }
        
        .video-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 12px;
            color: white;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
        }
        
        .video-desc {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.6;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }
        
        /* کنترل‌های سایپ ========== */
        .modal-nav {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            z-index: 4;
        }
        
        .nav-zone {
            flex: 1;
            cursor: pointer;
        }
        .nav-left {
            cursor: w-resize;
        }
        .nav-right {
            cursor: e-resize;
        }
        
        /* اندیکاتور فعلی ========== */
        .modal-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            color: #d4af37;
            z-index: 10;
            backdrop-filter: blur(10px);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }
        
        /* ========== ریسپانسیو ========== */
        @media (max-width: 1024px) {
            .videos-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 600px) {
            .videos-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .header-title {
                font-size: 20px;
            }
            
            .modal-info {
                padding: 50px 20px 24px;
            }
            
            .video-title {
                font-size: 16px;
            }
            
            .video-desc {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

<div class="stars"></div>

<div class="header">
    <div class="header-title">اکسپلور</div>
    <div class="header-icon" title="تنظیمات">⚙️</div>
</div>

<div class="container">
    <div class="videos-grid" id="videosGrid"></div>
</div>

<!-- مودال ویدیو ===== -->
<div class="video-modal" id="videoModal">
    <div class="modal-nav">
        <div class="nav-zone nav-left" onclick="navigateVideo(-1)"></div>
        <div class="nav-zone nav-right" onclick="navigateVideo(1)"></div>
    </div>
    
    <div class="modal-content">
        <video class="modal-video" id="modalVideo" playsinline webkit-playsinline></video>
    </div>
    
    <button class="modal-close" onclick="closeVideoModal()">✕</button>
    
    <div class="modal-indicator" id="modalIndicator">1 / 12</div>
    
    <div class="modal-info">
        <div class="video-title" id="modalTitle">عنوان ویدیو</div>
        <div class="video-desc" id="modalDesc">توضیحات ویدیو</div>
    </div>
</div>

        views: 203000
    }
];

let currentVideoIndex = 0;

/* ========================================
   رسم گرید ویدیوها
   ======================================== */
function renderGrid() {
    const grid = document.getElementById('videosGrid');
    grid.innerHTML = '';
    
    videos.forEach((video, index) => {
        const item = document.createElement('div');
        item.className = 'video-item';
        item.innerHTML = `
            <img src="${video.cover}" alt="${video.title}">
            <div class="video-overlay">
                <div class="play-icon">▶</div>
            </div>
            <div class="video-stats">
                <div class="stat">❤️ ${formatNumber(video.likes)}</div>
                <div class="stat">👁 ${formatNumber(video.views)}</div>
            </div>
        `;
        
        item.addEventListener('click', () => openVideoModal(index));
        grid.appendChild(item);
    });
}

function formatNumber(num) {
    if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
    if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
    return num;
}

/* ========================================
   مودال ویدیو
   ======================================== */
function openVideoModal(index) {
    currentVideoIndex = index;
    const modal = document.getElementById('videoModal');
    const video = document.getElementById('modalVideo');
    const data = videos[index];
    
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    
    video.src = data.src;
    video.play();
    
    updateModalContent();
}

function closeVideoModal() {
    const modal = document.getElementById('videoModal');
    const video = document.getElementById('modalVideo');
    
    modal.classList.remove('open');
    document.body.style.overflow = '';
    
    video.pause();
    video.src = '';
}

function navigateVideo(direction) {
    const newIndex = currentVideoIndex + direction;
    
    if (newIndex < 0 || newIndex >= videos.length) return;
    
    const video = document.getElementById('modalVideo');
    video.pause();
    
    currentVideoIndex = newIndex;
    
    const data = videos[currentVideoIndex];
    video.src = data.src;
    video.play();
    
    updateModalContent();
}

function updateModalContent() {
    const data = videos[currentVideoIndex];
    
    document.getElementById('modalTitle').textContent = data.title;
    document.getElementById('modalDesc').textContent = data.desc;
    document.getElementById('modalIndicator').textContent = 
        `${currentVideoIndex + 1} / ${videos.length}`;
}

/* ========================================
   تاچ/سوایپ برای موبایل
   ======================================== */
let touchStartX = 0;
let touchEndX = 0;

document.getElementById('videoModal').addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
}, false);

document.getElementById('videoModal').addEventListener('touchend', (e) => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
}, false);

function handleSwipe() {
    const diff = touchStartX - touchEndX;
    
    if (Math.abs(diff) > 50) {
        if (diff > 0) {
            navigateVideo(1); // سوایپ چپ = بعدی
        } else {
            navigateVideo(-1); // سوایپ راست = قبلی
        }
    }
}

/* ========================================
   کلیدهای صفحه‌کلید
   ======================================== */
document.addEventListener('keydown', (e) => {
    const modal = document.getElementById('videoModal');
    
    if (!modal.classList.contains('open')) return;
    
    if (e.key === 'ArrowLeft') navigateVideo(1);
    if (e.key === 'ArrowRight') navigateVideo(-1);
    if (e.key === 'Escape') closeVideoModal();
});

/* ========================================
   بستن با کلیک روی modal
   ======================================== */
document.getElementById('videoModal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('videoModal')) {
        closeVideoModal();
    }
});

/* ========================================
   شروع
   ======================================== */
window.addEventListener('load', () => {
    renderGrid();
});
</script>
