<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#15120F">
<title>دوره‌های PlanLife — پیش‌نمایش طراحی جدید</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Noto+Serif:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS ============
     ink       #15120F   background, near-black warm brown
     ink-2     #1C1712   raised surface
     paper     #F4ECDD   text / light warmth
     ember     #C9814D   primary accent — action, unlocked
     ember-dim rgba ember 15%
     moss      #8CA07C   secondary — free / open state
     brass     #C6A16A   price / premium marker
     line      rgba(paper,0.09) hairline
  */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:'Vazirmatn',sans-serif;
    background:#15120F;
    color:#F4ECDD;
    overflow-x:hidden;
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,129,77,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 20%, rgba(140,160,124,0.06), transparent 55%);
  }
  ::selection{ background:#C9814D; color:#15120F; }

  .serif{ font-family:'Noto Serif','Vazirmatn',serif; }

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; background:rgba(21,18,15,0.86); backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(244,236,221,0.07);
  }
  .back-link{ display:flex; align-items:center; gap:6px; font-size:13.5px; color:rgba(244,236,221,0.65); cursor:pointer; }
  .back-link:active{ opacity:0.6; }
  .admin-link{ background:none; border:none; font-family:inherit; font-size:12.5px; color:rgba(244,236,221,0.45); cursor:pointer; letter-spacing:0.2px; }
  .admin-pill{ display:flex; align-items:center; gap:8px; }
  .admin-tag{ font-size:11.5px; color:#C9814D; border:1px solid rgba(201,129,77,0.4); background:rgba(201,129,77,0.1); padding:4px 11px; border-radius:99px; }
  .logout-link{ background:none; border:none; font-family:inherit; font-size:12px; color:rgba(244,236,221,0.4); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }

  /* ---------- hero ---------- */
  .hero{ padding:34px 22px 22px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12px; letter-spacing:0.3px; color:#C6A16A;
    margin-bottom:14px;
  }
  .eyebrow::before{ content:''; width:16px; height:1px; background:#C6A16A; }
  h1.headline{ font-size:26px; line-height:1.5; font-weight:700; color:#F4ECDD; margin-bottom:10px; }
  h1.headline em{ font-style:normal; color:#C9814D; }
  .hero-sub{ font-size:14px; line-height:1.85; color:rgba(244,236,221,0.55); max-width:34ch; }

  /* ---------- section label ---------- */
  .section-label{
    display:flex; align-items:center; justify-content:space-between;
    padding:26px 22px 14px; font-size:13px; color:rgba(244,236,221,0.4);
  }
  .section-label b{ color:rgba(244,236,221,0.75); font-weight:600; font-size:13.5px; }

  /* ---------- chapter list w/ rail ---------- */
  .chapters{ position:relative; padding:0 22px 30px; }
  .chapters::before{
    content:''; position:absolute; top:6px; bottom:26px; right:44px;
    width:1px; background:linear-gradient(to bottom, rgba(244,236,221,0.14), rgba(244,236,221,0.03));
  }
  .chapter{ position:relative; }
  .chapter-row{
    position:relative; display:flex; align-items:flex-start; gap:14px;
    padding:16px 0; cursor:pointer;
  }
  .rail-dot{
    position:relative; z-index:2; flex-shrink:0; width:9px; height:9px; border-radius:50%;
    margin-top:9px; margin-right:0;
    background:#15120F; border:1.6px solid rgba(244,236,221,0.28);
  }
  .rail-dot.unlocked{ background:#C9814D; border-color:#C9814D; box-shadow:0 0 0 4px rgba(201,129,77,0.16); }
  .rail-dot.free{ background:#8CA07C; border-color:#8CA07C; box-shadow:0 0 0 4px rgba(140,160,124,0.16); }
  .rail-dot.soon{ border-style:dashed; border-color:rgba(244,236,221,0.22); }

  .chap-cover{ width:54px; height:54px; border-radius:14px; object-fit:cover; flex-shrink:0; filter:saturate(0.92); }
  .chapter.is-soon .chap-cover{ filter:grayscale(55%) brightness(0.75); }
  .chap-body{ flex:1; min-width:0; padding-top:1px; }
  .chap-title{ font-size:15.5px; font-weight:600; color:#F4ECDD; margin-bottom:5px; line-height:1.4; }
  .chap-meta{ display:flex; align-items:center; gap:8px; font-size:12px; color:rgba(244,236,221,0.42); flex-wrap:wrap; }
  .chap-meta .dot-sep{ width:3px; height:3px; border-radius:50%; background:rgba(244,236,221,0.3); }
  .status-open{ color:#8CA07C; }
  .status-locked{ color:rgba(244,236,221,0.42); }
  .status-soon{ color:#C6A16A; }
  .chap-price{ font-size:12px; color:#C6A16A; margin-top:5px; }
  .chap-price s{ color:rgba(244,236,221,0.3); margin-left:6px; font-size:11px; }
  .chevron{ flex-shrink:0; margin-top:14px; font-size:15px; color:rgba(244,236,221,0.3); transition:transform 0.28s ease; }
  .chapter.open .chevron{ transform:rotate(-90deg); color:#C9814D; }
  .chapter-row:active .chap-title{ color:#C9814D; }

  .episodes{ overflow:hidden; max-height:0; transition:max-height 0.4s cubic-bezier(.4,0,.2,1); }
  .episodes.open{ max-height:2000px; }
  .episodes-inner{ padding:2px 0 18px 23px; }
  .ep-row{
    display:flex; align-items:center; gap:12px; padding:11px 0;
    border-top:1px solid rgba(244,236,221,0.06);
  }
  .ep-row:first-child{ border-top:none; }
  .ep-num{ font-size:11.5px; color:rgba(244,236,221,0.32); width:20px; flex-shrink:0; }
  .ep-play{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(244,236,221,0.06); border:1px solid rgba(244,236,221,0.12);
  }
  .ep-row.intro .ep-play{ background:rgba(140,160,124,0.14); border-color:rgba(140,160,124,0.4); }
  .ep-play svg{ width:11px; height:11px; fill:#F4ECDD; margin-right:-1px; }
  .ep-info{ flex:1; min-width:0; }
  .ep-title{ font-size:13.8px; color:#F4ECDD; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ep-tag{ font-size:11px; color:#8CA07C; margin-top:2px; }
  .ep-dur{ font-size:12px; color:rgba(244,236,221,0.35); flex-shrink:0; }
  .ep-comments{ display:flex; align-items:center; gap:3px; font-size:11px; color:rgba(244,236,221,0.32); flex-shrink:0; }
  .ep-comments svg{ width:10px; height:10px; fill:rgba(244,236,221,0.32); }

  /* ---------- toast ---------- */
  .toast{
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(14px);
    background:#1C1712; border:1px solid rgba(201,129,77,0.4); color:#C9814D;
    font-size:13.5px; font-weight:600; padding:12px 20px; border-radius:99px; z-index:500;
    opacity:0; pointer-events:none; transition:opacity 0.25s, transform 0.25s; white-space:nowrap;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- mini player ---------- */
  .mini-player{
    position:fixed; bottom:14px; left:14px; right:14px; height:64px;
    background:rgba(28,23,18,0.92); backdrop-filter:blur(20px);
    border:1px solid rgba(244,236,221,0.1); border-radius:18px;
    z-index:290; display:none; align-items:center; padding:0 14px; gap:12px; cursor:pointer;
    box-shadow:0 12px 32px rgba(0,0,0,0.5);
  }
  .mini-player.active{ display:flex; }
  .mini-cover{ width:42px; height:42px; border-radius:10px; object-fit:cover; }
  .mini-info{ flex:1; overflow:hidden; }
  .mini-title{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini-ep{ font-size:11.5px; color:rgba(244,236,221,0.45); }
  .mini-play-btn{ width:36px; height:36px; background:#C9814D; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .mini-play-btn svg{ width:16px; height:16px; fill:#15120F; }
  .mini-close{ font-size:16px; opacity:0.4; padding:4px; }
  .mini-progress{ position:absolute; bottom:0; left:0; right:0; height:2px; background:rgba(244,236,221,0.08); border-radius:0 0 18px 18px; overflow:hidden; }
  .mini-progress-bar{ height:100%; background:#C9814D; }

  /* ---------- now playing ---------- */
  .now-playing{
    position:fixed; top:0; left:0; right:0; height:100dvh; background:#15120F;
    z-index:300; display:none; flex-direction:column; align-items:center;
    padding:16px 22px 30px; overflow-y:auto; transform:translateY(110%);
  }
  .now-playing.active{ display:flex; transform:translateY(0); transition:transform 0.5s cubic-bezier(.32,.72,0,1); }
  .drag-handle-wrap{ width:100%; display:flex; justify-content:center; padding:6px 0 14px; }
  .drag-handle{ width:36px; height:4px; background:rgba(244,236,221,0.25); border-radius:99px; }
  .np-top{ width:100%; max-width:380px; display:flex; justify-content:space-between; align-items:center; margin-bottom:26px; }
  .np-top button{ background:none; border:none; color:#F4ECDD; font-size:22px; cursor:pointer; }
  .np-status{ font-size:12.5px; color:rgba(244,236,221,0.4); }

  .np-cover-wrap{ width:100%; max-width:220px; margin-bottom:22px; position:relative; }
  .np-cover-wrap img{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:18px; box-shadow:0 25px 60px rgba(201,129,77,0.22); }

  .np-track{ text-align:center; margin-bottom:22px; }
  .np-title{ font-size:19px; font-weight:700; margin-bottom:6px; }
  .np-sub{ font-size:13.5px; color:rgba(244,236,221,0.45); }

  .np-progress{ width:100%; max-width:340px; margin-bottom:24px; }
  .np-bar-track{ width:100%; height:3px; background:rgba(244,236,221,0.14); border-radius:99px; cursor:pointer; margin-bottom:8px; }
  .np-bar-fill{ height:100%; background:#C9814D; border-radius:99px; }
  .np-time{ display:flex; justify-content:space-between; font-size:12px; color:rgba(244,236,221,0.4); }

  .np-controls{ display:flex; align-items:center; justify-content:center; gap:26px; margin-bottom:26px; }
  .np-ctrl{ background:none; border:none; cursor:pointer; display:flex; }
  .np-ctrl svg{ width:24px; height:24px; fill:rgba(244,236,221,0.7); }
  .np-play-main{ width:64px; height:64px; background:#C9814D; border-radius:50%; display:flex; align-items:center; justify-content:center; border:none; cursor:pointer; box-shadow:0 10px 28px rgba(201,129,77,0.4); }
  .np-play-main svg{ width:26px; height:26px; fill:#15120F; }

  .np-rate{ width:100%; max-width:340px; padding:14px 0; border-top:1px solid rgba(244,236,221,0.08); border-bottom:1px solid rgba(244,236,221,0.08); margin-bottom:22px; display:none; }
  .np-rate.active{ display:block; }
  .np-rate-label{ font-size:12.5px; color:rgba(244,236,221,0.5); text-align:center; margin-bottom:10px; display:block; }
  .stars-row{ display:flex; gap:8px; justify-content:center; direction:ltr; }
  .star-btn{ width:30px; background:none; border:none; font-size:22px; color:rgba(244,236,221,0.2); cursor:pointer; padding:0; }
  .star-btn.filled{ color:#C6A16A; }

  .np-comments{ width:100%; max-width:340px; }
  .np-comments-head{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .np-comments-head span.count{ font-size:12px; color:#15120F; background:#C9814D; padding:2px 9px; border-radius:99px; font-weight:700; }
  .comment-row{ padding:12px 0; border-top:1px solid rgba(244,236,221,0.07); }
  .comment-row:first-child{ border-top:none; }
  .comment-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
  .comment-name{ font-size:13.5px; font-weight:600; color:#C6A16A; }
  .comment-time{ font-size:11px; color:rgba(244,236,221,0.32); }
  .comment-text{ font-size:13.5px; line-height:1.6; color:rgba(244,236,221,0.8); }
  .del-btn{ background:none; border:1px solid rgba(255,90,90,0.35); color:#ff8a8a; font-size:11px; padding:3px 9px; border-radius:7px; font-family:inherit; }

  .comment-form{ margin-top:8px; }
  .comment-form input, .comment-form textarea{
    width:100%; background:rgba(244,236,221,0.05); border:1px solid rgba(244,236,221,0.12);
    border-radius:12px; padding:12px 14px; color:#F4ECDD; font-size:14.5px; font-family:inherit;
    outline:none; margin-bottom:9px;
  }
  .comment-form textarea{ resize:none; height:74px; line-height:1.5; }
  .comment-submit{
    width:100%; background:#C9814D; color:#15120F; border:none; border-radius:12px;
    padding:13px 0; font-weight:700; font-size:14.5px; font-family:inherit; cursor:pointer; margin-top:2px;
  }

  /* ---------- modals ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(10,8,6,0.88); z-index:400; display:none; align-items:flex-end; justify-content:center; }
  .modal-overlay.active{ display:flex; }
  .modal-box{
    background:#1C1712; border:1px solid rgba(244,236,221,0.1); border-radius:22px 22px 0 0;
    padding:26px 22px 34px; width:100%; max-width:460px; text-align:center; max-height:88vh; overflow-y:auto;
  }
  .modal-title{ font-size:18px; font-weight:700; margin-bottom:6px; }
  .modal-sub{ font-size:13.5px; color:rgba(244,236,221,0.5); margin-bottom:20px; line-height:1.7; }
  .modal-input{
    width:100%; padding:14px; border-radius:12px; border:1px solid rgba(244,236,221,0.14);
    text-align:center; font-size:20px; margin-bottom:12px; background:rgba(244,236,221,0.05);
    color:#F4ECDD; font-family:inherit; outline:none; letter-spacing:2px;
  }
  .modal-btn{ width:100%; padding:14px; border:none; border-radius:12px; font-size:14.5px; font-weight:700; cursor:pointer; margin-top:9px; font-family:inherit; }
  .btn-primary{ background:#C9814D; color:#15120F; }
  .btn-secondary{ background:rgba(244,236,221,0.08); color:#F4ECDD; }
  .btn-ghost{ background:none; color:rgba(244,236,221,0.5); border:1px solid rgba(244,236,221,0.14); }

  .price-row{ display:flex; justify-content:space-between; align-items:center; padding:16px 4px; border-top:1px solid rgba(244,236,221,0.07); text-align:right; }
  .price-row:first-of-type{ border-top:none; }
  .price-row .pname{ font-size:14px; font-weight:600; }
  .price-row .pval{ font-size:14px; font-weight:800; color:#C6A16A; }
  .price-row .pold{ font-size:11.5px; color:rgba(244,236,221,0.3); text-decoration:line-through; display:block; }
  .buy-mini{ background:rgba(201,129,77,0.14); border:1px solid rgba(201,129,77,0.4); color:#C9814D; font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:9px; font-family:inherit; }

  @media (min-width:480px){ .chapters::before{ right:44px; } }
</style>
</head>
<body>

<header>
  <div class="back-link">← بازگشت</div>
  <div id="headerAuthArea"><button class="admin-link" onclick="openAdminModal()">ورود ادمین</button></div>
</header>

<section class="hero">
  <div class="eyebrow">آکادمی PlanLife</div>
  <h1 class="headline">مسیر رشد شخصی‌ات را <em>ورق بزن</em></h1>
  <p class="hero-sub">هر دوره یک قدم مشخص از تحول‌ست. نقطه‌ی روی مسیر نشون می‌ده کجا باز و کجا هنوز قفله.</p>
</section>

<div class="section-label"><b>دوره‌های صوتی</b><span id="progressCount"></span></div>

<div class="chapters" id="chaptersWrap"></div>

<div class="modal-overlay" id="subscriptionModal"><div class="modal-box" id="modalContent"></div></div>
<div class="modal-overlay" id="pricingModal"><div class="modal-box" id="pricingContent"></div></div>

<div class="toast" id="toast"></div>

<div class="mini-player" id="miniPlayer" onclick="expandPlayer()">
  <img id="miniCover" class="mini-cover" src="" alt="">
  <div class="mini-info">
    <div id="miniTitle" class="mini-title">در حال پخش</div>
    <div id="miniEp" class="mini-ep">PlanLife</div>
  </div>
  <div class="mini-play-btn" onclick="event.stopPropagation(); miniTogglePlay()">
    <svg id="miniPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </div>
  <div class="mini-close" onclick="event.stopPropagation(); killPlayer()">✕</div>
  <div class="mini-progress"><div class="mini-progress-bar" id="miniProgressBar" style="width:0%"></div></div>
</div>

<div class="now-playing" id="nowPlayingScreen">
  <div class="drag-handle-wrap"><div class="drag-handle"></div></div>
  <div class="np-top">
    <button onclick="closeNowPlaying()">←</button>
    <span class="np-status" id="playerStatus">در حال پخش</span>
    <button onclick="alert('منو (به‌زودی)')">⋯</button>
  </div>

  <div class="np-cover-wrap"><img id="npCover" src="" alt=""></div>

  <div class="np-track">
    <div class="np-title serif" id="npTitle">عنوان دوره</div>
    <div class="np-sub" id="npSubtitle">PlanLife</div>
  </div>

  <div class="np-progress">
    <div class="np-bar-track" id="progressContainer"><div class="np-bar-fill" id="progressBar" style="width:0%"></div></div>
    <div class="np-time"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div>
  </div>

  <div class="np-controls">
    <button class="np-ctrl" onclick="prevTrack()"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg></button>
    <button class="np-ctrl" onclick="seek(-10)"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg></button>
    <button class="np-play-main" onclick="togglePlay()"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="np-ctrl" onclick="seek(10)"><svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg></button>
    <button class="np-ctrl" onclick="nextTrack()"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
  </div>

  <div class="np-rate" id="starsSection">
    <span class="np-rate-label">امتیازت به این قسمت؟</span>
    <div class="stars-row" id="starsContainer"></div>
  </div>

  <div class="np-comments">
    <div class="np-comments-head"><span class="serif" style="font-size:16px;font-weight:700;">نظرها</span><span class="count" id="commentCount">0</span></div>
    <div id="commentsList"></div>
    <div class="comment-form" id="commentForm">
      <input id="commentName" type="text" placeholder="نام (اختیاری)">
      <textarea id="commentText" placeholder="نظرت رو بنویس..."></textarea>
      <button class="comment-submit" id="submitCommentBtn" onclick="addComment()">ارسال نظر</button>
    </div>
  </div>

  <audio id="mainAudio" style="display:none;"></audio>
</div>

<script>
/* ================= PREVIEW NOTE =================
   این یه پیش‌نمایش طراحیه. برای اینکه هنگام تست، کامنت‌های واقعی توی
   دیتابیس شما ثبت نشه، بخش نظرات موقتاً از دیتای نمونه‌ی محلی استفاده می‌کنه
   (نه Supabase واقعی). بقیه‌ی منطق (قفل/باز بودن، پخش صدا، پرداخت) دقیقاً
   مثل نسخه‌ی اصلیه. اگه طراحی رو پسندیدی، همینو رو دیتابیس واقعی وصل می‌کنم.
=================================================== */

const categoryConfig = {
  "دوره کدهای پشت‌ پرده پول": {
    cover: "http://fs3.centraldnserver.com/~planlife/pics/Servat/moneyplanlife.JPG",
    codes: ["77777","BA777","TH777","Servat","2933"],
    pricing: { old:"۸،۶۵۰،۰۰۰", new:"۳،۹۶۰،۰۰۰", hasDiscount:true },
    episodes: [
      { episode:0, duration:"12:05", isIntro:true, src:"http://fs3.centraldnserver.com/~planlife/doreha/kargahservatsazi/Moarefi_ dore_servat.m4a" },

  "دوره خود باوری (اعتماد به نفس)": {

    codes: ["11111","ET111","Etemad"],
    pricing: { old:"۶،۵۸۰،۰۰۰", new:"۲،۹۶۰،۰۰۰", hasDiscount:true },
    comingSoon: true,
    episodes: [
      { episode:0, duration:"07:20", isIntro:true, src:"" },
      { episode:1, duration:"32:45", src:"" },
      { episode:2, duration:"43:12", src:"" },
    ]
  },
};
const SOON_MESSAGE = "🔜 این دوره به‌زودی اضافه می‌شود";
const ADMIN_CODE = "admin2933";

const courseData = [];
Object.entries(categoryConfig).forEach(([catName,cfg])=>{
  cfg.episodes.forEach(ep=>{
    courseData.push({
      title: ep.isIntro ? `معرفی: ${catName.replace('دوره ','')}` : catName,
      episode: ep.episode, duration: ep.duration, cover: cfg.cover, src: ep.src,
      isIntro: !!ep.isIntro, category: catName, comingSoon: !!cfg.comingSoon,
    });
  });
});
const subscriptionCodes = {}; const coursePricing = {};
Object.entries(categoryConfig).forEach(([n,c])=>{ subscriptionCodes[n]=c.codes; coursePricing[n]=c.pricing; });

// local mock comment store (preview only)
let mockComments = {};
let seedId = 1;
function seedComment(key,name,text,daysAgo){
  if(!mockComments[key]) mockComments[key]=[];
  const d = new Date(Date.now()-daysAgo*86400000);
  mockComments[key].push({id:seedId++, name, text, created_at:d.toISOString()});
}
seedComment(commentKeySafe('دوره کدهای پشت‌ پرده پول',1),'نگین','قسمت اول خیلی روشنگر بود، منتظر بقیه‌شم 🙏',2);
seedComment(commentKeySafe('دوره کدهای پشت‌ پرده پول',1),'آرمان','صدا و کیفیت فوق‌العادست.',5);
function commentKeySafe(t,e){ return `course_${t}_ep${e}`; }

let unlockedCategories = {};
let isAdmin = false;
let currentTrackIndex = 0;
let currentTrackKey = null;
let userRatings = {};

const audio = document.getElementById('mainAudio');
const progressBar = document.getElementById('progressBar');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const progressContainer = document.getElementById('progressContainer');
const statusEl = document.getElementById('playerStatus');
const playIcon = document.getElementById('playIcon');

function commentKey(title,episode){ return `course_${title}_ep${episode}`; }
function toPersianNum(n){ return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]); }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatCommentTime(iso){ const d=new Date(iso); return `${d.toLocaleDateString('fa-IR',{month:'short',day:'numeric'})} • ${d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}`; }

let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

function statusFor(cat,cfg){
  if(cfg.comingSoon) return {cls:'soon', text:'به‌زودی', dot:'soon'};
  if(isAdmin || unlockedCategories[cat]) return {cls:'open', text:'باز — گوش بده', dot:'unlocked'};
  return {cls:'locked', text:'نیازمند اشتراک', dot:'locked'};
}

function loadPage(){
  const wrap = document.getElementById('chaptersWrap');
  wrap.innerHTML='';
  const cats = Object.keys(categoryConfig);
  let openCount=0;
  cats.forEach((cat,idx)=>{
    const cfg = categoryConfig[cat];
    const st = statusFor(cat,cfg);
    if(st.cls==='open') openCount++;
    const epCount = cfg.episodes.filter(e=>!e.isIntro).length;

    const chapter = document.createElement('div');
    chapter.className = 'chapter' + (cfg.comingSoon?' is-soon':'');
    chapter.id = `chapter-${idx}`;

    const priceHtml = cfg.pricing.hasDiscount
      ? `<div class="chap-price"><s>${cfg.pricing.old}</s>${cfg.pricing.new} تومان</div>`
      : (cfg.pricing.price ? `<div class="chap-price">${cfg.pricing.price} تومان</div>` : '');

    chapter.innerHTML = `
      <div class="chapter-row" onclick="${cfg.comingSoon ? `showToast(SOON_MESSAGE)` : `toggleChapter(${idx})`}">
        <div class="rail-dot ${st.dot==='unlocked'?'unlocked':st.dot==='soon'?'soon':''}"></div>
        <img class="chap-cover" src="${cfg.cover}" alt="">
        <div class="chap-body">
          <div class="chap-title">${cat}</div>
          <div class="chap-meta">
            <span>${toPersianNum(epCount)} قسمت</span>
            <span class="dot-sep"></span>
            <span class="status-${st.cls}">${st.text}</span>
          </div>
          ${cfg.comingSoon ? '' : priceHtml}
        </div>
        <div class="chevron">›</div>
      </div>
      <div class="episodes" id="episodes-${idx}"></div>
    `;
    wrap.appendChild(chapter);
  });
  document.getElementById('progressCount').textContent = `${toPersianNum(openCount)} از ${toPersianNum(cats.length)} باز`;
}

let openChapterIdx = null;
function toggleChapter(idx){
  const cat = Object.keys(categoryConfig)[idx];
  const epWrap = document.getElementById(`episodes-${idx}`);
  const chapterEl = document.getElementById(`chapter-${idx}`);
  const wasOpen = openChapterIdx===idx;

  document.querySelectorAll('.episodes').forEach(e=>{ e.classList.remove('open'); e.innerHTML=''; });
  document.querySelectorAll('.chapter').forEach(c=>c.classList.remove('open'));

  if(!wasOpen){
    epWrap.innerHTML = buildEpisodesHTML(cat);
    epWrap.classList.add('open');
    chapterEl.classList.add('open');
    openChapterIdx = idx;
    setTimeout(()=>chapterEl.scrollIntoView({behavior:'smooth',block:'start'}),60);
  } else {
    openChapterIdx = null;
  }
}

function buildEpisodesHTML(cat){
  const items = courseData.filter(x=>x.category===cat);
  let html = '<div class="episodes-inner">';
  const intro = items.find(x=>x.isIntro);
  if(intro){
    const idx = courseData.indexOf(intro);
    html += `
      <div class="ep-row intro" onclick="playCourse(${idx})">
        <div class="ep-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        <div class="ep-info"><div class="ep-title">${intro.title}</div><div class="ep-tag">معرفی رایگان</div></div>
        <div class="ep-dur">${intro.duration}</div>
      </div>`;
  }
  items.filter(x=>!x.isIntro).forEach(item=>{
    const idx = courseData.indexOf(item);
    const key = commentKey(item.title,item.episode);
    const cnt = toPersianNum((mockComments[key]||[]).length);
    html += `
      <div class="ep-row" onclick="playCourse(${idx})">
        <div class="ep-num">${toPersianNum(item.episode)}</div>
        <div class="ep-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        <div class="ep-info"><div class="ep-title">قسمت ${toPersianNum(item.episode)}</div></div>
        <div class="ep-comments"><svg viewBox="0 0 24 24"><path d="M21 6.5C21 5.12 19.88 4 18.5 4h-13C4.12 4 3 5.12 3 6.5v8C3 15.88 4.12 17 5.5 17H7l3 3 3-3h5.5c1.38 0 2.5-1.12 2.5-2.5v-8z"/></svg>${cnt}</div>
        <div class="ep-dur">${item.duration}</div>
      </div>`;
  });
  html += '</div>';
  return html;
}

function renderStars(){
  const c = document.getElementById('starsContainer'); c.innerHTML='';
  const rating = userRatings[currentTrackKey]||0;
  for(let i=1;i<=5;i++){
    const b = document.createElement('button');
    b.className = `star-btn ${rating>=i?'filled':''}`; b.textContent='★';
    b.onclick = (e)=>{ e.preventDefault(); userRatings[currentTrackKey]=i; renderStars(); };
    c.appendChild(b);
  }
}

function loadComments(title,episode){
  const key = commentKey(title,episode);
  currentTrackKey = key;
  const starsSection = document.getElementById('starsSection');
  const cat = courseData[currentTrackIndex].category;
  if(isAdmin || unlockedCategories[cat] || courseData[currentTrackIndex].isIntro){ starsSection.classList.add('active'); renderStars(); }
  else { starsSection.classList.remove('active'); }
  renderComments(key);
}

function renderComments(key){
  const comments = mockComments[key] || [];
  const list = document.getElementById('commentsList');
  document.getElementById('commentCount').textContent = comments.length;
  list.innerHTML = '';
  if(comments.length===0){
    list.innerHTML = '<p style="opacity:0.4;text-align:center;padding:18px 10px;font-size:13.5px;">هنوز نظری ثبت نشده. اولین نفر باش!</p>';
    return;
  }
  comments.slice().reverse().forEach(c=>{
    const div = document.createElement('div'); div.className='comment-row';
    div.innerHTML = `
      <div class="comment-head">
        <span class="comment-name">${escapeHtml(c.name)}</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="comment-time">${formatCommentTime(c.created_at)}</span>
          ${isAdmin ? `<button class="del-btn" onclick="deleteComment('${key}',${c.id})">حذف</button>` : ''}
        </div>
      </div>
      <p class="comment-text">${escapeHtml(c.text)}</p>`;
    list.appendChild(div);
  });
}

function addComment(){
  if(!currentTrackKey) return;
  const name = document.getElementById('commentName').value.trim() || 'ناشناس';
  const text = document.getElementById('commentText').value.trim();
  if(!text){ showToast('لطفاً متن نظر رو بنویس'); return; }
  if(!mockComments[currentTrackKey]) mockComments[currentTrackKey]=[];
  mockComments[currentTrackKey].push({id:seedId++, name, text, created_at:new Date().toISOString()});
  renderComments(currentTrackKey);
  document.getElementById('commentText').value='';
  document.getElementById('commentName').value='';
  showToast('نظرت ثبت شد ✓');
}

function deleteComment(key,id){
  if(!isAdmin) return;
  mockComments[key] = (mockComments[key]||[]).filter(c=>c.id!==id);
  renderComments(key);
}

function openAdminModal(){
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-title">ورود ادمین</div>
    <div class="modal-sub">کد ادمین رو وارد کن تا دسترسی کامل داشته باشی</div>
    <input id="adminCodeInput" type="password" maxlength="15" placeholder="کد ادمین" class="modal-input">
    <button onclick="checkAdminCode()" class="modal-btn btn-primary">تأیید</button>
    <button onclick="closeModal()" class="modal-btn btn-secondary">بستن</button>`;
  document.getElementById('subscriptionModal').classList.add('active');
}
function checkAdminCode(){
  const code = document.getElementById('adminCodeInput').value.trim();
  if(code===ADMIN_CODE){
    isAdmin = true;
    Object.keys(subscriptionCodes).forEach(c=>unlockedCategories[c]=true);
    updateAdminHeader(); loadPage(); closeModal();
    if(currentTrackKey) loadComments(courseData[currentTrackIndex].title, courseData[currentTrackIndex].episode);
    showToast('دسترسی ادمین فعال شد 👑');
  } else {
    const inp = document.getElementById('adminCodeInput');
    inp.style.borderColor='#ff5a5a'; inp.value=''; inp.placeholder='کد اشتباهه';
    setTimeout(()=>{ if(document.getElementById('adminCodeInput')){ inp.style.borderColor=''; inp.placeholder='کد ادمین'; } },1600);
  }
}
function updateAdminHeader(){
  const area = document.getElementById('headerAuthArea');
  if(isAdmin){
    area.innerHTML = `<div class="admin-pill"><span class="admin-tag">ادمین</span><button class="logout-link" onclick="doLogout()">خروج</button></div>`;
  } else {
    area.innerHTML = `<button class="admin-link" onclick="openAdminModal()">ورود ادمین</button>`;
  }
}
function doLogout(){
  isAdmin=false; unlockedCategories={}; updateAdminHeader(); loadPage();
  if(currentTrackKey) loadComments(courseData[currentTrackIndex].title, courseData[currentTrackIndex].episode);
}

function playCourse(index){
  const item = courseData[index];
  if(item.comingSoon){ showToast(SOON_MESSAGE); return; }
  if(item.isIntro || isAdmin || unlockedCategories[item.category]) playAudio(item);
  else showSubscriptionModal(item.category);
}

function showSubscriptionModal(category){
  window.currentUnlockCategory = category;
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-title">نیاز به اشتراک داری</div>
    <div class="modal-sub">دسته‌بندی: <b style="color:#F4ECDD;">${category}</b><br>کد اشتراکت رو وارد کن یا تهیه‌ش کن</div>
    <input id="unlockCode" type="text" maxlength="10" placeholder="*****" class="modal-input">
    <button onclick="checkUnlockCode()" class="modal-btn btn-primary">فعال‌سازی</button>
    <button onclick="showPricingModal('${category}')" class="modal-btn btn-secondary">💳 تهیه اشتراک</button>
    <button onclick="closeModal()" class="modal-btn btn-ghost">بستن</button>`;
  document.getElementById('subscriptionModal').classList.add('active');
}
function checkUnlockCode(){
  const code = document.getElementById('unlockCode').value.trim();
  const category = window.currentUnlockCategory;
  if(code===ADMIN_CODE){ checkAdminCode2remap(); return; }
  if(subscriptionCodes[category] && subscriptionCodes[category].includes(code)){
    unlockedCategories[category]=true; loadPage(); closeModal();
    showToast('اشتراک فعال شد ✓');
  } else {
    document.getElementById('modalContent').innerHTML = `
      <div class="modal-title" style="color:#ff8a8a;">کد اشتباهه</div>
      <div class="modal-sub">لطفاً کد صحیح رو وارد کن یا با پشتیبانی تماس بگیر</div>
      <button onclick="showSubscriptionModal('${category}')" class="modal-btn btn-secondary">تلاش دوباره</button>
      <button onclick="closeModal()" class="modal-btn btn-ghost">بستن</button>`;
  }
}
function checkAdminCode2remap(){
  isAdmin=true; Object.keys(subscriptionCodes).forEach(c=>unlockedCategories[c]=true);
  updateAdminHeader(); loadPage(); closeModal(); showToast('دسترسی ادمین فعال شد 👑');
}
function closeModal(){ document.getElementById('subscriptionModal').classList.remove('active'); }

function showPricingModal(category){
  closeModal();
  const rows = Object.keys(coursePricing).map(name=>{
    const cfg = categoryConfig[name]; const p = coursePricing[name];
    if(cfg.comingSoon){
      return `<div class="price-row"><div><div class="pname">${name}</div><div style="font-size:11.5px;color:#C6A16A;margin-top:3px;">به‌زودی اضافه می‌شه</div></div><button class="buy-mini" style="opacity:0.5;" onclick="showToast(SOON_MESSAGE)">⏳</button></div>`;
    }
    const priceHtml = p.hasDiscount ? `<span class="pold">${p.old} ت</span><span class="pval">${p.new} تومان</span>` : `<span class="pval">${p.price} تومان</span>`;
    return `<div class="price-row"><div><div class="pname">${name}</div>${priceHtml}</div><button class="buy-mini" onclick="showCardModal('${name}')">خرید</button></div>`;
  }).join('');
  document.getElementById('pricingContent').innerHTML = `
    <div class="modal-title" style="margin-bottom:16px;">تهیه اشتراک</div>
    ${rows}
    <button onclick="closePricingModal()" class="modal-btn btn-secondary" style="margin-top:18px;">بستن</button>`;
  document.getElementById('pricingModal').classList.add('active');
}
function closePricingModal(){ document.getElementById('pricingModal').classList.remove('active'); }
function showCardModal(category){
  closePricingModal();
  showToast('برای اتصال درگاه پرداخت واقعی آماده‌ست ✓');
}

function formatTime(s){ if(!s||isNaN(s)) return "0:00"; return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; }
audio.addEventListener('timeupdate', ()=>{
  if(!audio.duration) return;
  const pct = (audio.currentTime/audio.duration)*100;
  progressBar.style.width = `${pct}%`;
  currentTimeEl.textContent = formatTime(audio.currentTime);
  const mpb = document.getElementById('miniProgressBar'); if(mpb) mpb.style.width = `${pct}%`;
});
audio.addEventListener('loadedmetadata', ()=> totalTimeEl.textContent = formatTime(audio.duration));
progressContainer.addEventListener('click', e=>{
  const r = progressContainer.getBoundingClientRect();
  audio.currentTime = ((e.clientX-r.left)/r.width) * audio.duration;
});

function setPlayIcons(playing){
  const icon = playing ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  playIcon.innerHTML = icon;
  document.getElementById('miniPlayIcon').innerHTML = icon;
  statusEl.textContent = playing ? 'در حال پخش' : 'متوقف شده';
}

function playAudio(item){
  currentTrackIndex = courseData.indexOf(item);
  document.getElementById('npTitle').textContent = item.title;
  document.getElementById('npSubtitle').textContent = item.isIntro ? 'معرفی رایگان' : `قسمت ${toPersianNum(item.episode)}`;
  document.getElementById('npCover').src = item.cover;
  document.getElementById('miniTitle').textContent = item.title;
  document.getElementById('miniEp').textContent = item.isIntro ? 'معرفی' : `قسمت ${toPersianNum(item.episode)}`;
  document.getElementById('miniCover').src = item.cover;
  if(item.src){ audio.src = item.src; audio.play().then(()=>setPlayIcons(true)).catch(()=>setPlayIcons(false)); }
  else { setPlayIcons(false); showToast('فایل نمونه در این پیش‌نمایش موجود نیست'); }
  loadComments(item.title, item.episode);
  expandPlayer();
}

function expandPlayer(){
  const screen = document.getElementById('nowPlayingScreen');
  document.getElementById('miniPlayer').classList.remove('active');
  screen.classList.add('active');
}
function minimizePlayer(){
  document.getElementById('nowPlayingScreen').classList.remove('active');
  if(audio.src) document.getElementById('miniPlayer').classList.add('active');
}
function killPlayer(){
  document.getElementById('nowPlayingScreen').classList.remove('active');
  document.getElementById('miniPlayer').classList.remove('active');
  audio.pause(); setPlayIcons(false);
}
function miniTogglePlay(){ if(audio.paused){ audio.play(); setPlayIcons(true);} else { audio.pause(); setPlayIcons(false);} }
function togglePlay(){ miniTogglePlay(); }
function seek(s){ if(audio.src) audio.currentTime += s; }
function prevTrack(){ if(currentTrackIndex>0) playAudio(courseData[currentTrackIndex-1]); }
function nextTrack(){ if(currentTrackIndex<courseData.length-1) playAudio(courseData[currentTrackIndex+1]); }
function closeNowPlaying(){ minimizePlayer(); }

window.onload = loadPage;
</script>
