    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Vazirmatn', sans-serif; background: #030303; color: white; }

    .now-playing {
        position: fixed;
        top: 10px; left: 10px; right: 10px;
        height: calc(100% - 10px); height: calc(100dvh - 10px);
        background: rgba(10, 10, 25, 0.98);
        z-index: 300;
        display: none;
        flex-direction: column;
        align-items: center;
        padding: 20px 20px 40px;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        transform: translateY(110%);
        border-radius: 22px 22px 0 0;
        will-change: transform, border-radius;
        touch-action: pan-y;
    }
    .now-playing.active {
        display: flex;
        transform: translateY(0%);
        border-radius: 22px 22px 0 0;
        transition: transform 0.52s cubic-bezier(0.32, 0.72, 0, 1),

    .drag-handle-wrap { width: 100%; display: flex; justify-content: center; padding: 6px 0 2px; flex-shrink: 0; cursor: grab; }

    .mini-player {

<script>
const SUPABASE_URL      = 'https://hjzzvzxhrqovvducnxha.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_VPBS3SSdITASRRIGaxtN3w_ufKOmzbC';
const DELETE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/delete-comment-qa`;
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let allComments = {};

async function fetchCommentsForQA(qaId) {
    try {
        const { data, error } = await supabaseClient.from('qa_comments').select('*').eq('qa_id', qaId).order('created_at', { ascending: false });
        if (error) throw error;
        allComments[qaId] = data || [];
        return true;
    } catch(e) { console.warn('Supabase fetch:', e); return false; }
}
async function fetchAllCommentCounts() {
    try {
        const { data, error } = await supabaseClient.from('qa_comments').select('qa_id');
        if (error) throw error;
        const counts = {};
        (data || []).forEach(row => { counts[row.qa_id] = (counts[row.qa_id] || 0) + 1; });
        return counts;
    } catch(e) { console.warn('Supabase counts fetch:', e); return {}; }
}
async function insertComment(qaId, name, text) {
    try {
        const { data, error } = await supabaseClient.from('qa_comments').insert([{ qa_id: qaId, name, text }]).select();
        if (error) throw error;
        return data && data[0];
    } catch(e) { console.warn('Supabase insert:', e); return null; }
}
async function deleteCommentRemote(commentId, adminPassword) {
    try {
        const res = await fetch(DELETE_FUNCTION_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY },
            body: JSON.stringify({ commentId, adminPassword })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || ('HTTP ' + res.status));
        return true;
    } catch(e) { console.warn('Edge function delete:', e); alert('خطا در حذف نظر: ' + e.message); return false; }
}

function openLogin() {
    document.getElementById('loginOverlay').classList.add('active');
    document.getElementById('loginError').style.display = 'none';
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPassword').value = '';
    setTimeout(() => document.getElementById('loginUsername').focus(), 100);
}
function closeLogin() { document.getElementById('loginOverlay').classList.remove('active'); }
function doLogin() {
    const u = document.getElementById('loginUsername').value.trim();
    const p = document.getElementById('loginPassword').value;
    if (u === ADMIN_USER && p === ADMIN_PASS) {
        isAdmin = true; closeLogin(); updateAdminHeader();
        if (currentQAId !== null) renderComments(currentQAId);
    } else { document.getElementById('loginError').style.display = 'block'; }
}
function doLogout() { isAdmin = false; updateAdminHeader(); if (currentQAId !== null) renderComments(currentQAId); }
function updateAdminHeader() {
    const area = document.getElementById('headerAuthArea');
    if (isAdmin) {
        area.innerHTML = `<div style="display:flex;align-items:center;gap:10px;"><span style="font-size:13px;opacity:0.7;">👑 Admin</span><button onclick="doLogout()" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:999px;color:white;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;">خروج</button></div>`;
    } else { area.innerHTML = `<button onclick="openLogin()" class="admin-badge">🔐 ورود</button>`; }
}

function toPersianNum(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatCommentTime(iso) {
    const d = new Date(iso);
    return `${d.toLocaleDateString('fa-IR',{year:'numeric',month:'short',day:'numeric'})} • ${d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}`;
}

async function loadComments(id) {
    document.getElementById('commentsList').innerHTML = '<div class="loading-comments">⏳ در حال بارگذاری نظرات...</div>';
    document.getElementById('commentCount').textContent = '...';
    await fetchCommentsForQA(id);
    renderComments(id);
    refreshAllCardBadges();
}

function renderComments(id) {
    const comments = allComments[id] || [];
    const list     = document.getElementById('commentsList');
    const countEl  = document.getElementById('commentCount');
    const coverCnt = document.getElementById('coverCommentCount');
    if (!list || !countEl) return;
    countEl.textContent = comments.length;
    if (coverCnt) coverCnt.textContent = toPersianNum(comments.length);
    list.innerHTML = '';
    if (comments.length === 0) {
        list.innerHTML = '<p style="opacity:0.6;text-align:center;padding:22px 10px;font-size:14px;line-height:1.6;">هنوز نظری ثبت نشده.<br>اولین نفر باشید!</p>';
        return;
    }
    comments.forEach(c => {
        const div = document.createElement('div');
        div.style.cssText = 'background:rgba(255,255,255,0.085);border-radius:14px;padding:13px 15px;margin-bottom:9px;border:1px solid rgba(255,255,255,0.06);';
        div.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
            <strong style="color:#ffd700;font-size:14.5px;">${escapeHtml(c.name)}</strong>
            <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:11.5px;opacity:0.55;white-space:nowrap;">${formatCommentTime(c.created_at)}</span>
                ${isAdmin ? `<button class="delete-btn" onclick="deleteComment(${id},${c.id})">🗑 حذف</button>` : ''}
            </div>
        </div>
        <p style="font-size:14.8px;line-height:1.55;margin:0;color:#f0f0f0;">${escapeHtml(c.text)}</p>`;
        list.appendChild(div);
    });
}

async function addComment() {
    if (currentQAId === null) return;
    const name = document.getElementById('commentName').value.trim() || 'ناشناس';
    const text = document.getElementById('commentText').value.trim();
    if (!text) { alert('لطفاً متن نظر را وارد کنید.'); return; }
    const btn = document.getElementById('submitCommentBtn');
    btn.textContent = '⏳ در حال ارسال...'; btn.disabled = true;
    const inserted = await insertComment(currentQAId, name, text);
    if (inserted) {
        if (!allComments[currentQAId]) allComments[currentQAId] = [];
        allComments[currentQAId].unshift(inserted);
        renderComments(currentQAId); refreshAllCardBadges();
        document.getElementById('commentText').value = '';
        document.getElementById('commentName').value = '';
    } else { alert('ارسال نظر با خطا مواجه شد. لطفاً دوباره تلاش کنید.'); }
    btn.textContent = 'ارسال نظر'; btn.disabled = false;
}

async function deleteComment(qaId, commentId) {
    if (!isAdmin || !confirm('این نظر حذف شود؟')) return;
    const ok = await deleteCommentRemote(commentId, ADMIN_API_PASSWORD);
    if (!ok) return;
    allComments[qaId] = (allComments[qaId] || []).filter(c => c.id !== commentId);
    renderComments(qaId); refreshAllCardBadges();
}

function updateCardBadge(id, count) {
    const badge = document.getElementById(`card-badge-${id}`);
    if (badge) badge.textContent = toPersianNum(count);
    if (currentQAId === id) {
        const cc = document.getElementById('coverCommentCount'); if (cc) cc.textContent = toPersianNum(count);
        const mc = document.getElementById('commentCount');      if (mc) mc.textContent = count;
    }
}
async function refreshAllCardBadges() {
    const counts = await fetchAllCommentCounts();
    qaData.forEach(item => updateCardBadge(item.id, counts[item.id] || 0));
}

function setPlayIcons(answering) {
    const icon = answering ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    playIcon.innerHTML = icon;
    document.getElementById('miniPlayIcon').innerHTML = icon;
    statusEl.textContent = answering ? 'درحال نمایش' : 'متوقف شده';
}

function openQA(question, category, id) {
    document.getElementById('questionText').textContent = question;
    document.getElementById('miniTitle').textContent  = question;
    document.getElementById('miniEp').textContent     = category;
    currentQAId  = id;
    currentQAIndex = qaData.findIndex(item => item.id === id);
    loadComments(id);
    expandPlayer();
    setPlayIcons(true);
}

function expandPlayer() {
    const screen = document.getElementById('nowPlayingScreen');
    document.getElementById('miniPlayer').classList.remove('active');
    screen.style.transition = 'none';
    screen.style.transform  = 'translateY(110%)';
    screen.style.borderRadius = '22px 22px 0 0';
    screen.scrollTop = 0;
    screen.classList.add('active');
    requestAnimationFrame(() => requestAnimationFrame(() => {
        screen.style.transition   = 'transform 0.52s cubic-bezier(0.32,0.72,0,1), border-radius 0.52s cubic-bezier(0.32,0.72,0,1)';
        screen.style.transform    = 'translateY(0%)';
        screen.style.borderRadius = '22px 22px 0 0';
    }));
}
function minimizePlayer() {
    const screen = document.getElementById('nowPlayingScreen');
    screen.style.transition   = 'transform 0.48s cubic-bezier(0.32,0.72,0,1), border-radius 0.48s cubic-bezier(0.32,0.72,0,1)';
    screen.style.transform    = 'translateY(110%)';
    screen.style.borderRadius = '22px 22px 0 0';
    setTimeout(() => {
        screen.classList.remove('active');
        screen.style.transform = screen.style.borderRadius = screen.style.transition = '';
        if (currentQAId !== null) document.getElementById('miniPlayer').classList.add('active');
    }, 480);
}
function killPlayer() {
    const screen = document.getElementById('nowPlayingScreen');
    screen.style.transition   = 'transform 0.38s cubic-bezier(0.32,0.72,0,1), border-radius 0.38s ease';
    screen.style.transform    = 'translateY(100%)';
    screen.style.borderRadius = '28px 28px 0 0';
    setTimeout(() => {
        screen.classList.remove('active');
        screen.style.cssText = '';
        document.getElementById('miniPlayer').classList.remove('active');
    }, 380);
    setPlayIcons(false);
}

(function() {
    const screen = document.getElementById('nowPlayingScreen');
    let startY = 0, startX = 0, lastY = 0, velocity = 0, lastTime = 0;
    let intentDecided = false, isMinimizing = false;
    function onStart(e) {
        const t = e.touches[0];
        startY = t.clientY; startX = t.clientX;
        lastY = startY; lastTime = Date.now();
        velocity = 0; intentDecided = false; isMinimizing = false;
        screen.style.transition = 'none';
    }
    function onMove(e) {
        const t   = e.touches[0];
        const dy  = t.clientY - startY;
        const adx = Math.abs(t.clientX - startX);
        const now = Date.now(), dt = now - lastTime;
        if (dt > 0) velocity = (t.clientY - lastY) / dt;
        lastY = t.clientY; lastTime = now;
        if (!intentDecided && (Math.abs(dy) > 8 || adx > 8)) {
            intentDecided = true;
            if (adx > Math.abs(dy) * 1.2) return;
            if (dy < 0) return;
            if (dy > 0 && screen.scrollTop <= 1) { isMinimizing = true; screen.style.willChange = 'transform, border-radius'; }
        }
        if (!isMinimizing || dy <= 0) return;
        e.preventDefault();
        const progress   = Math.min(dy / 380, 1);
        const resistance = dy * (1 - progress * 0.3);
        screen.style.transform    = `translateY(${resistance}px) scale(${1 - progress * 0.08})`;
        screen.style.borderRadius = `${progress * 28}px ${progress * 28}px 0 0`;
        screen.style.opacity      = 1 - progress * 0.15;
    }
    function onEnd() {
        if (!isMinimizing) return;
        isMinimizing = false; screen.style.willChange = '';
        const dy = lastY - startY;
        const shouldMin = velocity > 0.4 || dy > 130;
        screen.style.transition = 'transform 0.46s cubic-bezier(0.32,0.72,0,1), border-radius 0.46s cubic-bezier(0.32,0.72,0,1), opacity 0.46s ease';
        if (shouldMin) {
            screen.style.transform = 'translateY(100%) scale(0.92)';
            screen.style.borderRadius = '28px 28px 0 0';
            screen.style.opacity = '0.6';
            setTimeout(() => {
                screen.classList.remove('active'); screen.style.cssText = '';
                if (currentQAId !== null) document.getElementById('miniPlayer').classList.add('active');
            }, 460);
        } else {
            screen.style.transform = 'translateY(0) scale(1)';
            screen.style.borderRadius = '0px'; screen.style.opacity = '1';
            setTimeout(() => { screen.style.transition = screen.style.transform = screen.style.borderRadius = screen.style.opacity = ''; }, 460);
        }
    }
    screen.addEventListener('touchstart', onStart, { passive: true });
    screen.addEventListener('touchmove',  onMove,  { passive: false });
    document.addEventListener('touchend',    onEnd);
    document.addEventListener('touchcancel', onEnd);
})();

window.onload = loadQAPage;
