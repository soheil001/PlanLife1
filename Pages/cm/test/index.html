<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#17101f">
<title>دوره‌های PlanLife</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Vazirmatn', sans-serif; overflow-x: hidden; color: #f3ede3; background: #0a0611; }
    body {
        background:
            radial-gradient(ellipse 90% 55% at 50% -8%, rgba(139,122,184,0.16), transparent 60%),
            radial-gradient(ellipse 70% 45% at 90% 15%, rgba(201,138,82,0.08), transparent 60%),
            #0a0611;
    }
    .stars { position: fixed; inset: 0; background: transparent; z-index: 1; pointer-events: none; }
    .stars::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(243,237,227,0.7) 1px, transparent 1px); background-size: 160px 160px; opacity: 0.35; animation: twinkle 14s infinite alternate; }
    @keyframes twinkle { 0% { opacity: 0.22; } 100% { opacity: 0.42; } }

    header { position: fixed; top: 0; left: 0; right: 0; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; z-index: 100; background: linear-gradient(to bottom, rgba(10,6,17,0.75), rgba(10,6,17,0)); backdrop-filter: blur(6px); border-bottom: 1px solid rgba(217,178,124,0.08); }

    .main-center { position: relative; z-index: 5; min-height: 100vh; padding: 92px 16px 140px; max-width: 640px; margin: 0 auto; }
    h2 {
        font-size: 22px;
        margin-bottom: 6px;
        text-align: center;
        font-weight: 800;
        letter-spacing: 0.2px;
        color: #f7f1e6;
    }
    .page-eyebrow {
        display: block;
        text-align: center;
        font-size: 11.5px;
        letter-spacing: 2.5px;
        color: #cda06a;
        opacity: 0.75;
        font-weight: 700;
        margin-bottom: 8px;
        text-transform: uppercase;
    }
    .page-sub {
        text-align: center;
        font-size: 13px;
        color: rgba(243,237,227,0.5);
        margin-bottom: 28px;
        font-weight: 400;
    }

    .categories-wrapper {
        display: flex;
        flex-direction: column;
        gap: 0;
    }

    .cat-row {
        display: flex;
        flex-direction: column;
        gap: 0;
    }

    .cat-row-cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-bottom: 0;
    }

    .cat-card {
        position: relative;
        cursor: pointer;
        border-radius: 18px;
        overflow: hidden;
        background: rgba(255,255,255,0.035);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(217,178,124,0.16);
        box-shadow: 0 6px 20px rgba(0,0,0,0.30);
        transition: transform 0.2s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        margin-bottom: 14px;
    }
    .cat-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(217,178,124,0.45), transparent);
        opacity: 0;
        transition: opacity 0.25s ease;
    }
    .cat-card:active { transform: scale(0.97); box-shadow: 0 3px 12px rgba(0,0,0,0.35); }
    .cat-card.open {
        border-color: rgba(217,178,124,0.5);
        box-shadow: 0 10px 28px rgba(201,138,82,0.14), 0 2px 8px rgba(0,0,0,0.25);
    }
    .cat-card.open::before { opacity: 1; }

    .cat-card.cat-soon {
        opacity: 0.62;
    }
    .cat-card.cat-soon .cat-cover-wrap img {
        filter: grayscale(45%);
    }
    .soon-ribbon {
        position: absolute;
        top: 9px;
        left: 9px;
        background: rgba(16,10,20,0.7);
        border: 1px solid rgba(217,178,124,0.32);
        backdrop-filter: blur(8px);
        color: #e8d3ac;
        font-size: 10px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 999px;
        z-index: 2;
        white-space: nowrap;
        letter-spacing: 0.2px;
    }

    .cat-cover-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
    }
    .cat-cover-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .cat-cover-wrap::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, transparent 35%, rgba(8,4,14,0.9) 100%);
    }

    .cat-info {
        padding: 11px 13px 14px;
    }
    .cat-name {
        font-size: 13px;
        font-weight: 700;
        line-height: 1.45;
        color: #f7f1e6;
        margin-bottom: 7px;
    }
    .cat-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .cat-ep-label {
        font-size: 10.5px;
        color: rgba(243,237,227,0.45);
        letter-spacing: 0.2px;
    }
    .cat-arrow {
        width: 20px; height: 20px;
        background: rgba(217,178,124,0.1);
        border: 1px solid rgba(217,178,124,0.22);
        color: #d9b27c;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 11px;
        transition: transform 0.3s ease, background 0.25s ease;
        flex-shrink: 0;
    }
    .cat-card.open .cat-arrow { transform: rotate(90deg); background: rgba(217,178,124,0.22); }

    .episodes-accordion {
        overflow: hidden;
        max-height: 0;
        transition: max-height 0.42s cubic-bezier(0.4,0,0.2,1);
        margin-bottom: 0;
    }
    .episodes-accordion.open {
        max-height: 4000px;
        margin-bottom: 14px;
    }

    .episodes-inner {
        background: rgba(255,255,255,0.025);
        border: 1px solid rgba(217,178,124,0.14);
        border-radius: 18px;
        padding: 10px;
        margin-bottom: 4px;
    }
    .episodes-header {
        font-size: 12.5px;
        font-weight: 700;
        color: rgba(217,178,124,0.85);
        margin-bottom: 10px;
        padding: 4px 6px 8px;
        border-bottom: 1px solid rgba(217,178,124,0.12);
        display: flex;
        align-items: center;
        gap: 8px;
        letter-spacing: 0.2px;
    }

    .podcast-item { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.05); border-radius: 15px; padding: 11px 13px; margin-bottom: 8px; display: flex; align-items: center; gap: 13px; cursor: pointer; transition: transform 0.15s, background 0.2s; }
    .podcast-item:active { transform: scale(0.97); background: rgba(255,255,255,0.07); }
    .podcast-item:last-child { margin-bottom: 0; }
    .podcast-item img { width: 44px; height: 44px; object-fit: cover; border-radius: 9px; flex-shrink: 0; }
    .music-info { flex: 1; overflow: hidden; }
    .music-title { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f3ede3; }
    .music-artist { font-size: 11.5px; color: rgba(243,237,227,0.5); margin-top: 2px; }
    .music-duration { font-size: 11.5px; color: rgba(243,237,227,0.45); align-self: center; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .play-circle { width: 32px; height: 32px; background: rgba(217,178,124,0.1); border: 1px solid rgba(217,178,124,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .play-circle div { border-left-color: #e8d3ac !important; }

    .podcast-comment-badge {
        display: inline-flex; align-items: center; gap: 4px; margin-top: 4px;
        background: rgba(201,138,82,0.12); border-radius: 999px; padding: 2px 8px;
    }
    .podcast-comment-badge svg { width: 10px; height: 10px; fill: #c98a52; }
    .podcast-comment-badge span { font-size: 10.5px; color: #c98a52; font-weight: 700; }

    .intro-badge {
        display: inline-flex; align-items: center; gap: 5px;
        background: rgba(127,217,168,0.1); border: 1px solid rgba(127,217,168,0.28);
        border-radius: 999px; padding: 3px 10px;
        font-size: 10.5px; font-weight: 700; color: #7fd9a8; margin-top: 3px;
    }

    .now-playing {
        position: fixed;
        top: 10px; left: 10px; right: 10px;
        height: calc(100% - 10px); height: calc(100dvh - 10px);
        background:
            radial-gradient(ellipse 100% 40% at 50% 0%, rgba(139,122,184,0.14), transparent 60%),
            rgba(11, 7, 17, 0.99);
        z-index: 300;
        display: none;
        flex-direction: column;
        align-items: center;
        padding: 20px 20px 40px;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        transform: translateY(110%);
        border-radius: 22px 22px 0 0;
        will-change: transform, border-radius;
        touch-action: pan-y;
    }
    .now-playing.active {
        display: flex;
        transform: translateY(0%);
        border-radius: 22px 22px 0 0;
        transition: transform 0.52s cubic-bezier(0.32, 0.72, 0, 1),
                    border-radius 0.52s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .drag-handle-wrap { width: 100%; display: flex; justify-content: center; padding: 6px 0 2px; flex-shrink: 0; cursor: grab; }
    .drag-handle { width: 38px; height: 4px; background: rgba(217,178,124,0.4); border-radius: 999px; }

    .mini-player {
        position: fixed;
        bottom: 14px; left: 14px; right: 14px;
        height: 68px;
        background: rgba(18, 12, 24, 0.82);
        backdrop-filter: blur(28px) saturate(160%);
        -webkit-backdrop-filter: blur(28px) saturate(160%);
        border: 1px solid rgba(217,178,124,0.16);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        z-index: 290;
        display: none; align-items: center;
        padding: 0 14px; gap: 12px;
        cursor: pointer; overflow: hidden;
    }
    .mini-player.active { display: flex; }
    .mini-cover { width: 44px; height: 44px; border-radius: 11px; object-fit: cover; flex-shrink: 0; }
    .mini-info { flex: 1; overflow: hidden; }
    .mini-title { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f3ede3; }
    .mini-ep { font-size: 11.5px; color: rgba(243,237,227,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-progress { position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.08); border-radius: 0 0 20px 20px; overflow: hidden; }
    .mini-progress-bar { height: 100%; background: #d9b27c; border-radius: 999px; transition: width 0.5s linear; }
    .mini-play-btn { width: 38px; height: 38px; background: #d9b27c; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 14px rgba(217,178,124,0.35); }
    .mini-play-btn svg { width: 19px; height: 19px; fill: #17101f; }
    .mini-close { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; opacity: 0.4; flex-shrink: 0; font-size: 18px; }

    .player-topbar { width: 100%; max-width: 380px; display: flex; justify-content: space-between; align-items: center; padding: 8px 0 16px; flex-shrink: 0; }
    .player-status { font-size: 13.5px; font-weight: 600; color: rgba(243,237,227,0.6); letter-spacing: 0.3px; }

    .big-cover { width: 100%; max-width: 190px; margin: 6px 0 10px; position: relative; flex-shrink: 0; }
    .big-cover img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 18px; box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(217,178,124,0.14); }
    .cover-comment-badge {
        position: absolute; bottom: -13px; left: 50%; transform: translateX(-50%);
        background: rgba(18,12,24,0.95); border: 1px solid rgba(217,178,124,0.2);
        backdrop-filter: blur(10px); border-radius: 999px; padding: 5px 14px;
        display: flex; align-items: center; gap: 6px;
        font-size: 12.5px; font-weight: 700; white-space: nowrap; color: #f3ede3;
        box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .cover-comment-badge svg { width: 14px; height: 14px; fill: #c98a52; flex-shrink: 0; }

    .stars-section {
        width: 100%; max-width: 360px; margin: 16px 0; padding: 12px 16px;
        border-radius: 16px;
        display: none;
    }
    .stars-section.active { display: block; }
    .stars-label { font-size: 12.5px; color: rgba(243,237,227,0.55); margin-bottom: 8px; display: block; text-align: center; }
    .stars-container { display: flex; gap: 6px; align-items: center; justify-content: center; direction: ltr; }
    .star-btn {
        width: 38px; height: 38px; border: none; background: none;
        color: rgba(217,178,124,0.22); font-size: 28px; cursor: pointer; font-family: inherit;
        transition: color 0.2s, transform 0.15s;
        display: flex; align-items: center; justify-content: center;
        padding: 0; line-height: 1;
    }
    .star-btn:active { transform: scale(0.88); }
    .star-btn.filled { color: #d9b27c; }

    .track-info { text-align: center; width: 100%; max-width: 360px; margin: 18px 0 8px; flex-shrink: 0; }
    .np-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; color: #f7f1e6; }
    .np-subtitle { font-size: 13px; color: rgba(243,237,227,0.5); }

    .progress-section { width: 100%; max-width: 360px; margin-bottom: 26px; flex-shrink: 0; }
    .progress-container { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 999px; cursor: pointer; margin-bottom: 8px; }
    .progress-bar { height: 100%; background: #d9b27c; border-radius: 999px; }
    .time-display { display: flex; justify-content: space-between; font-size: 12px; color: rgba(243,237,227,0.5); font-variant-numeric: tabular-nums; }

    .main-controls { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 360px; padding: 0 10px; margin-bottom: 28px; flex-shrink: 0; }
    .control-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .control-btn svg { width: 26px; height: 26px; fill: rgba(243,237,227,0.75); transition: all 0.2s; }
    .control-btn:active svg { fill: #d9b27c; transform: scale(0.9); }
    .play-main { width: 74px; height: 74px; background: #d9b27c; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 26px rgba(217,178,124,0.4); cursor: pointer; transition: transform 0.15s; }
    .play-main:active { transform: scale(0.95); }
    .play-main svg { width: 32px; height: 32px; fill: #17101f; }

    .comments-section { width: 100%; max-width: 360px; margin-top: 8px; padding-bottom: 30px; }
    .comments-list { max-height: 240px; overflow-y: auto; padding-right: 4px; margin-bottom: 14px; }
    .comments-list::-webkit-scrollbar { width: 4px; }
    .comments-list::-webkit-scrollbar-thumb { background: rgba(217,178,124,0.25); border-radius: 10px; }
    .delete-btn { background: rgba(217,122,144,0.15); border: 1px solid rgba(217,122,144,0.35); color: #d97a90; border-radius: 8px; padding: 4px 10px; font-size: 11.5px; cursor: pointer; font-family: inherit; }
    .delete-btn:active { background: rgba(217,122,144,0.4); }
    .loading-comments { text-align: center; padding: 20px; color: rgba(243,237,227,0.4); font-size: 13.5px; }

    .admin-badge { display: flex; align-items: center; gap: 6px; background: rgba(217,178,124,0.1); border: 1px solid rgba(217,178,124,0.3); border-radius: 999px; padding: 7px 14px; font-size: 12.5px; font-weight: 600; color: #d9b27c; cursor: pointer; font-family: inherit; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(6,4,10,0.88); backdrop-filter: blur(4px); z-index: 400; display: none; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: rgba(24,16,28,0.9); border: 1px solid rgba(217,178,124,0.16); backdrop-filter: blur(20px); border-radius: 22px; padding: 28px 24px; width: 90%; max-width: 360px; text-align: center; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .modal-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 14.5px; cursor: pointer; margin-top: 10px; font-family: inherit; font-weight: 600; }

    .pricing-box {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(217,178,124,0.16);
        border-radius: 16px; padding: 16px 18px; margin-bottom: 10px; text-align: right;
        position: relative; overflow: hidden;
    }
    .pricing-box .course-name { font-size: 14px; font-weight: 700; margin-bottom: 9px; color: #f3ede3; }
    .pricing-box .old-price { font-size: 12px; color: rgba(243,237,227,0.35); text-decoration: line-through; margin-bottom: 5px; }
    .pricing-box .new-price { font-size: 18px; font-weight: 800; color: #e3c191; }
    .pricing-box .discount-tag { display: inline-block; background: rgba(201,138,82,0.15); border: 1px solid rgba(201,138,82,0.35); color: #e8b98a; border-radius: 999px; padding: 3px 12px; font-size: 11px; font-weight: 700; margin-right: 8px; vertical-align: middle; }
    .pay-btn-gold { width: 100%; padding: 16px; border: none; border-radius: 14px; background: #d9b27c; color: #17101f; font-size: 15px; font-weight: 800; cursor: pointer; font-family: inherit; margin-top: 16px; box-shadow: 0 8px 22px rgba(217,178,124,0.3); transition: transform 0.15s; }
    .pay-btn-gold:active { transform: scale(0.97); }
    .buy-btn-individual { width: 100%; padding: 12px 10px; border: 1px solid rgba(217,178,124,0.3); border-radius: 13px; background: rgba(217,178,124,0.08); color: #d9b27c; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit; margin: -2px 0 16px; transition: transform 0.15s, background 0.2s; }
    .buy-btn-individual:active { transform: scale(0.97); background: rgba(217,178,124,0.2); }
    .buy-btn-individual.soon-btn { opacity: 0.5; cursor: pointer; }

    .card-modal-inner { background: rgba(20,13,24,0.95); border: 1px solid rgba(217,178,124,0.18); border-radius: 22px; padding: 24px 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
    .card-modal-inner::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(217,178,124,0.5), transparent); }
    .card-number-box { display: flex; align-items: center; justify-content: space-between; background: rgba(217,178,124,0.06); border: 1px solid rgba(217,178,124,0.22); border-radius: 14px; padding: 12px 16px; margin: 12px 0; direction: ltr; }
    .card-number-text { font-size: 15px; font-weight: 800; letter-spacing: 3px; color: #e3c191; }
    .copy-btn { background: rgba(217,178,124,0.1); border: 1px solid rgba(217,178,124,0.3); border-radius: 10px; padding: 7px 12px; color: #d9b27c; font-size: 12.5px; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    .copy-btn:active { background: rgba(217,178,124,0.24); }
    .platform-btn { width: 100%; padding: 13px 16px; border: none; border-radius: 13px; font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 12px; margin-bottom: 9px; transition: opacity 0.2s, transform 0.15s; }
    .platform-btn:active { opacity: 0.75; transform: scale(0.98); }
    .platform-btn img { width: 26px; height: 26px; border-radius: 7px; object-fit: cover; flex-shrink: 0; }
    .btn-telegram { background: rgba(33,150,243,0.12); border: 1px solid rgba(33,150,243,0.3); color: #8ec5f2; }
    .btn-whatsapp { background: rgba(37,211,102,0.1); border: 1px solid rgba(37,211,102,0.28); color: #7fd9ae; }
    .btn-bale     { background: rgba(217,178,124,0.08); border: 1px solid rgba(217,178,124,0.25); color: #d9b27c; }

    .toast {
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: rgba(20,13,24,0.96);
        border: 1px solid rgba(217,178,124,0.4);
        backdrop-filter: blur(16px);
        color: #d9b27c;
        font-size: 14px;
        font-weight: 700;
        padding: 13px 22px;
        border-radius: 999px;
        z-index: 500;
        box-shadow: 0 8px 28px rgba(0,0,0,0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        white-space: nowrap;
    }
    .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
</style>
</head>
<body>

<div class="stars"></div>

<header>
    <div onclick="goToHome()"
         style="font-size:15px; cursor:pointer; color:white;
                background: rgba(255,255,255,0.12); backdrop-filter: blur(12px);
                padding: 9px 22px; border-radius: 30px;
                display: inline-flex; align-items: center; gap: 8px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
← خانه
    </div>
    <div id="headerAuthArea">
        <button onclick="openAdminModal()" class="admin-badge">🔐 ورود ادمین</button>
    </div>
</header>

<div class="main-center">
    <span class="page-eyebrow">PlanLife · مسیر رشد</span>
    <h2>دوره‌های آنلاین</h2>
    <p class="page-sub">هر دوره یک قدم رو به جلو در مسیر خودشناسی</p>
    <div class="categories-wrapper" id="categoriesWrapper"></div>
</div>

<!-- Modal اشتراک / ادمین -->
<div id="subscriptionModal" class="modal-overlay">
    <div class="modal-box" id="modalContent"></div>

async function fetchCommentsForKey(key) {
    try {
        const { data, error } = await supabaseClient
            .from('course_comments').select('*').eq('comment_key', key).order('created_at', { ascending: false });
        if (error) throw error;
        allComments[key] = data || [];
        return true;
    } catch(e) { console.warn('Supabase fetch:', e); return false; }
}

async function fetchAllCommentCounts() {
    try {
        const { data, error } = await supabaseClient.from('course_comments').select('comment_key');
        if (error) throw error;
        const counts = {};
        (data || []).forEach(row => { counts[row.comment_key] = (counts[row.comment_key] || 0) + 1; });
        return counts;
    } catch(e) { console.warn('Supabase counts fetch:', e); return {}; }
}

async function insertCourseComment(key, name, text) {
    try {
        const { data, error } = await supabaseClient.from('course_comments').insert([{ comment_key: key, name, text }]).select();
        if (error) throw error;
        return data && data[0];
    } catch(e) { console.warn('Supabase insert:', e); return null; }
}

function loadPage() {
    const categories = Object.keys(categoryConfig);
    const wrapper = document.getElementById('categoriesWrapper');
    wrapper.innerHTML = '';

    for (let i = 0; i < categories.length; i += 2) {
        const row = document.createElement('div');
        row.className = 'cat-row';

        const cardsRow = document.createElement('div');
        cardsRow.className = 'cat-row-cards';

        const cats = [categories[i], categories[i+1]].filter(Boolean);
        cats.forEach((cat, j) => {
            const catIdx = i + j;
            const cfg = categoryConfig[cat];
            const epCount = cfg.episodes.filter(e => !e.isIntro).length;
            const coverSrc = cfg.cover;
            const soon = !!cfg.comingSoon;

            const card = document.createElement('div');
            card.className = 'cat-card' + (soon ? ' cat-soon' : '');
            card.id = `cat-card-${catIdx}`;
            card.innerHTML = `
                <div class="cat-cover-wrap">
                    ${soon ? '<div class="soon-ribbon">به‌زودی</div>' : ''}
                    <img src="${coverSrc}" alt="${cat}" loading="lazy">
                </div>
                <div class="cat-info">
                    <div class="cat-name">${cat}</div>
                    <div class="cat-meta">
                        <span class="cat-ep-label">${toPersianNum(epCount)} قسمت</span>
                        <span class="cat-arrow">›</span>
                    </div>
                </div>`;
            card.onclick = soon
                ? () => showToast(SOON_MESSAGE)
                : () => toggleAccordion(cat, catIdx, i);
            cardsRow.appendChild(card);
        });

        row.appendChild(cardsRow);

        const acc = document.createElement('div');
        acc.className = 'episodes-accordion';
        acc.id = `acc-row-${i}`;
        row.appendChild(acc);

        wrapper.appendChild(row);
    }

    refreshAllListBadges();
}

let openCatIdx = null;

function toggleAccordion(cat, catIdx, rowStart) {
    const accId = `acc-row-${rowStart}`;
    const acc = document.getElementById(accId);
    const card = document.getElementById(`cat-card-${catIdx}`);
    const isSameCat = openCatIdx === catIdx && acc.classList.contains('open');

    document.querySelectorAll('.episodes-accordion').forEach(el => { el.classList.remove('open'); el.innerHTML = ''; });
    document.querySelectorAll('.cat-card').forEach(el => el.classList.remove('open'));

    if (!isSameCat) {
        acc.innerHTML = buildEpisodesHTML(cat);
        acc.classList.add('open');
        card.classList.add('open');
        openCatIdx = catIdx;
        setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
    } else {
        openCatIdx = null;
    }
}

function renderStars() {
    const container = document.getElementById('starsContainer');
    container.innerHTML = '';
    const rating = userRatings[currentTrackKey] || 0;
    for (let i = 1; i <= 5; i++) {
        const btn = document.createElement('button');
        btn.className = `star-btn ${rating >= i ? 'filled' : ''}`;
        btn.textContent = '★';
        btn.onclick = (e) => { e.preventDefault(); userRatings[currentTrackKey] = i; renderStars(); };
        container.appendChild(btn);

async function loadComments(title, episode) {
    const key = commentKey(title, episode);
    currentTrackKey = key;
    const starsSection = document.getElementById('starsSection');
    if (isAdmin || unlockedCategories[courseData[currentTrackIndex].category]) {
        starsSection.classList.add('active'); renderStars();
    } else { starsSection.classList.remove('active'); }
    document.getElementById('commentsList').innerHTML = '<div class="loading-comments">⏳ در حال بارگذاری نظرات...</div>';
    document.getElementById('commentCount').textContent = '...';
    await fetchCommentsForKey(key);
    renderComments(key);
    refreshAllListBadges();
}

function renderComments(key) {
    const comments = allComments[key] || [];
    const list = document.getElementById('commentsList');
    const countEl = document.getElementById('commentCount');
    const coverCount = document.getElementById('coverCommentCount');
    if (!list || !countEl) return;
    countEl.textContent = comments.length;
    if (coverCount) coverCount.textContent = toPersianNum(comments.length);
    list.innerHTML = '';
    if (comments.length === 0) {
        list.innerHTML = '<p style="opacity:0.6;text-align:center;padding:22px 10px;font-size:14px;line-height:1.6;">هنوز نظری ثبت نشده.<br>اولین نفر باشید!</p>';
        return;
    }
    comments.forEach(c => {
        const div = document.createElement('div');
        div.style.cssText = 'background:rgba(255,255,255,0.085);border-radius:14px;padding:13px 15px;margin-bottom:9px;border:1px solid rgba(255,255,255,0.06);';
        div.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
                <strong style="color:#d9b27c;font-size:14.5px;">${escapeHtml(c.name)}</strong>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span style="font-size:11.5px;opacity:0.55;white-space:nowrap;">${formatCommentTime(c.created_at)}</span>
                    ${isAdmin ? `<button class="delete-btn" onclick="deleteComment('${key}',${c.id})">🗑 حذف</button>` : ''}
                </div>
            </div>
            <p style="font-size:14.8px;line-height:1.55;margin:0;color:#f0f0f0;">${escapeHtml(c.text)}</p>`;
        list.appendChild(div);
    });
}

async function addComment() {
    if (!currentTrackKey) return;
    const name = document.getElementById('commentName').value.trim() || 'ناشناس';
    const text = document.getElementById('commentText').value.trim();
    if (!text) { alert('لطفاً متن نظر را وارد کنید.'); return; }
    const btn = document.getElementById('submitCommentBtn');
    btn.textContent = '⏳ در حال ارسال...'; btn.disabled = true;
    const inserted = await insertCourseComment(currentTrackKey, name, text);
    if (inserted) {
        if (!allComments[currentTrackKey]) allComments[currentTrackKey] = [];
        allComments[currentTrackKey].unshift(inserted);
        renderComments(currentTrackKey); refreshAllListBadges();
        document.getElementById('commentText').value = '';
        document.getElementById('commentName').value = '';
    } else { alert('ارسال نظر با خطا مواجه شد. لطفاً دوباره تلاش کنید.'); }
    btn.textContent = 'ارسال نظر'; btn.disabled = false;
}

async function deleteComment(key, commentId) {
    if (!isAdmin || !confirm('این نظر حذف شود؟')) return;
    const ok = await deleteCourseCommentRemote(commentId);
    if (!ok) return;
    allComments[key] = (allComments[key] || []).filter(c => c.id !== commentId);
    renderComments(key); refreshAllListBadges();
}

function updateListBadge(idx, count) {
    const el = document.getElementById(`list-badge-${idx}`);
    if (el) el.textContent = toPersianNum(count);
}

async function refreshAllListBadges() {
    const counts = await fetchAllCommentCounts();
    courseData.forEach((item, idx) => {
        const key = commentKey(item.title, item.episode);
        updateListBadge(idx, counts[key] || 0);
    });
    if (currentTrackKey) {
        const cc = document.getElementById('coverCommentCount');
        const mc = document.getElementById('commentCount');
        const cnt = counts[currentTrackKey] || 0;
        if (cc) cc.textContent = toPersianNum(cnt);
        if (mc) mc.textContent = cnt;
    }
}

function formatTime(s) { if (!s || isNaN(s)) return "0:00"; return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; }

audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    progressBar.style.width = `${(audio.currentTime/audio.duration)*100}%`;
    currentTimeEl.textContent = formatTime(audio.currentTime);
    const mpb = document.getElementById('miniProgressBar');
    if (mpb) mpb.style.width = `${(audio.currentTime/audio.duration)*100}%`;
});
audio.addEventListener('loadedmetadata', () => totalTimeEl.textContent = formatTime(audio.duration));
progressContainer.addEventListener('click', e => {
    const r = progressContainer.getBoundingClientRect();
    audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
});

function setPlayIcons(playing) {
    const icon = playing ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    playIcon.innerHTML = icon;
    document.getElementById('miniPlayIcon').innerHTML = icon;
    statusEl.textContent = playing ? 'در حال پخش' : 'متوقف شده';
}

function playAudio(item) {
    currentTrackIndex = courseData.indexOf(item);
    document.getElementById('npTitle').textContent = item.title;
    document.getElementById('npSubtitle').textContent = item.isIntro ? '🎁 معرفی رایگان' : `قسمت ${item.episode}`;
    document.getElementById('npCover').src = item.cover;
    document.getElementById('miniTitle').textContent = item.title;
    document.getElementById('miniEp').textContent = item.isIntro ? '🎁 معرفی' : `قسمت ${item.episode}`;
    document.getElementById('miniCover').src = item.cover;
    audio.src = item.src;
    audio.play().then(() => setPlayIcons(true)).catch(() => setPlayIcons(false));
    loadComments(item.title, item.episode);
    expandPlayer();
}

function expandPlayer() {
    const screen = document.getElementById('nowPlayingScreen');
    document.getElementById('miniPlayer').classList.remove('active');
    screen.style.transition = 'none';
    screen.style.transform = 'translateY(110%)';
    screen.style.borderRadius = '22px 22px 0 0';
    screen.scrollTop = 0;
    screen.classList.add('active');
    requestAnimationFrame(() => requestAnimationFrame(() => {
        screen.style.transition = 'transform 0.52s cubic-bezier(0.32,0.72,0,1), border-radius 0.52s cubic-bezier(0.32,0.72,0,1)';
        screen.style.transform = 'translateY(0%)';
        screen.style.borderRadius = '22px 22px 0 0';
    }));
}

function minimizePlayer() {
    const screen = document.getElementById('nowPlayingScreen');
    screen.style.transition = 'transform 0.48s cubic-bezier(0.32,0.72,0,1), border-radius 0.48s cubic-bezier(0.32,0.72,0,1)';
    screen.style.transform = 'translateY(110%)';
    screen.style.borderRadius = '22px 22px 0 0';
    setTimeout(() => {
        screen.classList.remove('active');
        screen.style.transform = '';
        screen.style.borderRadius = '';
        screen.style.transition = '';
        if (audio.src) document.getElementById('miniPlayer').classList.add('active');
    }, 480);
}

function killPlayer() {
    const screen = document.getElementById('nowPlayingScreen');
    screen.style.transition = 'transform 0.38s cubic-bezier(0.32,0.72,0,1)';
    screen.style.transform = 'translateY(100%)';
    setTimeout(() => {
        screen.classList.remove('active');
        screen.style.cssText = '';
        document.getElementById('miniPlayer').classList.remove('active');
        audio.pause();
    }, 380);
    setPlayIcons(false);
}

function miniTogglePlay() {
    if (audio.paused) { audio.play(); setPlayIcons(true); }
    else { audio.pause(); setPlayIcons(false); }
}
function togglePlay() { miniTogglePlay(); }
function seek(sec) { if (audio.src) audio.currentTime += sec; }
function prevTrack() { if (currentTrackIndex > 0) playAudio(courseData[currentTrackIndex-1]); }
function nextTrack() { if (currentTrackIndex < courseData.length-1) playAudio(courseData[currentTrackIndex+1]); }
function closeNowPlaying() { minimizePlayer(); }
function showMenu() { alert("منو (به زودی)"); }
function goToHome() { window.location.href = "https://planlife.ir"; }

(function() {
    const screen = document.getElementById('nowPlayingScreen');
    let startY = 0, startX = 0, lastY = 0, velocity = 0, lastTime = 0;
    let intentDecided = false, isMinimizing = false;
    function onStart(e) {
        const t = e.touches[0];
        startY = t.clientY; startX = t.clientX;
        lastY = startY; lastTime = Date.now();
        velocity = 0; intentDecided = false; isMinimizing = false;
        screen.style.transition = 'none';
    }
    function onMove(e) {
        const t = e.touches[0];
        const dy = t.clientY - startY;
        const adx = Math.abs(t.clientX - startX);
        const now = Date.now(), dt = now - lastTime;
        if (dt > 0) velocity = (t.clientY - lastY) / dt;
        lastY = t.clientY; lastTime = now;
        if (!intentDecided && (Math.abs(dy) > 8 || adx > 8)) {
            intentDecided = true;
            if (adx > Math.abs(dy) * 1.2) return;
            if (dy < 0) return;
            if (dy > 0 && screen.scrollTop <= 1) { isMinimizing = true; screen.style.willChange = 'transform, border-radius'; }
        }
        if (!isMinimizing || dy <= 0) return;
        e.preventDefault();
        const progress = Math.min(dy / 380, 1);
        const resistance = dy * (1 - progress * 0.3);
        screen.style.transform = `translateY(${resistance}px) scale(${1 - progress * 0.08})`;
        screen.style.borderRadius = `${progress * 28}px ${progress * 28}px 0 0`;
        screen.style.opacity = 1 - progress * 0.15;
    }
    function onEnd() {
        if (!isMinimizing) return;
        isMinimizing = false; screen.style.willChange = '';
        const dy = lastY - startY;
        const shouldMinimize = velocity > 0.4 || dy > 130;
        screen.style.transition = 'transform 0.46s cubic-bezier(0.32,0.72,0,1), border-radius 0.46s cubic-bezier(0.32,0.72,0,1), opacity 0.46s ease';
        if (shouldMinimize) {
            screen.style.transform = 'translateY(100%) scale(0.92)';
            screen.style.borderRadius = '28px 28px 0 0';
            screen.style.opacity = '0.6';
            setTimeout(() => {
                screen.classList.remove('active');
                screen.style.cssText = '';
                if (audio.src) document.getElementById('miniPlayer').classList.add('active');
            }, 460);
        } else {
            screen.style.transform = 'translateY(0) scale(1)';
            screen.style.borderRadius = '0px';
            screen.style.opacity = '1';
            setTimeout(() => { screen.style.transition = ''; screen.style.transform = ''; screen.style.borderRadius = ''; screen.style.opacity = ''; }, 460);
        }
    }
    screen.addEventListener('touchstart', onStart, { passive: true });
    screen.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
    document.addEventListener('touchcancel', onEnd);
})();

window.onload = loadPage;
</script>
