<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a0033">
    <title>اکسپلور - PlanLife</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- پیش‌اتصال به سرورهای رسانه تا زمان شروع لود کمتر بشه -->
    <link rel="preconnect" href="http://fs3.centraldnserver.com">
    <link rel="dns-prefetch" href="http://fs3.centraldnserver.com">
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="dns-prefetch" href="https://res.cloudinary.com">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            font-family: 'Vazirmatn', sans-serif;
            background: #030303;
            color: white;
            overflow-x: hidden;
        }
        
        /* ========== ستاره‌های پس‌زمینه ========== */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: transparent;
            z-index: 0;
            pointer-events: none;
        }
        .stars::before, .stars::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 80px 80px;
            opacity: 0.45;
        }
        .stars::after {
            background-size: 140px 140px;
            opacity: 0.3;
        }
        
        /* ========== هدر ========== */
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .header-title {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #f5d77a 0%, #d4af37 45%, #b8860b 70%, #f5d77a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.35);
            direction: ltr;
        }
        
        /* دکمه بازگشت به صفحه اصلی */
        .back-btn {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f5d77a;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .back-btn:active {
            transform: translateY(-50%) scale(0.9);
            background: rgba(255, 255, 255, 0.16);
        }
        .back-btn svg {
            width: 20px;
            height: 20px;
        }
        
        /* ===================================================
           STORIES
           =================================================== */
        .stories-wrapper {
            width: 100%;
            max-width: 480px;
            margin: 14px auto 6px;
            position: relative;
            z-index: 2;
        }
        
        .stories-scroll {
            display: flex;
            flex-direction: row;
            direction: ltr;
            gap: 14px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 6px 16px 10px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            cursor: grab;
        }
        .stories-scroll:active { cursor: grabbing; }
        .stories-scroll::-webkit-scrollbar { display: none; }
        
        .stories-wrapper::before,
        .stories-wrapper::after {
            content: ''; position: absolute; top: 0; bottom: 0;
            width: 28px; z-index: 10; pointer-events: none;
        }
        .stories-wrapper::before {
            right: 0;
            background: linear-gradient(to left, rgba(3,3,3,0.85), transparent);
        }
        .stories-wrapper::after {
            left: 0;
            background: linear-gradient(to right, rgba(3,3,3,0.85), transparent);
        }
        
        .story-item {
            display: flex; flex-direction: column;
            align-items: center; gap: 6px;
            flex-shrink: 0; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        
        .story-ring {
            width: 80px; height: 80px; border-radius: 50%;
            padding: 2.5px;
            background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888, #833ab4, #405de6, #5851db);
            transition: background 0.4s ease;
            flex-shrink: 0;
        }
        .story-item.seen .story-ring {
            background: rgba(255,255,255,0.18);
        }
        
        .story-avatar {
            width: 100%; height: 100%; border-radius: 50%;
            background: rgba(255,255,255,0.10);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 2.5px solid rgba(3,3,3,0.9);
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .story-avatar img {
            width: 100%; height: 100%;
            object-fit: cover; border-radius: 50%;
        }
        
        .story-label {
            font-size: 10.5px; font-weight: 600;
            color: rgba(255,255,255,0.85); text-align: center;
            max-width: 72px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; line-height: 1.3;
        }
        
        /* ===================================================
           STORY MODAL
           =================================================== */
        #story-modal {
            position: fixed; top:0; left:0; right:0; bottom:0;
            z-index: 9800;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #story-modal.open { opacity: 1; pointer-events: auto; }
        
        .story-container {
            width: 100%;
            max-width: 375px;
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }
        
        .story-modal-content {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: #000;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .story-modal-content img,
        .story-modal-content video {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .story-progress-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 10;
            display: flex; gap: 3px;
            direction: ltr;
            padding: 10px 12px 6px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
        }
        .progress-seg {
            flex: 1; height: 2.5px;
            background: rgba(255,255,255,0.28);
            border-radius: 3px; overflow: hidden;
        }
        .progress-seg-fill {
            height: 100%; background: white;
            width: 0%; transition: none; border-radius: 3px;
        }
        .progress-seg.done .progress-seg-fill { width: 100%; }
        .progress-seg.active .progress-seg-fill {
            animation: progress-run 5s linear forwards;
        }
        @keyframes progress-run { from { width: 0%; } to { width: 100%; } }
        .story-modal-header {
            position: absolute;
            top: 26px; left: 0; right: 0;
            z-index: 10;
            display: flex; align-items: center; gap: 8px;
            padding: 8px 12px;
            direction: rtl;
            justify-content: space-between;
            flex-direction: row-reverse;
            background: linear-gradient(to bottom, rgba(0,0,0,0.35), transparent);
        }
        .story-logo-section {
            display: flex; align-items: center; gap: 4px;
            flex: 0 0 auto;
        }
        .story-logo-img {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: transparent;
            border: 1.5px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-size: 20px; font-weight: 900; color: white;
            overflow: hidden;
        }
        .story-logo-img img {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .story-branding {
            display: flex; align-items: center; gap: 4px;
        }
        .story-branding-text {
            font-size: 15px; font-weight: 700; color: white;
            line-height: 1;
            text-shadow: 0 1px 6px rgba(0,0,0,0.7);
        }
        .story-checkmark {
            width: 16px; height: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            color: #0084ff;
            flex-shrink: 0;
            overflow: hidden;
            margin-right: 2px;
        }
        .story-checkmark img {
            width: 100%; height: 100%;
            object-fit: contain;
        }
        .story-modal-close {
            font-size: 22px;
            color: white; cursor: pointer; padding: 4px 6px; line-height: 1;
            text-shadow: 0 1px 6px rgba(0,0,0,0.8);
        }
        
        .story-nav-left,
        .story-nav-right {
            position: absolute; top: 0; bottom: 0;
            width: 40%; cursor: pointer; z-index: 9;
            -webkit-tap-highlight-color: transparent;
        }
        .story-nav-right { right: 0; }
        .story-nav-left  { left: 0; }
        
        .story-footer {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            z-index: 10;
            display: flex; flex-direction: column; gap: 10px;
            padding: 40px 14px 18px;
            background: linear-gradient(to top, rgba(0,0,0,0.72) 60%, transparent);
        }
        
        .story-caption {
            font-size: 13px; font-weight: 500;
            color: rgba(255,255,255,0.95);
            text-align: center; line-height: 1.6;
            min-height: 20px;
            display: flex; align-items: center; justify-content: center;
            text-shadow: 0 1px 8px rgba(0,0,0,0.9);
        }
        
        .story-action-btn {
            display: none;
            align-items: center; justify-content: center;
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.13);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1.2px solid rgba(212,175,55,0.6);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4),
                        0 0 20px rgba(212,175,55,0.15),
                        inset 0 1px 0 rgba(255,255,255,0.25);
            color: #ffd060;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 15px; font-weight: 800;
            text-decoration: none;
            text-shadow: 0 0 8px rgba(212,175,55,0.4);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .story-action-btn::before {
            content: ''; position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: glass-shine 2.5s ease-in-out infinite;
        }
        @keyframes glass-shine {
            0%      { left: -100%; }
            50%     { left: 100%; }
            100%    { left: 100%; }
        }
        .story-action-btn:active {
            transform: scale(0.97);
            background: rgba(255,255,255,0.18);
        }
        .story-action-btn.show { display: flex; }
        
        /* ========== کانتینر گرید ========== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 100%;
            padding: 0;
        }
        
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            background: rgba(0, 0, 0, 0.3);
            padding: 0;
        }
        
        /* ========== آیتم ویدیو ========== */
        .video-item {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            height: var(--item-h, auto);
            background: #000;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.2s ease;
        }
        .video-item:active {
            transform: scale(0.98);
        }
        
        .video-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        /* شمارنده ویوز - سمت چپ کاور، بدون بک‌گراند، فقط عدد + آیکن چشم */
        .video-stats {
            position: absolute;
            bottom: 8px;
            left: 8px;
            z-index: 3;
            display: flex;
            gap: 12px;
            font-size: 12px;
            font-weight: 700;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stat svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }
        
        /* ========== مودال ویدیو (فید اسکرولی) ========== */
        .video-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 9000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .video-modal.open {
            opacity: 1;
            pointer-events: auto;
        }
        
        /* کانتینر اسکرول عمودی - هر ویدیو یک صفحه کامل */
        .feed-scroll {
            position: absolute;
            inset: 0;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .feed-scroll::-webkit-scrollbar {
            display: none;
        }
        
        .feed-slide {
            position: relative;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            background: #000;
            overflow: hidden;
        }
        
        .modal-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
                
        /* دکمه بستن */
        .modal-close {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 28px;
            cursor: pointer;
            z-index: 9600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }
        .modal-close:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.25);
        }
        
        /* نوار اطلاعات پایین (پروفایل + توضیحات) ======== */
        .modal-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
            padding: 60px 16px 28px;
            z-index: 5;
            direction: ltr;
            text-align: left;
            transition: padding-bottom 0.25s ease;
        }
        
        /* ردیف پروفایل: لوگو + اسم + تیک — سمت چپ تصویر، چپ به راست */
        .profile-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            margin-bottom: 10px;
            direction: ltr;
            width: fit-content;
        }
        
        .profile-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .profile-name {
            font-size: 15px;
            font-weight: 800;
            color: white;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            direction: ltr;
            unicode-bidi: isolate;
        }
        
        .profile-badge {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        
        /* خط جداکننده کم‌رنگ بین پروفایل و توضیحات
           از زیر آواتار/اسم شروع میشه و وسط تصویر قرار می‌گیره */
        .modal-divider {
            width: 92%;
            max-width: 360px;
            height: 1px;
            margin: 0 0 12px 0;
            background: rgba(255, 255, 255, 0.22);
        }
        
        .video-desc {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.6;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            direction: rtl;
            text-align: right;
            unicode-bidi: isolate;
            cursor: pointer;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-desc.expanded {
            -webkit-line-clamp: unset;
            overflow: visible;
        }
        
        /* ========== باکس آموزشی سوایپ (فقط بار اول) ========== */
        .swipe-tutorial {
            position: fixed;
            inset: 0;
            z-index: 9500;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 24%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.45s ease;
        }
        .swipe-tutorial.show {
            opacity: 1;
        }
        
        .tutorial-glass {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(212, 175, 55, 0.35);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 20px;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
        }
        
        .tutorial-arrow {
            color: #f5d77a;
            animation: tutorialBounce 1.3s ease-in-out infinite;
        }
        .tutorial-arrow svg {
            width: 24px;
            height: 24px;
        }
        @keyframes tutorialBounce {
            0%, 100% { transform: translateY(0); opacity: 0.55; }
            50% { transform: translateY(-9px); opacity: 1; }
        }
        
        .tutorial-text {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.92);
            text-align: center;
            white-space: nowrap;
        }
        
        /* ========== ریسپانسیو ========== */
        @media (max-width: 1024px) {
            .videos-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 600px) {
            .videos-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .header-title {
                font-size: 20px;
            }
            
            .modal-info {
                padding: 50px 20px 24px;
            }
            
            .video-desc {
                font-size: 13px;
            }
            
            .tutorial-text {
                font-size: 12px;
                white-space: normal;
                max-width: 220px;
            }
            
            .story-ring {
                width: 70px;
                height: 70px;
            }
            .story-label {
                font-size: 10px;
                max-width: 64px;
            }
        }
    </style>
</head>
<body>

<div class="stars"></div>

<div class="header">
    <a href="index.html" class="back-btn" aria-label="بازگشت به PlanLife">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div class="header-title">Explore PlanLife</div>
</div>

<!-- ===== استوری‌ها ===== -->
<div class="stories-wrapper">
    <div class="stories-scroll" id="stories-scroll">

        <div class="story-item" data-index="0"
             data-img="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779450993/phonto_jmcfqk.png"
             data-name="پادکست"
             data-caption="پادکست‌های رایگان PlanLife 🎙️"
             data-btn-show="true"
             data-btn-text="شنیدن پادکست‌ها"
             data-btn-link="https://planlife.ir/Pages/podcasts_free/index.html">
            <div class="story-ring">
                <div class="story-avatar">
                    <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779450993/phonto_jmcfqk.png" alt="پادکست">
                </div>
            </div>
            <div class="story-label">پادکست</div>
        </div>

        <div class="story-item" data-index="1"
             data-img="http://fs3.centraldnserver.com/~planlife/pics/story/story1/dore-jadid-jaryan.mov"
             data-name="دوره ی جدید🎙️"
             data-caption="دوره‌های تخصصی رشد فردی 🚀"
             data-btn-show="true"
             data-btn-text="مشاهده دوره‌ها"
             data-btn-link="https://planlife.ir/Pages/Doreha/index.html">
            <div class="story-ring">
                <div class="story-avatar">
                    <img src="https://res.cloudinary.com/dshielkdt/image/upload/q_auto/f_auto/v1779278212/IMG_0906_o7pnur.jpg" alt="دوره‌ها">
                </div>
            </div>
            <div class="story-label">دوره‌ها</div>
        </div>

        <div class="story-item" data-index="2"
             data-img="http://fs3.centraldnserver.com/~planlife/pics/story/story1/Library-1.mp4"
             data-name="کتابخانه ۲"
             data-caption="کتابخانه — بهترین کتاب‌های رشد فردی 📚"
             data-btn-show="true"
             data-btn-text="ورود به کتابخانه"
             data-btn-link="https://planlife.ir/Pages/Book/index.html">
            <div class="story-ring">
                <div class="story-avatar">
                    <img src="https://res.cloudinary.com/dwxaids40/image/upload/q_auto/f_auto/v1781397270/IMG_1897_kgkgss.jpg" alt="کتابخانه">
                </div>
            </div>
            <div class="story-label">کتابخانه ۲</div>
        </div>
        <div class="story-item" data-index="3"

<script>
/* ================================================
   STORIES (دقیقاً از index.html)
   ================================================ */
var stories     = [];
var storyIndex  = 0;
var storyTimer  = null;
var STORY_SEEN_KEY = 'planlife_stories_seen';
var DAY_MS = 24 * 60 * 60 * 1000;

function getSeenMap() {
    try {
      var raw = localStorage.getItem(STORY_SEEN_KEY);
        if (!raw) return {};
        var map = JSON.parse(raw);
        var now = Date.now();
        var cleaned = {};
        Object.keys(map).forEach(function(idx) {
            if (now - map[idx] < DAY_MS) cleaned[idx] = map[idx];
        });
        return cleaned;
    } catch(e) { return {}; }
}
function markSeenPersisted(idx) {
    try {
        var map = getSeenMap();
        map[idx] = Date.now();
        localStorage.setItem(STORY_SEEN_KEY, JSON.stringify(map));
    } catch(e) {}
}
function isSeenPersisted(idx) {
    var map = getSeenMap();
    return Object.prototype.hasOwnProperty.call(map, idx);
}

function initStories() {
    var items = document.querySelectorAll('.story-item');
    items.forEach(function(item) {
        var idx = parseInt(item.dataset.index, 10);
        var alreadySeen = isSeenPersisted(idx);
        stories.push({
            el:      item,
            img:     item.dataset.img     || '',
            name:    item.dataset.name    || '',
            caption: item.dataset.caption || '',
            btnShow: (item.dataset.btnShow || '').toLowerCase() === 'true',
            btnText: item.dataset.btnText || '',
            btnLink: item.dataset.btnLink || '',
            seen:    alreadySeen
        });
        if (alreadySeen) item.classList.add('seen');
        item.addEventListener('click', function() {
            openStoryModal(parseInt(item.dataset.index, 10));
        });
    });
    initDragScroll();
}

var savedScrollY = 0;

function openStoryModal(idx) {
    storyIndex = idx;
    savedScrollY = window.scrollY || window.pageYOffset || 0;
    document.body.style.position = 'fixed';
    document.body.style.top = (-savedScrollY) + 'px';
    document.body.style.left = '0';
    document.body.style.right = '0';
    document.body.style.width = '100%';
    document.getElementById('story-modal').classList.add('open');
    renderStoryModal();
    buildProgressBar();
    startStoryTimer();
}

function closeStoryModal() {
    document.getElementById('story-modal').classList.remove('open');
    clearStoryTimer();
    var contentDiv = document.getElementById('story-modal-content');
    var vid = contentDiv.querySelector('video');
    if (vid) {
        vid.pause();
        vid.muted = true;
        vid.removeAttribute('src');
        vid.load();
        vid.remove();
    }
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.left = '';
    document.body.style.right = '';
    document.body.style.width = '';
    window.scrollTo(0, savedScrollY);
}

function getMediaType(url, el) {
    if (el && el.dataset.type === 'video') return 'video';
    if (!url) return 'image';
    var clean = url.toLowerCase().split('?')[0].split('#')[0];
    var ext = clean.split('.').pop();
    if (['mp4', 'webm', 'ogg', 'mov', 'avi', 'mkv', 'm4v'].includes(ext)) return 'video';
    if (clean.indexOf('/video/upload/') >= 0) return 'video';
    return 'image';
}

function renderStoryModal() {
    var s = stories[storyIndex];
    if (!s) { closeStoryModal(); return; }
    s.seen = true;
    s.el.classList.add('seen');
    markSeenPersisted(storyIndex);

    var mediaType  = getMediaType(s.img, s.el);
    var contentDiv = document.getElementById('story-modal-content');

    var oldVideo = contentDiv.querySelector('video');
    if (oldVideo) { oldVideo.pause(); oldVideo.src = ''; oldVideo.remove(); }
    var oldImg = contentDiv.querySelector('img');
    if (oldImg) oldImg.remove();

    if (mediaType === 'video') {
        var video = document.createElement('video');
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.muted = false;
        video.autoplay = true;
        video.controls = false;
        video.preload = 'auto';
        video.setAttribute('fetchpriority', 'high');
        try { video.fetchPriority = 'high'; } catch(e) {}
        video.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;';

        video.addEventListener('ended', function() { storyNavigate(1); });
        video.addEventListener('error', function() { startStoryTimer(); });
        video.addEventListener('loadedmetadata', function() {
            clearStoryTimer();
            updateProgressForVideo(video);
        });

        var source = document.createElement('source');
        source.src = s.img;
        var ext = s.img.toLowerCase().split('?')[0].split('.').pop();
        source.type = ['webm','ogg'].includes(ext) ? 'video/' + ext : 'video/mp4';
        video.appendChild(source);
        contentDiv.appendChild(video);

        var playPromise = video.play();
        if (playPromise !== undefined) {
            playPromise.catch(function() { showPlayOverlay(video, contentDiv); });
        }
    } else {
        var img = document.createElement('img');
        img.src = s.img;
        img.alt = '';
        img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;';
        contentDiv.appendChild(img);
    }

    document.getElementById('story-caption').textContent = s.caption;

    var btn = document.getElementById('story-action-btn');
    if (s.btnShow && s.btnLink) {
        btn.textContent = s.btnText || 'مشاهده بیشتر';
        btn.href = s.btnLink;
        btn.classList.add('show');
    } else {
        btn.classList.remove('show');
        btn.removeAttribute('href');
    }
}

function updateProgressForVideo(video) {
    var bar = document.getElementById('story-progress-bar');
    var segs = bar.querySelectorAll('.progress-seg');
    var activeSeg = segs[storyIndex];
    if (!activeSeg) return;

    var fill = activeSeg.querySelector('.progress-seg-fill');
    activeSeg.classList.remove('active');
    fill.style.transition = 'none';
    fill.style.width = '0%';

    function updateFill() {
        if (!video.duration || video.paused || video.ended) return;
        var pct = (video.currentTime / video.duration) * 100;
        fill.style.width = pct + '%';
        requestAnimationFrame(updateFill);
    }
    video.addEventListener('play', function() { requestAnimationFrame(updateFill); });
    video.addEventListener('timeupdate', function() {
        if (!video.duration) return;
        fill.style.width = ((video.currentTime / video.duration) * 100) + '%';
    });
}

function showPlayOverlay(video, container) {
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.3);cursor:pointer;';
    var btn = document.createElement('div');
    btn.style.cssText = 'width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.2);backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;font-size:32px;';
    btn.textContent = '▶';
    overlay.appendChild(btn);
    overlay.addEventListener('click', function() { video.play(); overlay.remove(); });
    container.appendChild(overlay);
}

function buildProgressBar() {
    var bar = document.getElementById('story-progress-bar');
    bar.innerHTML = '';
    stories.forEach(function(s, i) {
        var seg  = document.createElement('div');
        seg.className = 'progress-seg';
        if (i < storyIndex) seg.classList.add('done');
        if (i === storyIndex) seg.classList.add('active');
        var fill = document.createElement('div');
        fill.className = 'progress-seg-fill';
        seg.appendChild(fill);
        bar.appendChild(seg);
    });
}

function startStoryTimer() {
    clearStoryTimer();
    storyTimer = setTimeout(function() { storyNavigate(1); }, 5000);
}
function clearStoryTimer() {
    if (storyTimer) { clearTimeout(storyTimer); storyTimer = null; }
}

function storyNavigate(dir) {
    clearStoryTimer();
    storyIndex += dir;
    if (storyIndex < 0) storyIndex = 0;
    if (storyIndex >= stories.length) { closeStoryModal(); return; }
    renderStoryModal();
    buildProgressBar();
    startStoryTimer();
}

document.getElementById('story-modal').addEventListener('click', function(e) {
    if (e.target === this) closeStoryModal();
});

/* ================================================
   DRAG SCROLL
   ================================================ */
function initDragScroll() {
    var el = document.getElementById('stories-scroll');
    var isDown = false, startX, scrollLeft;
    el.addEventListener('mousedown', function(e) {
        isDown = true; startX = e.pageX - el.offsetLeft; scrollLeft = el.scrollLeft;
        el.style.cursor = 'grabbing';
    });
    el.addEventListener('mouseleave', function() { isDown = false; el.style.cursor = 'grab'; });
    el.addEventListener('mouseup',    function() { isDown = false; el.style.cursor = 'grab'; });
    el.addEventListener('mousemove',  function(e) {
        if (!isDown) return;
        e.preventDefault();
        el.scrollLeft = scrollLeft - (e.pageX - el.offsetLeft - startX) * 1.4;
    });
}

/* ========================================
   رسم گرید ویدیوها
   ======================================== */
function renderGrid() {
    const grid = document.getElementById('videosGrid');
    grid.innerHTML = '';
    
    videos.forEach((video, index) => {
        const item = document.createElement('div');
        item.className = 'video-item';
        item.innerHTML = `
            <img src="${video.cover}" alt="${video.title}" loading="${index < 6 ? 'eager' : 'lazy'}" decoding="async" fetchpriority="${index < 3 ? 'high' : 'auto'}">
            <div class="video-stats">
                <div class="stat">
                    <svg viewBox="0 0 24 24" fill="white"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                    ${formatNumber(video.views)}
                </div>
            </div>
        `;
        
        item.addEventListener('click', () => openVideoModal(index));
        grid.appendChild(item);
    });
}

function formatNumber(num) {
    if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
    if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
    return num;
}

/* ========================================
   تنظیم ارتفاع ردیف‌ها برای صفحه اول
   هدف: ۳ ردیف کامل + حدود ۳ سانتیمتر از ردیف چهارم دیده بشه
   تا کاربر متوجه بشه باید اسکرول کنه پایین
   ======================================== */
function adjustGridRowHeight() {
    const grid = document.getElementById('videosGrid');
    const header = document.querySelector('.header');
    if (!grid || !header) return;

    const headerHeight = header.offsetHeight;
    const peekPx = 3 * 37.7952755906; // تبدیل ۳ سانتیمتر به پیکسل (96dpi)
    const availableHeight = window.innerHeight - headerHeight - peekPx;

    // فضای باقی‌مونده رو بین ۳ ردیف کامل تقسیم می‌کنیم
    const itemHeight = availableHeight / 3;

    // یه حداقل منطقی می‌ذاریم تا تو صفحه‌های خیلی کوتاه بیش از حد فشرده نشه
    const finalHeight = Math.max(itemHeight, 140);

    grid.style.setProperty('--item-h', finalHeight + 'px');
}

/* ========================================
   تنظیمات پروفایل (لوگو، اسم، تیک)
   ======================================== */
const PROFILE = {
    avatar: 'http://fs3.centraldnserver.com/~planlife/pics/planlife.jpeg',
    badge: 'http://fs3.centraldnserver.com/~planlife/pics/MagicEraser_260629_074549.png',
    name: 'planlife.ir'
};

/* ========================================
   مودال ویدیو — فید اسکرولی بی‌نهایت
   ======================================== */
const LOOP_COUNT = 3; // چند بار لیست ویدیوها تکرار شود (کمتر = بازشدن سریع‌تر مودال)
let feedItems = []; // هر آیتم: { video, slideEl, videoEl }
let io; // IntersectionObserver برای پلی خودکار + پیش‌بارگذاری زودهنگام

function buildFeedItem(video) {
    const slide = document.createElement('div');
    slide.className = 'feed-slide';
    slide.innerHTML = `
        <video class="modal-video" playsinline webkit-playsinline loop preload="none" poster="${video.cover}"></video>
        <div class="modal-info">
            <div class="profile-row">
                <img class="profile-avatar" src="${PROFILE.avatar}" alt="${PROFILE.name}">
                <span class="profile-name">${PROFILE.name}</span>
                <img class="profile-badge" src="${PROFILE.badge}" alt="verified">
            </div>
            <div class="modal-divider"></div>
            <div class="video-desc">${video.desc}</div>
        </div>
    `;
    const videoEl = slide.querySelector('video');
    const descEl = slide.querySelector('.video-desc');
    const infoEl = slide.querySelector('.modal-info');

    // وقتی روی توضیحات کلیک میشه، اگه متن بلندتر از ۲ خط بود
    // کامل باز میشه و کل بلوک (پروفایل + خط + متن) روی تصویر بالاتر میاد
    descEl.addEventListener('click', () => {
        const isOverflowing = descEl.scrollHeight > descEl.clientHeight;
        if (!descEl.classList.contains('expanded') && !isOverflowing) return;
        descEl.classList.toggle('expanded');
        infoEl.classList.toggle('expanded');
    });

    return { video, slideEl: slide, videoEl };
}

function fillFeed() {
    const scrollEl = document.getElementById('feedScroll');
    scrollEl.innerHTML = '';
    feedItems = [];
    
    for (let i = 0; i < LOOP_COUNT; i++) {
        videos.forEach(video => {
            const item = buildFeedItem(video);
            feedItems.push(item);
            scrollEl.appendChild(item.slideEl);
        });
    }
}

function setupInfiniteScroll() {
    const scrollEl = document.getElementById('feedScroll');
    
    scrollEl.addEventListener('scroll', () => {
        const scrollTop = scrollEl.scrollTop;
        const scrollHeight = scrollEl.scrollHeight;
        const clientHeight = scrollEl.clientHeight;
        
        // وقتی نزدیک انتهای فید رسیدیم، یک دور دیگه از ویدیوها رو اضافه کن
        if (scrollHeight - (scrollTop + clientHeight) < clientHeight * 1.5) {
            videos.forEach(video => {
                const item = buildFeedItem(video);
                feedItems.push(item);
                scrollEl.appendChild(item.slideEl);
                io.observe(item.slideEl);
            });
        }
        
        // وقتی نزدیک ابتدای فید رسیدیم (اسکرول به بالا)، یک دور قبل از ویدیوها رو هم اضافه کن
        if (scrollTop < clientHeight * 0.5) {
            const fragment = document.createDocumentFragment();
            const newItems = [];
            videos.forEach(video => {
                const item = buildFeedItem(video);
                newItems.push(item);
                fragment.appendChild(item.slideEl);
            });
            const prevScrollHeight = scrollHeight;
            scrollEl.insertBefore(fragment, scrollEl.firstChild);
            feedItems = [...newItems, ...feedItems];
            newItems.forEach(item => io.observe(item.slideEl));
            // حفظ موقعیت اسکرول بعد از اضافه کردن آیتم‌های جدید به ابتدا
            scrollEl.scrollTop = scrollTop + (scrollEl.scrollHeight - prevScrollHeight);
        }
    });
}

function loadVideoSrc(item, priority) {
    if (item.videoEl.src) return;
    item.videoEl.preload = 'auto';
    if (priority) item.videoEl.setAttribute('fetchpriority', 'high');
    item.videoEl.src = item.video.src;
    item.videoEl.load();
}

function setupAutoplayObserver() {
    // rootMargin بزرگ باعث میشه لود ویدیوی بعدی/قبلی قبل از رسیدن کاربر بهش شروع بشه
    // و وقتی کاربر بالا میکشه دیگه منتظر بافر نمونه
    io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            const slide = entry.target;
            const videoEl = slide.querySelector('video');
            const item = feedItems.find(it => it.slideEl === slide);
            const idx = feedItems.indexOf(item);

            // به محض اینکه اسلاید وارد محدوده پیش‌بارگذاری بشه، سورس رو ست کن
            if (entry.isIntersecting) {
                loadVideoSrc(item, false);
            }

            if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
                videoEl.setAttribute('fetchpriority', 'high');
                videoEl.play().catch(() => {});

                // پیش‌بارگذاری ویدیوی بعدی و قبلی تا سوایپ سریع‌تر و بدون تاخیر باشه
                [idx - 1, idx + 1].forEach(neighborIdx => {
                    const neighbor = feedItems[neighborIdx];
                    if (neighbor) loadVideoSrc(neighbor, false);
                });
            } else {
                videoEl.pause();
            }
        });
    }, { threshold: [0, 0.3, 0.6, 1], rootMargin: '150% 0px' });
    
    feedItems.forEach(item => io.observe(item.slideEl));
}

/* ========================================
   باکس آموزشی سوایپ — فقط یک بار در کل عمر کاربر نمایش داده میشه
   ======================================== */
const TUTORIAL_KEY = 'plExploreSwipeTutorialSeen';

function maybeShowSwipeTutorial() {
    const tutorial = document.getElementById('swipeTutorial');
    tutorial.classList.remove('show');

    if (localStorage.getItem(TUTORIAL_KEY)) return;

    // یه لحظه صبر می‌کنیم تا ویدیو باز بشه، بعد باکس رو نشون میدیم
    setTimeout(() => tutorial.classList.add('show'), 400);

    const scrollEl = document.getElementById('feedScroll');
    const dismiss = () => {
        tutorial.classList.remove('show');
        localStorage.setItem(TUTORIAL_KEY, '1');
        scrollEl.removeEventListener('scroll', dismiss);
    };
    scrollEl.addEventListener('scroll', dismiss, { once: true, passive: true });
}

function openVideoModal(index) {
    const modal = document.getElementById('videoModal');
    
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    
    fillFeed();
    setupAutoplayObserver();
    setupInfiniteScroll();
    
    // اسکرول به ویدیویی که کاربر کلیک کرده (در اولین دور از LOOP_COUNT)
    const scrollEl = document.getElementById('feedScroll');
    const targetSlide = feedItems[index].slideEl;
    scrollEl.scrollTop = targetSlide.offsetTop;
    
    // پلی فوری ویدیوی هدف با بالاترین اولویت، بدون منتظر ماندن برای observer
    const targetVideo = targetSlide.querySelector('video');
    targetVideo.preload = 'auto';
    targetVideo.setAttribute('fetchpriority', 'high');
    targetVideo.src = videos[index].src;
    targetVideo.load();
    targetVideo.play().catch(() => {});

    // پیش‌بارگذاری ویدیوی بعدی و قبلی برای سوایپ سریع‌تر
    [feedItems[index - 1], feedItems[index + 1]].forEach(neighbor => {
        if (neighbor) loadVideoSrc(neighbor, false);
    });

    maybeShowSwipeTutorial();
}

function closeVideoModal() {
    const modal = document.getElementById('videoModal');
    
    modal.classList.remove('open');
    document.body.style.overflow = '';
    document.getElementById('swipeTutorial').classList.remove('show');
    
    // متوقف کردن همه ویدیوها و پاکسازی observer
    feedItems.forEach(item => {
        item.videoEl.pause();
        item.videoEl.src = '';
    });
    if (io) io.disconnect();
}

/* ========================================
   سوایپ عمودی به صورت طبیعی توسط اسکرول مرورگر
   انجام می‌شود (scroll-snap) — نیازی به کد دستی نیست
   ======================================== */

/* ========================================
   کلیدهای صفحه‌کلید
   ======================================== */
document.addEventListener('keydown', (e) => {
    const modal = document.getElementById('videoModal');
    
    if (!modal.classList.contains('open')) return;
    
    const scrollEl = document.getElementById('feedScroll');
    if (e.key === 'ArrowDown') scrollEl.scrollBy({ top: scrollEl.clientHeight, behavior: 'smooth' });
    if (e.key === 'ArrowUp') scrollEl.scrollBy({ top: -scrollEl.clientHeight, behavior: 'smooth' });
    if (e.key === 'Escape') closeVideoModal();
});

/* ========================================
   شروع
   ======================================== */
window.addEventListener('load', () => {
    renderGrid();
    adjustGridRowHeight();
    initStories();
});
window.addEventListener('resize', adjustGridRowHeight);
</script>
