<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a0033">
    <title>اکسپلور - PlanLife</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- پیش‌اتصال به سرور ویدیو تا زمان شروع پخش کمتر بشه -->
    <link rel="preconnect" href="http://fs3.centraldnserver.com">
    <link rel="dns-prefetch" href="http://fs3.centraldnserver.com">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            font-family: 'Vazirmatn', sans-serif;
            background: #030303;
            color: white;
            overflow-x: hidden;
        }
        
        /* ========== ستاره‌های پس‌زمینه ========== */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: transparent;
            z-index: 0;
            pointer-events: none;
        }
        .stars::before, .stars::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 80px 80px;
            opacity: 0.45;
        }
        .stars::after {
            background-size: 140px 140px;
            opacity: 0.3;
        }
        
        /* ========== هدر ========== */
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .header-title {
            font-size: 24px;
            font-weight: 900;
            color: #d4af37;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }
        
        .header-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .header-icon:active {
            transform: scale(0.95);
        }
        
        /* ========== کانتینر گرید ========== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 100%;
            padding: 0;
        }
        
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            background: rgba(0, 0, 0, 0.3);
            padding: 0;
        }
        
        /* ========== آیتم ویدیو ========== */
        .video-item {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            height: var(--item-h, auto);
            background: #000;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.2s ease;
        }
        .video-item:active {
            transform: scale(0.98);
        }
        
        .video-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        /* شمارنده ویوز - سمت چپ کاور، بدون بک‌گراند، فقط عدد + آیکن چشم */
        .video-stats {
            position: absolute;
            bottom: 8px;
            left: 8px;
            z-index: 3;
            display: flex;
            gap: 12px;
            font-size: 12px;
            font-weight: 700;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stat svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }
        
        /* ========== مودال ویدیو (فید اسکرولی) ========== */
        .video-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 9000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .video-modal.open {
            opacity: 1;
            pointer-events: auto;
        }
        
        /* کانتینر اسکرول عمودی - هر ویدیو یک صفحه کامل */
        .feed-scroll {
            position: absolute;
            inset: 0;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .feed-scroll::-webkit-scrollbar {
            display: none;
        }
        
        .feed-slide {
            position: relative;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            background: #000;
            overflow: hidden;
        }
        
        .modal-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
                
        /* دکمه بستن */
        .modal-close {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 28px;
            cursor: pointer;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }
        .modal-close:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.25);
        }
        
        /* نوار اطلاعات پایین (پروفایل + توضیحات) ======== */
        .modal-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
            padding: 60px 16px 28px;
            z-index: 5;
            direction: ltr;
            text-align: left;
            transition: padding-bottom 0.25s ease;
        }
        
        /* ردیف پروفایل: لوگو + اسم + تیک — سمت چپ تصویر، چپ به راست */
        .profile-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            margin-bottom: 10px;
            direction: ltr;
            width: fit-content;
        }
        
        .profile-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .profile-name {
            font-size: 15px;
            font-weight: 800;
            color: white;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            direction: ltr;
            unicode-bidi: isolate;
        }
        
        .profile-badge {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        
        /* خط جداکننده کم‌رنگ بین پروفایل و توضیحات
           از زیر آواتار/اسم شروع میشه و وسط تصویر قرار می‌گیره */
        .modal-divider {
            width: 92%;
            max-width: 360px;
            height: 1px;
            margin: 0 0 12px 0;
            background: rgba(255, 255, 255, 0.22);
        }
        
        .video-desc {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.6;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            direction: rtl;
            text-align: right;
            unicode-bidi: isolate;
            cursor: pointer;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-desc.expanded {
            -webkit-line-clamp: unset;
            overflow: visible;
        }
        
        /* ========== ریسپانسیو ========== */
        @media (max-width: 1024px) {
            .videos-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 600px) {
            .videos-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .header-title {
                font-size: 20px;
            }
            
            .modal-info {
                padding: 50px 20px 24px;
            }
            
            .video-desc {
                font-size: 13px;
            }
        }
    </style>
</head>

/* ========================================
   رسم گرید ویدیوها
   ======================================== */
function renderGrid() {
    const grid = document.getElementById('videosGrid');
    grid.innerHTML = '';
    
    videos.forEach((video, index) => {
        const item = document.createElement('div');
        item.className = 'video-item';
        item.innerHTML = `
            <img src="${video.cover}" alt="${video.title}">
            <div class="video-stats">
                <div class="stat">
                    <svg viewBox="0 0 24 24" fill="white"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                    ${formatNumber(video.views)}
                </div>
            </div>
        `;
        
        item.addEventListener('click', () => openVideoModal(index));
        grid.appendChild(item);
    });
}

function formatNumber(num) {
    if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
    if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
    return num;
}

/* ========================================
   تنظیم ارتفاع ردیف‌ها برای صفحه اول
   هدف: ۳ ردیف کامل + حدود ۳ سانتیمتر از ردیف چهارم دیده بشه
   تا کاربر متوجه بشه باید اسکرول کنه پایین
   ======================================== */
function adjustGridRowHeight() {
    const grid = document.getElementById('videosGrid');
    const header = document.querySelector('.header');
    if (!grid || !header) return;

    const headerHeight = header.offsetHeight;
    const peekPx = 3 * 37.7952755906; // تبدیل ۳ سانتیمتر به پیکسل (96dpi)
    const availableHeight = window.innerHeight - headerHeight - peekPx;

    // فضای باقی‌مونده رو بین ۳ ردیف کامل تقسیم می‌کنیم
    const itemHeight = availableHeight / 3;

    // یه حداقل منطقی می‌ذاریم تا تو صفحه‌های خیلی کوتاه بیش از حد فشرده نشه
    const finalHeight = Math.max(itemHeight, 140);

    grid.style.setProperty('--item-h', finalHeight + 'px');
}

/* ========================================
   تنظیمات پروفایل (لوگو، اسم، تیک)
   ======================================== */
const PROFILE = {

/* ========================================
   مودال ویدیو — فید اسکرولی بی‌نهایت
   ======================================== */
const LOOP_COUNT = 6; // چند بار لیست ویدیوها تکرار شود تا اسکرول بی‌نهایت طبیعی به نظر برسد
let feedItems = []; // هر آیتم: { video, slideEl, videoEl }
let io; // IntersectionObserver برای پلی خودکار

function buildFeedItem(video) {
    const slide = document.createElement('div');
    slide.className = 'feed-slide';
    slide.innerHTML = `
        <video class="modal-video" playsinline webkit-playsinline loop preload="metadata" poster="${video.cover}"></video>
        <div class="modal-info">
            <div class="profile-row">
                <img class="profile-avatar" src="${PROFILE.avatar}" alt="${PROFILE.name}">
                <span class="profile-name">${PROFILE.name}</span>
                <img class="profile-badge" src="${PROFILE.badge}" alt="verified">
            </div>
            <div class="modal-divider"></div>
            <div class="video-desc">${video.desc}</div>
        </div>
    `;
    const videoEl = slide.querySelector('video');
    const descEl = slide.querySelector('.video-desc');
    const infoEl = slide.querySelector('.modal-info');

    // وقتی روی توضیحات کلیک میشه، اگه متن بلندتر از ۲ خط بود
    // کامل باز میشه و کل بلوک (پروفایل + خط + متن) روی تصویر بالاتر میاد
    descEl.addEventListener('click', () => {
        const isOverflowing = descEl.scrollHeight > descEl.clientHeight;
        if (!descEl.classList.contains('expanded') && !isOverflowing) return;
        descEl.classList.toggle('expanded');
        infoEl.classList.toggle('expanded');
    });

    return { video, slideEl: slide, videoEl };
}

function fillFeed() {
    const scrollEl = document.getElementById('feedScroll');
    scrollEl.innerHTML = '';
    feedItems = [];
    
    for (let i = 0; i < LOOP_COUNT; i++) {
        videos.forEach(video => {
            const item = buildFeedItem(video);
            feedItems.push(item);
            scrollEl.appendChild(item.slideEl);
        });
    }
}

function setupInfiniteScroll() {
    const scrollEl = document.getElementById('feedScroll');
    
    scrollEl.addEventListener('scroll', () => {
        const scrollTop = scrollEl.scrollTop;
        const scrollHeight = scrollEl.scrollHeight;
        const clientHeight = scrollEl.clientHeight;
        
        // وقتی نزدیک انتهای فید رسیدیم، یک دور دیگه از ویدیوها رو اضافه کن
        if (scrollHeight - (scrollTop + clientHeight) < clientHeight * 1.5) {
            videos.forEach(video => {
                const item = buildFeedItem(video);
                feedItems.push(item);
                scrollEl.appendChild(item.slideEl);
                io.observe(item.slideEl);
            });
        }
        
        // وقتی نزدیک ابتدای فید رسیدیم (اسکرول به بالا)، یک دور قبل از ویدیوها رو هم اضافه کن
        if (scrollTop < clientHeight * 0.5) {
            const fragment = document.createDocumentFragment();
            const newItems = [];
            videos.forEach(video => {
                const item = buildFeedItem(video);
                newItems.push(item);
                fragment.appendChild(item.slideEl);
            });
            const prevScrollHeight = scrollHeight;
            scrollEl.insertBefore(fragment, scrollEl.firstChild);
            feedItems = [...newItems, ...feedItems];
            newItems.forEach(item => io.observe(item.slideEl));
            // حفظ موقعیت اسکرول بعد از اضافه کردن آیتم‌های جدید به ابتدا
            scrollEl.scrollTop = scrollTop + (scrollEl.scrollHeight - prevScrollHeight);
        }
    });
}

function setupAutoplayObserver() {
    io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            const slide = entry.target;
            const videoEl = slide.querySelector('video');
            const item = feedItems.find(it => it.slideEl === slide);
            const idx = feedItems.indexOf(item);

            // به محض اینکه اسلاید کمی وارد دیدرس بشه، فوراً سورس رو ست کن تا بافر شروع بشه
            if (entry.isIntersecting) {
                if (!videoEl.src) {
                    videoEl.preload = 'auto';
                    videoEl.src = item.video.src;
                    videoEl.load();
                }
            }

            if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
                videoEl.play().catch(() => {});

                // پیش‌بارگذاری ویدیوی بعدی و قبلی تا سوایپ سریع‌تر و بدون تاخیر باشه
                [idx - 1, idx + 1].forEach(neighborIdx => {
                    const neighbor = feedItems[neighborIdx];
                    if (neighbor && !neighbor.videoEl.src) {
                        neighbor.videoEl.preload = 'auto';
                        neighbor.videoEl.src = neighbor.video.src;
                        neighbor.videoEl.load();
                    }
                });
            } else {
                videoEl.pause();
            }
        });
    }, { threshold: [0, 0.3, 0.6, 1] });
    
    feedItems.forEach(item => io.observe(item.slideEl));
}

function openVideoModal(index) {
    const modal = document.getElementById('videoModal');
    
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    
    fillFeed();
    setupAutoplayObserver();
    setupInfiniteScroll();
    
    // اسکرول به ویدیویی که کاربر کلیک کرده (در اولین دور از LOOP_COUNT)
    const scrollEl = document.getElementById('feedScroll');
    const targetSlide = feedItems[index].slideEl;
    scrollEl.scrollTop = targetSlide.offsetTop;
    
    // پلی فوری ویدیوی هدف بدون منتظر ماندن برای observer
    const targetVideo = targetSlide.querySelector('video');
    targetVideo.preload = 'auto';
    targetVideo.src = videos[index].src;
    targetVideo.load();
    targetVideo.play().catch(() => {});

    // پیش‌بارگذاری ویدیوی بعدی برای سوایپ سریع‌تر
    const nextItem = feedItems[index + 1];
    if (nextItem && !nextItem.videoEl.src) {
        nextItem.videoEl.preload = 'auto';
        nextItem.videoEl.src = nextItem.video.src;
        nextItem.videoEl.load();
    }
}

function closeVideoModal() {
    const modal = document.getElementById('videoModal');
    
    modal.classList.remove('open');
    document.body.style.overflow = '';
    
    // متوقف کردن همه ویدیوها و پاکسازی observer
    feedItems.forEach(item => {
        item.videoEl.pause();
        item.videoEl.src = '';
    });
    if (io) io.disconnect();
}

/* ========================================
   سوایپ عمودی به صورت طبیعی توسط اسکرول مرورگر
   انجام می‌شود (scroll-snap) — نیازی به کد دستی نیست
   ======================================== */

/* ========================================
   کلیدهای صفحه‌کلید
   ======================================== */
document.addEventListener('keydown', (e) => {
    const modal = document.getElementById('videoModal');
    
    if (!modal.classList.contains('open')) return;
    
    const scrollEl = document.getElementById('feedScroll');
    if (e.key === 'ArrowDown') scrollEl.scrollBy({ top: scrollEl.clientHeight, behavior: 'smooth' });
    if (e.key === 'ArrowUp') scrollEl.scrollBy({ top: -scrollEl.clientHeight, behavior: 'smooth' });
    if (e.key === 'Escape') closeVideoModal();
});

/* ========================================
   شروع
   ======================================== */
window.addEventListener('load', () => {
    renderGrid();
    adjustGridRowHeight();
});
window.addEventListener('resize', adjustGridRowHeight);
</script>
