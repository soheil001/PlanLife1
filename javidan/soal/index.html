<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحلیل مسیر حرفه‌ای | آکادمی حسابداری جاویدان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:    #0F1F3D;
    --blue:    #1A4DB8;
    --blue-mid:#2563EB;
    --sky:     #3B82F6;
    --ice:     #EFF6FF;
    --white:   #FFFFFF;
    --green:   #10B981;
    --orange:  #F59E0B;
    --red:     #EF4444;
    --glass-bg: rgba(255,255,255,0.12);
    --glass-border: rgba(255,255,255,0.22);
    --glass-hover: rgba(255,255,255,0.22);
    --text-dark: #0F1F3D;
    --text-mid: #334155;
    --text-soft: #64748B;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Vazirmatn', sans-serif;
    background: linear-gradient(135deg, #0F1F3D 0%, #1A3A72 40%, #0D2E6B 70%, #0F1F3D 100%);
    min-height: 100vh;
    color: var(--white);
    direction: rtl;
    overflow-x: hidden;
  }

  .bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.18;
    pointer-events: none;
    z-index: 0;
  }
  .orb1 { width: 500px; height: 500px; background: #3B82F6; top: -150px; right: -100px; }
  .orb2 { width: 400px; height: 400px; background: #1D4ED8; bottom: -100px; left: -100px; }
  .orb3 { width: 300px; height: 300px; background: #06B6D4; top: 50%; left: 50%; transform: translate(-50%,-50%); }

  #app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .card {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 28px;
    width: 100%;
    max-width: 620px;
    padding: 40px 36px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.1);
    animation: fadeUp .45s cubic-bezier(.22,.87,.33,1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .brand-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #3B82F6, #1D4ED8);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 4px 14px rgba(59,130,246,0.45);
    flex-shrink: 0;
  }
  .brand-name { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.75); line-height: 1.4; }
  .brand-name span { display: block; color: #fff; font-size: 15px; font-weight: 700; }

  .progress-wrap { margin-bottom: 32px; }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    font-weight: 500;
  }
  .step-label { color: rgba(255,255,255,0.85); font-weight: 600; font-size: 13px; }
  .progress-bar-bg {
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #60A5FA, #3B82F6);
    border-radius: 99px;
    transition: width .6s cubic-bezier(.22,.87,.33,1);
    box-shadow: 0 0 10px rgba(96,165,250,0.6);
  }

  .q-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(59,130,246,0.18);
    border: 1px solid rgba(59,130,246,0.3);
    border-radius: 99px;
    padding: 4px 14px;
    font-size: 11px;
    font-weight: 600;
    color: #93C5FD;
    margin-bottom: 16px;
    letter-spacing: .02em;
  }
  .q-text {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    line-height: 1.55;
    margin-bottom: 28px;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    background: rgba(255,255,255,0.07);
    border: 1.5px solid rgba(255,255,255,0.13);
    border-radius: 16px;
    padding: 16px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: all .22s cubic-bezier(.22,.87,.33,1);
    position: relative;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .option::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(59,130,246,0.18), rgba(29,78,216,0.1));
    opacity: 0;
    transition: opacity .22s;
    border-radius: inherit;
  }
  .option:hover { border-color: rgba(96,165,250,0.5); transform: translateX(-3px); }
  .option:hover::before { opacity: 1; }
  .option:active { transform: scale(0.98); }

  .option.selected {
    border-color: #3B82F6;
    background: rgba(59,130,246,0.18);
    box-shadow: 0 0 0 1px rgba(59,130,246,0.4), 0 8px 24px rgba(59,130,246,0.2);
  }
  .option.selected::before { opacity: 1; }

  .opt-radio {
    width: 22px; height: 22px;
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .option.selected .opt-radio {
    border-color: #3B82F6;
    background: #3B82F6;
  }
  .opt-radio-dot {
    width: 8px; height: 8px;
    background: #fff;
    border-radius: 50%;
    transform: scale(0);
    transition: transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .option.selected .opt-radio-dot { transform: scale(1); }

  .opt-text {
    font-size: 15px;
    font-weight: 500;
    color: rgba(255,255,255,0.88);
    line-height: 1.5;
    flex: 1;
  }
  .option.selected .opt-text { color: #fff; font-weight: 600; }

  .opt-emoji { font-size: 20px; flex-shrink: 0; }

  .btn-primary {
    width: 100%;
    padding: 16px 24px;
    background: linear-gradient(135deg, #3B82F6, #1D4ED8);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 24px;
    box-shadow: 0 8px 28px rgba(59,130,246,0.4);
    transition: all .22s;
    letter-spacing: .01em;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(59,130,246,0.5); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  .btn-ghost {
    background: rgba(255,255,255,0.07);
    border: 1.5px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.7);
    border-radius: 12px;
    padding: 12px 22px;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.12); color: #fff; }

  .start-icon {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, #3B82F6, #1D4ED8);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
    margin-bottom: 24px;
    box-shadow: 0 12px 40px rgba(59,130,246,0.45);
  }
  .start-title {
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    line-height: 1.45;
    margin-bottom: 16px;
  }
  .start-desc {
    font-size: 15px;
    color: rgba(255,255,255,0.65);
    line-height: 1.75;
    margin-bottom: 28px;
  }
  .start-stats {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .stat-chip {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 99px;
    padding: 7px 16px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-chip span { color: #60A5FA; }

  .lead-icon { font-size: 48px; margin-bottom: 16px; }
  .lead-title { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 10px; }
  .lead-desc { font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.7; margin-bottom: 28px; }

  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.75); margin-bottom: 8px; display: block; }
  .form-input {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 14px 16px;
    color: #fff;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 15px;
    outline: none;
    direction: rtl;
    transition: border-color .2s, box-shadow .2s;
  }
  .form-input::placeholder { color: rgba(255,255,255,0.3); }
  .form-input:focus {
    border-color: #3B82F6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
  }
  .privacy-note { font-size: 12px; color: rgba(255,255,255,0.35); text-align: center; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 5px; }

  /* Loading state */
  .btn-loading {
    position: relative;
    color: transparent !important;
    pointer-events: none;
  }
  .btn-loading::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

  /* OTP Screen */
  .otp-icon { font-size: 48px; margin-bottom: 16px; }
  .otp-title { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 10px; }
  .otp-desc { font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.7; margin-bottom: 28px; }
  .otp-phone-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(59,130,246,0.15);
    border: 1px solid rgba(59,130,246,0.3);
    border-radius: 99px;
    padding: 6px 18px;
    font-size: 15px;
    font-weight: 700;
    color: #93C5FD;
    margin-bottom: 24px;
    direction: ltr;
    letter-spacing: 0.05em;
  }
  .otp-inputs {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 24px;
    direction: ltr;
  }
  .otp-box {
    width: 64px;
    height: 72px;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 16px;
    text-align: center;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    caret-color: #3B82F6;
  }
    .otp-box:focus {
    border-color: #3B82F6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.25);
  }
  .otp-box.filled {
    border-color: rgba(96,165,250,0.6);
    background: rgba(59,130,246,0.12);
  }
  .otp-box.error {
    border-color: #EF4444;
    box-shadow: 0 0 0 3px rgba(239,68,68,0.2);
    animation: shake .3s;
  }
  .otp-resend {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    text-align: center;
    margin-bottom: 8px;
  }
  .otp-resend button {
    background: none;
    border: none;
    color: #60A5FA;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
  }
  .otp-error-msg {
    background: rgba(239,68,68,0.12);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    color: #FCA5A5;
    text-align: center;
    margin-bottom: 16px;
    display: none;
  }

  .result-header {
    background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(29,78,216,0.15));
    border: 1px solid rgba(59,130,246,0.3);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 20px;
    text-align: center;
  }
  .result-emoji { font-size: 48px; margin-bottom: 10px; }
  .result-level-label { font-size: 12px; color: #93C5FD; font-weight: 600; margin-bottom: 4px; letter-spacing: .05em; text-transform: uppercase; }
  .result-level { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 8px; }
  .result-desc { font-size: 14px; color: rgba(255,255,255,0.65); line-height: 1.7; }

  .score-wrap {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-label { font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 10px; font-weight: 600; }
  .score-number { font-size: 48px; font-weight: 800; color: #60A5FA; line-height: 1; }
  .score-max { font-size: 16px; color: rgba(255,255,255,0.3); }
  .score-bar-bg { height: 8px; background: rgba(255,255,255,0.08); border-radius: 99px; margin-top: 14px; overflow: hidden; }
  .score-bar-fill { height: 100%; border-radius: 99px; transition: width 1.2s cubic-bezier(.22,.87,.33,1); }

  .insights { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .insight-card {
    flex: 1;
    min-width: 130px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 14px;
  }
  .insight-label { font-size: 11px; color: rgba(255,255,255,0.4); font-weight: 600; margin-bottom: 6px; }
  .insight-value { font-size: 14px; font-weight: 700; color: #fff; line-height: 1.4; }
  .insight-icon { font-size: 20px; margin-bottom: 6px; }

  .lead-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border-radius: 99px;
    padding: 6px 18px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 20px;
  }
  .lead-hot { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #FCA5A5; }
  .lead-warm { background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.3); color: #FCD34D; }
  .lead-cold { background: rgba(96,165,250,0.15); border: 1px solid rgba(96,165,250,0.3); color: #93C5FD; }

  .course-card {
    background: linear-gradient(135deg, rgba(16,185,129,0.12), rgba(5,150,105,0.08));
    border: 1.5px solid rgba(16,185,129,0.3);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .course-label { font-size: 11px; color: #6EE7B7; font-weight: 700; letter-spacing: .05em; margin-bottom: 8px; }
  .course-name { font-size: 17px; font-weight: 800; color: #fff; margin-bottom: 6px; }
  .course-desc { font-size: 13px; color: rgba(255,255,255,0.55); line-height: 1.6; }

  .cta-buttons { display: flex; flex-direction: column; gap: 10px; }
  .btn-cta-main {
    width: 100%;
    padding: 16px 24px;
    background: linear-gradient(135deg, #10B981, #059669);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(16,185,129,0.35);
    transition: all .22s;
  }
  .btn-cta-main:hover { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(16,185,129,0.45); }

  .btn-cta-sec {
    width: 100%;
    padding: 14px 24px;
    background: rgba(255,255,255,0.07);
    border: 1.5px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.8);
    border-radius: 14px;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all .22s;
  }
  .btn-cta-sec:hover { background: rgba(255,255,255,0.12); color: #fff; }

  /* نتایج بچه‌های دوره - دکمه */
  .btn-testimonials {
    width: 100%;
    padding: 15px 24px;
    background: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(217,119,6,0.15));
    border: 1.5px solid rgba(245,158,11,0.4);
    color: #FCD34D;
    border-radius: 14px;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all .22s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .btn-testimonials:hover {
    background: linear-gradient(135deg, rgba(245,158,11,0.3), rgba(217,119,6,0.22));
    border-color: rgba(245,158,11,0.6);
    transform: translateY(-2px);
  }

  .path-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .path-chip {
    background: rgba(59,130,246,0.1);
    border: 1px solid rgba(59,130,246,0.2);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 13px;
    color: #93C5FD;
    font-weight: 600;
  }
  .path-arrow { color: rgba(255,255,255,0.25); font-size: 13px; display: flex; align-items: center; }

  .slide-exit { animation: slideExit .25s ease forwards; }
  .slide-enter { animation: slideEnter .35s cubic-bezier(.22,.87,.33,1) forwards; }
  @keyframes slideExit {
    to { opacity: 0; transform: translateX(30px); }
  }
  @keyframes slideEnter {
    from { opacity: 0; transform: translateX(-30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* ─── VIDEO MODAL ─── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 12, 30, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px 16px 32px;
    overflow-y: auto;
    animation: fadeIn .3s ease;
  }
    @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .modal-inner {
    width: 100%;
    max-width: 680px;
    animation: slideUp .35s cubic-bezier(.22,.87,.33,1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(32px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .modal-title {
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .modal-close {
    width: 40px; height: 40px;
    background: rgba(255,255,255,0.1);
    border: 1.5px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: rgba(255,255,255,0.8);
    font-size: 18px;
    font-weight: 700;
    transition: all .2s;
    flex-shrink: 0;
  }
  .modal-close:hover {
    background: rgba(239,68,68,0.2);
    border-color: rgba(239,68,68,0.4);
    color: #FCA5A5;
  }
  .modal-subtitle {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    margin-bottom: 24px;
  }

  /* Current playing video */
  .video-main-wrap {
    background: #000;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 16px;
    border: 1.5px solid rgba(255,255,255,0.1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .video-main-wrap video {
    width: 100%;
    display: block;
    max-height: 380px;
    object-fit: contain;
    background: #000;
  }
  .video-info-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: rgba(255,255,255,0.04);
    border-top: 1px solid rgba(255,255,255,0.06);
  }

function buildQuestions() {
  const path = state.path;
  let qs = [Q_LEVEL];
  if (path === 'A') qs = qs.concat(PATH_A);
  else if (path === 'B') qs = qs.concat(PATH_B);
  else if (path === 'C') qs = qs.concat(PATH_C);
  qs.push(Q_READINESS);
  return qs;
}

function getPath(levelAns) {
  if (levelAns === 'a' || levelAns === 'b') return 'A';
  if (levelAns === 'c') return 'B';
  return 'C';
}

// ═══════════════════════════════════════════════
//  SCORING
// ═══════════════════════════════════════════════
function calcScores() {
  const questions = buildQuestions();
  let total = 0, maxTotal = 0, leadScore = 0;

  questions.forEach(q => {
    const ans = state.answers[q.id];
    const maxOpt = Math.max(...q.options.map(o => o.score));
    maxTotal += maxOpt;
    if (ans) {
      const opt = q.options.find(o => o.id === ans);
      if (opt) {
        total += opt.score;
        if (q.id === 'readiness') {
          if (ans === 'a') leadScore += 40;
          else if (ans === 'b') leadScore += 30;
          else if (ans === 'c') leadScore += 18;
          else if (ans === 'd') leadScore += 8;
          else leadScore += 2;
        }
        if (q.id.includes('income_goal') || q.id.includes('goal_income')) leadScore += 12;
        if (q.id.includes('time') && (ans === 'c' || ans === 'd')) leadScore += 10;
      }
    }
  });

  state.score     = Math.round((total / maxTotal) * 100);
  state.leadScore = Math.min(100, leadScore);
  state.leadType  = state.leadScore >= 60 ? 'HOT' : state.leadScore >= 30 ? 'WARM' : 'COLD';
}
function getReadinessGroup(score) {
  if (score <= 39) return { label:'نیازمند شروع از پایه', color:'#F87171' };
  if (score <= 59) return { label:'در مسیر یادگیری', color:'#FBBF24' };
  if (score <= 79) return { label:'آماده ورود جدی به بازار کار', color:'#60A5FA' };
  return { label:'آماده رشد حرفه‌ای', color:'#34D399' };
}

function buildQAText() {
  const questions = buildQuestions();
  const lines = [];
  questions.forEach(q => {
    const ansId = state.answers[q.id];
    if (!ansId) return;
    const opt = q.options.find(o => o.id === ansId);
    if (!opt) return;
    lines.push({ question: q.text, answer: opt.text });
  });
  return lines;
}

  let levelEmoji, levelLabel, levelDesc, strength, challenge, roadmap, course;

  if (path === 'A') {
    levelEmoji = '🌱'; levelLabel = 'مبتدی';
    levelDesc = 'تو هنوز در ابتدای مسیر هستی، اما انگیزه‌ات برای ورود به دنیای حسابداری واقعی است.';
    strength = 'انگیزه برای شروع و ذهن باز برای یادگیری';
    challenge = 'نداشتن مسیر مشخص و تجربه عملی';
    roadmap = ['مفاهیم پایه', 'نرم‌افزارهای حسابداری', 'تمرین عملی', 'ورود به بازار کار'];
    course = { label:'دوره پیشنهادی برای تو', name:'دوره جامع حسابداری از صفر تا بازار کار', desc:'مناسب برای شروع کامل از پایه تا استخدام در بازار کار' };
  } else if (path === 'B') {
    levelEmoji = '📋'; levelLabel = 'نیمه‌حرفه‌ای';
    levelDesc = 'دانش پایه را داری، اما فاصله‌ای بین تئوری و عمل وجود دارد که باید پر شود.';
    strength = 'دانش تئوری و آشنایی با مفاهیم پایه';
    challenge = 'ضعف در مهارت‌های عملی و اعتمادبه‌نفس حرفه‌ای';
    roadmap = ['تقویت نقاط ضعف', 'مهارت‌های عملی', 'پروژه‌های واقعی', 'ورود حرفه‌ای'];
    course = { label:'دوره پیشنهادی برای تو', name:'دوره حسابداری عملی و ورود به بازار کار', desc:'تمرکز روی مهارت‌های عملی، نرم‌افزار و اعتمادبه‌نفس حرفه‌ای' };
  } else {
    levelEmoji = '🏆'; levelLabel = 'حرفه‌ای';
    levelDesc = 'با تجربه و مهارت خوب، چالش اصلی‌ات افزایش ارزش و جایگاه حرفه‌ای‌ات است.';
    strength = 'تجربه عملی و دانش کاربردی';
    challenge = 'رشد به سطح بالاتر و افزایش درآمد متناسب با توانایی';
    roadmap = ['تخصص بیشتر', 'مهارت‌های تکمیلی', 'پروژه‌های تخصصی', 'جایگاه حرفه‌ای بالاتر'];
    course = { label:'دوره پیشنهادی برای تو', name:'دوره تخصصی ارتقای مهارت حسابداران حرفه‌ای', desc:'طراحی شده برای حسابداران با تجربه که دنبال رشد بیشتر هستند' };
  }

  const specialty = state.answers['c_specialty'];
  if (specialty === 'a') course.name = 'دوره تخصصی مالیات و امور مالیاتی';
  const careerGoal = state.answers['c_career_goal'];
  if (careerGoal === 'e') course.name = 'دوره تخصصی مالیات پیشرفته';

  return { levelEmoji, levelLabel, levelDesc, strength, challenge, roadmap, course };
}

    leadScore: state.leadScore,

  try {

      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(payload),

    const data = await res.json();
    console.log('ایمیل:', data);
  } catch (err) {
    console.error('خطا در ارسال ایمیل:', err);
  }
}

        style="margin-top:0;${!selectedAns ? 'opacity:.45;cursor:not-allowed' : ''}"
        onclick="nextQ()" ${!selectedAns ? 'disabled' : ''}>
        ${state.currentQ === totalQ - 1 ? 'دریافت نتیجه ✓' : 'سؤال بعدی ←'}

function selectOption(qId, optId, el) {
  document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  state.answers[qId] = optId;

  if (qId === 'level') {
    state.path = getPath(optId);
    questions = buildQuestions();
  }

  const btn = document.getElementById('next-btn');
  if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.style.cursor = 'pointer'; }

  setTimeout(() => { if (state.screen === 'quiz') nextQ(); }, 500);
}

function nextQ() {
  const q = questions[state.currentQ];
  if (!state.answers[q.id]) return;
  if (state.currentQ < questions.length - 1) {
    state.currentQ++;
    transition(renderQuiz);
  } else {
    state.screen = 'lead';
    transition(renderLead);
  }
}

function prevQ() {
  if (state.currentQ > 0) {
    state.currentQ--;
    transition(renderQuiz);
  }
}

function setupOTPInputs() {
  const inputs = [0,1,2,3].map(i => document.getElementById('otp-' + i));

  inputs.forEach((inp, idx) => {
    inp.addEventListener('input', (e) => {
      // accept only digits
      inp.value = inp.value.replace(/\D/g, '').slice(0,1);
      inp.classList.toggle('filled', inp.value !== '');

      if (inp.value && idx < 3) inputs[idx + 1].focus();
      checkAllFilled(inputs);
    });

    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !inp.value && idx > 0) {
        inputs[idx - 1].focus();
        inputs[idx - 1].value = '';
        inputs[idx - 1].classList.remove('filled');
        checkAllFilled(inputs);
      }
    });

    inp.addEventListener('paste', (e) => {
      e.preventDefault();
      const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g,'').slice(0,4);
      paste.split('').forEach((ch, i) => {
        if (inputs[i]) { inputs[i].value = ch; inputs[i].classList.add('filled'); }
      });
      if (paste.length >= 4) inputs[3].focus();
      checkAllFilled(inputs);
    });
  });

  setTimeout(() => inputs[0].focus(), 100);
}

function checkAllFilled(inputs) {
  const allFilled = inputs.every(i => i.value.length === 1);
  const btn = document.getElementById('otp-btn');
  if (btn) {
    btn.disabled = !allFilled;
    btn.style.opacity = allFilled ? '1' : '.45';
    btn.style.cursor = allFilled ? 'pointer' : 'not-allowed';
  }
  if (allFilled) {
    // auto-submit after short delay
    setTimeout(() => { if (document.getElementById('otp-btn')) verifyOTP(); }, 300);
  }
}

async function verifyOTP() {
  const inputs = [0,1,2,3].map(i => document.getElementById('otp-' + i));
  if (!inputs[0]) return;
  const code = inputs.map(i => i.value).join('');
  if (code.length < 4) return;

  const btn = document.getElementById('otp-btn');
  btn.classList.add('btn-loading');
  btn.disabled = true;

  await new Promise(r => setTimeout(r, 600));

  // ─── فعلاً هر کدی قبوله ───
  const isValid = true; // TODO: validate against sent code via server

  if (isValid) {
    calcScores();
    sendEmail(); // ارسال ایمیل بعد از تأیید
    state.screen = 'result';
    transition(renderResult);
  } else {
    btn.classList.remove('btn-loading');
    btn.disabled = false;
    inputs.forEach(i => { i.classList.add('error'); setTimeout(()=> i.classList.remove('error'), 600); });
    const errEl = document.getElementById('otp-error');
    if (errEl) { errEl.style.display = 'block'; }
  }
}

function animateCounter(el, from, to, duration) {
  const start = performance.now();
  function frame(now) {
    const elapsed  = now - start;
    const progress = Math.min(elapsed / duration, 1);
    const eased    = 1 - Math.pow(1 - progress, 3);
    el.textContent = toPersianNum(Math.round(from + (to - from) * eased));
    if (progress < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

  const grid = document.getElementById('videos-grid');
  grid.innerHTML = '';
  for (let i = 1; i <= TOTAL_VIDEOS; i++) {
    const div = document.createElement('div');
    div.className = 'video-thumb';
    div.id = 'thumb-' + (i-1);
    div.onclick = () => changeVideo(i-1);
    div.innerHTML = `
      <div class="video-thumb-inner">
        <div class="video-thumb-content">
          <div class="video-thumb-num">${toPersianNum(i)}</div>
          <div class="video-thumb-play">▶️</div>
          <div class="video-thumb-label">ویدیو</div>
        </div>
      </div>
    `;
    grid.appendChild(div);
  }
}

function changeVideo(index) {
  if (index < 0 || index >= TOTAL_VIDEOS) return;
  currentVideoIndex = index;

  // Update main video
  const src = document.getElementById('main-video-src');
  const vid  = document.getElementById('main-video');
  if (src && vid) {
    src.src = VIDEO_BASE + (index + 1) + '.mp4';
    vid.load();
    vid.play().catch(() => {});
  }

  // Update label
  const label = document.getElementById('video-label');
  if (label) label.textContent = 'ویدیو ' + toPersianNum(index + 1) + ' از ' + toPersianNum(TOTAL_VIDEOS);

  // Update thumbnails
  document.querySelectorAll('.video-thumb').forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });

  // Update nav buttons
  const prev = document.getElementById('vid-prev');
  const next = document.getElementById('vid-next');
  if (prev) prev.disabled = index === 0;
  if (next) next.disabled = index === TOTAL_VIDEOS - 1;

  // Scroll thumb into view
  const activeThumb = document.getElementById('thumb-' + index);
  if (activeThumb) activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
}

// Close modal on overlay click (but not inner click)
document.getElementById('video-modal').addEventListener('click', function(e) {
  if (e.target === this) closeVideoModal();
});

// Close on ESC
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeVideoModal();
});

// ═══════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════
function toPersianNum(n) {
  return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}

function startQuiz() {
  state.screen = 'quiz';
  state.currentQ = 0;
  state.path = null;
  questions = [Q_LEVEL, Q_READINESS];
  transition(renderQuiz);
}

function restartQuiz() {
  Object.assign(state, {
    screen:'start', path:null, currentQ:0,
    answers:{}, name:'', phone:'',
    score:0, leadScore:0, leadType:'', otpSent:false,
  });
  transition(renderStart);
}

// ─── INIT ───
renderStart();

const style = document.createElement('style');
style.textContent = `@keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }`;
document.head.appendChild(style);
</script>
