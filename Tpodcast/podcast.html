.sl{left:30%;top:82.8%;width:40.5%;height:5.4%;opacity:0;cursor:pointer;margin:0}
.hn{left:42%;top:82.2%;width:6.9%;height:6.9%;pointer-events:none;border-radius:3px;border:1px solid #555;background:linear-gradient(90deg,#2a2a27,#4a4a45 45%,#151513);box-shadow:0 3px 6px #000}
.hn:after{content:"";position:absolute;left:46%;top:18%;width:8%;height:64%;background:#ff7a1a;border-radius:2px;box-shadow:0 0 5px #ff7a1a}
</style>
</head>
<body>
<h1>پخش‌کننده ترمینال ذهن</h1>
<div class="sub">هر ردیف ۵ پخش‌کننده دارد؛ برای دیدن بقیه، ردیف را به چپ و راست بکشید</div>
<div class="row-t">ردیف اول · موزیک ۱ تا ۵</div><div class="row" id="r1"></div>
<div class="row-t">ردیف دوم · موزیک ۶ تا ۱۰</div><div class="row" id="r2"></div>
<script>
// ← لینک و عنوان ۱۰ موزیک را اینجا تغییر دهید
const U="http://fs3.centraldnserver.com/~planlife/english/podcasts/American_English_File/Dars1/SB1_cd01track02.mp3";
const TR=[
["موزیک ۱",U],["موزیک ۲",U],["موزیک ۳",U],["موزیک ۴",U],["موزیک ۵",U],
["موزیک ۶",U],["موزیک ۷",U],["موزیک ۸",U],["موزیک ۹",U],["موزیک ۱۰",U]];
const LINES=[
'> mind.boot("{t}")',
'> scanning subconscious... [OK]',
'const beliefs = mind.load("باورها");',
'if (belief == "من کافی نیستم") {',
'  belief.delete(); // حذف باور محدودکننده',
'}',
'beliefs.push("من شایسته و توانمندم");',
'mind.rewrite(thoughts, {repeat: 21});',
'while (focus) { gratitude++; }',
'habit.install("آرامش و تمرکز");',
'reality = reprogram(intention);',
'> ذهن شما بازنویسی شد. [DONE]'];
let vol=.7;const P=[];
const fmt=s=>isFinite(s)?String(Math.floor(s/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0"):"--:--";
function make(i,host){
 const [title,url]=TR[i];
 const d=document.createElement("div");d.className="p";
 d.innerHTML=`<div class="scr"><div class="eq">${"<i></i>".repeat(24)}</div>
 <div class="inf"><b>${i+1}. ${title}</b><span class="tm">00:00/--:--</span></div><div class="term"></div></div>
 <div class="led"></div>
 <button class="hs hd" aria-label="توقف"></button><button class="hs rw" aria-label="۱۰ ثانیه عقب"></button>
 <button class="hs pl" aria-label="پخش / توقف موقت"></button><button class="hs fw" aria-label="۱۰ ثانیه جلو"></button>
 <button class="hs vd" aria-label="کم کردن صدا"></button><button class="hs vu" aria-label="زیاد کردن صدا"></button>
 <div class="hn"></div><input class="sl" type="range" min="0" max="1000" value="0" aria-label="پیشرفت">`;
 host.appendChild(d);
 const a=new Audio();a.preload="none";a.src=url;a.volume=vol;
 const q=s=>d.querySelector(s),term=q(".term"),bars=[...d.querySelectorAll(".eq i")],tm=q(".tm"),sl=q(".sl"),hn=q(".hn");
 const o={a,d,li:0,ci:0,cur:null,timer:null,anim:null,flash:null};
 const setHn=f=>hn.style.left=(34+f*32-3.45)+"%";setHn(0);setHn(0);
 const upd=()=>{tm.textContent=fmt(a.currentTime)+"/"+fmt(a.duration);if(a.duration){const f=a.currentTime/a.duration;sl.value=f*1000;setHn(f)}};
 function typeTick(){
  if(o.li>=LINES.length){clearInterval(o.timer);o.timer=null;return}
  if(!o.cur){o.cur=document.createElement("div");o.cur.className="cur";term.appendChild(o.cur)}
  const L=LINES[o.li].replace("{t}",title);
  o.cur.textContent=L.slice(0,++o.ci);
  if(o.ci>=L.length){o.cur.classList.remove("cur");o.cur=null;o.li++;o.ci=0;if(o.li>=LINES.length){clearInterval(o.timer);o.timer=null;const e=document.createElement("div");e.className="cur";term.appendChild(e)}}
  term.scrollTop=term.scrollHeight}
 function bar(on){bars.forEach((b,k)=>{b.style.height=on?(8+Math.abs(Math.sin(Date.now()/260+k*.55))*55+Math.random()*35)+"%":"5%"})}
 o.start=()=>{o.timer||o.li>=LINES.length||(o.timer=setInterval(typeTick,45));o.anim||(o.anim=setInterval(()=>bar(true),100));d.classList.add("on")};
 o.stop=()=>{clearInterval(o.timer);o.timer=null;clearInterval(o.anim);o.anim=null;bar(false);d.classList.remove("on")};
 o.reset=()=>{o.stop();a.pause();a.currentTime=0;term.innerHTML="";o.li=o.ci=0;o.cur=null;upd()};
 o.toggle=()=>{if(a.paused){P.forEach(p=>p!==o&&!p.a.paused&&p.stop()||p!==o&&p.a.pause());a.play().catch(()=>{});o.start()}else{a.pause();o.stop()}};
 o.msg=t=>{const b=q(".inf b");b.textContent=t;clearTimeout(o.flash);o.flash=setTimeout(()=>b.textContent=(i+1)+". "+title,900)};
 q(".pl").onclick=o.toggle;
 q(".hd").onclick=o.reset;
 q(".rw").onclick=()=>{a.currentTime=Math.max(0,a.currentTime-10);upd()};
 q(".fw").onclick=()=>{a.currentTime=Math.min(a.duration||1e9,a.currentTime+10);upd()};
 q(".vd").onclick=()=>setVol(vol-.1);q(".vu").onclick=()=>setVol(vol+.1);
 sl.oninput=()=>{if(a.duration)a.currentTime=sl.value/1000*a.duration;upd()};
 a.ontimeupdate=upd;a.onloadedmetadata=upd;
 a.onended=()=>{o.stop();a.currentTime=0;upd()};
 a.onerror=()=>{o.stop();o.msg("خطا در بارگذاری فایل")};
 P.push(o);
}
function setVol(v){vol=Math.min(1,Math.max(0,Math.round(v*10)/10));P.forEach(p=>{p.a.volume=vol;p.msg("VOL "+Math.round(vol*100)+"%")})}
for(let i=0;i<10;i++)make(i,document.getElementById(i<5?"r1":"r2"));
</script>
</body>
</html>
